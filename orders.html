// 입고일 목록 + 선택일 발주서 — 일반 발주(extra=false) / 추가 발주(extra=true) 따로 관리
function useOrderData(adminHash,extra,onErr){
  const[dates,setDates]=useState([]);
  const[selDate,setSelDate]=useState("");
  const[orders,setOrders]=useState([]);
  const[loadingOrders,setLoadingOrders]=useState(false);
  // setup_orders_extra.sql 실행 전이면 p_extra 없이 호출(일반 발주만) / 추가 발주는 빈 목록
  const call=async(name,args)=>{
    try{return await rpc(name,{...args,p_extra:extra})}
    catch(e){
      if(!/function|PGRST202|schema cache/i.test(String(e?.message||e)))throw e;
      return extra?[]:await rpc(name,args);
    }
  };
  const reloadDates=useCallback(async()=>{
    try{
      const d=await call("ol_list_due_dates",{p_admin_hash:adminHash});
      const list=Array.isArray(d)?d.map(x=>({...x,due_date:String(x.due_date).slice(0,10)})):[];
      setDates(list);
      return list;
    }catch(e){onErr(errMsg(e));return []}
  },[adminHash,extra]);
  const reloadOrders=useCallback(async date=>{
    if(!date){setOrders([]);return}
    setLoadingOrders(true);
    try{
      const d=await call("ol_list_orders",{p_admin_hash:adminHash,p_from:date,p_to:date});
      setOrders((Array.isArray(d)?d:[]).map(o=>({...o,due_date:String(o.due_date).slice(0,10)})));
    }catch(e){setOrders([]);onErr(errMsg(e))}
    setLoadingOrders(false);
  },[adminHash,extra]);
  // 초기 로드: 오늘 이후 가장 가까운 입고일, 없으면 최신
  useEffect(()=>{
    (async()=>{
      const list=await reloadDates();
      if(!list.length)return;
      const today=todayYmd();
      const upcoming=list.filter(d=>d.due_date>=today).sort((a,b)=>a.due_date<b.due_date?-1:1)[0];
      setSelDate((upcoming||list[0]).due_date);
    })();
  },[reloadDates]);
  useEffect(()=>{reloadOrders(selDate)},[selDate,reloadOrders]);
  return{dates,reloadDates,selDate,setSelDate,orders,reloadOrders,loadingOrders};
}

// ═══════════════════════════════════════════
// ❄ 냉동재고 탭 — 로트(제품 + 소비기한 + 위치)별 수량 관리
// ═══════════════════════════════════════════
const FZ_SOON=30, FZ_WARN=90;
const FZ_STATUS={
  expired:{label:"기한 지남",color:"#ef4444",bg:"rgba(239,68,68,.12)"},
  soon:{label:`${FZ_SOON}일 이내`,color:"#f97316",bg:"rgba(249,115,22,.12)"},
  warn:{label:`${FZ_WARN}일 이내`,color:"#ca8a04",bg:"rgba(234,179,8,.14)"},
  ok:{label:"여유",color:"#16a34a",bg:"rgba(34,197,94,.12)"},
  none:{label:"기한 없음",color:"var(--muted)",bg:"var(--card-bg)"},
};
const FZ_KIND={in:["입고","#16a34a"],out:["출고","#ef4444"],adjust:["수정","#8b5cf6"],move:["이동","#0891b2"],delete:["삭제","#64748b"]};
const NO_LOC="위치 미지정";
function fzDays(exp){if(!exp)return null;return Math.round((parseYmd(exp)-parseYmd(todayYmd()))/86400000)}
function fzStatus(exp){const d=fzDays(exp);if(d==null)return "none";if(d<0)return "expired";if(d<=FZ_SOON)return "soon";if(d<=FZ_WARN)return "warn";return "ok"}
function fzDText(exp){const d=fzDays(exp);if(d==null)return "";return d===0?"D-day":d>0?`D-${d}`:`D+${-d}`}
function fzExpText(exp){return exp?String(exp).slice(0,10).replace(/-/g,"."):"–"}
const fzLoc=l=>(l.location||"").trim()||NO_LOC;
const fzKey=l=>(l.product_code||"").trim()||"name:"+l.product_name;
const locCmp=(a,b)=>a===NO_LOC?1:b===NO_LOC?-1:a.localeCompare(b,"ko",{numeric:true});
const fzExpCmp=(a,b)=>String(a.expiry||"9999").localeCompare(String(b.expiry||"9999"));
// disp_name: 제품리스트에 연결된 제품은 "출고장용 이름(없으면 제품명) / 입수ea", 아니면 저장된 이름
const fzName=l=>l.disp_name||l.product_name;
const fzNameCmp=(a,b)=>fzName(a).localeCompare(fzName(b),"ko",{numeric:true});
function fzErr(e){
  const s=String(e?.message||e||"");
  if(s.includes("ol_frozen")||s.includes("Could not find the function")||s.includes("PGRST202")||s.includes("PGRST205"))return "Supabase SQL Editor에서 setup_orders_frozen.sql 을 1회 실행해 주세요.";
  if(s.includes("not_enough_stock"))return "현재 수량보다 많이 출고할 수 없습니다.";
  if(s.includes("name_required"))return "제품명을 입력하세요.";
  if(s.includes("qty_required"))return "수량을 입력하세요.";
  if(s.includes("lot_not_found"))return "이미 삭제된 재고입니다. 새로고침해 주세요.";
  return errMsg(e);
}
function fzQty(n,unit){return <>{fmtNum(n)}<span style={{fontSize:"0.75em",fontWeight:500,color:"var(--muted)",marginLeft:2}}>{unit||"박스"}</span></>}
function fzUnitSum(lots){
  const m=new Map();for(const l of lots){const u=l.unit||"박스";m.set(u,(m.get(u)||0)+Number(l.qty||0))}
  return [...m.entries()];
}

function ExpiryBadge({exp}){
  const st=FZ_STATUS[fzStatus(exp)];
  return <span style={{display:"inline-flex",alignItems:"center",gap:6,whiteSpace:"nowrap"}}>
    <span style={{fontVariantNumeric:"tabular-nums",fontWeight:600}}>{fzExpText(exp)}</span>
    {exp&&<span className="fz-badge" style={{color:st.color,background:st.bg}}>{fzDText(exp)}</span>}
  </span>;
}

function FrozenLotForm({adminHash,masters,initial,locations,lots,onSaved,onCancel}){
  const isEdit=!!initial?.id;
  const products=useMemo(()=>[...masters.products].sort((a,b)=>(storageOf(a)==="frozen"?0:1)-(storageOf(b)==="frozen"?0:1)||a.name.localeCompare(b.name,"ko",{numeric:true})),[masters.products]);
  const label=p=>`${shipNameOf(p)} (${p.code})`;
  const[prodText,setProdText]=useState(()=>{
    if(!initial?.product_name)return "";
    const p=masters.products.find(x=>x.code===initial.product_code);
    return p?label(p):initial.product_name;
  });
  const matched=useMemo(()=>{const t=prodText.trim();return products.find(p=>label(p)===t||p.code===t)||null},[products,prodText]);
  const[qty,setQty]=useState(initial?.qty!=null?String(initial.qty):"");
  const[unit,setUnit]=useState(initial?.unit||"박스");
  const[expiry,setExpiry]=useState(initial?.expiry?String(initial.expiry).slice(0,10):"");
  const[location,setLocation]=useState(initial?.location||"");
  const[inDate,setInDate]=useState(initial?.in_date?String(initial.in_date).slice(0,10):todayYmd());
  const[memo,setMemo]=useState(initial?.memo||"");
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState("");
  // 고른 제품의 기존 재고 소비기한 (빠른 날짜순, 수정 중인 로트는 제외)
  const expOpts=useMemo(()=>{
    const name=matched?null:prodText.trim();
    if(!matched&&!name)return [];
    const m=new Map();
    for(const l of lots||[]){
      if(initial?.id&&l.id===initial.id)continue;
      const d=l.expiry?String(l.expiry).slice(0,10):"";
      if(!d)continue;
      if(matched?l.product_code!==matched.code:(l.product_code||l.product_name!==name))continue;
      if(!m.has(d))m.set(d,{d,qty:0,unit:l.unit||"박스",locs:[],here:false});
      const o=m.get(d);o.qty+=Number(l.qty||0);
      const lc=(l.location||"").trim();
      if(lc&&!o.locs.includes(lc))o.locs.push(lc);
      if(lc&&lc===location.trim())o.here=true;
    }
    return [...m.values()].sort((a,b)=>a.d.localeCompare(b.d));
  },[lots,matched,prodText,location,initial]);
  const save=async()=>{
    const name=matched?matched.name:prodText.trim();
    const q=Number(qty);
    if(!name){setErr("제품을 선택하거나 제품명을 입력하세요.");return}
    if(!(q>0)&&!(isEdit&&qty!==""&&q===0)){setErr("수량을 입력하세요.");return}
    setBusy(true);setErr("");
    try{
      const code=matched?matched.code:(isEdit&&initial.product_name===name?initial.product_code||"":"");
      await rpc("ol_upsert_frozen_lot",{p_admin_hash:adminHash,p_id:initial?.id||null,p_product_code:code,
        p_product_name:name,p_qty:q,p_unit:unit,p_expiry:expiry||null,p_location:location,p_in_date:inDate||null,p_memo:memo});
      onSaved();
    }catch(e){setErr(fzErr(e));setBusy(false)}
  };
  return <>
    <h3 style={{margin:"0 0 16px",fontSize:17}}>{isEdit?"✏ 재고 수정":"❄ 냉동 입고 등록"}</h3>
    <div className="ol-label">제품 *</div>
    <input className="ol-input" list="fz-products" value={prodText} onChange={e=>setProdText(e.target.value)} placeholder="제품명·코드 검색 (목록에 없으면 이름 직접 입력)" autoFocus={!isEdit}/>
    <datalist id="fz-products">{products.map(p=><option key={p.id} value={label(p)}>{storageOf(p)==="frozen"?"❄ 냉동":"냉장"}</option>)}</datalist>
    <div style={{fontSize:11,margin:"4px 0 12px",color:matched?"#0891b2":"var(--muted)"}}>
      {matched?<>✓ 제품리스트 연결 · 코드 {matched.code} · 입수 {matched.per_box}{storageOf(matched)!=="frozen"&&<span style={{color:"#f59e0b"}}> · 냉장 제품</span>}</>:prodText.trim()?"제품리스트에 없는 이름으로 저장됩니다":" "}
    </div>
    <div className="ol-grid">
      <div><div className="ol-label">수량 *</div>
        <div style={{display:"flex",gap:6}}>
          <input className="ol-input" type="number" min="0" step="any" value={qty} onChange={e=>setQty(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")save()}}/>
          <select className="ol-input" style={{width:78,flexShrink:0}} value={unit} onChange={e=>setUnit(e.target.value)}>{["박스","팩","kg","개"].map(u=><option key={u}>{u}</option>)}</select>
        </div></div>
      <div><div className="ol-label">소비기한</div><input className="ol-input" type="date" value={expiry} onChange={e=>setExpiry(e.target.value)}/></div>
      <div><div className="ol-label">위치</div>
        <input className="ol-input" list="fz-locations" value={location} onChange={e=>setLocation(e.target.value)} placeholder="예: 냉동창고 A-3"/>
        <datalist id="fz-locations">{locations.map(l=><option key={l} value={l}/>)}</datalist></div>
      <div><div className="ol-label">입고일</div><input className="ol-input" type="date" value={inDate} onChange={e=>setInDate(e.target.value)}/></div>
    </div>
    {expOpts.length>0&&<div style={{margin:"-4px 0 12px"}}>
      <div style={{fontSize:11,color:"var(--muted)",marginBottom:5}}>이 제품 재고에 있는 소비기한 (누르면 선택)</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
        {expOpts.map(o=><button key={o.d} type="button" className={"ol-btn ol-btn-sm "+(expiry===o.d?"ol-btn-primary":"ol-btn-secondary")}
          title={o.locs.join(", ")} onClick={()=>setExpiry(expiry===o.d?"":o.d)}>
          {o.d.replace(/-/g,".")} <span style={{opacity:.75,fontWeight:400}}>· {o.qty}{o.unit}{o.here?" · 이 위치":""}</span></button>)}
      </div></div>}
    <div className="ol-label">메모</div>
    <input className="ol-input" value={memo} onChange={e=>setMemo(e.target.value)} placeholder="선택"/>
    {!isEdit&&<div style={{fontSize:11,color:"var(--muted)",marginTop:8}}>같은 제품·소비기한·위치 재고가 이미 있으면 수량이 합쳐집니다</div>}
    {err&&<div className="ol-err">{err}</div>}
    <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:18}}>
      <button className="ol-btn ol-btn-secondary" onClick={onCancel}>취소</button>
      <button className="ol-btn ol-btn-primary" disabled={busy} onClick={save}>{busy?"저장 중…":"저장"}</button>
    </div>
  </>;
}

function FrozenActionForm({adminHash,type,lot,locations,onDone,onCancel}){
  const cur=Number(lot.qty||0);
  const unit=lot.unit||"박스";
  const[qty,setQty]=useState(type==="move"?String(cur):"");
  const[memo,setMemo]=useState("");
  const[loc,setLoc]=useState("");
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState("");
  const q=Number(qty)||0;
  const after=type==="in"?cur+q:type==="out"?cur-q:cur;
  const title={in:"입고",out:"출고",move:"위치 이동"}[type];
  const submit=async()=>{
    if(!(q>0)){setErr("수량을 입력하세요.");return}
    if(type==="out"&&q>cur){setErr("현재 수량보다 많이 출고할 수 없습니다.");return}
    if(type==="move"&&loc.trim()===(lot.location||"").trim()){setErr("다른 위치를 입력하세요.");return}
    setBusy(true);setErr("");
    try{
      if(type==="move")await rpc("ol_frozen_relocate",{p_admin_hash:adminHash,p_id:lot.id,p_qty:Math.min(q,cur),p_location:loc});
      else await rpc("ol_frozen_change_qty",{p_admin_hash:adminHash,p_id:lot.id,p_delta:type==="in"?q:-q,p_memo:memo});
      onDone();
    }catch(e){setErr(fzErr(e));setBusy(false)}
  };
  return <>
    <h3 style={{margin:"0 0 14px",fontSize:17}}>{{in:"＋ ",out:"－ ",move:"⇄ "}[type]+title}</h3>
    <div className="fz-lot-sum">
      <b>{fzName(lot)}</b>
      <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:6,fontSize:12,color:"var(--muted)",alignItems:"center"}}>
        <span>소비기한 <ExpiryBadge exp={lot.expiry}/></span>
        <span>📍 {fzLoc(lot)}</span>
        <span>현재 <b style={{color:"var(--text)"}}>{fzQty(cur,unit)}</b></span>
      </div>
    </div>
    {type==="move"&&<><div className="ol-label">이동할 위치</div>
      <input className="ol-input" list="fz-locations2" value={loc} onChange={e=>setLoc(e.target.value)} placeholder="새 위치" autoFocus/>
      <datalist id="fz-locations2">{locations.filter(l=>l!==(lot.location||"").trim()).map(l=><option key={l} value={l}/>)}</datalist>
      <div style={{height:12}}/></>}
    <div className="ol-label">{type==="move"?"옮길 수량":"수량"} ({unit})</div>
    <div style={{display:"flex",gap:6}}>
      <input className="ol-input" type="number" min="0" step="any" value={qty} onChange={e=>setQty(e.target.value)} autoFocus={type!=="move"} onKeyDown={e=>{if(e.key==="Enter")submit()}}/>
      {type!=="in"&&<button className="ol-btn ol-btn-secondary" onClick={()=>setQty(String(cur))}>전량</button>}
    </div>
    {type!=="move"&&<div style={{fontSize:13,margin:"10px 0 12px"}}>변경 후 <b style={{color:after<0?"#ef4444":"var(--text)"}}>{fmtNum(after)} {unit}</b>{type==="out"&&after===0&&<span style={{color:"var(--muted)"}}> — 0이 되면 목록에서 사라집니다</span>}</div>}
    {type!=="move"&&<><div className="ol-label">메모</div><input className="ol-input" value={memo} onChange={e=>setMemo(e.target.value)} placeholder={type==="out"?"예: 쿠팡 출고":"선택"} onKeyDown={e=>{if(e.key==="Enter")submit()}}/></>}
    {type==="move"&&q>0&&q<cur&&<div style={{fontSize:12,color:"var(--muted)",marginTop:8}}>{fmtNum(q)} {unit}만 옮기고 {fmtNum(cur-q)} {unit}는 지금 위치에 남깁니다</div>}
    {err&&<div className="ol-err">{err}</div>}
    <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:18}}>
      <button className="ol-btn ol-btn-secondary" onClick={onCancel}>취소</button>
      <button className={"ol-btn "+(type==="out"?"ol-btn-danger":"ol-btn-primary")} disabled={busy} onClick={submit}>{busy?"처리 중…":title}</button>
    </div>
  </>;
}

// 수량 칸 클릭 → 그 자리에서 숫자 수정 (Enter/바깥 클릭 저장, Esc 취소). 차이만큼 입고/출고로 기록
function FrozenQtyCell({adminHash,lot,onSaved,onError}){
  const cur=Number(lot.qty||0);
  const[edit,setEdit]=useState(false);
  const[val,setVal]=useState("");
  const[busy,setBusy]=useState(false);
  const done=useRef(false);
  const start=()=>{done.current=false;setVal(String(cur));setEdit(true)};
  const commit=async()=>{
    if(done.current)return;done.current=true;
    const n=Number(val);
    if(val.trim()===""||!Number.isFinite(n)||n<0){setEdit(false);if(val.trim()!=="")onError("수량은 0 이상 숫자로 입력하세요.");return}
    const delta=Math.round((n-cur)*1000)/1000;
    if(delta===0){setEdit(false);return}
    setBusy(true);
    try{
      await rpc("ol_frozen_change_qty",{p_admin_hash:adminHash,p_id:lot.id,p_delta:delta,p_memo:"수량 직접 수정"});
      setEdit(false);onSaved();
    }catch(e){onError(fzErr(e));setEdit(false)}
    setBusy(false);
  };
  if(!edit)return <button className="fz-qty-btn" title="클릭해서 수량 수정" onClick={start}>{fzQty(lot.qty,lot.unit)}</button>;
  return <span style={{display:"inline-flex",alignItems:"center",gap:4}}>
    <input className="fz-qty-in" type="number" min="0" step="any" autoFocus disabled={busy} value={val}
      onFocus={e=>e.target.select()} onChange={e=>setVal(e.target.value)} onBlur={commit}
      onKeyDown={e=>{if(e.key==="Enter")e.target.blur();else if(e.key==="Escape"){done.current=true;setEdit(false)}}}/>
    <span style={{fontSize:11,color:"var(--muted)"}}>{lot.unit||"박스"}</span>
    {Number(val)===0&&val.trim()!==""&&<span style={{fontSize:11,color:"#ef4444"}}>0이면 삭제</span>}
  </span>;
}

function downloadFrozenXlsx(lots){
  const sorted=[...lots].sort((a,b)=>fzNameCmp(a,b)||fzExpCmp(a,b)||locCmp(fzLoc(a),fzLoc(b)));
  const head=["제품코드","제품명","수량","단위","소비기한","남은 일수","상태","위치","입고일","메모"];
  const rows=sorted.map(l=>[l.product_code||"",fzName(l),Number(l.qty||0),l.unit||"박스",l.expiry?String(l.expiry).slice(0,10):"",fzDays(l.expiry)??"",FZ_STATUS[fzStatus(l.expiry)].label,(l.location||"").trim(),l.in_date?String(l.in_date).slice(0,10):"",l.memo||""]);
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]);
  ws["!cols"]=[12,32,8,6,12,9,10,16,12,20].map(w=>({wch:w}));
  const bd={style:"thin",color:{rgb:"BBBBBB"}};
  const range=XLSX.utils.decode_range(ws["!ref"]);
  for(let r=0;r<=range.e.r;r++)for(let c=0;c<=range.e.c;c++){
    const a=XLSX.utils.encode_cell({r,c});if(!ws[a])ws[a]={t:"s",v:""};
    ws[a].s={font:{name:"맑은 고딕",sz:11,bold:r===0},border:{top:bd,bottom:bd,left:bd,right:bd},
      alignment:{horizontal:c===1||c===9?"left":"center",vertical:"center"},
      ...(r===0?{fill:{fgColor:{rgb:"DBEAFE"}}}:{})};
  }
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"냉동재고");
  XLSX.writeFile(wb,`냉동재고_${todayYmd()}.xlsx`);
}

// 이미지 저장용 페이지 (흰 배경, 버튼·배경색 없이) — 지금 보기(제품별/위치별/소비기한순)와 필터 그대로
// paged=false: 폭 794px, 높이는 내용만큼인 긴 한 장
// paged=true : A4 세로(794×1123) 높이 기준으로 쪽 나눔 → 쪽마다 PNG, 내용이 짧은 쪽은 아래 빈 공간 없이 잘림
const FZP={W:794,H:1123,PAD_X:44,PAD_Y:46,HEAD1:92,HEAD2:44,THEAD:34,FOOT:30,GAP:16,BAND:46,ROW:40};
function fzPrintItems(view,byProduct,byLocation,byExpiry){
  if(view==="product")return byProduct.flatMap(g=>[{band:true,key:"b"+g.key,label:fzName(g.lots[0]),lots:g.lots},...g.lots.map(l=>({key:l.id,lot:l}))]);
  if(view==="location")return byLocation.flatMap(g=>[{band:true,key:"b"+g.loc,label:"📍 "+g.loc,lots:g.lots},...g.lots.map(l=>({key:l.id,lot:l}))]);
  return byExpiry.map(l=>({key:l.id,lot:l}));
}
function fzPaginate(items){
  const pages=[];let cur=[],used=0,lastBand=null;
  const avail=i=>FZP.H-FZP.PAD_Y*2-(i===0?FZP.HEAD1:FZP.HEAD2)-FZP.THEAD-FZP.FOOT-FZP.GAP;
  const push=()=>{pages.push(cur);cur=[];used=0};
  for(let i=0;i<items.length;i++){
    const it=items[i];
    const h=it.band?FZP.BAND:FZP.ROW;
    // 띠 바로 뒤 첫 줄까지 같은 쪽에 들어가야 띠를 둠 (쪽 끝에 띠만 남지 않게)
    const need=it.band?FZP.BAND+FZP.ROW:h;
    if(cur.length&&used+need>avail(pages.length))push();
    if(!cur.length&&!it.band&&lastBand){cur.push({...lastBand,key:lastBand.key+"-c"+pages.length,cont:true});used+=FZP.BAND}
    if(it.band)lastBand=it;
    cur.push(it);used+=h;
  }
  if(cur.length||!pages.length)push();
  return pages;
}
// 모바일에서 여러 쪽 이미지를 저장하는 창 — 공유 시트로 한 번에 저장하거나, 쪽마다 눌러서 저장
function FrozenShotsSheet({shots,onClose}){
  const files=shots.map(x=>x.file);
  const canShare=!!(navigator.canShare&&navigator.canShare({files}));
  const[msg,setMsg]=useState("");
  const shareAll=async()=>{
    try{await navigator.share({files});setMsg("")}
    catch(e){if(e?.name!=="AbortError")setMsg("공유 실패: "+String(e?.message||e)+" — 아래에서 쪽마다 저장하세요.")}
  };
  return <>
    <h3 style={{margin:"0 0 6px",fontSize:17}}>🖼 이미지 {shots.length}장</h3>
    <div style={{fontSize:12,color:"var(--muted)",marginBottom:12}}>모바일은 한 번에 한 파일만 내려받을 수 있어요.{canShare?" '한 번에 저장'을 누르고 공유 창에서 '이미지 저장'을 고르세요.":""} 쪽마다 저장하거나 이미지를 길게 눌러 저장해도 돼요.</div>
    {canShare&&<button className="ol-btn ol-btn-primary" style={{width:"100%",marginBottom:12}} onClick={shareAll}>📤 {shots.length}장 한 번에 저장</button>}
    {msg&&<div className="ol-err">{msg}</div>}
    <div style={{display:"flex",flexDirection:"column",gap:12,maxHeight:"60vh",overflowY:"auto"}}>
      {shots.map((x,i)=><div key={x.name} style={{border:"1px solid var(--border)",borderRadius:8,padding:8}}>
        <img src={x.url} alt={x.name} style={{width:"100%",display:"block",borderRadius:4,background:"#fff"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6,gap:8}}>
          <span style={{fontSize:12,color:"var(--muted)"}}>{x.label||`${i+1}쪽`}</span>
          <a className="ol-btn ol-btn-secondary ol-btn-sm" href={x.url} download={x.name}>⬇ 저장</a>
        </div></div>)}
    </div>
    <div style={{display:"flex",justifyContent:"flex-end",marginTop:14}}><button className="ol-btn ol-btn-secondary" onClick={onClose}>닫기</button></div>
  </>;
}
function FrozenPrintPages({view,byProduct,byLocation,byExpiry,lots,filterText,paged}){
  const C={line:"#d4d4d8",band:"#f4f4f5",muted:"#71717a",text:"#111"};
  const all=fzPrintItems(view,byProduct,byLocation,byExpiry);
  const pages=paged?fzPaginate(all):[all];
  const td={padding:"0 12px",height:FZP.ROW,borderBottom:`1px solid ${C.line}`,fontSize:15,verticalAlign:"middle",boxSizing:"border-box",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"};
  const th={padding:"0 12px",height:FZP.THEAD,fontSize:12,fontWeight:700,color:C.muted,borderBottom:`2px solid ${C.text}`,textAlign:"left",whiteSpace:"nowrap",boxSizing:"border-box"};
  const unitSpan=u=><span style={{fontSize:12,fontWeight:500,color:C.muted,marginLeft:2}}>{u||"박스"}</span>;
  const qty=(n,u)=><>{fmtNum(n)}{unitSpan(u)}</>;
  const total=ls=>fzUnitSum(ls).map(([u,n],i)=><span key={u}>{i>0&&<span style={{color:C.muted}}> · </span>}{qty(n,u)}</span>);
  const qtyTd={...td,textAlign:"right",fontSize:17,fontWeight:800,fontVariantNumeric:"tabular-nums"};
  // 남은 기간 열 없이, 기한 지남·30일 이내만 날짜 색으로 표시 (흑백 인쇄 대비 지남은 글자도 붙임)
  const expTd=exp=>{
    const st=fzStatus(exp);
    const color=st==="expired"?"#dc2626":st==="soon"?"#ea580c":C.text;
    return <td style={{...td,fontWeight:st==="expired"||st==="soon"?800:600,color,fontVariantNumeric:"tabular-nums"}}>{fzExpText(exp)}{st==="expired"&&<span style={{fontSize:12,marginLeft:6}}>지남</span>}</td>;
  };
  const nameTd=l=><td style={{...td,fontWeight:700}}>{fzName(l)}</td>;
  const locTd=l=><td style={td}>{(l.location||"").trim()||"–"}</td>;
  const cols=view==="product"?[["소비기한","30%"],["위치","45%"],["수량","25%"]]
    :view==="location"?[["제품","55%"],["소비기한","22%"],["수량","23%"]]
    :[["소비기한","20%"],["제품","44%"],["위치","18%"],["수량","18%"]];
  const rowCells=l=>view==="product"?<>{expTd(l.expiry)}{locTd(l)}</>
    :view==="location"?<>{nameTd(l)}{expTd(l.expiry)}</>
    :<>{expTd(l.expiry)}{nameTd(l)}{locTd(l)}</>;
  const today=todayYmd();
  const stats={products:new Set(lots.map(fzKey)).size,locs:new Set(lots.map(fzLoc)).size};
  const hasExpired=lots.some(l=>fzStatus(l.expiry)==="expired"),hasSoon=lots.some(l=>fzStatus(l.expiry)==="soon");
  const sortNote={product:"제품별 · 소비기한 빠른 순",location:"위치별 · 제품명 순",expiry:"소비기한 빠른 순"}[view];

  return <>{pages.map((items,pi)=><div key={pi} data-page={pi} style={{width:FZP.W,background:"#fff",color:C.text,padding:`${FZP.PAD_Y}px ${FZP.PAD_X}px`,boxSizing:"border-box",fontFamily:"Pretendard, 'Malgun Gothic', sans-serif",display:"flex",flexDirection:"column",marginBottom:20}}>
    {pi===0?<div style={{height:FZP.HEAD1,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:16,boxSizing:"border-box"}}>
      <div>
        <div style={{fontSize:28,fontWeight:900,letterSpacing:"-0.5px"}}>냉동재고 현황</div>
        <div style={{fontSize:14,color:C.muted,marginTop:4}}>{fzExpText(today)} ({dowOf(today)}) 기준{filterText&&<> · {filterText}</>}</div>
      </div>
      <div style={{textAlign:"right"}}>
        <div style={{fontSize:24,fontWeight:900}}>{total(lots)}</div>
        <div style={{fontSize:13,color:C.muted,marginTop:2}}>{stats.products}종 · 위치 {stats.locs}곳</div>
      </div>
    </div>:<div style={{height:FZP.HEAD2,fontSize:15,fontWeight:800,color:C.muted}}>냉동재고 현황 · {fzExpText(today)} ({dowOf(today)}) <span style={{fontWeight:500}}>(이어서)</span></div>}
    <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed"}}>
      <colgroup>{cols.map(([n,w])=><col key={n} style={{width:w}}/>)}</colgroup>
      <thead><tr>{cols.map(([n])=><th key={n} style={n==="수량"?{...th,textAlign:"right"}:th}>{n}</th>)}</tr></thead>
      <tbody>{items.map(it=>it.band
        ?<tr key={it.key}><td colSpan={cols.length} style={{padding:"0 12px",height:FZP.BAND,background:C.band,borderBottom:`1px solid ${C.line}`,borderTop:"8px solid #fff",boxSizing:"border-box"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:16}}>
              <span style={{fontSize:16,fontWeight:800,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.label}{it.cont&&<span style={{fontSize:12,fontWeight:500,color:C.muted,marginLeft:6}}>(이어서)</span>}</span>
              <span style={{fontSize:17,fontWeight:800,whiteSpace:"nowrap"}}>{total(it.lots)}</span>
            </div></td></tr>
        :<tr key={it.key}>{rowCells(it.lot)}<td style={qtyTd}>{qty(it.lot.qty,it.lot.unit)}</td></tr>)}</tbody>
    </table>
    <div style={{marginTop:FZP.GAP,height:FZP.FOOT,display:"flex",justifyContent:"space-between",alignItems:"flex-end",fontSize:12,color:C.muted}}>
      <span>{hasExpired&&<span style={{color:"#dc2626",fontWeight:700,marginRight:12}}>● 기한 지남</span>}{hasSoon&&<span style={{color:"#ea580c",fontWeight:700,marginRight:12}}>● {FZ_SOON}일 이내</span>}{sortNote}</span>
      <span>{pages.length>1?`${pi+1} / ${pages.length}`:""}</span>
    </div>
  </div>)}</>;
}

function FrozenTab({adminHash,masters}){
  const[rawLots,setRawLots]=useState([]);
  const[rawTxns,setRawTxns]=useState([]);
  const[loading,setLoading]=useState(true);
  const[err,setErr]=useState("");
  const[q,setQ]=useState("");
  const[view,setView]=useState(()=>{const v=lsGet("ol-fz-view","product");return ["product","location","expiry"].includes(v)?v:"product"});
  useEffect(()=>lsSet("ol-fz-view",view),[view]);
  const[locF,setLocF]=useState("all");
  const[stF,setStF]=useState("all");
  const[editing,setEditing]=useState(null);
  const[action,setAction]=useState(null); // {type:"in"|"out"|"move", lot}
  const[delId,setDelId]=useState(null);
  const[showHist,setShowHist]=useState(false);
  const[printing,setPrinting]=useState(false);
  const[shots,setShots]=useState(null); // 모바일 여러 쪽 저장용 [{name,url,file}]
  const printRef=useRef(null);

  const load=useCallback(async()=>{
    try{
      const d=await rpc("ol_list_frozen",{p_admin_hash:adminHash});
      setRawLots(d?.lots||[]);setRawTxns(d?.txns||[]);setErr("");
    }catch(e){setErr(fzErr(e))}
    setLoading(false);
  },[adminHash]);
  useEffect(()=>{load()},[load]);

  const prodMap=useMemo(()=>new Map(masters.products.map(p=>[p.code,p])),[masters.products]);
  const withName=l=>{const p=l.product_code?prodMap.get(l.product_code):null;return p?{...l,disp_name:`${shipNameOf(p)} / ${p.per_box}ea`}:l};
  const lots=useMemo(()=>rawLots.map(withName),[rawLots,prodMap]);
  const txns=useMemo(()=>rawTxns.map(withName),[rawTxns,prodMap]);
  const locations=useMemo(()=>[...new Set(lots.map(l=>(l.location||"").trim()).filter(Boolean))].sort(locCmp),[lots]);
  const filtered=useMemo(()=>{
    const s=q.trim().toLowerCase();
    return lots.filter(l=>{
      if(locF!=="all"&&fzLoc(l)!==locF)return false;
      const st=fzStatus(l.expiry);
      if(stF==="expired"&&st!=="expired")return false;
      if(stF==="soon"&&!(st==="expired"||st==="soon"))return false;
      if(stF==="warn"&&!(st==="expired"||st==="soon"||st==="warn"))return false;
      if(!s)return true;
      const p=prodMap.get(l.product_code);
      return [l.product_name,l.disp_name,l.product_code,l.location,l.memo,p?.ship_name,p?.image_name].some(x=>String(x||"").toLowerCase().includes(s));
    });
  },[lots,q,locF,stF,prodMap]);

  const stats=useMemo(()=>{
    const c={expired:0,soon:0};for(const l of lots){const st=fzStatus(l.expiry);if(st in c)c[st]++}
    return {products:new Set(lots.map(fzKey)).size,qty:fzUnitSum(lots),locs:new Set(lots.map(fzLoc)).size,...c};
  },[lots]);

  const byProduct=useMemo(()=>{
    const m=new Map();
    for(const l of filtered){const k=fzKey(l);if(!m.has(k))m.set(k,{key:k,name:fzName(l),code:l.product_code,lots:[]});m.get(k).lots.push(l)}
    return [...m.values()].map(g=>({...g,lots:g.lots.sort((a,b)=>fzExpCmp(a,b)||locCmp(fzLoc(a),fzLoc(b))),prod:prodMap.get(g.code)}))
      .sort((a,b)=>a.name.localeCompare(b.name,"ko",{numeric:true}));
  },[filtered,prodMap]);
  const byLocation=useMemo(()=>{
    const m=new Map();
    for(const l of filtered){const k=fzLoc(l);if(!m.has(k))m.set(k,[]);m.get(k).push(l)}
    return [...m.entries()].sort((a,b)=>locCmp(a[0],b[0])).map(([loc,ls])=>({loc,lots:ls.sort((a,b)=>fzNameCmp(a,b)||fzExpCmp(a,b))}));
  },[filtered]);
  const byExpiry=useMemo(()=>[...filtered].sort((a,b)=>fzExpCmp(a,b)||fzNameCmp(a,b)),[filtered]);

  const filterText=[stF!=="all"&&{expired:"기한 지남만",soon:`${FZ_SOON}일 이내만`,warn:`${FZ_WARN}일 이내만`}[stF],
    locF!=="all"&&"위치 "+locF,q.trim()&&`검색 "${q.trim()}"`].filter(Boolean).join(" · ");
  const closeShots=()=>{if(shots)shots.forEach(x=>URL.revokeObjectURL(x.url));setShots(null)};
  // mode: "long" = 긴 한 장, "pages" = A4 쪽마다 한 장 (짧은 쪽은 아래 공백 없이)
  const savePng=async mode=>{
    setPrinting(mode);
    try{
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      if(document.fonts&&document.fonts.ready)await document.fonts.ready;
      const pages=[...printRef.current.querySelectorAll("[data-page]")];
      // 모바일 브라우저는 버튼 한 번에 파일 하나만 받게 함 → 여러 쪽이면 이미지를 먼저 만들고 저장 창에서 고르게
      const mobile=window.matchMedia&&matchMedia("(pointer:coarse)").matches;
      if(mobile&&pages.length>1){
        const out=[];
        for(let i=0;i<pages.length;i++){
          const el=pages[i];
          const scale=Math.max(1,Math.min(3,30000/el.scrollHeight));
          const canvas=await html2canvas(el,{scale,backgroundColor:"#ffffff",useCORS:true});
          const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
          const name=`냉동재고_${todayYmd()}_${i+1}쪽.png`;
          out.push({name,url:URL.createObjectURL(blob),file:new File([blob],name,{type:"image/png"})});
        }
        setShots(out);setPrinting(false);return;
      }
      for(let i=0;i<pages.length;i++){
        const el=pages[i];
        // 아주 길면 브라우저 캔버스 한도(약 32,000px)를 넘지 않게 배율을 낮춤
        const scale=Math.max(1,Math.min(3,30000/el.scrollHeight));
        const canvas=await html2canvas(el,{scale,backgroundColor:"#ffffff",useCORS:true});
        const a=document.createElement("a");
        a.download=`냉동재고_${todayYmd()}${pages.length>1?`_${i+1}쪽`:""}.png`;a.href=canvas.toDataURL("image/png");a.click();
        // 연달아 내려받으면 브라우저가 막을 수 있어 간격을 둠
        if(i<pages.length-1)await new Promise(r=>setTimeout(r,700));
      }
    }catch(e){setErr("이미지 저장 실패: "+String(e?.message||e))}
    setPrinting(false);
  };

  const del=async l=>{
    try{await rpc("ol_delete_frozen_lot",{p_admin_hash:adminHash,p_id:l.id});setDelId(null);load()}catch(e){setErr(fzErr(e))}
  };
  // 전체 삭제: 기존 로트 삭제 RPC를 5개씩 나눠 반복 호출 (SQL 추가 불필요)
  const[askClear,setAskClear]=useState(false);
  const[clearing,setClearing]=useState(null); // {done,total}
  const clearAll=async()=>{
    const ids=rawLots.map(l=>l.id);
    setAskClear(false);setClearing({done:0,total:ids.length});
    let fail=0,done=0;
    for(let i=0;i<ids.length;i+=5){
      const rs=await Promise.allSettled(ids.slice(i,i+5).map(id=>rpc("ol_delete_frozen_lot",{p_admin_hash:adminHash,p_id:id})));
      fail+=rs.filter(r=>r.status==="rejected").length;done+=rs.length;
      setClearing({done,total:ids.length});
    }
    setClearing(null);
    if(fail)setErr(`${fail}건 삭제 실패 — 남은 재고를 다시 표시합니다`);
    load();
  };

  // 삭제는 confirm() 대신 그 자리 확인 (앱 내장 브라우저에서 confirm 창이 안 뜨는 경우 대비)
  const actions=l=>delId===l.id
    ?<span className="fz-actions"><span style={{fontSize:12,color:"#ef4444",fontWeight:600}}>삭제할까요?</span>
      <button className="ol-btn ol-btn-danger ol-btn-sm" onClick={()=>del(l)}>삭제</button>
      <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setDelId(null)}>취소</button></span>
    :<span className="fz-actions">
      <button className="fz-act in" title="입고" onClick={()=>setAction({type:"in",lot:l})}>＋</button>
      <button className="fz-act out" title="출고" onClick={()=>setAction({type:"out",lot:l})}>－</button>
      <button className="fz-act" title="위치 이동" onClick={()=>setAction({type:"move",lot:l})}>⇄</button>
      <button className="fz-act" title="수정" onClick={()=>setEditing(l)}>✏</button>
      <button className="fz-act" title="삭제" onClick={()=>setDelId(l.id)}>🗑</button>
    </span>;
  const qtyCell=l=><FrozenQtyCell key={l.id+":"+l.qty} adminHash={adminHash} lot={l} onSaved={load} onError={setErr}/>;
  const rowCls=l=>"fz-row fz-"+fzStatus(l.expiry);
  const memoCell=l=>l.memo?<span style={{fontSize:12,color:"var(--muted)"}}>{l.memo}</span>:<span style={{color:"var(--dimmer)"}}>–</span>;
  const nameCell=l=><>
    <div style={{fontWeight:700}}>{fzName(l)}</div>
    <div style={{fontSize:11,color:"var(--muted)"}}><span style={{fontFamily:"monospace"}}>{l.product_code||"코드 없음"}</span></div></>;
  const totalText=ls=>fzUnitSum(ls).map(([u,n],i)=><span key={u}>{i>0&&" · "}{fzQty(n,u)}</span>);

  if(loading)return <Empty emoji="❄" text="불러오는 중…"/>;

  return <>
    {err&&<div className="ol-warn">{err}</div>}
    <div className="fz-stats">
      <div className="fz-stat"><div className="k">제품</div><div className="v">{stats.products}<small>종</small></div></div>
      <div className="fz-stat"><div className="k">총 수량</div><div className="v" style={stats.qty.length>1?{fontSize:16}:undefined}>{stats.qty.length?stats.qty.map(([u,n],i)=><span key={u}>{i>0&&<small> · </small>}{fmtNum(n)}<small>{u}</small></span>):<>0<small>박스</small></>}</div></div>
      <div className="fz-stat"><div className="k">위치</div><div className="v">{stats.locs}<small>곳</small></div></div>
      <div className={"fz-stat clickable"+(stF==="soon"?" on":"")} onClick={()=>setStF(stF==="soon"?"all":"soon")}>
        <div className="k">소비기한 {FZ_SOON}일 이내</div><div className="v" style={{color:stats.soon?"#f97316":undefined}}>{stats.soon}<small>건</small></div></div>
      <div className={"fz-stat clickable"+(stF==="expired"?" on":"")} onClick={()=>setStF(stF==="expired"?"all":"expired")}>
        <div className="k">기한 지남</div><div className="v" style={{color:stats.expired?"#ef4444":undefined}}>{stats.expired}<small>건</small></div></div>
    </div>

    <div className="ol-toolbar">
      <button className="ol-btn ol-btn-primary" onClick={()=>setEditing(locF!=="all"&&locF!==NO_LOC?{location:locF}:{})}>＋ 입고 등록</button>
      <div className="ol-subtabs">
        {[["product","📦 제품별"],["location","📍 위치별"],["expiry","⏳ 소비기한순"]].map(([v,l])=><button key={v} className={view===v?"on":""} onClick={()=>setView(v)}>{l}</button>)}
      </div>
      <button className="ol-btn ol-btn-secondary" disabled={!filtered.length||!!printing} onClick={()=>savePng("long")} title="전체를 세로로 긴 이미지 한 장으로">{printing==="long"?"저장 중…":"🖼 긴 한 장"}</button>

// 📤 냉동 출고 탭 — 입고일 발주서의 냉동 제품 ↔ 냉동재고 로트 자동 배정
//  - 발주 수량(박스) = 발주 팩수량 ÷ 입수량, 제품코드로 재고 로트와 연결
//  - 자동 배정: (우선 위치) → 소비기한 빠른 순. "한 로트로 다 나가게"면 혼자 다 채울 수 있는 로트를 먼저 고름
//  - 출고 수량 칸을 눌러 직접 고칠 수 있음(날짜별로 브라우저에 기억), "출고 확정"으로 재고 차감
// ═══════════════════════════════════════════
const FZO_LOC_BG=["#dcfce7","#dbeafe","#fef3c7","#fce7f3","#e0e7ff","#ccfbf1","#ffedd5","#f3e8ff"];
const fzoRound=n=>Math.round(n*1000)/1000;
// 로트 수량을 박스로 (팩·개 단위면 입수량으로 나눔, kg 등은 계산 불가 → null)
function fzoLotBoxes(l,per){
  const u=(l.unit||"박스").trim(),q=Number(l.qty||0);
  if(u==="박스"||u==="")return q;
  if(u==="팩"||u==="개"||u.toLowerCase()==="ea")return fzoRound(q/per);
  return null;
}
function buildFzOutPlan(orders,prodMap,lots,opts){
  const{vendor,whole,locPref,skipExpired,manual}=opts;
  const need=new Map();
  const sorted=[...orders].sort((a,b)=>String(a.order_no).localeCompare(String(b.order_no),undefined,{numeric:true}));
  for(const o of sorted){
    if(vendor&&(o.vendor||"").trim()!==vendor)continue;
    for(const it of (o.items||[])){
      const p=prodMap[it.code];
      if(!p||storageOf(p)!=="frozen")continue;
      const q=Number(it.qty||0);if(!(q>0))continue;
      const cur=need.get(it.code);
      if(cur)cur.qty+=q;else need.set(it.code,{code:it.code,product:p,qty:q,seq:need.size});
    }
  }
  const rank=loc=>locPref&&loc===locPref?0:1;
  const items=[...need.values()].map(r=>{
    const per=Math.max(1,Number(r.product.per_box)||1);
    const boxes=fzoRound(r.qty/per);
    const all=lots.filter(l=>(l.product_code||"").trim()===r.code&&Number(l.qty)>0).map(l=>{
      const stock=fzoLotBoxes(l,per),expired=fzStatus(l.expiry)==="expired";
      return{lot:l,stock,expired,usable:stock!=null&&stock>0&&!(skipExpired&&expired)};
    });
    const cand=all.filter(x=>x.usable).sort((a,b)=>rank(fzLoc(a.lot))-rank(fzLoc(b.lot))||fzExpCmp(a.lot,b.lot)||locCmp(fzLoc(a.lot),fzLoc(b.lot)));
    const out=new Map();
    const man=manual&&manual[r.code];
    if(man){
      for(const x of all){const v=Number(man[x.lot.id]||0);if(v>0&&x.stock!=null)out.set(x.lot.id,fzoRound(Math.min(v,x.stock)))}
    }else{
      let left=boxes;
      const one=whole?cand.find(x=>x.stock>=left):null;
      if(one){out.set(one.lot.id,left);left=0}
      else for(const x of cand){
        if(left<=0)break;
        const t=fzoRound(Math.min(left,x.stock));
        if(t>0){out.set(x.lot.id,t);left=fzoRound(left-t)}
      }
    }
    const shipped=fzoRound([...out.values()].reduce((a,b)=>a+b,0));
    const rows=all.sort((a,b)=>fzExpCmp(a.lot,b.lot)||locCmp(fzLoc(a.lot),fzLoc(b.lot))).map(x=>({...x,out:out.get(x.lot.id)||0}));
    const stockSum=fzoRound(all.filter(x=>x.usable).reduce((a,x)=>a+x.stock,0));
    return{...r,per,boxes,partial:r.qty%per!==0,rows,shipped,stockSum,
      short:fzoRound(Math.max(0,boxes-shipped)),over:fzoRound(Math.max(0,shipped-boxes)),manual:!!man};
  });
  return items.sort((a,b)=>a.seq-b.seq);
}

// 화면·이미지 공통 표 (이미지 양식: 냉동제품 | 발주 수량 | 소비기한 | 위치 | 재고 | 출고 수량)
// 제품 표 (냉동제품 | 발주 수량 | 소비기한 | 위치 | 재고 | 출고 수량) — 제품별 보기·생산지점 카드 공통
function FzOutTable({plan,onlyOut,locColor,print,outCell,flush,onHide}){
  const C={line:"#cbd5e1",strong:"#111",yellow:"#ffff00",muted:"#6b7280"};
  const cell={padding:"8px 10px",borderBottom:`1px solid ${C.line}`,borderLeft:`1px solid ${C.line}`,textAlign:"center",fontVariantNumeric:"tabular-nums",verticalAlign:"middle"};
  const th={...cell,fontWeight:800,fontSize:15,borderBottom:`2px solid ${C.strong}`,borderTop:flush?"none":`1px solid ${C.line}`};
  return <>
    <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed",minWidth:print?0:560,borderRight:flush?"none":`1px solid ${C.line}`}}>
      <colgroup><col style={{width:"38%"}}/><col style={{width:"13%"}}/><col style={{width:"17%"}}/><col style={{width:"10%"}}/><col style={{width:"10%"}}/><col style={{width:"12%"}}/></colgroup>
      <thead><tr>
        <th style={{...th,background:C.yellow,...(flush?{borderLeft:"none"}:{})}}>냉동제품</th>
        <th style={{...th,background:C.yellow}}>발주 수량</th>
        <th style={th}>소비기한</th><th style={th}>위치</th><th style={th}>재고</th><th style={th}>출고 수량</th>
      </tr></thead>
      {plan.map(it=>{
        const rows=onlyOut?it.rows.filter(x=>x.out>0):it.rows;
        const n=Math.max(1,rows.length);
        const top={borderTop:`2px solid ${C.strong}`};
        const head=[
          <td key="nm" rowSpan={n} style={{...cell,...top,...(flush?{borderLeft:"none"}:{}),fontFamily:"'NanumSquare','Pretendard',sans-serif",fontSize:15}}>
            {boldDigits(shipNameOf(it.product))}
            {!print&&onHide&&<button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginLeft:6,padding:"1px 6px",fontSize:11,verticalAlign:"middle"}} title="이 제품 숨기기 (표·이미지·엑셀·출고 확정에서 빠짐)" onClick={()=>onHide(it.code)}>🙈 숨기기</button>}
            {!print&&it.manual&&<div style={{fontSize:11,color:"#7c3aed",fontWeight:700,marginTop:2}}>✋ 직접 수정함</div>}
          </td>,
          <td key="q" rowSpan={n} style={{...cell,...top,background:C.yellow,fontWeight:900,fontSize:17}}>
            <span style={{color:it.partial?"#dc2626":"#111"}}>{fmtBoxes(it.boxes)}</span>
            {it.short>0&&<div style={{fontSize:12,fontWeight:800,color:"#dc2626",marginTop:2}}>부족 {fmtBoxes(it.short)}</div>}
            {it.over>0&&<div style={{fontSize:12,fontWeight:800,color:"#7c3aed",marginTop:2}}>초과 {fmtBoxes(it.over)}</div>}
          </td>];
        if(!rows.length)return <tbody key={it.code} data-shipcut="1"><tr>{head}
          <td colSpan={4} style={{...cell,...top,color:"#dc2626",fontWeight:700}}>{it.rows.length?"출고할 로트 없음":"냉동재고에 이 제품 재고 없음"}</td></tr></tbody>;
        return <tbody key={it.code} data-shipcut="1">{rows.map((x,i)=>{
          const t=i===0?top:{};
          const st=fzStatus(x.lot.expiry);
          const loc=fzLoc(x.lot);
          return <tr key={x.lot.id}>
            {i===0&&head}
            <td style={{...cell,...t,color:x.expired?"#dc2626":"#111",fontWeight:x.expired?800:500}}>{fzExpText(x.lot.expiry)}{x.expired&&<span style={{fontSize:11,marginLeft:4}}>지남</span>}{!x.expired&&st==="soon"&&<span style={{fontSize:11,marginLeft:4,color:"#ea580c"}}>임박</span>}</td>
            <td style={{...cell,...t,background:locColor(loc)}}>{loc===NO_LOC?"–":loc}</td>
            <td style={{...cell,...t,color:x.usable?"#111":"#9ca3af"}} title={x.stock==null?`단위(${x.lot.unit})를 박스로 바꿀 수 없어 배정에서 제외`:""}>{x.stock==null?`${fmtNum(x.lot.qty)}${x.lot.unit}`:fmtBoxes(x.stock)}</td>
            <td style={{...cell,...t,fontWeight:x.out>0?900:400,fontSize:x.out>0?16:14,background:x.out>0?"#fff7ed":"transparent",padding:outCell?"4px 6px":cell.padding}}>
              {outCell?outCell(it,x):x.out>0?fmtBoxes(x.out):""}</td>
          </tr>;})}</tbody>;
      })}
    </table>
  </>;
}
function FzOutSheet({plan,date,prefix,vendor,onlyOut,locColor,print,refCb,outCell,onHide}){
  const C={line:"#cbd5e1",strong:"#111",yellow:"#ffff00",muted:"#6b7280"};
  const totalNeed=fzoRound(plan.reduce((a,x)=>a+x.boxes,0));
  const totalOut=fzoRound(plan.reduce((a,x)=>a+x.shipped,0));
  const totalShort=fzoRound(plan.reduce((a,x)=>a+x.short,0));
  const cell={padding:"8px 10px",borderBottom:`1px solid ${C.line}`,borderLeft:`1px solid ${C.line}`,textAlign:"center",fontVariantNumeric:"tabular-nums",verticalAlign:"middle"};
  const th={...cell,fontWeight:800,fontSize:15,borderBottom:`2px solid ${C.strong}`,borderTop:`1px solid ${C.line}`};
  return <div ref={refCb} className="ol-sheet" style={{padding:print?0:"22px 24px",fontSize:14,lineHeight:1.35,background:"#fff",color:"#111",...(print?{border:"none",borderRadius:0,margin:0,overflow:"visible"}:{})}}>
    <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:12,flexWrap:"wrap",paddingBottom:12,borderBottom:`2px solid ${C.strong}`,marginBottom:16}}>

      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <span style={{padding:"4px 10px",borderRadius:14,background:"#eff6ff",color:"#1d4ed8",fontWeight:700,fontSize:13}}>발주 {fmtBoxes(totalNeed)}박스</span>
        <span style={{padding:"4px 10px",borderRadius:14,background:"#111",color:"#fff",fontWeight:700,fontSize:13}}>출고 {fmtBoxes(totalOut)}박스</span>
        {totalShort>0&&<span style={{padding:"4px 10px",borderRadius:14,background:"#fee2e2",color:"#dc2626",fontWeight:800,fontSize:13}}>부족 {fmtBoxes(totalShort)}박스</span>}

    <FzOutTable plan={plan} onlyOut={onlyOut} locColor={locColor} print={print} outCell={outCell} onHide={onHide}/>
  </div>;

// 생산지점별: 제품리스트의 생산지점(층)으로 제품을 묶음 → 지점마다 제품 표
function fzOutSiteGroups(plan){
  const m=new Map();
  for(const it of plan){const f=(it.product.site||"").trim()||NO_SITE;if(!m.has(f))m.set(f,[]);m.get(f).push(it)}
  return [...m.entries()].sort((a,b)=>siteCmp(a[0],b[0])).map(([floor,items])=>({floor,items,
    total:fzoRound(items.reduce((a,x)=>a+x.boxes,0)),out:fzoRound(items.reduce((a,x)=>a+x.shipped,0)),short:fzoRound(items.reduce((a,x)=>a+x.short,0))}));
}
function FzOutFloorSheet({groups,date,prefix,vendor,onlyOut,locColor,print,refCb,outCell,onHide}){
  const C={strong:"#111",muted:"#6b7280"};
  const sum=k=>fzoRound(groups.reduce((a,g)=>a+g[k],0));
  const one=groups.length===1;
  return <div ref={refCb} className="ol-sheet" style={{padding:print?0:"22px 24px",fontSize:14,lineHeight:1.35,background:"#fff",color:"#111",...(print?{border:"none",borderRadius:0,margin:0,overflow:"visible"}:{})}}>
    <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:12,flexWrap:"wrap",paddingBottom:12,borderBottom:`2px solid ${C.strong}`,marginBottom:16}}>
      <div style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px"}}>{shipTitle(prefix,date)}{one?` · ${groups[0].floor}`:""}{vendor&&<span style={{fontSize:15,fontWeight:600,color:C.muted,marginLeft:8}}>{vendor}</span>}</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <span style={{padding:"4px 10px",borderRadius:14,background:"#eff6ff",color:"#1d4ed8",fontWeight:700,fontSize:13}}>발주 {fmtBoxes(sum("total"))}박스</span>
        <span style={{padding:"4px 10px",borderRadius:14,background:"#111",color:"#fff",fontWeight:700,fontSize:13}}>출고 {fmtBoxes(sum("out"))}박스</span>
        {sum("short")>0&&<span style={{padding:"4px 10px",borderRadius:14,background:"#fee2e2",color:"#dc2626",fontWeight:800,fontSize:13}}>부족 {fmtBoxes(sum("short"))}박스</span>}
      </div>
    </div>
    {!groups.length&&<div style={{padding:"30px 0",textAlign:"center",color:C.muted}}>선택한 생산지점이 없습니다</div>}
    {groups.map(g=><div key={g.floor} data-shipcut="1" style={{border:"1px solid #cbd5e1",borderRadius:8,marginBottom:18,overflow:"hidden"}}>
      <FzOutTable plan={g.items} onlyOut={onlyOut} locColor={locColor} print={print} outCell={outCell} onHide={onHide} flush/>
    </div>)}
  </div>;
}

function downloadFzOutXlsx(plan,date,prefix,vendor,onlyOut){
  const F="맑은 고딕",line={style:"thin",color:{rgb:"BFC6D0"}},thick={style:"medium",color:{rgb:"111111"}};
  const ws={},merges=[],rowsH=[];
  const enc=(r,c)=>XLSX.utils.encode_cell({r,c});
  const st=(o={})=>({font:{name:F,sz:o.sz||12,bold:!!o.b,...(o.color?{color:{rgb:o.color}}:{})},
    alignment:{horizontal:"center",vertical:"center",wrapText:true},
    border:{left:line,right:line,bottom:line,top:o.top?thick:line},
    ...(o.fill?{fill:{patternType:"solid",fgColor:{rgb:o.fill}}}:{})});
  const put=(r,c,v,s)=>{ws[enc(r,c)]={t:typeof v==="number"?"n":"s",v:v??"",s}};
  put(0,0,shipTitle(prefix,date)+(vendor?` · ${vendor}`:""),{font:{name:F,sz:16,bold:true},alignment:{horizontal:"center",vertical:"center"}});
  for(let c=1;c<6;c++)put(0,c,"",{});
  merges.push({s:{r:0,c:0},e:{r:0,c:5}});rowsH[0]={hpt:30};
  ["냉동제품","발주 수량","소비기한","위치","재고","출고 수량"].forEach((h,c)=>put(1,c,h,st({b:true,sz:13,fill:c<2?"FFFF00":undefined})));
  rowsH[1]={hpt:24};
  let r=2;
  for(const it of plan){
    const rows=onlyOut?it.rows.filter(x=>x.out>0):it.rows;
    const n=Math.max(1,rows.length);
    for(let i=0;i<n;i++){
      const x=rows[i],top=i===0;
      put(r+i,0,i===0?shipNameOf(it.product):"",st({top,sz:12}));
      put(r+i,1,i===0?it.boxes:"",st({top,b:true,sz:13,fill:"FFFF00",color:it.short>0?"DC2626":undefined}));
      if(!x){put(r,2,it.rows.length?"출고할 로트 없음":"재고 없음",st({top,color:"DC2626"}));for(let c=3;c<6;c++)put(r,c,"",st({top}));merges.push({s:{r,c:2},e:{r,c:5}});continue}
      put(r+i,2,fzExpText(x.lot.expiry),st({top,color:x.expired?"DC2626":undefined}));
      put(r+i,3,fzLoc(x.lot)===NO_LOC?"":fzLoc(x.lot),st({top}));
      put(r+i,4,x.stock==null?`${x.lot.qty}${x.lot.unit}`:x.stock,st({top}));
      put(r+i,5,x.out>0?x.out:"",st({top,b:x.out>0}));
      rowsH[r+i]={hpt:22};
    }
    if(n>1){merges.push({s:{r,c:0},e:{r:r+n-1,c:0}});merges.push({s:{r,c:1},e:{r:r+n-1,c:1}})}
    r+=n;
  }
  ws["!ref"]=`A1:F${r}`;ws["!merges"]=merges;ws["!rows"]=rowsH;
  ws["!cols"]=[{wch:44},{wch:11},{wch:14},{wch:9},{wch:9},{wch:11}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"냉동 출고");
  // 생산지점별 시트: 생산지점 | 냉동제품 | 발주 수량 | 소비기한 | 위치 | 출고 수량
  const fl=[["생산지점","냉동제품","발주 수량","소비기한","위치","출고 수량"]];
  for(const g of fzOutSiteGroups(plan)){
    for(const it of g.items){
      const outs=it.rows.filter(x=>x.out>0);
      if(!outs.length)fl.push([g.floor,shipNameOf(it.product),it.boxes,"재고 없음","",0]);
      outs.forEach((x,i)=>fl.push([g.floor,i?"":shipNameOf(it.product),i?"":it.boxes,fzExpText(x.lot.expiry),fzLoc(x.lot)===NO_LOC?"":fzLoc(x.lot),x.out]));
    }
    fl.push([`${g.floor} 합계`,"",g.total,"","",g.out]);
  }
  const ws2=XLSX.utils.aoa_to_sheet(fl);
  ws2["!cols"]=[{wch:12},{wch:44},{wch:11},{wch:14},{wch:9},{wch:11}];
  const r2=XLSX.utils.decode_range(ws2["!ref"]);
  for(let r=0;r<=r2.e.r;r++)for(let c=0;c<=r2.e.c;c++){
    const a=XLSX.utils.encode_cell({r,c});if(!ws2[a])ws2[a]={t:"s",v:""};
    const sum=String(fl[r][0]).endsWith(" 합계");
    ws2[a].s={font:{name:F,sz:12,bold:r===0||sum||c===5},border:{left:line,right:line,top:line,bottom:line},
      alignment:{horizontal:c===1?"left":"center",vertical:"center"},
      ...(r===0?{fill:{patternType:"solid",fgColor:{rgb:"FFFF00"}}}:sum?{fill:{patternType:"solid",fgColor:{rgb:"F1F5F9"}}}:{})};
  }
  XLSX.utils.book_append_sheet(wb,ws2,"생산지점별");
  const safe=x=>String(x).replace(/[\\/:*?"<>|]/g,"_");
  XLSX.writeFile(wb,`냉동출고_${date}${vendor?"_"+safe(vendor):""}.xlsx`);
}

// 출고 수량 칸 — 누르면 숫자 입력, Enter/바깥 클릭 저장, Esc 취소
function FzOutQtyCell({value,max,onSave}){
  const[edit,setEdit]=useState(false);
  const[val,setVal]=useState("");
  const done=useRef(false);
  const commit=()=>{
    if(done.current)return;done.current=true;setEdit(false);
    const t=val.trim();const n=t===""?0:Number(t);
    if(!Number.isFinite(n)||n<0)return;
    onSave(fzoRound(Math.min(n,max)));
  };
  if(!edit)return <button className="fz-qty-btn" title="눌러서 출고 수량 수정" style={{minWidth:40,justifyContent:"center",fontWeight:"inherit",fontSize:"inherit"}}
    onClick={()=>{done.current=false;setVal(value?String(value):"");setEdit(true)}}>{value>0?fmtBoxes(value):<span style={{color:"#cbd5e1"}}>＋</span>}</button>;
  return <input className="fz-qty-in" type="number" min="0" max={max} step="any" autoFocus value={val} style={{width:64}}
    onFocus={e=>e.target.select()} onChange={e=>setVal(e.target.value)} onBlur={commit}
    onKeyDown={e=>{if(e.key==="Enter")e.target.blur();else if(e.key==="Escape"){done.current=true;setEdit(false)}}}/>;
}

function FzOutTab({adminHash,masters,dates,selDate,setSelDate,orders,loadingOrders}){
  const[prefix,setPrefix]=useState(()=>lsGet("ol-prefix","쿠팡"));
  useEffect(()=>lsSet("ol-prefix",prefix),[prefix]);
  const[withExtra,setWithExtra]=useState(()=>lsGet("ol-ship-extra","1")==="1");
  useEffect(()=>lsSet("ol-ship-extra",withExtra?"1":"0"),[withExtra]);
  const[whole,setWhole]=useState(()=>lsGet("ol-fzout-whole","1")==="1");
  useEffect(()=>lsSet("ol-fzout-whole",whole?"1":"0"),[whole]);
  const[skipExpired,setSkipExpired]=useState(()=>lsGet("ol-fzout-skipexp","1")==="1");
  useEffect(()=>lsSet("ol-fzout-skipexp",skipExpired?"1":"0"),[skipExpired]);
  const[onlyOut,setOnlyOut]=useState(()=>lsGet("ol-fzout-only","0")==="1");
  useEffect(()=>lsSet("ol-fzout-only",onlyOut?"1":"0"),[onlyOut]);
  const[locPref,setLocPref]=useState(()=>lsGet("ol-fzout-loc",""));
  useEffect(()=>lsSet("ol-fzout-loc",locPref),[locPref]);
  const[vendor,setVendor]=useState("");
  const[extraOrders,setExtraOrders]=useState([]);
  const[rawLots,setRawLots]=useState([]);
  const[lotErr,setLotErr]=useState("");
  const[lotLoading,setLotLoading]=useState(true);
  const[msg,setMsg]=useState("");
  const[saving,setSaving]=useState("");
  const[ask,setAsk]=useState(false);
  const[progress,setProgress]=useState(null);
  const printRef=useRef(null);

  const loadLots=useCallback(async()=>{
    try{const d=await rpc("ol_list_frozen",{p_admin_hash:adminHash});setRawLots(d?.lots||[]);setLotErr("")}
    catch(e){setLotErr(fzErr(e))}
    setLotLoading(false);
  },[adminHash]);
  useEffect(()=>{loadLots()},[loadLots]);
  useEffect(()=>{
    let alive=true;
    if(!selDate||!withExtra){setExtraOrders([]);return}
    rpc("ol_list_orders",{p_admin_hash:adminHash,p_from:selDate,p_to:selDate,p_extra:true})
      .then(d=>{if(alive)setExtraOrders(Array.isArray(d)?d:[])}).catch(()=>{if(alive)setExtraOrders([])});
    return()=>{alive=false};
  },[selDate,withExtra,adminHash]);

  // 직접 고친 출고 수량 — 날짜별로 {제품코드:{로트id:박스}}
  const manKey="ol-fzout-man:"+selDate;
  const[manual,setManual]=useState({});
  useEffect(()=>{try{setManual(JSON.parse(lsGet(manKey,"{}"))||{})}catch(e){setManual({})}},[manKey]);
  const saveManual=m=>{setManual(m);lsSet(manKey,JSON.stringify(m))};
  const doneKey="ol-fzout-done:"+selDate;
  const[doneInfo,setDoneInfo]=useState(null);
  useEffect(()=>{try{setDoneInfo(JSON.parse(lsGet(doneKey,"null")))}catch(e){setDoneInfo(null)}},[doneKey]);

  const allOrders=useMemo(()=>withExtra?[...orders,...extraOrders]:orders,[orders,extraOrders,withExtra]);
  const prodMap=useMemo(()=>Object.fromEntries(masters.products.map(p=>[p.code,p])),[masters.products]);
  const frozenOrders=useMemo(()=>allOrders.filter(o=>(o.items||[]).some(it=>storageOf(prodMap[it.code])==="frozen")),[allOrders,prodMap]);
  const vendors=useMemo(()=>[...new Set(frozenOrders.map(o=>(o.vendor||"").trim()))].sort(),[frozenOrders]);
  useEffect(()=>{if(vendor&&!vendors.includes(vendor))setVendor("")},[vendors]);
  const locations=useMemo(()=>[...new Set(rawLots.map(fzLoc))].filter(l=>l!==NO_LOC).sort(locCmp),[rawLots]);
  const locColor=loc=>{const i=locations.indexOf(loc);return i<0?"transparent":FZO_LOC_BG[i%FZO_LOC_BG.length]};
  const fullPlan=useMemo(()=>buildFzOutPlan(allOrders,prodMap,rawLots,{vendor,whole,locPref,skipExpired,manual}),
    [allOrders,prodMap,rawLots,vendor,whole,locPref,skipExpired,manual]);
  // 숨긴 제품(제품코드) — 날짜와 상관없이 이 브라우저에 기억. 숨기면 표·이미지·엑셀·출고 확정에서 모두 빠짐
  const[hiddenCodes,setHiddenCodes]=useState(()=>{try{return new Set(JSON.parse(lsGet("ol-fzout-hidden","[]")))}catch(e){return new Set()}});
  useEffect(()=>lsSet("ol-fzout-hidden",JSON.stringify([...hiddenCodes])),[hiddenCodes]);
  const hideItem=code=>setHiddenCodes(prev=>new Set([...prev,code]));
  const unhideItem=code=>setHiddenCodes(prev=>{const n=new Set(prev);n.delete(code);return n});
  const plan=useMemo(()=>fullPlan.filter(x=>!hiddenCodes.has(x.code)),[fullPlan,hiddenCodes]);
  const hiddenItems=fullPlan.filter(x=>hiddenCodes.has(x.code));
  const moves=plan.flatMap(it=>it.rows.filter(x=>x.out>0).map(x=>({it,x})));
  const shortItems=plan.filter(x=>x.short>0);
  const partial=plan.filter(x=>x.partial);
  const anyManual=plan.some(x=>x.manual);
  // 📦 제품별 / 🏭 생산지점별 보기
  const[view,setView]=useState(()=>lsGet("ol-fzout-view","product")==="floor"?"floor":"product");
  useEffect(()=>lsSet("ol-fzout-view",view),[view]);
  const floorGroups=useMemo(()=>fzOutSiteGroups(plan),[plan]);
  // 생산지점 선택 — 끈 지점만 기억(새 지점은 기본 선택)
  const[offFloors,setOffFloors]=useState(()=>{try{return new Set(JSON.parse(lsGet("ol-fzout-off","[]")))}catch(e){return new Set()}});
  useEffect(()=>lsSet("ol-fzout-off",JSON.stringify([...offFloors])),[offFloors]);
  const toggleFloor=f=>setOffFloors(prev=>{const n=new Set(prev);n.has(f)?n.delete(f):n.add(f);return n});
  const selGroups=floorGroups.filter(g=>!offFloors.has(g.floor));
  const floorRefs=useRef({});

  const setOut=(it,x,v)=>{
    const cur={};for(const r of it.rows)if(r.out>0)cur[r.lot.id]=r.out;
    if(v>0)cur[x.lot.id]=v;else delete cur[x.lot.id];
    // 발주 수량을 넘으면 다른 로트에서 덜어냄 (소비기한 늦은 로트부터) → 로트를 옮기듯 수정
    let over=fzoRound(Object.values(cur).reduce((a,b)=>a+b,0)-it.boxes);
    for(const r of [...it.rows].reverse()){
      if(over<=0)break;
      if(r.lot.id===x.lot.id||!cur[r.lot.id])continue;
      const t=Math.min(over,cur[r.lot.id]);
      cur[r.lot.id]=fzoRound(cur[r.lot.id]-t);if(!(cur[r.lot.id]>0))delete cur[r.lot.id];
      over=fzoRound(over-t);
    }
    saveManual({...manual,[it.code]:cur});
  };
  const resetItem=code=>{const m={...manual};delete m[code];saveManual(m)};
  const outCell=(it,x)=>x.usable
    ?<span style={{display:"inline-flex",alignItems:"center",gap:4}}><FzOutQtyCell key={x.lot.id+":"+x.out} value={x.out} max={x.stock} onSave={v=>setOut(it,x,v)}/></span>
    :(x.out>0?fmtBoxes(x.out):"");

  const confirm=async()=>{
    setAsk(false);setMsg("");
    const memo=`${fmtMd(selDate)} 입고 발주 출고${vendor?" · "+vendor:""}`;
    let fail=0;setProgress({done:0,total:moves.length});
    for(let i=0;i<moves.length;i++){
      const{x}=moves[i];
      // 박스 단위가 아닌 로트(팩·개)는 원래 단위로 환산해서 차감
      const u=(x.lot.unit||"박스").trim();
      const delta=u==="박스"||u===""?x.out:fzoRound(x.out*moves[i].it.per);
      try{await rpc("ol_frozen_change_qty",{p_admin_hash:adminHash,p_id:x.lot.id,p_delta:-delta,p_memo:memo})}
      catch(e){fail++}
      setProgress({done:i+1,total:moves.length});
    }
    setProgress(null);
    const info={at:Date.now(),boxes:fzoRound(moves.reduce((a,m)=>a+m.x.out,0)),fail};
    lsSet(doneKey,JSON.stringify(info));setDoneInfo(info);
    saveManual({});
    await loadLots();
    setMsg(fail?`⚠ ${fail}건 차감 실패 — 냉동재고 탭에서 확인하세요`:`✓ 재고에서 ${fmtBoxes(info.boxes)}박스를 차감했습니다`);
  };

  // kind: png | pdf / perFloor: 층별 보기에서 층마다 따로(층마다 새 쪽)
  const save=async(kind,perFloor)=>{
    const tag=kind+(perFloor?"-floor":"");
    setSaving(tag);setMsg("");
    try{
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      const safe=x=>String(x).replace(/[\\/:*?"<>|]/g,"_");
      const name=`냉동출고_${selDate}${vendor?"_"+safe(vendor):""}${view==="floor"?"_생산지점별":""}`;
      const jobs=perFloor?selGroups.map(g=>({el:floorRefs.current[g.floor],name:`냉동출고_${selDate}${vendor?"_"+safe(vendor):""}_${safe(g.floor)}`})):[{el:printRef.current,name}];
      const all=[];let count=0;
      for(const j of jobs){
        const pages=await shipA4Pages(j.el,{trim:kind==="png"});
        if(kind==="pdf"){all.push(...pages);continue}
        for(let i=0;i<pages.length;i++){downloadCanvas(pages[i],pages.length>1?`${j.name}_${i+1}쪽`:j.name);count++;await new Promise(r=>setTimeout(r,500))}
      }
      if(kind==="pdf"){shipPdf(all,name);count=all.length}
      setMsg(`${kind==="pdf"?"PDF":"이미지"} 저장했습니다 (A4 ${count}${kind==="pdf"?"쪽":"장"})`);
    }catch(e){setMsg("저장 실패: "+errMsg(e))}
    setSaving("");
  };

  const fmtAt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};

  return <div className="ol-layout">
    <DateList dates={dates} selected={selDate} onSelect={setSelDate}/>
    <div style={{minWidth:0}}>
      {lotErr&&<div className="ol-warn">{lotErr}</div>}
      {!selDate?<Empty emoji="📄" text="발주서 탭에서 발주서를 먼저 업로드하세요"/>:(loadingOrders||lotLoading)?<Loader/>:<>
        <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap",marginBottom:12}}>
          <div style={{fontSize:18,fontWeight:800}}>{selDate} ({dowOf(selDate)}) 냉동 출고</div>
          <div style={{display:"flex",alignItems:"center",gap:6,marginLeft:"auto"}}>
            <span style={{fontSize:12,color:"var(--muted)"}}>제목 머리말</span>
            <input className="ol-input" style={{width:110}} value={prefix} onChange={e=>setPrefix(e.target.value)}/>
          </div>
        </div>

        <div className="ol-toolbar">
          {progress?<span style={{fontSize:13,fontWeight:700,color:"#ef4444"}}>재고 차감 중… {progress.done}/{progress.total}</span>
           :ask?<span style={{display:"inline-flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{fontSize:13,fontWeight:700,color:"#ef4444"}}>로트 {moves.length}건, {fmtBoxes(moves.reduce((a,m)=>a+m.x.out,0))}박스를 냉동재고에서 차감할까요?</span>
              <button className="ol-btn ol-btn-danger ol-btn-sm" onClick={confirm}>차감</button>
              <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setAsk(false)}>취소</button></span>
           :<button className="ol-btn ol-btn-primary" disabled={!moves.length} onClick={()=>setAsk(true)} title="배정된 출고 수량만큼 냉동재고에서 출고 처리">✅ 출고 확정 (재고 차감)</button>}
          <div className="ol-subtabs">
            <button className={view==="product"?"on":""} onClick={()=>setView("product")}>📦 제품별</button>
            <button className={view==="floor"?"on":""} onClick={()=>setView("floor")}>🏭 생산지점별</button>
          </div>
          <button className="ol-btn ol-btn-secondary" disabled={!plan.length||!!saving||(view==="floor"&&!selGroups.length)} onClick={()=>save("png")}>{saving==="png"?"저장 중…":"🖼 이미지 (A4)"}</button>
          <button className="ol-btn ol-btn-secondary" disabled={!plan.length||!!saving||(view==="floor"&&!selGroups.length)} onClick={()=>save("pdf")}>{saving==="pdf"?"저장 중…":"📄 PDF"}</button>
          {view==="floor"&&selGroups.length>1&&<button className="ol-btn ol-btn-secondary" disabled={!!saving} onClick={()=>save("png",true)} title="생산지점마다 이미지 한 장씩">{saving==="png-floor"?"저장 중…":`🖼 지점별로 저장 (${selGroups.length}장)`}</button>}
          <button className="ol-btn ol-btn-secondary" disabled={!plan.length} onClick={()=>downloadFzOutXlsx(plan,selDate,prefix,vendor,onlyOut)}>📥 엑셀</button>
          <button className="ol-btn ol-btn-secondary" title="냉동재고 다시 불러오기" onClick={loadLots}>↻</button>
          {anyManual&&<button className="ol-btn ol-btn-secondary" onClick={()=>saveManual({})} title="직접 고친 출고 수량을 모두 지우고 자동 배정으로">↺ 모두 자동 배정</button>}
          {msg&&<span style={{fontSize:12,fontWeight:600,color:msg.startsWith("✓")||msg.includes("저장했")?"#16a34a":"#ef4444"}}>{msg}</span>}
        </div>

        <div className="ol-toolbar">
          <label className={"ol-check"+(whole?" on":"")} title="발주 수량을 혼자 다 채울 수 있는 로트가 있으면 그 로트에서만 출고(로트를 덜 쪼갬)"><input type="checkbox" checked={whole} onChange={e=>setWhole(e.target.checked)}/>한 로트에서 다 나가게 우선</label>
          <label className={"ol-check"+(skipExpired?" on":"")}><input type="checkbox" checked={skipExpired} onChange={e=>setSkipExpired(e.target.checked)}/>기한 지난 재고 제외</label>
          <label className={"ol-check"+(onlyOut?" on":"")}><input type="checkbox" checked={onlyOut} onChange={e=>setOnlyOut(e.target.checked)}/>출고하는 로트만 표시</label>
          <label className={"ol-check"+(withExtra?" on":"")}><input type="checkbox" checked={withExtra} onChange={e=>setWithExtra(e.target.checked)}/>추가 발주 포함{withExtra&&extraOrders.length>0&&` (${extraOrders.length}건)`}</label>
        </div>
        {locations.length>1&&<div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:12}}>
          <span style={{fontSize:12,color:"var(--muted)"}}>먼저 꺼낼 위치</span>
          <div className="ol-chips">
            <button className={!locPref?"on":""} onClick={()=>setLocPref("")}>상관없음 (소비기한 순)</button>
            {locations.map(l=><button key={l} className={locPref===l?"on":""} onClick={()=>setLocPref(l)}>📍 {l}</button>)}
          </div>
        </div>}
        {vendors.length>1&&<div className="ol-chips" style={{marginBottom:12}}>
          <button className={!vendor?"on":""} onClick={()=>setVendor("")}>전체 업체</button>
          {vendors.map(v=><button key={v} className={vendor===v?"on":""} onClick={()=>setVendor(v)}>{v||"(업체명 없음)"}</button>)}
        </div>}

        <div style={{fontSize:12,color:"var(--muted)",marginBottom:10}}>
          발주 수량(박스) = 발주 팩수량 ÷ 입수량 · 제품코드로 냉동재고와 연결 · 자동 배정 = {locPref?`📍${locPref} 먼저 → `:""}소비기한 빠른 순{whole?" (한 로트로 다 채울 수 있으면 그 로트만)":""} · 출고 수량 칸을 눌러 직접 고칠 수 있어요 (이 브라우저에 날짜별로 기억)
        </div>
        {doneInfo&&<div className="ol-warn" style={{padding:"8px 12px",borderColor:"#16a34a",color:"#15803d",background:"rgba(34,197,94,.08)"}}>
          ✓ 이 입고일은 {fmtAt(doneInfo.at)}에 {fmtBoxes(doneInfo.boxes)}박스를 재고에서 차감했습니다. 다시 확정하면 한 번 더 빠집니다.
          <button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginLeft:8}} onClick={()=>{lsSet(doneKey,"null");setDoneInfo(null)}}>표시 지우기</button>
        </div>}
        {shortItems.length>0&&<div className="ol-warn" style={{padding:"8px 12px"}}>⚠ 재고 부족: {shortItems.map(x=>`${shipNameOf(x.product)} ${fmtBoxes(x.short)}박스`).join(", ")}</div>}
        {partial.length>0&&<div className="ol-warn" style={{padding:"8px 12px"}}>⚠ 입수량으로 나누어떨어지지 않는 품목(빨강): {partial.map(x=>`${shipNameOf(x.product)} (${fmtNum(x.qty)}÷${x.per})`).join(", ")}</div>}
        {plan.some(x=>x.manual)&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}>
          <span style={{fontSize:12,color:"#7c3aed",fontWeight:700}}>✋ 직접 수정한 제품</span>
          {plan.filter(x=>x.manual).map(x=><button key={x.code} className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>resetItem(x.code)} title="자동 배정으로 되돌리기">{shipNameOf(x.product)} ↺</button>)}
        </div>}

        {hiddenItems.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}>
          <span style={{fontSize:12,color:"var(--muted)",fontWeight:700}}>🙈 숨긴 제품 {hiddenItems.length}개</span>
          {hiddenItems.map(x=><button key={x.code} className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>unhideItem(x.code)} title="다시 보이기">{shipNameOf(x.product)} · {fmtBoxes(x.boxes)}박스 👁</button>)}
          {hiddenItems.length>1&&<button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setHiddenCodes(new Set())}>모두 보이기</button>}
        </div>}

        {!plan.length?<Empty emoji="❄" text={hiddenItems.length?"모든 냉동 제품을 숨겼습니다 — 위에서 👁 눌러 다시 보이기":frozenOrders.length?"이 업체의 냉동 발주가 없습니다":"이 입고일 발주서에 냉동 제품이 없습니다 (제품리스트에서 보관을 ❄ 냉동으로 지정)"}/>:<>
          {view==="floor"&&floorGroups.length>0&&<div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:12}}>
            <span style={{fontSize:12,color:"var(--muted)",marginRight:2}}>표시·저장할 생산지점</span>
            {floorGroups.map(g=>{const on=!offFloors.has(g.floor);
              return <label key={g.floor} className={"ol-check"+(on?" on":"")}><input type="checkbox" checked={on} onChange={()=>toggleFloor(g.floor)}/>🏭 {g.floor} <span style={{color:"var(--muted)",fontWeight:500}}>{fmtBoxes(g.total)}박스</span></label>})}
            <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setOffFloors(new Set())}>전체 선택</button>
          </div>}
          {view==="product"
            ?<div className="ol-scroll"><FzOutSheet plan={plan} date={selDate} prefix={prefix} vendor={vendor} onlyOut={onlyOut} locColor={locColor} outCell={outCell} onHide={hideItem}/></div>
            :<div className="ol-scroll"><FzOutFloorSheet groups={selGroups} date={selDate} prefix={prefix} vendor={vendor} onlyOut={onlyOut} locColor={locColor} outCell={outCell} onHide={hideItem}/></div>}
          <div style={{position:"fixed",left:-20000,top:0,width:SHIP_PRINT_W,background:"#fff"}} aria-hidden="true">
            {view==="product"
              ?<FzOutSheet plan={plan} date={selDate} prefix={prefix} vendor={vendor} onlyOut={onlyOut} locColor={locColor} print refCb={el=>{printRef.current=el}}/>
              :<>
                <FzOutFloorSheet groups={selGroups} date={selDate} prefix={prefix} vendor={vendor} onlyOut={onlyOut} locColor={locColor} print refCb={el=>{printRef.current=el}}/>
                {selGroups.map(g=><FzOutFloorSheet key={g.floor} groups={[g]} date={selDate} prefix={prefix} vendor={vendor} onlyOut={onlyOut} locColor={locColor} print refCb={el=>{floorRefs.current[g.floor]=el}}/>)}
              </>}
          </div>
        </>}
      </>}
    </div>
  </div>;
}

const VALID_TABS=["products","orders","lists","ship","frozen","fzout","extra"];
function getTabFromHash(){const h=(window.location.hash||"").replace("#","");return VALID_TABS.includes(h)?h:"orders"}

function App(){
  const[theme,setTheme]=useState(getStoredTheme());
  // 비밀번호 없이 접근 (RPC는 p_admin_hash를 무시)
  const adminHash="";
  const loggedIn=true;
  const[tab,setTab]=useState(getTabFromHash());
  const[masters,setMasters]=useState({products:[],box_specs:[],methods:[],sites:[],settings:{}});
  const[mastersErr,setMastersErr]=useState("");

  useEffect(()=>{applyTheme(theme)},[theme]);
  const toggleTheme=()=>{const t=theme==="dark"?"light":"dark";setTheme(t);setStoredTheme(t)};
  useEffect(()=>{const h="#"+tab;if(window.location.hash!==h)history.replaceState(null,"",h)},[tab]);
  useEffect(()=>{const fn=()=>setTab(getTabFromHash());window.addEventListener("hashchange",fn);return()=>window.removeEventListener("hashchange",fn)},[]);

  const reloadMasters=useCallback(async()=>{
    try{
      const d=await rpc("ol_list_masters",{p_admin_hash:adminHash});
      setMasters({products:d?.products||[],box_specs:d?.box_specs||[],methods:d?.methods||[],sites:d?.sites||[],settings:d?.settings||{}});
      setMastersErr("");
    }catch(e){setMastersErr(errMsg(e))}
  },[adminHash]);
  useEffect(()=>{if(loggedIn)reloadMasters()},[loggedIn]);
  const main=useOrderData(adminHash,false,setMastersErr);
  const extraData=useOrderData(adminHash,true,setMastersErr);
  const[extraSub,setExtraSub]=useState(()=>lsGet("ol-extra-sub","orders")==="lists"?"lists":"orders");
  useEffect(()=>lsSet("ol-extra-sub",extraSub),[extraSub]);

  // 탭을 옮기면 그 탭 데이터 새로 읽기 (다른 탭에서 같은 발주번호를 올려 옮겨졌을 수 있음)
  const firstTab=useRef(true);
  useEffect(()=>{
    if(firstTab.current){firstTab.current=false;return}
    const d=tab==="extra"?extraData:(tab==="products"||tab==="frozen")?null:main;
    if(d){d.reloadDates();d.reloadOrders(d.selDate)}
  },[tab]);

  const shared={adminHash,masters,reloadMasters,...main};
  const sharedExtra={adminHash,masters,reloadMasters,...extraData,extra:true};

  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <header className="ol-header">
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <a href="aps.html" style={{fontSize:14,fontWeight:700,color:"var(--text)",textDecoration:"none"}}>← APS</a>
        <span style={{fontSize:13,color:"var(--muted)"}}>|</span>
        <span style={{fontSize:18}}>🚚</span>
        <span style={{fontWeight:700,fontSize:15}}>자동 리스트 생성기</span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <button onClick={toggleTheme} style={{background:"none",border:"none",fontSize:20,cursor:"pointer"}}>{theme==="dark"?"☀️":"🌙"}</button>
      </div>
    </header>
    <div className="ol-shell" style={{flex:1,width:"100%"}}>
      {<>
        <div className="ol-tabs">
          <button className={"ol-tab"+(tab==="products"?" active":"")} onClick={()=>setTab("products")}>📦 제품리스트</button>
          <button className={"ol-tab"+(tab==="orders"?" active":"")} onClick={()=>setTab("orders")}>📄 발주서</button>
          <button className={"ol-tab"+(tab==="lists"?" active":"")} onClick={()=>setTab("lists")}>🗂 발주리스트</button>
          <button className={"ol-tab"+(tab==="ship"?" active":"")} onClick={()=>setTab("ship")}>🚚 출고장</button>
          <button className={"ol-tab"+(tab==="frozen"?" active":"")} onClick={()=>setTab("frozen")}>❄ 냉동재고</button>
          <button className={"ol-tab"+(tab==="fzout"?" active":"")} onClick={()=>setTab("fzout")}>📤 냉동 출고</button>
          <button className={"ol-tab"+(tab==="extra"?" active":"")} onClick={()=>setTab("extra")}>➕ 추가 발주</button>
        </div>
        {mastersErr&&<div className="ol-warn">{mastersErr}</div>}
        {tab==="products"&&<ProductsTab {...shared}/>}
        {tab==="orders"&&<OrdersTab {...shared}/>}
        {tab==="lists"&&<ListsTab {...shared}/>}
        {tab==="ship"&&<ShipTab {...shared}/>}
        {tab==="frozen"&&<FrozenTab adminHash={adminHash} masters={masters}/>}
        {tab==="fzout"&&<FzOutTab {...shared}/>}
        {tab==="extra"&&<>
          <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap",marginBottom:12}}>
            <div className="ol-subtabs">
              <button className={extraSub==="orders"?"on":""} onClick={()=>setExtraSub("orders")}>📄 추가 발주서</button>
              <button className={extraSub==="lists"?"on":""} onClick={()=>setExtraSub("lists")}>🗂 추가 발주리스트</button>
            </div>
            <span style={{fontSize:12,color:"var(--muted)"}}>작업이 끝난 뒤 들어온 발주서는 여기에 올리세요 — 기존 발주리스트와 섞이지 않고, 발주서마다 따로 적재됩니다</span>
          </div>
          {extraSub==="orders"?<OrdersTab {...sharedExtra}/>:<ListsTab {...sharedExtra}/>}
        </>}
      </>}
    </div>
    <footer style={{borderTop:"1px solid var(--div2)",maxWidth:1200,margin:"0 auto",padding:"14px 32px",color:"var(--dimmer)",fontSize:12,width:"100%",boxSizing:"border-box",textAlign:"center"}}>
      STOCKPULSE · 자동 리스트 생성기
    </footer>
  </div>;
}

// ?pricecap=… → 북마크 버튼이 연 가격 저장 창
const capPayload=(()=>{
  const s=new URLSearchParams(location.search).get("pricecap");
  if(s==null)return null;
  try{const o=JSON.parse(s);return o&&typeof o==="object"?o:{}}catch(e){return {}}
})();
ReactDOM.createRoot(document.getElementById("root")).render(capPayload?<PriceCapture payload={capPayload}/>:<App/>);
</script>
</body>
</html>

// ═══════════════════════════════════════════
// 적재 이미지
// ═══════════════════════════════════════════
// 연속된 같은 제품·같은 박스수 단독 파렛트 묶기 → "7/3-4 · 40개 / 2파렛"
function groupSinglePallets(pallets){
  const out=[];
  for(const p of pallets){
    if(p.kind!=="single")continue;
    const ln=p.lines[0];
    const last=out[out.length-1];
    if(last&&last.code===ln.product.code&&last.count===ln.count&&last.to===p.no-1){last.to=p.no;last.n++}
    else out.push({code:ln.product.code,product:ln.product,count:ln.count,from:p.no,to:p.no,n:1});
  }
  return out;
}
// 혼적 파렛트 한 층의 자리(방)에 박스를 고르게 배분 → 자리마다 [{ln,n}] (아래→위)
// 모든 자리 높이를 ⌊전체÷자리⌋ 또는 ⌈전체÷자리⌉로 맞춤 (예: 26박스·6방 → 4·4·4·4·5·5, 555551 같은 낮은 자리 없음)
// 어느 자리를 높게 할지 + 제품 순서를 모두 시험해 한 자리에 두 제품이 섞이는 경우를 최소화
//   예: 10+10 → 4·3·3 / 4·3·3 (안 섞임) · 25+1 → 마지막 자리에 25박스 제품 4 + 1박스 제품 1
const _mixedCache=new Map();
function layoutMixed(lines,slots){
  const ck=slots+"|"+lines.map(l=>l.product.code+":"+l.count+":"+l.item.line_no).join(",");
  const hit=_mixedCache.get(ck);
  if(hit&&hit.lines.length===lines.length&&hit.lines.every((l,i)=>l===lines[i]))return hit.cells;
  const cells=layoutMixedCalc(lines,slots);
  _mixedCache.set(ck,{lines,cells});
  return cells;
}
function layoutMixedCalc(lines,slots){
  return pourBalanced(lines.map(l=>l.count),Math.max(1,slots)).map(b=>{
    if(!b.length)return null;
    const parts=b.map(({i,n})=>({ln:lines[i],n}));
    return{parts,ln:parts[0].ln,n:parts.reduce((a,x)=>a+x.n,0)};
  });
}
const imgName=p=>p.image_name||p.name;
const shipNameOf=p=>(p?.ship_name||"").trim()||p?.name||"";
// 출고장 제품명 안의 숫자 + 바로 뒤 g/kg 단위(500g, 1.5kg, 2 등)만 굵고 진하게 → 규격이 눈에 잘 띄게
const boldDigits=(text,dim)=>String(text).split(/(\d+(?:[.,]\d+)*(?:\s*(?:kg|g))?)/i).map((t,i)=>i%2?<b key={i} style={{fontWeight:900,color:dim?"#9ca3af":"#000"}}>{t}</b>:t);

// ── 적재이미지 편집 (위치 이동 + 글씨 수정) ──
// 편집 내용은 ol_settings에 key = "img:{발주번호}:{생산지점}" 로 저장 (PC·모바일 공유)
// sig(파렛트 구성 요약)가 달라지면(발주서 재업로드 등) 이전 편집은 무시
const imgEditCache=new Map();
// 저장 용지 (mm, 가로만) — 300dpi로 렌더링, 사방 여백 PAPER_MARGIN_MM
const PAPER_SIZES={
  "A4-l":{label:"A4 가로",w:297,h:210},
  "A3-l":{label:"A3 가로",w:420,h:297}
};
const PAPER_MARGIN_MM=10;
function imgEditKey(group){return `img:${group.order.order_no}:${group.site}${group.splitStorage?":"+group.storage:""}`}
function imageSig(group){
  const ps=group.pallets,first=ps[0]?.no||1,total=ps[0]?.total||ps.length;
  // 다른 생산지점과 번호를 이어 쓰면 번호 정보도 포함 (블록 id가 번호 기준이라 번호가 바뀌면 이전 편집 무시)
  const numbering=first!==1||total!==ps.length?`#${first}/${total}|`:"";
  // 제품 수가 자리 수보다 많은 혼적은 2026-10-15부터 자리 배치가 바뀌어(자리 늘림 → 한 자리에 여러 제품) 예전 편집 무시
  return numbering+ps.map(p=>p.kind[0]+p.lines.map(l=>l.product.code+":"+l.count).join(",")+(p.kind==="mixed"&&p.lines.length>(p.slots||6)?"~s":"")).join("|");
}

// 더블클릭으로 글씨 수정 (Enter 저장 · Shift+Enter 줄바꿈 · Esc 취소)
// base: 기본 글씨 크기(px) · ed.size[id]: 개별 크기 · ed.scale: 전체 배율(%)
// 크기 조절 드래그 (오른쪽·아래로 끌면 커짐) — items:[{id,base}] 를 같은 비율로, 놓을 때 저장
function startScaleDrag(e,el,items,onLive,onCommit){
  if(!el||!items.length)return;
  e.stopPropagation();e.preventDefault();
  const h0=Math.max(10,el.getBoundingClientRect().height),sx=e.clientX,sy=e.clientY;
  let last=null;
  const move=ev=>{
    const d=((ev.clientX-sx)+(ev.clientY-sy))/2;
    const k=Math.max(0.2,(h0+d)/h0);
    last={};items.forEach(it=>{last[it.id]=Math.min(it.max??120,Math.max(it.min??8,Math.round(it.base*k)))});
    onLive(last);
  };
  const up=()=>{
    window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
    onLive({});if(last)onCommit(last);
  };
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
}
// 크기 조절 대상([data-tid]) → {id,base,min,max}. 글씨는 px(8~120), 혼적 표 칸(data-kind="box")은 %(30~300)
function scaleItemOf(el,sizes){
  const id=el.dataset.tid;
  return{id,base:sizes?.[id]??Number(el.dataset.base),min:el.dataset.min?Number(el.dataset.min):8,max:el.dataset.max?Number(el.dataset.max):120,box:el.dataset.kind==="box"};
}
const HANDLE_STYLE={position:"absolute",width:11,height:11,background:"#06b6d4",border:"1.5px solid #fff",borderRadius:2,boxShadow:"0 0 0 1px #06b6d4",cursor:"nwse-resize",touchAction:"none",zIndex:6};

function EditText({id,value,base,edit,ed,onText,selected,onSelect,onScaleSel,style}){
  const[active,setActive]=useState(false);
  const ref=useRef(null);
  const texts=ed.text;
  const shown=texts&&texts[id]!=null?texts[id]:String(value);
  const px=Math.round((ed.size?.[id]??base)*(ed.scale||100)/100);
  useEffect(()=>{
    if(!active||!ref.current)return;
    ref.current.focus();
    const r=document.createRange();r.selectNodeContents(ref.current);
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
  },[active]);
  useEffect(()=>{if(!edit)setActive(false)},[edit]);
  const commit=()=>{
    const t=(ref.current?.innerText||"").replace(/\n+$/,"");
    setActive(false);
    if(t!==shown)onText(id,t===String(value)?null:t);
  };
  return <div key={shown+(active?"#":"")} ref={ref} data-tid={id} data-base={base}
    contentEditable={active} suppressContentEditableWarning
    title={edit&&!active?"클릭: 선택(크기 조절) · Shift/Ctrl+클릭: 여러 개 선택 · 더블클릭: 글씨 수정":undefined}
    onClick={e=>{if(edit&&onSelect)onSelect(id,e.shiftKey||e.ctrlKey||e.metaKey)}}
    onDoubleClick={e=>{if(edit){e.stopPropagation();setActive(true)}}}
    onBlur={()=>{if(active)commit()}}
    onKeyDown={e=>{
      if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ref.current.blur()}
      if(e.key==="Escape"){e.preventDefault();setActive(false)}
    }}
    style={{width:"fit-content",maxWidth:"100%",marginLeft:"auto",marginRight:"auto",...style,position:"relative",fontSize:px,whiteSpace:"pre-wrap",outline:active?"2px solid #06b6d4":(edit&&selected?"2px solid #f59e0b":"none"),outlineOffset:1,cursor:active?"text":undefined,userSelect:active?"text":undefined,minWidth:active?20:undefined,minHeight:edit&&!shown?"1em":undefined}}
  >{shown}{edit&&selected&&!active&&onScaleSel&&<span contentEditable={false} title="끌어서 선택한 글씨 크기 조절"
      onPointerDown={e=>onScaleSel(e,ref.current)}
      style={{...HANDLE_STYLE,right:-7,bottom:-7}}/>}</div>;
}

// 편집 모드에서 끌어서 위치 이동 (원래 자리 기준 상대 이동량 dx/dy 저장)
// 다른 블록의 왼쪽·가운데·오른쪽 / 위·가운데·아래 선, 이미지 가로 중앙에 SNAP_PX 이내로 오면 붙고 안내선 표시 (Alt 누르면 끔)
// 오른쪽 아래 핸들을 끌면 블록 안 글씨 전체 크기 조절
const SNAP_PX=6;
function snapTo(lines,targets){
  let best=null;
  for(const a of lines)for(const t of targets){const d=t-a;if(Math.abs(d)<=SNAP_PX&&(!best||Math.abs(d)<Math.abs(best.d)))best={d,t}}
  return best;
}
// inner: 다른 블록 안의 작은 블록(혼적 칸 글씨) — 누르면 바깥 블록은 안 움직임, 옅은 점선·크기 핸들 없음
function DragBlock({id,edit,pos,onMove,onGuides,sizes,onLiveSize,onCommitSize,inner,style,children}){
  const base=pos[id]||{dx:0,dy:0};
  const[drag,setDrag]=useState(null);
  // 용지 화면은 축소/확대(transform)되어 보이므로 화면 이동량 ÷ z = 실제 이동량
  const cur=drag?{dx:base.dx+drag.x/drag.z,dy:base.dy+drag.y/drag.z}:base;
  const elRef=useRef(null);
  // 포인터 캡처를 쓰면 더블클릭이 글씨까지 안 내려가므로 window 이벤트로 추적
  const dragRef=useRef(null);
  const down=e=>{
    if(!edit||e.button>0||e.target.isContentEditable)return;
    if(e.shiftKey)return; // Shift+드래그 = 범위 선택 (용지 화면이 처리)
    e.stopPropagation(); // 안쪽 블록을 잡으면 그 블록만 이동
    if(e.pointerType==="mouse")e.preventDefault();
    const el=elRef.current,root=el.closest("[data-imgroot]");
    const r=el.getBoundingClientRect(),rr=root.getBoundingClientRect();
    const vx=[rr.left+rr.width/2],hy=[];
    root.querySelectorAll("[data-bid]").forEach(o=>{
      if(o===el||el.contains(o)||o.contains(el))return; // 자기 자신·안쪽·바깥 블록은 기준선 제외
      const b=o.getBoundingClientRect();
      vx.push(b.left,b.left+b.width/2,b.right);hy.push(b.top,b.top+b.height/2,b.bottom);
    });
    const z=(rr.width/root.offsetWidth)||1;
    dragRef.current={sx:e.clientX,sy:e.clientY,x:0,y:0,z,r,rr,vx,hy};
    setDrag(dragRef.current);
  };
  useEffect(()=>{
    if(!drag)return;
    const move=e=>{
      const d=dragRef.current;if(!d)return;
      let x=e.clientX-d.sx,y=e.clientY-d.sy;
      let g=null;
      if(!e.altKey){
        const L=d.r.left+x,T=d.r.top+y,W=d.r.width,H=d.r.height;
        const sx=snapTo([L,L+W/2,L+W],d.vx),sy=snapTo([T,T+H/2,T+H],d.hy);
        if(sx)x+=sx.d;
        if(sy)y+=sy.d;
        if(sx||sy)g={v:sx?(sx.t-d.rr.left)/d.z:null,h:sy?(sy.t-d.rr.top)/d.z:null};
      }
      onGuides&&onGuides(g);
      dragRef.current={...d,x,y};
      setDrag(dragRef.current);
    };
    const up=()=>{
      const d=dragRef.current;dragRef.current=null;setDrag(null);onGuides&&onGuides(null);
      if(d&&(Math.abs(d.x)>2||Math.abs(d.y)>2))onMove(id,{dx:Math.round(base.dx+d.x/d.z),dy:Math.round(base.dy+d.y/d.z)});    };
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
    window.addEventListener("pointercancel",up);
    return()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up)};
  },[!!drag]);
  const resizeDown=e=>{
    const el=elRef.current;
    const items=[...el.querySelectorAll("[data-tid]")].map(t=>scaleItemOf(t,sizes));
    startScaleDrag(e,el,items,onLiveSize,onCommitSize);
  };
  // 상자는 내용(글씨) 크기만큼만 — 좌우 auto 마진으로 원래처럼 가운데 정렬
  return <div ref={elRef} data-bid={id} onPointerDown={down}
    style={{width:"fit-content",maxWidth:"100%",marginLeft:"auto",marginRight:"auto",...style,position:"relative",left:cur.dx,top:cur.dy,
      cursor:edit?(drag?"grabbing":"grab"):undefined,
      outline:edit?(inner?"1px dashed rgba(6,182,212,0.4)":"1px dashed rgba(6,182,212,0.8)"):"none",outlineOffset:inner?1:4,
      touchAction:edit?"none":undefined,userSelect:edit?"none":undefined,zIndex:drag?5:undefined}}>
    {children}
    {edit&&onCommitSize&&!inner&&<span title="끌어서 블록 글씨 전체 크기 조절" onPointerDown={resizeDown} style={{...HANDLE_STYLE,right:-10,bottom:-10}}/>}
  </div>;
}

function LoadImage({group,date,prefix,refCb,edit,ed:edSaved,live,onMove,onText,sel,onSelect,onScaleSel,onLiveSize,onCommitSize}){
  const[guides,setGuides]=useState(null);
  const selSet=new Set(sel||[]);
  const ed=live&&Object.keys(live).length?{...edSaved,size:{...edSaved.size,...live}}:edSaved;
  const pallets=group.pallets;
  const total=pallets[0]?.total||pallets.length; // 같은 업체의 다른 생산지점까지 합친 총 파렛트 수
  const singles=groupSinglePallets(pallets);
  const mixed=pallets.filter(p=>p.kind==="mixed");
  const font="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
  const T=(id,value,base,style)=><EditText id={id} value={value} base={base} edit={edit} ed={ed} onText={onText} selected={selSet.has(id)} onSelect={onSelect} onScaleSel={onScaleSel} style={style}/>;
  const D=(id,style,children,inner)=><DragBlock key={id} id={id} edit={edit} pos={ed.pos} onMove={onMove} onGuides={setGuides} sizes={edSaved.size} onLiveSize={onLiveSize} onCommitSize={onCommitSize} inner={inner} style={style}>{children}</DragBlock>;
  return <div ref={refCb} data-imgroot="1" style={{position:"relative",width:920,background:"#ffffff",color:"#111",padding:"34px 40px 40px",boxSizing:"border-box",fontFamily:font,overflow:"hidden"}}>
    {edit&&guides?.v!=null&&<div style={{position:"absolute",left:guides.v,top:0,bottom:0,width:0,borderLeft:"1px solid #ec4899",zIndex:20,pointerEvents:"none"}}/>}
    {edit&&guides?.h!=null&&<div style={{position:"absolute",top:guides.h,left:0,right:0,height:0,borderTop:"1px solid #ec4899",zIndex:20,pointerEvents:"none"}}/>}
    {/* 추가한 글씨: 이미지 가운데쯤에서 시작, 끌어서 위치 이동 (블록 id = x…, 글씨 id = x….t) */}
    {(ed.extra||[]).map(x=><div key={x.id} style={{position:"absolute",left:0,right:0,top:"45%",pointerEvents:"none",zIndex:4}}>
      {D(x.id,{pointerEvents:"auto"},T(x.id+".t","새 글씨",24,{fontWeight:800,color:x.color||"#111111"}))}
    </div>)}
    {/* 소제목(생산지점·센터·발주번호)은 제목줄(제목 + 총 파렛 수) 왼쪽 밑에 붙여 함께 이동 */}
    {D("hd",{display:"flex",flexDirection:"column",alignItems:"flex-start",marginBottom:26},<>
      <div style={{display:"flex",alignItems:"baseline",gap:40}}>
        {T("title",`${prefix} ${fmtMd(date)}일 (${dowOf(date)}) 적재리스트`,28,{fontWeight:800,marginLeft:0,marginRight:0})}
        {T("total",`총${total}파렛`,46,{fontWeight:900,marginLeft:0,marginRight:0})}
      </div>
      {T("sub",`${group.site}${group.splitStorage?` (${group.storage==="frozen"?"냉동":"냉장"})`:""} · ${group.order.center} · 발주 ${group.order.order_no}`,13,{color:"#666",marginTop:2,marginLeft:0,marginRight:0})}
    </>)}
    <div style={{display:"flex",gap:30,alignItems:"flex-start"}}>
      <div style={{flex:1,display:"grid",gridTemplateColumns:"1fr 1fr",rowGap:34,columnGap:20}}>
        {singles.map(s=>{
          const k="s"+s.from;
          return D(k,{textAlign:"center",color:s.product.color,fontWeight:800,lineHeight:1.5},<>
            {T(k+".l",`${total}/${s.from}${s.to>s.from?`-${s.to}`:""}`,21)}
            {T(k+".n",imgName(s.product),21)}
            {T(k+".q",`${s.count}개 / ${s.n}파렛`,21)}
          </>);
        })}
      </div>
      {mixed.length>0&&<div style={{display:"flex",flexDirection:"column",gap:24}}>
        {mixed.map(p=>{
          const k="m"+p.no;
          const cols=Math.max(1,p.cols||3);
          // 자리 수는 항상 층당 방 수(6) — 제품이 더 많으면 한 자리에 여러 제품을 나눠 쌓음 (예전엔 자리를 늘려 3번째 줄이 생기며 깨졌음)
          const cells=layoutMixed(p.lines,Math.max(1,p.slots||6));
          const rows=[];for(let i=0;i<cells.length;i+=cols)rows.push(cells.slice(i,i+cols));
          // 표 칸 크기 = 칸 배율(size[k.box], %) × 전체 배율 — 블록 ■ 크기 조절·전체 글씨 배율 때 글씨와 같이 커지고 작아짐
          const bk=k+".box",bs=(ed.size?.[bk]??100)/100*(ed.scale||100)/100;
          return D(k,{},
            <table data-tid={bk} data-base={100} data-min={30} data-max={300} data-kind="box"
              style={{borderCollapse:"collapse",outline:edit&&selSet.has(bk)?"2px solid #f59e0b":"none",outlineOffset:2}}><tbody>
              {rows.map((row,ri)=><tr key={ri}>
                {row.map((c,ci)=>{
                  const ck=`${k}.c${ri*cols+ci}`;
                  // 한 자리에 두 제품이 섞이면 위쪽 제품부터 위에 표시 (글씨 id: 첫 제품 .n/.c, 다음 .p1.n/.p1.c …)
                  const parts=c?[...c.parts].map((x,pi)=>({...x,pi})).reverse():[];
                  return <td key={ci} style={{border:"1.5px solid #333",width:Math.round(132*bs),height:Math.round(128*bs),textAlign:"center",verticalAlign:"middle",position:"relative",color:c?c.ln.product.color:"#111",fontWeight:800,lineHeight:1.35,padding:Math.max(1,Math.round(4*bs))}}>
                    {ri===0&&ci===0&&<div style={{position:"absolute",top:Math.round(6*bs),left:Math.round(10*bs),color:"#111",fontWeight:800,zIndex:1}}>{D(k+".lb",{marginLeft:0,marginRight:0},T(k+".label",`${total}-${p.no}`,16),true)}</div>}
                    {parts.map((x,j)=>{
                      const pk=x.pi===0?ck:`${ck}.p${x.pi}`;
                      // 제품이 3개 이상 섞인 자리는 글씨를 줄이고 이름·수량을 한 줄로
                      const many=parts.length>=3,fs=parts.length>=4?11:many?12:parts.length===2?14:17;
                      // 칸 안 제품 글씨(이름+수량)는 따로 끌어서 이동 가능 (블록 id = 글씨 id 앞부분 + ".m")
                      return <div key={x.pi} style={{color:x.ln.product.color,marginTop:j>0?4:0}}>
                        {D(pk+".m",many?{display:"flex",flexWrap:"wrap",justifyContent:"center",alignItems:"baseline",columnGap:4}:{},<>
                          {T(pk+".n",imgName(x.ln.product),fs,many?{marginLeft:0,marginRight:0}:undefined)}{T(pk+".c",String(x.n),fs,many?{marginLeft:0,marginRight:0}:undefined)}
                        </>,true)}
                      </div>;
                    })}
                  </td>;
                })}
              </tr>)}
            </tbody></table>);
        })}
      </div>}
    </div>
  </div>;
}

// 저장/화면 공통: 이미지에서 용지에 넣을 범위 (fitPaper면 블록들이 있는 범위 + 6px, 아니면 전체)
// 화면은 transform으로 축소돼 있을 수 있으므로 z로 나눠 실제 px로 환산
function contentCrop(el,fitPaper){
  const full={x:0,y:0,w:el.offsetWidth,h:el.offsetHeight};
  if(!fitPaper)return full;
  const er=el.getBoundingClientRect(),z=(er.width/el.offsetWidth)||1;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  el.querySelectorAll("[data-bid]").forEach(b=>{const r=b.getBoundingClientRect();if(!r.width||!r.height)return;x0=Math.min(x0,r.left);y0=Math.min(y0,r.top);x1=Math.max(x1,r.right);y1=Math.max(y1,r.bottom)});
  if(!(x1>x0&&y1>y0))return full;
  const pad=6;
  const cx=Math.max(0,(x0-er.left)/z-pad),cy=Math.max(0,(y0-er.top)/z-pad);
  return{x:cx,y:cy,w:Math.min(full.w,(x1-er.left)/z+pad)-cx,h:Math.min(full.h,(y1-er.top)/z+pad)-cy};
}
const PAGE_VIEW_MAX=1100; // 화면에 보이는 용지 최대 폭(px) — 실제 폭은 영역 너비에 맞춤

function LoadImageCard({group,date,prefix,adminHash,masters}){
  const key=imgEditKey(group);
  const sig=imageSig(group);
  const stored=imgEditCache.has(key)?imgEditCache.get(key):masters.settings?.[key];
  const blank={sig,pos:{},text:{},size:{},scale:100,extra:[]};
  const fresh=()=>stored&&stored.sig===sig?{...blank,pos:stored.pos||{},text:stored.text||{},size:stored.size||{},scale:stored.scale||100,extra:stored.extra||[]}:blank;
  const[ed,setEd]=useState(fresh);
  const edRef=useRef(ed);
  // 되돌리기/다시 실행 기록 (이 화면에서 한 편집만, 최대 100단계 — 새로고침하면 초기화)
  const undoRef=useRef([]),redoRef=useRef([]);
  const[histTick,setHistTick]=useState(0);
  useEffect(()=>{const v=fresh();setEd(v);edRef.current=v;undoRef.current=[];redoRef.current=[];setHistTick(t=>t+1)},[key,sig]);
  const[edit,setEdit]=useState(false);
  // 크기 조절할 선택된 글씨 id 목록 (여러 개 가능 — Shift/Ctrl+클릭, 빈 곳 드래그 범위 선택)
  const[selArr,setSelArr]=useState([]);
  const sel=selArr;
  const setSel=v=>setSelArr(v==null?[]:Array.isArray(v)?v:[v]);
  const onSelect=(id,add)=>setSelArr(cur=>add?(cur.includes(id)?cur.filter(x=>x!==id):[...cur,id]):[id]);
  useEffect(()=>{if(!edit)setSel(null)},[edit]);
  const[status,setStatus]=useState("");
  const[saving,setSaving]=useState(false);
  const elRef=useRef(null);
  const countEdits=v=>Object.keys(v.pos||{}).length+Object.keys(v.text||{}).length+Object.keys(v.size||{}).length+((v.scale||100)!==100?1:0)+(v.extra||[]).length;
  const staleDropped=!!stored&&stored.sig!==sig&&countEdits(stored)>0;
  const edited=countEdits(ed)>0;

  const persist=async(next,fromHistory)=>{
    if(!fromHistory){
      undoRef.current=[...undoRef.current,edRef.current].slice(-100);
      redoRef.current=[];setHistTick(t=>t+1);
    }
    edRef.current=next;setEd(next);imgEditCache.set(key,next);
    setStatus("저장 중…");
    try{await rpc("ol_set_setting",{p_admin_hash:adminHash,p_key:key,p_value:next});setStatus("✓ 저장됨")}
    catch(e){setStatus("⚠ "+errMsg(e))}
  };
  const onMove=(id,p)=>persist({...edRef.current,pos:{...edRef.current.pos,[id]:p}});
  const onText=(id,t)=>{
    // 추가한 글씨를 비우면 글씨 자체를 삭제
    if(/^x[^.]*\.t$/.test(id)&&t===""){removeExtra(id.slice(0,-2));return}
    const text={...edRef.current.text};
    if(t==null)delete text[id];else text[id]=t;
    persist({...edRef.current,text});
  };
  const undo=()=>{
    if(!undoRef.current.length)return;
    const prev=undoRef.current[undoRef.current.length-1];
    undoRef.current=undoRef.current.slice(0,-1);
    redoRef.current=[...redoRef.current,edRef.current];
    setHistTick(t=>t+1);setSel(null);persist(prev,true);
  };
  const redo=()=>{
    if(!redoRef.current.length)return;
    const next=redoRef.current[redoRef.current.length-1];
    redoRef.current=redoRef.current.slice(0,-1);
    undoRef.current=[...undoRef.current,edRef.current];
    setHistTick(t=>t+1);setSel(null);persist(next,true);
  };
  // 편집 중 Ctrl+Z 되돌리기 / Ctrl+Y·Ctrl+Shift+Z 다시 실행 (글씨 입력 중에는 브라우저 기본 동작)
  const histKeys=useRef(null);histKeys.current={undo,redo};
  useEffect(()=>{
    if(!edit)return;
    const onKey=e=>{
      const t=e.target;
      if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
      if(e.key==="Escape"){setSelArr([]);return} // 선택 해제
      if(!(e.ctrlKey||e.metaKey)||e.altKey)return;
      const k=e.key.toLowerCase();
      if(k==="z"&&!e.shiftKey){e.preventDefault();histKeys.current.undo()}
      else if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();histKeys.current.redo()}
    };
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[edit]);
  // 글씨 추가 / 삭제 / 색
  const addExtra=()=>{
    const id="x"+Date.now().toString(36);
    persist({...edRef.current,extra:[...(edRef.current.extra||[]),{id,color:"#111111"}]});
    setSel(id+".t");
  };
  const removeExtra=bid=>{
    const cur=edRef.current;
    const strip=o=>{const n={...(o||{})};delete n[bid];delete n[bid+".t"];return n};
    persist({...cur,extra:(cur.extra||[]).filter(x=>x.id!==bid),pos:strip(cur.pos),text:strip(cur.text),size:strip(cur.size)});
    setSel(null);
  };
  const setExtraColor=(bid,color)=>persist({...edRef.current,extra:(edRef.current.extra||[]).map(x=>x.id===bid?{...x,color}:x)});
  const selExtra=sel.length===1&&/^x[^.]*\.t$/.test(sel[0])?(ed.extra||[]).find(x=>x.id+".t"===sel[0]):null;
  // 원래대로: 브라우저 confirm() 창이 안 뜨는 환경이 있어 화면 안에서 한 번 더 확인
  const[askReset,setAskReset]=useState(false);
  const reset=()=>{setAskReset(false);setSel(null);persist(blank)};

  // 글씨 크기: 선택한 글씨(여러 개 가능) / 전체 배율(%)
  const selItems=()=>{
    const root=elRef.current;if(!root)return[];
    return sel.map(id=>{const el=root.querySelector(`[data-tid="${CSS.escape(id)}"]`);return el?scaleItemOf(el,edRef.current.size):null}).filter(Boolean);
  };
  const selOne=sel.length===1?selItems()[0]:null;
  const selPx=selOne?selOne.base:null;
  // 글씨 하나: ±2px · 여러 개 또는 표 칸: 각각 ±10% (비율 유지)
  const changeSize=dir=>{
    const its=selItems();if(!its.length)return;
    const size={...edRef.current.size};
    its.forEach(it=>{
      let n=its.length===1&&!it.box?it.base+2*dir:Math.round(it.base*(1+0.1*dir));
      if(n===it.base)n+=dir;
      size[it.id]=Math.min(it.max,Math.max(it.min,n));
    });
    persist({...edRef.current,size});
  };
  const resetSize=()=>{
    if(!sel.length)return;
    const size={...edRef.current.size};sel.forEach(id=>delete size[id]);
    persist({...edRef.current,size});
  };
  const selHasSize=sel.some(id=>ed.size?.[id]!=null);
  // 드래그 크기 조절: 끄는 동안 live 로 미리보기, 놓으면 저장
  const[live,setLive]=useState({});
  const commitSizes=map=>persist({...edRef.current,size:{...edRef.current.size,...map}});
  // 선택한 글씨 모서리 ■ → 선택한 것 전부 같은 비율로
  const onScaleSel=(e,el)=>startScaleDrag(e,el,selItems(),setLive,commitSizes);

  // 범위 선택: 빈 곳(또는 Shift 누르고 아무 곳)을 끌면 사각형 안에 걸친 글씨 선택 (표 칸은 사각형 안에 다 들어와야 선택)
  // Shift/Ctrl 누르고 끌면 기존 선택에 추가
  const[marq,setMarq]=useState(null);
  const marqDown=e=>{
    if(!edit||e.button>0||e.target.isContentEditable)return;
    if(e.target.closest("[data-bid]")&&!e.shiftKey)return; // 블록 위는 이동 (DragBlock)
    if(e.pointerType==="mouse")e.preventDefault();
    const add=e.shiftKey||e.ctrlKey||e.metaKey;
    const s={x0:e.clientX,y0:e.clientY,x1:e.clientX,y1:e.clientY};
    setMarq(s);
    const move=ev=>{s.x1=ev.clientX;s.y1=ev.clientY;setMarq({...s})};
    const up=()=>{
      window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
      setMarq(null);
      const L=Math.min(s.x0,s.x1),R=Math.max(s.x0,s.x1),T=Math.min(s.y0,s.y1),B=Math.max(s.y0,s.y1);
      if(R-L<4&&B-T<4){if(!add)setSelArr([]);return} // 그냥 클릭 → 빈 곳이면 선택 해제
      // 드래그 끝난 뒤 생기는 click 이 글씨 선택을 바꾸지 않게 한 번 막음
      const block=ev=>{ev.stopPropagation();ev.preventDefault()};
      window.addEventListener("click",block,{capture:true,once:true});
      setTimeout(()=>window.removeEventListener("click",block,{capture:true}),0);
      const hit=[];
      elRef.current?.querySelectorAll("[data-tid]").forEach(t=>{
        const r=t.getBoundingClientRect();if(!r.width||!r.height)return;
        const ok=t.dataset.kind==="box"?(r.left>=L&&r.right<=R&&r.top>=T&&r.bottom<=B):(r.right>=L&&r.left<=R&&r.bottom>=T&&r.top<=B);
        if(ok)hit.push(t.dataset.tid);
      });
      setSelArr(cur=>add?[...new Set([...cur,...hit])]:hit);
    };
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
  };
  const changeScale=delta=>{
    const next=Math.min(200,Math.max(50,(edRef.current.scale||100)+delta));
    persist({...edRef.current,scale:next});
  };

  // 용지 선택 (A4/A3 × 가로/세로) — 마지막 선택 기억
  const[paper,setPaper]=useState(()=>{const v=lsGet("ol-paper","A4-l");return PAPER_SIZES[v]?v:"A4-l"});
  useEffect(()=>lsSet("ol-paper",paper),[paper]);
  const[fitPaper,setFitPaper]=useState(()=>lsGet("ol-fit-paper","1")!=="0");
  useEffect(()=>lsSet("ol-fit-paper",fitPaper?"1":"0"),[fitPaper]);

  // 이미지를 용지 크기(300dpi) 캔버스 가운데에 여백 두고 맞춰 넣음 → PNG 또는 PDF
  const saveImage=async format=>{
    setSaving(true);
    // 저장용 사본(편집 표시 없음, 축소 없음)을 화면 밖에 그린 뒤 캡처
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    try{
      const ps=PAPER_SIZES[paper]||PAPER_SIZES["A4-l"];
      const pxW=Math.round(ps.w/25.4*300),pxH=Math.round(ps.h/25.4*300);
      const margin=Math.round(PAPER_MARGIN_MM/25.4*300);
      const el=capRef.current;
      // 용지 맞춤: 글씨(블록)가 있는 범위만 잘라서 용지에 꽉 차게 확대 → 빈 공간 줄고 글씨가 용지 크기에 맞게 커짐
      const crop=contentCrop(el,fitPaper);
      const fitRatio=Math.min((pxW-2*margin)/crop.w,(pxH-2*margin)/crop.h);
      const scale=Math.min(8,Math.max(2,Math.ceil(fitRatio)));
      const shot=await html2canvas(el,{scale,backgroundColor:"#ffffff"});
      const page=document.createElement("canvas");
      page.width=pxW;page.height=pxH;
      const ctx=page.getContext("2d");
      ctx.fillStyle="#ffffff";ctx.fillRect(0,0,pxW,pxH);
      const sw=crop.w*scale,sh=crop.h*scale;
      const fit=Math.min((pxW-2*margin)/sw,(pxH-2*margin)/sh);
      const dw=sw*fit,dh=sh*fit;
      ctx.imageSmoothingQuality="high";
      ctx.drawImage(shot,crop.x*scale,crop.y*scale,sw,sh,(pxW-dw)/2,(pxH-dh)/2,dw,dh);
      const base=`적재리스트_${date}_${group.site}_${group.order.order_no}_${ps.label.replace(" ","")}`.replace(/[\\/:*?"<>|]/g,"_");
      if(format==="pdf"){
        const{jsPDF}=window.jspdf;
        const pdf=new jsPDF({orientation:ps.w>ps.h?"landscape":"portrait",unit:"mm",format:[ps.w,ps.h]});
        pdf.addImage(page.toDataURL("image/jpeg",0.95),"JPEG",0,0,ps.w,ps.h);
        pdf.save(base+".pdf");
      }else{
        const a=document.createElement("a");
        a.href=page.toDataURL("image/png");
        a.download=base+".png";
        a.click();
      }
    }catch(e){alert("이미지 저장 실패: "+e.message)}
    setSaving(false);
  };

  // 화면 = 선택한 용지 모양(가로:세로 비율 + 여백 10mm). 저장과 같은 계산으로 내용을 축소/확대해 배치
  const capRef=useRef(null);
  const ps=PAPER_SIZES[paper]||PAPER_SIZES["A4-l"];
  const wrapRef=useRef(null);
  const[wrapW,setWrapW]=useState(920);
  useEffect(()=>{
    const w=wrapRef.current;if(!w||!window.ResizeObserver)return;
    const ro=new ResizeObserver(()=>setWrapW(w.clientWidth));ro.observe(w);return()=>ro.disconnect();
  },[]);
  const frameW=Math.max(320,Math.min(PAGE_VIEW_MAX,wrapW-24)),frameH=Math.round(frameW*ps.h/ps.w),mpx=frameW*PAPER_MARGIN_MM/ps.w;
  const[view,setView]=useState({s:1,tx:0,ty:0});
  const[fontTick,setFontTick]=useState(0);
  useEffect(()=>{document.fonts?.ready?.then(()=>setFontTick(t=>t+1))},[]);
  useLayoutEffect(()=>{
    const el=elRef.current;if(!el)return;
    const c=contentCrop(el,fitPaper);
    const aw=frameW-2*mpx,ah=frameH-2*mpx;
    const sc=Math.min(aw/c.w,ah/c.h);
    const next={s:sc,tx:mpx+(aw-c.w*sc)/2-c.x*sc,ty:mpx+(ah-c.h*sc)/2-c.y*sc};
    if(Math.abs(next.s-view.s)>0.002||Math.abs(next.tx-view.tx)>0.5||Math.abs(next.ty-view.ty)>0.5)setView(next);
  },[ed,paper,fitPaper,group,prefix,date,fontTick,view,frameW]);

  return <div style={{marginBottom:22}}>
    <div className="ol-toolbar" style={{marginBottom:8}}>
      <b>📄 {group.vendor||"(업체명 없음)"} · 발주 {group.order.order_no} · {group.order.center}{group.orders.length>1?` (발주서 ${group.orders.length}건 합침)`:""}</b>
      <button className={"ol-btn ol-btn-sm "+(edit?"ol-btn-primary":"ol-btn-secondary")} onClick={e=>{e.currentTarget.blur();setEdit(v=>!v)}}>{edit?"✓ 편집 끝내기":"✏ 편집"}</button>
      {edit&&<>
        <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={e=>{e.currentTarget.blur();undo()}} disabled={!undoRef.current.length} title="되돌리기 (Ctrl+Z)">↶ 되돌리기</button>
        <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={e=>{e.currentTarget.blur();redo()}} disabled={!redoRef.current.length} title="다시 실행 (Ctrl+Y / Ctrl+Shift+Z)">↷ 다시</button>
      </>}
      {edited&&!askReset&&<button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setAskReset(true)} title="이동·글씨 수정·크기 조절을 모두 지우고 처음 모양으로">↺ 원래대로</button>}
      {edited&&askReset&&<span style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,padding:"3px 8px",border:"1px solid #ef4444",borderRadius:6}}>
        위치·글씨·크기 수정을 모두 되돌릴까요?
        <button className="ol-btn ol-btn-sm" style={{background:"#ef4444",color:"#fff"}} onClick={reset}>되돌리기</button>
        <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setAskReset(false)}>취소</button>
      </span>}
      <select className="ol-input" style={{width:"auto",padding:"5px 8px",fontSize:12}} value={paper} onChange={e=>setPaper(e.target.value)} title="저장 용지 크기">
        {Object.entries(PAPER_SIZES).map(([k,v])=><option key={k} value={k}>{v.label} ({v.w}×{v.h}mm)</option>)}
      </select>
      <label style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:12,cursor:"pointer"}} title="글씨가 있는 범위만 잘라 용지에 꽉 차게 확대">
        <input type="checkbox" checked={fitPaper} onChange={e=>setFitPaper(e.target.checked)}/>용지에 맞춰 확대
      </label>
      <button className="ol-btn ol-btn-primary ol-btn-sm" onClick={()=>saveImage("png")} disabled={saving}>{saving?"저장 중...":"📷 PNG"}</button>
      <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>saveImage("pdf")} disabled={saving}>📄 PDF</button>
      {status&&<span style={{fontSize:12,color:status.startsWith("⚠")?"#ef4444":"var(--muted)"}}>{status}</span>}
    </div>
    {edit&&<div className="ol-toolbar" style={{marginBottom:8,padding:"8px 10px",background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8,fontSize:12}}>
      <span style={{color:"var(--muted)"}}>{sel.length>1?`선택 ${sel.length}개`:"선택한 글씨"}</span>
      <button className="ol-btn ol-btn-secondary ol-btn-sm" disabled={!sel.length} onClick={()=>changeSize(-1)}>A−</button>
      <b style={{minWidth:44,textAlign:"center"}}>{sel.length>1?`${sel.length}개`:selOne?(selOne.box?`표 ${selPx}%`:`${selPx}px`):"–"}</b>
      {selOne&&!selOne.box&&(ed.scale||100)!==100&&<span style={{color:"var(--muted)"}}>(전체 배율 적용 시 {Math.round(selPx*(ed.scale||100)/100)}px)</span>}
      <button className="ol-btn ol-btn-secondary ol-btn-sm" disabled={!sel.length} onClick={()=>changeSize(1)}>A+</button>
      <button className="ol-btn ol-btn-secondary ol-btn-sm" disabled={!selHasSize} onClick={resetSize}>기본</button>
      {sel.length>0&&<button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setSel(null)} title="선택 해제 (Esc)">선택 해제</button>}
      <span style={{width:1,height:20,background:"var(--card-bd)",margin:"0 6px"}}/>
      <span style={{color:"var(--muted)"}}>전체 글씨</span>
      <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>changeScale(-10)}>A−</button>
      <b style={{minWidth:44,textAlign:"center"}}>{ed.scale||100}%</b>
      <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>changeScale(10)}>A+</button>
      <span style={{width:1,height:20,background:"var(--card-bd)",margin:"0 6px"}}/>
      <button className="ol-btn ol-btn-primary ol-btn-sm" onClick={addExtra}>＋ 글씨 추가</button>
      {selExtra&&<>
        <span style={{color:"var(--muted)"}}>색</span>
        {COLOR_PRESETS.map(c=><button key={c} title={c} onClick={()=>setExtraColor(selExtra.id,c)}
          style={{width:18,height:18,borderRadius:4,border:(selExtra.color||"#111111")===c?"2px solid #f59e0b":"1px solid #888",background:c,cursor:"pointer",padding:0}}/>)}
        <button className="ol-btn ol-btn-secondary ol-btn-sm" style={{color:"#ef4444"}} onClick={()=>removeExtra(selExtra.id)}>🗑 글씨 삭제</button>
      </>}
    </div>}
    {edit&&<div style={{fontSize:12,color:"var(--muted)",marginBottom:8}}>점선 상자를 <b>끌어서</b> 위치 이동(옆 블록과 줄이 맞으면 분홍 안내선과 함께 붙음, <b>Alt</b> 누르고 끌면 자유 이동) · 상자 오른쪽 아래 <b style={{color:"#06b6d4"}}>■</b>을 끌면 블록 글씨 전체 크기 조절(혼적 표는 칸도 같이) · 글씨를 <b>클릭</b>하면 선택(주황 테두리), <b>Shift/Ctrl+클릭</b>으로 여러 개 · <b>빈 곳을 끌거나 Shift 누르고 끌면</b> 사각형 안 글씨 한꺼번에 선택(혼적 표를 통째로 감싸면 표 칸도 선택) → 글씨 모서리 ■을 끌거나 A−/A+로 크기 조절, Esc 선택 해제 · <b>더블클릭</b>하면 글씨 수정 (Enter 저장, Shift+Enter 줄바꿈, Esc 취소, 비우면 글씨 숨김) · 수정 내용은 자동 저장</div>}
    {staleDropped&&<div className="ol-warn" style={{padding:"8px 12px",fontSize:12}}>발주 내용이 바뀌어 파렛트 구성이 달라졌습니다. 이전에 수정한 위치·글씨는 적용하지 않았습니다.</div>}
    {marq&&<div style={{position:"fixed",left:Math.min(marq.x0,marq.x1),top:Math.min(marq.y0,marq.y1),width:Math.abs(marq.x1-marq.x0),height:Math.abs(marq.y1-marq.y0),border:"1px solid #f59e0b",background:"rgba(245,158,11,0.12)",zIndex:1000,pointerEvents:"none"}}/>}
    <div ref={wrapRef} className="ol-img-wrap" onPointerDown={marqDown} style={{background:"#e5e7eb",padding:12}}>
      <div style={{position:"relative",width:frameW,height:frameH,background:"#ffffff",overflow:"hidden",margin:"0 auto",boxShadow:"0 2px 10px rgba(0,0,0,.25)"}}>
        {edit&&<div style={{position:"absolute",left:mpx,top:mpx,right:mpx,bottom:mpx,border:"1px dashed #cbd5e1",pointerEvents:"none"}}/>}
        <div style={{position:"absolute",left:0,top:0,transformOrigin:"0 0",transform:`translate(${view.tx}px,${view.ty}px) scale(${view.s})`}}>
          <LoadImage group={group} date={date} prefix={prefix} refCb={el=>{elRef.current=el}} edit={edit} ed={ed} live={live} onMove={onMove} onText={onText} sel={sel} onSelect={onSelect} onScaleSel={onScaleSel} onLiveSize={setLive} onCommitSize={commitSizes}/>
        </div>
        <div style={{position:"absolute",right:8,bottom:5,fontSize:11,color:"#94a3b8",pointerEvents:"none"}}>{ps.label} {ps.w}×{ps.h}mm{fitPaper?" · 용지에 맞춰 확대":""}</div>
      </div>
    </div>
    {saving&&<div style={{position:"fixed",left:-20000,top:0}} aria-hidden="true">
      <LoadImage group={group} date={date} prefix={prefix} refCb={el=>{capRef.current=el}} edit={false} ed={ed} live={{}} onMove={()=>{}} onText={()=>{}} sel={[]} onSelect={()=>{}}/>
    </div>}
  </div>;
}

function LoadImageView({groups,date,prefix,adminHash,masters}){
  return <>{groups.map(g=><LoadImageCard key={g.order.id+"|"+g.site+"|"+g.storage} group={g} date={date} prefix={prefix} adminHash={adminHash} masters={masters}/>)}</>;
}

// ═══════════════════════════════════════════
// 발주리스트 탭 (부착리스트 / 적재이미지 — 생산지점별)
// ═══════════════════════════════════════════
function ListsTab({adminHash,masters,reloadMasters,dates,selDate,setSelDate,orders,loadingOrders,extra}){
  const[sub,setSub]=useState(()=>lsGet("ol-list-sub","attach")==="image"?"image":"attach");
  const[site,setSite]=useState("");
  const[prefix,setPrefix]=useState(()=>lsGet("ol-prefix","쿠팡"));
  useEffect(()=>lsSet("ol-list-sub",sub),[sub]);
  useEffect(()=>lsSet("ol-prefix",prefix),[prefix]);

  const prodMap=useMemo(()=>Object.fromEntries(masters.products.map(p=>[p.code,p])),[masters.products]);
  const methodMap=useMemo(()=>toMethodMap(masters.methods),[masters.methods]);
  const{groups,unmatched}=useMemo(()=>buildSiteGroups(orders,prodMap,methodMap,palletCfg(masters.settings),{separate:extra}),[orders,prodMap,methodMap,masters.settings,extra]);
  const sites=useMemo(()=>[...new Set(groups.map(g=>g.site))].sort(),[groups]);
  useEffect(()=>{if(sites.length&&!sites.includes(site))setSite(sites[0])},[sites]);
  const siteGroups=groups.filter(g=>g.site===site);
  // 업체별 제목 색: 저장값 + 처음 보는 업체 자동 배정(저장)
  const[colorEdits,setColorEdits]=useState({});
  const savedColors=masters.settings?.vendor_colors;
  const vendorColors=useMemo(()=>assignVendorColors([...new Set(groups.map(g=>g.vendor))].sort(),{...(savedColors||{}),...colorEdits}),[groups,savedColors,colorEdits]);
  const saveColors=async map=>{
    try{await rpc("ol_set_setting",{p_admin_hash:adminHash,p_key:"vendor_colors",p_value:map});reloadMasters&&reloadMasters()}
    catch(e){console.warn("vendor_colors 저장 실패",e)}
  };
  useEffect(()=>{if(Object.keys(vendorColors.added).length)saveColors(vendorColors.map)},[vendorColors]);
  const onVendorColor=(v,rgb)=>{setColorEdits(c=>({...c,[v]:rgb}));saveColors({...vendorColors.map,[v]:rgb})};

  return <div className="ol-layout">
    <DateList dates={dates} selected={selDate} onSelect={setSelDate}/>
    <div style={{minWidth:0}}>
      {!selDate?<Empty emoji="📄" text={extra?"추가 발주서를 먼저 업로드하세요":"발주서 탭에서 발주서를 먼저 업로드하세요"}/>:loadingOrders?<Loader/>:<>
        <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap",marginBottom:12}}>
          <div style={{fontSize:18,fontWeight:800}}>{selDate} ({dowOf(selDate)}) 입고{extra&&<span className="ol-pill mixed" style={{marginLeft:8,verticalAlign:"middle"}}>추가 발주</span>}</div>
          <div className="ol-subtabs">
            <button className={sub==="attach"?"on":""} onClick={()=>setSub("attach")}>🏷 부착리스트</button>
            <button className={sub==="image"?"on":""} onClick={()=>setSub("image")}>🖼 적재이미지</button>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6,marginLeft:"auto"}}>
            <span style={{fontSize:12,color:"var(--muted)"}}>제목 머리말</span>
            <input className="ol-input" style={{width:110}} value={prefix} onChange={e=>setPrefix(e.target.value)}/>
          </div>
        </div>
        <UnmatchedBanner unmatched={unmatched}/>
        {sites.length===0?<Empty emoji="🏭" text="이 날짜에 제품리스트와 매칭되는 품목이 없습니다"/>:<>
          <div className="ol-chips" style={{marginBottom:14}}>
            {sites.map(s=>{
              const n=groups.filter(g=>g.site===s).reduce((a,g)=>a+g.pallets.length,0);
              return <button key={s} className={site===s?"on":""} onClick={()=>setSite(s)}>🏭 {s} · {n}파렛</button>;
            })}
          </div>
          {sub==="attach"?<AttachListView groups={siteGroups} site={site} date={selDate} prefix={prefix} vendorColors={vendorColors.map} onVendorColor={onVendorColor}/>:<LoadImageView groups={siteGroups} date={selDate} prefix={prefix} adminHash={adminHash} masters={masters}/>}
        </>}
      </>}
    </div>
  </div>;
}

// ═══════════════════════════════════════════
// 출고장 탭 — 입고일 하루치 발주서를 냉장(생산지점별) / 냉동으로 나눠 제품별 팩·박스 수량 정리
//  - 업체·센터·발주번호가 달라도 같은 제품은 합침 (같은 제품이라도 소비기한이 다르면 따로 줄)
//  - 냉장 소비기한 = 발주서의 유통(소비)기한 · 냉동 유통기한 = 발주서 값, 없으면 입고일 + N일(기본 182)
// ═══════════════════════════════════════════
const siteCmp=(a,b)=>a===NO_SITE?1:b===NO_SITE?-1:a.localeCompare(b,"ko",{numeric:true});
function buildShipList(orders,prodMap,products,opts){
  const{vendor,showAll,frozenDays,merge}=opts;
  const rows=new Map(),unmatched=[];
  const sorted=[...orders].sort((a,b)=>String(a.order_no).localeCompare(String(b.order_no),undefined,{numeric:true}));
  for(const o of sorted){
    if(vendor&&(o.vendor||"").trim()!==vendor)continue;
    for(const it of (o.items||[])){
      const p=prodMap[it.code];
      if(!p){unmatched.push({order:o,item:it});continue}
      const exp=merge?"":(it.expiry_date?String(it.expiry_date).slice(0,10):""); // 기간 합계는 소비기한 무시
      const k=it.code+"|"+exp;
      const cur=rows.get(k);
      if(cur)cur.qty+=Number(it.qty||0);
      else rows.set(k,{product:p,code:it.code,qty:Number(it.qty||0),expiry:exp,seq:rows.size});
    }
  }
  // 발주서에 줄은 있지만 발주수량이 0인 품목(취소·미발주)은 "발주 없는 제품"과 같이 취급 → 옵션을 켰을 때만 표시
  if(!showAll)for(const[k,r]of rows)if(!(r.qty>0))rows.delete(k);
  if(showAll){
    const has=new Set([...rows.values()].map(r=>r.code));
    for(const p of products)if(!has.has(p.code))rows.set(p.code+"|",{product:p,code:p.code,qty:0,expiry:"",seq:1e6+rows.size});
  }
  const fz=Number(frozenDays);
  const list=[...rows.values()].map(r=>{
    const per=Math.max(1,Number(r.product.per_box)||1);
    const frozen=storageOf(r.product)==="frozen";
    let expiry=r.expiry;
    if(!merge&&frozen&&!expiry&&r.qty>0&&opts.date&&Number.isFinite(fz)&&fz>0)expiry=addDays(opts.date,fz);
    return{...r,per,boxes:r.qty/per,partial:r.qty%per!==0,frozen,site:(r.product.site||"").trim()||NO_SITE,expiry};
  });
  const bySeq=(a,b)=>a.seq-b.seq;
  const chilledSites=[...new Set(list.filter(r=>!r.frozen).map(r=>r.site))].sort(siteCmp)
    .map(site=>({site,rows:list.filter(r=>!r.frozen&&r.site===site).sort(bySeq)}));
  const frozen=list.filter(r=>r.frozen).sort((a,b)=>siteCmp(a.site,b.site)||bySeq(a,b));
  return{chilledSites,frozen,unmatched};
}
const sumBy=(rows,k)=>rows.reduce((s,r)=>s+(r[k]||0),0);
// 연속된 같은 값끼리 묶기 → [{start, len, value}] (소비기한 칸 병합용)
function runsOf(rows,key){
  const out=[];
  rows.forEach((r,i)=>{const v=key(r),l=out[out.length-1];if(l&&l.value===v)l.len++;else out.push({start:i,len:1,value:v})});
  return out;
}
// dateTo가 있으면 기간 합계 제목 (예: "쿠팡 10/14 (화) ~ 10/20 (월) 발주 합계")
const shipTitle=(prefix,date,dateTo)=>dateTo&&dateTo!==date
  ?`${prefix?prefix+" ":""}${fmtMd(date)} (${dowOf(date)}) ~ ${fmtMd(dateTo)} (${dowOf(dateTo)}) 발주 합계`
  :`${prefix?prefix+" ":""}${fmtMd(date)} (${dowOf(date)}) ${dateTo?"발주 합계":"입고"}`;
const fmtBoxes=n=>Number.isInteger(n)?String(n):String(Math.round(n*100)/100);
const fmtExp=s=>s?s.replace(/-/g,".")+" 이후":""; // "/" 는 html2canvas 캡처 때 글자 간격이 어긋나 "." 사용

// 화면·엑셀 공통: 냉장/냉동 섹션 → 생산지점 묶음
function shipSections(data){
  const out=[];
  if(data.chilledSites.length)out.push({key:"chilled",title:"냉장제품",expLabel:"소비기한",groups:data.chilledSites});
  if(data.frozen.length){
    const sites=[...new Set(data.frozen.map(r=>r.site))];
    out.push({key:"frozen",title:"냉동제품",expLabel:"유통기한",groups:sites.map(site=>({site,rows:data.frozen.filter(r=>r.site===site)}))});
  }
  return out;
}
const SHIP_ACCENT={chilled:{main:"#0e7490",soft:"#ecfeff",x:"0E7490",xs:"E0F7FA"},frozen:{main:"#1d4ed8",soft:"#eff6ff",x:"1D4ED8",xs:"E3ECFD"}};
const secShort=sec=>sec.title.replace("제품","");

function ShipSheetPreview({data,date,dateTo,prefix,print,refCb}){

  const secs=shipSections(data);
  const secRows=sec=>sec.groups.flatMap(g=>g.rows);
  const total=secs.reduce((a,sec)=>a+sumBy(secRows(sec),"boxes"),0);
  const cell={padding:"8px 12px",borderBottom:"1px solid #e5e7eb",fontVariantNumeric:"tabular-nums"};
  const num={...cell,textAlign:"center"};
  // print: 이미지 저장용 사본 — 바깥 테두리 없이 고정 폭
  return <div ref={refCb} className={print?"ol-sheet":"ol-sheet ol-ship-sheet"} style={{padding:print?0:"22px 24px",fontSize:14,lineHeight:1.4,...(print?{border:"none",borderRadius:0,margin:0,overflow:"visible"}:{})}}>
    <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:12,flexWrap:"wrap",paddingBottom:12,borderBottom:"2px solid #111",marginBottom:18}}>
      <div className="ol-ship-ttl" style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px"}}>{shipTitle(prefix,date,dateTo)}</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {secs.map(sec=><span key={sec.key} style={{padding:"4px 10px",borderRadius:14,background:SHIP_ACCENT[sec.key].soft,color:SHIP_ACCENT[sec.key].main,fontWeight:700,fontSize:13}}>{secShort(sec)} {fmtBoxes(sumBy(secRows(sec),"boxes"))}박스</span>)}
        <span style={{padding:"4px 10px",borderRadius:14,background:"#111",color:"#fff",fontWeight:700,fontSize:13}}>총 {fmtBoxes(total)}박스</span>
      </div>
    </div>
    {secs.map(sec=>{
      const ac=SHIP_ACCENT[sec.key];
      const all=secRows(sec);
      return <div key={sec.key} data-shipcut="1" style={{marginBottom:26}}>

          <span style={{width:5,height:20,borderRadius:3,background:ac.main}}/>

          <span style={{fontSize:12,color:"#6b7280"}}>{all.filter(r=>r.qty>0).length}품목</span>
        </div>
        {sec.groups.map((g,gi)=>{
          const runs=runsOf(g.rows,r=>r.expiry);
          return <div key={g.site} data-shipcut="1" data-shipsite={g.site} style={{border:"1px solid #d7dde5",borderRadius:8,marginBottom:16,overflow:"hidden"}}>
            <div className="ol-ship-sitehd" style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,padding:"10px 14px",background:ac.soft,borderBottom:"1px solid #d7dde5"}}>
              <div style={{display:"flex",alignItems:"baseline",gap:10,flexWrap:"wrap",minWidth:0}}>
                <span className="ol-ship-site" style={{fontSize:20,fontWeight:900,color:ac.main}}>{g.site}</span>
                <span style={{fontSize:12,color:"#6b7280"}}>{g.rows.filter(r=>r.qty>0).length}품목 · {fmtNum(sumBy(g.rows,"qty"))}팩</span>
              </div>
              <span style={{padding:"4px 12px",borderRadius:16,background:ac.main,color:"#fff",fontWeight:800,fontSize:15,whiteSpace:"nowrap"}}>{fmtBoxes(sumBy(g.rows,"boxes"))}박스</span>
            </div>
            <table style={{minWidth:600}}>
              <colgroup><col/><col className="c-qty" style={{width:100}}/><col className="c-box" style={{width:90}}/>{!noExp&&<col className="c-exp" style={{width:150}}/>}</colgroup>
              <thead><tr style={{background:"#f8fafc",color:"#475569",fontSize:12}}>
                <th style={{...cell,textAlign:"center"}}>제품명</th>
                <th style={num}>총 팩수량</th><th style={num}>박스수량</th>{!noExp&&<th style={{...cell,textAlign:"center"}}>{sec.expLabel}</th>}
              </tr></thead>
              <tbody>
                {g.rows.map((r,i)=>{
                  const run=runs.find(x=>x.start===i);
                  const dim=!r.qty;
                  return <tr key={r.code+r.expiry} data-shipcut={noExp||run?"1":undefined} style={{color:dim?"#b6bcc6":"#111"}}>
                    <td style={{...cell,textAlign:"center",fontFamily:"'NanumSquare','Pretendard',sans-serif"}}>{boldDigits(shipNameOf(r.product),dim)}<span style={{color:dim?"#9ca3af":"#000",fontWeight:900,marginLeft:6,whiteSpace:"nowrap"}}>/ {r.per}ea</span></td>

                    {!noExp&&run&&<td rowSpan={run.len} className="c-exp" style={{...cell,textAlign:"center",fontWeight:600,fontSize:13,borderLeft:"1px solid #e5e7eb",color:"#111"}}>{fmtExp(run.value)}</td>}

          <span>{secShort(sec)} 합계</span>

// 출고장 엑셀 — 화면과 같은 구성 (A 제품명 / 입수 · B 총 팩수량 · C 박스수량 · D 소비/유통기한)
function downloadShipXlsx(data,date,prefix,vendor,dateTo){
  const noExp=!!dateTo,LC=noExp?2:3; // 기간 합계: 소비기한 열(D) 없음
  const F="Pretendard";
  const line=(style,rgb)=>({style,color:{rgb:rgb||"D0D5DD"}});
  const grid={left:line("thin"),right:line("thin"),top:line("thin"),bottom:line("thin")};
  const ws={},merges=[],rowsH=[];
  const enc=(r,c)=>XLSX.utils.encode_cell({r,c});
  const st=o=>{
    const font={name:F,sz:o.sz||12,bold:!!o.b};if(o.color)font.color={rgb:o.color};
    const s={font,alignment:{horizontal:o.h||"left",vertical:"center",wrapText:true,indent:o.indent||0},border:o.border||grid};
    if(o.fill)s.fill={patternType:"solid",fgColor:{rgb:o.fill}};
    if(o.fmt)s.numFmt=o.fmt;
    return s;
  };
  const put=(r,c,v,s,f)=>{ws[enc(r,c)]=f?{t:"n",v:v||0,f,s}:{t:typeof v==="number"?"n":"s",v:v??"",s}};
  const span=(r,c1,c2,v,s,f)=>{put(r,c1,v,s,f);for(let c=c1+1;c<=c2;c++)put(r,c,"",s);if(c2>c1)merges.push({s:{r,c:c1},e:{r,c:c2}})};
  const secs=shipSections(data);
  const secRows=sec=>sec.groups.flatMap(g=>g.rows);
  const all=secs.flatMap(secRows);
  const noBorder={};
  span(0,0,LC,shipTitle(prefix,date,dateTo)+(vendor?` · ${vendor}`:""),st({sz:20,b:true,border:{bottom:line("medium","111111")}}));
  rowsH[0]={hpt:36};
  span(1,0,LC,[...secs.map(sec=>`${secShort(sec)} ${fmtBoxes(sumBy(secRows(sec),"boxes"))}박스`),`총 ${fmtBoxes(sumBy(all,"boxes"))}박스`].join("   ·   "),st({sz:12,color:"555555",border:noBorder}));
  rowsH[1]={hpt:22};
  let r=3;
  for(const sec of secs){
    const ac=SHIP_ACCENT[sec.key];
    span(r,0,LC,sec.title,st({sz:15,b:true,color:"FFFFFF",fill:ac.x,border:noBorder}));rowsH[r]={hpt:28};r++;
    rowsH[r]={hpt:10};r++; // 섹션 제목과 첫 지점 사이 여백
    const hd=h=>st({sz:11,b:true,color:"475569",fill:"F1F5F9",h});
    const bandRefs=[],qtyRanges=[];
    for(const g of sec.groups){
      const band=r,first=r+2,last=r+1+g.rows.length;
      const bb={left:line("medium",ac.x),right:line("medium",ac.x),top:line("medium",ac.x),bottom:line("thin",ac.x)};
      span(band,0,1,`${g.site}   (${g.rows.filter(x=>x.qty>0).length}품목 · ${fmtNum(sumBy(g.rows,"qty"))}팩)`,st({sz:16,b:true,color:ac.x,fill:ac.xs,border:bb}));
      put(band,2,sumBy(g.rows,"boxes"),st({sz:16,b:true,color:"FFFFFF",fill:ac.x,h:"right",fmt:'0.##"박스"',border:bb}),`SUM(C${first+1}:C${last+1})`);
      if(!noExp)put(band,3,"",st({fill:ac.xs,border:bb}));
      rowsH[band]={hpt:30};bandRefs.push(band+1);qtyRanges.push(`B${first+1}:B${last+1}`);
      r++;
      put(r,0,"제품명",hd("left"));put(r,1,"총 팩수량",hd("right"));put(r,2,"박스수량",hd("right"));if(!noExp)put(r,3,sec.expLabel,hd("center"));
      rowsH[r]={hpt:20};r++;
      g.rows.forEach(x=>{
        const R=r+1,dim=!x.qty;
        const c=dim?"A0A6B0":undefined;
        put(r,0,`${shipNameOf(x.product)} / ${x.per}ea`,st({sz:12,indent:1,color:c}));
        put(r,1,x.qty||"",st({sz:12,h:"right",fmt:"#,##0",color:c}));
        put(r,2,x.boxes,st({sz:13,b:true,h:"right",fmt:"0.##",fill:dim?undefined:"FFF4C2",color:x.partial?"DC2626":c}),`B${R}/${x.per}`);
        rowsH[r]={hpt:22};r++;
      });
      if(!noExp)for(const run of runsOf(g.rows,x=>x.expiry)){
        const a=first+run.start,s=st({sz:12,b:true,h:"center",fmt:'yyyy/mm/dd"이후"'});
        ws[enc(a,3)]=run.value?{t:"n",v:excelSerial(run.value),z:'yyyy/mm/dd"이후"',s}:{t:"s",v:"",s};
        for(let k=a+1;k<a+run.len;k++)put(k,3,"",s);
        if(run.len>1)merges.push({s:{r:a,c:3},e:{r:a+run.len-1,c:3}});
      }
      rowsH[r]={hpt:14};r++; // 지점 사이 빈 줄
    }
    const top={...grid,top:line("medium","111111")};
    put(r,0,`${secShort(sec)} 합계`,st({sz:13,b:true,border:top}));
    put(r,1,sumBy(secRows(sec),"qty"),st({sz:13,b:true,h:"right",fmt:"#,##0",border:top}),`SUM(${qtyRanges.join(",")})`);
    put(r,2,sumBy(secRows(sec),"boxes"),st({sz:14,b:true,h:"right",fmt:"0.##",border:top}),bandRefs.map(x=>"C"+x).join("+"));
    if(!noExp)put(r,3,"",st({border:top}));
    rowsH[r]={hpt:26};r+=2;
  }
  ws["!ref"]=`A1:${noExp?"C":"D"}${Math.max(r,2)}`;
  ws["!merges"]=merges;
  ws["!cols"]=[{wch:60},{wch:13},{wch:12},...(noExp?[]:[{wch:19}])];
  ws["!rows"]=rowsH;
  ws["!pageSetup"]={orientation:"portrait"};
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"출고장");
  const safe=x=>String(x).replace(/[\\/:*?"<>|]/g,"_");
  XLSX.writeFile(wb,`출고리스트_${date}${dateTo&&dateTo!==date?"~"+dateTo:dateTo?"_합계":""}${vendor?"_"+safe(vendor):""}.xlsx`);
}

// 이미지 저장 — 화면 밖에 고정 폭 사본을 그려 캡처 → PNG 한 장 (냉동재고 쪽 저장에서도 사용)
async function saveShipPng(el,fileName){
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const canvas=await html2canvas(el,{scale:3,backgroundColor:"#ffffff",useCORS:true});
  const a=document.createElement("a");
  a.download=fileName+".png";a.href=canvas.toDataURL("image/png");a.click();
}

// 출고장 A4 세로 — 794×1123px(96dpi) 종이, 여백 38px(10mm), 내용 폭 718px
const SHIP_A4={W:794,H:1123,M:38,FOOT:22,S:3};
const SHIP_PRINT_W=SHIP_A4.W-SHIP_A4.M*2;
// 사본을 한 번 캡처한 뒤 data-shipcut 위치(섹션·층 카드·줄 경계)에서 잘라 A4 쪽들로 나눔
// 조금 넘치는 정도(1.2쪽 이하)는 나누지 않고 한 쪽에 축소해서 맞춤
// trim=true면 내용이 끝난 곳(+아래 여백)에서 종이를 잘라 빈 아래 공간을 없앰 (폭은 A4 그대로)
async function shipA4Pages(el,{trim=false}={}){
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const{W,H,M,FOOT,S}=SHIP_A4;
  const src=await html2canvas(el,{scale:S,backgroundColor:"#ffffff",useCORS:true});
  const top=el.getBoundingClientRect().top;
  const total=el.scrollHeight;
  const cuts=[...new Set([...el.querySelectorAll("[data-shipcut]")].map(n=>Math.round(n.getBoundingClientRect().top-top)))].filter(c=>c>0).sort((a,b)=>a-b);
  const areaH=H-M*2-FOOT; // 쪽 번호 자리 제외
  const slices=[];
  if(total<=areaH*1.2)slices.push([0,total]);
  else{
    let start=0;
    while(start<total-1){
      const limit=start+areaH;
      let end=total<=limit?total:Math.max(...cuts.filter(c=>c>start+areaH*0.3&&c<=limit),0);
      if(!end)end=limit; // 자를 자리가 없으면 그냥 쪽 높이에서 자름
      slices.push([start,end]);start=end;
    }
  }
  return slices.map(([a,b],i)=>{
    const multi=slices.length>1;
    const h=b-a,k=Math.min(1,(multi?areaH:H-M*2)/h);
    const pageH=trim?Math.min(H,Math.ceil(M+h*k+(multi?FOOT:0)+M)):H;
    const pg=document.createElement("canvas");pg.width=W*S;pg.height=pageH*S;
    const ctx=pg.getContext("2d");
    ctx.fillStyle="#ffffff";ctx.fillRect(0,0,pg.width,pg.height);
    const dw=SHIP_PRINT_W*k,dx=M+(SHIP_PRINT_W-dw)/2;
    ctx.drawImage(src,0,a*S,src.width,h*S,dx*S,M*S,dw*S,h*k*S);
    if(multi){
      ctx.fillStyle="#6b7280";ctx.font=`${11*S}px Pretendard, sans-serif`;ctx.textAlign="center";
      ctx.fillText(`${i+1} / ${slices.length}`,W*S/2,(pageH-M+4)*S);
    }
    return pg;
  });
}
const downloadCanvas=(c,name)=>{const a=document.createElement("a");a.download=name+".png";a.href=c.toDataURL("image/png");a.click()};
function shipPdf(pages,name){
  const{jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  pages.forEach((c,i)=>{if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.95),"JPEG",0,0,210,297)});
  pdf.save(name+".pdf");
}

function ShipTab({adminHash,masters,dates,selDate,setSelDate,orders,loadingOrders}){
  const[prefix,setPrefix]=useState(()=>lsGet("ol-prefix","쿠팡"));
  const[showAll,setShowAll]=useState(()=>lsGet("ol-ship-all","0")==="1");
  const[withExtra,setWithExtra]=useState(()=>lsGet("ol-ship-extra","1")==="1");
  const[frozenDays,setFrozenDays]=useState(()=>lsGet("ol-ship-frozen-days","182"));
  const[vendor,setVendor]=useState("");
  const[extraOrders,setExtraOrders]=useState([]);
  // 기간 합계 모드 — 입고예정일이 기간 안인 발주서(일반 + 추가)를 모두 합침, 소비기한 구분 없이 제품별 합계
  const[mode,setMode]=useState(()=>lsGet("ol-ship-mode","day")==="range"?"range":"day");
  const[rFrom,setRFrom]=useState(()=>lsGet("ol-ship-from",""));
  const[rTo,setRTo]=useState(()=>lsGet("ol-ship-to",""));
  const[rangeOrders,setRangeOrders]=useState([]);
  const[rangeLoading,setRangeLoading]=useState(false);
  const isRange=mode==="range";
  useEffect(()=>lsSet("ol-ship-mode",mode),[mode]);
  useEffect(()=>{lsSet("ol-ship-from",rFrom);lsSet("ol-ship-to",rTo)},[rFrom,rTo]);
  // 기간이 비어 있으면 선택일 기준 최근 7일
  useEffect(()=>{if(isRange&&(!rFrom||!rTo)&&selDate){setRFrom(addDays(selDate,-6));setRTo(selDate)}},[isRange,selDate]);
  const rangeOk=!!(isRange&&rFrom&&rTo&&rFrom<=rTo);
  useEffect(()=>{
    if(!rangeOk){setRangeOrders([]);return}
    let alive=true;setRangeLoading(true);
    const base={p_admin_hash:adminHash,p_from:rFrom,p_to:rTo};
    const norm=d=>(Array.isArray(d)?d:[]).map(o=>({...o,due_date:String(o.due_date).slice(0,10)}));
    (async()=>{
      let main=[],ext=[];
      // setup_orders_extra.sql 실행 전이면 p_extra 없이(일반 발주만)
      try{main=norm(await rpc("ol_list_orders",{...base,p_extra:false}))}
      catch(e){try{main=norm(await rpc("ol_list_orders",base))}catch(e2){main=[]}}
      if(withExtra){try{ext=norm(await rpc("ol_list_orders",{...base,p_extra:true}))}catch(e){ext=[]}}
      if(alive){setRangeOrders([...main,...ext]);setRangeLoading(false)}
    })();
    return()=>{alive=false};
  },[rangeOk,rFrom,rTo,withExtra,adminHash]);
  const setPreset=days=>{
    if(days==="all"){const ds=dates.map(d=>d.due_date).sort();if(ds.length){setRFrom(ds[0]);setRTo(ds[ds.length-1])}return}
    const end=rTo||selDate||todayYmd();setRFrom(addDays(end,-(days-1)));setRTo(end);
  };
  useEffect(()=>lsSet("ol-prefix",prefix),[prefix]);
  useEffect(()=>lsSet("ol-ship-all",showAll?"1":"0"),[showAll]);
  useEffect(()=>lsSet("ol-ship-extra",withExtra?"1":"0"),[withExtra]);
  useEffect(()=>lsSet("ol-ship-frozen-days",String(frozenDays)),[frozenDays]);
  // 같은 입고일의 추가 발주도 함께 (setup_orders_extra.sql 실행 전이면 없음)
  useEffect(()=>{
    let alive=true;
    if(!selDate||!withExtra){setExtraOrders([]);return}
    rpc("ol_list_orders",{p_admin_hash:adminHash,p_from:selDate,p_to:selDate,p_extra:true})
      .then(d=>{if(alive)setExtraOrders(Array.isArray(d)?d:[])})
      .catch(()=>{if(alive)setExtraOrders([])});
    return()=>{alive=false};
  },[selDate,withExtra,adminHash]);
  const allOrders=useMemo(()=>isRange?rangeOrders:withExtra?[...orders,...extraOrders]:orders,[isRange,rangeOrders,orders,extraOrders,withExtra]);
  const rangeDays=useMemo(()=>new Set(rangeOrders.map(o=>o.due_date)).size,[rangeOrders]);
  const shipDate=isRange?rFrom:selDate,shipTo=isRange?rTo:undefined;
  const vendors=useMemo(()=>[...new Set(allOrders.map(o=>(o.vendor||"").trim()))].sort(),[allOrders]);
  useEffect(()=>{if(vendor&&!vendors.includes(vendor))setVendor("")},[vendors]);
  const prodMap=useMemo(()=>Object.fromEntries(masters.products.map(p=>[p.code,p])),[masters.products]);
  const data=useMemo(()=>buildShipList(allOrders,prodMap,masters.products,{vendor,showAll,frozenDays,date:selDate,merge:isRange}),[allOrders,prodMap,masters.products,vendor,showAll,frozenDays,selDate,isRange]);
  const ordered=[...data.chilledSites.flatMap(s=>s.rows),...data.frozen].filter(r=>r.qty>0);
  const partial=ordered.filter(r=>r.partial);
  const[saving,setSaving]=useState("");
  const[saveMsg,setSaveMsg]=useState("");
  const[fmt,setFmt]=useState(()=>lsGet("ol-ship-fmt","png")==="pdf"?"pdf":"png");
  useEffect(()=>lsSet("ol-ship-fmt",fmt),[fmt]);
  const[trim,setTrim]=useState(()=>lsGet("ol-ship-trim","1")==="1");
  useEffect(()=>lsSet("ol-ship-trim",trim?"1":"0"),[trim]);
  const[optOpen,setOptOpen]=useState(false); // 모바일: 옵션 접기
  const[shots,setShots]=useState(null); // 모바일 여러 장 저장용 [{name,label,url,file}]
  const closeShots=()=>{if(shots)shots.forEach(x=>URL.revokeObjectURL(x.url));setShots(null)};
  const printRef=useRef(null);
  const floorRefs=useRef({});
  // 층별 저장용: 층 하나씩만 담은 출고장 (제목·요약은 그 층 기준)
  const floors=useMemo(()=>shipSections(data).flatMap(sec=>sec.groups.map(g=>({key:sec.key+"|"+g.site,site:g.site,
    data:sec.key==="frozen"?{chilledSites:[],frozen:g.rows,unmatched:[]}:{chilledSites:[g],frozen:[],unmatched:[]}}))),[data]);
  // 저장할 층 선택 — 해제한 층만 기억(새로 나온 층은 기본 선택)
  const[offFloors,setOffFloors]=useState(()=>{try{return new Set(JSON.parse(lsGet("ol-ship-off-floors","[]")))}catch(e){return new Set()}});
  useEffect(()=>lsSet("ol-ship-off-floors",JSON.stringify([...offFloors])),[offFloors]);
  const toggleFloor=k=>setOffFloors(prev=>{const n=new Set(prev);n.has(k)?n.delete(k):n.add(k);return n});
  const selFloors=floors.filter(f=>!offFloors.has(f.key));
  const selData=useMemo(()=>({
    chilledSites:selFloors.flatMap(f=>f.data.chilledSites),
    frozen:selFloors.flatMap(f=>f.data.frozen),unmatched:[]
  }),[floors,offFloors]);
  const save=async kind=>{
    setSaving(kind);setSaveMsg("");
    try{
      await new Promise(r=>setTimeout(r,50));
      const safe=x=>String(x).replace(/[\\/:*?"<>|]/g,"_");
      const base=`출고리스트_${isRange?(rFrom===rTo?rFrom+"_합계":rFrom+"~"+rTo):selDate}${vendor?"_"+safe(vendor):""}`;
      // 전체: 선택한 층을 이어서 A4 쪽으로 나눔 / 층별: 층마다 새 쪽에서 시작
      const jobs=kind==="all"?[{el:printRef.current,name:base}]:selFloors.map(f=>({el:floorRefs.current[f.key],name:`${base}_${safe(f.site)}`}));
      let count=0;
      if(fmt==="pdf"){
        const pages=[];
        for(const j of jobs)pages.push(...await shipA4Pages(j.el));
        shipPdf(pages,kind==="all"?base:base+"_층별");count=pages.length;
        setSaveMsg(`A4 PDF ${count}쪽으로 저장했습니다`);
      }else{
        // 모바일 브라우저는 버튼 한 번에 파일 하나만 받게 함 → 여러 장이면 저장 창에서 고르게
        const mobile=window.matchMedia&&matchMedia("(pointer:coarse)").matches;
        if(mobile){
          const out=[];
          for(const j of jobs){
            const pages=await shipA4Pages(j.el,{trim});
            for(let i=0;i<pages.length;i++){
              const blob=await new Promise(r=>pages[i].toBlob(r,"image/png"));
              const nm=pages.length>1?`${j.name}_${i+1}쪽`:j.name;
              out.push({name:nm+".png",label:nm.replace(/^출고리스트_/,""),url:URL.createObjectURL(blob),file:new File([blob],nm+".png",{type:"image/png"})});
            }
          }
          if(out.length>1){setShots(out);setSaving("");return}
          if(out.length===1){const a=document.createElement("a");a.download=out[0].name;a.href=out[0].url;a.click();setTimeout(()=>URL.revokeObjectURL(out[0].url),5000)}
          setSaveMsg(`A4 이미지 ${out.length}장 저장했습니다`);setSaving("");return;
        }
        for(const j of jobs){
          const pages=await shipA4Pages(j.el,{trim});
          for(let i=0;i<pages.length;i++){
            downloadCanvas(pages[i],pages.length>1?`${j.name}_${i+1}쪽`:j.name);count++;
            await new Promise(r=>setTimeout(r,300));
          }
        }
        setSaveMsg(`A4 이미지 ${count}장 저장했습니다`);
      }
    }catch(e){setSaveMsg("저장 실패: "+errMsg(e))}
    setSaving("");
  };

  return <div className={"ol-layout ol-ship"+(optOpen?" opt-open":"")}>
    <DateList dates={dates} selected={isRange?"":selDate} onSelect={d=>{setSelDate(d);setMode("day")}}/>
    <div style={{minWidth:0}}>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:12}}>
        <div className="ol-chips">
          <button className={!isRange?"on":""} onClick={()=>setMode("day")}>📅 하루 (입고일)</button>
          <button className={isRange?"on":""} onClick={()=>setMode("range")}>🗓 기간 합계</button>
        </div>
        {isRange&&<div className="ol-ship-range" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <input className="ol-input" type="date" style={{width:150}} value={rFrom} onChange={e=>setRFrom(e.target.value)}/>
          <span style={{color:"var(--muted)"}}>~</span>
          <input className="ol-input" type="date" style={{width:150}} value={rTo} onChange={e=>setRTo(e.target.value)}/>
          <div className="ol-ship-presets" style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setPreset(7)}>최근 7일</button>
            <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setPreset(14)}>최근 14일</button>
            <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setPreset(30)}>최근 30일</button>
            <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setPreset("all")}>저장된 전체</button>
          </div>
        </div>}
      </div>
      {isRange&&rFrom&&rTo&&rFrom>rTo&&<div className="ol-warn" style={{padding:"8px 12px"}}>⚠ 시작일이 종료일보다 늦습니다</div>}
      {(isRange?!rangeOk:!selDate)?(isRange?null:<Empty emoji="📄" text="발주서 탭에서 발주서를 먼저 업로드하세요"/>):(isRange?rangeLoading:loadingOrders)?<Loader/>:<>
        <div className="ol-ship-head" style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap",marginBottom:12}}>
          <div style={{fontSize:18,fontWeight:800}}>{isRange?`${rFrom} (${dowOf(rFrom)}) ~ ${rTo} (${dowOf(rTo)}) 발주 합계`:`${selDate} (${dowOf(selDate)}) 출고장`}</div>
          <div className="ol-ship-opt" style={{display:"flex",alignItems:"center",gap:6,marginLeft:"auto"}}>
            <span style={{fontSize:12,color:"var(--muted)"}}>제목 머리말</span>
            <input className="ol-input" style={{width:110}} value={prefix} onChange={e=>setPrefix(e.target.value)}/>
          </div>
        </div>
        <div className="ol-toolbar ol-ship-save">
          <div className="ol-chips" title="A4 세로 용지 크기로 저장">
            <button className={fmt==="png"?"on":""} onClick={()=>setFmt("png")}>🖼 PNG</button>
            <button className={fmt==="pdf"?"on":""} onClick={()=>setFmt("pdf")}>📄 PDF</button>
          </div>
          {fmt==="png"&&<label className={"ol-check"+(trim?" on":"")} title="내용이 끝나는 곳에서 이미지를 잘라 아래 빈 공간을 없앱니다 (폭은 A4 그대로)"><input type="checkbox" checked={trim} onChange={e=>setTrim(e.target.checked)}/>아래 여백 자르기</label>}
          <button className="ol-btn ol-btn-primary ol-ship-wide" onClick={()=>save("all")} disabled={!selFloors.length||!!saving}>{saving==="all"?"저장 중…":"A4로 저장 (이어서)"}</button>
          <button className="ol-btn ol-btn-secondary" onClick={()=>save("floor")} disabled={!selFloors.length||!!saving}>{saving==="floor"?"저장 중…":`🏭 층별 A4로 저장 (${selFloors.length}층)`}</button>
          <button className="ol-btn ol-btn-secondary" onClick={()=>downloadShipXlsx(data,shipDate,prefix,vendor,shipTo)} disabled={!ordered.length}>📥 엑셀</button>
          <button className="ol-btn ol-btn-secondary ol-ship-optbtn" onClick={()=>setOptOpen(v=>!v)}>⚙ 옵션 {optOpen?"▴":"▾"}</button>
          {saveMsg&&<span className="ol-ship-wide" style={{fontSize:12,color:saveMsg.startsWith("저장 실패")?"#ef4444":"#22c55e"}}>{saveMsg}</span>}
        </div>
        <div className="ol-toolbar ol-ship-opt">
          <label className={"ol-check"+(showAll?" on":"")}><input type="checkbox" checked={showAll} onChange={e=>setShowAll(e.target.checked)}/>발주 없는 제품도 표시</label>
          <label className={"ol-check"+(withExtra?" on":"")}><input type="checkbox" checked={withExtra} onChange={e=>setWithExtra(e.target.checked)}/>추가 발주 포함{!isRange&&withExtra&&extraOrders.length>0&&` (${extraOrders.length}건)`}</label>
          {!isRange&&<label style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:"var(--muted)"}}>냉동 유통기한 = 입고일 +
            <input className="ol-input" type="number" min="0" style={{width:70,padding:"5px 8px"}} value={frozenDays} onChange={e=>setFrozenDays(e.target.value)}/>일
          </label>}
        </div>
        {floors.length>0&&<div className="ol-ship-floors" style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:12}}>
          <span style={{fontSize:12,color:"var(--muted)",marginRight:2}}>표시·저장할 생산지점</span>
          {floors.map(f=>{const on=!offFloors.has(f.key),fz=f.data.frozen.length>0;
            return <label key={f.key} className={"ol-check"+(on?" on":"")}><input type="checkbox" checked={on} onChange={()=>toggleFloor(f.key)}/>{fz?"❄ ":""}{f.site}</label>})}
          <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setOffFloors(new Set())}>전체 선택</button>
          <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setOffFloors(new Set(floors.map(f=>f.key)))}>전체 해제</button>
        </div>}
        {vendors.length>1&&<div className="ol-chips" style={{marginBottom:12}}>
          <button className={!vendor?"on":""} onClick={()=>setVendor("")}>전체 업체</button>
          {vendors.map(v=><button key={v} className={vendor===v?"on":""} onClick={()=>setVendor(v)}>{v||"(업체명 없음)"}</button>)}
        </div>}
        <div className="ol-ship-opt" style={{fontSize:12,color:"var(--muted)",marginBottom:10}}>
          {isRange?<>입고예정일 기준 · 입고일 {rangeDays}일 · 발주서 {allOrders.filter(o=>!vendor||(o.vendor||"").trim()===vendor).length}건 합계 · 같은 제품은 소비기한이 달라도 한 줄로 합침(소비기한 열 없음) · 발주서는 입고일 기준 1달만 보관됩니다</>:<>
          발주서 {allOrders.filter(o=>!vendor||(o.vendor||"").trim()===vendor).length}건 · 업체·센터가 달라도 같은 제품은 합쳐서 표시 · 박스수량 = 총 팩수량 ÷ 입수량 · 냉장 소비기한은 발주서의 유통(소비)기한 · 냉동 유통기한은 발주서 값이 없으면 입고일 + {frozenDays||0}일</>}
        </div>
        <UnmatchedBanner unmatched={data.unmatched}/>
        {partial.length>0&&<div className="ol-warn" style={{padding:"8px 12px"}}>⚠ 입수량으로 나누어떨어지지 않는 품목(빨강): {partial.map(r=>`${shipNameOf(r.product)} (${fmtNum(r.qty)}÷${r.per})`).join(", ")}</div>}
        {!data.chilledSites.length&&!data.frozen.length?<Empty emoji="🚚" text={isRange?"이 기간에 제품리스트와 매칭되는 품목이 없습니다":"이 날짜에 제품리스트와 매칭되는 품목이 없습니다"}/>:<>
          {selFloors.length?<ShipSheetPreview data={selData} date={shipDate} dateTo={shipTo} prefix={prefix}/>

          </div>
        </>}
        {shots&&<Modal onClose={closeShots}><FrozenShotsSheet shots={shots} onClose={closeShots}/></Modal>}
      </>}
    </div>
  </div>;
}

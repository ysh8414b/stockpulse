function marketErr(e){
  const s=String(e?.message||e||"");
  if(s.includes("Could not find the function")||s.includes("PGRST202")||s.includes("ol_market")||s.includes("market_"))return "Supabase에서 setup_orders_market.sql을 먼저 실행하세요 (검색 결과는 보이지만 저장되지 않습니다).";
  return priceErr(e);
}
// 상품명에서 총 중량(g): "500g, 2개" → 1000 / "1kg*4" → 4000 / "1,000g" → 1000
function parseWeightG(name){
  const s=String(name||"").replace(/(\d),(\d{3})/g,"$1$2");
  const m=s.match(/(\d+(?:\.\d+)?)\s*(kg|킬로그램|킬로|g|그램)(?![a-z])/i);
  if(!m)return null;
  const g=Number(m[1])*(/^(kg|킬로)/i.test(m[2])?1000:1);
  const rest=s.slice(m.index+m[0].length);
  const c=rest.match(/^\s*(?:[x×*X]\s*(\d+)|[,\s]\s*(\d+)\s*(?:개|팩|봉|입|ea|세트|박스))/i);
  const n=c?Number(c[1]||c[2]):1;
  return g>0&&n>0?g*n:null;
}
// 100g당 가격 — 쿠팡이 보여 준 단위가격이 g/kg이면 그걸, 아니면 상품명 중량으로 계산
function per100g(price,name,unit){
  if(unit&&unit.price&&unit.amount&&/^(g|kg)$/.test(unit.unit))return unit.price*100/(unit.amount*(unit.unit==="kg"?1000:1));
  const g=parseWeightG(name);
  return price&&g?price/g*100:null;
}
function fmtGram(g){return g==null?"–":g>=1000?(Math.round(g/100)/10)+"kg":Math.round(g)+"g"}
function defaultMarketQuery(name,vendor){
  // 내 업체명(브랜드)은 빼야 경쟁 상품이 나옴
  const v=String(vendor||"").trim();
  let raw=String(name||"");
  if(v)raw=raw.split(v).join(" ");
  const s=raw.replace(/\[[^\]]*\]|\([^)]*\)/g," ")
    .replace(/\d+(?:[.,]\d+)?\s*(kg|g|ml|l)\b\s*([x×*]\s*\d+)?/gi," ")
    .replace(/\d+\s*(개|팩|봉|입|ea|세트|박스)/gi," ")
    .replace(/[^0-9A-Za-z가-힣\s]/g," ").replace(/\s+/g," ").trim();
  return s.split(" ").slice(0,4).join(" ");
}
function coupangPid(url){const m=String(url||"").match(/\/vp\/products\/(\d+)/);return m?m[1]:""}
// 확장 프로그램에 검색 요청 → 결과 1번 받기 (최대 90초)
function extSearch(query,limit,page){
  return new Promise(resolve=>{
    const reqId="s"+Date.now()+Math.random().toString(36).slice(2,6);
    const t=setTimeout(()=>{window.removeEventListener("message",f);resolve({error:"90초 안에 응답이 없습니다 (크롬이 느리거나 확장 프로그램이 꺼져 있음)"})},90000);
    const f=e=>{
      if(e.source!==window||!e.data||e.data.__olext!==true||e.data.type!=="searchResult"||e.data.reqId!==reqId)return;
      clearTimeout(t);window.removeEventListener("message",f);resolve(e.data);
    };
    window.addEventListener("message",f);
    window.postMessage({__olpage:true,type:"search",query,limit,page,reqId},location.origin);
  });
}
const SHIP_COLOR=t=>/프레시/.test(t)?"#16a34a":/직구/.test(t)?"#8b5cf6":/판매자/.test(t)?"#f59e0b":"#3b82f6";
const MARKET_SORTS=[["rank","검색 순위"],["u100","100g당 가격"],["price","판매가"],["reviews","리뷰 많은 순"]];

// ⚡ 빠른 확인 — 쿠팡 검색 결과로 "가격이 바뀌었을 수 있는 상품"만 골라 상품 페이지 확인
//  · 저장하는 가격은 언제나 상품 페이지에서 읽은 값 (검색 결과 값은 저장하지 않음)
//  · 상품 페이지로 확인한 직후의 검색 표시(가격·정상가·와우·쿠폰·할인율·품절)를 기억 → 다음 빠른 확인에서 그대로면 "변동 없음"
const FAST_EXT_MIN="1.3.0";
const FAST_PAGES=2;          // 검색어마다 읽을 검색 결과 페이지 수 (페이지당 최대 72개)
const FAST_GAP_MS=5000;      // 검색 페이지 사이 간격
function fastSigOf(it){return [it.price,it.base,it.wowPrice,it.couponPrice,it.rate,it.soldOut?1:0].map(v=>v==null?"":String(v)).join("|")}
function loadFastSigs(){try{return JSON.parse(lsGet("ol-fast-sig","{}"))||{}}catch(e){return {}}}
function saveFastSigs(m){lsSet("ol-fast-sig",JSON.stringify(m))}
function fastNum(v){return v==null||v===""?null:Number(v)}
// 행 하나 판정 → {kind:"same"|"need", reason}
function fastJudge(p,it,shared,sigs){
  if(shared)return {kind:"need",reason:"같은 링크를 쓰는 상품이 여러 개 (검색으로 구분 불가)"};
  if(!it)return {kind:"need",reason:"검색 결과에서 못 찾음"};
  if(it.soldOut)return {kind:"need",reason:"검색 결과에 품절 표시"};
  const S=fastNum(p.sale_price),D=fastNum(p.discount_price??p.sale_price);
  const st=sigs[p.id];
  if(st&&st.sig===fastSigOf(it)&&st.S===S&&st.D===D)return {kind:"same",reason:"지난 페이지 확인 때와 검색 표시가 같음"};
  if(S!=null&&S===D&&it.price===S&&(it.base==null||it.base===S)&&it.wowPrice==null&&it.couponPrice==null&&it.rate==null&&(it.salePrice==null||it.salePrice===S))return {kind:"same",reason:"할인 없음 · 가격 같음"};
  return {kind:"need",reason:st?"검색 표시가 지난번과 다름":"처음 확인 (검색 표시 기억 전)"};
}

function MarketModal({adminHash,p,ext,onClose,onChanged}){
  const[query,setQuery]=useState(()=>p.market_query||defaultMarketQuery(p.name,p.vendor));
  const[snaps,setSnaps]=useState(null);       // 저장된 검색 기록 (최신 먼저)
  const[selId,setSelId]=useState(null);
  const[temp,setTemp]=useState(null);         // 저장 실패 시 화면에만 보이는 결과
  const[busy,setBusy]=useState(false);
  const[msg,setMsg]=useState(null);
  const[excluded,setExcluded]=useState(()=>new Set((Array.isArray(p.market_excluded)?p.market_excluded:[]).map(String)));
  const[showEx,setShowEx]=useState(false);
  const[hideAds,setHideAds]=useState(()=>lsGet("ol-mkt-noads","0")==="1");
  const[sortK,setSortK]=useState(()=>lsGet("ol-mkt-sort","rank"));
  const[delAsk,setDelAsk]=useState(false);
  useEffect(()=>lsSet("ol-mkt-noads",hideAds?"1":"0"),[hideAds]);
  useEffect(()=>lsSet("ol-mkt-sort",sortK),[sortK]);
  const myPid=coupangPid(p.coupang_url);
  const myPrice=p.discount_price??p.sale_price;
  const my100=per100g(myPrice!=null?Number(myPrice):null,p.name,null);

  const loadSnaps=useCallback(async keepSel=>{
    try{
      const d=await rpc("ol_list_market_snaps",{p_admin_hash:adminHash,p_price_id:p.id});
      const list=Array.isArray(d)?d:[];
      setSnaps(list);
      setSelId(s=>keepSel&&s&&list.some(x=>x.id===s)?s:(list[0]?.id??null));
    }catch(e){setSnaps([]);setMsg({t:"err",s:marketErr(e)})}
  },[adminHash,p.id]);
  useEffect(()=>{loadSnaps(false)},[loadSnaps]);

  const cur=temp||(snaps||[]).find(s=>s.id===selId)||null;
  const prevSnap=useMemo(()=>{
    if(!cur||temp)return (snaps||[])[0]&&temp?snaps[0]:null;
    const i=(snaps||[]).findIndex(s=>s.id===cur.id);
    return i>=0?snaps[i+1]||null:null;
  },[cur,snaps,temp]);
  const prevMap=useMemo(()=>{
    const m={};for(const it of (prevSnap?.items||[]))m[it.productId+"|"+(it.itemId||"")]=it;return m;
  },[prevSnap]);

  const search=async()=>{
    const q=query.trim();
    if(!q){setMsg({t:"err",s:"검색어를 입력하세요."});return}
    if(!ext){setMsg({t:"err",s:"크롬 확장 프로그램이 필요합니다 — 판매가 탭의 🧩 버튼에서 설치하세요."});return}
    if(verLt(ext.version,MARKET_EXT_MIN)){setMsg({t:"err",s:`확장 프로그램을 v${MARKET_EXT_MIN} 이상으로 업데이트하세요 (지금 v${ext.version}) — 🧩 버튼에서 새 파일을 받아 덮어쓰고 ↻ 새로고침.`});return}
    setBusy(true);setMsg({t:"info",s:"쿠팡 검색 중… (뒤쪽 탭에서 검색 결과를 열어 읽고 닫습니다)"});
    const r=await extSearch(q,36);
    if(r.blocked){setBusy(false);setMsg({t:"err",s:"쿠팡이 이 컴퓨터의 접속을 잠시 막았습니다 (\"사용권한이 없습니다\"). 몇십 분~몇 시간 뒤 다시 검색하세요."});return}
    if(r.error||!r.items?.length){setBusy(false);setMsg({t:"err",s:(r.error||"검색 결과가 없습니다")+(r.sample?` — 읽은 글씨: "${String(r.sample).slice(0,120)}…"`:"")});return}
    try{
      await rpc("ol_save_market_snap",{p_admin_hash:adminHash,p_price_id:p.id,p_query:q,p_items:r.items});
      setTemp(null);await loadSnaps(false);onChanged&&onChanged();
      setMsg({t:"ok",s:`✓ ${r.items.length}개 상품을 읽어 저장했습니다`});
    }catch(e){
      setTemp({id:"temp",query:q,items:r.items,created_at:new Date().toISOString()});
      setMsg({t:"err",s:marketErr(e)});
    }
    setBusy(false);
  };
  const saveQueryOnly=async()=>{try{await rpc("ol_set_market_prefs",{p_admin_hash:adminHash,p_price_id:p.id,p_query:query.trim(),p_excluded:null});onChanged&&onChanged()}catch(e){}};
  const toggleEx=async pid=>{
    const next=new Set(excluded);next.has(pid)?next.delete(pid):next.add(pid);setExcluded(next);
    try{await rpc("ol_set_market_prefs",{p_admin_hash:adminHash,p_price_id:p.id,p_query:null,p_excluded:[...next]});onChanged&&onChanged()}
    catch(e){setMsg({t:"err",s:marketErr(e)})}
  };
  const delSnap=async()=>{
    if(!cur||cur.id==="temp")return;
    try{await rpc("ol_delete_market_snap",{p_admin_hash:adminHash,p_id:cur.id});setDelAsk(false);await loadSnaps(false)}
    catch(e){setMsg({t:"err",s:marketErr(e)})}
  };

  const rows=useMemo(()=>{
    const list=(cur?.items||[]).map(it=>{
      // 쿠팡 단위가격은 화면에 크게 보인 가격 기준 → 그 가격으로 중량을 구하고, 100g당은 최종가(와우가 또는 정상가)로 계산
      const shown=it.salePrice??it.price;
      const g=it.unit&&/^(g|kg)$/.test(it.unit.unit)&&shown&&it.unit.price?shown/(it.unit.price/(it.unit.amount*(it.unit.unit==="kg"?1000:1))):parseWeightG(it.name);
      const prev=prevMap[it.productId+"|"+(it.itemId||"")];
      return {...it,u100:it.price&&g?it.price/g*100:null,grams:g,mine:!!myPid&&String(it.productId)===myPid,
        ex:excluded.has(String(it.productId)),diff:prev&&prev.price!=null&&it.price!=null?it.price-prev.price:null,isNew:!!prevSnap&&!prev};
    });
    const vis=list.filter(r=>(showEx||!r.ex)&&!(hideAds&&r.ad));
    const by={rank:(a,b)=>a.rank-b.rank,u100:(a,b)=>(a.u100??1e12)-(b.u100??1e12),price:(a,b)=>(a.price??1e12)-(b.price??1e12),reviews:(a,b)=>(b.reviews??-1)-(a.reviews??-1)}[sortK]||((a,b)=>a.rank-b.rank);
    return {all:list,vis:[...vis].sort(by)};
  },[cur,prevMap,prevSnap,excluded,showEx,hideAds,sortK,myPid]);

  const summary=useMemo(()=>{
    const base=rows.all.filter(r=>!r.ex&&!r.mine&&!(hideAds&&r.ad));
    const us=base.map(r=>r.u100).filter(v=>v!=null).sort((a,b)=>a-b);
    const ps=base.map(r=>r.price).filter(v=>v!=null).sort((a,b)=>a-b);
    const med=a=>a.length?(a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2):null;
    const rank=my100!=null&&us.length?us.filter(v=>v<my100).length+1:null;
    return {n:base.length,ads:rows.all.filter(r=>r.ad).length,ex:rows.all.filter(r=>r.ex).length,
      uMin:us[0]??null,uMed:med(us),uMax:us[us.length-1]??null,uN:us.length,pMin:ps[0]??null,pMed:med(ps),pMax:ps[ps.length-1]??null,rank};
  },[rows,hideAds,my100]);

  const when=ts=>new Date(ts).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  return <div>
    <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:12}}>
      <div style={{flex:1}}>
        <h3 style={{margin:0,fontSize:17}}>🔍 시장조사</h3>
        <div style={{fontSize:13,color:"var(--muted)",marginTop:4,wordBreak:"keep-all"}}>{p.name}</div>
      </div>
      <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={onClose}>닫기</button>
    </div>

    <div className="ol-card" style={{padding:12,display:"flex",gap:14,flexWrap:"wrap",alignItems:"center"}}>
      <div><div style={{fontSize:11,color:"var(--muted)"}}>내 판매가</div><div style={{fontSize:16,fontWeight:800}}>{fmtWon(myPrice)}<small style={{fontWeight:500}}>원</small>{isDiscounting(p)&&<span style={{fontSize:11,color:"var(--muted)",fontWeight:500,marginLeft:4,textDecoration:"line-through"}}>{fmtWon(p.sale_price)}</span>}</div></div>
      <div><div style={{fontSize:11,color:"var(--muted)"}}>중량 (상품명 기준)</div><div style={{fontSize:16,fontWeight:700}}>{fmtGram(parseWeightG(p.name))}</div></div>
      <div><div style={{fontSize:11,color:"var(--muted)"}}>100g당</div><div style={{fontSize:16,fontWeight:800,color:"#06b6d4"}}>{my100!=null?fmtWon(Math.round(my100))+"원":"–"}</div></div>
      {cur&&summary.rank!=null&&<div style={{marginLeft:"auto",textAlign:"right"}}><div style={{fontSize:11,color:"var(--muted)"}}>100g당 가격 순위 (싼 순)</div>
        <div style={{fontSize:16,fontWeight:800}}>{summary.uN+1}개 중 <span style={{color:summary.rank<=Math.ceil((summary.uN+1)/3)?"#16a34a":summary.rank>Math.floor((summary.uN+1)*2/3)?"#ef4444":"#f59e0b"}}>{summary.rank}위</span></div></div>}
      {my100==null&&<div style={{fontSize:11,color:"var(--muted)",flexBasis:"100%"}}>상품명에 중량(예: 500g, 1kg*4)이 없어 100g당 가격을 계산하지 못했습니다.</div>}
    </div>

    <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",margin:"10px 0"}}>
      <input className="ol-input" style={{flex:"1 1 220px"}} value={query} onChange={e=>setQuery(e.target.value)} onBlur={saveQueryOnly}
        onKeyDown={e=>{if(e.key==="Enter"&&!busy)search()}} placeholder="쿠팡 검색어 (예: 돌돌말이 우삼겹)"/>
      <button className="ol-btn ol-btn-primary" disabled={busy} onClick={search}>{busy?"검색 중…":"🔍 쿠팡 검색"}</button>
      <button className="ol-btn ol-btn-secondary ol-btn-sm" disabled={busy} onClick={()=>setQuery(defaultMarketQuery(p.name,p.vendor))} title="상품명에서 검색어 다시 만들기">↺</button>
    </div>
    {!ext&&<div className="ol-warn" style={{fontSize:12}}>검색하려면 크롬 확장 프로그램(v{MARKET_EXT_MIN} 이상)이 필요합니다. 판매가 탭의 🧩 버튼에서 받으세요. 저장된 검색 기록은 확장 없이도 볼 수 있습니다.</div>}
    {msg&&<div className={msg.t==="err"?"ol-warn":"ol-ok"} style={{fontSize:13}}>{msg.s}</div>}

    {snaps===null?<Loader/>:!cur?<Empty emoji="🔍" text="아직 검색 기록이 없습니다 — 검색어를 확인하고 🔍 쿠팡 검색을 누르세요"/>:<>
      {snaps.length>0&&<div className="ol-chips" style={{marginBottom:8,flexWrap:"wrap"}}>
        {temp&&<button className="on">저장 안 됨</button>}
        {snaps.map(s=><button key={s.id} className={!temp&&s.id===selId?"on":""} onClick={()=>{setTemp(null);setSelId(s.id);setDelAsk(false)}} title={s.query}>{when(s.created_at)}</button>)}
      </div>}
      <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",fontSize:12,color:"var(--muted)",marginBottom:8}}>
        <span>검색어 <b style={{color:"var(--text)"}}>{cur.query}</b> · {when(cur.created_at)} · {rows.all.length}개{summary.ads?` (광고 ${summary.ads})`:""}{prevSnap?` · ${when(prevSnap.created_at)} 검색과 비교`:""}</span>
        {cur.id!=="temp"&&(delAsk?<span style={{marginLeft:"auto"}}>이 기록을 삭제할까요? <button className="ol-btn ol-btn-danger ol-btn-sm" onClick={delSnap}>삭제</button> <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setDelAsk(false)}>취소</button></span>
          :<button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginLeft:"auto"}} onClick={()=>setDelAsk(true)}>🗑 이 기록 삭제</button>)}
      </div>

      <div className="fz-stats" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
        <div className="fz-stat"><div className="k">100g당 최저</div><div className="v" style={{fontSize:18}}>{summary.uMin!=null?fmtWon(Math.round(summary.uMin)):"–"}<small>원</small></div></div>
        <div className="fz-stat"><div className="k">100g당 중간값</div><div className="v" style={{fontSize:18}}>{summary.uMed!=null?fmtWon(Math.round(summary.uMed)):"–"}<small>원</small></div></div>
        <div className="fz-stat"><div className="k">판매가 범위</div><div className="v" style={{fontSize:15}}>{fmtWon(summary.pMin)} ~ {fmtWon(summary.pMax)}</div></div>
      </div>

      <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",margin:"4px 0 8px",fontSize:12}}>
        <div className="ol-chips">{MARKET_SORTS.map(([k,l])=><button key={k} className={sortK===k?"on":""} onClick={()=>setSortK(k)}>{l}</button>)}</div>
        <label style={{display:"flex",gap:4,alignItems:"center"}}><input type="checkbox" checked={hideAds} onChange={e=>setHideAds(e.target.checked)}/>광고 숨기기</label>
        {summary.ex>0&&<label style={{display:"flex",gap:4,alignItems:"center"}}><input type="checkbox" checked={showEx} onChange={e=>setShowEx(e.target.checked)}/>제외한 상품 보기 ({summary.ex})</label>}
      </div>

      <div className="ol-scroll" style={{maxHeight:"55vh",overflow:"auto"}}><table className="ol-table" style={{minWidth:860}}>
        <thead><tr><th className="center">순위</th><th></th><th>상품</th><th className="right">중량</th><th className="right">정상가</th><th className="right">판매가</th><th className="right">100g당</th><th className="right">리뷰</th><th></th></tr></thead>
        <tbody>{rows.vis.map(r=><tr key={r.productId+"|"+r.itemId} style={{opacity:r.ex?.45:1,background:r.mine?"rgba(6,182,212,.08)":undefined}}>
          <td className="center" style={{fontSize:12,color:"var(--muted)",whiteSpace:"nowrap"}}>{r.rank}{r.ad&&<div style={{fontSize:9,fontWeight:800,color:"#f59e0b"}}>광고</div>}</td>
          <td style={{width:52,padding:"4px 6px"}}>{r.thumb?<img src={r.thumb} alt="" referrerPolicy="no-referrer" loading="lazy" style={{width:44,height:44,objectFit:"cover",borderRadius:6,display:"block"}} onError={e=>{e.currentTarget.style.visibility="hidden"}}/>:null}</td>
          <td style={{minWidth:260}}>
            <a href={r.url} target="_blank" rel="noopener noreferrer" style={{color:"var(--text)",textDecoration:"none",fontWeight:600,fontSize:13,wordBreak:"keep-all"}}>{r.name||"(이름 없음)"} <span style={{color:"var(--muted)",fontSize:11}}>↗</span></a>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:3,fontSize:10,fontWeight:700}}>
              {r.mine&&<span style={{color:"#06b6d4"}}>★ 내 상품</span>}
              {r.ship&&<span style={{color:SHIP_COLOR(r.ship)}}>{r.ship}</span>}
              {r.soldOut&&<span style={{color:"#ef4444"}}>품절</span>}
              {r.isNew&&<span style={{color:"#8b5cf6"}}>NEW</span>}
              {r.rating!=null&&<span style={{color:"var(--muted)",fontWeight:500}}>★{r.rating}</span>}
            </div>
          </td>
          <td className="right" style={{fontSize:12,whiteSpace:"nowrap"}}>{fmtGram(r.grams)}</td>
          <td className="right" style={{fontSize:12,color:"var(--muted)",whiteSpace:"nowrap",textDecoration:r.base&&r.price!=null&&r.price<r.base?"line-through":undefined}}>{r.base?fmtWon(r.base):"–"}</td>
          <td className="right" style={{whiteSpace:"nowrap"}}>
            <b>{fmtWon(r.price)}</b>{r.wowPrice!=null&&r.rate!=null&&<span style={{fontSize:11,color:"#ef4444",fontWeight:700,marginLeft:4}}>{r.rate}%</span>}
            {r.wowPrice!=null&&<div style={{fontSize:10,fontWeight:700,color:"#8b5cf6"}}>와우할인가</div>}
            {r.diff?<div style={{fontSize:10,fontWeight:700,color:r.diff>0?"#ef4444":"#3b82f6"}}>{r.diff>0?"▲":"▼"}{fmtWon(Math.abs(r.diff))}</div>:null}
          </td>
          <td className="right" style={{whiteSpace:"nowrap",fontWeight:700,color:r.u100!=null&&my100!=null?(r.u100<my100?"#ef4444":"#16a34a"):undefined}}>{r.u100!=null?fmtWon(Math.round(r.u100)):"–"}</td>
          <td className="right" style={{fontSize:12,whiteSpace:"nowrap"}}>{r.reviews!=null?fmtNum(r.reviews):"–"}</td>
          <td className="right">{!r.mine&&<button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>toggleEx(String(r.productId))} title={r.ex?"다시 포함":"비슷하지 않은 상품 — 다음 검색에서도 제외"}>{r.ex?"포함":"제외"}</button>}</td>
        </tr>)}</tbody>
      </table></div>
      <div style={{fontSize:11,color:"var(--muted)",lineHeight:1.7,marginTop:8}}>
        · 판매가 = 검색 결과에 크게 표시된 가격, 정상가 = 줄 그어진 가격입니다. 100g당은 쿠팡이 보여 준 단위가격 또는 상품명의 중량(예: 500g, 2개)으로 계산합니다.<br/>
        · 100g당 가격이 <span style={{color:"#ef4444",fontWeight:700}}>빨강</span>이면 내 상품보다 쌈, <span style={{color:"#16a34a",fontWeight:700}}>초록</span>이면 비쌈. ▲▼는 바로 전 검색 대비 판매가 변화입니다.<br/>
        · 비슷하지 않은 상품은 <b>제외</b>를 누르면 이 상품의 다음 검색에서도 계속 빠집니다. 검색 기록은 180일 보관됩니다.
      </div>
    </>}
  </div>;
}

function PriceView({adminHash}){
  const[data,setData]=useState(null);
  const[err,setErr]=useState("");
  const[q,setQ]=useState("");
  const[sheetF,setSheetF]=useState(()=>lsGet("ol-price-sheet","all"));
  const[onlyDisc,setOnlyDisc]=useState(false);
  const[onlySold,setOnlySold]=useState(false);
  const stockWarned=useRef(false);
  const[editing,setEditing]=useState(null);
  const[showBm,setShowBm]=useState(false);
  const[msg,setMsg]=useState(null);
  const[histOpen,setHistOpen]=useState(false);
  const[delId,setDelId]=useState(null);
  const[marketP,setMarketP]=useState(null); // 🔍 시장조사 창
  const[fast,setFast]=useState(null);       // ⚡ 빠른 확인 결과
  const[fastOpen,setFastOpen]=useState(false);
  const[fastQ,setFastQ]=useState(()=>lsGet("ol-fast-queries",""));
  useEffect(()=>lsSet("ol-fast-queries",fastQ),[fastQ]);
  const fastStop=useRef(false);
  const fastFound=useRef({}); // 상품 id → 이번 빠른 확인의 검색 표시 (페이지 확인 성공 후 기억용)
  const fileRef=useRef(null);
  useEffect(()=>lsSet("ol-price-sheet",sheetF),[sheetF]);
  // 크롬 확장 프로그램 (쿠팡 가격 전체 갱신)
  const[ext,setExt]=useState(null);
  const[showExt,setShowExt]=useState(false);
  const[run,setRun]=useState(null); // {jobs,total,currentId,done:{id:결과},status:running|done|stopped|blocked}
  const[gap,setGap]=useState(()=>{const n=Number(lsGet("ol-price-gap2","8"));return PRICE_GAPS.includes(n)?n:8});
  useEffect(()=>lsSet("ol-price-gap2",String(gap)),[gap]);
  const dataRef=useRef(null);
  const extHandler=useRef(null);

  const load=useCallback(async()=>{
    try{const d=await rpc("ol_list_prices",{p_admin_hash:adminHash});setData({items:d?.items||[],history:d?.history||[]});setErr("")}
    catch(e){setErr(priceErr(e));setData(d=>d||{items:[],history:[]})}
  },[adminHash]);
  useEffect(()=>{load()},[load]);
  // 가격 저장 창(다른 창)에서 저장하면 바로 새로고침 + 이 탭으로 돌아오면 새로고침
  useEffect(()=>{
    let bc=null;try{bc=new BroadcastChannel("ol-prices");bc.onmessage=()=>load()}catch(e){}
    const f=()=>{if(document.visibilityState==="visible")load()};
    document.addEventListener("visibilitychange",f);
    return()=>{try{bc&&bc.close()}catch(e){}document.removeEventListener("visibilitychange",f)};
  },[load]);

  const items=data?.items||[];
  const history=data?.history||[];
  const vendors=useMemo(()=>[...new Set(items.map(p=>p.vendor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko")),[items]);
  const sheets=useMemo(()=>{
    const m=new Map();
    for(const p of sortPriceItems(items)){const k=priceSheetKey(p);if(!m.has(k))m.set(k,{key:k,name:priceSheetName(p),count:0});m.get(k).count++}
    return [...m.values()];
  },[items]);
  const lastChange=useMemo(()=>{
    const m={};const lim=Date.now()-14*86400000;
    for(const h of history){if(new Date(h.created_at).getTime()<lim)continue;const k=h.price_id+"|"+h.field;if(!m[k])m[k]=h}
    return m;
  },[history]);
  const filtered=useMemo(()=>{
    const s=q.trim().toLowerCase();
    return sortPriceItems(items).filter(p=>{
      if(sheetF!=="all"&&priceSheetKey(p)!==sheetF)return false;
      if(onlyDisc&&!isDiscounting(p))return false;
      if(onlySold&&!(p.sold_out===true||p.stock_left>0))return false;
      if(!s)return true;
      return [p.name,p.sku_id,p.barcode,p.vendor,p.memo].some(x=>String(x||"").toLowerCase().includes(s));
    });
  },[items,q,sheetF,onlyDisc,onlySold]);
  const groups=useMemo(()=>{
    const m=new Map();
    for(const p of filtered){const k=priceSheetKey(p);if(!m.has(k))m.set(k,{key:k,name:priceSheetName(p),storage:p.storage,list:[]});m.get(k).list.push(p)}
    return [...m.values()];
  },[filtered]);
  const stats=useMemo(()=>({
    total:items.length,disc:items.filter(isDiscounting).length,
    today:items.filter(p=>daysAgo(p.price_checked_at)===0).length,
    stale:items.filter(p=>{const d=daysAgo(p.price_checked_at);return d==null||d>7}).length,
    sold:items.filter(p=>p.sold_out===true).length,low:items.filter(p=>p.sold_out!==true&&p.stock_left>0).length,
  }),[items]);

  const setPrice=async(p,key,n)=>{
    setData(d=>({...d,items:d.items.map(x=>x.id===p.id?{...x,[key]:n,price_checked_at:new Date().toISOString()}:x)}));
    try{await rpc("ol_set_price_values",{p_admin_hash:adminHash,p_id:p.id,p_values:{[key]:n},p_source:"manual"})}
    catch(e){setMsg({t:"err",s:priceErr(e)})}
    load();
  };
  dataRef.current=data;
  // 확장 프로그램이 보낸 결과 처리 (가격은 이 페이지가 바로 저장)
  extHandler.current=async d=>{
    if(d.type==="start"){setRun(r=>r&&{...r,status:"running"});return}
    if(d.type==="progress"){setRun(r=>r&&{...r,currentId:d.id});return}
    if(d.type==="error"){setMsg({t:"err",s:d.message});setRun(r=>r&&r.status==="running"?{...r,status:"stopped"}:r);return}
    if(d.type==="result"){
      const old=(dataRef.current?.items||[]).find(x=>x.id===d.id);
      let res;
      if(d.error)res={error:d.error};
      else{
        const hasPrice=d.sale_price!=null;
        const changed=hasPrice&&(!old||Number(old.sale_price)!==d.sale_price||Number(old.discount_price??old.sale_price)!==d.discount_price);
        res={sale:d.sale_price,disc:d.discount_price,oldSale:old?.sale_price??null,oldDisc:old?.discount_price??null,changed,
          soldOut:d.sold_out===true,wasSold:old?.sold_out===true,stockLeft:d.stock_left??null};
        try{
          if(hasPrice){
            await rpc("ol_set_price_values",{p_admin_hash:adminHash,p_id:d.id,p_values:{sale_price:d.sale_price,discount_price:d.discount_price},p_source:"capture"});
            setData(dd=>dd&&{...dd,items:dd.items.map(x=>x.id===d.id?{...x,sale_price:d.sale_price,discount_price:d.discount_price,price_checked_at:new Date().toISOString()}:x)});
            const fit=fastFound.current[d.id];
            if(fit){const m=loadFastSigs();m[d.id]={sig:fastSigOf(fit),S:Number(d.sale_price),D:Number(d.discount_price),at:Date.now()};saveFastSigs(m)}
          }
        }catch(e){res={error:"저장 실패: "+priceErr(e)}}
        // 품절 여부 저장 (확장 1.5.0 이상이 보내 줌)
        if(!res.error&&d.sold_out!=null){
          try{
            await rpc("ol_set_price_stock",{p_admin_hash:adminHash,p_id:d.id,p_sold_out:d.sold_out,p_stock_left:d.stock_left??null});
            const now=new Date().toISOString();
            setData(dd=>dd&&{...dd,items:dd.items.map(x=>x.id===d.id?{...x,sold_out:d.sold_out,stock_left:d.sold_out?0:(d.stock_left??null),stock_checked_at:now,
              sold_out_at:d.sold_out?(x.sold_out===true&&x.sold_out_at?x.sold_out_at:now):null}:x)});
          }catch(e){
            if(!stockWarned.current){stockWarned.current=true;setMsg({t:"err",s:"품절 여부를 저장하지 못했습니다 — Supabase에서 setup_orders_stock.sql 을 실행해 주세요. (가격은 정상 저장)"})}
          }
        }
      }
      setRun(r=>r&&{...r,done:{...r.done,[d.id]:res}});
      return;
    }
    if(d.type==="done"||d.type==="stopped"){
      setRun(r=>r&&{...r,currentId:null,status:d.type==="done"?"done":d.reason==="blocked"?"blocked":d.reason==="fails"?"fails":"stopped"});
      load();
    }
  };
  useEffect(()=>{
    const onMsg=e=>{
      if(e.source!==window||!e.data||e.data.__olext!==true)return;
      const d=e.data;
      if(d.type==="ready"||d.type==="pong"){setExt({version:d.version});return}
      extHandler.current&&extHandler.current(d);
    };
    window.addEventListener("message",onMsg);
    window.postMessage({__olpage:true,type:"ping"},location.origin);
    return()=>window.removeEventListener("message",onMsg);
  },[]);
  const extOld=!!ext&&verLt(ext.version,EXT_LATEST);
  const startRun=(list,prev)=>{
    if(!ext||extOld){setShowExt(true);return}
    const jobs=prev?prev.jobs.filter(j=>!prev.done[j.id]):list.filter(p=>/coupang\.com/i.test(p.coupang_url||"")).map(p=>({id:p.id,url:p.coupang_url}));
    if(!jobs.length){setMsg({t:"err",s:"쿠팡 링크가 있는 상품이 없습니다."});return}
    setRun(prev?{...prev,status:"running"}:{jobs,total:jobs.length,done:{},status:"running",currentId:null});
    window.postMessage({__olpage:true,type:"run",jobs,delayMs:gap*1000},location.origin);
  };
  const stopRun=()=>window.postMessage({__olpage:true,type:"stop"},location.origin);
  const runTargets=filtered.filter(p=>/coupang\.com/i.test(p.coupang_url||""));

  const fastQueries=()=>{
    const own=fastQ.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
    return own.length?own:[...new Set(runTargets.map(p=>p.vendor).filter(Boolean))];
  };
  const runFast=async()=>{
    if(!ext||extOld){setShowExt(true);return}
    const list=runTargets;
    const qs=fastQueries();
    if(!list.length||!qs.length)return;
    fastStop.current=false;
    const found={};const log=[];
    const total=qs.length*FAST_PAGES;let step=0;
    setFast({status:"running",step:0,total,log:[],rows:null,queries:qs});setFastOpen(false);
    let blocked=false;
    outer:for(const q of qs){
      for(let pg=1;pg<=FAST_PAGES;pg++){
        if(fastStop.current)break outer;
        if(step>0)await new Promise(r=>setTimeout(r,FAST_GAP_MS));
        setFast(f=>f&&{...f,step:step+1,cur:`"${q}" ${pg}페이지`});
        const r=await extSearch(q,72,pg);
        step++;
        if(r.blocked){blocked=true;log.push(`"${q}" ${pg}p: 쿠팡 접속 차단`);break outer}
        if(r.error||!r.items){log.push(`"${q}" ${pg}p: ${r.error||"결과 없음"}`);break}
        let add=0;for(const it of r.items){if(!found[it.productId]){found[it.productId]=it;add++}}
        log.push(`"${q}" ${pg}p: ${r.items.length}개 (새 상품 ${add})`);
        setFast(f=>f&&{...f,log:[...log]});
        if(r.items.length<60)break;   // 마지막 페이지
      }
    }
    const pidCount={};for(const p of list){const k=coupangPid(p.coupang_url);if(k)pidCount[k]=(pidCount[k]||0)+1}
    const sigs=loadFastSigs();
    const rows=list.map(p=>{const pid=coupangPid(p.coupang_url);const it=found[pid]||null;return {p,it,...fastJudge(p,it,pidCount[pid]>1,sigs)}});
    fastFound.current={};
    for(const r of rows)if(r.it&&r.kind==="need"&&!(pidCount[coupangPid(r.p.coupang_url)]>1))fastFound.current[r.p.id]=r.it;
    // 변동 없음 → 확인 시각만 갱신 + 검색 표시 기억
    let touched=0;
    for(const r of rows.filter(r=>r.kind==="same")){
      try{
        await rpc("ol_set_price_values",{p_admin_hash:adminHash,p_id:r.p.id,p_values:{},p_source:"capture"});touched++;
        sigs[r.p.id]={sig:fastSigOf(r.it),S:fastNum(r.p.sale_price),D:fastNum(r.p.discount_price??r.p.sale_price),at:Date.now()};
      }catch(e){r.kind="need";r.reason="확인 시각 저장 실패"}
    }
    saveFastSigs(sigs);
    const status=blocked?"blocked":fastStop.current?"stopped":"done";
    setFast({status,step,total,log,rows,queries:qs,touched,found:Object.keys(found).length});
    load();
  };

  const onFile=async e=>{
    const f=e.target.files?.[0];e.target.value="";
    if(!f)return;
    setMsg({t:"info",s:"엑셀 읽는 중…"});
    try{
      const {rows,sheets,dupSkus}=parsePriceWorkbook(await f.arrayBuffer());
      if(!rows.length){setMsg({t:"err",s:"상품을 찾지 못했습니다 — 제목 행에 '상품명' 칸이 있어야 합니다."});return}
      const res=await rpc("ol_import_prices",{p_admin_hash:adminHash,p_rows:rows});
      setMsg({t:"ok",s:`✓ ${sheets.join(" · ")} — 새 상품 ${res?.inserted||0}개, 기존 상품 ${res?.updated||0}개 갱신 (가격 바뀜 ${res?.price_changes||0}건)`
        +(dupSkus.length?` · ⚠ SKU ID가 겹치는 상품이 있습니다 (${dupSkus.join(", ")}) — 상품명으로 구분했으니 SKU를 확인해 주세요`:"")});
      load();
    }catch(err){setMsg({t:"err",s:priceErr(err)})}
  };
  const del=async p=>{
    try{await rpc("ol_delete_price",{p_admin_hash:adminHash,p_id:p.id});setDelId(null);load()}
    catch(e){setMsg({t:"err",s:priceErr(e)})}
  };

  if(!data)return <Loader/>;
  return <>
    <div className="ol-toolbar">
      <button className="ol-btn ol-btn-primary" onClick={()=>setEditing({})}>+ 상품 추가</button>
      <button className="ol-btn ol-btn-secondary" onClick={()=>fileRef.current?.click()}>📁 엑셀 가져오기</button>
      <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={onFile}/>
      <button className="ol-btn ol-btn-secondary" disabled={!items.length} onClick={()=>downloadPriceXlsx(filtered.length&&(sheetF!=="all"||q||onlyDisc)?filtered:items)}>📥 엑셀 내보내기</button>
      <button className="ol-btn ol-btn-secondary" onClick={()=>setShowBm(true)}>🔖 가격 가져오기 버튼</button>
      <input className="ol-input" style={{maxWidth:240,marginLeft:"auto"}} placeholder="상품명·SKU·바코드 검색" value={q} onChange={e=>setQ(e.target.value)}/>
    </div>
    {items.length>0&&<div className="ol-card" style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",padding:"12px 14px",borderColor:"rgba(6,182,212,.4)"}}>
      <button className="ol-btn ol-btn-primary" style={{fontSize:14}} disabled={run?.status==="running"||!runTargets.length}
        onClick={()=>startRun(runTargets)}>🔄 쿠팡 가격 전체 갱신 ({runTargets.length}개)</button>
      <button className="ol-btn ol-btn-secondary" style={{fontSize:14,borderColor:"#f59e0b",color:"#f59e0b"}} disabled={run?.status==="running"||fast?.status==="running"||!runTargets.length}
        onClick={runFast} title="쿠팡 검색 결과로 가격이 바뀌었을 수 있는 상품만 골라 페이지 확인">⚡ 빠른 확인</button>
      <label style={{fontSize:12,color:"var(--muted)",display:"flex",alignItems:"center",gap:6}}>상품 사이 간격
        <select className="ol-input" style={{width:"auto",padding:"5px 8px"}} value={gap} onChange={e=>setGap(Number(e.target.value))} disabled={run?.status==="running"}>
          {PRICE_GAPS.map(n=><option key={n} value={n}>{n}초</option>)}
        </select></label>
      <span style={{fontSize:12,color:"var(--muted)",flex:1,minWidth:200}}>
        {(sheetF!=="all"||q||onlyDisc)?"지금 보이는 상품만 갱신합니다 · ":""}예상 {Math.ceil(runTargets.length*(gap+4)/60)}분
      </span>
      <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setShowExt(true)}>{ext?`🧩 확장 v${ext.version}`:"🧩 확장 프로그램 설치"}</button>
      {extOld&&<div style={{flexBasis:"100%",fontSize:13,color:"#ef4444",fontWeight:600}}>⛔ 확장 프로그램이 예전 버전(v{ext.version})이라 가격 갱신이 막혀 있습니다 — 🧩 버튼에서 새 파일(v{EXT_LATEST})을 받아 같은 폴더에 덮어쓰고, 확장 프로그램 관리 화면에서 ↻ 새로고침한 뒤 이 페이지를 새로고침하세요.</div>}
    </div>}
    {items.length>0&&<div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",margin:"-4px 0 12px",fontSize:12,color:"var(--muted)"}}>
      <span>⚡ 빠른 확인 검색어</span>
      <input className="ol-input" style={{flex:"1 1 260px",maxWidth:460,padding:"5px 8px",fontSize:12}} value={fastQ} onChange={e=>setFastQ(e.target.value)}
        placeholder={`비우면 업체명으로 검색: ${[...new Set(runTargets.map(p=>p.vendor).filter(Boolean))].join(", ")} (쉼표로 여러 개)`}/>
    </div>}
    {fast&&(()=>{
      const rows=fast.rows||[];
      const same=rows.filter(r=>r.kind==="same"),need=rows.filter(r=>r.kind!=="same");
      const notFound=need.filter(r=>!r.it).length;
      return <div className="ol-card" style={{padding:14,borderColor:"rgba(245,158,11,.45)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:6}}>
          <b style={{fontSize:14}}>{fast.status==="running"?"⚡ 빠른 확인 중":fast.status==="blocked"?"⚠ 쿠팡 접속 차단 — 읽은 만큼만 판정":fast.status==="stopped"?"⏸ 빠른 확인 중지됨":"⚡ 빠른 확인 완료"}</b>
          {fast.status==="running"&&<span style={{fontSize:12,color:"var(--muted)"}}>검색 {fast.step}/{fast.total} · {fast.cur||""}</span>}
          <span style={{marginLeft:"auto",display:"flex",gap:6}}>
            {fast.status==="running"?<button className="ol-btn ol-btn-danger ol-btn-sm" onClick={()=>{fastStop.current=true}}>중지</button>
              :<button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setFast(null)}>닫기</button>}
          </span>
        </div>
        {fast.rows&&<>
          <div style={{display:"flex",gap:14,flexWrap:"wrap",fontSize:13,margin:"6px 0 10px"}}>
            <span>검색에서 찾은 상품 <b>{fast.found}</b>개</span>
            <span style={{color:"#16a34a"}}>✓ 변동 없음 <b>{same.length}</b> <small style={{color:"var(--muted)"}}>(확인 시각만 갱신)</small></span>
            <span style={{color:"#f59e0b"}}>페이지 확인 필요 <b>{need.length}</b>{notFound?<small style={{color:"var(--muted)"}}> (검색에서 못 찾음 {notFound})</small>:null}</span>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
            {need.length>0&&<button className="ol-btn ol-btn-primary" disabled={run?.status==="running"} onClick={()=>startRun(need.map(r=>r.p))}>🔄 필요한 {need.length}개만 페이지 확인 (약 {Math.ceil(need.length*(gap+4)/60)}분)</button>}
            {need.length===0&&<span className="ol-ok" style={{margin:0,padding:"6px 10px",fontSize:13}}>모든 상품이 변동 없음 — 페이지 확인이 필요 없습니다</span>}
            <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setFastOpen(o=>!o)}>{fastOpen?"상품별 판정 닫기 ▲":"상품별 판정 보기 ▼"}</button>
          </div>
          {fastOpen&&<div className="ol-scroll" style={{maxHeight:340,overflow:"auto",marginTop:8}}><table className="ol-table" style={{minWidth:760}}>
            <thead><tr><th>상품</th><th className="right">저장된 판매가 / 할인가</th><th className="right">검색 결과 표시</th><th>판정</th></tr></thead>
            <tbody>{[...need,...same].map(r=><tr key={r.p.id}>
              <td style={{fontSize:12}}>{r.p.name}</td>
              <td className="right" style={{fontSize:12,whiteSpace:"nowrap"}}>{fmtWon(r.p.sale_price)} / {fmtWon(r.p.discount_price??r.p.sale_price)}</td>
              <td className="right" style={{fontSize:12,whiteSpace:"nowrap"}}>{r.it?<><b>{fmtWon(r.it.price)}</b>{r.it.base?<span style={{textDecoration:"line-through",color:"var(--muted)",marginLeft:4}}>{fmtWon(r.it.base)}</span>:null}{r.it.rate!=null?<span style={{color:"#ef4444",marginLeft:4}}>{r.it.rate}%</span>:null}{r.it.wowPrice?<div style={{fontSize:10,color:"var(--muted)"}}>와우 {fmtWon(r.it.wowPrice)}</div>:null}{r.it.couponPrice?<div style={{fontSize:10,color:"var(--muted)"}}>쿠폰 {fmtWon(r.it.couponPrice)}</div>:null}</>:"–"}</td>
              <td style={{fontSize:12,color:r.kind==="same"?"#16a34a":"#f59e0b"}}>{r.kind==="same"?"✓ ":"→ "}{r.reason}</td>
            </tr>)}</tbody>
          </table></div>}
        </>}
        {fast.log?.length>0&&<div style={{fontSize:11,color:"var(--muted)",marginTop:8}}>{fast.log.join(" · ")}</div>}
        {fast.status==="blocked"&&<div className="ol-warn" style={{fontSize:12,marginTop:8}}>쿠팡이 접속을 잠시 막았습니다. 몇십 분~몇 시간 뒤 다시 시도하세요. 못 읽은 상품은 "페이지 확인 필요"로 분류됩니다.</div>}
        {fast.rows&&<div style={{fontSize:11,color:"var(--muted)",lineHeight:1.6,marginTop:8}}>
          · 가격은 언제나 <b>상품 페이지</b>에서 읽은 값으로 저장됩니다. 검색 결과는 "바뀌었을 수 있는 상품"을 고르는 데만 씁니다.<br/>
          · 처음에는 검색 표시를 기억해 둔 게 없어 할인 중인 상품은 "페이지 확인 필요"로 나옵니다. 한 번 페이지 확인을 하면 그때의 검색 표시를 기억해, 다음부터는 바뀐 상품만 확인합니다.<br/>
          · 같은 쿠팡 링크를 여러 상품이 같이 쓰면(옵션 번호 없음) 검색으로 구분할 수 없어 항상 페이지 확인 대상입니다.
        </div>}
      </div>;
    })()}
    {run&&(()=>{
      const doneN=Object.keys(run.done).length;
      const vals=Object.entries(run.done);
      const fails=vals.filter(([,r])=>r.error);
      const changes=vals.filter(([,r])=>!r.error&&r.changed);
      const solds=vals.filter(([,r])=>!r.error&&(r.soldOut||r.wasSold));
      const nameOf=id=>(items.find(x=>String(x.id)===String(id))||{}).name||("#"+id);
      const cur=run.currentId!=null?items.find(x=>x.id===run.currentId):null;
      const pct=run.total?Math.round(doneN/run.total*100):0;
      return <div className="ol-card" style={{padding:14}}>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:8}}>
          <b style={{fontSize:14}}>{run.status==="running"?"🔄 쿠팡 가격 갱신 중":run.status==="done"?"✓ 갱신 완료":run.status==="blocked"?"⚠ 쿠팡 접속 차단으로 멈춤":run.status==="fails"?"⚠ 연속 실패로 멈춤":"⏸ 중지됨"}</b>
          <span style={{fontSize:13,fontVariantNumeric:"tabular-nums"}}>{doneN} / {run.total}</span>
          <span style={{fontSize:12,color:"#16a34a"}}>성공 {doneN-fails.length}</span>
          <span style={{fontSize:12,color:"#06b6d4"}}>가격 바뀜 {changes.length}</span>
          {solds.some(([,r])=>r.soldOut)&&<span style={{fontSize:12,color:"#ef4444",fontWeight:700}}>품절 {solds.filter(([,r])=>r.soldOut).length}</span>}
          {fails.length>0&&<span style={{fontSize:12,color:"#ef4444"}}>실패 {fails.length}</span>}
          <span style={{marginLeft:"auto",display:"flex",gap:6}}>
            {run.status==="running"&&<button className="ol-btn ol-btn-danger ol-btn-sm" onClick={stopRun}>중지</button>}
            {(run.status==="blocked"||run.status==="stopped"||run.status==="fails")&&doneN<run.total&&<button className="ol-btn ol-btn-primary ol-btn-sm" onClick={()=>startRun(null,run)}>이어서 갱신 ({run.total-doneN}개)</button>}
            {run.status!=="running"&&<button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setRun(null)}>닫기</button>}
          </span>
        </div>
        <div style={{height:8,borderRadius:4,background:"var(--div2)",overflow:"hidden",marginBottom:8}}>
          <div style={{height:"100%",width:pct+"%",background:"linear-gradient(90deg,#06b6d4,#8b5cf6)",transition:"width .3s"}}/>
        </div>
        {run.status==="running"&&cur&&<div style={{fontSize:12,color:"var(--muted)"}}>읽는 중: {cur.name}</div>}
        {run.status==="blocked"&&<div className="ol-warn" style={{fontSize:13,margin:"6px 0",lineHeight:1.6}}>쿠팡이 <b>"요청하신 페이지의 사용권한이 없습니다"</b> 화면으로 이 컴퓨터의 접속을 잠시 막았습니다 (짧은 시간에 페이지를 많이 열었다고 판단). 보통 <b>몇십 분~몇 시간 뒤</b> 풀립니다.
          그동안 쿠팡을 계속 열면 더 길어질 수 있으니 기다렸다가 간격을 <b>15초 이상</b>으로 늘려 <b>이어서 갱신</b>을 누르세요.</div>}
        {run.status==="fails"&&<div className="ol-warn" style={{fontSize:13,margin:"6px 0",lineHeight:1.6}}>3개 연속으로 가격을 읽지 못해 멈췄습니다. 실패한 상품의 <b>쿠팡↗</b> 링크를 직접 열어 보세요 — 쿠팡 차단 화면이면 잠시 기다렸다가, 상품 페이지가 정상이면 링크(판매중지·옵션 변경)를 확인한 뒤 <b>이어서 갱신</b>하세요.</div>}
        {(changes.length>0||fails.length>0||solds.length>0)&&<div className="ol-scroll" style={{maxHeight:260,overflow:"auto",marginTop:6}}><table className="ol-table" style={{minWidth:560}}>
          <tbody>
            {changes.map(([id,r])=><tr key={"c"+id}>
              <td style={{fontSize:12}}>{nameOf(id)}</td>
              <td className="right" style={{fontSize:12,whiteSpace:"nowrap"}}>판매가 {fmtWon(r.oldSale)} → <b>{fmtWon(r.sale)}</b></td>
              <td className="right" style={{fontSize:12,whiteSpace:"nowrap"}}>할인가 {fmtWon(r.oldDisc??r.oldSale)} → <b style={{color:r.disc<r.sale?"#ef4444":undefined}}>{fmtWon(r.disc)}</b></td>
            </tr>)}
            {solds.map(([id,r])=><tr key={"s"+id}>
              <td style={{fontSize:12}}>{nameOf(id)}</td>
              <td colSpan={2} style={{fontSize:12,fontWeight:700,color:r.soldOut?"#ef4444":"#16a34a"}}>{r.soldOut?(r.wasSold?"⛔ 계속 품절":"⛔ 품절됨"):"✓ 다시 판매 중 (품절 풀림)"}</td>
            </tr>)}
            {fails.map(([id,r])=><tr key={"f"+id}>
              <td style={{fontSize:12}}>{nameOf(id)}</td>
              <td colSpan={2} style={{fontSize:12,color:"#ef4444"}}>✗ {r.error}</td>
            </tr>)}
          </tbody>
        </table></div>}
      </div>;
    })()}
    {err&&<div className="ol-warn">{err}</div>}
    {msg&&<div className={msg.t==="err"?"ol-warn":"ol-ok"} style={{display:"flex",gap:8,alignItems:"center"}}><span style={{flex:1}}>{msg.s}</span><button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setMsg(null)}>닫기</button></div>}

    {items.length>0&&<div className="fz-stats" style={{gridTemplateColumns:"repeat(5,1fr)"}}>
      <div className={"fz-stat clickable"+(!onlyDisc&&!onlySold&&sheetF==="all"?" on":"")} onClick={()=>{setOnlyDisc(false);setOnlySold(false);setSheetF("all")}}><div className="k">판매 상품</div><div className="v">{stats.total}<small>개</small></div></div>
      <div className={"fz-stat clickable"+(onlyDisc?" on":"")} onClick={()=>setOnlyDisc(v=>!v)}><div className="k">할인 중</div><div className="v" style={{color:"#ef4444"}}>{stats.disc}<small>개</small></div></div>
      <div className={"fz-stat clickable"+(onlySold?" on":"")} onClick={()=>setOnlySold(v=>!v)} title="쿠팡 품절 + 품절임박 상품만 보기 (🔄 쿠팡 가격 전체 갱신 때 확인)"><div className="k">품절</div><div className="v" style={{color:stats.sold?"#ef4444":undefined}}>{stats.sold}<small>개</small>{stats.low>0&&<small style={{color:"#f59e0b",marginLeft:6}}>임박 {stats.low}</small>}</div></div>
      <div className="fz-stat"><div className="k">오늘 확인</div><div className="v" style={{color:"#16a34a"}}>{stats.today}<small>개</small></div></div>
      <div className="fz-stat"><div className="k">7일 넘게 미확인</div><div className="v" style={{color:stats.stale?"#f59e0b":undefined}}>{stats.stale}<small>개</small></div></div>
    </div>}

    {sheets.length>1&&<div className="ol-chips" style={{marginBottom:12}}>
      <button className={sheetF==="all"?"on":""} onClick={()=>setSheetF("all")}>전체 {items.length}</button>
      {sheets.map(s=><button key={s.key} className={sheetF===s.key?"on":""} onClick={()=>setSheetF(s.key)}>{s.name} {s.count}</button>)}
    </div>}

    {items.length===0?<div className="ol-card" style={{textAlign:"center",padding:"36px 20px"}}>
      <div style={{fontSize:32,marginBottom:8}}>💰</div>
      <div style={{fontSize:14,fontWeight:700,marginBottom:6}}>등록된 판매 상품이 없습니다</div>
      <div style={{fontSize:13,color:"var(--muted)",lineHeight:1.7}}>쓰고 계신 <b>판매링크 엑셀</b>(시트 이름 "업체(냉장)" / "업체(냉동)")을 <b>📁 엑셀 가져오기</b>로 올리면<br/>상품·링크·가격이 한 번에 등록됩니다.</div>
    </div>:
    groups.length===0?<Empty emoji="🔍" text="조건에 맞는 상품이 없습니다"/>:
    groups.map(g=><div key={g.key} className="fz-group" style={{marginBottom:14}}>
      <div className="fz-group-hd" style={{borderLeftColor:g.storage==="frozen"?"#3b82f6":"#06b6d4"}}>
        <div className="fz-group-name">{g.name}</div>
        <div style={{fontSize:12,color:"var(--muted)"}}>{g.list.length}개 · 할인 중 {g.list.filter(isDiscounting).length}개{g.list.some(p=>p.sold_out===true)&&<span style={{color:"#ef4444",fontWeight:700}}> · 품절 {g.list.filter(p=>p.sold_out===true).length}개</span>}</div>
      </div>
      <div className="ol-scroll"><table className="ol-table" style={{minWidth:1080}}>
        <thead><tr><th className="center">No</th><th>상품명</th><th className="right">입수</th><th className="right">공급가</th><th className="right">판매가</th><th className="right">현재 할인가</th><th className="right">할인액</th><th className="right">스토어가</th><th className="center">확인</th><th className="center">링크</th><th></th></tr></thead>
        <tbody>{g.list.map((p,i)=>{
          const disc=isDiscounting(p);
          const dAmt=disc?Number(p.discount_price)-Number(p.sale_price):0;
          const ago=daysAgo(p.price_checked_at);
          return <tr key={p.id} style={p.sold_out===true?{background:"rgba(239,68,68,.06)"}:undefined}>
            <td className="center" style={{color:"var(--muted)",fontSize:12}}>{i+1}</td>
            <td style={{minWidth:280}}>
              <button className="ol-mkt-name" onClick={()=>setMarketP(p)} title="클릭 → 🔍 시장조사 (비슷한 쿠팡 상품 가격 비교)">{p.name} <span className="ol-mkt-ic">🔍</span></button>
              <StockBadge p={p}/>
              <div style={{fontSize:11,color:"var(--muted)",marginTop:2,fontFamily:"monospace"}}>{[p.sku_id&&"SKU "+p.sku_id,p.barcode].filter(Boolean).join(" · ")}{p.memo&&<span style={{fontFamily:"inherit"}}> · {p.memo}</span>}</div>
            </td>
            <td className="right">{p.per_box!=null?fmtNum(p.per_box):"–"}</td>
            <td className="right" style={{whiteSpace:"nowrap"}}><PriceCell value={p.supply_price} onSave={n=>setPrice(p,"supply_price",n)}/><ChangeMark h={lastChange[p.id+"|supply"]}/></td>
            <td className="right" style={{whiteSpace:"nowrap"}}><PriceCell value={p.sale_price} onSave={n=>setPrice(p,"sale_price",n)}/><ChangeMark h={lastChange[p.id+"|sale"]}/></td>
            <td className="right" style={{whiteSpace:"nowrap",background:disc?"rgba(239,68,68,.06)":undefined}}><PriceCell value={p.discount_price} bold color={disc?"#ef4444":undefined} onSave={n=>setPrice(p,"discount_price",n)}/><ChangeMark h={lastChange[p.id+"|discount"]}/></td>
            <td className="right" style={{whiteSpace:"nowrap",fontSize:12,color:disc?"#ef4444":"var(--dimmer)",fontWeight:disc?700:400}}>{disc?<>{fmtWon(dAmt)}<div style={{fontSize:10,fontWeight:500}}>{(dAmt/Number(p.sale_price)*100).toFixed(1)}%</div></>:"–"}</td>
            <td className="right" style={{whiteSpace:"nowrap"}}><PriceCell value={p.store_price} onSave={n=>setPrice(p,"store_price",n)}/><ChangeMark h={lastChange[p.id+"|store"]}/></td>
            <td className="center" style={{fontSize:11,whiteSpace:"nowrap",color:ago==null?"var(--dimmer)":ago===0?"#16a34a":ago>7?"#f59e0b":"var(--muted)",fontWeight:ago===0?700:400}}
              title={p.price_checked_at?new Date(p.price_checked_at).toLocaleString("ko-KR"):"확인 기록 없음"}>{ago==null?"–":ago===0?"오늘":`${ago}일 전`}</td>
            <td className="center" style={{whiteSpace:"nowrap"}}>
              {p.coupang_url?<a className="ol-btn ol-btn-secondary ol-btn-sm" style={{textDecoration:"none",marginRight:4}} href={p.coupang_url} target="_blank" rel="noopener noreferrer">쿠팡↗</a>:<span style={{color:"var(--dimmer)",fontSize:11,marginRight:4}}>쿠팡 –</span>}
              {p.store_url?<a className="ol-btn ol-btn-secondary ol-btn-sm" style={{textDecoration:"none"}} href={p.store_url} target="_blank" rel="noopener noreferrer">스토어↗</a>:null}
            </td>
            <td className="right" style={{whiteSpace:"nowrap"}}>
              {delId===p.id?<>
                <span style={{fontSize:12,marginRight:6}}>삭제할까요?</span>
                <button className="ol-btn ol-btn-danger ol-btn-sm" style={{marginRight:4}} onClick={()=>del(p)}>삭제</button>
                <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setDelId(null)}>취소</button>
              </>:<>
                <button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginRight:4}} onClick={()=>setEditing(p)}>수정</button>
                <button className="ol-btn ol-btn-danger ol-btn-sm" onClick={()=>setDelId(p.id)}>🗑</button>
              </>}
            </td>
          </tr>})}</tbody>
      </table></div>
    </div>)}

    {items.length>0&&<div style={{fontSize:12,color:"var(--muted)",margin:"4px 0 14px",lineHeight:1.6}}>
      가격 숫자를 <b>클릭</b>하면 바로 고칠 수 있습니다 (Enter 저장 · Esc 취소 · 비우면 없음). 현재 할인가가 판매가보다 낮을 때만 할인으로 표시하고, 최근 14일 안에 바뀐 가격은 ▲▼로 표시됩니다.
    </div>}

    {history.length>0&&<div className="ol-card" style={{padding:0}}>
      <div style={{padding:"12px 16px",cursor:"pointer",fontWeight:700,fontSize:14,display:"flex",justifyContent:"space-between"}} onClick={()=>setHistOpen(o=>!o)}>
        <span>🧾 가격 변경 이력 <span style={{fontSize:12,color:"var(--muted)",fontWeight:500}}>(최근 180일 · {history.length}건)</span></span><span>{histOpen?"▲":"▼"}</span>
      </div>
      {histOpen&&<div className="ol-scroll" style={{borderTop:"1px solid var(--div2)"}}><table className="ol-table" style={{minWidth:640}}>
        <thead><tr><th>일시</th><th>상품</th><th>항목</th><th className="right">이전</th><th className="right">변경</th><th className="right">차이</th><th>방법</th></tr></thead>
        <tbody>{history.slice(0,200).map(h=>{const d=h.old_value!=null&&h.new_value!=null?Number(h.new_value)-Number(h.old_value):null;
          return <tr key={h.id}>
            <td style={{fontSize:12,whiteSpace:"nowrap"}}>{new Date(h.created_at).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}</td>
            <td style={{fontSize:12}}>{h.name}</td>
            <td style={{fontSize:12}}>{HIST_FIELD[h.field]||h.field}</td>
            <td className="right">{fmtWon(h.old_value)}</td>
            <td className="right" style={{fontWeight:700}}>{fmtWon(h.new_value)}</td>
            <td className="right" style={{color:d>0?"#ef4444":d<0?"#3b82f6":"var(--muted)",fontSize:12}}>{d==null?"–":(d>0?"+":"")+fmtWon(d)}</td>
            <td style={{fontSize:12,color:"var(--muted)"}}>{HIST_SRC[h.source]||h.source}</td>
          </tr>})}</tbody>
      </table></div>}
    </div>}

    {editing&&<Modal lg onClose={()=>setEditing(null)}><PriceForm adminHash={adminHash} initial={editing} vendors={vendors} history={history} onCancel={()=>setEditing(null)} onSaved={()=>{setEditing(null);load()}}/></Modal>}
    {showBm&&<Modal onClose={()=>setShowBm(false)}><BookmarkletHelp onClose={()=>setShowBm(false)}/></Modal>}
    {showExt&&<Modal onClose={()=>setShowExt(false)}><ExtensionHelp ext={ext} onClose={()=>setShowExt(false)}/></Modal>}
    {marketP&&<Modal lg onClose={()=>setMarketP(null)}><div className="ol-mkt-wrap"><MarketModal adminHash={adminHash} p={(items.find(x=>x.id===marketP.id))||marketP} ext={ext} onClose={()=>setMarketP(null)} onChanged={load}/></div></Modal>}
  </>;
}

// 북마크 버튼이 연 작은 창: 읽어 온 가격 확인 → 저장
function PriceCapture({payload}){
  const isStore=payload.site==="store";
  const[items,setItems]=useState(null);
  const[err,setErr]=useState("");
  const[selId,setSelId]=useState("");
  const[matched,setMatched]=useState([]);
  const[q,setQ]=useState("");
  const[saveLink,setSaveLink]=useState(false);
  // 쿠팡: sale = 쿠팡판매가(없으면 최종가), disc = 와우할인 등 최종가
  const[vals,setVals]=useState(()=>isStore?{store_price:payload.sale??""}:{sale_price:payload.sale??"",discount_price:payload.disc??payload.sale??""});
  const[state,setState]=useState(""); // "" | saving | done
  useEffect(()=>{applyTheme(getStoredTheme())},[]);
  useEffect(()=>{(async()=>{
    try{
      const d=await rpc("ol_list_prices",{p_admin_hash:""});
      const its=sortPriceItems(d?.items||[]);
      setItems(its);
      const m=matchCapture(its,payload.url,payload.site);
      setMatched(m);
      if(m.length===1)setSelId(String(m[0].id));
      if(!m.length)setSaveLink(true);
    }catch(e){setErr(priceErr(e));setItems([])}
  })()},[]);
  const sel=items?.find(p=>String(p.id)===selId);
  const options=useMemo(()=>{
    if(!items)return [];
    const s=q.trim().toLowerCase();
    const base=matched.length>1&&!s?matched:items;
    return s?base.filter(p=>[p.name,p.sku_id,p.barcode].some(x=>String(x||"").toLowerCase().includes(s))):base;
  },[items,matched,q]);
  const save=async()=>{
    if(!sel){setErr("상품을 고르세요.");return}
    const out={};
    for(const k in vals){const s=String(vals[k]??"").replace(/[,\s원]/g,"");out[k]=s===""?null:Number(s)}
    setState("saving");setErr("");
    try{
      if(saveLink)await rpc("ol_upsert_price",{p_admin_hash:"",p_id:sel.id,p_row:isStore?{store_url:payload.url}:{coupang_url:payload.url}});
      await rpc("ol_set_price_values",{p_admin_hash:"",p_id:sel.id,p_values:out,p_source:"capture"});
      try{const bc=new BroadcastChannel("ol-prices");bc.postMessage("saved");bc.close()}catch(e){}
      setState("done");
      setTimeout(()=>{try{window.close()}catch(e){}},1300);
    }catch(e){setErr(priceErr(e));setState("")}
  };
  const field=(k,label,cur)=><div style={{marginBottom:10}}>
    <div className="ol-label">{label} {sel&&<span style={{color:"var(--dimmer)"}}>· 저장된 값 {fmtWon(cur)}</span>}</div>
    <input className="ol-input" style={{fontSize:20,fontWeight:800,padding:"10px 12px"}} inputMode="numeric" value={vals[k]??""}
      onChange={e=>setVals(v=>({...v,[k]:e.target.value}))} onKeyDown={e=>{if(e.key==="Enter")save()}} autoFocus={k!=="discount_price"&&!!sel}/>
  </div>;
  const noPrice=payload.sale==null&&payload.orig==null;
  return <div style={{maxWidth:520,margin:"0 auto",padding:18,boxSizing:"border-box",minHeight:"100vh",background:"var(--bg)",color:"var(--text)"}}>
    <div style={{fontSize:16,fontWeight:800,marginBottom:4}}>💰 {isStore?"스마트스토어":"쿠팡"} 가격 저장</div>
    <div style={{fontSize:11,color:"var(--muted)",marginBottom:12,wordBreak:"break-all"}}>{payload.title||payload.url}</div>
    {state==="done"?<div className="ol-ok" style={{fontSize:15,fontWeight:700,textAlign:"center",padding:20}}>✓ 저장됐습니다 — 창이 곧 닫힙니다</div>:
    !items?<Loader/>:<>
      {noPrice&&<div className="ol-warn" style={{fontSize:12}}>이 페이지에서 가격을 찾지 못했습니다. 화면의 가격을 보고 직접 입력해 주세요.</div>}
      <div className="ol-label">상품</div>
      {matched.length===1&&sel?<div className="ol-card" style={{padding:"10px 12px",marginBottom:12}}>
        <div style={{fontWeight:700}}>{sel.name}</div>
        <div style={{fontSize:11,color:"var(--muted)"}}>{priceSheetName(sel)}{sel.sku_id?" · SKU "+sel.sku_id:""} · 링크로 자동 찾음</div>
      </div>:<div style={{marginBottom:12}}>
        {matched.length===0&&<div style={{fontSize:12,color:"#f59e0b",marginBottom:6}}>이 링크로 등록된 상품이 없습니다 — 상품을 골라 주세요.</div>}
        {matched.length>1&&<div style={{fontSize:12,color:"#f59e0b",marginBottom:6}}>같은 상품 페이지에 옵션이 {matched.length}개 있습니다 — 골라 주세요.</div>}
        <input className="ol-input" placeholder="상품명·SKU 검색" value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:6}}/>
        <select className="ol-input" size={Math.min(8,Math.max(3,options.length))} value={selId} onChange={e=>setSelId(e.target.value)}>
          {options.map(p=><option key={p.id} value={p.id}>[{priceSheetName(p)}] {p.name}</option>)}
        </select>
        {matched.length===0&&<label style={{display:"flex",gap:6,alignItems:"center",fontSize:12,marginTop:6,cursor:"pointer"}}>
          <input type="checkbox" checked={saveLink} onChange={e=>setSaveLink(e.target.checked)}/> 이 페이지 주소를 고른 상품의 {isStore?"스토어":"쿠팡"} 링크로 저장
        </label>}
      </div>}
      {isStore?field("store_price","스마트스토어 판매가",sel?.store_price):<>
        {field("sale_price","판매가 (정가)",sel?.sale_price)}
        {field("discount_price","현재 할인가",sel?.discount_price)}
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:10}}>판매가 = 쿠팡판매가, 현재 할인가 = 와우할인 등 최종가. 할인이 없으면 두 칸이 같습니다.</div>
      </>}
      {err&&<div className="ol-err" style={{marginBottom:8}}>{err}</div>}
      <div style={{display:"flex",gap:8}}>
        <button className="ol-btn ol-btn-secondary" onClick={()=>window.close()}>닫기</button>
        <button className="ol-btn ol-btn-primary" style={{flex:1,fontSize:15}} disabled={!sel||state==="saving"} onClick={save}>{state==="saving"?"저장 중…":"저장 (Enter)"}</button>
      </div>
    </>}
  </div>;
}

// 날짜 목록 (발주서 / 발주리스트 공용)

// 업로드 시각 표시: "10/28 (화) 14:32"
function fmtUploadAt(iso){
  if(!iso)return "";
  const d=new Date(iso);
  if(isNaN(d.getTime()))return "";
  return `${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]}) ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function DateList({dates,selected,onSelect}){
  const today=todayYmd();
  if(!dates.length)return <div className="ol-datelist"><div style={{fontSize:12,color:"var(--muted)",padding:10}}>업로드된 발주서가 없습니다</div></div>;
  return <div className="ol-datelist">
    <div className="ol-datelist-hd" style={{fontSize:11,color:"var(--muted)",padding:"4px 10px 8px",fontWeight:600}}>입고예정일</div>
    {dates.map(d=><div key={d.due_date} className={"ol-dateitem"+(selected===d.due_date?" on":"")} onClick={()=>onSelect(d.due_date)}>
      <span className={d.due_date<today?"past":""}>{d.due_date} ({dowOf(d.due_date)}){d.due_date===today&&<span style={{color:"#06b6d4",marginLeft:4}}>오늘</span>}</span>
      <span className="ol-pill">{d.order_count}건</span>
    </div>)}
  </div>;
}

function UnmatchedBanner({unmatched,onRegister}){
  if(!unmatched.length)return null;
  const byCode=new Map();
  for(const u of unmatched){
    const k=u.item.code;
    if(!byCode.has(k))byCode.set(k,{code:k,name:u.item.name,orders:new Set(),qty:0});
    const e=byCode.get(k);e.orders.add(u.order.order_no||u.order.orderNo);e.qty+=Number(u.item.qty||0);
  }
  return <div className="ol-warn">
    <div style={{fontWeight:800,marginBottom:6}}>⚠ 제품리스트에 없는 상품코드 <b>{byCode.size}개</b> — 생산지점을 알 수 없어 부착리스트·적재이미지에서 <b>제외</b>됩니다</div>
    {[...byCode.values()].map(e=><div key={e.code} style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",padding:"4px 0",borderTop:"1px dashed rgba(239,68,68,0.25)"}}>
      <b style={{fontFamily:"monospace"}}>{e.code}</b>
      <span style={{flex:1,minWidth:200}}>{e.name}</span>
      <span style={{fontSize:12,color:"var(--muted)"}}>수량 {fmtNum(e.qty)} · 발주 {[...e.orders].join(", ")}</span>
      {onRegister&&<button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>onRegister(e.code,e.name)}>+ 제품 등록</button>}
    </div>)}
  </div>;
}

function OrdersTab({adminHash,masters,reloadMasters,dates,reloadDates,selDate,setSelDate,orders,reloadOrders,loadingOrders,extra}){
  const[siteF,setSiteF]=useState("all");
  const[busy,setBusy]=useState(false);
  const[result,setResult]=useState(null); // 업로드 결과 모달
  const[quickAdd,setQuickAdd]=useState(null);
  const fileRef=useRef(null);
  const prodMap=useMemo(()=>Object.fromEntries(masters.products.map(p=>[p.code,p])),[masters.products]);
  const siteOf=code=>{const p=prodMap[code];return p?((p.site||"").trim()||NO_SITE):null};

  const unmatched=useMemo(()=>{
    const out=[];
    for(const o of orders)for(const it of (o.items||[]))if(!prodMap[it.code])out.push({order:o,item:it});
    return out;
  },[orders,prodMap]);
  const sites=useMemo(()=>{
    const s=new Set();
    for(const o of orders)for(const it of (o.items||[])){const x=siteOf(it.code);if(x)s.add(x)}
    return [...s].sort();
  },[orders,prodMap]);

  // 최근 업로드: 입고일 목록의 last_upload(SQL 실행 후) → 없으면 지금 보는 입고일 발주서의 업로드 시각
  const lastUpload=useMemo(()=>{
    let best=null;
    for(const d of dates||[])if(d.last_upload&&(!best||d.last_upload>best.at))best={at:d.last_upload,due:d.due_date,count:d.order_count};
    if(best)return best;
    for(const o of orders||[])if(o.created_at&&(!best||o.created_at>best.at))best={at:o.created_at,due:o.due_date,partial:true};
    return best;
  },[dates,orders]);
  const dayLastUpload=useMemo(()=>{let m="";for(const o of orders||[])if(o.created_at&&o.created_at>m)m=o.created_at;return m},[orders]);

  const handleFiles=async files=>{
    if(!files||!files.length)return;
    setBusy(true);
    const report=[];
    let lastDate="";
    // 압축파일(.zip)은 안의 엑셀을 꺼내서 하나씩 처리
    const entries=[];
    for(const f of files){
      try{
        if(/\.zip$/i.test(f.name)){
          const inner=await unzipOrderFiles(await f.arrayBuffer(),f.name);
          if(!inner.length)report.push({file:f.name,ok:false,msg:"압축파일 안에 엑셀(.xlsx/.xls)이 없습니다"});
          entries.push(...inner);
        }else entries.push({name:f.name,read:()=>f.arrayBuffer()});
      }catch(e){report.push({file:f.name,ok:false,msg:"압축파일을 열지 못했습니다: "+errMsg(e)})}
    }
    for(const f of entries){
      try{
        const buf=await f.read();
        const parsed=parseOrderWorkbook(buf,f.name);
        if(!parsed.length){report.push({file:f.name,ok:false,msg:"발주서 형식을 찾지 못했습니다 (상품코드 표 없음)"});continue}
        for(const o of parsed){
          if(!o.orderNo){report.push({file:f.name,ok:false,msg:"발주번호(C10)를 찾지 못했습니다"});continue}
          if(!o.dueDate){report.push({file:f.name,ok:false,msg:`발주 ${o.orderNo}: 입고예정일시(F13)를 읽지 못했습니다`});continue}
          if(!o.items.length){report.push({file:f.name,ok:false,msg:`발주 ${o.orderNo}: 상품이 없습니다`});continue}
          const saveArgs={
            p_admin_hash:adminHash,p_order_no:o.orderNo,p_vendor:o.vendor,p_center:o.center,p_center_addr:o.centerAddr,
            p_due_date:o.dueDate,p_order_type:o.orderType,p_file_name:f.name,
            p_items:o.items.map(({center,...it})=>it)
          };
          let res;
          try{res=await rpc("ol_save_order",{...saveArgs,p_is_extra:!!extra})}
          catch(e){
            // setup_orders_extra.sql 실행 전: 일반 발주는 예전 방식으로 저장, 추가 발주는 저장 불가 안내
            if(!/function|PGRST202|schema cache/i.test(String(e?.message||e)))throw e;
            if(extra)throw new Error("추가 발주를 쓰려면 Supabase SQL Editor에서 setup_orders_extra.sql 을 1회 실행해 주세요");
            res=await rpc("ol_save_order",saveArgs);
          }
          const missing=o.items.filter(it=>!prodMap[it.code]);
          report.push({file:f.name,ok:true,orderNo:o.orderNo,dueDate:o.dueDate,vendor:o.vendor,center:o.center,count:o.items.length,replaced:!!res?.replaced,moved:!!res?.moved,missing});
          lastDate=o.dueDate;
        }
      }catch(e){report.push({file:f.name,ok:false,msg:errMsg(e)})}
    }
    setBusy(false);
    if(fileRef.current)fileRef.current.value="";
    await reloadDates();
    if(lastDate)setSelDate(lastDate);
    await reloadOrders(lastDate||selDate);
    setResult(report);
  };

  // 수량 편집 — 발주서 카드 하나씩. qtyEdit = {orderId, vals:{품목id: 입력값}}
  const[qtyEdit,setQtyEdit]=useState(null);
  const[qtySaving,setQtySaving]=useState(false);
  const startQtyEdit=o=>setQtyEdit({orderId:o.id,vals:Object.fromEntries((o.items||[]).map(it=>[it.id,String(Number(it.qty||0))]))});
  const saveQtyEdit=async o=>{
    const changes=[];
    for(const it of (o.items||[])){
      const raw=qtyEdit.vals[it.id];
      if(raw==null)continue;
      const v=Number(String(raw).replace(/,/g,"").trim());
      if(String(raw).trim()===""||!Number.isFinite(v)||v<0){alert(`'${it.name}' 수량이 올바르지 않습니다`);return}
      if(v!==Number(it.qty||0))changes.push({id:it.id,qty:v});
    }
    if(!changes.length){setQtyEdit(null);return}
    setQtySaving(true);
    try{
      await rpc("ol_update_order_items",{p_admin_hash:adminHash,p_order_id:o.id,p_items:changes});
      setQtyEdit(null);await reloadOrders(selDate);
    }catch(e){
      alert(/function|PGRST202|schema cache/i.test(String(e?.message||e))?"수량 편집을 쓰려면 Supabase SQL Editor에서 setup_orders_qtyedit.sql 을 1회 실행해 주세요.":errMsg(e));
    }
    setQtySaving(false);
  };

  const delOrder=async o=>{
    if(!confirm(`발주서 ${o.order_no} (${o.center}, 입고 ${o.due_date})를 삭제할까요?\n품목 ${o.items.length}건이 함께 삭제됩니다.`))return;
    try{
      await rpc("ol_delete_order",{p_admin_hash:adminHash,p_id:o.id});
      await reloadDates();await reloadOrders(selDate);
    }catch(e){alert(errMsg(e))}
  };

  // 날짜별 전체 삭제 — confirm() 대신 그 자리에서 확인 (앱 내장 브라우저에서 confirm 창이 안 뜨는 경우 대비)
  const[askDelDay,setAskDelDay]=useState(false);
  const[delDayBusy,setDelDayBusy]=useState(false);
  useEffect(()=>{setAskDelDay(false)},[selDate,extra]);
  const delDay=async()=>{
    const date=selDate;
    setDelDayBusy(true);
    let failed=0;
    for(const o of orders){
      try{await rpc("ol_delete_order",{p_admin_hash:adminHash,p_id:o.id})}catch(e){failed++}
    }
    setDelDayBusy(false);setAskDelDay(false);
    const list=await reloadDates();
    if(failed){alert(`${failed}건을 삭제하지 못했습니다. 다시 시도해 주세요.`);await reloadOrders(date);return}
    const next=(list||[]).find(d=>d.due_date>date)?.due_date||(list||[]).slice(-1)[0]?.due_date||"";
    setSelDate(next);await reloadOrders(next);
  };

  const visibleOrders=orders.map(o=>{
    const items=(o.items||[]).filter(it=>{
      if(siteF==="all")return true;
      const s=siteOf(it.code);
      if(siteF==="__none")return !s;
      return s===siteF;
    });
    return{o,items};
  }).filter(x=>x.items.length>0);

  const totalMissing=result?result.reduce((s,r)=>s+(r.missing?.length||0),0):0;

  return <>
    <div className="ol-toolbar">
      <button className="ol-btn ol-btn-primary" onClick={()=>fileRef.current?.click()} disabled={busy}>{busy?"업로드 중...":extra?"📁 추가 발주서 업로드":"📁 발주서 업로드"}</button>
      <input ref={fileRef} type="file" accept=".xlsx,.xls,.zip" multiple style={{display:"none"}} onChange={e=>handleFiles([...e.target.files])}/>
      {lastUpload&&<span className="ol-lastup" onClick={()=>lastUpload.due&&setSelDate(lastUpload.due)} title={lastUpload.partial?"지금 보는 입고일 기준 (setup_orders_aps_link.sql 을 실행하면 전체 입고일 기준으로 표시)":"누르면 그 입고일로 이동"}>
        🕒 최근 업로드 <b>{fmtUploadAt(lastUpload.at)}</b>{lastUpload.due&&<span style={{color:"var(--muted)"}}> · 입고 {lastUpload.due.slice(5).replace("-","/")} ({dowOf(lastUpload.due)})</span>}
      </span>}
      <span style={{fontSize:12,color:"var(--muted)"}}>여러 파일 동시 선택 가능 · 압축파일(.zip)도 가능 · 같은 발주번호를 다시 올리면 덮어씁니다 · 입고예정일 기준 1달 지난 발주서는 자동 삭제</span>
    </div>

    <div className="ol-layout">
      <DateList dates={dates} selected={selDate} onSelect={setSelDate}/>
      <div style={{minWidth:0}}>
        {!selDate?<Empty emoji="📄" text={extra?"추가 발주서를 업로드하세요 — 기존 발주리스트와 섞이지 않고 따로 적재됩니다":"발주서를 업로드하세요"}/>:loadingOrders?<Loader/>:<>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:10}}>
            <div style={{fontSize:18,fontWeight:800}}>{selDate} ({dowOf(selDate)}) 입고 · {extra?"추가 ":""}발주서 {orders.length}건</div>
            {dayLastUpload&&<span style={{fontSize:12,color:"var(--muted)"}}>🕒 이 날짜 최근 업로드 {fmtUploadAt(dayLastUpload)}</span>}
            {orders.length>0&&(askDelDay?<span style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:13,color:"#ef4444",fontWeight:700}}>
              이 날짜 {extra?"추가 ":""}발주서 {orders.length}건을 모두 삭제할까요?
              <button className="ol-btn ol-btn-danger ol-btn-sm" onClick={delDay} disabled={delDayBusy}>{delDayBusy?"삭제 중...":"모두 삭제"}</button>
              <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setAskDelDay(false)} disabled={delDayBusy}>취소</button>
            </span>:<button className="ol-btn ol-btn-danger ol-btn-sm" style={{marginLeft:"auto"}} onClick={()=>setAskDelDay(true)} disabled={!!qtyEdit}>🗑 이 날짜 전체 삭제</button>)}
          </div>
          <UnmatchedBanner unmatched={unmatched} onRegister={(code,name)=>setQuickAdd({code,name})}/>

  if(storageOf(ln.product)==="frozen")return "";
  return ln.item.expiry_date?String(ln.item.expiry_date).slice(0,10):"";
}

// xlsx-js-style 스타일
const XS_TITLE={font:{name:"Pretendard",sz:30,bold:true},fill:{patternType:"solid",fgColor:{rgb:"FFFF00"}},alignment:{horizontal:"center",vertical:"center"}};
const XS_INFO_LABEL={font:{name:"Pretendard",sz:16,bold:true},alignment:{horizontal:"left",vertical:"center"}};
const XS_INFO_VAL={font:{name:"Pretendard",sz:16,bold:true},alignment:{horizontal:"left",vertical:"center"}};
const XS_BIG={font:{name:"Pretendard",sz:26,bold:true},alignment:{horizontal:"left",vertical:"center"}};
const XS_THIN={style:"thin",color:{rgb:"000000"}};
const XS_BORDER={top:XS_THIN,bottom:XS_THIN,left:XS_THIN,right:XS_THIN};
const XS_HEAD={font:{name:"Pretendard",sz:20,bold:true},alignment:{horizontal:"center",vertical:"center"},border:XS_BORDER};
const XS_CELL={font:{name:"Pretendard",sz:15},alignment:{horizontal:"center",vertical:"center",wrapText:true},border:XS_BORDER};

function buildPalletSheet(group,pallet,prefix,color){
  const o=group.order;
  const title={...XS_TITLE};
  if(color===TITLE_NONE)delete title.fill;
  else title.fill={patternType:"solid",fgColor:{rgb:color||"FFFF00"}};
  const ws={};
  const put=(addr,cell)=>{ws[addr]=cell};
  const s=(v,st)=>({t:typeof v==="number"?"n":"s",v,s:st});
  const lastRow=9+pallet.lines.length-1;
  const stLabel=STORAGE_LABEL[group.storage||"chilled"]; // 신선 / 냉동
  put("A1",s(`${prefix} 파렛트 적재리스트 (${stLabel})`,title));
  ["B1","C1","D1","E1","F1"].forEach(a=>put(a,s("",title)));
  put("A3",s(`${pallet.total} - ${pallet.no}`,XS_BIG)); // 총 파렛트 수 - 번호 (예: "16 - 1", 2026-10-14 "/" → " - ")
  put("D3",s("총 박스 수량",XS_INFO_LABEL));
  put("E3",{t:"n",v:pallet.boxes,f:`SUM(D9:D${Math.max(lastRow,9)})`,s:XS_BIG});
  put("A4",s("입고예정일자",XS_INFO_LABEL));
  put("B4",{t:"n",v:excelSerial(String(o.due_date).slice(0,10)),z:"yyyy-mm-dd",s:{...XS_INFO_VAL,numFmt:"yyyy-mm-dd"}});
  put("D4",s("납품센터명",XS_INFO_LABEL));
  put("E4",s(`( ${o.center}(${stLabel}) 센터 )`,XS_INFO_VAL));
  put("A5",s("업체명",XS_INFO_LABEL));
  put("B5",s(o.vendor||"",XS_INFO_VAL));
  put("D5",s("발주센터명",XS_INFO_LABEL));
  put("E5",s(`( ${o.center}센터 )`,XS_INFO_VAL));
  put("A6",s("발주번호",XS_INFO_LABEL));
  const ono=/^\d+$/.test(o.order_no)?Number(o.order_no):o.order_no;
  put("B6",s(ono,XS_INFO_VAL)); // 2026-10-14: 28pt → 다른 정보 칸과 같은 16pt
  ["NO","SKU NO","SKU NAME","BOX 수량","수량","소비기한"].forEach((h,i)=>put(XLSX.utils.encode_cell({r:7,c:i}),s(h,XS_HEAD)));
  pallet.lines.forEach((ln,i)=>{
    const r=8+i,R=r+1;
    const code=/^\d+$/.test(ln.item.code)?Number(ln.item.code):ln.item.code;
    put(`A${R}`,s(i+1,XS_CELL));
    put(`B${R}`,s(code,XS_CELL));
    put(`C${R}`,s(ln.item.name,XS_CELL));
    put(`D${R}`,s(ln.count,XS_CELL));
    put(`E${R}`,{t:"n",v:ln.count*ln.per,f:`D${R}*${ln.per}`,s:XS_CELL});
    const exp=expiryOf(ln);
    put(`F${R}`,exp?{t:"n",v:excelSerial(exp),z:"yyyy-mm-dd",s:{...XS_CELL,numFmt:"yyyy-mm-dd"}}:s("",XS_CELL));
  });
  ws["!ref"]=`A1:F${Math.max(lastRow,9)}`;
  ws["!merges"]=[
    {s:{r:0,c:0},e:{r:0,c:5}},
    {s:{r:3,c:4},e:{r:3,c:5}},
    {s:{r:4,c:4},e:{r:4,c:5}},
    {s:{r:5,c:1},e:{r:5,c:2}}
  ];
  ws["!cols"]=[{wch:17},{wch:16.5},{wch:79},{wch:17.5},{wch:11.7},{wch:17}];
  const rows=[{hpt:70},{hpt:25},{hpt:28},{hpt:28},{hpt:28},{hpt:28},{hpt:25},{hpt:34.5}];
  pallet.lines.forEach(()=>rows.push({hpt:34.5}));
  ws["!rows"]=rows;
  ws["!pageSetup"]={orientation:"landscape"};
  return ws;
}

function downloadAttachXlsx(groups,site,date,prefix,colorOf){
  const wb=XLSX.utils.book_new();
  const multi=groups.length>1;
  groups.forEach((g,gi)=>{
    g.pallets.forEach(p=>{
      const name=(multi?`${gi+1}-${p.no}`:String(p.no)).slice(0,31);
      XLSX.utils.book_append_sheet(wb,buildPalletSheet(g,p,prefix,colorOf(g.vendor)),name);
    });
  });
  const safe=s=>String(s).replace(/[\\/:*?"<>|]/g,"_");
  XLSX.writeFile(wb,`부착리스트_${date}_${safe(site)}.xlsx`);
}

      {g.lines.some(l=>l.partial)&&<div className="ol-warn" style={{padding:"8px 12px"}}>⚠ 입수량으로 나누어떨어지지 않는 품목이 있어 박스 수를 올림했습니다: {g.lines.filter(l=>l.partial).map(l=>`${l.item.name} (${fmtNum(l.item.qty)}÷${l.per})`).join(", ")}</div>}

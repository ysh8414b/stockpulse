<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useLayoutEffect,useCallback,useMemo,useRef}=React;

// ═══════════════════════════════════════════
// 공통 헬퍼
// ═══════════════════════════════════════════
async function rpc(name,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+name,{
    method:"POST",
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(body||{})
  });
  if(!r.ok){let msg="";try{msg=await r.text()}catch(e){msg=String(r.status)}throw new Error(msg||String(r.status))}
  const txt=await r.text();
  if(!txt)return null;
  try{return JSON.parse(txt)}catch(e){return txt}
}
function errMsg(e){
  const s=String(e?.message||e||"");
  if(s.includes("unauthorized"))return "Supabase에서 최신 setup_orders.sql을 다시 실행하세요 (비밀번호 없는 버전).";
  if(s.includes("Could not find the function")||s.includes("PGRST202"))return "Supabase에 setup_orders.sql이 실행되지 않았습니다.";
  if(s.includes("duplicate key")&&s.includes("ol_products"))return "이미 등록된 제품코드입니다.";
  if(s.includes("site_exists"))return "이미 있는 생산지점 이름입니다.";
  if(s.includes("code_name_required"))return "제품코드와 제품명은 필수입니다.";
  return "오류: "+s.slice(0,120);
}

const DOW=["일","월","화","수","목","금","토"];
function fmtYmd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseYmd(s){const[y,m,d]=String(s).slice(0,10).split("-").map(Number);return new Date(y,m-1,d)}
function todayYmd(){return fmtYmd(new Date())}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return fmtYmd(d)}
function dowOf(s){return DOW[parseYmd(s).getDay()]}
function fmtMd(s){const d=parseYmd(s);return (d.getMonth()+1)+"/"+d.getDate()}
// 엑셀 셀 값 → YYYY-MM-DD (문자열 "2026/10/14 00:00:00", Date, 엑셀 serial 모두)
function toYmd(v){
  if(v==null||v==="")return "";
  if(v instanceof Date){
    if(isNaN(v.getTime()))return "";
    // SheetJS Date는 자정이 전날 23:59:xx로 오는 경우가 있어 몇 분 보정
    return fmtYmd(new Date(v.getTime()+10*60000));
  }
  if(typeof v==="number"&&v>20000&&v<80000){
    return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10);
  }
  const m=String(v).trim().match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m?`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`:"";
}
function toNum(v){
  if(typeof v==="number")return v;
  const n=parseFloat(String(v??"").replace(/,/g,"").trim());
  return isNaN(n)?0:n;
}
function fmtNum(n){return Number(n||0).toLocaleString("ko-KR",{maximumFractionDigits:2})}
function excelSerial(ymd){
  const[y,m,d]=ymd.split("-").map(Number);
  return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000;
}
function lsGet(k,def){try{const v=localStorage.getItem(k);return v==null?def:v}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

const NO_SITE="(지점 미지정)";
const COLOR_PRESETS=["#0ea5e9","#dc2626","#7e22ce","#16a34a","#ea580c","#1d4ed8","#db2777","#ca8a04","#0f766e","#111827"];

function Loader(){return <div style={{textAlign:"center",padding:"60px 0"}}><div className="loader"></div></div>}
function Empty({emoji,text}){return <div className="ol-empty"><div style={{fontSize:32,marginBottom:8,opacity:.7}}>{emoji||"📭"}</div>{text}</div>}
function Modal({children,onClose,lg}){
  return <div className="ol-modal-bg" onMouseDown={e=>{if(e.target===e.currentTarget)onClose()}}>
    <div className={"ol-modal"+(lg?" ol-modal-lg":"")}>{children}</div>
  </div>;
}

// ═══════════════════════════════════════════
// 발주서 엑셀 파싱
// 고정 셀(C5 업체명, C10 발주번호, F13 입고예정일시, C13 물류센터) 우선,
// 비어 있으면 라벨 검색으로 fallback
// ═══════════════════════════════════════════
function parseOrderWorkbook(buf,fileName){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const out=[];
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn];
    if(!ws||!ws["!ref"])continue;
    const rng=XLSX.utils.decode_range(ws["!ref"]);
    const at=(r,c)=>{const cell=ws[XLSX.utils.encode_cell({r,c})];return cell?cell.v:""};
    const a1=addr=>{const cell=ws[addr];return cell?cell.v:""};
    const norm=s=>String(s??"").replace(/\s/g,"");
    const findRight=label=>{
      for(let r=rng.s.r;r<=Math.min(rng.e.r,30);r++)for(let c=rng.s.c;c<=rng.e.c;c++){
        if(norm(at(r,c))===label){
          for(let k=c+1;k<=Math.min(c+6,rng.e.c);k++){const v=at(r,k);if(String(v).trim()!=="")return v}
        }
      }
      return "";
    };

    const vendorRaw=String(a1("C5")||findRight("거래처명")||"").trim();
    const vendor=vendorRaw.replace(/^\s*\[[^\]]*\]\s*/,"").trim();
    let orderNo=String(a1("C10")||findRight("발주번호")||"").trim();
    if(!orderNo){const m=String(a1("A1")).match(/No\.?\s*(\d+)/i);if(m)orderNo=m[1]}
    const dueDate=toYmd(a1("F13"));
    const center=String(a1("C13")||"").trim();
    const centerAddr=String(a1("D13")||"").trim();
    const orderType=String(a1("C11")||findRight("발주구분")||"").trim();

    // 상품 표 헤더 행 찾기 ("상품코드")
    let hr=-1,codeCol=1,nameCol=2,qtyCol=6,dateCol=20,centerCol=5;
    for(let r=rng.s.r;r<=rng.e.r&&hr<0;r++)for(let c=rng.s.c;c<=rng.e.c;c++){
      if(norm(at(r,c))==="상품코드"){hr=r;break}
    }
    if(hr>=0){
      for(let c=rng.s.c;c<=rng.e.c;c++){
        const h=norm(at(hr,c));
        if(h==="상품코드")codeCol=c;
        else if(h.startsWith("상품명"))nameCol=c;
        else if(h==="발주수량")qtyCol=c;
        else if(h==="물류센터")centerCol=c;
        else if(h.includes("제조")||h.includes("유통"))dateCol=c;
      }
    }
    const items=[];
    if(hr>=0){
      for(let r=hr+1;r<=rng.e.r;r++){
        const first=norm(at(r,0));
        if(first==="합계"||first.startsWith("4."))break;
        const code=String(at(r,codeCol)).trim();
        if(!/^\d{3,}$/.test(code))continue;
        items.push({
          line_no:toNum(at(r,0))||items.length+1,
          code,
          name:String(at(r,nameCol)).trim(),
          qty:toNum(at(r,qtyCol)),
          center:String(at(r,centerCol)).trim(),
          mfg_date:toYmd(at(r,dateCol))||null,
          expiry_date:toYmd(at(r+1,dateCol))||null
        });
      }
    }
    if(!orderNo&&!items.length)continue;
    out.push({
      fileName,sheetName:sn,orderNo,vendor,dueDate,
      center:center||items[0]?.center||"",centerAddr,orderType,items
    });
  }
  return out;
}

// ═══════════════════════════════════════════
// 파렛트 계산
//  - 단독 1파렛트 용량 = 적재방식의 '최대 박스' (항상 이 값 — 박스규격으로 늘거나 줄지 않음)
//  - 박스규격(가로×세로)은 1단에 몇 박스 깔리는지 계산하는 데만 사용 (파렛트 바닥에 가장 많이 까는 배치, 회전 허용)
//          단수 = ⌊최대 박스 ÷ 1단 박스 수⌋ (혼적 1자리에 쌓는 높이로 사용)
//  - 혼적: 1층 = 6방(자리). 자리마다 한 제품을 위로 쌓음(그 제품 단수까지)
//          자투리를 담는 데 필요한 자리 = ⌈자투리 ÷ 단수⌉, 6방 미만일 때만 혼적으로 보내고
//          자리 수 큰 것부터 기존 혼적 파렛트 빈자리에 채움(First-Fit Decreasing)
//  - 박스규격이 없거나 파렛트에 안 들어가면 단수 = ⌊최대 박스 ÷ 6⌋
// ═══════════════════════════════════════════
const DEFAULT_CAP=40;
const DEFAULT_PALLET={pallet_w:1100,pallet_d:1100,max_height:1700,pallet_base:0};
function palletCfg(settings){
  const c={...DEFAULT_PALLET};
  for(const k in c){const v=Number(settings?.[k]);if(Number.isFinite(v)&&v>=0)c[k]=v}
  return c;
}
function parseSpec(spec){
  const n=String(spec||"").match(/[\d.]+/g);
  if(!n||n.length<3)return null;
  const[w,d,h]=n.slice(0,3).map(Number);
  return w>0&&d>0&&h>0?{w,d,h}:null;
}
// 직사각형 L×W에 a×b 박스: 한 방향으로 k줄 + 나머지 회전 배치 (2구역, 양 축 모두 시도)
function twoBlockCount(L,W,a,b){
  if(L<Math.min(a,b)||W<Math.min(a,b))return 0;
  const grid=(L,W,a,b)=>Math.floor(L/a)*Math.floor(W/b);
  let best=Math.max(grid(L,W,a,b),grid(L,W,b,a));
  for(const[X,Y]of[[L,W],[W,L]]){
    for(let k=1;k*a<=X;k++)best=Math.max(best,k*Math.floor(Y/b)+grid(X-k*a,Y,b,a));
    for(let k=1;k*b<=X;k++)best=Math.max(best,k*Math.floor(Y/a)+grid(X-k*b,Y,a,b));
  }
  return best;
}
// 파렛트 바닥 1층 박스 수 — 2구역 배치 + 5구역 바람개비 배치 중 최대
// 5구역: 네 블록이 가운데를 돌아가며 감싸는 형태 (각 블록은 2구역 배치로 채움)
//   예: 460×300 박스, 1100×1100 → 300+300+460=1060 → 600×460 블록(2개) × 4 = 8
const _layerCache=new Map();
function layerCount(L,W,a,b){
  const key=[L,W,Math.max(a,b),Math.min(a,b)].join("|");
  if(_layerCache.has(key))return _layerCache.get(key);
  const f=(w,h)=>(w<=0||h<=0)?0:twoBlockCount(w,h,a,b);
  let best=f(L,W);
  // 분할 후보: i·a + j·b 조합(래스터 포인트)과 그 여집합
  const raster=S=>{
    const set=new Set([0]);
    for(let i=0;i*a<=S;i++)for(let j=0;i*a+j*b<=S;j++){const r=i*a+j*b;set.add(r);set.add(S-r)}
    return [...set].filter(v=>v>=0&&v<=S).sort((x,y)=>x-y);
  };
  const X=raster(L),Y=raster(W);
  for(const x1 of X)for(const x2 of X){
    if(x2<x1)continue;
    for(const y1 of Y)for(const y2 of Y){
      if(y2<y1)continue;
      // 좌하 [0,x1]×[0,y2] · 우하 [x1,L]×[0,y1] · 우상 [x2,L]×[y1,W] · 좌상 [0,x2]×[y2,W] · 가운데 [x1,x2]×[y1,y2]
      const n=f(x1,y2)+f(L-x1,y1)+f(L-x2,W-y1)+f(x2,W-y2)+f(x2-x1,y2-y1);
      if(n>best)best=n;
    }
  }
  _layerCache.set(key,best);
  return best;
}
function productMethods(p,methodMap){
  const ids=Array.isArray(p?.method_ids)?p.method_ids:[];
  const ms=ids.map(id=>methodMap[id]).filter(Boolean);
  return{single:ms.filter(m=>m.kind==="single"),mixed:ms.filter(m=>m.kind==="mixed")};
}
// 제품 1개의 파렛트 적재 능력
function boxCapacity(p,methodMap,cfg){
  const{single,mixed}=productMethods(p,methodMap);
  const slots=mixed.length?Math.min(...mixed.map(m=>m.per_layer||6)):6;
  const cols=mixed.length?Math.max(...mixed.map(m=>m.cols||3)):3;
  const canMix=mixed.length>0;
  // 용량은 항상 적재방식의 최대 박스 — 규격은 1단 박스 수 계산에만 사용
  const cap=single.length?Math.max(...single.map(m=>m.max_boxes)):mixed.length?Math.min(...mixed.map(m=>m.max_boxes)):DEFAULT_CAP;
  const dims=parseSpec(p?.box_spec);
  const perLayer=dims?layerCount(cfg.pallet_w,cfg.pallet_d,dims.w,dims.d):0;
  if(perLayer>0){
    const layers=Math.max(1,Math.floor(cap/perLayer));
    return{fromSpec:true,dims,layers,perLayer,cap,rem:cap%perLayer,stack:layers,slots,cols,canMix};
  }
  return{fromSpec:false,badSpec:!!dims,dims,layers:null,perLayer:null,cap,stack:Math.max(1,Math.floor(cap/slots)),slots,cols,canMix};
}
function enrichLine(item,p){
  const per=Math.max(1,Number(p?.per_box)||1);
  const exact=Number(item.qty||0)/per;
  const boxes=Math.ceil(exact-1e-9);
  return{item,product:p,per,boxes,partial:Math.abs(exact-Math.round(exact))>1e-9};
}
function toMethodMap(methods){
  return Object.fromEntries((methods||[]).map(m=>[Number(m.id),{...m,max_boxes:Number(m.max_boxes)||DEFAULT_CAP,cols:Number(m.cols)||3,per_layer:Number(m.per_layer)||6}]));
}
// 적재량 설명 문구
function capText(c){
  if(c.fromSpec)return c.cap<c.perLayer?`최대 ${c.cap}박스 · 1단 ${c.perLayer}박스 (1단도 안 참)`:`최대 ${c.cap}박스 · 1단 ${c.perLayer}박스 × ${c.layers}단${c.rem?` + ${c.rem}박스`:""}`;
  return c.badSpec?`최대 ${c.cap}박스 · 규격이 파렛트에 안 맞음`:`최대 ${c.cap}박스 · 규격 없음`;
}
function buildPallets(lines,methodMap,cfg){
  const singles=[],pool=[];
  for(const ln of lines){
    if(ln.boxes<=0)continue;
    const c=boxCapacity(ln.product,methodMap,cfg);
    const full=Math.floor(ln.boxes/c.cap),rem=ln.boxes%c.cap;
    for(let i=0;i<full;i++)singles.push({kind:"single",lines:[{...ln,count:c.cap,capInfo:c}]});
    if(rem>0){
      const need=Math.ceil(rem/c.stack);
      if(c.canMix&&need<c.slots)pool.push({...ln,count:rem,need,stack:c.stack,h:c.dims?.h||1,slots:c.slots,cols:c.cols,capInfo:c});
      else singles.push({kind:"single",lines:[{...ln,count:rem,capInfo:c}]});
    }
  }
  // 자리 많이 차지하는 제품부터, 들어갈 수 있는 첫 혼적 파렛트에
  const mixedPallets=[];
  const sorted=pool.map((e,i)=>({e,i})).sort((x,y)=>y.e.need-x.e.need||x.i-y.i).map(x=>x.e);
  for(const e of sorted){
    let p=mixedPallets.find(m=>m.slots-m.usedSlots>=e.need&&e.need<=e.slots);
    if(!p){p={kind:"mixed",slots:e.slots,cols:e.cols,usedSlots:0,lines:[]};mixedPallets.push(p)}
    p.lines.push(e);
    p.usedSlots+=e.need;
    p.slots=Math.min(p.slots,e.slots);
    p.cols=Math.max(p.cols,e.cols);
  }
  // 혼적 파렛트 안에서는 발주서 순서대로 표시
  for(const p of mixedPallets)p.lines.sort((a,b)=>a.item.line_no-b.item.line_no);
  const all=singles.concat(mixedPallets.map(p=>p.lines.length===1?{kind:"single",lines:p.lines}:p));
  return all.map((p,i)=>({...p,no:i+1,total:all.length,boxes:p.lines.reduce((s,l)=>s+l.count,0)}));
}

// 같은 업체·센터의 발주서 여러 개 → 한 리스트용 대표 발주 (발주번호는 ", "로 연결)
function mergeOrders(list){
  if(list.length===1)return list[0];
  return{...list[0],id:list.map(o=>o.id).join("+"),order_no:list.map(o=>o.order_no).join(", "),
    file_name:list.map(o=>o.file_name).join(", "),merged_count:list.length};
}
// 날짜의 발주서들 → [{order, orders, vendor, site, lines, pallets}]
// 입고일(이미 날짜별 조회) + 업체명 + 센터가 같으면 발주번호가 달라도 한 리스트로 합쳐 적재 (추가 발주 대응)
// 같은 상품코드·같은 소비기한은 수량을 합쳐 한 줄로 → 파렛트를 같이 채움. 그 안에서 생산지점별로 분리
function buildSiteGroups(orders,prodMap,methodMap,cfg){
  const buckets=new Map(),unmatched=[];
  const sorted=[...orders].sort((a,b)=>String(a.order_no).localeCompare(String(b.order_no),undefined,{numeric:true}));
  for(const o of sorted){
    const vendor=(o.vendor||"").trim(),center=(o.center||"").trim();
    for(const it of (o.items||[])){
      const p=prodMap[it.code];
      if(!p){unmatched.push({order:o,item:it});continue}
      const site=(p.site||"").trim()||NO_SITE;
      const key=vendor+"\u0001"+center+"\u0001"+site;
      let b=buckets.get(key);
      if(!b){b={vendor,center,site,orders:[],items:new Map()};buckets.set(key,b)}
      if(!b.orders.includes(o))b.orders.push(o);
      const ik=it.code+"|"+(it.expiry_date||"");
      const cur=b.items.get(ik);
      if(cur)cur.item.qty=Number(cur.item.qty||0)+Number(it.qty||0);
      else b.items.set(ik,{item:{...it,line_no:b.items.size+1,qty:Number(it.qty||0)},product:p});
    }
  }
  const groups=[...buckets.values()]
    .sort((a,b)=>a.vendor.localeCompare(b.vendor)||a.center.localeCompare(b.center))
    .map(b=>{
      const lines=[...b.items.values()].map(e=>enrichLine(e.item,e.product));
      return{order:mergeOrders(b.orders),orders:b.orders,vendor:b.vendor,site:b.site,lines,pallets:buildPallets(lines,methodMap,cfg||DEFAULT_PALLET)};
    });
  return{groups,unmatched};
}

// 부착리스트 제목 배경색 — 업체명마다 다른 색 (ol_settings "vendor_colors" = {업체명: "RRGGBB"}, 처음 보는 업체는 안 쓴 색 자동 배정)
const TITLE_COLORS=[
  {rgb:"FFFF00",label:"노랑"},{rgb:"92D050",label:"연두"},{rgb:"8DB4E2",label:"하늘"},{rgb:"FABF8F",label:"주황"},
  {rgb:"CCA8F0",label:"보라"},{rgb:"FF99CC",label:"분홍"},{rgb:"B7DEE8",label:"청록"},{rgb:"D9D9D9",label:"회색"}
];
const TITLE_NONE="none"; // 배경색 없음 (자동 배정에는 안 씀)
const titleBg=c=>c===TITLE_NONE?"#ffffff":"#"+(c||"FFFF00");
function assignVendorColors(vendors,saved){
  const map={...(saved||{})},added={};
  for(const v of vendors){
    if(map[v])continue;
    const used=new Set(Object.values(map));
    const c=(TITLE_COLORS.find(t=>!used.has(t.rgb))||TITLE_COLORS[Object.keys(map).length%TITLE_COLORS.length]).rgb;
    map[v]=c;added[v]=c;
  }
  return{map,added};
}

function ProductForm({adminHash,masters,initial,onSaved,onCancel,onReloadMasters}){
  const isEdit=!!initial?.id;
  const[code,setCode]=useState(initial?.code||"");
  const[name,setName]=useState(initial?.name||"");
  const[imageName,setImageName]=useState(initial?.image_name||"");

  const[site,setSite]=useState(initial?.site||"");
  const[boxSpec,setBoxSpec]=useState(initial?.box_spec||"");
  const[color,setColor]=useState(initial?.color||COLOR_PRESETS[0]);
  const[err,setErr]=useState("");
  const[saving,setSaving]=useState(false);
  const[showSpecs,setShowSpecs]=useState(false);
  const[showMethods,setShowMethods]=useState(false);
  const[showSites,setShowSites]=useState(false);

  const siteNames=(masters.sites||[]).map(x=>x.name);
  const toggleMethod=id=>setMethodIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);

  const save=async()=>{
    if(!code.trim()||!name.trim()){setErr("제품코드와 제품명은 필수입니다");return}
    const per=parseInt(perBox,10);
    if(!per||per<1){setErr("입수량은 1 이상의 숫자로 입력하세요");return}
    setSaving(true);setErr("");
    try{
      await rpc("ol_upsert_product",{
        p_admin_hash:adminHash,p_id:initial?.id||null,p_code:code.trim(),p_name:name.trim(),
        p_image_name:imageName.trim(),p_per_box:per,p_method_ids:methodIds,
        p_site:site.trim(),p_box_spec:boxSpec,p_color:color
      });
      onSaved();
    }catch(e){setErr(errMsg(e))}
    setSaving(false);
  };

  return <>
    <div style={{fontSize:17,fontWeight:700,marginBottom:16}}>{isEdit?"✏ 제품 수정":"+ 제품 추가"}</div>
    <div className="ol-grid">
      <div><div className="ol-label">제품코드 *</div><input className="ol-input" value={code} onChange={e=>setCode(e.target.value)} placeholder="예: 65657585"/></div>
      <div><div className="ol-label">입수량 * (박스당 개수)</div><input className="ol-input" type="number" min="1" value={perBox} onChange={e=>setPerBox(e.target.value)} placeholder="예: 8"/></div>
    </div>
    <div style={{marginBottom:12}}><div className="ol-label">제품명 *</div><input className="ol-input" value={name} onChange={e=>setName(e.target.value)} placeholder="발주서/부착리스트에 표시될 이름"/></div>
    <div style={{marginBottom:12}}><div className="ol-label">이미지용 제품명 (적재이미지에 표시)</div><input className="ol-input" value={imageName} onChange={e=>setImageName(e.target.value)} placeholder="예: 삼겹구이용"/></div>

    <div style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div className="ol-label">적재방식 (다중 선택)</div>
        <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setShowMethods(true)}>🧱 적재방식 관리</button>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}>
        {masters.methods.length===0&&<span style={{fontSize:12,color:"var(--muted)"}}>등록된 적재방식이 없습니다 — 관리 버튼으로 추가하세요</span>}
        {masters.methods.map(m=>{
          const on=methodIds.includes(Number(m.id));
          return <label key={m.id} className={"ol-check"+(on?" on":"")}>
            <input type="checkbox" checked={on} onChange={()=>toggleMethod(Number(m.id))}/>
            <span>{m.name}</span>
            <span className={"ol-pill "+m.kind}>{m.kind==="mixed"?"혼적":"단독"} {m.max_boxes}</span>
          </label>;
        })}

    </div>

    <div className="ol-grid">
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div className="ol-label">생산지점</div>
          <button className="ol-btn ol-btn-secondary ol-btn-sm" style={{padding:"2px 8px",marginBottom:3}} onClick={()=>setShowSites(true)}>관리</button>

      </div>
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div className="ol-label">박스규격 (가로×세로×높이)</div>
          <button className="ol-btn ol-btn-secondary ol-btn-sm" style={{padding:"2px 8px",marginBottom:3}} onClick={()=>setShowSpecs(true)}>관리</button>
        </div>
        <select className="ol-input" value={boxSpec} onChange={e=>setBoxSpec(e.target.value)}>
          <option value="">— 선택 안 함 —</option>
          {masters.box_specs.map(b=><option key={b.id} value={b.spec}>{specLabel(b.spec,masters.box_specs)}</option>)}
          {boxSpec&&!masters.box_specs.some(b=>b.spec===boxSpec)&&<option value={boxSpec}>{boxSpec} (삭제된 규격)</option>}
        </select>
      </div>
    </div>
    {(()=>{
      const c=boxCapacity({box_spec:boxSpec,method_ids:methodIds},toMethodMap(masters.methods),palletCfg(masters.settings));
      return <div style={{fontSize:12,marginTop:-4,marginBottom:12,padding:"8px 10px",borderRadius:7,background:"var(--card-bg)",border:"1px solid var(--card-bd)",color:c.fromSpec?"var(--text)":"#f59e0b"}}>
        📦 단독 1파렛트 적재량: <b>{capText(c)}</b>{c.fromSpec&&c.canMix&&<span style={{color:"var(--muted)"}}> · 혼적 시 1자리 최대 {c.stack}단</span>}
      </div>;
    })()}

    <div style={{marginBottom:12}}>
      <div className="ol-label">이미지 표시 색상</div>
      <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
        {COLOR_PRESETS.map(c=><div key={c} className={"ol-swatch"+(color.toLowerCase()===c?" on":"")} style={{background:c}} onClick={()=>setColor(c)} title={c}/>)}
        <input type="color" value={color} onChange={e=>setColor(e.target.value)} style={{width:36,height:28,border:"none",background:"none",cursor:"pointer"}}/>
        <span style={{marginLeft:6,fontWeight:800,color,fontSize:15}}>{imageName||name||"미리보기"}</span>
      </div>
    </div>

    {err&&<div className="ol-err">{err}</div>}
    <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:16}}>
      <button className="ol-btn ol-btn-secondary" onClick={onCancel}>취소</button>
      <button className="ol-btn ol-btn-primary" onClick={save} disabled={saving}>{saving?"저장 중...":"저장"}</button>
    </div>

    {showSpecs&&<Modal onClose={()=>setShowSpecs(false)}><BoxSpecManager adminHash={adminHash} masters={masters} onChanged={onReloadMasters} onClose={()=>setShowSpecs(false)} onPick={s=>{setBoxSpec(s);setShowSpecs(false)}}/></Modal>}
    {showSites&&<Modal onClose={()=>setShowSites(false)}><SiteManager adminHash={adminHash} masters={masters} onChanged={onReloadMasters} onClose={()=>setShowSites(false)} onPick={n=>{setSite(n);setShowSites(false)}}/></Modal>}
    {showMethods&&<Modal lg onClose={()=>setShowMethods(false)}><MethodManager adminHash={adminHash} masters={masters} onChanged={onReloadMasters} onClose={()=>setShowMethods(false)}/></Modal>}
  </>;
}

function PalletSettings({adminHash,masters,onChanged,onClose}){
  const cur=palletCfg(masters.settings);
  const[form,setForm]=useState(cur);
  const[err,setErr]=useState("");const[busy,setBusy]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const fields=[
    ["pallet_w","파렛트 가로 (mm)"],["pallet_d","파렛트 세로 (mm)"]
  ];
  const save=async()=>{
    const vals={};
    for(const[k,label]of fields){
      const v=Number(form[k]);
      if(!Number.isFinite(v)||v<=0){setErr(label+" 값을 확인하세요");return}
      vals[k]=v;
    }
    setBusy(true);setErr("");
    try{
      for(const k in vals)if(vals[k]!==cur[k])await rpc("ol_set_setting",{p_admin_hash:adminHash,p_key:k,p_value:vals[k]});
      await onChanged();onClose();
    }catch(e){setErr(errMsg(e))}
    setBusy(false);
  };
  return <>
    <div style={{fontSize:17,fontWeight:700,marginBottom:6}}>⚙ 파렛트 설정</div>
    <div style={{fontSize:12,color:"var(--muted)",marginBottom:14,lineHeight:1.6}}>
      제품의 박스규격(가로×세로)과 이 파렛트 크기로 <b>1단에 몇 박스</b> 깔리는지만 계산합니다.<br/>
      파렛트 1개에 싣는 최대 박스 수는 <b>적재방식의 '최대 박스'</b>로 정해집니다.
    </div>
    <div className="ol-grid">
      {fields.map(([k,label])=><div key={k}><div className="ol-label">{label}</div><input className="ol-input" type="number" min="0" value={form[k]} onChange={e=>set(k,e.target.value)}/></div>)}
    </div>
    {err&&<div className="ol-err">{err}</div>}
    <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:16}}>
      <button className="ol-btn ol-btn-secondary" onClick={onClose}>취소</button>
      <button className="ol-btn ol-btn-primary" onClick={save} disabled={busy}>{busy?"저장 중...":"저장"}</button>
    </div>
  </>;
}

function SiteManager({adminHash,masters,onChanged,onClose,onPick}){
  const[name,setName]=useState("");
  const[err,setErr]=useState("");const[busy,setBusy]=useState(false);
  const[editId,setEditId]=useState(null);
  const[editName,setEditName]=useState("");
  const sites=masters.sites||[];
  const usedBy=n=>masters.products.filter(p=>(p.site||"").trim()===n).length;
  const add=async()=>{
    const n=name.trim();
    if(!n){setErr("지점 이름을 입력하세요");return}
    if(sites.some(x=>x.name===n)){setErr("이미 있는 생산지점입니다");return}
    setBusy(true);setErr("");
    try{await rpc("ol_add_site",{p_admin_hash:adminHash,p_name:n});setName("");await onChanged();if(onPick)onPick(n)}
    catch(e){setErr(errMsg(e))}
    setBusy(false);
  };
  const rename=async x=>{
    const n=editName.trim();
    if(!n||n===x.name){setEditId(null);return}
    const used=usedBy(x.name);
    if(used&&!confirm(`'${x.name}' → '${n}'(으)로 바꾸면 이 지점을 쓰는 제품 ${used}개도 함께 바뀝니다. 진행할까요?`))return;
    setBusy(true);setErr("");
    try{await rpc("ol_rename_site",{p_admin_hash:adminHash,p_id:x.id,p_name:n});setEditId(null);await onChanged()}
    catch(e){setErr(errMsg(e))}
    setBusy(false);
  };
  const del=async x=>{
    const used=usedBy(x.name);
    if(!confirm(`'${x.name}' 생산지점을 목록에서 삭제할까요?`+(used?`\n(이 지점을 쓰는 제품 ${used}개는 값이 유지됩니다)`:"")))return;
    try{await rpc("ol_delete_site",{p_admin_hash:adminHash,p_id:x.id});await onChanged()}catch(e){setErr(errMsg(e))}
  };
  return <>
    <div style={{fontSize:17,fontWeight:700,marginBottom:14}}>🏭 생산지점 관리</div>
    <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:12}}>
      <input className="ol-input" placeholder="지점 이름 (예: 군포공장)" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
      <button className="ol-btn ol-btn-primary ol-btn-sm" onClick={add} disabled={busy}>+ 추가</button>
    </div>
    {err&&<div className="ol-err">{err}</div>}
    {sites.length===0?<Empty emoji="🏭" text="등록된 생산지점이 없습니다"/>:
    <table className="ol-table"><thead><tr><th>생산지점</th><th className="right">사용 제품</th><th></th></tr></thead><tbody>
      {sites.map(x=><tr key={x.id}>
        <td style={{fontWeight:600}}>{editId===x.id
          ?<input className="ol-input" value={editName} autoFocus onChange={e=>setEditName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")rename(x);if(e.key==="Escape")setEditId(null)}}/>
          :x.name}</td>
        <td className="right">{usedBy(x.name)}</td>
        <td className="right" style={{whiteSpace:"nowrap"}}>
          {editId===x.id?<>
            <button className="ol-btn ol-btn-primary ol-btn-sm" style={{marginRight:4}} onClick={()=>rename(x)} disabled={busy}>저장</button>
            <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setEditId(null)}>취소</button>
          </>:<>
            {onPick&&<button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginRight:4}} onClick={()=>onPick(x.name)}>선택</button>}
            <button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginRight:4}} onClick={()=>{setEditId(x.id);setEditName(x.name)}}>이름 수정</button>
            <button className="ol-btn ol-btn-danger ol-btn-sm" onClick={()=>del(x)}>삭제</button>
          </>}
        </td>
      </tr>)}

    <div style={{textAlign:"right",marginTop:14}}><button className="ol-btn ol-btn-secondary" onClick={onClose}>닫기</button></div>
  </>;
}

// "규격명 (가로×세로×높이)" — 규격명 없으면 치수만
function specLabel(spec,boxSpecs){
  if(!spec)return "";
  const b=(boxSpecs||[]).find(x=>x.spec===spec);
  return b&&(b.name||"").trim()?`${b.name.trim()} (${spec})`:spec;
}

function BoxSpecManager({adminHash,masters,onChanged,onClose,onPick}){
  const[name,setName]=useState("");
  const[w,setW]=useState("");const[d,setD]=useState("");const[h,setH]=useState("");
  const[err,setErr]=useState("");const[busy,setBusy]=useState(false);
  const[editId,setEditId]=useState(null);
  const[editName,setEditName]=useState("");
  const add=async()=>{
    if(!w||!d||!h){setErr("가로·세로·높이를 모두 입력하세요");return}
    const spec=`${w}×${d}×${h}`;
    const dup=masters.box_specs.find(b=>b.spec===spec);
    if(dup&&!confirm(`'${spec}' 규격이 이미 있습니다${dup.name?` (규격명: ${dup.name})`:""}.\n규격명을 '${name.trim()||"(없음)"}'(으)로 바꿀까요?`))return;
    setBusy(true);setErr("");
    try{await rpc("ol_add_box_spec",{p_admin_hash:adminHash,p_spec:spec,p_name:name.trim()});setName("");setW("");setD("");setH("");await onChanged();if(onPick)onPick(spec)}
    catch(e){setErr(errMsg(e))}
    setBusy(false);
  };
  const saveName=async b=>{
    setBusy(true);setErr("");
    try{await rpc("ol_add_box_spec",{p_admin_hash:adminHash,p_spec:b.spec,p_name:editName.trim()});setEditId(null);await onChanged()}
    catch(e){setErr(errMsg(e))}
    setBusy(false);
  };
  const del=async b=>{
    const used=masters.products.filter(p=>p.box_spec===b.spec).length;
    if(!confirm(`'${specLabel(b.spec,masters.box_specs)}' 규격을 삭제할까요?`+(used?`\n(이 규격을 쓰는 제품 ${used}개는 값이 유지됩니다)`:"")))return;
    try{await rpc("ol_delete_box_spec",{p_admin_hash:adminHash,p_id:b.id});await onChanged()}catch(e){setErr(errMsg(e))}
  };
  return <>
    <div style={{fontSize:17,fontWeight:700,marginBottom:14}}>📐 박스규격 관리</div>
    <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:6}}>
      <input className="ol-input" style={{width:150}} placeholder="규격명 (예: 1kg×8 박스)" value={name} onChange={e=>setName(e.target.value)}/>
      <input className="ol-input" style={{width:90}} type="number" placeholder="가로" value={w} onChange={e=>setW(e.target.value)}/>×
      <input className="ol-input" style={{width:90}} type="number" placeholder="세로" value={d} onChange={e=>setD(e.target.value)}/>×
      <input className="ol-input" style={{width:90}} type="number" placeholder="높이" value={h} onChange={e=>setH(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
      <button className="ol-btn ol-btn-primary ol-btn-sm" onClick={add} disabled={busy}>+ 추가</button>
    </div>
    <div style={{fontSize:11,color:"var(--muted)",marginBottom:12}}>규격명은 선택 · 치수 단위는 자유(mm 권장). 추가하면 드롭박스에 바로 나타납니다.</div>
    {err&&<div className="ol-err">{err}</div>}
    {masters.box_specs.length===0?<Empty emoji="📦" text="등록된 박스규격이 없습니다"/>:
    <div className="ol-scroll"><table className="ol-table"><thead><tr><th>규격명</th><th>가로×세로×높이</th><th className="right">사용 제품</th><th></th></tr></thead><tbody>
      {masters.box_specs.map(b=><tr key={b.id}>
        <td style={{fontWeight:600}}>{editId===b.id
          ?<input className="ol-input" style={{minWidth:130}} value={editName} autoFocus onChange={e=>setEditName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveName(b);if(e.key==="Escape")setEditId(null)}}/>
          :(b.name||"").trim()||<span style={{color:"var(--dimmer)",fontWeight:400}}>–</span>}</td>
        <td>{b.spec}</td>
        <td className="right">{masters.products.filter(p=>p.box_spec===b.spec).length}</td>
        <td className="right" style={{whiteSpace:"nowrap"}}>
          {editId===b.id?<>
            <button className="ol-btn ol-btn-primary ol-btn-sm" style={{marginRight:4}} onClick={()=>saveName(b)} disabled={busy}>저장</button>
            <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setEditId(null)}>취소</button>
          </>:<>
            {onPick&&<button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginRight:4}} onClick={()=>onPick(b.spec)}>선택</button>}
            <button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginRight:4}} onClick={()=>{setEditId(b.id);setEditName(b.name||"")}}>이름 수정</button>
            <button className="ol-btn ol-btn-danger ol-btn-sm" onClick={()=>del(b)}>삭제</button>
          </>}
        </td>
      </tr>)}
    </tbody></table></div>}
    <div style={{textAlign:"right",marginTop:14}}><button className="ol-btn ol-btn-secondary" onClick={onClose}>닫기</button></div>
  </>;
}

function MethodManager({adminHash,masters,onChanged,onClose}){
  const blank={id:null,name:"",kind:"single",max_boxes:40,cols:3,per_layer:6,memo:""};
  const[form,setForm]=useState(blank);
  const[err,setErr]=useState("");const[busy,setBusy]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const save=async()=>{
    if(!form.name.trim()){setErr("이름을 입력하세요");return}
    setBusy(true);setErr("");
    try{
      await rpc("ol_upsert_method",{p_admin_hash:adminHash,p_id:form.id,p_name:form.name.trim(),p_kind:form.kind,
        p_max_boxes:parseInt(form.max_boxes,10)||40,p_cols:parseInt(form.cols,10)||3,p_memo:form.memo||"",p_per_layer:parseInt(form.per_layer,10)||6});
      setForm(blank);await onChanged();
    }catch(e){setErr(errMsg(e))}
    setBusy(false);
  };
  const del=async m=>{
    const used=masters.products.filter(p=>(p.method_ids||[]).map(Number).includes(Number(m.id))).length;
    if(!confirm(`'${m.name}' 적재방식을 삭제할까요?`+(used?`\n이 방식을 쓰는 제품 ${used}개에서도 해제됩니다.`:"")))return;
    try{await rpc("ol_delete_method",{p_admin_hash:adminHash,p_id:m.id});await onChanged()}catch(e){setErr(errMsg(e))}
  };
  return <>
    <div style={{fontSize:17,fontWeight:700,marginBottom:6}}>🧱 적재방식 관리</div>
    <div style={{fontSize:12,color:"var(--muted)",marginBottom:14,lineHeight:1.6}}>
      <b>단독</b>: 한 파렛트에 그 제품만. 적재량은 제품의 <b>박스규격</b>으로 자동 계산 (1층 박스 수 × 단수, ⚙ 파렛트 설정 기준). 꽉 찬 파렛트를 만들고 자투리는 따로 1파렛트.<br/>
      <b>혼적</b>: 자투리 박스를 다른 혼적 제품과 한 파렛트에 합침. 한 층에 <i>층당 방 수</i>(기본 6)만큼 자리가 있고, 자리마다 한 제품을 그 제품 단수까지 위로 쌓음. 자투리가 6자리 이상 필요하면 혼적 대신 단독 1파렛트. 적재이미지는 자리별 쌓는 박스 수를 표로 표시 (6방·가로 3칸 = 2줄×3칸).<br/>
      제품에 단독+혼적을 같이 선택하면 → 꽉 찬 파렛트는 단독, 남는 박스만 혼적.
    </div>
    <div className="ol-card" style={{padding:12}}>
      <div className="ol-grid" style={{marginBottom:8}}>
        <div><div className="ol-label">이름</div><input className="ol-input" value={form.name} onChange={e=>set("name",e.target.value)} placeholder="예: 단독 40박스"/></div>
        <div><div className="ol-label">유형</div><select className="ol-input" value={form.kind} onChange={e=>set("kind",e.target.value)}><option value="single">단독</option><option value="mixed">혼적</option></select></div>
        <div><div className="ol-label">최대 박스 (파렛트 1개)</div><input className="ol-input" type="number" min="1" value={form.max_boxes} onChange={e=>set("max_boxes",e.target.value)}/></div>
        {form.kind==="mixed"&&<div><div className="ol-label">층당 박스 수 (방)</div><input className="ol-input" type="number" min="1" max="12" value={form.per_layer} onChange={e=>set("per_layer",e.target.value)}/></div>}
        {form.kind==="mixed"&&<div><div className="ol-label">이미지 가로 칸 수</div><input className="ol-input" type="number" min="1" max="6" value={form.cols} onChange={e=>set("cols",e.target.value)}/></div>}
      </div>
      <input className="ol-input" value={form.memo} onChange={e=>set("memo",e.target.value)} placeholder="메모 (선택)" style={{marginBottom:8}}/>
      <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
        {form.id&&<button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setForm(blank)}>취소</button>}
        <button className="ol-btn ol-btn-primary ol-btn-sm" onClick={save} disabled={busy}>{form.id?"수정 저장":"+ 추가"}</button>
      </div>
    </div>
    {err&&<div className="ol-err">{err}</div>}
    <div className="ol-scroll"><table className="ol-table"><thead><tr><th>이름</th><th>유형</th><th className="right">최대 박스</th><th className="right">층당 방</th><th className="right">사용 제품</th><th>메모</th><th></th></tr></thead><tbody>
      {masters.methods.map(m=><tr key={m.id}>
        <td style={{fontWeight:600}}>{m.name}</td>
        <td><span className={"ol-pill "+m.kind}>{m.kind==="mixed"?"혼적":"단독"}</span></td>
        <td className="right">{m.max_boxes}</td>
        <td className="right">{m.kind==="mixed"?`${m.per_layer||6}방 (가로 ${m.cols})`:"–"}</td>
        <td className="right">{masters.products.filter(p=>(p.method_ids||[]).map(Number).includes(Number(m.id))).length}</td>
        <td style={{fontSize:12,color:"var(--muted)"}}>{m.memo}</td>
        <td className="right" style={{whiteSpace:"nowrap"}}>
          <button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginRight:4}} onClick={()=>setForm({...m,memo:m.memo||""})}>수정</button>
          <button className="ol-btn ol-btn-danger ol-btn-sm" onClick={()=>del(m)}>삭제</button>
        </td>
      </tr>)}
    </tbody></table></div>
    <div style={{textAlign:"right",marginTop:14}}><button className="ol-btn ol-btn-secondary" onClick={onClose}>닫기</button></div>
  </>;
}

function UnmatchedBanner({unmatched,onRegister}){
  if(!unmatched.length)return null;
  const byCode=new Map();
  for(const u of unmatched){
    const k=u.item.code;
    if(!byCode.has(k))byCode.set(k,{code:k,name:u.item.name,orders:new Set(),qty:0});
    const e=byCode.get(k);e.orders.add(u.order.order_no||u.order.orderNo);e.qty+=Number(u.item.qty||0);
  }
  return <div className="ol-warn">
    <div style={{fontWeight:800,marginBottom:6}}>⚠ 제품리스트에 없는 상품코드 <b>{byCode.size}개</b> — 생산지점을 알 수 없어 부착리스트·적재이미지에서 <b>제외</b>됩니다</div>
    {[...byCode.values()].map(e=><div key={e.code} style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",padding:"4px 0",borderTop:"1px dashed rgba(239,68,68,0.25)"}}>
      <b style={{fontFamily:"monospace"}}>{e.code}</b>
      <span style={{flex:1,minWidth:200}}>{e.name}</span>
      <span style={{fontSize:12,color:"var(--muted)"}}>수량 {fmtNum(e.qty)} · 발주 {[...e.orders].join(", ")}</span>
      {onRegister&&<button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>onRegister(e.code,e.name)}>+ 제품 등록</button>}
    </div>)}
  </div>;
}

function OrdersTab({adminHash,masters,reloadMasters,dates,reloadDates,selDate,setSelDate,orders,reloadOrders,loadingOrders}){
  const[siteF,setSiteF]=useState("all");
  const[busy,setBusy]=useState(false);
  const[result,setResult]=useState(null); // 업로드 결과 모달
  const[quickAdd,setQuickAdd]=useState(null);
  const fileRef=useRef(null);
  const prodMap=useMemo(()=>Object.fromEntries(masters.products.map(p=>[p.code,p])),[masters.products]);
  const siteOf=code=>{const p=prodMap[code];return p?((p.site||"").trim()||NO_SITE):null};

  const unmatched=useMemo(()=>{
    const out=[];
    for(const o of orders)for(const it of (o.items||[]))if(!prodMap[it.code])out.push({order:o,item:it});
    return out;
  },[orders,prodMap]);
  const sites=useMemo(()=>{
    const s=new Set();
    for(const o of orders)for(const it of (o.items||[])){const x=siteOf(it.code);if(x)s.add(x)}
    return [...s].sort();
  },[orders,prodMap]);

  const handleFiles=async files=>{
    if(!files||!files.length)return;
    setBusy(true);
    const report=[];
    let lastDate="";
    for(const f of files){
      try{
        const buf=await f.arrayBuffer();
        const parsed=parseOrderWorkbook(buf,f.name);
        if(!parsed.length){report.push({file:f.name,ok:false,msg:"발주서 형식을 찾지 못했습니다 (상품코드 표 없음)"});continue}
        for(const o of parsed){
          if(!o.orderNo){report.push({file:f.name,ok:false,msg:"발주번호(C10)를 찾지 못했습니다"});continue}
          if(!o.dueDate){report.push({file:f.name,ok:false,msg:`발주 ${o.orderNo}: 입고예정일시(F13)를 읽지 못했습니다`});continue}
          if(!o.items.length){report.push({file:f.name,ok:false,msg:`발주 ${o.orderNo}: 상품이 없습니다`});continue}
          const res=await rpc("ol_save_order",{
            p_admin_hash:adminHash,p_order_no:o.orderNo,p_vendor:o.vendor,p_center:o.center,p_center_addr:o.centerAddr,
            p_due_date:o.dueDate,p_order_type:o.orderType,p_file_name:f.name,
            p_items:o.items.map(({center,...it})=>it)
          });
          const missing=o.items.filter(it=>!prodMap[it.code]);
          report.push({file:f.name,ok:true,orderNo:o.orderNo,dueDate:o.dueDate,vendor:o.vendor,center:o.center,count:o.items.length,replaced:!!res?.replaced,missing});
          lastDate=o.dueDate;
        }
      }catch(e){report.push({file:f.name,ok:false,msg:errMsg(e)})}
    }
    setBusy(false);
    if(fileRef.current)fileRef.current.value="";
    await reloadDates();
    if(lastDate)setSelDate(lastDate);
    await reloadOrders(lastDate||selDate);
    setResult(report);
  };

  const delOrder=async o=>{
    if(!confirm(`발주서 ${o.order_no} (${o.center}, 입고 ${o.due_date})를 삭제할까요?\n품목 ${o.items.length}건이 함께 삭제됩니다.`))return;
    try{
      await rpc("ol_delete_order",{p_admin_hash:adminHash,p_id:o.id});
      await reloadDates();await reloadOrders(selDate);
    }catch(e){alert(errMsg(e))}
  };

  const visibleOrders=orders.map(o=>{
    const items=(o.items||[]).filter(it=>{
      if(siteF==="all")return true;
      const s=siteOf(it.code);
      if(siteF==="__none")return !s;
      return s===siteF;
    });
    return{o,items};
  }).filter(x=>x.items.length>0);

  const totalMissing=result?result.reduce((s,r)=>s+(r.missing?.length||0),0):0;

  return <>
    <div className="ol-toolbar">
      <button className="ol-btn ol-btn-primary" onClick={()=>fileRef.current?.click()} disabled={busy}>{busy?"업로드 중...":"📁 발주서 업로드"}</button>
      <input ref={fileRef} type="file" accept=".xlsx,.xls" multiple style={{display:"none"}} onChange={e=>handleFiles([...e.target.files])}/>
      <span style={{fontSize:12,color:"var(--muted)"}}>여러 파일 동시 선택 가능 · 같은 발주번호를 다시 올리면 덮어씁니다</span>
    </div>

    <div className="ol-layout">
      <DateList dates={dates} selected={selDate} onSelect={setSelDate}/>
      <div style={{minWidth:0}}>
        {!selDate?<Empty emoji="📄" text="발주서를 업로드하세요"/>:loadingOrders?<Loader/>:<>
          <div style={{fontSize:18,fontWeight:800,marginBottom:10}}>{selDate} ({dowOf(selDate)}) 입고 · 발주서 {orders.length}건</div>
          <UnmatchedBanner unmatched={unmatched} onRegister={(code,name)=>setQuickAdd({code,name})}/>
          <div className="ol-chips" style={{marginBottom:12}}>
            <button className={siteF==="all"?"on":""} onClick={()=>setSiteF("all")}>전체</button>
            {sites.map(s=><button key={s} className={siteF===s?"on":""} onClick={()=>setSiteF(s)}>🏭 {s}</button>)}
            {unmatched.length>0&&<button className={"warn"+(siteF==="__none"?" on":"")} onClick={()=>setSiteF("__none")}>⚠ 미등록 {unmatched.length}</button>}
          </div>
          {visibleOrders.length===0?<Empty emoji="📭" text="해당 조건의 발주서가 없습니다"/>:
          visibleOrders.map(({o,items})=><div key={o.id} className="ol-card">
            <div style={{display:"flex",justifyContent:"space-between",gap:10,flexWrap:"wrap",marginBottom:10}}>
              <div>
                <div style={{fontSize:15,fontWeight:800}}>발주 {o.order_no} <span className="ol-pill">{o.order_type||"발주"}</span></div>
                <div style={{fontSize:12,color:"var(--muted)",marginTop:3}}>
                  {o.vendor} · 센터 <b style={{color:"var(--text)"}}>{o.center||"–"}</b> · 입고 {o.due_date} ({dowOf(o.due_date)}) · 📎 {o.file_name}
                </div>
              </div>
              <button className="ol-btn ol-btn-danger ol-btn-sm" onClick={()=>delOrder(o)}>🗑 발주서 삭제</button>
            </div>
            <div className="ol-scroll"><table className="ol-table" style={{minWidth:720}}>
              <thead><tr><th>No</th><th>상품코드</th><th>상품명</th><th className="right">발주수량</th><th className="right">박스</th><th>생산지점</th><th>소비기한</th></tr></thead>
              <tbody>{items.map(it=>{
                const p=prodMap[it.code];
                const ln=p?enrichLine(it,p):null;
                return <tr key={it.id} style={p?null:{background:"rgba(239,68,68,0.06)"}}>
                  <td>{it.line_no}</td>
                  <td style={{fontFamily:"monospace",fontSize:12}}>{it.code}</td>
                  <td>{it.name}</td>
                  <td className="right">{fmtNum(it.qty)}</td>
                  <td className="right">{ln?<>{ln.boxes}{ln.partial&&<span title={`입수 ${ln.per}로 나누어떨어지지 않음 — 올림`} style={{color:"#f59e0b",marginLeft:3}}>⚠</span>}</>:"–"}</td>
                  <td>{p?<span style={{fontWeight:600}}>{(p.site||"").trim()||NO_SITE}</span>:<b style={{color:"#ef4444"}}>⚠ 제품리스트 미등록</b>}</td>
                  <td style={{fontSize:12}}>{it.expiry_date||"–"}</td>
                </tr>;
              })}</tbody>
            </table></div>
          </div>)}
        </>}
      </div>
    </div>

    {result&&<Modal lg onClose={()=>setResult(null)}>
      <div style={{fontSize:17,fontWeight:700,marginBottom:12}}>📥 업로드 결과</div>
      {totalMissing>0&&<div className="ol-warn" style={{fontSize:14}}>⚠ <b>제품리스트에 없는 상품코드가 {totalMissing}건</b> 있습니다. 등록하기 전까지 부착리스트·적재이미지에서 빠집니다.</div>}
      {result.map((r,i)=>r.ok?<div key={i} className="ol-ok">
        ✅ <b>{r.orderNo}</b> {r.replaced&&<span className="ol-pill mixed">덮어씀</span>} — 입고 {r.dueDate} · {r.center} · 품목 {r.count}건 <span style={{color:"var(--muted)",fontSize:12}}>({r.file})</span>
        {r.missing.length>0&&<div style={{marginTop:6}}>{r.missing.map(m=><div key={m.code} style={{color:"#ef4444",fontSize:13}}>⚠ 미등록: <b style={{fontFamily:"monospace"}}>{m.code}</b> {m.name}</div>)}</div>}
      </div>:<div key={i} className="ol-warn">❌ {r.file}: {r.msg}</div>)}
      <div style={{textAlign:"right",marginTop:12}}><button className="ol-btn ol-btn-primary" onClick={()=>setResult(null)}>확인</button></div>
    </Modal>}

    {quickAdd&&<Modal onClose={()=>setQuickAdd(null)}><ProductForm adminHash={adminHash} masters={masters} initial={{code:quickAdd.code,name:quickAdd.name}} onReloadMasters={reloadMasters} onCancel={()=>setQuickAdd(null)} onSaved={async()=>{setQuickAdd(null);await reloadMasters()}}/></Modal>}
  </>;
}

// xlsx-js-style 스타일
const XS_TITLE={font:{name:"Pretendard",sz:30,bold:true},fill:{patternType:"solid",fgColor:{rgb:"FFFF00"}},alignment:{horizontal:"center",vertical:"center"}};
const XS_INFO_LABEL={font:{name:"Pretendard",sz:16,bold:true},alignment:{horizontal:"left",vertical:"center"}};
const XS_INFO_VAL={font:{name:"Pretendard",sz:16,bold:true},alignment:{horizontal:"left",vertical:"center"}};
const XS_BIG={font:{name:"Pretendard",sz:26,bold:true},alignment:{horizontal:"left",vertical:"center"}};
const XS_THIN={style:"thin",color:{rgb:"000000"}};
const XS_BORDER={top:XS_THIN,bottom:XS_THIN,left:XS_THIN,right:XS_THIN};
const XS_HEAD={font:{name:"Pretendard",sz:20,bold:true},alignment:{horizontal:"center",vertical:"center"},border:XS_BORDER};
const XS_CELL={font:{name:"Pretendard",sz:15},alignment:{horizontal:"center",vertical:"center",wrapText:true},border:XS_BORDER};

function buildPalletSheet(group,pallet,prefix,color){
  const o=group.order;
  const title={...XS_TITLE};
  if(color===TITLE_NONE)delete title.fill;
  else title.fill={patternType:"solid",fgColor:{rgb:color||"FFFF00"}};
  const ws={};
  const put=(addr,cell)=>{ws[addr]=cell};
  const s=(v,st)=>({t:typeof v==="number"?"n":"s",v,s:st});
  const lastRow=9+pallet.lines.length-1;
  put("A1",s(`${prefix} 파렛트 적재리스트 (신선)`,title));
  ["B1","C1","D1","E1","F1"].forEach(a=>put(a,s("",title)));
  put("A3",s(`${pallet.total}/${pallet.no}`,XS_BIG)); // 총 파렛트 수/번호 (적재이미지와 동일 표기)
  put("D3",s("총 박스 수량",XS_INFO_LABEL));
  put("E3",{t:"n",v:pallet.boxes,f:`SUM(D9:D${Math.max(lastRow,9)})`,s:XS_BIG});
  put("A4",s("입고예정일자",XS_INFO_LABEL));
  put("B4",{t:"n",v:excelSerial(String(o.due_date).slice(0,10)),z:"yyyy-mm-dd",s:{...XS_INFO_VAL,numFmt:"yyyy-mm-dd"}});
  put("D4",s("납품센터명",XS_INFO_LABEL));
  put("E4",s(`( ${o.center}(신선) 센터 )`,XS_INFO_VAL));
  put("A5",s("업체명",XS_INFO_LABEL));
  put("B5",s(o.vendor||"",XS_INFO_VAL));
  put("D5",s("발주센터명",XS_INFO_LABEL));
  put("E5",s(`( ${o.center}센터 )`,XS_INFO_VAL));
  put("A6",s("발주번호",XS_INFO_LABEL));
  const ono=/^\d+$/.test(o.order_no)?Number(o.order_no):o.order_no;
  put("B6",s(ono,{...XS_BIG,font:{...XS_BIG.font,sz:28}}));
  ["NO","SKU NO","SKU NAME","BOX 수량","수량","소비기한"].forEach((h,i)=>put(XLSX.utils.encode_cell({r:7,c:i}),s(h,XS_HEAD)));
  pallet.lines.forEach((ln,i)=>{
    const r=8+i,R=r+1;
    const code=/^\d+$/.test(ln.item.code)?Number(ln.item.code):ln.item.code;
    put(`A${R}`,s(i+1,XS_CELL));
    put(`B${R}`,s(code,XS_CELL));
    put(`C${R}`,s(ln.item.name,XS_CELL));
    put(`D${R}`,s(ln.count,XS_CELL));
    put(`E${R}`,{t:"n",v:ln.count*ln.per,f:`D${R}*${ln.per}`,s:XS_CELL});
    put(`F${R}`,{t:"n",v:excelSerial(expiryOf(ln,String(o.due_date).slice(0,10))),z:"yyyy-mm-dd",s:{...XS_CELL,numFmt:"yyyy-mm-dd"}});
  });
  ws["!ref"]=`A1:F${Math.max(lastRow,9)}`;
  ws["!merges"]=[
    {s:{r:0,c:0},e:{r:0,c:5}},
    {s:{r:3,c:4},e:{r:3,c:5}},
    {s:{r:4,c:4},e:{r:4,c:5}},
    {s:{r:5,c:1},e:{r:5,c:2}}
  ];
  ws["!cols"]=[{wch:17},{wch:16.5},{wch:79},{wch:17.5},{wch:11.7},{wch:17}];
  const rows=[{hpt:70},{hpt:25},{hpt:28},{hpt:28},{hpt:28},{hpt:48},{hpt:25},{hpt:34.5}];
  pallet.lines.forEach(()=>rows.push({hpt:34.5}));
  ws["!rows"]=rows;
  ws["!pageSetup"]={orientation:"landscape"};
  return ws;
}

function downloadAttachXlsx(groups,site,date,prefix,colorOf){
  const wb=XLSX.utils.book_new();
  const multi=groups.length>1;
  groups.forEach((g,gi)=>{
    g.pallets.forEach(p=>{
      const name=(multi?`${gi+1}-${p.no}`:String(p.no)).slice(0,31);
      XLSX.utils.book_append_sheet(wb,buildPalletSheet(g,p,prefix,colorOf(g.vendor)),name);
    });
  });
  const safe=s=>String(s).replace(/[\\/:*?"<>|]/g,"_");
  XLSX.writeFile(wb,`부착리스트_${date}_${safe(site)}.xlsx`);
}

      {g.lines.some(l=>l.partial)&&<div className="ol-warn" style={{padding:"8px 12px"}}>⚠ 입수량으로 나누어떨어지지 않는 품목이 있어 박스 수를 올림했습니다: {g.lines.filter(l=>l.partial).map(l=>`${l.item.name} (${fmtNum(l.item.qty)}÷${l.per})`).join(", ")}</div>}
      {g.pallets.map(p=><div key={p.no}>
        <div style={{fontSize:12,color:"var(--muted)",margin:"0 0 4px"}}>시트 {groups.length>1?`${groups.indexOf(g)+1}-`:""}{p.no} · {p.kind==="mixed"?"혼적":"단독"} · {p.boxes}박스</div>
        <AttachSheetPreview group={g} pallet={p} prefix={prefix} color={colorOf(g.vendor)}/>
      </div>)}
    </div>)}
  </>;

// 적재 이미지
// ═══════════════════════════════════════════
// 연속된 같은 제품·같은 박스수 단독 파렛트 묶기 → "7/3-4 · 40개 / 2파렛"
function groupSinglePallets(pallets){
  const out=[];
  for(const p of pallets){
    if(p.kind!=="single")continue;
    const ln=p.lines[0];
    const last=out[out.length-1];
    if(last&&last.code===ln.product.code&&last.count===ln.count&&last.to===p.no-1){last.to=p.no;last.n++}
    else out.push({code:ln.product.code,product:ln.product,count:ln.count,from:p.no,to:p.no,n:1});
  }
  return out;
}
// 혼적 파렛트 한 층의 자리(방)를 제품들에 배분 → 자리마다 쌓을 박스 수
// 각 제품은 단수 한도 안에 들어가는 최소 자리(need)부터, 남는 자리는 가장 높이(mm) 쌓이는 제품에 하나씩
// 예: 6방, 10박스+10박스 → 3자리씩, 3·3·4 / 3·3·4
function layoutMixed(lines,slots){
  const alloc=lines.map(l=>Math.max(1,l.need||1));
  let free=slots-alloc.reduce((a,b)=>a+b,0);
  const h=i=>Math.ceil(lines[i].count/alloc[i])*(lines[i].h||1);
  while(free>0){
    let best=-1;
    for(let i=0;i<lines.length;i++)if(lines[i].count>alloc[i]&&(best<0||h(i)>h(best)))best=i;
    if(best<0)break;
    alloc[best]++;free--;
  }
  const cells=[];
  lines.forEach((ln,i)=>splitCols(ln.count,alloc[i]).forEach(n=>cells.push({ln,n})));
  while(cells.length<slots)cells.push(null);
  return cells;
}
function splitCols(n,cols){
  const base=Math.floor(n/cols),extra=n%cols;
  return Array.from({length:cols},(_,j)=>base+(j>=cols-extra?1:0));
}
const imgName=p=>p.image_name||p.name;

// ── 적재이미지 편집 (위치 이동 + 글씨 수정) ──
// 편집 내용은 ol_settings에 key = "img:{발주번호}:{생산지점}" 로 저장 (PC·모바일 공유)
// sig(파렛트 구성 요약)가 달라지면(발주서 재업로드 등) 이전 편집은 무시
const imgEditCache=new Map();
// 저장 용지 (mm, 가로만) — 300dpi로 렌더링, 사방 여백 PAPER_MARGIN_MM
const PAPER_SIZES={
  "A4-l":{label:"A4 가로",w:297,h:210},
  "A3-l":{label:"A3 가로",w:420,h:297}
};

function imgEditKey(group){return `img:${group.order.order_no}:${group.site}`}
function imageSig(group){return group.pallets.map(p=>p.kind[0]+p.lines.map(l=>l.product.code+":"+l.count).join(",")).join("|")}

// 더블클릭으로 글씨 수정 (Enter 저장 · Shift+Enter 줄바꿈 · Esc 취소)
// base: 기본 글씨 크기(px) · ed.size[id]: 개별 크기 · ed.scale: 전체 배율(%)
// 크기 조절 드래그 (오른쪽·아래로 끌면 커짐) — items:[{id,base}] 를 같은 비율로, 놓을 때 저장
function startScaleDrag(e,el,items,onLive,onCommit){
  if(!el||!items.length)return;
  e.stopPropagation();e.preventDefault();
  const h0=Math.max(10,el.getBoundingClientRect().height),sx=e.clientX,sy=e.clientY;
  let last=null;
  const move=ev=>{
    const d=((ev.clientX-sx)+(ev.clientY-sy))/2;
    const k=Math.max(0.2,(h0+d)/h0);
    last={};items.forEach(it=>{last[it.id]=Math.min(120,Math.max(8,Math.round(it.base*k)))});
    onLive(last);
  };
  const up=()=>{
    window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
    onLive({});if(last)onCommit(last);
  };
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
}
const HANDLE_STYLE={position:"absolute",width:11,height:11,background:"#06b6d4",border:"1.5px solid #fff",borderRadius:2,boxShadow:"0 0 0 1px #06b6d4",cursor:"nwse-resize",touchAction:"none",zIndex:6};

function EditText({id,value,base,edit,ed,onText,selected,onSelect,onLiveSize,onCommitSize,style}){
  const[active,setActive]=useState(false);
  const ref=useRef(null);
  const texts=ed.text;
  const shown=texts&&texts[id]!=null?texts[id]:String(value);
  const px=Math.round((ed.size?.[id]??base)*(ed.scale||100)/100);
  useEffect(()=>{
    if(!active||!ref.current)return;
    ref.current.focus();
    const r=document.createRange();r.selectNodeContents(ref.current);
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
  },[active]);
  useEffect(()=>{if(!edit)setActive(false)},[edit]);
  const commit=()=>{
    const t=(ref.current?.innerText||"").replace(/\n+$/,"");
    setActive(false);
    if(t!==shown)onText(id,t===String(value)?null:t);
  };
  return <div key={shown+(active?"#":"")} ref={ref} data-tid={id} data-base={base}
    contentEditable={active} suppressContentEditableWarning
    title={edit&&!active?"클릭: 선택(크기 조절) · 더블클릭: 글씨 수정":undefined}
    onClick={()=>{if(edit&&onSelect)onSelect(id)}}
    onDoubleClick={e=>{if(edit){e.stopPropagation();setActive(true)}}}
    onBlur={()=>{if(active)commit()}}
    onKeyDown={e=>{
      if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ref.current.blur()}
      if(e.key==="Escape"){e.preventDefault();setActive(false)}
    }}
    style={{width:"fit-content",maxWidth:"100%",marginLeft:"auto",marginRight:"auto",...style,position:"relative",fontSize:px,whiteSpace:"pre-wrap",outline:active?"2px solid #06b6d4":(edit&&selected?"2px solid #f59e0b":"none"),outlineOffset:1,cursor:active?"text":undefined,userSelect:active?"text":undefined,minWidth:active?20:undefined,minHeight:edit&&!shown?"1em":undefined}}
  >{shown}{edit&&selected&&!active&&onCommitSize&&<span contentEditable={false} title="끌어서 글씨 크기 조절"
      onPointerDown={e=>startScaleDrag(e,ref.current,[{id,base:ed.size?.[id]??base}],onLiveSize,onCommitSize)}
      style={{...HANDLE_STYLE,right:-7,bottom:-7}}/>}</div>;
}

// 편집 모드에서 끌어서 위치 이동 (원래 자리 기준 상대 이동량 dx/dy 저장)
// 다른 블록의 왼쪽·가운데·오른쪽 / 위·가운데·아래 선, 이미지 가로 중앙에 SNAP_PX 이내로 오면 붙고 안내선 표시 (Alt 누르면 끔)
// 오른쪽 아래 핸들을 끌면 블록 안 글씨 전체 크기 조절
const SNAP_PX=6;
function snapTo(lines,targets){
  let best=null;
  for(const a of lines)for(const t of targets){const d=t-a;if(Math.abs(d)<=SNAP_PX&&(!best||Math.abs(d)<Math.abs(best.d)))best={d,t}}
  return best;
}
function DragBlock({id,edit,pos,onMove,onGuides,sizes,onLiveSize,onCommitSize,style,children}){
  const base=pos[id]||{dx:0,dy:0};
  const[drag,setDrag]=useState(null);
  // 용지 화면은 축소/확대(transform)되어 보이므로 화면 이동량 ÷ z = 실제 이동량
  const cur=drag?{dx:base.dx+drag.x/drag.z,dy:base.dy+drag.y/drag.z}:base;
  const elRef=useRef(null);
  // 포인터 캡처를 쓰면 더블클릭이 글씨까지 안 내려가므로 window 이벤트로 추적
  const dragRef=useRef(null);
  const down=e=>{
    if(!edit||e.button>0||e.target.isContentEditable)return;
    if(e.pointerType==="mouse")e.preventDefault();
    const el=elRef.current,root=el.closest("[data-imgroot]");
    const r=el.getBoundingClientRect(),rr=root.getBoundingClientRect();
    const vx=[rr.left+rr.width/2],hy=[];
    root.querySelectorAll("[data-bid]").forEach(o=>{
      if(o===el)return;
      const b=o.getBoundingClientRect();
      vx.push(b.left,b.left+b.width/2,b.right);hy.push(b.top,b.top+b.height/2,b.bottom);
    });
    const z=(rr.width/root.offsetWidth)||1;
    dragRef.current={sx:e.clientX,sy:e.clientY,x:0,y:0,z,r,rr,vx,hy};
    setDrag(dragRef.current);
  };
  useEffect(()=>{
    if(!drag)return;
    const move=e=>{
      const d=dragRef.current;if(!d)return;
      let x=e.clientX-d.sx,y=e.clientY-d.sy;
      let g=null;
      if(!e.altKey){
        const L=d.r.left+x,T=d.r.top+y,W=d.r.width,H=d.r.height;
        const sx=snapTo([L,L+W/2,L+W],d.vx),sy=snapTo([T,T+H/2,T+H],d.hy);
        if(sx)x+=sx.d;
        if(sy)y+=sy.d;
        if(sx||sy)g={v:sx?(sx.t-d.rr.left)/d.z:null,h:sy?(sy.t-d.rr.top)/d.z:null};
      }
      onGuides&&onGuides(g);
      dragRef.current={...d,x,y};
      setDrag(dragRef.current);
    };
    const up=()=>{
      const d=dragRef.current;dragRef.current=null;setDrag(null);onGuides&&onGuides(null);
      if(d&&(Math.abs(d.x)>2||Math.abs(d.y)>2))onMove(id,{dx:Math.round(base.dx+d.x/d.z),dy:Math.round(base.dy+d.y/d.z)});
    };
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
    window.addEventListener("pointercancel",up);
    return()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up)};
  },[!!drag]);
  const resizeDown=e=>{
    const el=elRef.current;
    const items=[...el.querySelectorAll("[data-tid]")].map(t=>({id:t.dataset.tid,base:sizes?.[t.dataset.tid]??Number(t.dataset.base)}));
    startScaleDrag(e,el,items,onLiveSize,onCommitSize);
  };
  // 상자는 내용(글씨) 크기만큼만 — 좌우 auto 마진으로 원래처럼 가운데 정렬
  return <div ref={elRef} data-bid={id} onPointerDown={down}
    style={{width:"fit-content",maxWidth:"100%",marginLeft:"auto",marginRight:"auto",...style,position:"relative",left:cur.dx,top:cur.dy,
      cursor:edit?(drag?"grabbing":"grab"):undefined,
      outline:edit?"1px dashed rgba(6,182,212,0.8)":"none",outlineOffset:4,
      touchAction:edit?"none":undefined,userSelect:edit?"none":undefined,zIndex:drag?5:undefined}}>
    {children}
    {edit&&onCommitSize&&<span title="끌어서 블록 글씨 전체 크기 조절" onPointerDown={resizeDown} style={{...HANDLE_STYLE,right:-10,bottom:-10}}/>}
  </div>;
}

function LoadImage({group,date,prefix,refCb,edit,ed:edSaved,live,onMove,onText,sel,onSelect,onLiveSize,onCommitSize}){
  const[guides,setGuides]=useState(null);
  const ed=live&&Object.keys(live).length?{...edSaved,size:{...edSaved.size,...live}}:edSaved;
  const pallets=group.pallets;
  const total=pallets.length;
  const singles=groupSinglePallets(pallets);
  const mixed=pallets.filter(p=>p.kind==="mixed");
  const font="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
  const T=(id,value,base,style)=><EditText id={id} value={value} base={base} edit={edit} ed={ed} onText={onText} selected={sel===id} onSelect={onSelect} onLiveSize={onLiveSize} onCommitSize={onCommitSize} style={style}/>;
  const D=(id,style,children)=><DragBlock key={id} id={id} edit={edit} pos={ed.pos} onMove={onMove} onGuides={setGuides} sizes={edSaved.size} onLiveSize={onLiveSize} onCommitSize={onCommitSize} style={style}>{children}</DragBlock>;

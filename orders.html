<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useLayoutEffect,useCallback,useMemo,useRef}=React;

// ═══════════════════════════════════════════
// 공통 헬퍼
// ═══════════════════════════════════════════
async function rpc(name,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+name,{
    method:"POST",
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(body||{})
  });
  if(!r.ok){let msg="";try{msg=await r.text()}catch(e){msg=String(r.status)}throw new Error(msg||String(r.status))}
  const txt=await r.text();
  if(!txt)return null;
  try{return JSON.parse(txt)}catch(e){return txt}
}
function errMsg(e){
  const s=String(e?.message||e||"");
  if(s.includes("unauthorized"))return "Supabase에서 최신 setup_orders.sql을 다시 실행하세요 (비밀번호 없는 버전).";
  if(s.includes("Could not find the function")||s.includes("PGRST202"))return "Supabase에 setup_orders.sql이 실행되지 않았습니다.";
  if(s.includes("duplicate key")&&s.includes("ol_products"))return "이미 등록된 제품코드입니다.";
  if(s.includes("site_exists"))return "이미 있는 생산지점 이름입니다.";
  if(s.includes("code_name_required"))return "제품코드와 제품명은 필수입니다.";
  return "오류: "+s.slice(0,120);
}

const DOW=["일","월","화","수","목","금","토"];
function fmtYmd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseYmd(s){const[y,m,d]=String(s).slice(0,10).split("-").map(Number);return new Date(y,m-1,d)}
function todayYmd(){return fmtYmd(new Date())}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return fmtYmd(d)}
function dowOf(s){return DOW[parseYmd(s).getDay()]}
function fmtMd(s){const d=parseYmd(s);return (d.getMonth()+1)+"/"+d.getDate()}
// 엑셀 셀 값 → YYYY-MM-DD (문자열 "2026/10/14 00:00:00", Date, 엑셀 serial 모두)
function toYmd(v){
  if(v==null||v==="")return "";
  if(v instanceof Date){
    if(isNaN(v.getTime()))return "";
    // SheetJS Date는 자정이 전날 23:59:xx로 오는 경우가 있어 몇 분 보정
    return fmtYmd(new Date(v.getTime()+10*60000));
  }
  if(typeof v==="number"&&v>20000&&v<80000){
    return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10);
  }
  const m=String(v).trim().match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m?`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`:"";
}
function toNum(v){
  if(typeof v==="number")return v;
  const n=parseFloat(String(v??"").replace(/,/g,"").trim());
  return isNaN(n)?0:n;
}
function fmtNum(n){return Number(n||0).toLocaleString("ko-KR",{maximumFractionDigits:2})}
function excelSerial(ymd){
  const[y,m,d]=ymd.split("-").map(Number);
  return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000;
}
function lsGet(k,def){try{const v=localStorage.getItem(k);return v==null?def:v}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

const NO_SITE="(지점 미지정)";
const COLOR_PRESETS=["#0ea5e9","#dc2626","#7e22ce","#16a34a","#ea580c","#1d4ed8","#db2777","#ca8a04","#0f766e","#111827"];

function Loader(){return <div style={{textAlign:"center",padding:"60px 0"}}><div className="loader"></div></div>}
function Empty({emoji,text}){return <div className="ol-empty"><div style={{fontSize:32,marginBottom:8,opacity:.7}}>{emoji||"📭"}</div>{text}</div>}
function Modal({children,onClose,lg}){

    <div className={"ol-modal"+(lg?" ol-modal-lg":"")}>{children}</div>

}

// ═══════════════════════════════════════════
// 발주서 엑셀 파싱
// 압축파일(.zip) → 안의 엑셀 파일 목록 [{name, read()}] (하위 폴더·압축 안의 압축 포함)
// 윈도우에서 만든 zip은 한글 파일명이 CP949라 UTF-8로 안 읽히면 EUC-KR로 다시 읽음
function decodeZipName(bytes){
  bytes=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);
  try{return new TextDecoder("utf-8",{fatal:true}).decode(bytes)}
  catch(e){try{return new TextDecoder("euc-kr").decode(bytes)}catch(e2){return String.fromCharCode(...bytes)}}
}
async function unzipOrderFiles(buf,zipName,depth=0){
  if(!window.JSZip)throw new Error("압축 해제 라이브러리를 불러오지 못했습니다");
  const zip=await JSZip.loadAsync(buf,{decodeFileName:decodeZipName});
  const out=[];
  for(const e of Object.values(zip.files)){
    if(e.dir)continue;
    const base=e.name.split("/").pop();
    if(/^__MACOSX\//.test(e.name)||base.startsWith("~$")||base.startsWith("."))continue; // 맥 메타·엑셀 임시파일 제외
    const label=zipName+" › "+base;
    if(/\.(xlsx|xls)$/i.test(base))out.push({name:label,read:()=>e.async("arraybuffer")});
    else if(/\.zip$/i.test(base)&&depth<2)out.push(...await unzipOrderFiles(await e.async("arraybuffer"),label,depth+1));
  }
  return out.sort((a,b)=>a.name.localeCompare(b.name,"ko",{numeric:true}));
}
// 고정 셀(C5 업체명, C10 발주번호, F13 입고예정일시, C13 물류센터) 우선,
// 비어 있으면 라벨 검색으로 fallback
// ═══════════════════════════════════════════
function parseOrderWorkbook(buf,fileName){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const out=[];
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn];
    if(!ws||!ws["!ref"])continue;
    const rng=XLSX.utils.decode_range(ws["!ref"]);
    const at=(r,c)=>{const cell=ws[XLSX.utils.encode_cell({r,c})];return cell?cell.v:""};
    const a1=addr=>{const cell=ws[addr];return cell?cell.v:""};
    const norm=s=>String(s??"").replace(/\s/g,"");
    const findRight=label=>{
      for(let r=rng.s.r;r<=Math.min(rng.e.r,30);r++)for(let c=rng.s.c;c<=rng.e.c;c++){
        if(norm(at(r,c))===label){
          for(let k=c+1;k<=Math.min(c+6,rng.e.c);k++){const v=at(r,k);if(String(v).trim()!=="")return v}
        }
      }
      return "";
    };

    const vendorRaw=String(a1("C5")||findRight("거래처명")||"").trim();
    const vendor=vendorRaw.replace(/^\s*\[[^\]]*\]\s*/,"").trim();
    let orderNo=String(a1("C10")||findRight("발주번호")||"").trim();
    if(!orderNo){const m=String(a1("A1")).match(/No\.?\s*(\d+)/i);if(m)orderNo=m[1]}
    const dueDate=toYmd(a1("F13"));
    const center=String(a1("C13")||"").trim();
    const centerAddr=String(a1("D13")||"").trim();
    const orderType=String(a1("C11")||findRight("발주구분")||"").trim();

    // 상품 표 헤더 행 찾기 ("상품코드")
    // 수량은 H열 "업체납품가능수량" 사용 (G열 발주수량 아님)
    let hr=-1,codeCol=1,nameCol=2,qtyCol=7,dateCol=20,centerCol=5;
    for(let r=rng.s.r;r<=rng.e.r&&hr<0;r++)for(let c=rng.s.c;c<=rng.e.c;c++){
      if(norm(at(r,c))==="상품코드"){hr=r;break}
    }
    if(hr>=0){
      for(let c=rng.s.c;c<=rng.e.c;c++){
        const h=norm(at(hr,c));
        if(h==="상품코드")codeCol=c;
        else if(h.startsWith("상품명"))nameCol=c;
        else if(h.includes("납품가능"))qtyCol=c;
        else if(h==="물류센터")centerCol=c;
        else if(h.includes("제조")||h.includes("유통"))dateCol=c;
      }
    }
    const items=[];
    if(hr>=0){
      for(let r=hr+1;r<=rng.e.r;r++){
        const first=norm(at(r,0));
        if(first==="합계"||first.startsWith("4."))break;
        const code=String(at(r,codeCol)).trim();
        if(!/^\d{3,}$/.test(code))continue;
        items.push({
          line_no:toNum(at(r,0))||items.length+1,
          code,
          name:String(at(r,nameCol)).trim(),
          qty:toNum(at(r,qtyCol)),
          center:String(at(r,centerCol)).trim(),
          mfg_date:toYmd(at(r,dateCol))||null,
          expiry_date:toYmd(at(r+1,dateCol))||null
        });
      }
    }
    if(!orderNo&&!items.length)continue;
    out.push({
      fileName,sheetName:sn,orderNo,vendor,dueDate,
      center:center||items[0]?.center||"",centerAddr,orderType,items
    });
  }
  return out;
}

// ═══════════════════════════════════════════
// 파렛트 계산
//  - 단독 1파렛트 용량 = 적재방식의 '최대 박스' (항상 이 값 — 박스규격으로 늘거나 줄지 않음)
//  - 박스규격(가로×세로)은 1단에 몇 박스 깔리는지 계산하는 데만 사용 (파렛트 바닥에 가장 많이 까는 배치, 회전 허용)
//          단수 = ⌊최대 박스 ÷ 1단 박스 수⌋ (표시용)
//  - 혼적: 1층 = 6방(자리). 1자리 최대 = 혼적 방식 최대 박스 ÷ 6 (예: 30 → 5)
//          자투리(혼적 1파렛트 최대 이하)는 모두 혼적 풀로 → 최소 파렛트 수로 합치고 파렛트끼리 고르게(pourBalanced)
// ═══════════════════════════════════════════
const DEFAULT_CAP=40;
const DEFAULT_PALLET={pallet_w:1100,pallet_d:1100,max_height:1700,pallet_base:0,mix_layers:6};
function palletCfg(settings){
  const c={...DEFAULT_PALLET};
  for(const k in c){const v=Number(settings?.[k]);if(Number.isFinite(v)&&v>=0)c[k]=v}
  return c;
}
function parseSpec(spec){
  const n=String(spec||"").match(/[\d.]+/g);
  if(!n||n.length<3)return null;
  const[w,d,h]=n.slice(0,3).map(Number);
  return w>0&&d>0&&h>0?{w,d,h}:null;
}
// 직사각형 L×W에 a×b 박스: 한 방향으로 k줄 + 나머지 회전 배치 (2구역, 양 축 모두 시도)
function twoBlockCount(L,W,a,b){
  if(L<Math.min(a,b)||W<Math.min(a,b))return 0;
  const grid=(L,W,a,b)=>Math.floor(L/a)*Math.floor(W/b);
  let best=Math.max(grid(L,W,a,b),grid(L,W,b,a));
  for(const[X,Y]of[[L,W],[W,L]]){
    for(let k=1;k*a<=X;k++)best=Math.max(best,k*Math.floor(Y/b)+grid(X-k*a,Y,b,a));
    for(let k=1;k*b<=X;k++)best=Math.max(best,k*Math.floor(Y/a)+grid(X-k*b,Y,a,b));
  }
  return best;
}
// 파렛트 바닥 1층 박스 수 — 2구역 배치 + 5구역 바람개비 배치 중 최대
// 5구역: 네 블록이 가운데를 돌아가며 감싸는 형태 (각 블록은 2구역 배치로 채움)
//   예: 460×300 박스, 1100×1100 → 300+300+460=1060 → 600×460 블록(2개) × 4 = 8
const _layerCache=new Map();
function layerCount(L,W,a,b){
  const key=[L,W,Math.max(a,b),Math.min(a,b)].join("|");
  if(_layerCache.has(key))return _layerCache.get(key);
  const f=(w,h)=>(w<=0||h<=0)?0:twoBlockCount(w,h,a,b);
  let best=f(L,W);
  // 분할 후보: i·a + j·b 조합(래스터 포인트)과 그 여집합
  const raster=S=>{
    const set=new Set([0]);
    for(let i=0;i*a<=S;i++)for(let j=0;i*a+j*b<=S;j++){const r=i*a+j*b;set.add(r);set.add(S-r)}
    return [...set].filter(v=>v>=0&&v<=S).sort((x,y)=>x-y);
  };
  const X=raster(L),Y=raster(W);
  for(const x1 of X)for(const x2 of X){
    if(x2<x1)continue;
    for(const y1 of Y)for(const y2 of Y){
      if(y2<y1)continue;
      // 좌하 [0,x1]×[0,y2] · 우하 [x1,L]×[0,y1] · 우상 [x2,L]×[y1,W] · 좌상 [0,x2]×[y2,W] · 가운데 [x1,x2]×[y1,y2]
      const n=f(x1,y2)+f(L-x1,y1)+f(L-x2,W-y1)+f(x2,W-y2)+f(x2-x1,y2-y1);
      if(n>best)best=n;
    }
  }
  _layerCache.set(key,best);
  return best;
}
function productMethods(p,methodMap){
  const ids=Array.isArray(p?.method_ids)?p.method_ids:[];
  const ms=ids.map(id=>methodMap[id]).filter(Boolean);
  return{single:ms.filter(m=>m.kind==="single"),mixed:ms.filter(m=>m.kind==="mixed")};
}
// 제품 1개의 파렛트 적재 능력
function boxCapacity(p,methodMap,cfg){
  const{single,mixed}=productMethods(p,methodMap);
  const slots=mixed.length?Math.min(...mixed.map(m=>m.per_layer||6)):6;
  const cols=mixed.length?Math.max(...mixed.map(m=>m.cols||3)):3;
  const canMix=mixed.length>0;
  // 용량은 항상 적재방식의 최대 박스 — 규격은 1단 박스 수 계산에만 사용
  const cap=single.length?Math.max(...single.map(m=>m.max_boxes)):mixed.length?Math.min(...mixed.map(m=>m.max_boxes)):DEFAULT_CAP;
  // 혼적 1자리에 쌓는 최대 박스 = 혼적 방식의 '1자리 최대 단수'(여러 개면 가장 낮은 것)
  // 비어 있으면 파렛트 설정의 '혼적 최대 단수'(기본 6) — 박스가 높아 6단까지 못 쌓는 제품은 4단 방식 등을 지정
  const layerSet=mixed.map(m=>m.mix_layers).filter(v=>v>0);
  const stack=Math.max(1,Math.floor(layerSet.length?Math.min(...layerSet):Number(cfg?.mix_layers)||6));
  const dims=parseSpec(p?.box_spec);
  const perLayer=dims?layerCount(cfg.pallet_w,cfg.pallet_d,dims.w,dims.d):0;
  if(perLayer>0){
    const layers=Math.max(1,Math.floor(cap/perLayer));
    return{fromSpec:true,dims,layers,perLayer,cap,rem:cap%perLayer,stack,slots,cols,canMix};
  }
  return{fromSpec:false,badSpec:!!dims,dims,layers:null,perLayer:null,cap,stack,slots,cols,canMix};
}
function enrichLine(item,p){
  const per=Math.max(1,Number(p?.per_box)||1);
  const exact=Number(item.qty||0)/per;
  const boxes=Math.ceil(exact-1e-9);
  return{item,product:p,per,boxes,partial:Math.abs(exact-Math.round(exact))>1e-9};
}
function toMethodMap(methods){
  return Object.fromEntries((methods||[]).map(m=>[Number(m.id),{...m,max_boxes:Number(m.max_boxes)||DEFAULT_CAP,cols:Number(m.cols)||3,per_layer:Number(m.per_layer)||6,mix_layers:Number(m.mix_layers)>0?Math.floor(Number(m.mix_layers)):null}]));
}
// 적재량 설명 문구
function capText(c){
  if(c.fromSpec)return c.cap<c.perLayer?`최대 ${c.cap}박스 · 1단 ${c.perLayer}박스 (1단도 안 참)`:`최대 ${c.cap}박스 · 1단 ${c.perLayer}박스 × ${c.layers}단${c.rem?` + ${c.rem}박스`:""}`;
  return c.badSpec?`최대 ${c.cap}박스 · 규격이 파렛트에 안 맞음`:`최대 ${c.cap}박스 · 규격 없음`;
}
// 양념 — 같은 양념끼리 우선 혼적. 정렬: 없음 → 간장 → 고추장 … (가나다)
// 보관 구분: 냉장(chilled, 기본) / 냉동(frozen) — 같은 업체라도 따로 출고, 부착리스트 센터 표기도 다름
const storageOf=p=>p?.storage==="frozen"?"frozen":"chilled";
const STORAGE_LABEL={chilled:"신선",frozen:"냉동"};
const sauceOf=x=>((x?.product||x)?.sauce||"").trim();
const sauceCmp=(a,b)=>a===b?0:!a?-1:!b?1:a.localeCompare(b,"ko");
// 한 묶음 안 서로 다른 양념 수 − 1 (양념 없는 제품은 어느 쪽과도 섞여도 됨)
const sauceConflict=keys=>Math.max(0,new Set(keys.filter(Boolean)).size-1);
// 묶음마다의 합 (0 = 간장·고추장 등이 한 파렛트에 섞이지 않음)
function sauceMixOf(bins,groups){
  if(!groups)return 0;
  return bins.reduce((a,b)=>a+sauceConflict(b.map(x=>groups[x.i])),0);
}

// 수량들을 bins개 묶음에 고르게 붓기 — 묶음 크기는 ⌊합÷bins⌋ 또는 ⌈합÷bins⌉
// 어느 묶음을 +1로 할지 × 붓는 순서(6개 이하면 전 순열)를 시험해 한 항목이 두 묶음으로 나뉘는 경우 최소화
// 반환: [[{i,n}], ...] (i = counts 인덱스, 붓는 순서대로)
function pourBalanced(counts,bins,groups){
  const N=counts.reduce((a,b)=>a+b,0),S=Math.max(1,bins);
  const lo=Math.floor(N/S),k=N%S;
  const combos=[];
  (function pick(start,left,acc){
    if(combos.length>2000)return;
    if(left===0){combos.push(new Set(acc));return}
    for(let i=start;i<=S-left;i++)pick(i+1,left-1,[...acc,i]);
  })(0,k,[]);
  const idx=counts.map((_,i)=>i);
  const perms=[];
  if(counts.length<=6){
    (function perm(arr,rest){
      if(!rest.length){perms.push(arr);return}
      rest.forEach((v,i)=>perm([...arr,v],rest.filter((_,j)=>j!==i)));
    })([],idx);
  }else{
    // 7개 이상은 전 순열 대신 정렬 순서 + 고정 시드 섞기 400가지 (결과가 매번 같도록)
    perms.push(idx);perms.push([...idx].sort((a,b)=>counts[b]-counts[a]));perms.push([...idx].sort((a,b)=>counts[a]-counts[b]));
    let seed=12345;const rnd=()=>(seed=(seed*1103515245+12345)%2147483648)/2147483648;
    const tries=Math.min(400,Math.floor(20000/Math.max(1,combos.length))); // 묶음이 많으면 시도 수 줄임 (계산 시간 제한)
    for(let t=0;t<tries;t++){const a=[...idx];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}perms.push(a)}
  }
  const pour=(order,hiSet)=>{
    const out=[];let splits=0,pi=0,left=order.length?counts[order[0]]:0;
    for(let si=0;si<S;si++){
      let room=lo+(hiSet.has(si)?1:0);const parts=[];
      while(room>0&&pi<order.length){
        const take=Math.min(room,left);
        if(take>0){parts.push({i:order[pi],n:take});room-=take;left-=take}
        if(left===0){pi++;left=pi<order.length?counts[order[pi]]:0}
      }
      if(parts.length>1)splits+=parts.length-1;
      out.push(parts);
    }
    return{bins:out,splits,mix:sauceMixOf(out,groups)};
  };

  let best=null;
  outer:for(const order of perms)for(const hiSet of combos){
    const r=pour(order,hiSet);
    if(!best||r.mix<best.mix||r.mix===best.mix&&r.splits<best.splits){best=r;if(r.splits===0&&r.mix===0)break outer}
  }
  return best.bins;
}

// 자투리를 n개 파렛트(각 최대 cap)에 제품을 나누지 않고 통째로 배정 — 가능한 배정 중
// ⓐ 양념이 섞이는 파렛트 적은 것 ① 상품 1개 소량(cap 절반 미만) 파렛트가 적은 것 ② 상품 1개짜리 파렛트가 적은 것 ③ 파렛트끼리 수량 차이가 작은 것. 불가능하면 null
function packWhole(counts,n,cap,groups){
  const order=counts.map((_,i)=>i).sort((a,b)=>counts[b]-counts[a]);
  const load=Array(n).fill(0),items=Array.from({length:n},()=>[]);
  let best=null,steps=0;
  const less=(x,y)=>{for(let i=0;i<x.length;i++)if(x[i]!==y[i])return x[i]<y[i];return false};
  (function dfs(k){
    if(++steps>300000)return;
    if(k===order.length){
      const sc=[sauceMixOf(items.map(b=>b.map(i=>({i}))),groups),items.filter((b,j)=>b.length===1&&load[j]<cap/2).length,items.filter(b=>b.length===1).length,Math.max(...load)-Math.min(...load)];
      if(!best||less(sc,best.sc))best={sc,bins:items.map(b=>b.map(i=>({i,n:counts[i]})))};
      return;
    }
    const i=order[k];let triedEmpty=false;
    for(let b=0;b<n;b++){
      if(load[b]+counts[i]>cap)continue;
      if(!items[b].length){if(triedEmpty)continue;triedEmpty=true} // 빈 파렛트끼리는 같은 경우
      items[b].push(i);load[b]+=counts[i];
      dfs(k+1);
      items[b].pop();load[b]-=counts[i];
    }

}
// 혼적 풀 → 최소 파렛트 수(⌈합 ÷ 혼적 1파렛트 최대⌉)로 합침
// 후보 두 가지 — 제품을 통째로 배정(packWhole) / 고르게 나눔(pourBalanced, 나뉘는 제품 최소화) — 중
// ⓪ 제품을 나눴을 때 1자리(stack)도 안 되는 자투리 조각(예: 25+1의 1) 적은 것 ⓐ 양념이 섞이는 파렛트 적은 것
// ① 상품 1개 소량 파렛트(cap 절반 미만) 적은 것 ② 두 파렛트에 나뉜 제품 적은 것 ③ 파렛트 수량 차이 작은 것
function binScore(bins,cap,stack,groups){
  const loads=bins.map(b=>b.reduce((a,x)=>a+x.n,0));
  const ids=new Set(bins.flatMap(b=>b.map(x=>x.i)));
  const occ={};bins.forEach(b=>new Set(b.map(x=>x.i)).forEach(i=>{occ[i]=(occ[i]||0)+1}));
  const tinyPieces=bins.reduce((a,b)=>a+b.filter(x=>occ[x.i]>1&&x.n<stack).length,0);
  return[tinyPieces,sauceMixOf(bins,groups),bins.filter((b,j)=>new Set(b.map(x=>x.i)).size===1&&loads[j]<cap/2).length,
    bins.reduce((a,b)=>a+new Set(b.map(x=>x.i)).size,0)-ids.size,
    Math.max(...loads)-Math.min(...loads)];
}
function lexLess(x,y){for(let i=0;i<x.length;i++)if(x[i]!==y[i])return x[i]<y[i];return false}
// 1자리 단수가 다른 제품이 섞인 풀 — (가) 전부 한 풀(가장 낮은 단수에 맞춤) / (나) 단수별로 따로 혼적 중 나은 쪽
function mergePool(pool){
  if(!pool.length)return[];
  const stacks=[...new Set(pool.map(e=>e.stack))];
  if(stacks.length<2)return mergePoolOne(pool);
  const all=mergePoolOne(pool);
  const split=stacks.sort((a,b)=>b-a).flatMap(st=>mergePoolOne(pool.filter(e=>e.stack===st)));
  return lexLess(palletScore(split),palletScore(all))?split:all;
}
function mergePoolOne(pool){
  if(!pool.length)return[];
  pool=[...pool].sort((x,y)=>sauceCmp(sauceOf(x),sauceOf(y))||x.item.line_no-y.item.line_no); // 같은 양념끼리 붙여서 시작
  const slots=Math.min(...pool.map(e=>e.slots)),cols=Math.max(...pool.map(e=>e.cols));
  const cap=Math.max(1,Math.min(...pool.map(e=>e.stack))*slots);
  const total=pool.reduce((a,e)=>a+e.count,0);
  const out=[];
  const counts=pool.map(e=>e.count),n=Math.ceil(total/cap),groups=pool.map(sauceOf);
  const whole=packWhole(counts,n,cap,groups),poured=pourBalanced(counts,n,groups);
  const stack=Math.max(1,Math.floor(cap/slots));
  const chosen=whole&&!lexLess(binScore(poured,cap,stack,groups),binScore(whole,cap,stack,groups))?whole:poured;
  for(const b of chosen){
    if(!b.length)continue;
    const by=new Map();
    for(const{i,n}of b)by.set(i,(by.get(i)||0)+n);
    const lines=[...by].map(([i,n])=>({...pool[i],count:n,need:Math.ceil(n/pool[i].stack)}));
    lines.sort((x,y)=>sauceCmp(sauceOf(x),sauceOf(y))||x.item.line_no-y.item.line_no); // 혼적 파렛트 안: 양념별 → 발주서 순서
    out.push(lines.length===1?{kind:"single",lines}:{kind:"mixed",slots,cols,lines});
  }

}
// 파렛트 목록 비교 점수 (작을수록 좋음)
function palletScore(list){
  const smallOnes=list.filter(p=>p.kind==="single"&&p.lines[0].count<p.lines[0].stack*p.lines[0].slots/2);
  const occ=list.reduce((a,p)=>a+p.lines.length,0),uniq=new Set(list.flatMap(p=>p.lines.map(l=>l.product.code))).size;
  const per={};list.forEach(p=>p.lines.forEach(l=>{per[l.product.code]=(per[l.product.code]||0)+1}));
  const tinyPieces=list.reduce((a,p)=>a+p.lines.filter(l=>per[l.product.code]>1&&l.count<l.stack).length,0);
  const sauceMix=list.reduce((a,p)=>a+sauceConflict(p.lines.map(sauceOf)),0);
  return[list.length,tinyPieces,sauceMix,smallOnes.length,occ-uniq,-Math.min(Infinity,...smallOnes.map(p=>p.lines[0].count))];
}
function buildPallets(lines,methodMap,cfg){
  const singles=[],small=[],big=[];
  for(const ln of lines){
    if(ln.boxes<=0)continue;
    const c=boxCapacity(ln.product,methodMap,cfg);
    const full=Math.floor(ln.boxes/c.cap),rem=ln.boxes%c.cap;
    for(let i=0;i<full;i++)singles.push({kind:"single",lines:[{...ln,count:c.cap,capInfo:c}]});
    if(rem>0){
      const e={...ln,count:rem,stack:c.stack,h:c.dims?.h||1,slots:c.slots,cols:c.cols,capInfo:c};
      if(!c.canMix)singles.push({kind:"single",lines:[{...ln,count:rem,capInfo:c}]});
      else if(rem<=c.stack*c.slots)small.push(e); // 혼적 1파렛트에 들어가는 자투리
      else big.push(e);                           // 혼적 1파렛트보다 큰 자투리
    }
  }
  // 두 가지를 비교: (가) 큰 자투리는 단독 + 작은 자투리만 혼적 / (나) 큰 자투리까지 모두 혼적
  // 파렛트 수가 적은 쪽 → 같으면 '상품 1개 소량 파렛트'(혼적 1파렛트 최대의 절반 미만)가 적은 쪽 → 같으면 그런 파렛트 중 가장 작은 게 큰 쪽
  const asSingle=e=>({kind:"single",lines:[{...e,capInfo:e.capInfo}]});
  const optA=big.map(asSingle).concat(mergePool(small));
  const optB=big.length&&small.length?mergePool(big.concat(small)):null;
  // 비교: 파렛트 수 → 1자리도 안 되는 나뉜 조각 수 → 양념 섞인 파렛트 수 → 상품 1개 소량 파렛트 수 → 두 파렛트 이상에 나뉜 제품 수 → (소량 파렛트 중 최소 수량이 큰 쪽)
  const better=(x,y)=>lexLess(palletScore(x),palletScore(y));
  const merged=optB&&better(optB,optA)?optB:optA;
  // 단독 파렛트 먼저(발주서 순서 → 같은 제품은 많은 것부터), 혼적은 뒤로
  const sgl=singles.concat(merged.filter(p=>p.kind==="single"))
    .sort((x,y)=>x.lines[0].item.line_no-y.lines[0].item.line_no||y.lines[0].count-x.lines[0].count);
  const mixedSorted=merged.filter(p=>p.kind==="mixed").sort((x,y)=>sauceCmp(sauceOf(x.lines[0]),sauceOf(y.lines[0]))); // 혼적은 양념별로 이어서
  const all=sgl.concat(mixedSorted);
  return all.map((p,i)=>({...p,no:i+1,total:all.length,boxes:p.lines.reduce((s,l)=>s+l.count,0)}));
}

// 같은 업체·센터의 발주서 여러 개 → 한 리스트용 대표 발주 (발주번호는 ", "로 연결)
function mergeOrders(list){
  if(list.length===1)return list[0];
  return{...list[0],id:list.map(o=>o.id).join("+"),order_no:list.map(o=>o.order_no).join(", "),
    file_name:list.map(o=>o.file_name).join(", "),merged_count:list.length};
}
// 날짜의 발주서들 → [{order, orders, vendor, site, lines, pallets}]
// 입고일(이미 날짜별 조회) + 업체명 + 센터가 같으면 발주번호가 달라도 한 리스트로 합쳐 적재 (추가 발주 대응)
// 같은 상품코드·같은 소비기한은 수량을 합쳐 한 줄로 → 파렛트를 같이 채움. 그 안에서 생산지점별로 분리
// opts.separate: 추가 발주 — 발주번호가 달라도 합치지 않고 발주서마다 따로 적재·번호
function buildSiteGroups(orders,prodMap,methodMap,cfg,opts){
  const sep=!!opts?.separate;
  const buckets=new Map(),unmatched=[];
  const sorted=[...orders].sort((a,b)=>String(a.order_no).localeCompare(String(b.order_no),undefined,{numeric:true}));
  for(const o of sorted){
    const vendor=(o.vendor||"").trim(),center=(o.center||"").trim();
    for(const it of (o.items||[])){
      const p=prodMap[it.code];
      if(!p){unmatched.push({order:o,item:it});continue}
      const site=(p.site||"").trim()||NO_SITE,storage=storageOf(p);
      const key=(sep?o.id+"\u0001":"")+vendor+"\u0001"+center+"\u0001"+storage+"\u0001"+site;
      let b=buckets.get(key);
      if(!b){b={vendor,center,storage,site,orderKey:sep?String(o.id):"",orders:[],items:new Map()};buckets.set(key,b)}
      if(!b.orders.includes(o))b.orders.push(o);
      const ik=it.code+"|"+(it.expiry_date||"");
      const cur=b.items.get(ik);
      if(cur)cur.item.qty=Number(cur.item.qty||0)+Number(it.qty||0);
      else b.items.set(ik,{item:{...it,line_no:b.items.size+1,qty:Number(it.qty||0)},product:p});
    }
  }
  const groups=[...buckets.values()]
    .sort((a,b)=>a.vendor.localeCompare(b.vendor)||a.center.localeCompare(b.center)||a.storage.localeCompare(b.storage)||a.site.localeCompare(b.site,"ko",{numeric:true}))
    .map(b=>{
      const lines=[...b.items.values()].map(e=>enrichLine(e.item,e.product));
      return{order:mergeOrders(b.orders),orders:b.orders,vendor:b.vendor,center:b.center,storage:b.storage,orderKey:b.orderKey,site:b.site,lines,pallets:buildPallets(lines,methodMap,cfg||DEFAULT_PALLET)};
    });
  // 같은 생산지점에 냉장·냉동이 함께 있으면 표시·편집 키를 구분
  const siteKey=g=>g.orderKey+"\u0001"+g.vendor+"\u0001"+g.center+"\u0001"+g.site;
  const siteCount={};for(const g of groups)siteCount[siteKey(g)]=(siteCount[siteKey(g)]||0)+1;
  for(const g of groups)g.splitStorage=siteCount[siteKey(g)]>1;
  // 같은 업체·센터·보관(냉장/냉동)인데 생산지점이 다르면 적재는 따로, 파렛트 번호는 이어서 (예: 3층 22-1~10, 4층 22-11~22)
  const byVendor=new Map();
  for(const g of groups){const k=g.orderKey+"\u0001"+g.vendor+"\u0001"+g.center+"\u0001"+g.storage;if(!byVendor.has(k))byVendor.set(k,[]);byVendor.get(k).push(g)}
  for(const list of byVendor.values()){
    if(list.length<2)continue;
    const total=list.reduce((a,g)=>a+g.pallets.length,0);
    let off=0;
    for(const g of list){
      g.pallets=g.pallets.map(p=>({...p,no:p.no+off,total}));
      off+=g.pallets.length;
    }
  }
  return{groups,unmatched};
}

// 부착리스트 제목 배경색 — 업체명마다 다른 색 (ol_settings "vendor_colors" = {업체명: "RRGGBB"}, 처음 보는 업체는 안 쓴 색 자동 배정)
const TITLE_COLORS=[
  {rgb:"FFFF00",label:"노랑"},{rgb:"92D050",label:"연두"},{rgb:"8DB4E2",label:"하늘"},{rgb:"FABF8F",label:"주황"},
  {rgb:"CCA8F0",label:"보라"},{rgb:"FF99CC",label:"분홍"},{rgb:"B7DEE8",label:"청록"},{rgb:"D9D9D9",label:"회색"}
];
const TITLE_NONE="none"; // 배경색 없음 (자동 배정에는 안 씀)
const titleBg=c=>c===TITLE_NONE?"#ffffff":"#"+(c||"FFFF00");
function assignVendorColors(vendors,saved){
  const map={...(saved||{})},added={};
  for(const v of vendors){
    if(map[v])continue;
    const used=new Set(Object.values(map));
    const c=(TITLE_COLORS.find(t=>!used.has(t.rgb))||TITLE_COLORS[Object.keys(map).length%TITLE_COLORS.length]).rgb;
    map[v]=c;added[v]=c;
  }
  return{map,added};
}

// ── APS 품목 연결 (발주 제품 → APS 생산 품목) ──
let _apsItemsCache=null,_apsItemsPromise=null;
function loadApsItems(force){
  if(_apsItemsCache&&!force)return Promise.resolve(_apsItemsCache);
  if(_apsItemsPromise&&!force)return _apsItemsPromise;
  _apsItemsPromise=rpc("ol_list_aps_items",{p_admin_hash:""})
    .then(d=>{_apsItemsCache={items:Array.isArray(d)?d:[],missing:false};return _apsItemsCache})
    .catch(e=>{const missing=/function|PGRST202|schema cache/i.test(String(e?.message||e));_apsItemsPromise=null;return {items:[],missing,error:missing?"":errMsg(e)}});
  return _apsItemsPromise;
}
function useApsItems(){
  const[st,setSt]=useState(_apsItemsCache);
  useEffect(()=>{let alive=true;loadApsItems().then(r=>{if(alive)setSt(r)});return()=>{alive=false}},[]);
  return st; // null = 불러오는 중
}
// 이름 비교용: 괄호 안·중량·기호·공백 제거
function apsNameKey(s){
  return String(s||"").toLowerCase().replace(/\[[^\]]*\]|\([^)]*\)/g," ")
    .replace(/\d+(\.\d+)?\s*(kg|g|ea|개|팩|입)/g," ").replace(/[*x×\/,·_\-]/g," ").replace(/\s+/g,"");
}
function apsSim(a,b){
  const A=apsNameKey(a),B=apsNameKey(b);
  if(!A||!B)return 0;
  if(A===B)return 1;
  const grams=x=>{const m=new Map();for(let i=0;i<x.length-1;i++){const g=x.slice(i,i+2);m.set(g,(m.get(g)||0)+1)}return m};
  const ga=grams(A),gb=grams(B);let inter=0,na=0,nb=0;
  ga.forEach(v=>na+=v);gb.forEach(v=>nb+=v);
  ga.forEach((v,k)=>{inter+=Math.min(v,gb.get(k)||0)});
  let sc=na+nb?2*inter/(na+nb):0;
  if(A.includes(B)||B.includes(A))sc=Math.max(sc,0.75);
  return sc;
}
// 발주 제품명과 가장 비슷한 APS 품목 (점수 0.45 이상만)
function suggestApsItem(names,items){
  let best=null,bs=0;
  for(const it of items||[]){
    const sc=Math.max(0,...names.filter(Boolean).map(n=>apsSim(n,it.name)));
    if(sc>bs){bs=sc;best=it}
  }
  return bs>=0.45?best:null;
}
function apsItemLabel(it){return it?`${it.name}${(it.spec||"").trim()?" · "+it.spec:""} (${it.code})`:""}

function ProductForm({adminHash,masters,initial,onSaved,onCancel,onReloadMasters}){
  const isEdit=!!initial?.id;
  const[code,setCode]=useState(initial?.code||"");
  const[name,setName]=useState(initial?.name||"");
  const[imageName,setImageName]=useState(initial?.image_name||"");
  const[shipName,setShipName]=useState(initial?.ship_name||"");
  const[savedId,setSavedId]=useState(initial?.id||null); // 출고장용 이름 저장만 실패했을 때 다시 저장해도 중복 추가 안 되게
  const initApsId=initial?.aps_item_id!=null?Number(initial.aps_item_id):null;
  const[apsItemId,setApsItemId]=useState(initApsId);
  const apsSt=useApsItems();
  const apsSuggest=useMemo(()=>apsItemId||!apsSt?.items?.length?null:suggestApsItem([name,shipName,imageName],apsSt.items),[apsItemId,apsSt,name,shipName,imageName]);
  const[perBox,setPerBox]=useState(initial?.per_box??"");
  const[methodIds,setMethodIds]=useState(Array.isArray(initial?.method_ids)?initial.method_ids.map(Number):[]);
  const[site,setSite]=useState(initial?.site||"");
  const[boxSpec,setBoxSpec]=useState(initial?.box_spec||"");
  const[color,setColor]=useState(initial?.color||COLOR_PRESETS[0]);
  const[sauce,setSauce]=useState(initial?.sauce||"");
  const[storage,setStorage]=useState(storageOf(initial));
  const sauceOptions=[...new Set(["간장","고추장",...masters.products.map(x=>(x.sauce||"").trim()).filter(Boolean)])];
  const[err,setErr]=useState("");
  const[saving,setSaving]=useState(false);
  const[showSpecs,setShowSpecs]=useState(false);
  const[showMethods,setShowMethods]=useState(false);
  const[showSites,setShowSites]=useState(false);

  const siteNames=(masters.sites||[]).map(x=>x.name);
  const toggleMethod=id=>setMethodIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);

  const save=async()=>{
    if(!code.trim()||!name.trim()){setErr("제품코드와 제품명은 필수입니다");return}
    const per=parseInt(perBox,10);
    if(!per||per<1){setErr("입수량은 1 이상의 숫자로 입력하세요");return}
    setSaving(true);setErr("");
    try{
      const args={
        p_admin_hash:adminHash,p_id:savedId,p_code:code.trim(),p_name:name.trim(),
        p_image_name:imageName.trim(),p_per_box:per,p_method_ids:methodIds,
        p_site:site.trim(),p_box_spec:boxSpec,p_color:color
      };
      const missingFn=e=>/function|PGRST202|schema cache/i.test(String(e?.message||e));
      let id;
      try{id=await rpc("ol_upsert_product",{...args,p_sauce:sauce.trim(),p_storage:storage})}
      catch(e){
        // setup_orders_storage.sql 실행 전이면 냉장/냉동 없이 저장하고 안내
        if(!missingFn(e))throw e;
        try{id=await rpc("ol_upsert_product",{...args,p_sauce:sauce.trim()})}
        catch(e2){
          // setup_orders_sauce.sql 실행 전이면 양념 없이 저장하고 안내
          if(!missingFn(e2))throw e2;
          id=await rpc("ol_upsert_product",args);
          if(sauce.trim())alert("제품은 저장했지만 양념은 저장되지 않았습니다.\nSupabase SQL Editor에서 setup_orders_sauce.sql 을 1회 실행해 주세요.");
        }
        if(storage==="frozen")alert("제품은 저장했지만 냉장/냉동 구분은 저장되지 않았습니다.\nSupabase SQL Editor에서 setup_orders_storage.sql 을 1회 실행해 주세요.");
      }
      const pid=Number(id)||savedId;
      if(pid&&!savedId)setSavedId(pid);
      // 출고장용 제품명 — 별도 함수로 저장 (값이 바뀐 경우만)
      if(pid&&shipName.trim()!==(initial?.ship_name||"").trim()){
        try{await rpc("ol_set_product_ship_name",{p_admin_hash:adminHash,p_id:pid,p_ship_name:shipName.trim()})}
        catch(e){
          if(!missingFn(e))throw e;
          setErr("제품은 저장했지만 출고장용 제품명은 저장되지 않았습니다. Supabase SQL Editor에서 setup_orders_shipname.sql 을 1회 실행한 뒤 다시 저장하세요.");
          setSaving(false);return;
        }
      }
      // APS 품목 연결 — 값이 바뀐 경우만
      if(pid&&(apsItemId??null)!==initApsId){
        try{await rpc("ol_set_product_aps_item",{p_admin_hash:adminHash,p_id:pid,p_aps_item_id:apsItemId??null})}
        catch(e){
          if(!missingFn(e))throw e;
          setErr("제품은 저장했지만 APS 품목 연결은 저장되지 않았습니다. Supabase SQL Editor에서 setup_orders_aps_link.sql 을 1회 실행한 뒤 다시 저장하세요.");
          setSaving(false);return;
        }
      }
      onSaved();
    }catch(e){setErr(errMsg(e))}
    setSaving(false);
  };

  return <>
    <div style={{fontSize:17,fontWeight:700,marginBottom:16}}>{isEdit?"✏ 제품 수정":"+ 제품 추가"}</div>

      <div><div className="ol-label">제품코드 *</div><input className="ol-input" value={code} onChange={e=>setCode(e.target.value)} placeholder="예: 65657585"/></div>
      <div><div className="ol-label">입수량 * (박스당 개수)</div><input className="ol-input" type="number" min="1" value={perBox} onChange={e=>setPerBox(e.target.value)} placeholder="예: 8"/></div>
    </div>
    <div style={{marginBottom:12}}><div className="ol-label">제품명 *</div><input className="ol-input" value={name} onChange={e=>setName(e.target.value)} placeholder="발주서/부착리스트에 표시될 이름"/></div>
    <div style={{marginBottom:12}}><div className="ol-label">이미지용 제품명 (적재이미지에 표시)</div><input className="ol-input" value={imageName} onChange={e=>setImageName(e.target.value)} placeholder="예: 삼겹구이용"/></div>
    <div style={{marginBottom:12}}><div className="ol-label">출고장용 제품명 (🚚 출고장에 표시 · 비우면 제품명 그대로)</div><input className="ol-input" value={shipName} onChange={e=>setShipName(e.target.value)} placeholder="예: 양념닭주물럭 2kg"/></div>
    <div style={{marginBottom:12}}>
      <div className="ol-label">🔗 APS 품목 (생산계획 연결 — 이 제품 발주가 재고보다 많으면 생산계획 탭에 알림)</div>
      {apsSt===null?<div style={{fontSize:12,color:"var(--muted)"}}>APS 품목 불러오는 중…</div>:
       apsSt.missing?<div style={{fontSize:12,color:"#f59e0b"}}>Supabase SQL Editor에서 setup_orders_aps_link.sql 을 1회 실행하면 연결할 수 있습니다.</div>:
       apsSt.error?<div style={{fontSize:12,color:"#ef4444"}}>{apsSt.error}</div>:
       <>
        <select className="ol-input" value={apsItemId??""} onChange={e=>setApsItemId(e.target.value?Number(e.target.value):null)}>
          <option value="">— 연결 안 함 —</option>
          {apsSt.items.map(it=><option key={it.id} value={it.id}>{it.type==="semi"?"[반제품] ":""}{apsItemLabel(it)}</option>)}
          {apsItemId!=null&&!apsSt.items.some(it=>Number(it.id)===apsItemId)&&<option value={apsItemId}>(삭제된 APS 품목 #{apsItemId})</option>}
        </select>
        {apsSuggest&&<div style={{fontSize:12,marginTop:4,color:"var(--muted)"}}>
          추천: <b style={{color:"var(--text)"}}>{apsItemLabel(apsSuggest)}</b>{" "}
          <button type="button" className="ol-btn ol-btn-secondary ol-btn-sm" style={{padding:"1px 8px"}} onClick={()=>setApsItemId(Number(apsSuggest.id))}>이걸로 연결</button>
        </div>}
       </>}
    </div>

    <div style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div className="ol-label">적재방식 (다중 선택)</div>
        <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setShowMethods(true)}>🧱 적재방식 관리</button>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}>
        {masters.methods.length===0&&<span style={{fontSize:12,color:"var(--muted)"}}>등록된 적재방식이 없습니다 — 관리 버튼으로 추가하세요</span>}
        {masters.methods.map(m=>{
          const on=methodIds.includes(Number(m.id));
          return <label key={m.id} className={"ol-check"+(on?" on":"")}>

function PalletSettings({adminHash,masters,onChanged,onClose}){
  const cur=palletCfg(masters.settings);
  const[form,setForm]=useState(cur);
  const[err,setErr]=useState("");const[busy,setBusy]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const fields=[
    ["pallet_w","파렛트 가로 (mm)"],["pallet_d","파렛트 세로 (mm)"],["mix_layers","혼적 최대 단수 (1자리에 쌓는 박스)"]
  ];
  const save=async()=>{
    const vals={};
    for(const[k,label]of fields){
      const v=Number(form[k]);
      if(!Number.isFinite(v)||v<=0){setErr(label+" 값을 확인하세요");return}
      vals[k]=v;
    }
    setBusy(true);setErr("");
    try{
      for(const k in vals)if(vals[k]!==cur[k])await rpc("ol_set_setting",{p_admin_hash:adminHash,p_key:k,p_value:vals[k]});
      await onChanged();onClose();
    }catch(e){setErr(errMsg(e))}
    setBusy(false);
  };
  return <>
    <div style={{fontSize:17,fontWeight:700,marginBottom:6}}>⚙ 파렛트 설정</div>
    <div style={{fontSize:12,color:"var(--muted)",marginBottom:14,lineHeight:1.6}}>
      제품의 박스규격(가로×세로)과 이 파렛트 크기로 <b>1단에 몇 박스</b> 깔리는지만 계산합니다.<br/>
      단독 파렛트 1개에 싣는 최대 박스 수는 <b>적재방식의 '최대 박스'</b>로 정해집니다.<br/>
      혼적 파렛트는 한 층 6자리에 각각 <b>혼적 최대 단수</b>까지 쌓습니다 (6단이면 1파렛트 최대 36박스).
    </div>
    <div className="ol-grid">
      {fields.map(([k,label])=><div key={k}><div className="ol-label">{label}</div><input className="ol-input" type="number" min="0" value={form[k]} onChange={e=>set(k,e.target.value)}/></div>)}
    </div>
    {err&&<div className="ol-err">{err}</div>}
    <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:16}}>
      <button className="ol-btn ol-btn-secondary" onClick={onClose}>취소</button>
      <button className="ol-btn ol-btn-primary" onClick={save} disabled={busy}>{busy?"저장 중...":"저장"}</button>
    </div>
  </>;
}

function SiteManager({adminHash,masters,onChanged,onClose,onPick}){
  const[name,setName]=useState("");
  const[err,setErr]=useState("");const[busy,setBusy]=useState(false);
  const[editId,setEditId]=useState(null);
  const[editName,setEditName]=useState("");
  const sites=masters.sites||[];
  const usedBy=n=>masters.products.filter(p=>(p.site||"").trim()===n).length;
  const add=async()=>{
    const n=name.trim();
    if(!n){setErr("지점 이름을 입력하세요");return}
    if(sites.some(x=>x.name===n)){setErr("이미 있는 생산지점입니다");return}
    setBusy(true);setErr("");
    try{await rpc("ol_add_site",{p_admin_hash:adminHash,p_name:n});setName("");await onChanged();if(onPick)onPick(n)}
    catch(e){setErr(errMsg(e))}
    setBusy(false);
  };
  const rename=async x=>{
    const n=editName.trim();
    if(!n||n===x.name){setEditId(null);return}
    const used=usedBy(x.name);
    if(used&&!confirm(`'${x.name}' → '${n}'(으)로 바꾸면 이 지점을 쓰는 제품 ${used}개도 함께 바뀝니다. 진행할까요?`))return;
    setBusy(true);setErr("");
    try{await rpc("ol_rename_site",{p_admin_hash:adminHash,p_id:x.id,p_name:n});setEditId(null);await onChanged()}
    catch(e){setErr(errMsg(e))}
    setBusy(false);
  };
  const del=async x=>{
    const used=usedBy(x.name);
    if(!confirm(`'${x.name}' 생산지점을 목록에서 삭제할까요?`+(used?`\n(이 지점을 쓰는 제품 ${used}개는 값이 유지됩니다)`:"")))return;
    try{await rpc("ol_delete_site",{p_admin_hash:adminHash,p_id:x.id});await onChanged()}catch(e){setErr(errMsg(e))}
  };
  return <>
    <div style={{fontSize:17,fontWeight:700,marginBottom:14}}>🏭 생산지점 관리</div>
    <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:12}}>
      <input className="ol-input" placeholder="지점 이름 (예: 군포공장)" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
      <button className="ol-btn ol-btn-primary ol-btn-sm" onClick={add} disabled={busy}>+ 추가</button>
    </div>
    {err&&<div className="ol-err">{err}</div>}
    {sites.length===0?<Empty emoji="🏭" text="등록된 생산지점이 없습니다"/>:
    <table className="ol-table"><thead><tr><th>생산지점</th><th className="right">사용 제품</th><th></th></tr></thead><tbody>
      {sites.map(x=><tr key={x.id}>
        <td style={{fontWeight:600}}>{editId===x.id
          ?<input className="ol-input" value={editName} autoFocus onChange={e=>setEditName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")rename(x);if(e.key==="Escape")setEditId(null)}}/>
          :x.name}</td>
        <td className="right">{usedBy(x.name)}</td>
        <td className="right" style={{whiteSpace:"nowrap"}}>
          {editId===x.id?<>
            <button className="ol-btn ol-btn-primary ol-btn-sm" style={{marginRight:4}} onClick={()=>rename(x)} disabled={busy}>저장</button>
            <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setEditId(null)}>취소</button>
          </>:<>
            {onPick&&<button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginRight:4}} onClick={()=>onPick(x.name)}>선택</button>}
            <button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginRight:4}} onClick={()=>{setEditId(x.id);setEditName(x.name)}}>이름 수정</button>
            <button className="ol-btn ol-btn-danger ol-btn-sm" onClick={()=>del(x)}>삭제</button>
          </>}
        </td>
      </tr>)}
    </tbody></table>}
    <div style={{textAlign:"right",marginTop:14}}><button className="ol-btn ol-btn-secondary" onClick={onClose}>닫기</button></div>
  </>;
}

// "규격명 (가로×세로×높이)" — 규격명 없으면 치수만
function specLabel(spec,boxSpecs){
  if(!spec)return "";
  const b=(boxSpecs||[]).find(x=>x.spec===spec);
  return b&&(b.name||"").trim()?`${b.name.trim()} (${spec})`:spec;
}

function BoxSpecManager({adminHash,masters,onChanged,onClose,onPick}){
  const[name,setName]=useState("");
  const[w,setW]=useState("");const[d,setD]=useState("");const[h,setH]=useState("");
  const[err,setErr]=useState("");const[busy,setBusy]=useState(false);
  const[editId,setEditId]=useState(null);
  const[editName,setEditName]=useState("");
  const add=async()=>{
    if(!w||!d||!h){setErr("가로·세로·높이를 모두 입력하세요");return}
    const spec=`${w}×${d}×${h}`;
    const dup=masters.box_specs.find(b=>b.spec===spec);
    if(dup&&!confirm(`'${spec}' 규격이 이미 있습니다${dup.name?` (규격명: ${dup.name})`:""}.\n규격명을 '${name.trim()||"(없음)"}'(으)로 바꿀까요?`))return;
    setBusy(true);setErr("");
    try{await rpc("ol_add_box_spec",{p_admin_hash:adminHash,p_spec:spec,p_name:name.trim()});setName("");setW("");setD("");setH("");await onChanged();if(onPick)onPick(spec)}
    catch(e){setErr(errMsg(e))}
    setBusy(false);
  };
  const saveName=async b=>{
    setBusy(true);setErr("");
    try{await rpc("ol_add_box_spec",{p_admin_hash:adminHash,p_spec:b.spec,p_name:editName.trim()});setEditId(null);await onChanged()}
    catch(e){setErr(errMsg(e))}
    setBusy(false);
  };
  const del=async b=>{
    const used=masters.products.filter(p=>p.box_spec===b.spec).length;
    if(!confirm(`'${specLabel(b.spec,masters.box_specs)}' 규격을 삭제할까요?`+(used?`\n(이 규격을 쓰는 제품 ${used}개는 값이 유지됩니다)`:"")))return;
    try{await rpc("ol_delete_box_spec",{p_admin_hash:adminHash,p_id:b.id});await onChanged()}catch(e){setErr(errMsg(e))}
  };
  return <>
    <div style={{fontSize:17,fontWeight:700,marginBottom:14}}>📐 박스규격 관리</div>
    <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:6}}>
      <input className="ol-input" style={{width:150}} placeholder="규격명 (예: 1kg×8 박스)" value={name} onChange={e=>setName(e.target.value)}/>
      <input className="ol-input" style={{width:90}} type="number" placeholder="가로" value={w} onChange={e=>setW(e.target.value)}/>×
      <input className="ol-input" style={{width:90}} type="number" placeholder="세로" value={d} onChange={e=>setD(e.target.value)}/>×
      <input className="ol-input" style={{width:90}} type="number" placeholder="높이" value={h} onChange={e=>setH(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
      <button className="ol-btn ol-btn-primary ol-btn-sm" onClick={add} disabled={busy}>+ 추가</button>
    </div>
    <div style={{fontSize:11,color:"var(--muted)",marginBottom:12}}>규격명은 선택 · 치수 단위는 자유(mm 권장). 추가하면 드롭박스에 바로 나타납니다.</div>
    {err&&<div className="ol-err">{err}</div>}
    {masters.box_specs.length===0?<Empty emoji="📦" text="등록된 박스규격이 없습니다"/>:
    <div className="ol-scroll"><table className="ol-table"><thead><tr><th>규격명</th><th>가로×세로×높이</th><th className="right">사용 제품</th><th></th></tr></thead><tbody>
      {masters.box_specs.map(b=><tr key={b.id}>
        <td style={{fontWeight:600}}>{editId===b.id
          ?<input className="ol-input" style={{minWidth:130}} value={editName} autoFocus onChange={e=>setEditName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveName(b);if(e.key==="Escape")setEditId(null)}}/>
          :(b.name||"").trim()||<span style={{color:"var(--dimmer)",fontWeight:400}}>–</span>}</td>
        <td>{b.spec}</td>
        <td className="right">{masters.products.filter(p=>p.box_spec===b.spec).length}</td>
        <td className="right" style={{whiteSpace:"nowrap"}}>
          {editId===b.id?<>
            <button className="ol-btn ol-btn-primary ol-btn-sm" style={{marginRight:4}} onClick={()=>saveName(b)} disabled={busy}>저장</button>
            <button className="ol-btn ol-btn-secondary ol-btn-sm" onClick={()=>setEditId(null)}>취소</button>
          </>:<>
            {onPick&&<button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginRight:4}} onClick={()=>onPick(b.spec)}>선택</button>}
            <button className="ol-btn ol-btn-secondary ol-btn-sm" style={{marginRight:4}} onClick={()=>{setEditId(b.id);setEditName(b.name||"")}}>이름 수정</button>
            <button className="ol-btn ol-btn-danger ol-btn-sm" onClick={()=>del(b)}>삭제</button>
          </>}
        </td>
      </tr>)}
    </tbody></table></div>}
    <div style={{textAlign:"right",marginTop:14}}><button className="ol-btn ol-btn-secondary" onClick={onClose}>닫기</button></div>
  </>;
}

function MethodManager({adminHash,masters,onChanged,onClose}){
  const blank={id:null,name:"",kind:"single",max_boxes:40,cols:3,per_layer:6,mix_layers:"",memo:""};
  const defLayers=Math.max(1,Math.floor(palletCfg(masters.settings).mix_layers||6));
  const[form,setForm]=useState(blank);
  const[err,setErr]=useState("");const[busy,setBusy]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const save=async()=>{
    if(!form.name.trim()){setErr("이름을 입력하세요");return}
    setBusy(true);setErr("");
    try{
      const args={p_admin_hash:adminHash,p_id:form.id,p_name:form.name.trim(),p_kind:form.kind,
        p_max_boxes:parseInt(form.max_boxes,10)||40,p_cols:parseInt(form.cols,10)||3,p_memo:form.memo||"",p_per_layer:parseInt(form.per_layer,10)||6};
      const ml=form.kind==="mixed"?parseInt(form.mix_layers,10):NaN;
      try{await rpc("ol_upsert_method",{...args,p_mix_layers:ml>0?ml:null})}
      catch(e){
        // setup_orders_mixlayers.sql 실행 전이면 단수 없이 저장하고 안내
        if(!/function|PGRST202|schema cache/i.test(String(e?.message||e)))throw e;
        await rpc("ol_upsert_method",args);
        if(ml>0)alert("적재방식은 저장했지만 1자리 최대 단수는 저장되지 않았습니다.\nSupabase SQL Editor에서 setup_orders_mixlayers.sql 을 1회 실행해 주세요.");
      }
      setForm(blank);await onChanged();
    }catch(e){setErr(errMsg(e))}
    setBusy(false);
  };
  const del=async m=>{
    const used=masters.products.filter(p=>(p.method_ids||[]).map(Number).includes(Number(m.id))).length;
    if(!confirm(`'${m.name}' 적재방식을 삭제할까요?`+(used?`\n이 방식을 쓰는 제품 ${used}개에서도 해제됩니다.`:"")))return;
    try{await rpc("ol_delete_method",{p_admin_hash:adminHash,p_id:m.id});await onChanged()}catch(e){setErr(errMsg(e))}
  };
  return <>
    <div style={{fontSize:17,fontWeight:700,marginBottom:6}}>🧱 적재방식 관리</div>
    <div style={{fontSize:12,color:"var(--muted)",marginBottom:14,lineHeight:1.6}}>
      <b>단독</b>: 한 파렛트에 그 제품만. 적재량은 제품의 <b>박스규격</b>으로 자동 계산 (1층 박스 수 × 단수, ⚙ 파렛트 설정 기준). 꽉 찬 파렛트를 만들고 자투리는 따로 1파렛트.<br/>
      <b>혼적</b>: 자투리 박스를 다른 혼적 제품과 한 파렛트에 합침. 한 층에 <i>층당 방 수</i>(기본 6)만큼 자리가 있고, 자리마다 위로 <i>1자리 최대 단수</i>까지 쌓음 (박스가 높아 6단까지 못 쌓는 제품은 4단 등 별도 혼적 방식을 만들어 지정 · 비우면 ⚙ 파렛트 설정의 혼적 최대 단수). 단수가 다른 제품이 한 혼적 파렛트에 섞이면 가장 낮은 단수에 맞춤. 자투리가 6자리 이상 필요하면 혼적 대신 단독 1파렛트. 적재이미지는 자리별 쌓는 박스 수를 표로 표시 (6방·가로 3칸 = 2줄×3칸).<br/>
      제품에 단독+혼적을 같이 선택하면 → 꽉 찬 파렛트는 단독, 남는 박스만 혼적.
    </div>
    <div className="ol-card" style={{padding:12}}>
      <div className="ol-grid" style={{marginBottom:8}}>
        <div><div className="ol-label">이름</div><input className="ol-input" value={form.name} onChange={e=>set("name",e.target.value)} placeholder="예: 단독 40박스"/></div>

// 💰 판매가 (제품리스트 탭 안)
//  - 쿠팡/스마트스토어는 서버에서 페이지를 읽지 못하게 막혀 있어(403/429) 자동 수집 대신
//    ① 표에서 클릭 수정 ② 엑셀 가져오기/내보내기 ③ 상품 페이지에서 북마크 버튼으로 가져오기
// ═══════════════════════════════════════════
const HIST_FIELD={sale:"판매가",discount:"할인가",store:"스토어가",supply:"공급가"};
const HIST_SRC={manual:"직접 수정",import:"엑셀",capture:"페이지에서"};
function priceErr(e){
  const s=String(e?.message||e||"");
  if(s.includes("Could not find the function")||s.includes("PGRST202")||s.includes("ol_prices")||s.includes("ol_price"))return "Supabase에서 setup_orders_prices.sql을 먼저 실행하세요.";
  if(s.includes("name_required"))return "상품명은 필수입니다.";
  return errMsg(e);
}
function fmtWon(n){return n==null||n===""?"–":Number(n).toLocaleString("ko-KR")}
function storageLabel(s){return s==="frozen"?"냉동":"냉장"}
function priceSheetKey(p){return (p.vendor||"")+"|"+(p.storage==="frozen"?"frozen":"chilled")}
function priceSheetName(p){return `${p.vendor||"(업체 없음)"}(${storageLabel(p.storage)})`}
function daysAgo(ts){if(!ts)return null;return Math.round((parseYmd(todayYmd())-parseYmd(fmtYmd(new Date(ts))))/86400000)}
function isDiscounting(p){return p.discount_price!=null&&p.sale_price!=null&&Number(p.discount_price)<Number(p.sale_price)}
// 링크에서 상품 식별값 추출 (쿠팡 vendorItemId / itemId / productId, 스마트스토어 상품번호)
function priceUrlKeys(u){
  u=String(u||"");const g=re=>{const m=u.match(re);return m?m[1]:""};
  const store=/naver\.com/i.test(u);
  return {vid:g(/[?&]vendorItemId=(\d+)/),iid:g(/[?&]itemId=(\d+)/),pid:store?"":g(/\/products\/(\d+)/),sid:store?g(/\/products\/(\d+)/):""};
}
function matchCapture(items,url,site){
  const k=priceUrlKeys(url);
  if(site==="store")return k.sid?items.filter(p=>priceUrlKeys(p.store_url).sid===k.sid):[];
  for(const f of["vid","iid","pid"]){
    if(!k[f])continue;
    const m=items.filter(p=>priceUrlKeys(p.coupang_url)[f]===k[f]);
    if(m.length)return m;
  }
  return [];
}
function sortPriceItems(items){
  return [...items].sort((a,b)=>(a.vendor||"").localeCompare(b.vendor||"","ko")||(a.storage==="frozen")-(b.storage==="frozen")||(a.sort_order||0)-(b.sort_order||0)||a.id-b.id);
}

// 판매링크 엑셀 → 상품 행. 시트 이름 "업체(냉장)" / "업체(냉동)", 제목 행에서 칸 위치 자동 탐지
function parsePriceWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const rows=[],sheets=[];
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn];
    if(!ws||!ws["!ref"])continue;
    const rng=XLSX.utils.decode_range(ws["!ref"]);
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true,blankrows:true});
    let hr=-1;
    for(let i=0;i<Math.min(aoa.length,10);i++){if((aoa[i]||[]).some(c=>String(c).includes("상품명"))){hr=i;break}}
    if(hr<0)continue;
    const H=aoa[hr].map(c=>String(c).replace(/\s+/g," ").trim());
    const find=(fn,from=0)=>{for(let i=from;i<H.length;i++)if(fn(H[i],i))return i;return -1};
    const cName=find(h=>h.includes("상품명"));
    const cSku=find(h=>/SKU\s*ID/i.test(h));
    const cBar=find((h,i)=>i!==cName&&(/바코드/.test(h)||/^BARCODE$/i.test(h)));
    const cBox=find(h=>/box/i.test(h)&&h.includes("수량"));
    const cStoreUrl=find(h=>h.includes("스마트")&&h.includes("링크"));
    const cCpUrl=find(h=>h.includes("링크")&&!h.includes("스마트"));
    const cSupply=find(h=>h.includes("공급가"));
    const cSale=find((h,i)=>h==="판매가"&&(cStoreUrl<0||i<cStoreUrl));
    const cDisc=find(h=>h.includes("할인가"));
    const cStore=cStoreUrl>=0?find(h=>h==="판매가",cStoreUrl+1):-1;
    const m=sn.match(/^(.*?)\s*\((냉장|냉동)\)\s*$/);
    const vendor=(m?m[1]:sn).trim();
    const storage=/냉동/.test(sn)?"frozen":"chilled";
    const cellAt=(r,c)=>ws[XLSX.utils.encode_cell({r:r+rng.s.r,c:c+rng.s.c})];
    const link=(r,c)=>{
      if(c<0)return "";
      const v=String(aoa[r][c]??"").trim();
      if(/^https?:/i.test(v))return v;
      return cellAt(r,c)?.l?.Target||v;
    };
    const numAt=(row,c)=>{
      const v=row[c];
      if(v===""||v==null)return null;
      if(typeof v==="string"&&!/\d/.test(v))return null;
      return toNum(v);
    };
    const txt=v=>{const s=String(v??"").trim();return /^\d+\.0+$/.test(s)?s.replace(/\.0+$/,""):s};
    let n=0;
    for(let r=hr+1;r<aoa.length;r++){
      const row=aoa[r]||[];
      const name=String(row[cName]??"").trim();
      if(!name)continue;
      const o={vendor,storage,sort_order:++n,name,
        sku_id:cSku>=0?txt(row[cSku]):"",barcode:cBar>=0?txt(row[cBar]):"",
        coupang_url:link(r,cCpUrl),store_url:link(r,cStoreUrl)};
      if(cBox>=0)o.per_box=numAt(row,cBox);
      if(cSupply>=0)o.supply_price=numAt(row,cSupply);
      if(cSale>=0)o.sale_price=numAt(row,cSale);
      if(cDisc>=0)o.discount_price=numAt(row,cDisc);
      if(cStore>=0)o.store_price=numAt(row,cStore);
      rows.push(o);
    }
    if(n)sheets.push(`${sn} ${n}개`);
  }
  // 엑셀 안에서 SKU ID가 겹치는 행은 SKU로 찾지 않음 (서로 덮어쓰지 않게)
  const cnt={};for(const r of rows)if(r.sku_id)cnt[r.sku_id]=(cnt[r.sku_id]||0)+1;
  const dupSkus=Object.keys(cnt).filter(k=>cnt[k]>1);
  for(const r of rows)if(r.sku_id&&cnt[r.sku_id]>1)r.sku_dup=true;
  return {rows,sheets,dupSkus};
}

// 판매가 엑셀 내보내기 — 원래 판매링크 엑셀과 같은 칸 구성 (시트 = 업체(냉장/냉동))
function downloadPriceXlsx(items){
  const groups=new Map();
  for(const p of sortPriceItems(items)){const k=priceSheetKey(p);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)}
  const wb=XLSX.utils.book_new();
  const HDR=["No.","SKU ID","상품명/옵션/BARCODE","바코드","Box 내 SKU 수량","상품판매링크","공급가","판매가","현재 할인가","할인액","스마트 스토어 판매링크","판매가"];
  const bd={style:"thin",color:{rgb:"BFBFBF"}};
  const border={top:bd,bottom:bd,left:bd,right:bd};
  const used=new Set();
  for(const list of groups.values()){
    const aoa=[HDR];
    list.forEach((p,i)=>{
      const disc=p.discount_price!=null?Number(p.discount_price):(p.sale_price!=null?Number(p.sale_price):null);
      aoa.push([i+1,p.sku_id&&/^\d+$/.test(p.sku_id)?Number(p.sku_id):(p.sku_id||""),p.name,p.barcode&&/^\d{1,15}$/.test(p.barcode)?Number(p.barcode):(p.barcode||""),
        p.per_box!=null?Number(p.per_box):"",p.coupang_url||"",p.supply_price!=null?Number(p.supply_price):"",
        p.sale_price!=null?Number(p.sale_price):"",disc!=null?disc:"","",p.store_url||"",p.store_price!=null?Number(p.store_price):""]);
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    for(let r=0;r<aoa.length;r++)for(let c=0;c<HDR.length;c++){
      const a=XLSX.utils.encode_cell({r,c});
      if(!ws[a])ws[a]={t:"s",v:""};
      const cell=ws[a];
      if(r===0){cell.s={font:{bold:true,name:"맑은 고딕",sz:10},fill:{fgColor:{rgb:"F1F5F9"}},alignment:{horizontal:"center",vertical:"center",wrapText:true},border};continue}
      cell.s={font:{name:"맑은 고딕",sz:10},border,alignment:{vertical:"center",horizontal:c===2||c===5||c===10?"left":"center"}};
      if(c===1||c===3)cell.z="0";
      if([6,7,8,9,11].includes(c)&&cell.t==="n")cell.z="#,##0";
      if((c===5||c===10)&&/^https?:/i.test(String(cell.v))){cell.l={Target:String(cell.v)};cell.s.font={...cell.s.font,color:{rgb:"0563C1"},underline:true}}
    }
    for(let r=1;r<aoa.length;r++){
      if(aoa[r][7]===""||aoa[r][8]==="")continue;
      ws[XLSX.utils.encode_cell({r,c:9})]={t:"n",f:`I${r+1}-H${r+1}`,v:aoa[r][8]-aoa[r][7],z:"#,##0;[Red]-#,##0",s:{font:{name:"맑은 고딕",sz:10},border,alignment:{horizontal:"center",vertical:"center"}}};
    }
    ws["!cols"]=[{wch:5},{wch:11},{wch:52},{wch:15},{wch:8},{wch:40},{wch:9},{wch:9},{wch:10},{wch:9},{wch:40},{wch:9}];
    let name=priceSheetName(list[0]).replace(/[\[\]:*?\/\\]/g,"").slice(0,31)||"시트";
    let base=name,k=2;while(used.has(name))name=(base.slice(0,28)+"_"+(k++));
    used.add(name);
    XLSX.utils.book_append_sheet(wb,ws,name);
  }
  if(!wb.SheetNames.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([HDR]),"판매가");
  XLSX.writeFile(wb,`판매가_${todayYmd()}.xlsx`);
}

// 북마크 버튼 코드: 쿠팡/스마트스토어 상품 페이지에서 가격을 읽어 이 페이지(?pricecap=)를 작은 창으로 염
function priceBookmarklet(base){
  const code=`(function(){var h=location.hostname,u=location.href;
function pk(t){t=String(t||"");var m=t.match(/(\\d{1,3}(?:,\\d{3})+|\\d{3,})\\s*원/)||t.match(/\\d{1,3}(?:,\\d{3})+|\\d{4,}/);return m?Number(String(m[1]||m[0]).replace(/,/g,"")):null}
function q(ss){for(var i=0;i<ss.length;i++){var e=document.querySelector(ss[i]);if(e){var v=pk(e.textContent);if(v)return v}}return null}
var ld=null;document.querySelectorAll('script[type="application/ld+json"]').forEach(function(s){try{[].concat(JSON.parse(s.textContent)).forEach(function(o){var f=[].concat((o&&o.offers)||[])[0];if(f&&f.price&&ld==null)ld=Number(String(f.price).replace(/[^0-9.]/g,""))||null})}catch(e){}});
var site="",sale=null,orig=null,html=document.documentElement.innerHTML;
var disc=null;
if(/coupang\\.com/.test(h)){site="coupang";var sp=q([".price-container .sales-price-amount"]),fp=q([".price-container .final-price-amount"]);sale=sp!=null?sp:(fp!=null?fp:ld);disc=fp!=null?fp:sale;}
else if(/naver\\.com/.test(h)){site="store";var a=html.match(/"discountedSalePrice"\\s*:\\s*(\\d+)/),b=html.match(/"salePrice"\\s*:\\s*(\\d+)/);sale=(a&&Number(a[1]))||ld||(b&&Number(b[1]));orig=b?Number(b[1]):null;}
else{alert("쿠팡 또는 스마트스토어 상품 페이지에서 눌러 주세요");return}
var d={site:site,url:u,sale:sale,disc:disc,orig:orig,title:document.title.slice(0,120)};
var w=window.open(${JSON.stringify(base)}+"?pricecap="+encodeURIComponent(JSON.stringify(d)),"olpricecap","width=560,height=760");
if(!w)alert("팝업이 차단되었습니다. 이 사이트의 팝업을 허용해 주세요.")})()`;
  return "javascript:"+encodeURIComponent(code.replace(/\n/g,""));
}

function PriceCell({value,onSave,bold,color}){
  const[ed,setEd]=useState(false);const[v,setV]=useState("");
  const doneRef=useRef(false);
  const start=()=>{doneRef.current=false;setV(value==null?"":String(Number(value)));setEd(true)};
  const commit=async()=>{
    if(doneRef.current)return;doneRef.current=true;
    const s=v.replace(/[,\s원]/g,"");
    const n=s===""?null:Number(s);
    setEd(false);
    if(s!==""&&(!isFinite(n)||n<0))return;
    if(n===(value==null?null:Number(value)))return;
    await onSave(n);
  };
  if(ed)return <input autoFocus className="fz-qty-in" style={{width:92,fontSize:13}} inputMode="numeric" value={v}
    onChange={e=>setV(e.target.value)} onBlur={commit}
    onKeyDown={e=>{if(e.key==="Enter")commit();else if(e.key==="Escape"){doneRef.current=true;setEd(false)}}}/>;
  return <button className="fz-qty-btn" style={{fontWeight:bold?800:600,color:color||"inherit",fontVariantNumeric:"tabular-nums"}} onClick={start} title="클릭해서 수정">{fmtWon(value)}</button>;
}

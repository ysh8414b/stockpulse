// ═══════════════════════════════════════════
// 💰 매출 탭 — 매출일보(.xlsx) 업로드 + 주평균 안전재고
// ─ Excel 컬럼: A=매출일자, D=상품코드, E=상품명, H=수량(Box)
// ─ Supabase aps_sales_daily (1년 보유) 에 누적
// ─ 재고시트 제품코드와 매칭하여 주평균 안전재고/현재재고 비교
// ═══════════════════════════════════════════

// Excel 날짜 다양한 형태 → "YYYY-MM-DD" 정규화
function normalizeSalesDate(v){
  if(v==null||v==="")return null;
  // SheetJS cellDates:true → Date 객체
  if(v instanceof Date && !isNaN(v)){
    const y=v.getFullYear(), m=String(v.getMonth()+1).padStart(2,"0"), d=String(v.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }
  if(typeof v==="number"){
    // Excel serial date
    const d=new Date(Math.round((v-25569)*86400*1000));
    if(isNaN(d))return null;
    const y=d.getUTCFullYear(), mm=String(d.getUTCMonth()+1).padStart(2,"0"), dd=String(d.getUTCDate()).padStart(2,"0");
    return `${y}-${mm}-${dd}`;
  }
  const s=String(v).trim();
  // YYYY/MM/DD or YYYY-MM-DD or YYYY.MM.DD
  const m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m){
    const y=m[1], mm=m[2].padStart(2,"0"), dd=m[3].padStart(2,"0");
    return `${y}-${mm}-${dd}`;
  }
  return null;
}

// 매출일보 워크북 → {rows:[{date,code,name,qty}], headerRow, totalRows}
// A/D/E/H 컬럼만 추출, 합계행/머리글행 자동 스킵
function parseSalesWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  if(!ws)throw new Error("시트를 찾을 수 없습니다");
  const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const grouped={}; // key = `${date}|${code}` → {date,code,name,qty}
  let scanned=0, picked=0;
  for(let i=0;i<arr.length;i++){
    const r=arr[i]||[];
    const dateRaw=r[0];      // A
    const code=r[3];          // D
    const name=r[4];          // E
    const qtyRaw=r[7];        // H
    if(dateRaw==null||code==null||code==="")continue;
    const date=normalizeSalesDate(dateRaw);
    if(!date)continue;
    const codeStr=String(code).trim();
    if(!codeStr||/^[가-힣\s]+$/.test(codeStr))continue; // "합 계" 같은 한글-only 셀 제외
    const qty=Number(qtyRaw);
    if(isNaN(qty))continue;
    scanned++;
    const key=`${date}|${codeStr}`;
    if(!grouped[key]){
      grouped[key]={date,code:codeStr,name:String(name||"").trim(),qty:0};
      picked++;
    }
    grouped[key].qty+=qty;
  }
  return {rows:Object.values(grouped), scanned, picked};
}

const SALES_RANGE_OPTIONS=[
  {key:7,   label:"7일"},
  {key:14,  label:"14일"},
  {key:30,  label:"30일 (한달)"},
  {key:60,  label:"60일"},
  {key:90,  label:"90일"},
  {key:180, label:"180일"},
  {key:365, label:"1년"}
];

function fmtSalesNum(n,digits){
  if(n==null||isNaN(n))return "-";
  const d=digits==null?0:digits;
  return Number(n).toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
}

function SalesTab({adminHash}){
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState("");
  const[ok,setOk]=useState("");
  const[meta,setMeta]=useState(null);     // {total_rows, distinct_codes, min_date, max_date}
  const[stats,setStats]=useState([]);     // [{code,name,total_qty,avg_daily,avg_weekly,avg_monthly,...}]
  const[range,setRange]=useState(30);     // days
  const[query,setQuery]=useState("");
  const[matchedOnly,setMatchedOnly]=useState(false); // 재고시트 매칭만
  const[sortKey,setSortKey]=useState("avg");         // avg | code | shortage | stock
  const[inv,setInv]=useState(()=>loadStoredInventory());

  // 재고시트(localStorage) 변경 구독
  useEffect(()=>{
    const reload=()=>setInv(loadStoredInventory());
    const onStorage=(e)=>{if(!e.key||e.key===INVENTORY_DATA_KEY)reload()};
    window.addEventListener("storage",onStorage);
    window.addEventListener("aps-inv-data-change",reload);
    return()=>{
      window.removeEventListener("storage",onStorage);
      window.removeEventListener("aps-inv-data-change",reload);
    };
  },[]);

  // 재고시트 원격 fetch (다른 기기에서 업로드한 데이터)
  useEffect(()=>{
    if(!adminHash)return;
    let cancelled=false;
    (async()=>{
      const remote=await loadRemoteInventory(adminHash);
      if(cancelled||!remote)return;
      const local=loadStoredInventory();
      if(!local||!local.savedAt||(remote.savedAt && remote.savedAt>local.savedAt)){
        applyRemoteInventoryToLocal(remote);
        setInv(loadStoredInventory());
      }
    })();
    return()=>{cancelled=true};
  },[adminHash]);

  async function loadAll(){
    if(!adminHash)return;
    setBusy(true);setErr("");
    try{
      const [m, s] = await Promise.all([
        rpc("aps_get_sales_meta",{p_admin_hash:adminHash}),
        rpc("aps_get_sales_stats",{p_admin_hash:adminHash,p_days:range}),
      ]);
      setMeta(m||null);
      setStats(Array.isArray(s)?s:[]);
    }catch(e){setErr("로딩 실패: "+(e.message||e))}
    finally{setBusy(false)}
  }

  useEffect(()=>{loadAll()},[adminHash,range]);

  async function handleFile(e){
    const f=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!f)return;
    setErr("");setOk("");setBusy(true);
    try{
      if(typeof XLSX==="undefined")throw new Error("XLSX 라이브러리 로드 실패 — 새로고침 후 재시도");
      const buf=await f.arrayBuffer();
      const parsed=parseSalesWorkbook(buf);
      if(!parsed.rows.length)throw new Error("유효한 매출 데이터가 없습니다 (A=일자, D=코드, H=수량 컬럼 확인)");
      // 500행씩 배치 업로드
      const BATCH=500;
      let inserted=0, minD=null, maxD=null;
      for(let i=0;i<parsed.rows.length;i+=BATCH){
        const chunk=parsed.rows.slice(i,i+BATCH);
        const res=await rpc("aps_upsert_sales_batch",{p_admin_hash:adminHash,p_rows:chunk});
        inserted+=(res?.inserted||0);
        if(res?.min_date && (!minD||res.min_date<minD))minD=res.min_date;
        if(res?.max_date && (!maxD||res.max_date>maxD))maxD=res.max_date;
      }
      // 업로드 직후 매출 평균 → 안전재고 자동 동기화 (선택 기간 기준)
      let syncMsg="";
      try{
        const syncRes=await rpc("aps_sync_safety_from_sales",{p_admin_hash:adminHash,p_days:range});
        const u=syncRes?.updated||0, m=syncRes?.matched||0;
        if(m>0)syncMsg=` · 안전재고 ${u}/${m}건 자동 갱신`;
      }catch(syncErr){syncMsg=` · ⚠ 안전재고 동기화 실패(${syncErr.message||syncErr})`}
      setOk(`✓ ${parsed.rows.length}건 업로드 (${minD||"?"} ~ ${maxD||"?"})${syncMsg}`);
      await loadAll();
    }catch(ex){setErr("업로드 실패: "+(ex.message||ex))}
    finally{setBusy(false)}
  }

  async function handleSyncSafety(){
    if(!confirm(`매출 데이터가 있는 모든 품목의 안전재고를 주평균값(가장 최근 4 ISO 주 평균)으로 갱신합니다.\n\n사용자가 수동 설정한 안전재고 값은 덮어써집니다. 계속하시겠어요?`))return;
    setBusy(true);setErr("");setOk("");
    try{
      const res=await rpc("aps_sync_safety_from_sales",{p_admin_hash:adminHash,p_days:range});
      setOk(`✓ 안전재고 ${res?.updated||0}건 갱신 (매칭 ${res?.matched||0}건)`);
    }catch(e){setErr("동기화 실패: "+(e.message||e))}
    finally{setBusy(false)}
  }

  async function handleCleanup(){
    if(!confirm("365일 초과 데이터를 삭제합니다. 계속하시겠어요?"))return;
    setBusy(true);setErr("");setOk("");
    try{
      const res=await rpc("aps_cleanup_sales",{p_admin_hash:adminHash,p_days:365});
      setOk(`✓ ${res?.deleted||0}건 정리`);
      await loadAll();
    }catch(e){setErr("정리 실패: "+(e.message||e))}
    finally{setBusy(false)}
  }

  async function handleClearAll(){
    if(!confirm("⚠ 모든 매출 데이터를 삭제합니다. 정말로 초기화할까요?"))return;
    if(!confirm("⚠⚠ 이 작업은 되돌릴 수 없습니다. 한 번 더 확인합니다."))return;
    setBusy(true);setErr("");setOk("");
    try{
      const res=await rpc("aps_clear_sales",{p_admin_hash:adminHash});
      setOk(`✓ 전체 ${res?.deleted||0}건 삭제`);
      await loadAll();
    }catch(e){setErr("삭제 실패: "+(e.message||e))}
    finally{setBusy(false)}
  }

  // 재고시트 코드 → product 매핑 (current stock + 정식 한글명)
  const invMap=useMemo(()=>{
    const m={};
    (inv?.products||[]).forEach(p=>{m[p.code]=p});
    return m;
  },[inv]);

  // 표시용 데이터 가공
  const merged=useMemo(()=>{
    const q=query.trim().toLowerCase();
    const list=stats.map(s=>{
      const p=invMap[s.code];
      const displayName=(p && p.name) ? p.name : (s.name || "");
      const currentStock = p ? Number(p.box||0) : null;
      // 주평균 산출 — 최근 4 ISO 주(월~일) 단순 평균
      //  · 새 RPC: recent_week_count 반환 → server avg_weekly 그대로 신뢰
      //  · 옛 RPC: 폴백 — week_count 있으면 전체 평균, 없으면 first/last 범위 추정
      let avgWeekly;
      if (s.recent_week_count != null) {
        avgWeekly = Number(s.avg_weekly || 0);
      } else if (s.week_count != null && Number(s.week_count) > 0) {
        avgWeekly = Number(s.avg_weekly || 0);
      } else if (s.first_date && s.last_date && s.total_qty != null) {
        const spanDays = Math.max(1, Math.round((new Date(s.last_date) - new Date(s.first_date))/86400000) + 1);
        const weeks = Math.max(1, Math.ceil(spanDays / 7));
        avgWeekly = Number(s.total_qty) / weeks;
      } else {
        avgWeekly = Number(s.avg_weekly) || Number(s.avg_daily||0)*7;
      }
      const shortage = (currentStock!=null) ? (avgWeekly - currentStock) : null;
      const inInv = !!p;
      return {...s, avg_weekly: avgWeekly, displayName, currentStock, shortage, inInv};
    });
    let filtered=list;
    if(matchedOnly)filtered=filtered.filter(x=>x.inInv);
    if(q)filtered=filtered.filter(x=>
      (x.code||"").toLowerCase().includes(q)||
      (x.displayName||"").toLowerCase().includes(q)
    );
    filtered.sort((a,b)=>{
      if(sortKey==="code")return (a.code||"").localeCompare(b.code||"");
      if(sortKey==="stock")return (b.currentStock??-1)-(a.currentStock??-1);
      if(sortKey==="shortage"){
        const sa=a.shortage??-Infinity, sb=b.shortage??-Infinity;
        return sb-sa;
      }
      return (b.avg_weekly||0)-(a.avg_weekly||0);
    });
    return filtered;
  },[stats,invMap,matchedOnly,query,sortKey]);

  const summaryCounts=useMemo(()=>{
    let matched=0, shortageCount=0;
    merged.forEach(x=>{
      if(x.inInv)matched++;
      if(x.shortage!=null && x.shortage>0)shortageCount++;
    });
    return {matched, shortageCount, total:merged.length};
  },[merged]);

  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:10}}>
      <div>
        <div style={{fontSize:18,fontWeight:700}}>💰 매출일보 분석</div>
        <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>
          매출.xlsx 업로드 → 1년 누적 → <b>최근 4주 평균</b>을 안전재고로 자동 계산 (재고시트 연동)
        </div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <label className="aps-btn aps-btn-primary" style={{cursor:"pointer"}}>
          📂 매출 Excel 업로드
          <input type="file" accept=".xlsx,.xls" onChange={handleFile} style={{display:"none"}} disabled={busy}/>
        </label>
        <button className="aps-btn aps-btn-secondary" onClick={loadAll} disabled={busy}>새로고침</button>
      </div>
    </div>

    {/* 상태 메시지 */}
    {err&&<div style={{padding:"10px 14px",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:6,color:"#ef4444",fontSize:13,marginBottom:10}}>{err}</div>}
    {ok&&<div style={{padding:"10px 14px",background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:6,color:"#22c55e",fontSize:13,marginBottom:10}}>{ok}</div>}

    {/* DB 메타 카드 */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10,marginBottom:14}}>
      <div style={{padding:14,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>저장된 매출 행</div>
        <div style={{fontSize:22,fontWeight:800,marginTop:4}}>{fmtSalesNum(meta?.total_rows)}</div>
      </div>
      <div style={{padding:14,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>등록 상품 수</div>
        <div style={{fontSize:22,fontWeight:800,marginTop:4}}>{fmtSalesNum(meta?.distinct_codes)}</div>
      </div>
      <div style={{padding:14,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>보유 기간</div>
        <div style={{fontSize:14,fontWeight:700,marginTop:6}}>
          {meta?.min_date?`${meta.min_date} ~ ${meta.max_date}`:"-"}
        </div>
      </div>
      <div style={{padding:14,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>재고시트 매칭</div>
        <div style={{fontSize:22,fontWeight:800,marginTop:4,color:"#06b6d4"}}>{summaryCounts.matched}<span style={{fontSize:12,color:"var(--muted)",marginLeft:6,fontWeight:600}}>/ {summaryCounts.total}</span></div>
      </div>
    </div>

    {/* 필터 / 정렬 툴바 */}
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:10}}>
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <span style={{fontSize:12,color:"var(--muted)",fontWeight:600,marginRight:4}}>기간</span>
        {SALES_RANGE_OPTIONS.map(o=>
          <button key={o.key}
            className={"aps-btn aps-btn-sm "+(range===o.key?"aps-btn-primary":"aps-btn-secondary")}
            onClick={()=>setRange(o.key)} disabled={busy}>{o.label}</button>
        )}
      </div>
      <div style={{flex:1,minWidth:160,maxWidth:280}}>
        <input className="aps-input" placeholder="🔎 코드 또는 상품명" value={query} onChange={e=>setQuery(e.target.value)}/>
      </div>
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <span style={{fontSize:12,color:"var(--muted)",fontWeight:600,marginRight:4}}>정렬</span>
        <select className="aps-input" value={sortKey} onChange={e=>setSortKey(e.target.value)} style={{width:140}}>
          <option value="avg">주평균 ↓</option>
          <option value="shortage">부족량 ↓</option>
          <option value="stock">현재재고 ↓</option>
          <option value="code">코드순</option>
        </select>
      </div>
      <label style={{display:"flex",gap:6,alignItems:"center",fontSize:13,cursor:"pointer",color:"var(--text)"}}>
        <input type="checkbox" checked={matchedOnly} onChange={e=>setMatchedOnly(e.target.checked)}/>
        재고시트 매칭만
      </label>
      <div style={{flex:1}}/>
      <button className="aps-btn aps-btn-sm" style={{background:"rgba(6,182,212,0.15)",color:"#06b6d4",border:"1px solid rgba(6,182,212,0.4)",fontWeight:700}} onClick={handleSyncSafety} disabled={busy} title="가장 최근 4 ISO 주(월~일)의 평균을 품목 마스터의 안전재고로 일괄 갱신 — 시즌·추세 변동 빠르게 반영">💰 안전재고 동기화</button>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={handleCleanup} disabled={busy}>🗑 365일 정리</button>
      <button className="aps-btn aps-btn-sm" style={{background:"rgba(239,68,68,0.15)",color:"#ef4444",border:"1px solid rgba(239,68,68,0.3)"}} onClick={handleClearAll} disabled={busy}>⚠ 전체 초기화</button>
    </div>

    {/* 메인 테이블 */}
    {merged.length===0 ? <Empty emoji="💰" text={meta?.total_rows ? "조회 결과가 없습니다 (기간/필터 확인)" : "매출 데이터가 없습니다. 우측 상단에서 매출.xlsx 를 업로드하세요."}/> :
      <div style={{overflow:"auto"}}>
        <table className="aps-table">
          <thead><tr>
            <th style={{width:46}} className="center">#</th>
            <th style={{width:110}}>상품코드</th>
            <th>상품명</th>
            <th className="right hide-mobile" style={{width:90}}>{range}일 판매</th>
            <th className="right hide-mobile" style={{width:90}}>일평균</th>
            <th className="right" style={{width:130}}>주평균<br/><span style={{fontSize:10,fontWeight:500,color:"var(--muted)"}}>(최근 4주 · 안전재고 추천)</span></th>
            <th className="right" style={{width:100}}>현재재고<br/><span style={{fontSize:10,fontWeight:500,color:"var(--muted)"}}>(재고시트)</span></th>
            <th className="center" style={{width:90}}>상태</th>
          </tr></thead>
          <tbody>
            {merged.map((x,i)=>{
              const hasStock = x.currentStock != null;
              const avg = Number(x.avg_weekly||0);
              let statusEl;
              if(!hasStock){
                statusEl=<span style={{fontSize:11,color:"var(--muted)"}}>—</span>;
              }else if(avg<=0){
                statusEl=<span style={{fontSize:11,color:"var(--muted)"}}>판매없음</span>;
              }else if(x.currentStock<=0){
                statusEl=<span style={{fontSize:11,fontWeight:700,color:"#ef4444",background:"rgba(239,68,68,0.12)",padding:"3px 7px",borderRadius:4}}>품절</span>;
              }else if(x.currentStock<avg){
                statusEl=<span style={{fontSize:11,fontWeight:700,color:"#f59e0b",background:"rgba(245,158,11,0.12)",padding:"3px 7px",borderRadius:4}}>부족 {fmtSalesNum(Math.round(avg-x.currentStock))}</span>;
              }else{
                statusEl=<span style={{fontSize:11,fontWeight:700,color:"#22c55e",background:"rgba(34,197,94,0.12)",padding:"3px 7px",borderRadius:4}}>정상</span>;
              }
              return <tr key={x.code}>
                <td className="center" style={{color:"var(--muted)",fontSize:11}}>{i+1}</td>
                <td style={{fontFamily:"monospace",fontSize:12}}>{x.code}</td>
                <td>
                  <div style={{fontWeight:600}}>{x.displayName||<span style={{color:"var(--muted)"}}>(이름 없음)</span>}</div>
                  {x.inInv && <span style={{fontSize:10,color:"#06b6d4",fontWeight:600}}>📋 재고시트</span>}
                </td>
                <td className="right hide-mobile" style={{fontSize:12}}>{fmtSalesNum(Math.round(x.total_qty))}</td>
                <td className="right hide-mobile" style={{fontSize:12,color:"var(--muted)"}}>{fmtSalesNum(Math.round(x.avg_daily))}</td>
                <td className="right" style={{fontWeight:700,fontSize:13,color:"#06b6d4"}}>{fmtSalesNum(Math.round(avg))}</td>
                <td className="right" style={{fontSize:12}}>{hasStock?fmtSalesNum(Math.round(x.currentStock)):<span style={{color:"var(--muted)"}}>—</span>}</td>
                <td className="center">{statusEl}</td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    }

    <div style={{marginTop:14,padding:"10px 14px",background:"var(--card-bg)",borderRadius:6,fontSize:11,color:"var(--muted)",lineHeight:1.6}}>
      <div><strong>💡 사용법</strong></div>
      <div>1. 매출.xlsx 업로드 → A(매출일자) / D(상품코드) / E(상품명) / H(수량Box) 컬럼 자동 인식</div>
      <div>2. 같은 (날짜+상품)이 여러 행이면 자동 합산. 같은 날짜 재업로드 시 덮어쓰기 (idempotent)</div>
      <div>3. <b>주평균</b> = <b>가장 최근 4 ISO 주(월~일)의 단순 평균</b> = 한 주에 평균 몇 박스 나갔는지 (권장 안전재고)</div>
      <div style={{paddingLeft:14,color:"var(--muted)"}}>· 기간 필터(7/14/30...)는 합계·일수 표시용. 평균은 항상 <b>최근 4주 고정</b> — 시즌·추세 변동을 빠르게 반영</div>
      <div style={{paddingLeft:14,color:"var(--muted)"}}>· 예: 최근 4주 [100, 120, 110, 130] → 주평균 (100+120+110+130)/4 = 115</div>
      <div style={{paddingLeft:14,color:"var(--muted)"}}>· 데이터가 4주 미만이면 있는 만큼만 평균 (예: 2주만 있으면 2주 평균)</div>
      <div style={{paddingLeft:14,color:"var(--muted)"}}>· 한 주 안에 휴무·결근으로 일부 날짜만 있어도 그 주는 한 주로 카운트</div>
      <div>4. <b>현재재고</b>는 📋 재고 시트 탭에서 업로드한 박스 수와 자동 연동</div>
      <div>5. 매출 업로드 시 <b>📦 품목/BOM 탭의 안전재고</b>도 최근 4주 평균값으로 자동 갱신 (수동 트리거: 💰 안전재고 동기화 버튼)</div>
      <div>6. 1년 초과 데이터는 🗑 365일 정리 버튼으로 일괄 삭제</div>
    </div>
  </div>;
}

// ═══════════════════════════════════════════
// 인원 관리 탭 (Staff)
// ─ 직원 마스터 + 일일 가용 그리드 + PNG 저장
// ═══════════════════════════════════════════
const STAFF_TITLE_KEY="aps-staff-title";
function loadStaffTitle(){
  try{return localStorage.getItem(STAFF_TITLE_KEY)||"생산 가용 인원 및 생산 계획"}catch(e){return"생산 가용 인원 및 생산 계획"}
}
function saveStaffTitle(v){
  try{localStorage.setItem(STAFF_TITLE_KEY,v||"")}catch(e){}
}

function StaffForm({adminHash,initial,deptOptions,onSaved,onCancel}){
  const isEdit=!!initial;
  const[department,setDepartment]=useState(initial?.department||"");
  const[name,setName]=useState(initial?.name||"");
  const[role,setRole]=useState(initial?.role||"");
  const[memo,setMemo]=useState(initial?.memo||"");
  const[active,setActive]=useState(initial?initial.active!==false:true);
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!name.trim()){setErr("이름을 입력하세요");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_upsert_staff",{
        p_admin_hash:adminHash,
        p_id:isEdit?initial.id:null,
        p_department:department.trim(),
        p_name:name.trim(),
        p_role:role.trim(),
        p_memo:memo.trim(),
        p_active:active
      });
      onSaved();
    }catch(e){
      setErr(errMsg(e,{name_required:"이름은 필수입니다",unauthorized:"인증 실패"}));
    }
    setLoading(false);
  };

  return <div className="aps-modal-bg" onClick={onCancel}>
    <div className="aps-modal" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"14px"}}>{isEdit?"👥 직원 수정":"👥 직원 추가"}</div>
      <div className="aps-form-grid">
        <div>
          <div className="aps-form-label">부서</div>
          <input className="aps-input" list="staff-dept-list" value={department} onChange={e=>setDepartment(e.target.value)} maxLength={30} placeholder="예: 톱, 외포장, 생산실"/>
          <datalist id="staff-dept-list">
            {(deptOptions||[]).map(d=><option key={d} value={d}/>)}
          </datalist>
        </div>
        <div>
          <div className="aps-form-label">이름 *</div>
          <input className="aps-input" value={name} onChange={e=>setName(e.target.value)} maxLength={30} placeholder="홍길동" autoFocus/>
        </div>
        <div>
          <div className="aps-form-label">역할</div>
          <input className="aps-input" value={role} onChange={e=>setRole(e.target.value)} maxLength={30} placeholder="예: 조장, 라인장"/>
        </div>
        <div>
          <div className="aps-form-label">활성</div>
          <label style={{display:"flex",alignItems:"center",gap:8,padding:"9px 0"}}>
            <input type="checkbox" checked={active} onChange={e=>setActive(e.target.checked)} style={{width:16,height:16,cursor:"pointer"}}/>
            <span style={{fontSize:13,color:"var(--text)"}}>재직 중 (체크 해제 시 명단에서 숨김)</span>
          </label>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">메모</div>
          <textarea className="aps-input" value={memo} onChange={e=>setMemo(e.target.value)} maxLength={300} rows={2} style={{resize:"vertical"}}/>
        </div>
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"저장 중...":(isEdit?"수정":"추가")}</button>
      </div>
    </div>
  </div>;
}

// PNG 저장용 오프스크린 뷰 (사진과 동일 레이아웃, 라이트 톤 고정)
function ExportStaffView({title,dateStr,deptGroups,offIds,totalAvail,hideHeader=false}){
  const C={bg:"#ffffff",text:"#111827",hdr:"#111827",hdrFg:"#ffffff",border:"#111827",mutedBg:"#f8fafc",muted:"#6b7280"};
  const fmtDate=(s)=>{
    if(!s)return"";
    const[y,m,d]=s.split("-").map(Number);
    if(!y||!m||!d)return s;
    const dt=new Date(Date.UTC(y,m-1,d));
    const dow=DOW_LABEL[(dt.getUTCDay()+6)%7];
    return `${String(m).padStart(2,"0")}/${String(d).padStart(2,"0")} (${dow})`;
  };
  return <div style={{background:C.bg,color:C.text,fontFamily:"Pretendard, -apple-system, system-ui, sans-serif",padding:"20px 22px 16px",width:880,boxSizing:"border-box"}}>
    {!hideHeader&&<div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:14}}>
      <div style={{fontSize:22,fontWeight:800,letterSpacing:"-.01em"}}>{title||"생산 가용 인원 및 생산 계획"}</div>
      <div style={{fontSize:16,fontWeight:700,color:C.text}}>{fmtDate(dateStr)}</div>
    </div>}
    <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(deptGroups.length||1,7)}, 1fr)`,gap:0,border:`1.5px solid ${C.border}`,borderRadius:0,overflow:"hidden"}}>
      {deptGroups.map((g,gi)=>{
        const availCnt=g.staff.filter(s=>!offIds.has(s.id)).length;
        return <div key={g.dept||gi} style={{borderRight:gi<deptGroups.length-1?`1.5px solid ${C.border}`:"none",display:"flex",flexDirection:"column",background:C.bg}}>
          <div style={{background:C.hdr,color:C.hdrFg,fontSize:13,fontWeight:800,textAlign:"center",padding:"7px 6px",letterSpacing:".02em",borderBottom:`1.5px solid ${C.border}`}}>{g.dept||"미지정"}</div>
          <div style={{flex:1,padding:"8px 8px",display:"flex",flexDirection:"column",gap:3,minHeight:140}}>
            {g.staff.length===0?
              <div style={{textAlign:"center",color:C.muted,fontSize:11,padding:"10px 0"}}>—</div>:
              g.staff.map(s=>{
                const off=offIds.has(s.id);
                return <div key={s.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:off?C.muted:C.text,textDecoration:off?"line-through":"none"}}>
                  <span style={{display:"inline-block",width:13,height:13,border:`1.5px solid ${off?C.muted:C.border}`,background:off?C.bg:C.hdr,boxSizing:"border-box",flexShrink:0,position:"relative"}}>
                    {!off&&<span style={{position:"absolute",left:1,top:-3,color:"#ffffff",fontSize:14,fontWeight:900,lineHeight:1}}>✓</span>}
                  </span>
                  <span style={{fontWeight:600}}>{s.name}</span>
                </div>;
              })
            }
          </div>
          <div style={{borderTop:`1.5px solid ${C.border}`,textAlign:"center",fontSize:12,fontWeight:700,padding:"5px 6px",color:C.text,background:C.mutedBg}}>{availCnt} 명</div>
        </div>;
      })}
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8,fontSize:11,color:C.muted}}>
      <span style={{fontWeight:700,letterSpacing:".06em"}}>STOCKPULSE · APS</span>
      <span style={{fontSize:14,fontWeight:800,color:C.text}}>총 인원: <span style={{color:"#06b6d4"}}>{totalAvail}</span> 명</span>
    </div>
  </div>;
}

// 인원 + 생산계획 통합 export (오프스크린) — 생산계획 위, 인원 아래 (헤더 숨김)
function ExportCombinedView({title,dateStr,deptGroups,offIds,totalAvail,plans,lines,matsByPlan}){
  return <div style={{background:"#ffffff",fontFamily:"Pretendard, -apple-system, system-ui, sans-serif",width:880,boxSizing:"border-box"}}>
    <ExportPlansView plans={plans} lines={lines} dayStr={dateStr} allDates={false} matsByPlan={matsByPlan||{}} width={880}/>
    <div style={{borderTop:"2px dashed #111827",margin:"4px 22px 6px"}}></div>
    <ExportStaffView title={title} dateStr={dateStr} deptGroups={deptGroups} offIds={offIds} totalAvail={totalAvail} hideHeader={true}/>
  </div>;
}

function StaffTab({adminHash}){
  const[staff,setStaff]=useState([]);
  const[offIds,setOffIds]=useState(new Set()); // 휴무자 staff_id Set
  const[dateStr,setDateStr]=useState(todayStr());
  const[mode,setMode]=useState("daily");        // daily | master
  const[loading,setLoading]=useState(true);
  const[editing,setEditing]=useState(null);
  const[showForm,setShowForm]=useState(false);
  const[title,setTitle]=useState(loadStaffTitle());
  const[capturing,setCapturing]=useState(false);
  const exportRef=useRef(null);
  // 인원+생산계획 통합 이미지 저장용 (오프스크린)
  const[combinedCapturing,setCombinedCapturing]=useState(false);
  const[combinedPlans,setCombinedPlans]=useState(null);
  const[combinedLines,setCombinedLines]=useState([]);
  const[combinedMats,setCombinedMats]=useState({});
  const combinedExportRef=useRef(null);

  const loadStaff=useCallback(async()=>{
    try{
      const data=await rpc("aps_list_staff",{p_admin_hash:adminHash,p_only_active:false});
      setStaff(data||[]);
    }catch(e){console.error(e)}
  },[adminHash]);

  const loadAttendance=useCallback(async(d)=>{
    try{
      const data=await rpc("aps_get_attendance",{p_admin_hash:adminHash,p_date:d});
      setOffIds(new Set((data||[]).map(r=>r.staff_id)));
    }catch(e){console.error(e);setOffIds(new Set())}
  },[adminHash]);

  useEffect(()=>{
    (async()=>{setLoading(true);await Promise.all([loadStaff(),loadAttendance(dateStr)]);setLoading(false)})();
  },[loadStaff]);

  useEffect(()=>{loadAttendance(dateStr)},[dateStr,loadAttendance]);

  useEffect(()=>{saveStaffTitle(title)},[title]);

  const toggleAtt=async(s)=>{
    const wasOff=offIds.has(s.id);
    const next=new Set(offIds);
    if(wasOff)next.delete(s.id); else next.add(s.id);
    setOffIds(next); // 낙관적
    try{
      await rpc("aps_set_attendance",{
        p_admin_hash:adminHash,
        p_date:dateStr,
        p_staff_id:s.id,
        p_status:wasOff?"work":"off",
        p_memo:""
      });
    }catch(e){
      setOffIds(offIds); // 롤백
      alert("저장 실패: "+e.message);
    }
  };

  const delStaff=async(s)=>{
    if(!confirm(`직원 "${s.name}" 을(를) 삭제하시겠습니까?\n관련 휴무 기록도 함께 삭제됩니다.`))return;
    try{
      await rpc("aps_delete_staff",{p_admin_hash:adminHash,p_id:s.id});
      await loadStaff();
      await loadAttendance(dateStr);
    }catch(e){alert("삭제 실패: "+errMsg(e,{unauthorized:"인증 실패"}))}
  };

  const moveStaff=async(s,direction)=>{
    try{
      await rpc("aps_move_staff_order",{p_admin_hash:adminHash,p_id:s.id,p_direction:direction});
      await loadStaff();
    }catch(e){alert("순서 변경 실패: "+e.message)}
  };

  // 부서별 그룹핑 (활성 직원만 + 부서 첫 등장 순)
  const deptGroups=useMemo(()=>{
    const order=[];
    const map=new Map();
    staff.forEach(s=>{
      if(!s.active)return;
      const k=s.department||"";
      if(!map.has(k)){map.set(k,[]);order.push(k)}
      map.get(k).push(s);
    });
    return order.map(d=>({dept:d,staff:map.get(d)||[]}));
  },[staff]);

  // 마스터 모드용 — 비활성 포함 전체
  const allDeptGroups=useMemo(()=>{
    const order=[];
    const map=new Map();
    staff.forEach(s=>{
      const k=s.department||"";
      if(!map.has(k)){map.set(k,[]);order.push(k)}
      map.get(k).push(s);
    });
    return order.map(d=>({dept:d,staff:map.get(d)||[]}));
  },[staff]);

  const deptOptions=useMemo(()=>Array.from(new Set(staff.map(s=>s.department).filter(Boolean))),[staff]);

  const totalActive=deptGroups.reduce((sum,g)=>sum+g.staff.length,0);
  const totalAvail=deptGroups.reduce((sum,g)=>sum+g.staff.filter(s=>!offIds.has(s.id)).length,0);
  const totalOff=totalActive-totalAvail;

  const shiftDay=(n)=>{
    const[y,m,d]=dateStr.split("-").map(Number);
    const dt=new Date(Date.UTC(y,m-1,d));
    dt.setUTCDate(dt.getUTCDate()+n);
    setDateStr(dt.toISOString().slice(0,10));
  };

  const exportPng=async()=>{
    if(typeof window.html2canvas!=="function"){
      alert("이미지 저장 라이브러리(html2canvas)가 로드되지 않았습니다.");return;
    }
    setCapturing(true);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const target=exportRef.current;
    if(!target){setCapturing(false);alert("캡처할 영역이 없습니다");return}
    try{
      const canvas=await window.html2canvas(target,{backgroundColor:"#ffffff",scale:2,logging:false,useCORS:true});
      const link=document.createElement("a");
      link.download=`가용인원_${dateStr}.png`;
      link.href=canvas.toDataURL("image/png");
      document.body.appendChild(link);link.click();document.body.removeChild(link);
    }catch(e){console.error(e);alert("이미지 저장 실패: "+(e.message||e))}
    setCapturing(false);
  };

  // 인원 + 같은날짜 생산계획을 한 이미지로 저장
  const exportCombined=async()=>{
    if(typeof window.html2canvas!=="function"){
      alert("이미지 저장 라이브러리(html2canvas)가 로드되지 않았습니다.");return;
    }
    setCombinedCapturing(true);
    let dayPlans=[];
    let itemsD=[];
    try{
      // 1) 계획 + 라인 + 품목 fetch → dateStr과 겹치는 계획만 추림 (KST 00:00 ~ 24:00)
      const[plD,lnD,itD]=await Promise.all([
        rpc("aps_list_plans",{p_admin_hash:adminHash,p_status:null}),
        rpc("aps_list_lines",{p_admin_hash:adminHash}),
        rpc("aps_list_items",{p_admin_hash:adminHash})
      ]);
      const dayStartMs=new Date(dateStr+"T00:00:00+09:00").getTime();
      const dayEndMs=dayStartMs+24*3600*1000;
      dayPlans=(plD||[]).filter(p=>{
        if(!p.start_at||!p.end_at)return false;
        const s=new Date(p.start_at).getTime();
        const e=new Date(p.end_at).getTime();
        return s<dayEndMs && e>dayStartMs;
      });
      itemsD=itD||[];
      setCombinedPlans(dayPlans);
      setCombinedLines(lnD||[]);
    }catch(e){
      console.error(e);
      alert("계획 데이터를 불러오지 못했습니다: "+(e.message||e));
      setCombinedCapturing(false);
      return;
    }
    // 2) 재고시트(원육) — 로컬 우선, 원격이 더 최신이면 그것으로 교체
    let invForExport=loadStoredInventory();
    try{
      const remote=await loadRemoteInventory(adminHash);
      if(remote&&_invRemoteIsNewer(invForExport,remote))invForExport=remote;
    }catch(e){console.warn("[export combined] remote inv fetch fail",e)}
    // 3) 원자재 요약 계산
    try{
      const mats=await buildExportMaterialsFor(adminHash,dayPlans,itemsD,invForExport);
      setCombinedMats(mats);
    }catch(e){
      console.warn("[export combined mat] build failed",e);
      setCombinedMats({});
    }
    // 4) 오프스크린 렌더 대기 후 캡처
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const target=combinedExportRef.current;
    if(!target){setCombinedCapturing(false);setCombinedPlans(null);setCombinedMats({});alert("캡처할 영역이 없습니다");return}
    try{
      const canvas=await window.html2canvas(target,{backgroundColor:"#ffffff",scale:2,logging:false,useCORS:true});
      const link=document.createElement("a");
      link.download=`가용인원_생산계획_${dateStr}.png`;
      link.href=canvas.toDataURL("image/png");
      document.body.appendChild(link);link.click();document.body.removeChild(link);
    }catch(e){console.error(e);alert("이미지 저장 실패: "+(e.message||e))}
    setCombinedCapturing(false);
    setCombinedPlans(null);
    setCombinedMats({});
  };

  if(loading)return <Loader/>;

  return <div>
    <div className="aps-toolbar">
      <div className="aps-view-toggle">
        <button className={mode==="daily"?"on":""} onClick={()=>setMode("daily")}>📋 일일 가용</button>
        <button className={mode==="master"?"on":""} onClick={()=>setMode("master")}>👥 직원 마스터</button>
      </div>
      <div style={{flex:1}}></div>
      {mode==="master"&&<button className="aps-btn aps-btn-primary" onClick={()=>{setEditing(null);setShowForm(true)}}>+ 직원 추가</button>}
    </div>

    {mode==="daily"?
      <>
        <div className="aps-staff-head">
          <input
            className="aps-input"
            value={title}
            onChange={e=>setTitle(e.target.value)}
            maxLength={50}
            placeholder="제목 (예: 4층 생산 가용 인원 및 생산 계획)"
            style={{flex:"1 1 220px",minWidth:200,maxWidth:420,fontSize:15,fontWeight:700}}/>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>shiftDay(-1)}>← 이전</button>
            <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>setDateStr(todayStr())}>오늘</button>
            <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>shiftDay(1)}>다음 →</button>
            <input type="date" value={dateStr} onChange={e=>setDateStr(e.target.value)}/>
          </div>
          <div className="date">{dateStr}</div>
          <button
            className="aps-btn aps-btn-primary aps-btn-sm"
            onClick={exportPng}
            disabled={capturing||totalActive===0}
            title="현재 가용 인원을 이미지로 저장">
            {capturing?"저장 중...":"📷 이미지 저장"}
          </button>
          <button
            className="aps-btn aps-btn-secondary aps-btn-sm"
            onClick={exportCombined}
            disabled={combinedCapturing||totalActive===0}
            title={`선택된 날짜(${dateStr})의 가용 인원 + 생산계획을 하나의 이미지로 저장`}>
            {combinedCapturing?"저장 중...":"📷 인원+계획"}
          </button>
        </div>

        {deptGroups.length===0?
          <Empty emoji="👥" text='등록된 직원이 없습니다. "직원 마스터" 탭에서 추가하세요.'/>:
          <>
            <div className="aps-staff-grid">
              {deptGroups.map(g=>{
                const availCnt=g.staff.filter(s=>!offIds.has(s.id)).length;
                return <div key={g.dept||"none"} className="aps-staff-card">
                  <div className="aps-staff-card-hdr">{g.dept||"미지정"}</div>
                  <div className="aps-staff-card-body">
                    {g.staff.length===0?
                      <div className="aps-staff-empty">—</div>:
                      g.staff.map(s=>{
                        const off=offIds.has(s.id);
                        return <label key={s.id} className={"aps-staff-row"+(off?" off":"")}>
                          <input type="checkbox" checked={!off} onChange={()=>toggleAtt(s)} title={off?"출근으로 변경":"휴무로 변경"}/>
                          <span className="nm" title={s.role?s.name+" ("+s.role+")":s.name}>{s.name}</span>
                          {s.role&&<span className="role-mini">{s.role}</span>}
                        </label>;
                      })
                    }
                  </div>
                  <div className="aps-staff-card-ftr">{availCnt} 명</div>
                </div>;
              })}
            </div>
            <div className="aps-staff-summary">
              <span className="small">📋 체크: 출근 / 미체크: 휴무 — 클릭하여 토글</span>
              <div style={{flex:1}}></div>
              {totalOff>0&&<span className="small" style={{color:"#f59e0b"}}>휴무 {totalOff}명</span>}
              <span className="lbl">총 인원</span>
              <span className="num">{totalAvail}</span>
              <span className="small">/ {totalActive}명</span>
            </div>
          </>
        }

        {/* 오프스크린 PNG 캡처 영역 */}
        {capturing&&<div style={{position:"fixed",left:-99999,top:0,zIndex:-1,pointerEvents:"none"}}>
          <div ref={exportRef}>
            <ExportStaffView title={title} dateStr={dateStr} deptGroups={deptGroups} offIds={offIds} totalAvail={totalAvail}/>
          </div>
        </div>}
        {/* 오프스크린: 인원 + 생산계획 통합 캡처 영역 */}
        {combinedCapturing&&combinedPlans!==null&&<div style={{position:"fixed",left:-99999,top:0,zIndex:-1,pointerEvents:"none"}}>
          <div ref={combinedExportRef}>
            <ExportCombinedView title={title} dateStr={dateStr} deptGroups={deptGroups} offIds={offIds} totalAvail={totalAvail} plans={combinedPlans} lines={combinedLines} matsByPlan={combinedMats}/>
          </div>
        </div>}
      </>
      :
      <>
        {allDeptGroups.length===0?
          <Empty emoji="👥" text="등록된 직원이 없습니다. 우측 상단에서 추가하세요."/>:
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {allDeptGroups.map(g=>(
              <div key={g.dept||"none"} style={{border:"1px solid var(--div2)",borderRadius:8,overflow:"hidden"}}>
                <div style={{padding:"8px 14px",background:"var(--card-bg)",borderBottom:"1px solid var(--div2)",fontSize:13,fontWeight:700,display:"flex",alignItems:"center",gap:8}}>
                  🏷 {g.dept||"미지정"}
                  <span style={{fontSize:11,color:"var(--muted)",fontWeight:500}}>{g.staff.length}명</span>
                </div>
                <table className="aps-table">
                  <thead><tr>
                    <th style={{width:70}}>순서</th>
                    <th>이름</th>
                    <th className="hide-mobile">역할</th>
                    <th className="hide-mobile">메모</th>
                    <th style={{width:60}}>활성</th>
                    <th className="center" style={{width:140}}>작업</th>
                  </tr></thead>
                  <tbody>
                    {g.staff.map((s,idx)=>{
                      const isFirst=idx===0;
                      const isLast=idx===g.staff.length-1;
                      return <tr key={s.id}>
                        <td>
                          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
                            <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>moveStaff(s,"up")} disabled={isFirst} style={{padding:"1px 6px",opacity:isFirst?0.3:1,minWidth:0}}>▲</button>
                            <span style={{fontSize:10,color:"var(--dimmer)"}}>#{s.id}</span>
                            <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>moveStaff(s,"down")} disabled={isLast} style={{padding:"1px 6px",opacity:isLast?0.3:1,minWidth:0}}>▼</button>
                          </div>
                        </td>
                        <td style={{fontWeight:600}}>{s.name}</td>
                        <td className="hide-mobile" style={{color:"var(--text-sub)",fontSize:12}}>{s.role||"-"}</td>
                        <td className="hide-mobile" style={{color:"var(--muted)",fontSize:12}}>{s.memo||"-"}</td>
                        <td>
                          {s.active?
                            <span className="aps-pill" style={{background:"rgba(34,197,94,0.14)",color:"#22c55e"}}>활성</span>:
                            <span className="aps-pill" style={{background:"rgba(148,163,184,0.18)",color:"#94a3b8"}}>비활성</span>}
                        </td>
                        <td className="center">
                          <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                            <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>{setEditing(s);setShowForm(true)}}>수정</button>
                            <button className="aps-btn aps-btn-danger aps-btn-sm" onClick={()=>delStaff(s)}>삭제</button>
                          </div>
                        </td>
                      </tr>;
                    })}
                  </tbody>
                </table>
              </div>
            ))}
          </div>
        }
      </>
    }

    {showForm&&<StaffForm
      adminHash={adminHash}
      initial={editing}
      deptOptions={deptOptions}
      onCancel={()=>setShowForm(false)}
      onSaved={async()=>{setShowForm(false);await loadStaff();await loadAttendance(dateStr)}}/>}
  </div>;
}

// 회의록 (Meetings)
// ═══════════════════════════════════════════
const MTG_KINDS=[
  {key:"agenda",  label:"안건",     icon:"📋", cls:"mtg-kind-agenda"},
  {key:"decision",label:"결정사항", icon:"✅", cls:"mtg-kind-decision"},
  {key:"action",  label:"액션아이템",icon:"🚀", cls:"mtg-kind-action"},
];
function fmtMtgWhen(iso){
  if(!iso)return"";
  const d=new Date(iso);
  if(isNaN(d.getTime()))return"";
  const kst=new Date(d.getTime()+KST_OFFSET_MS);
  const y=kst.getUTCFullYear();
  const m=String(kst.getUTCMonth()+1).padStart(2,"0");
  const da=String(kst.getUTCDate()).padStart(2,"0");
  const dow=DOW_LABEL[(kst.getUTCDay()+6)%7];
  const h=String(kst.getUTCHours()).padStart(2,"0");
  const mi=String(kst.getUTCMinutes()).padStart(2,"0");
  return `${y}-${m}-${da} (${dow}) ${h}:${mi}`;
}
function fmtMtgWhenShort(iso){
  if(!iso)return"";
  const d=new Date(iso);
  if(isNaN(d.getTime()))return"";
  const kst=new Date(d.getTime()+KST_OFFSET_MS);
  const m=String(kst.getUTCMonth()+1).padStart(2,"0");
  const da=String(kst.getUTCDate()).padStart(2,"0");
  const dow=DOW_LABEL[(kst.getUTCDay()+6)%7];
  const h=String(kst.getUTCHours()).padStart(2,"0");
  const mi=String(kst.getUTCMinutes()).padStart(2,"0");
  return `${m}/${da}(${dow}) ${h}:${mi}`;
}

function MeetingForm({adminHash,initial,onCancel,onSaved}){
  const isEdit=!!initial;
  const nowInput=(()=>{const d=new Date();const kst=new Date(d.getTime()+KST_OFFSET_MS);return kst.toISOString().slice(0,16)})();
  const[title,setTitle]=useState(initial?.title||"");
  const[when,setWhen]=useState(initial?isoToKstInput(initial.meeting_at):nowInput);
  const[attendees,setAttendees]=useState(initial?.attendees||"");
  const[author,setAuthor]=useState(initial?.author||"");
  const[memo,setMemo]=useState(initial?.memo||"");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!title.trim()){setErr("제목을 입력하세요");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_upsert_meeting",{
        p_admin_hash:adminHash,
        p_id:isEdit?initial.id:null,
        p_meeting_at:kstInputToIso(when),
        p_title:title.trim(),
        p_attendees:attendees.trim(),
        p_author:author.trim(),
        p_memo:memo.trim()
      });
      onSaved();
    }catch(e){
      setErr(errMsg(e,{title_required:"제목은 필수입니다",unauthorized:"인증 실패"}));
    }
    setLoading(false);
  };

  return <div className="aps-modal-bg" onClick={onCancel}>
    <div className="aps-modal" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"14px"}}>{isEdit?"📝 회의록 수정":"📝 새 회의록"}</div>
      <div className="aps-form-grid">
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">제목 *</div>
          <input className="aps-input" value={title} onChange={e=>setTitle(e.target.value)} maxLength={200} placeholder="예: 6월 생산 주간회의" autoFocus/>
        </div>
        <div>
          <div className="aps-form-label">일시</div>
          <input className="aps-input" type="datetime-local" value={when} onChange={e=>setWhen(e.target.value)}/>
        </div>
        <div>
          <div className="aps-form-label">작성자</div>
          <input className="aps-input" value={author} onChange={e=>setAuthor(e.target.value)} maxLength={40} placeholder="예: 홍길동"/>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">참석자 <span style={{fontWeight:400,color:"var(--dimmer)"}}>(쉼표·줄바꿈으로 구분)</span></div>
          <textarea className="aps-input" value={attendees} onChange={e=>setAttendees(e.target.value)} maxLength={500} rows={2} placeholder="예: 홍길동, 김철수, 이영희" style={{resize:"vertical"}}/>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">메모 <span style={{fontWeight:400,color:"var(--dimmer)"}}>(개요/배경 등)</span></div>
          <textarea className="aps-input" value={memo} onChange={e=>setMemo(e.target.value)} maxLength={1000} rows={3} style={{resize:"vertical"}} placeholder="회의 배경, 자유 메모 등"/>
        </div>
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"저장 중...":(isEdit?"수정":"추가")}</button>
      </div>
    </div>
  </div>;
}

// PNG 저장용 오프스크린 뷰 (라이트 톤 리포트 스타일)
function ExportMeetingView({meeting,items}){
  const C={bg:"#ffffff",text:"#0f172a",muted:"#64748b",border:"#e2e8f0",strong:"#111827",accent:"#06b6d4",agenda:"#8b5cf6",decision:"#22c55e",action:"#f97316"};
  const byKind=(k)=>items.filter(it=>it.kind===k);
  const sectionColor=(k)=>k==="agenda"?C.agenda:k==="decision"?C.decision:C.action;
  return <div style={{background:C.bg,color:C.text,fontFamily:"Pretendard, -apple-system, system-ui, sans-serif",padding:"32px 40px 24px",width:820,boxSizing:"border-box"}}>
    {/* 헤더 */}
    <div style={{textAlign:"center",borderBottom:`3px solid ${C.strong}`,paddingBottom:14,marginBottom:16}}>
      <div style={{fontSize:12,fontWeight:700,letterSpacing:".28em",color:C.muted,marginBottom:6}}>MEETING MINUTES</div>
      <div style={{fontSize:26,fontWeight:800,color:C.strong,letterSpacing:"-.01em",lineHeight:1.25}}>{meeting.title}</div>
      <div style={{fontSize:14,fontWeight:600,color:C.text,marginTop:8}}>{fmtMtgWhen(meeting.meeting_at)}</div>
    </div>
    {/* 참석자/작성자 */}
    <div style={{background:"#f8fafc",border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 16px",marginBottom:14,fontSize:13,lineHeight:1.7}}>
      {meeting.attendees&&<div><span style={{color:C.muted,fontWeight:700,marginRight:8,letterSpacing:".04em"}}>참석자</span>{meeting.attendees}</div>}
      {meeting.author&&<div><span style={{color:C.muted,fontWeight:700,marginRight:8,letterSpacing:".04em"}}>작성자</span>{meeting.author}</div>}
    </div>
    {/* 개요/메모 */}
    {meeting.memo&&<div style={{marginBottom:16}}>
      <div style={{fontSize:13,fontWeight:700,color:C.muted,letterSpacing:".04em",marginBottom:6}}>개요</div>
      <div style={{fontSize:13.5,lineHeight:1.65,color:C.text,whiteSpace:"pre-wrap",padding:"10px 14px",background:"#fafafa",border:`1px solid ${C.border}`,borderRadius:6}}>{meeting.memo}</div>
    </div>}
    {/* 3 섹션 */}
    {MTG_KINDS.map(K=>{
      const list=byKind(K.key);
      if(list.length===0)return null;
      const col=sectionColor(K.key);
      return <div key={K.key} style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:8,borderLeft:`4px solid ${col}`,paddingLeft:10,marginBottom:10}}>
          <span style={{fontSize:15,fontWeight:800,color:C.strong,letterSpacing:"-.01em"}}>{K.icon} {K.label}</span>
          <span style={{fontSize:11,fontWeight:700,color:C.muted,background:"#f1f5f9",padding:"1px 8px",borderRadius:8}}>{list.length}건</span>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {list.map((it,i)=>{
            const isAction=K.key==="action";
            return <div key={it.id} style={{display:"flex",gap:10,padding:"9px 12px",background:C.bg,border:`1px solid ${C.border}`,borderRadius:6,fontSize:13.5,lineHeight:1.5,opacity:it.done?0.55:1}}>
              <span style={{color:col,fontWeight:800,minWidth:18}}>{i+1}.</span>
              <div style={{flex:1}}>
                <div style={{color:C.text,textDecoration:it.done?"line-through":"none",whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{it.content||"(내용 없음)"}</div>
                {isAction&&(it.assignee||it.due_date||it.done)&&<div style={{fontSize:11.5,color:C.muted,marginTop:4,display:"flex",gap:12,flexWrap:"wrap"}}>
                  {it.assignee&&<span>👤 <b style={{color:C.strong}}>{it.assignee}</b></span>}
                  {it.due_date&&<span>📅 <b style={{color:C.strong}}>{it.due_date}</b></span>}
                  {it.done&&<span style={{color:C.decision,fontWeight:700}}>✓ 완료</span>}
                </div>}
              </div>
            </div>;
          })}
        </div>
      </div>;
    })}
    {/* 푸터 */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:18,paddingTop:12,borderTop:`1px solid ${C.border}`,fontSize:11,color:C.muted}}>
      <span style={{fontWeight:700,letterSpacing:".08em"}}>STOCKPULSE · APS</span>
      <span>생성: {new Date().toLocaleString("ko-KR")}</span>
    </div>
  </div>;
}

function MeetingItemRow({item,onToggle,onEdit,onDelete}){
  const isAction=item.kind==="action";
  const overdue=isAction&&item.due_date&&!item.done&&item.due_date<todayStr();
  return <div className={"mtg-item"+(item.done?" done":"")}>
    {isAction?<input className="mtg-check" type="checkbox" checked={!!item.done} onChange={onToggle}/>:<span style={{width:16,height:16,flexShrink:0,marginTop:3,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"var(--muted)"}}>•</span>}
    <div style={{flex:1,minWidth:0}}>
      <div className="content">{item.content||<span style={{color:"var(--dimmer)",fontStyle:"italic"}}>(내용 없음)</span>}</div>
      {isAction&&(item.assignee||item.due_date)&&<div className="sub">
        {item.assignee&&<span>👤 <b>{item.assignee}</b></span>}
        {item.due_date&&<span className={overdue?"overdue":""}>📅 <b>{item.due_date}</b>{overdue?" ⚠ 지연":""}</span>}
      </div>}
    </div>
    <div className="acts">
      <button title="수정" onClick={onEdit}>✏</button>
      <button title="삭제" onClick={onDelete}>🗑</button>
    </div>
  </div>;
}

function MeetingItemEditor({item,onSave,onCancel}){
  const isAction=item.kind==="action";
  const[content,setContent]=useState(item.content||"");
  const[assignee,setAssignee]=useState(item.assignee||"");
  const[due,setDue]=useState(item.due_date||"");
  const[saving,setSaving]=useState(false);
  const save=async()=>{
    if(!content.trim())return;
    setSaving(true);
    try{await onSave({content:content.trim(),assignee:assignee.trim(),due_date:due||null})}catch(e){alert("저장 실패: "+e.message)}
    setSaving(false);
  };
  return <div className="mtg-add" style={{border:"1px solid #06b6d4"}}>
    <textarea value={content} onChange={e=>setContent(e.target.value)} rows={2} placeholder="내용" autoFocus/>
    {isAction&&<>
      <input value={assignee} onChange={e=>setAssignee(e.target.value)} placeholder="담당자" maxLength={40} style={{maxWidth:130}}/>
      <input type="date" value={due} onChange={e=>setDue(e.target.value)} style={{maxWidth:150}}/>
    </>}
    <button className="add-btn" onClick={save} disabled={saving||!content.trim()}>{saving?"...":"저장"}</button>
    <button className="add-btn" style={{background:"var(--card-bg)",color:"var(--muted)",border:"1px solid var(--card-bd)"}} onClick={onCancel}>취소</button>
  </div>;
}

function MeetingItemAdd({kind,onAdd}){
  const isAction=kind==="action";
  const[content,setContent]=useState("");
  const[assignee,setAssignee]=useState("");
  const[due,setDue]=useState("");
  const[saving,setSaving]=useState(false);
  const submit=async()=>{
    if(!content.trim())return;
    setSaving(true);
    try{
      await onAdd({content:content.trim(),assignee:assignee.trim(),due_date:due||null});
      setContent("");setAssignee("");setDue("");
    }catch(e){alert("추가 실패: "+e.message)}
    setSaving(false);
  };
  const onKey=(e)=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();submit()}};
  const placeholder=kind==="agenda"?"안건 추가 (Ctrl+Enter로 빠른 추가)":kind==="decision"?"결정사항 추가":"액션아이템 추가";
  return <div className="mtg-add">
    <textarea value={content} onChange={e=>setContent(e.target.value)} onKeyDown={onKey} rows={1} placeholder={placeholder}/>
    {isAction&&<>
      <input value={assignee} onChange={e=>setAssignee(e.target.value)} placeholder="담당자" maxLength={40} style={{maxWidth:130}}/>
      <input type="date" value={due} onChange={e=>setDue(e.target.value)} style={{maxWidth:150}}/>
    </>}
    <button className="add-btn" onClick={submit} disabled={saving||!content.trim()}>{saving?"...":"+ 추가"}</button>
  </div>;
}

function MeetingsTab({adminHash}){
  const[meetings,setMeetings]=useState([]);
  const[selectedId,setSelectedId]=useState(null);
  const[detail,setDetail]=useState(null); // {meeting, items}
  const[loading,setLoading]=useState(true);
  const[loadingDetail,setLoadingDetail]=useState(false);
  const[showForm,setShowForm]=useState(false);
  const[editing,setEditing]=useState(null);
  const[search,setSearch]=useState("");
  const[days,setDays]=useState(365);
  const[editingItemId,setEditingItemId]=useState(null);
  const[capturing,setCapturing]=useState(false);
  const exportRef=useRef(null);

  const loadList=useCallback(async()=>{
    setLoading(true);
    try{
      const data=await rpc("aps_list_meetings",{p_admin_hash:adminHash,p_days:days||null,p_search:search});
      setMeetings(data||[]);
    }catch(e){console.error(e);setMeetings([])}
    setLoading(false);
  },[adminHash,days,search]);

  const loadDetail=useCallback(async(id)=>{
    if(!id){setDetail(null);return}
    setLoadingDetail(true);
    try{
      const data=await rpc("aps_get_meeting",{p_admin_hash:adminHash,p_id:id});
      setDetail(data);
    }catch(e){console.error(e);setDetail(null)}
    setLoadingDetail(false);
  },[adminHash]);

  useEffect(()=>{loadList()},[loadList]);
  useEffect(()=>{loadDetail(selectedId)},[selectedId,loadDetail]);

  // 목록 로드 후 첫 회의 자동 선택 (아직 선택 안 됐을 때만)
  useEffect(()=>{
    if(!selectedId&&meetings.length>0)setSelectedId(meetings[0].id);
  },[meetings,selectedId]);

  const openNew=()=>{setEditing(null);setShowForm(true)};
  const openEdit=(m)=>{setEditing(m);setShowForm(true)};
  const onSavedMeeting=async()=>{setShowForm(false);await loadList();if(selectedId)await loadDetail(selectedId)};

  const delMeeting=async(m)=>{
    if(!confirm(`회의록 "${m.title}" 을(를) 삭제하시겠습니까?\n항목도 모두 삭제됩니다.`))return;
    try{
      await rpc("aps_delete_meeting",{p_admin_hash:adminHash,p_id:m.id});
      if(selectedId===m.id)setSelectedId(null);
      await loadList();
    }catch(e){alert("삭제 실패: "+e.message)}
  };

  const addItem=async(kind,payload)=>{
    await rpc("aps_upsert_meeting_item",{
      p_admin_hash:adminHash,
      p_id:null,
      p_meeting_id:selectedId,
      p_kind:kind,
      p_content:payload.content,
      p_assignee:payload.assignee||"",
      p_due_date:payload.due_date||null,
      p_done:false
    });
    await loadDetail(selectedId);
  };

  const saveItem=async(item,payload)=>{
    await rpc("aps_upsert_meeting_item",{
      p_admin_hash:adminHash,
      p_id:item.id,
      p_meeting_id:item.meeting_id,
      p_kind:item.kind,
      p_content:payload.content,
      p_assignee:payload.assignee||"",
      p_due_date:payload.due_date||null,
      p_done:item.done
    });
    setEditingItemId(null);
    await loadDetail(selectedId);
  };

  const toggleDone=async(item)=>{
    // 낙관적 업데이트
    setDetail(d=>d?{...d,items:d.items.map(it=>it.id===item.id?{...it,done:!it.done}:it)}:d);
    try{await rpc("aps_toggle_meeting_item_done",{p_admin_hash:adminHash,p_id:item.id})}
    catch(e){alert("갱신 실패: "+e.message);await loadDetail(selectedId)}
  };

  const delItem=async(item)=>{
    if(!confirm("항목을 삭제하시겠습니까?"))return;
    try{
      await rpc("aps_delete_meeting_item",{p_admin_hash:adminHash,p_id:item.id});
      await loadDetail(selectedId);
    }catch(e){alert("삭제 실패: "+e.message)}
  };

  const exportPng=async()=>{
    if(!detail){alert("먼저 회의록을 선택하세요");return}
    if(typeof window.html2canvas!=="function"){
      alert("이미지 저장 라이브러리(html2canvas)가 로드되지 않았습니다. 새로고침 후 다시 시도해주세요.");return;
    }
    setCapturing(true);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const target=exportRef.current;
    if(!target){setCapturing(false);return}
    try{
      const canvas=await window.html2canvas(target,{backgroundColor:"#ffffff",scale:2,logging:false,useCORS:true});
      const link=document.createElement("a");
      const dateStr=isoToKstDateStr(detail.meeting.meeting_at)||todayStr();
      const safeTitle=(detail.meeting.title||"회의록").replace(/[\\/:*?"<>|]/g,"_").slice(0,40);
      link.download=`회의록_${dateStr}_${safeTitle}.png`;
      link.href=canvas.toDataURL("image/png");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }catch(e){console.error(e);alert("이미지 저장 실패: "+(e.message||e))}
    setCapturing(false);
  };

  const dayOptions=[
    {v:30,l:"30일"},{v:90,l:"90일"},{v:180,l:"180일"},{v:365,l:"1년"},{v:0,l:"전체"}
  ];

  return <div>
    <div className="aps-toolbar">
      <div style={{fontSize:15,fontWeight:700}}>📝 회의록 <span style={{color:"var(--muted)",fontSize:12,fontWeight:500,marginLeft:6}}>{meetings.length}건</span></div>
      <div style={{flex:1}}/>
      <input className="aps-input" style={{maxWidth:220}} placeholder="제목·참석자·메모 검색" value={search} onChange={e=>setSearch(e.target.value)}/>
      <select className="aps-select" value={days} onChange={e=>setDays(Number(e.target.value))}>
        {dayOptions.map(d=><option key={d.v} value={d.v}>{d.l}</option>)}
      </select>
      <button className="aps-btn aps-btn-primary" onClick={openNew}>+ 회의록 추가</button>
    </div>

    <div className="mtg-layout">
      {/* 좌측: 회의록 목록 */}
      <div className="mtg-list-panel">
        {loading?<div className="aps-empty" style={{padding:"20px 6px"}}>로딩 중...</div>
        :meetings.length===0?
          <div className="aps-empty" style={{padding:"20px 6px"}}>
            <div className="aps-empty-emoji">📝</div>
            <div>{search?"검색 결과 없음":"등록된 회의록이 없습니다"}</div>
          </div>
        :meetings.map(m=>
          <div key={m.id} className={"mtg-list-item"+(selectedId===m.id?" active":"")} onClick={()=>setSelectedId(m.id)}>
            <div className="ttl">{m.title}</div>
            <div className="meta">
              <span>{fmtMtgWhenShort(m.meeting_at)}</span>
              <span style={{display:"flex",gap:4}}>
                {m.item_count>0&&<span className="cnt">{m.item_count}</span>}
                {m.open_actions>0&&<span className="open">⚠{m.open_actions}</span>}
              </span>
            </div>
          </div>
        )}
      </div>

      {/* 우측: 상세 */}
      <div className="mtg-detail">
        {loadingDetail?<div className="aps-empty">로딩 중...</div>
        :!detail?<div className="aps-empty">
          <div className="aps-empty-emoji">📝</div>
          <div>{meetings.length===0?"+ 회의록 추가로 시작하세요":"좌측에서 회의록을 선택하세요"}</div>
        </div>
        :<>
          <div className="mtg-detail-hdr">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:200}}>
                <div className="mtg-detail-ttl">{detail.meeting.title}</div>
                <div className="mtg-detail-meta">
                  <span>📅 <b>{fmtMtgWhen(detail.meeting.meeting_at)}</b></span>
                  {detail.meeting.author&&<span>✍ <b>{detail.meeting.author}</b></span>}
                </div>
                {detail.meeting.attendees&&<div style={{fontSize:12.5,color:"var(--muted)",marginTop:6}}>👥 {detail.meeting.attendees}</div>}
              </div>
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={exportPng} disabled={capturing} title="회의록을 PNG 이미지로 저장">{capturing?"저장 중...":"📷 이미지"}</button>
                <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>openEdit(detail.meeting)}>✏ 수정</button>
                <button className="aps-btn aps-btn-danger aps-btn-sm" onClick={()=>delMeeting(detail.meeting)}>🗑 삭제</button>
              </div>
            </div>
            {detail.meeting.memo&&<div style={{marginTop:12,padding:"10px 14px",background:"var(--bg)",border:"1px solid var(--div2)",borderRadius:8,fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap",color:"var(--text)"}}>{detail.meeting.memo}</div>}
          </div>

          {/* 3 섹션 */}
          {MTG_KINDS.map(K=>{
            const list=detail.items.filter(it=>it.kind===K.key);
            return <div key={K.key} className="mtg-sec">
              <div className="mtg-sec-hdr">
                <span>{K.icon} {K.label}</span>
                <span className="cnt">{list.length}건</span>
              </div>
              {list.map(it=>
                editingItemId===it.id
                ? <MeetingItemEditor key={it.id} item={it} onSave={p=>saveItem(it,p)} onCancel={()=>setEditingItemId(null)}/>
                : <MeetingItemRow key={it.id} item={it} onToggle={()=>toggleDone(it)} onEdit={()=>setEditingItemId(it.id)} onDelete={()=>delItem(it)}/>
              )}
              <MeetingItemAdd kind={K.key} onAdd={p=>addItem(K.key,p)}/>
            </div>;
          })}
        </>}
      </div>
    </div>

    {showForm&&<MeetingForm adminHash={adminHash} initial={editing} onCancel={()=>setShowForm(false)} onSaved={onSavedMeeting}/>}

    {/* 오프스크린 PNG 캡처용 */}
    {capturing&&detail&&<div style={{position:"fixed",left:-99999,top:0,pointerEvents:"none"}}>
      <div ref={exportRef}><ExportMeetingView meeting={detail.meeting} items={detail.items}/></div>
    </div>}
  </div>;
}

// APS 로스탭 — 생산일보(집계) 엑셀 업로드 + 로스 계산
// ═══════════════════════════════════════════

// 시트명 → date ("20260615" 또는 "2026-06-15")
function sheetNameToDate(name){
  const s=String(name||"").trim();
  const m1=s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m1)return `${m1[1]}-${m1[2]}-${m1[3]}`;
  const m2=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m2)return `${m2[1]}-${m2[2].padStart(2,"0")}-${m2[3].padStart(2,"0")}`;
  return null;
}

// R2 A열의 "YYYY년MM월DD일" 파싱 (시트명 fallback)
function extractDateFromHeaderCell(v){
  if(v==null)return null;
  const s=String(v).trim();
  const m=s.match(/(\d{4})[년\.\-\/](\d{1,2})[월\.\-\/](\d{1,2})/);
  if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  return null;
}

// 생산일보 워크북 파싱 — 시트별로 원육/상품 페어를 chain 단위로 정규화
// 반환: [{date, sheet_name, rows:[...]}]
// 각 row: {date, sheet_name, row_index, chain_id, is_chain_start, is_inherited, is_loss_summary,
//         raw_meat_*, product_*, loss_reported_*}
function parseProductionWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const sheets=[];
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn];
    if(!ws)continue;
    const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    if(arr.length<5)continue;
    let date=sheetNameToDate(sn);
    if(!date && arr[1] && arr[1][0])date=extractDateFromHeaderCell(arr[1][0]);
    if(!date)continue;

    const rows=[];
    let chainId=0;
    let rowIdx=0;
    let currentChainInvalid=false; // 제품 수량 0 chain 감지 시 이후 continuation/loss summary도 skip
    let currentChainProdCode=""; // 유효 chain의 제품 코드 — continuation 원육 코드가 같으면 그 행 스킵
    // 헤더 R1~R4 스킵 → R5부터 데이터
    // R3 그룹 헤더: LEFT(A-H) = "생산 제품", RIGHT(I-P) = "투입 품목"
    for(let i=4;i<arr.length;i++){
      const r=arr[i]||[];
      // LEFT (생산 제품) A-H: 0=code, 1=name, 2=origin, 3=grade, 4=box, 5=kg, 6=unit, 7=amount
      const prodCode=(r[0]!=null?String(r[0]):"").trim();
      const prodName=(r[1]!=null?String(r[1]):"").trim();
      const prodOrigin=(r[2]!=null?String(r[2]):"").trim();
      const prodGrade=(r[3]!=null?String(r[3]):"").trim();
      const prodBox=Number(r[4])||0;
      const prodKg=Number(r[5])||0;
      const prodUnit=(r[6]!=null?String(r[6]):"Kg").trim()||"Kg";
      const prodAmt=Number(r[7])||0;

      // RIGHT (투입 품목/원육) I-P: 8=code, 9=name, 10=origin, 11=grade, 12=box, 13=kg, 14=unit, 15=amount
      const rawCode=(r[8]!=null?String(r[8]):"").trim();
      const rawName=(r[9]!=null?String(r[9]):"").trim();
      const rawOrigin=(r[10]!=null?String(r[10]):"").trim();
      const rawGrade=(r[11]!=null?String(r[11]):"").trim();
      const rawBox=Number(r[12])||0;
      const rawKg=Number(r[13])||0;
      const rawUnit=(r[14]!=null?String(r[14]):"Kg").trim()||"Kg";
      const rawAmt=Number(r[15])||0;
      const lossRate=Number(r[16]);

      // 합계행 (첫 컬럼 한글-only "합 계") 스킵
      if(prodCode && /^[가-힣\s]+$/.test(prodCode) && !rawCode)continue;

      // LEFT(제품) 정보가 있으면 새 chain 시작 의도 — 코드/이름 중 하나라도 채워짐
      const hasProdInfo = !!prodCode || !!prodName;

      // 제품 수량 0인 chain은 무효 → 이 행 스킵 + 이후 continuation/loss summary도 스킵
      if(hasProdInfo && prodKg<=0){
        currentChainInvalid = true;
        currentChainProdCode = "";
        continue;
      }
      // 제품 코드 = 원육 코드인 chain은 무효 (재작업/재포장 케이스) → 전체 chain 스킵
      if(hasProdInfo && prodCode && rawCode && prodCode === rawCode){
        currentChainInvalid = true;
        currentChainProdCode = "";
        continue;
      }
      // 유효한 새 chain 시작 시 무효 플래그 해제 + 제품 코드 기록
      if(hasProdInfo){
        currentChainInvalid = false;
        currentChainProdCode = prodCode;
      }
      // LEFT 빈 행(continuation/loss summary)이 무효 chain에 속하면 스킵
      if(!hasProdInfo && currentChainInvalid){
        continue;
      }
      // continuation 행에서 원육 코드가 chain 제품 코드와 같으면 그 행만 스킵 (chain 자체는 유지)
      if(!hasProdInfo && currentChainProdCode && rawCode && rawCode === currentChainProdCode){
        continue;
      }

      // XXXXXXXX 로스량 합계 행 — RIGHT 컬럼에 위치
      const isLossSummary = (rawCode==="XXXXXXXX") ||
                            (rawName.indexOf("로스량")>=0 && rawName.indexOf("합계")>=0);

      const hasProd = !!prodCode && prodKg>0;
      const hasRaw = !!rawCode && rawKg>0;
      if(!hasProd && !hasRaw)continue;

      // LEFT 채워짐 = 새 제품 chain 시작
      // LEFT 비고 RIGHT 있음 = 같은 제품에 추가 원육 투입 (continuation)
      let isChainStart=false, isContinuation=false;
      if(hasProd){chainId++;isChainStart=true}
      else if(!isLossSummary){isContinuation=true}

      rowIdx++;
      rows.push({
        date, sheet_name:sn, row_index:rowIdx, chain_id:chainId,
        // 스키마 필드명은 유지 (is_inherited → continuation 의미로 재사용)
        is_chain_start:isChainStart, is_inherited:isContinuation, is_loss_summary:isLossSummary,
        // 제품 정보는 chain_start 행에만 채워짐
        product_code:    isChainStart ? prodCode : "",
        product_name:    isChainStart ? prodName : "",
        product_origin:  isChainStart ? prodOrigin : "",
        product_grade:   isChainStart ? prodGrade : "",
        product_boxes:   isChainStart ? prodBox : 0,
        product_kg:      isChainStart ? prodKg : 0,
        product_unit:    isChainStart ? prodUnit : "Kg",
        product_amount:  isChainStart ? prodAmt : 0,
        // 원육 정보는 데이터 행마다(chain_start 및 continuation 모두)에 채워짐
        raw_meat_code:   isLossSummary ? "" : rawCode,
        raw_meat_name:   isLossSummary ? "" : rawName,
        raw_meat_origin: isLossSummary ? "" : rawOrigin,
        raw_meat_grade:  isLossSummary ? "" : rawGrade,
        raw_meat_boxes:  isLossSummary ? 0 : rawBox,
        raw_meat_kg:     isLossSummary ? 0 : rawKg,
        raw_meat_unit:   isLossSummary ? "Kg" : rawUnit,
        raw_meat_amount: isLossSummary ? 0 : rawAmt,
        loss_reported_kg:     isLossSummary ? rawKg : 0,
        loss_reported_amount: isLossSummary ? rawAmt : 0,
        loss_reported_rate:   isLossSummary ? (isNaN(lossRate)?0:lossRate) : 0,
      });
    }
    if(rows.length>0)sheets.push({date, sheet_name:sn, rows});
  }
  return sheets;
}

// 제품명에서 팩당 무게(kg) 추출
// 예: "[S]돌돌말이 우삼겹 500g*8" → 0.5 (500g = 0.5kg)
// 예: "원육_등심 1kg*6" → 1.0
// 예: "치즈스틱 3kg*5" → 3.0
// 매칭 안 되면 null → excel product_kg 값 그대로 사용
// 로직: excel의 product_kg 컬럼은 사실상 총 팩 수(박스×팩) 값이므로 팩당 kg를 곱해야 실제 완성 kg
function extractPackWeightFromName(name){
  if(!name)return null;
  const m = String(name).match(/(\d+(?:\.\d+)?)\s*(kg|g)\s*\*\s*\d+/i);
  if(!m)return null;
  const val = parseFloat(m[1]);
  if(isNaN(val)||val<=0)return null;
  const unit = m[2].toLowerCase();
  return unit === 'kg' ? val : val/1000;
}

// 시트 rows → chain별 로스 계산
// 하나의 chain = 하나의 생산 제품(chain_start) + 여러 원육(chain_start 및 continuation 행들)
// 실제 완성 kg = excel product_kg × 팩당 kg (제품명 스펙 파싱 성공 시)
// 스펙 없는 제품은 excel product_kg 그대로 사용
// Loss = Σ raw_meat_kg − 실제 완성 kg
function computeSheetLoss(rows){
  // chain_id 별로 묶기
  const chains={};
  for(const r of rows){
    if(r.is_loss_summary)continue;
    const key=r.chain_id;
    if(!chains[key])chains[key]={chain_id:key, product:null, raw_meats:[]};
    if(r.is_chain_start && r.product_code){
      chains[key].product={
        product_code:r.product_code, product_name:r.product_name,
        product_origin:r.product_origin, product_grade:r.product_grade,
        product_boxes:r.product_boxes, product_kg:r.product_kg,
        product_unit:r.product_unit, product_amount:r.product_amount,
      };
    }
    if(r.raw_meat_code && r.raw_meat_kg>0){
      chains[key].raw_meats.push({
        code:r.raw_meat_code, name:r.raw_meat_name,
        origin:r.raw_meat_origin, grade:r.raw_meat_grade,
        boxes:r.raw_meat_boxes, meat_kg:r.raw_meat_kg,
        unit:r.raw_meat_unit, meat_amount:r.raw_meat_amount,
      });
    }
  }

  // 각 chain에 대해 loss 계산
  const products=[];
  const keys=Object.keys(chains).map(Number).sort((a,b)=>a-b);
  for(const key of keys){
    const c=chains[key];
    if(!c.product)continue; // chain_start 행이 없으면 skip
    const totalInputKg=c.raw_meats.reduce((s,m)=>s+m.meat_kg,0);
    const totalInputAmt=c.raw_meats.reduce((s,m)=>s+m.meat_amount,0);
    // 제품명에서 팩당 무게 파싱 → excel product_kg는 총 팩 수로 취급, 팩당 kg 곱해 실제 완성 kg 산출
    const packWeightKg = extractPackWeightFromName(c.product.product_name);
    const excelProdKg = c.product.product_kg||0;
    const totalOutputKg = packWeightKg != null ? excelProdKg * packWeightKg : excelProdKg;
    const totalOutputAmt=c.product.product_amount||0;
    const lossKg=totalInputKg-totalOutputKg;
    const lossRate=totalInputKg>0 ? Math.round(lossKg/totalInputKg*100*100)/100 : 0;
    products.push({
      entry:{
        chain_id:c.chain_id,
        product:c.product,
        raw_meats:c.raw_meats,
      },
      chain_id:c.chain_id,
      pack_weight_kg: packWeightKg,        // 팩당 kg (스펙 없으면 null)
      excel_product_kg: excelProdKg,       // excel 원본 값 (총 팩수 개념)
      loss_info:{
        total_input_kg: Math.round(totalInputKg*100)/100,
        total_output_kg: Math.round(totalOutputKg*100)/100,
        loss_kg: Math.round(lossKg*100)/100,
        loss_rate: lossRate,
        total_input_amount: Math.round(totalInputAmt*100)/100,
        total_output_amount: Math.round(totalOutputAmt*100)/100,
      },
    });
  }

  // 전체 요약
  const totalInKg=products.reduce((s,p)=>s+p.loss_info.total_input_kg,0);
  const totalOutKg=products.reduce((s,p)=>s+p.loss_info.total_output_kg,0);
  const totalLossKg=totalInKg-totalOutKg;
  const overallRate=totalInKg>0 ? Math.round(totalLossKg/totalInKg*100*100)/100 : 0;

  return {
    products,
    summary:{
      total_input_kg: Math.round(totalInKg*100)/100,
      total_output_kg: Math.round(totalOutKg*100)/100,
      total_loss_kg: Math.round(totalLossKg*100)/100,
      loss_rate: overallRate,
    }
  };
}

function fmtLossKg(n,digits){
  if(n==null||isNaN(n))return "-";
  const d=digits==null?1:digits;
  return Number(n).toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtLossPct(n){
  if(n==null||isNaN(n))return "-";
  return Number(n).toFixed(2)+"%";
}
function lossRateColor(rate){
  if(rate==null||isNaN(rate))return "var(--muted)";
  if(rate<=5)return "#10b981";
  if(rate<=15)return "#eab308";
  if(rate<=30)return "#f97316";
  return "#ef4444";
}

// 시트 원본 로우 세부 표시 (chain 그룹별: 제품 헤더 + 투입 원육 리스트)
function ProductionLossDetail({loss,rows,date}){
  // chain별 loss_summary 매칭 (있으면 excel 원본 로스율 표시용)
  const summaryByChain=useMemo(()=>{
    const m={};
    for(const r of rows){
      if(r.is_loss_summary)m[r.chain_id]=r;
    }
    return m;
  },[rows]);

  if(!loss)return null;

  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    {loss.products.map(p=>{
      const prod=p.entry.product;
      const raws=p.entry.raw_meats||[];
      const li=p.loss_info;
      const summary=summaryByChain[p.chain_id];
      return <div key={p.chain_id} style={{border:"1px solid var(--card-bd)",borderRadius:8,overflow:"hidden",background:"var(--card-bg)"}}>
        {/* Chain 헤더 = 생산 제품 */}
        <div style={{padding:"10px 14px",background:"rgba(6,182,212,0.06)",borderBottom:"1px solid var(--card-bd)",display:"flex",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>#{p.chain_id}</div>
          <div style={{flex:1,minWidth:200}}>
            <div style={{fontWeight:700,fontSize:14}}>📦 {prod.product_name||"(제품명 없음)"} <span style={{fontSize:11,color:"var(--muted)",fontFamily:"monospace",marginLeft:6}}>{prod.product_code}</span></div>
            <div style={{fontSize:11,color:"var(--muted)"}}>
              {prod.product_origin||"-"} · 생산 {fmtLossKg(prod.product_boxes,0)}박스 · {
                p.pack_weight_kg != null ? <>
                  <b style={{color:"var(--text)"}}>{fmtLossKg(li.total_output_kg)} kg</b>
                  <span style={{opacity:0.7,marginLeft:4}}>
                    ({fmtLossKg(p.excel_product_kg,0)}팩 × {p.pack_weight_kg>=1?p.pack_weight_kg+"kg":Math.round(p.pack_weight_kg*1000)+"g"})
                  </span>
                </> : <>
                  {fmtLossKg(p.excel_product_kg)} {prod.product_unit||"Kg"}
                </>
              }
              {prod.product_amount>0?` · ${Number(prod.product_amount).toLocaleString("ko-KR")}원`:""}
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:"var(--muted)"}}>계산 로스</div>
            <div style={{fontSize:15,fontWeight:800,color:lossRateColor(li.loss_rate)}}>
              {li.loss_kg>0.01?fmtLossKg(li.loss_kg):"0"}kg · {li.loss_rate.toFixed(2)}%
            </div>
            {summary && <div style={{fontSize:10,color:"var(--muted)",marginTop:2}}>원본 {fmtLossPct(summary.loss_reported_rate)}</div>}
          </div>
        </div>
        {/* 투입 원육 리스트 */}
        <table className="aps-table" style={{fontSize:12}}>
          <thead><tr>
            <th style={{width:40}}>#</th>
            <th>🥩 투입 원육</th>
            <th className="right" style={{width:70}}>박스</th>
            <th className="right" style={{width:90}}>kg</th>
            <th className="right" style={{width:110}}>매입금액</th>
            <th className="right hide-mobile" style={{width:80}}>비중</th>
          </tr></thead>
          <tbody>
            {raws.length===0?
              <tr><td colSpan={6} style={{textAlign:"center",color:"var(--muted)",padding:14}}>투입 원육 데이터 없음</td></tr>
              :
              raws.map((m,mi)=>{
                const share=li.total_input_kg>0?(m.meat_kg/li.total_input_kg*100):0;
                return <tr key={mi}>
                  <td style={{color:"var(--muted)",fontSize:11}}>{mi+1}</td>
                  <td>
                    <div style={{fontWeight:600}}>{m.name||"(원육명 없음)"}</div>
                    <div style={{fontSize:10,color:"var(--muted)",fontFamily:"monospace"}}>
                      {m.code}{m.origin?` · ${m.origin}`:""}{m.grade?` · ${m.grade}`:""}
                    </div>
                  </td>
                  <td className="right">{fmtLossKg(m.boxes,0)}</td>
                  <td className="right" style={{fontWeight:600}}>{fmtLossKg(m.meat_kg)}</td>
                  <td className="right" style={{fontSize:11,color:"var(--muted)"}}>{m.meat_amount?Number(m.meat_amount).toLocaleString("ko-KR"):"-"}</td>
                  <td className="right hide-mobile" style={{fontSize:11,color:"var(--muted)"}}>{share.toFixed(1)}%</td>
                </tr>;
              })
            }
            {/* 합계 행 */}
            <tr style={{background:"rgba(148,163,184,0.06)"}}>
              <td></td>
              <td style={{fontWeight:700,fontSize:11,color:"var(--muted)"}}>합계 (원육 → 제품 → 로스)</td>
              <td className="right"></td>
              <td className="right" style={{fontWeight:700}}>
                <div>{fmtLossKg(li.total_input_kg)}</div>
                <div style={{fontSize:10,color:"var(--muted)"}}>→ 제품 {fmtLossKg(li.total_output_kg)}</div>
              </td>
              <td className="right hide-mobile"></td>
              <td className="right hide-mobile" style={{fontSize:11,fontWeight:700,color:lossRateColor(li.loss_rate)}}>
                {li.loss_kg>0.01?<>로스 {fmtLossKg(li.loss_kg)}kg<br/><span style={{fontSize:10}}>({li.loss_rate.toFixed(2)}%)</span></>:"-"}
              </td>
            </tr>
          </tbody>
        </table>
      </div>;
    })}
  </div>;
}

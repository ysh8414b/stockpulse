// 재고 빠른 보기 패널 (생산계획 탭 좌측에 표시)
// 재고 시트 탭에서 업로드한 데이터를 localStorage에서 읽어와 표시
// ═══════════════════════════════════════════
const INV_COLOR_BG={y:"rgba(255,242,179,0.22)",o:"rgba(252,213,180,0.22)",b:"rgba(219,229,241,0.22)",g:"rgba(216,228,188,0.22)",p:"rgba(242,220,219,0.22)",w:"transparent"};
const INV_COLOR_DOT={y:"#facc15",o:"#fb923c",b:"#60a5fa",g:"#84cc16",p:"#f472b6",w:"#94a3b8"};

function fmtSavedAt(iso){
  if(!iso)return "";
  try{
    const d=new Date(iso);
    const mm=String(d.getMonth()+1).padStart(2,"0");
    const dd=String(d.getDate()).padStart(2,"0");
    const hh=String(d.getHours()).padStart(2,"0");
    const mn=String(d.getMinutes()).padStart(2,"0");
    return `${mm}/${dd} ${hh}:${mn}`;
  }catch(e){return ""}
}

function InventoryQuickPanel({onClose,onJumpToSheet,adminHash,items,plans}){
  const[data,setData]=useState(()=>loadStoredInventory());
  const[showRaws,setShowRaws]=useState(false);
  const[query,setQuery]=useState("");
  const[template,setTemplate]=useState(()=>loadStoredTemplate()||DEFAULT_PRODUCT_TEMPLATE);

  // 같은 탭(InventorySheetTab의 업로드) + 다른 탭(storage 이벤트) 양쪽 구독
  useEffect(()=>{
    const reload=()=>{
      setData(loadStoredInventory());
      const t=loadStoredTemplate();
      if(t)setTemplate(t);
    };
    const onStorage=(e)=>{if(!e.key||e.key===INVENTORY_DATA_KEY||e.key===TEMPLATE_KEY)reload()};
    window.addEventListener("storage",onStorage);
    window.addEventListener("aps-inv-data-change",reload);
    return()=>{
      window.removeEventListener("storage",onStorage);
      window.removeEventListener("aps-inv-data-change",reload);
    };
  },[]);

  // 마운트 시 원격에서 최신 재고 fetch → 로컬보다 새로우면 교체 (모바일에서 PC 업로드 데이터 보기 위해)
  useEffect(()=>{
    if(!adminHash)return;
    let cancelled=false;
    (async()=>{
      const remote=await loadRemoteInventory(adminHash);
      if(cancelled)return;
      const local=loadStoredInventory();
      const action=!remote?"no-remote":_invRemoteIsNewer(local,remote)?"apply-remote":"keep-local";
      console.info("[aps-inv-sync] InventoryQuickPanel mount:",{localSaved:local?.savedAt||"",remoteSaved:remote?.savedAt||"",action});
      if(!remote)return;
      const adoptedTpl=adoptRemoteTemplate(remote,_toTs(local?.savedAt),_toTs(remote?.savedAt));
      if(adoptedTpl)setTemplate(adoptedTpl);
      if(_invRemoteIsNewer(local,remote)){
        applyRemoteInventoryToLocal(remote);
        setData(remote);
      }
    })();
    return()=>{cancelled=true};
  },[adminHash]);

  const productMap=useMemo(()=>{
    const m={};(data?.products||[]).forEach(p=>{m[p.code]=p});return m;
  },[data]);

  // aps_items의 code → safety_stock 매핑 (안전재고는 매출 주평균으로 자동 동기화)
  const safetyMap=useMemo(()=>{
    const m={};(items||[]).forEach(i=>{if(i.code)m[i.code]=Number(i.safety_stock||0)});return m;
  },[items]);

  // 오늘부터 계획된 수량 합산 (item_code별). status는 planned/in_progress만 (done/canceled 제외)
  // KST 기준 오늘 이후 start_at을 가진 계획만 포함
  const plannedMap=useMemo(()=>{
    const m={};
    const today=todayStr();
    (plans||[]).forEach(p=>{
      if(!p.item_code)return;
      if(p.status!=="planned"&&p.status!=="in_progress")return;
      const d=isoToKstDateStr(p.start_at);
      if(!d||d<today)return;
      m[p.item_code]=(m[p.item_code]||0)+Number(p.qty||0);
    });
    return m;
  },[plans]);

  // 템플릿 순서대로 + 박스 0 포함, 검색 적용
  const rows=useMemo(()=>{
    const q=query.trim().toLowerCase();
    return template.map(t=>{
      const p=productMap[t.code];
      return {
        code:t.code,
        name:t.name||(p?p.name:""),
        color:t.color||"w",
        box:p?Math.round(p.box):0,
        safety:Math.round(safetyMap[t.code]||0),
        planned:Math.round(plannedMap[t.code]||0),
        hasData:!!p
      };
    }).filter(r=>{
      if(!q)return true;
      return r.code.toLowerCase().includes(q)||(r.name||"").toLowerCase().includes(q);
    });
  },[template,productMap,safetyMap,plannedMap,query]);

  // 템플릿 밖 추가 품목 (업로드에는 있는데 마스터에 없음)
  const extras=useMemo(()=>{
    const q=query.trim().toLowerCase();
    return (data?.products||[])
      .filter(p=>!template.some(t=>t.code===p.code))
      .filter(p=>!q||p.code.toLowerCase().includes(q)||(p.name||"").toLowerCase().includes(q));
  },[data,template,query]);

  const sortedRaws=useMemo(()=>{
    const q=query.trim().toLowerCase();
    const arr=(data?.raws||[]).filter(r=>Math.abs(r.kg||0)>=0.05);
    const filtered=q?arr.filter(r=>(r.name||"").toLowerCase().includes(q)||(r.code||"").toLowerCase().includes(q)):arr;
    return filtered.slice().sort((a,b)=>(b.kg||0)-(a.kg||0));
  },[data,query]);

  const hasData=(data?.products||[]).length>0||(data?.raws||[]).length>0;

  return <div className="aps-inv-panel">
    <div className="aps-inv-panel-title">
      <span>📦 재고</span>
      {data?.dateLabel&&<span className="aps-inv-panel-date">{data.dateLabel}</span>}
      <button className="aps-inv-panel-x" onClick={onClose} title="패널 닫기">✕</button>
    </div>
    {data?.savedAt&&<div className="aps-inv-panel-meta">최근 업데이트 {fmtSavedAt(data.savedAt)}</div>}

    {!hasData?<div className="aps-inv-panel-empty">
      <div style={{fontSize:24,marginBottom:6,opacity:.7}}>📋</div>
      <div style={{marginBottom:8}}>저장된 재고가 없습니다.</div>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={onJumpToSheet}>재고 시트 탭으로 이동</button>
    </div>:<>
      <input className="aps-input aps-inv-panel-search" placeholder="코드/제품명 검색" value={query} onChange={e=>setQuery(e.target.value)}/>

      <div className="aps-inv-panel-section-title">제품 ({(data?.products||[]).length})</div>
      {rows.length===0?<div className="aps-inv-panel-row-empty">검색 결과 없음</div>:
        <table className="aps-inv-panel-tbl">
          <tbody>
            <tr className="head">
              <td className="dot"></td>
              <td>품목</td>
              <td style={{textAlign:"right"}}>현재</td>
              <td style={{textAlign:"right"}}>안전</td>
              <td style={{textAlign:"right"}} title="오늘 이후 계획된 수량 합계 (planned/in_progress)">계획</td>
            </tr>
            {rows.map(r=>{
              const low=r.safety>0&&r.box<r.safety;
              const qtyCls=r.box===0?" zero":(low?" low":"");
              return <tr key={r.code} style={{background:INV_COLOR_BG[r.color]||"transparent"}} title={`${r.code} — ${r.name}${r.safety>0?` · 안전재고 ${r.safety}`:""}${r.planned>0?` · 오늘 이후 계획 ${r.planned}`:""}`}>
                <td className="dot"><span style={{background:INV_COLOR_DOT[r.color]||"#94a3b8"}}/></td>
                <td className="nm">{r.name||r.code}</td>
                <td className={"qty"+qtyCls}>{r.box}</td>
                <td className={"safety"+(r.safety===0?" none":"")}>{r.safety>0?r.safety:"–"}</td>
                <td className={"plan"+(r.planned===0?" none":"")}>{r.planned>0?r.planned:"–"}</td>
              </tr>;
            })}
            {extras.length>0&&<tr><td colSpan="5" className="aps-inv-panel-subhead">+ 마스터 외 ({extras.length})</td></tr>}
            {extras.map(p=>{
              const safety=Math.round(safetyMap[p.code]||0);
              const box=Math.round(p.box);
              const planned=Math.round(plannedMap[p.code]||0);
              const low=safety>0&&box<safety;
              const qtyCls=box===0?" zero":(low?" low":"");
              return <tr key={"x"+p.code} title={`${p.code} — ${p.name}${safety>0?` · 안전재고 ${safety}`:""}${planned>0?` · 오늘 이후 계획 ${planned}`:""}`}>
                <td className="dot"><span style={{background:"#94a3b8",opacity:.4}}/></td>
                <td className="nm" style={{color:"var(--muted)"}}>{p.name||p.code}</td>
                <td className={"qty"+qtyCls}>{box}</td>
                <td className={"safety"+(safety===0?" none":"")}>{safety>0?safety:"–"}</td>
                <td className={"plan"+(planned===0?" none":"")}>{planned>0?planned:"–"}</td>
              </tr>;
            })}
          </tbody>
        </table>
      }

      {sortedRaws.length>0&&<>
        <div className="aps-inv-panel-section-title" style={{cursor:"pointer",userSelect:"none"}} onClick={()=>setShowRaws(v=>!v)}>
          🥩 원육 ({sortedRaws.length}) <span style={{marginLeft:"auto",fontSize:10,color:"var(--muted)"}}>{showRaws?"▾":"▸"}</span>
        </div>
        {showRaws&&<table className="aps-inv-panel-tbl">
          <tbody>
            {sortedRaws.map(r=>
              <tr key={"r"+r.code} title={`${r.name} (${r.origin||"-"})`}>
                <td className="nm" colSpan="2">{r.name||r.code}</td>
                <td className="qty">{(r.kg||0).toFixed(1)}<span style={{fontSize:9,color:"var(--muted)",marginLeft:2}}>kg</span></td>
              </tr>
            )}
          </tbody>
        </table>}
      </>}
    </>}
  </div>;
}

// ═══════════════════════════════════════════
// 생산계획 탭
// ═══════════════════════════════════════════
function PlanForm({adminHash,items,lines,settings,initial,defaultDate,onSaved,onCancel}){
  const isEdit=!!initial;
  const wsh=parseInt(settings?.work_start_hour||"8");
  const baseDate=defaultDate||todayStr();
  const defaultStartInput=`${baseDate}T${String(wsh).padStart(2,"0")}:00`;
  const defaultEndInput=`${baseDate}T${String(Math.min(wsh+1,23)).padStart(2,"0")}:00`;
  const[itemId,setItemId]=useState(initial?.item_id||"");
  const[itemQuery,setItemQuery]=useState("");
  const[itemOpen,setItemOpen]=useState(false);
  const[itemHi,setItemHi]=useState(0);
  const[lineId,setLineId]=useState(initial?.line_id||"");
  const[qty,setQty]=useState(initial?.qty||"");
  const[startAt,setStartAt]=useState(initial?isoToKstInput(initial.start_at):defaultStartInput);
  const[endAt,setEndAt]=useState(initial?isoToKstInput(initial.end_at):defaultEndInput);
  const[status,setStatus]=useState(initial?.status||"planned");
  const[memo,setMemo]=useState(initial?.memo||"");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  // ─── 원자재 소요/재고 카드용 ───
  // 선택된 품목의 BOM(자식 = 원자재 or 반제품). BOM 재귀 조회를 위해 필요한 부모 BOM들 모두 캐시
  const[bomByParent,setBomByParent]=useState({}); // {parentId: [bomRow]}
  const[invData,setInvData]=useState(()=>loadStoredInventory()); // 재고시트 (raws)
  const[bomLoading,setBomLoading]=useState(false);
  // 재고시트 원격 fetch + 이벤트 구독
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      const remote=await loadRemoteInventory(adminHash);
      if(cancelled||!remote)return;
      const local=loadStoredInventory();
      // 원격이 새로우면 로컬 갱신
      if(!local||!local.savedAt||(remote.savedAt||"")>(local.savedAt||"")){
        applyRemoteInventoryToLocal(remote);
        setInvData(loadStoredInventory());
      }
    })();
    const reload=()=>setInvData(loadStoredInventory());
    window.addEventListener("aps-inv-data-change",reload);
    window.addEventListener("storage",reload);
    return()=>{
      cancelled=true;
      window.removeEventListener("aps-inv-data-change",reload);
      window.removeEventListener("storage",reload);
    };
  },[adminHash]);
  // itemId 변경 시 BOM 로드 (반제품이 자식이면 그 반제품의 BOM도 재귀 로드)
  useEffect(()=>{
    if(!itemId){setBomByParent({});return}
    let cancelled=false;
    (async()=>{
      setBomLoading(true);
      try{
        const cache={};
        const visited=new Set();
        const walk=async(pid)=>{
          if(visited.has(pid))return;
          visited.add(pid);
          const rows=await rpc("aps_list_bom",{p_admin_hash:adminHash,p_parent_id:pid});
          if(cancelled)return;
          cache[pid]=rows||[];
          // 자식 중 반제품/제품이 있으면 재귀
          for(const r of (rows||[])){
            if(r.child_type==="semi"||r.child_type==="product"){
              await walk(r.child_id);
              if(cancelled)return;
            }
          }
        };
        await walk(Number(itemId));
        if(!cancelled)setBomByParent(cache);
      }catch(e){console.error("[PlanForm] BOM load:",e)}
      if(!cancelled)setBomLoading(false);
    })();
    return()=>{cancelled=true};
  },[itemId,adminHash]);
  // 원자재 필요량 + 재고 매칭 계산
  const materialReport=useMemo(()=>{
    const itemById={};for(const it of items){itemById[it.id]=it}
    const need=(itemId&&Number(qty)>0)?calcMaterialRequirements(Number(itemId),Number(qty),bomByParent,itemById):{};
    // 원자재 재고 매칭
    const mats=items.filter(i=>i.type==="material");
    const stockByMat=matchRawsToMaterials(invData?.raws||[],mats);
    // 필요·재고를 원자재 기준으로 합쳐 리스트화
    const rows=[];
    for(const mid of Object.keys(need)){
      const mat=need[mid].item;
      const needKg=need[mid].kg;
      const stock=stockByMat[mid];
      rows.push({
        id:mid,
        name:mat.name,
        code:mat.code,
        keywords:parseMatchKeywords(mat.match_keywords),
        needKg,
        stockKg:stock?.totalKg||0,
        matches:stock?.matches||[],
        ok:(stock?.totalKg||0)>=needKg,
        hasKeywords:parseMatchKeywords(mat.match_keywords).length>0
      });
    }
    rows.sort((a,b)=>b.needKg-a.needKg);
    return rows;
  },[itemId,qty,bomByParent,items,invData]);

  const submit=async()=>{
    if(!itemId){setErr("품목을 선택하세요");return}
    const q=Number(qty);
    if(!q||q<=0){setErr("수량은 0보다 커야 합니다");return}
    if(!startAt||!endAt){setErr("시작/종료 시각을 입력하세요");return}
    if(endAt<=startAt){setErr("종료 시각은 시작 시각보다 뒤여야 합니다");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_upsert_plan",{
        p_admin_hash:adminHash,
        p_id:isEdit?initial.id:null,
        p_item_id:Number(itemId),
        p_line_id:lineId?Number(lineId):null,
        p_qty:q,
        p_start_at:kstInputToIso(startAt),
        p_end_at:kstInputToIso(endAt),
        p_status:status,
        p_memo:memo.trim()
      });
      onSaved();
    }catch(e){
      setErr(errMsg(e,{invalid_times:"종료 시각이 시작 시각 이전입니다",unauthorized:"인증 실패"}));
    }
    setLoading(false);
  };

  const producible=items.filter(i=>i.type==="product"||i.type==="semi");
  const selectedItem=producible.find(i=>String(i.id)===String(itemId));
  const filteredProducible=useMemo(()=>{
    const q=itemQuery.trim().toLowerCase();
    if(!q)return producible;
    return producible.filter(i=>{
      const code=(i.code||"").toLowerCase();
      const name=(i.name||"").toLowerCase();
      const label=(TYPE_LABEL[i.type]||"").toLowerCase();
      return code.includes(q)||name.includes(q)||label.includes(q);
    });
  },[producible,itemQuery]);
  useEffect(()=>{setItemHi(0)},[itemQuery,itemOpen]);
  const pickItem=(i)=>{
    setItemId(i.id);
    setItemQuery("");
    setItemOpen(false);
  };
  const onItemKey=(e)=>{
    if(!itemOpen&&(e.key==="ArrowDown"||e.key==="Enter")){setItemOpen(true);return}
    if(e.key==="ArrowDown"){e.preventDefault();setItemHi(h=>Math.min(h+1,filteredProducible.length-1))}
    else if(e.key==="ArrowUp"){e.preventDefault();setItemHi(h=>Math.max(h-1,0))}
    else if(e.key==="Enter"){e.preventDefault();const p=filteredProducible[itemHi];if(p)pickItem(p)}
    else if(e.key==="Escape"){setItemOpen(false)}
  };

  return <div className="aps-modal-bg aps-side" onClick={onCancel}>
    <div className="aps-modal aps-modal-side" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"14px"}}>{isEdit?"📅 생산계획 수정":"📅 생산계획 추가"}</div>
      <div className="aps-form-grid">
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">품목 * <span style={{color:"var(--muted)",fontWeight:400}}>(코드/이름 검색)</span></div>
          <div style={{position:"relative"}}>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <input
                className="aps-input"
                type="text"
                placeholder={selectedItem?`✓ [${TYPE_LABEL[selectedItem.type]}] ${selectedItem.code} - ${selectedItem.name}`:"품목 검색... (예: 우삼겹, F0000)"}
                value={itemQuery}
                onChange={e=>{setItemQuery(e.target.value);setItemOpen(true)}}
                onFocus={()=>setItemOpen(true)}
                onBlur={()=>setTimeout(()=>setItemOpen(false),150)}
                onKeyDown={onItemKey}
                style={{flex:1}}
              />
              {itemId&&<button
                type="button"
                className="aps-btn aps-btn-secondary"
                style={{padding:"6px 10px",fontSize:12}}
                onClick={()=>{setItemId("");setItemQuery("");setItemOpen(true)}}
                title="선택 해제">✕</button>}
            </div>
            {itemOpen&&<div style={{
              position:"absolute",top:"100%",left:0,right:0,marginTop:4,
              maxHeight:260,overflowY:"auto",zIndex:20,
              background:"var(--card-bg)",border:"1px solid var(--border)",borderRadius:7,
              boxShadow:"0 8px 24px rgba(0,0,0,0.18)"
            }}>
              {filteredProducible.length===0&&<div style={{padding:"12px",fontSize:12,color:"var(--muted)",textAlign:"center"}}>
                일치하는 품목이 없습니다
              </div>}
              {filteredProducible.map((i,idx)=>{
                const isSel=String(i.id)===String(itemId);
                const isHi=idx===itemHi;
                return <div key={i.id}
                  onMouseDown={e=>{e.preventDefault();pickItem(i)}}
                  onMouseEnter={()=>setItemHi(idx)}
                  style={{
                    padding:"8px 10px",cursor:"pointer",fontSize:12,
                    background:isHi?"rgba(6,182,212,0.12)":(isSel?"rgba(6,182,212,0.05)":"transparent"),
                    borderBottom:"1px solid var(--border)",
                    display:"flex",alignItems:"center",gap:8
                  }}>
                  <span style={{
                    fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:4,
                    background:i.type==="product"?"rgba(34,197,94,0.15)":"rgba(139,92,246,0.15)",
                    color:i.type==="product"?"#22c55e":"#8b5cf6",
                    minWidth:34,textAlign:"center"
                  }}>{TYPE_LABEL[i.type]}</span>
                  <span style={{color:"var(--muted)",fontSize:11,minWidth:70}}>{i.code}</span>
                  <span style={{flex:1,fontWeight:isSel?700:400}}>{i.name}</span>
                  {isSel&&<span style={{color:"#06b6d4",fontSize:12,fontWeight:700}}>✓</span>}
                </div>;
              })}
            </div>}
          </div>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">라인 {lines.length===0&&<span style={{color:"#f59e0b"}}>(먼저 등록 필요)</span>}</div>
          <select className="aps-select" style={{width:"100%"}} value={lineId} onChange={e=>setLineId(e.target.value)} disabled={lines.length===0}>
            <option value="">- 라인 미지정 -</option>
            {lines.map(l=><option key={l.id} value={l.id}>{l.code} · {l.name}</option>)}
          </select>
        </div>
        <div>
          <div className="aps-form-label">수량 *</div>
          <input className="aps-input" type="number" step="0.001" min="0" value={qty} onChange={e=>setQty(e.target.value)}/>
        </div>
        <div>
          <div className="aps-form-label">상태</div>
          <select className="aps-select" style={{width:"100%"}} value={status} onChange={e=>setStatus(e.target.value)}>
            <option value="planned">계획</option>
            <option value="in_progress">진행중</option>
            <option value="done">완료</option>
            <option value="canceled">취소</option>
          </select>
        </div>
        <div>
          <div className="aps-form-label">시작 시각 * <span style={{color:"var(--muted)",fontWeight:400}}>(KST)</span></div>
          <input className="aps-input" type="datetime-local" value={startAt} onChange={e=>setStartAt(e.target.value)}/>
        </div>
        <div>
          <div className="aps-form-label">종료 시각 * <span style={{color:"var(--muted)",fontWeight:400}}>(KST)</span></div>
          <input className="aps-input" type="datetime-local" value={endAt} onChange={e=>setEndAt(e.target.value)}/>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">메모</div>
          <textarea className="aps-input" value={memo} onChange={e=>setMemo(e.target.value)} maxLength={500} rows={2} style={{resize:"vertical"}}/>
        </div>
        {itemId&&Number(qty)>0&&<div style={{gridColumn:"1 / -1",padding:"12px",background:"rgba(148,163,184,0.06)",border:"1px solid var(--border)",borderRadius:"8px"}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:8,display:"flex",alignItems:"center",gap:6}}>
            <span>🥩 원자재 소요/재고</span>
            {bomLoading&&<span style={{fontSize:11,color:"var(--muted)",fontWeight:400}}>계산 중...</span>}
          </div>
          {!bomLoading&&materialReport.length===0&&<div style={{fontSize:12,color:"var(--muted)"}}>
            이 품목에 등록된 BOM에 원자재가 없습니다. 📦 품목/BOM 탭에서 원자재를 등록하고 이 제품의 BOM에 추가하세요.
          </div>}
          {!bomLoading&&materialReport.length>0&&<div style={{display:"flex",flexDirection:"column",gap:6}}>
            {materialReport.map(r=>{
              const shortage=r.needKg-r.stockKg;
              const bg=!r.hasKeywords?"rgba(148,163,184,0.10)":(r.ok?"rgba(34,197,94,0.08)":"rgba(239,68,68,0.08)");
              const borderColor=!r.hasKeywords?"var(--border)":(r.ok?"rgba(34,197,94,0.35)":"rgba(239,68,68,0.35)");
              return <div key={r.id} style={{padding:"8px 10px",background:bg,border:"1px solid "+borderColor,borderRadius:6,fontSize:12}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginBottom:4}}>
                  <div style={{fontWeight:700,fontSize:13}}>{r.name}</div>
                  <div style={{fontSize:11,color:"var(--muted)"}}>{r.code}</div>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <div style={{display:"flex",gap:12,alignItems:"baseline"}}>
                    <div><span style={{color:"var(--muted)"}}>필요</span> <b>{fmtKg(r.needKg)}</b></div>
                    <div><span style={{color:"var(--muted)"}}>재고</span> <b style={{color:r.hasKeywords?(r.ok?"#22c55e":"#ef4444"):"var(--muted)"}}>{fmtKg(r.stockKg)}</b></div>
                  </div>
                  {!r.hasKeywords?<div style={{fontSize:11,color:"var(--muted)",fontStyle:"italic"}}>⚠ 매칭 키워드 미설정</div>
                    :r.ok?<div style={{fontSize:11,color:"#22c55e",fontWeight:700}}>✓ 충분 (+{fmtKg(-shortage)} 여유)</div>
                    :<div style={{fontSize:11,color:"#ef4444",fontWeight:700}}>⚠ 부족 ({fmtKg(shortage)})</div>}
                </div>
                {r.hasKeywords&&r.matches.length>0&&<details style={{marginTop:6}}>
                  <summary style={{cursor:"pointer",fontSize:11,color:"var(--muted)"}}>매칭 원육 {r.matches.length}건</summary>
                  <div style={{marginTop:4,paddingLeft:8,borderLeft:"2px solid var(--border)"}}>
                    {r.matches.map((m,i)=><div key={i} style={{fontSize:11,color:"var(--muted)",padding:"2px 0"}}>
                      · {m.rawName} <b style={{color:"var(--text)"}}>{fmtKg(m.kg)}</b>
                    </div>)}
                  </div>
                </details>}
                {r.hasKeywords&&r.matches.length===0&&<div style={{marginTop:4,fontSize:11,color:"var(--muted)",fontStyle:"italic"}}>재고시트에서 매칭되는 원육 없음 (키워드: {r.keywords.join(", ")})</div>}
              </div>;
            })}
            {(!invData||!invData.raws||invData.raws.length===0)&&<div style={{fontSize:11,color:"var(--muted)",fontStyle:"italic",padding:"4px 2px"}}>재고시트에 원육 데이터가 없습니다. 📋 재고 시트 탭에서 업로드하세요.</div>}
          </div>}
        </div>}
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"저장 중...":(isEdit?"수정":"추가")}</button>
      </div>
    </div>
  </div>;
}

// ═══ 간트차트 뷰 (시간 단위, 라인 행) ═══
const GANTT_HOUR_W_PREF=84;   // 1시간 컬럼 기준 폭 (초기/참고용)
const GANTT_HOUR_W_MIN=56;    // 1시간 컬럼 최소 폭 (이보다 좁으면 가로 스크롤)
const GANTT_ROW_H=60;          // 라인 행 높이 (1레인 기준)
const GANTT_LANE_EXTRA=30;     // 레인 추가 시 늘어나는 높이 (2번째 이후)
const GANTT_LABEL_W_MIN=110;   // 좌측 라벨 폭 최소
const GANTT_LABEL_W_MAX=280;   // 좌측 라벨 폭 최대
const GANTT_HEADER_H=52;
const GANTT_LANE_GAP=3;        // 레인 간 간격
const rowHeightFor=(laneCount)=>GANTT_ROW_H+GANTT_LANE_EXTRA*Math.max(0,laneCount-1);

function GanttView({plans,lines,settings,dayStr,onPlanClick,onPlanTimeChange,onOpenSettings}){
  const workStart=parseInt(settings?.work_start_hour||"8");
  const workEnd=parseInt(settings?.work_end_hour||"17");
  const hourCount=Math.max(1,workEnd-workStart);
  const hours=useMemo(()=>{const a=[];for(let i=0;i<hourCount;i++)a.push(workStart+i);return a},[workStart,hourCount]);

  // ─── 드래그(시간 변경) 상태 ───
  // drag = {planId, mode: 'move'|'resize-l'|'resize-r', startX, origStartMs, origEndMs, deltaMs, moved}
  const [drag,setDrag]=useState(null);
  const SNAP_MS=15*60*1000;            // 15분 단위 스냅
  const MIN_DUR_MS=15*60*1000;         // 최소 길이 15분
  const dragRef=useRef(null);
  const plansRef=useRef(plans);
  const clickRef=useRef(onPlanClick);
  const timeChgRef=useRef(onPlanTimeChange);
  useEffect(()=>{dragRef.current=drag},[drag]);
  useEffect(()=>{plansRef.current=plans},[plans]);
  useEffect(()=>{clickRef.current=onPlanClick},[onPlanClick]);
  useEffect(()=>{timeChgRef.current=onPlanTimeChange},[onPlanTimeChange]);

  // drag.planId이 바뀔 때만(시작/종료) 핸들러 재바인딩 — delta 갱신마다 재바인딩 방지
  const dragId=drag?.planId??null;
  useEffect(()=>{
    if(dragId==null)return;
    const onMove=(e)=>{
      const d=dragRef.current;if(!d)return;
      const dx=e.clientX-d.startX;
      const msPerPx=3600000/(hourPxRef.current||GANTT_HOUR_W_PREF);
      const dms=Math.round((dx*msPerPx)/SNAP_MS)*SNAP_MS;
      const moved=d.moved||Math.abs(dx)>=4;
      if(d.deltaMs===dms&&d.moved===moved)return;
      setDrag({...d,deltaMs:dms,moved});
    };
    const onUp=(e)=>{
      const d=dragRef.current;
      setDrag(null);
      if(!d)return;
      if(!d.moved||Math.abs(e.clientX-d.startX)<4){
        const plan=plansRef.current.find(p=>p.id===d.planId);
        if(plan)clickRef.current?.(plan);
        return;
      }
      if(Math.abs(d.deltaMs)<SNAP_MS)return;
      const plan=plansRef.current.find(p=>p.id===d.planId);
      if(!plan||!timeChgRef.current)return;
      let s=d.origStartMs,en=d.origEndMs;
      if(d.mode==="move"){s+=d.deltaMs;en+=d.deltaMs;}
      else if(d.mode==="resize-l"){s+=d.deltaMs;if(s>en-MIN_DUR_MS)s=en-MIN_DUR_MS;}
      else if(d.mode==="resize-r"){en+=d.deltaMs;if(en<s+MIN_DUR_MS)en=s+MIN_DUR_MS;}
      timeChgRef.current(plan,s,en);
    };
    window.addEventListener("mousemove",onMove);
    window.addEventListener("mouseup",onUp);
    return()=>{
      window.removeEventListener("mousemove",onMove);
      window.removeEventListener("mouseup",onUp);
    };
  },[dragId]);

  // 선택 일자의 KST 00:00 / 24:00 UTC 시각 계산
  const dayBounds=useMemo(()=>{
    // dayStr는 KST 기준 YYYY-MM-DD. KST 00:00 = UTC (전날 15:00)
    const dayStartIso=dayStr+"T00:00:00+09:00";
    const dayStartMs=new Date(dayStartIso).getTime();
    const workStartMs=dayStartMs+workStart*3600*1000;
    const workEndMs=dayStartMs+workEnd*3600*1000;
    return{dayStartMs,workStartMs,workEndMs};
  },[dayStr,workStart,workEnd]);

  // 라인이 없으면 "라인 미지정" 가상 라인 하나 추가
  const displayLines=useMemo(()=>{
    const ls=[...lines];
    const hasUnassigned=plans.some(p=>!p.line_id);
    if(hasUnassigned||ls.length===0)ls.push({id:null,code:"-",name:"미지정",virtual:true});
    return ls;
  },[lines,plans]);

  // 라인별 표시 계획 + 레인 할당
  const layoutByLine=useMemo(()=>{
    const{workStartMs,workEndMs}=dayBounds;
    const result=new Map();
    for(const line of displayLines){
      // 이 라인 계획 중 윈도우와 겹치는 것만
      const linePlans=plans.filter(p=>(p.line_id||null)===(line.id||null)).map(p=>{
        const ps=new Date(p.start_at).getTime();
        const pe=new Date(p.end_at).getTime();
        if(pe<=workStartMs||ps>=workEndMs)return null;
        const vs=Math.max(ps,workStartMs);
        const ve=Math.min(pe,workEndMs);
        const leftHour=(vs-workStartMs)/3600000;          // 0 ~ hourCount
        const widthHour=(ve-vs)/3600000;
        return{
          plan:p,
          startMs:ps,endMs:pe,
          leftHour,widthHour,
          leftEdge:ps<workStartMs,rightEdge:pe>workEndMs,
          lane:0
        };
      }).filter(Boolean);

      // 시작순 정렬 후 레인 할당 (greedy)
      linePlans.sort((a,b)=>a.startMs-b.startMs);
      const laneEnds=[]; // 각 레인의 마지막 endMs
      for(const lp of linePlans){
        let placed=false;
        for(let i=0;i<laneEnds.length;i++){
          if(laneEnds[i]<=lp.startMs){
            lp.lane=i;laneEnds[i]=lp.endMs;placed=true;break;
          }
        }
        if(!placed){lp.lane=laneEnds.length;laneEnds.push(lp.endMs);}
      }
      result.set(line.id===null?"null":line.id,{laneCount:Math.max(1,laneEnds.length),plans:linePlans});
    }
    return result;
  },[plans,displayLines,dayBounds]);

  // 오늘인지 + 현재 시각 라인 위치
  const nowKst=isoToKstHourFloat(new Date().toISOString());
  const todayKstDate=isoToKstDateStr(new Date().toISOString());
  const isViewingToday=dayStr===todayKstDate;
  const nowLeftHour=nowKst-workStart;
  const showNowLine=isViewingToday&&nowLeftHour>=0&&nowLeftHour<=hourCount;

  const gridMinW=hourCount*GANTT_HOUR_W_MIN;
  const totalVisible=Array.from(layoutByLine.values()).reduce((a,v)=>a+v.plans.length,0);

  // 우측 시간 그리드 실제 폭 측정 → 시간 컬럼이 유동적으로 늘어났다 줄었다
  const gridRef=useRef(null);
  const hourPxRef=useRef(GANTT_HOUR_W_PREF);
  const [gridPx,setGridPx]=useState(hourCount*GANTT_HOUR_W_PREF);
  useEffect(()=>{
    const el=gridRef.current;
    if(!el)return;
    const update=()=>{
      const w=el.clientWidth||hourCount*GANTT_HOUR_W_PREF;
      hourPxRef.current=w/hourCount;
      setGridPx(w);
    };
    update();
    const ro=new ResizeObserver(update);
    ro.observe(el);
    return()=>ro.disconnect();
  },[hourCount]);
  const hourPx=gridPx/hourCount;

  // 좌측 라벨 폭: 가장 긴 라인 이름/메모에 맞춰 동적 계산
  const labelW=useMemo(()=>{
    const measure=(text,sizePx,bold)=>{
      if(!text)return 0;
      const koreanW=sizePx*(bold?1.05:1.0);
      const latinW=sizePx*(bold?0.62:0.56);
      let w=0;
      for(const c of text){
        if(/[가-힯ㄱ-ㆎ]/.test(c))w+=koreanW;
        else if(c===" ")w+=sizePx*0.35;
        else w+=latinW;
      }
      return w;
    };
    let max=measure("라인",14,true);  // 헤더 텍스트 보장
    for(const line of displayLines){
      const key=line.id===null?"null":line.id;
      const info=layoutByLine.get(key)||{plans:[]};
      const top=measure(line.name||"",15,true);
      const bottomText=(line.memo||line.code||"")+(info.plans.length>0?` · ${info.plans.length}건`:"");
      const bottom=measure(bottomText,12,false);
      if(top>max)max=top;
      if(bottom>max)max=bottom;
    }
    // padding 12+12 + 여유 16
    return Math.min(GANTT_LABEL_W_MAX,Math.max(GANTT_LABEL_W_MIN,Math.ceil(max)+40));
  },[displayLines,layoutByLine]);

  return <div>
    <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
      <span style={{fontSize:14,color:"var(--muted)"}}>
        근무 {String(workStart).padStart(2,"0")}:00 – {String(workEnd).padStart(2,"0")}:00 · 표시 {totalVisible}/{plans.length}건
      </span>
      <div style={{flex:1}}></div>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={onOpenSettings}>⚙ 근무시간</button>
    </div>

    {plans.length===0?
      <Empty emoji="📅" text="표시할 생산계획이 없습니다"/>:
      <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8,background:"var(--bg)"}}>
        <div style={{display:"flex",minWidth:labelW+gridMinW}}>

          {/* ─── 좌측 라인 라벨 컬럼 ─── */}
          <div style={{width:labelW,flexShrink:0,position:"sticky",left:0,zIndex:2,background:"var(--bg)",borderRight:"1px solid var(--div2)"}}>
            <div style={{height:GANTT_HEADER_H,padding:"12px 14px",fontSize:14,fontWeight:600,color:"var(--muted)",borderBottom:"1px solid var(--div2)",background:"var(--card-bg)",boxSizing:"border-box"}}>라인</div>
            {displayLines.map(line=>{
              const key=line.id===null?"null":line.id;
              const info=layoutByLine.get(key)||{laneCount:1,plans:[]};
              const rowH=rowHeightFor(info.laneCount);
              const lc=lineColorFor(line.id,lines);
              return <div key={key} style={{height:rowH,padding:"8px 12px 8px 14px",borderBottom:"1px solid var(--div)",borderLeft:`6px solid ${lc.base}`,boxSizing:"border-box",overflow:"hidden",display:"flex",flexDirection:"column",justifyContent:"center"}}>
                <div style={{fontWeight:600,fontSize:15,color:line.virtual?"var(--muted)":"var(--text)",lineHeight:1.3,wordBreak:"keep-all",overflowWrap:"break-word"}}>{line.name}</div>
                <div style={{fontSize:12,color:"var(--muted)",marginTop:2,lineHeight:1.35,wordBreak:"keep-all",overflowWrap:"break-word"}}>{line.memo||line.code}{info.plans.length>0&&<span style={{marginLeft:6,color:"var(--dimmer)"}}>· {info.plans.length}건</span>}</div>
              </div>;
            })}
          </div>

          {/* ─── 우측 시간 그리드 ─── */}
          <div ref={gridRef} style={{position:"relative",flex:1,minWidth:gridMinW}}>
            {/* 헤더 (시간) — 라벨이 컬럼 경계선에 위치 (N+1개, 시작 + 매시 + 종료) */}
            <div style={{display:"flex",height:GANTT_HEADER_H,borderBottom:"1px solid var(--div2)",background:"var(--card-bg)",position:"relative"}}>
              {/* 배경 셀 (시간 경계선용) */}
              {hours.map((h,i)=><div key={i} style={{
                flex:1,minWidth:GANTT_HOUR_W_MIN,
                borderRight:i===hourCount-1?"none":"1px solid var(--div)",
                boxSizing:"border-box"
              }}/>)}
              {/* 경계선 시간 라벨 (workStart ~ workEnd, hourCount+1개) */}
              {Array.from({length:hourCount+1}).map((_,i)=>{
                const isFirst=i===0;
                const isLast=i===hourCount;
                return <div key={"t"+i} style={{
                  position:"absolute",
                  top:0,height:GANTT_HEADER_H,
                  left:i*hourPx,
                  transform:isFirst?"none":isLast?"translateX(-100%)":"translateX(-50%)",
                  fontSize:13,color:"var(--muted)",fontWeight:500,
                  display:"flex",alignItems:"center",padding:"0 6px",
                  whiteSpace:"nowrap",pointerEvents:"none"
                }}>
                  {String(workStart+i).padStart(2,"0")}:00
                </div>;
              })}
            </div>

            {/* 각 라인 행 */}
            {displayLines.map(line=>{
              const key=line.id===null?"null":line.id;
              const info=layoutByLine.get(key)||{laneCount:1,plans:[]};
              const rowH=rowHeightFor(info.laneCount);
              const laneH=(rowH-8-GANTT_LANE_GAP*Math.max(0,info.laneCount-1))/Math.max(1,info.laneCount);
              return <div key={key} style={{height:rowH,position:"relative",borderBottom:"1px solid var(--div)",display:"flex"}}>
                {/* 배경 셀 (시간 그리드) */}
                {hours.map((h,i)=><div key={i} style={{
                  flex:1,minWidth:GANTT_HOUR_W_MIN,
                  borderRight:i===hourCount-1?"none":"1px solid var(--div)",
                  boxSizing:"border-box"
                }}/>)}
                {/* 막대 (레인별 스택) */}
                {info.plans.map(lp=>{
                  const lc=lineColorFor(lp.plan.line_id,lines);
                  const st=lp.plan.status;
                  const statusOpacity=st==="canceled"?0.45:st==="done"?0.72:st==="planned"?0.9:1;
                  const isDraggable=st==="planned"||st==="in_progress";
                  const isDragging=drag?.planId===lp.plan.id;

                  // 드래그 중이면 effective 시간 재계산
                  let effStartMs=lp.startMs,effEndMs=lp.endMs;
                  if(isDragging){
                    if(drag.mode==="move"){effStartMs+=drag.deltaMs;effEndMs+=drag.deltaMs;}
                    else if(drag.mode==="resize-l"){effStartMs+=drag.deltaMs;if(effStartMs>effEndMs-MIN_DUR_MS)effStartMs=effEndMs-MIN_DUR_MS;}
                    else if(drag.mode==="resize-r"){effEndMs+=drag.deltaMs;if(effEndMs<effStartMs+MIN_DUR_MS)effEndMs=effStartMs+MIN_DUR_MS;}
                  }
                  const {workStartMs,workEndMs}=dayBounds;
                  const evs=Math.max(effStartMs,workStartMs);
                  const eve=Math.min(effEndMs,workEndMs);
                  const effLeftHour=(evs-workStartMs)/3600000;
                  const effWidthHour=Math.max(0,eve-evs)/3600000;
                  const effLeftEdge=effStartMs<workStartMs;
                  const effRightEdge=effEndMs>workEndMs;

                  const tipPlan=isDragging
                    ?`드래그 중: ${fmtKstDateTime(new Date(effStartMs).toISOString())} ~ ${fmtKstDateTime(new Date(effEndMs).toISOString())}`
                    :`계획: ${fmtKstDateTime(lp.plan.start_at)} ~ ${fmtKstDateTime(lp.plan.end_at)}`;
                  const tipActual=lp.plan.actual_start_at||lp.plan.actual_end_at
                    ?`\n실제: ${fmtKstDateTime(lp.plan.actual_start_at)||"-"} ~ ${fmtKstDateTime(lp.plan.actual_end_at)||"진행중"}`
                    :"";
                  const tipHint=isDraggable?"\n💡 드래그=이동, 좌우 끝 드래그=시간 조정":"";

                  const onBarDown=(e)=>{
                    if(e.button!==0)return;            // 좌클릭만
                    if(!isDraggable){onPlanClick(lp.plan);return;}
                    const rect=e.currentTarget.getBoundingClientRect();
                    const offX=e.clientX-rect.left;
                    const w=rect.width;
                    const edge=Math.min(12,Math.max(6,w*0.2));
                    let mode="move";
                    if(offX<edge)mode="resize-l";
                    else if(offX>w-edge)mode="resize-r";
                    setDrag({
                      planId:lp.plan.id,mode,
                      startX:e.clientX,
                      origStartMs:lp.startMs,origEndMs:lp.endMs,
                      deltaMs:0,moved:false
                    });
                    e.preventDefault();
                    e.stopPropagation();
                  };
                  const onBarHover=(e)=>{
                    if(drag||!isDraggable)return;
                    const rect=e.currentTarget.getBoundingClientRect();
                    const offX=e.clientX-rect.left;
                    const w=rect.width;
                    const edge=Math.min(12,Math.max(6,w*0.2));
                    e.currentTarget.style.cursor=(offX<edge||offX>w-edge)?"ew-resize":"move";
                  };

                  return <div key={lp.plan.id} className="aps-gantt-bar" onMouseDown={onBarDown} onMouseMove={onBarHover}
                    title={`${lp.plan.item_name} · ${STATUS_LABEL[st]} · ${fmtNum(lp.plan.qty)}${lp.plan.item_unit}\n${tipPlan}${tipActual}${tipHint}`}
                    style={{
                      position:"absolute",
                      left:effLeftHour*hourPx+2,
                      width:Math.max(effWidthHour*hourPx-4,12),
                      top:4+lp.lane*(laneH+GANTT_LANE_GAP),
                      height:laneH,
                      background:lc.bg,
                      border:`1px ${st==="planned"?"dashed":"solid"} ${lc.base}`,
                      borderLeftWidth:effLeftEdge?4:(st==="planned"?1:1),
                      borderRightWidth:effRightEdge?4:(st==="planned"?1:1),
                      padding:"0 8px",
                      fontSize:12,fontWeight:600,
                      color:lc.base,
                      textDecoration:st==="canceled"?"line-through":"none",
                      whiteSpace:"nowrap",
                      display:"flex",alignItems:"center",
                      cursor:isDraggable?"move":"pointer",
                      userSelect:"none",
                      opacity:isDragging?0.85:statusOpacity,
                      boxShadow:isDragging?"0 4px 14px rgba(0,0,0,0.35)":undefined,
                      zIndex:isDragging?4:undefined
                    }}>
                    {st==="done"&&<span style={{marginRight:4,fontWeight:800}}>✓</span>}
                    {st==="in_progress"&&<span style={{marginRight:4,fontWeight:800}}>▶</span>}
                    {lp.plan.item_name} · {fmtNum(lp.plan.qty)}{lp.plan.item_unit}
                  </div>;
                })}
              </div>;
            })}

            {/* 현재 시각 세로 선 */}
            {showNowLine&&<div style={{
              position:"absolute",
              left:nowLeftHour*hourPx-1,
              top:0,
              width:2,
              height:GANTT_HEADER_H+displayLines.reduce((a,line)=>{
                const k=line.id===null?"null":line.id;
                return a+rowHeightFor((layoutByLine.get(k)?.laneCount)||1);
              },0),
              background:"#ef4444",
              pointerEvents:"none",
              zIndex:1,
              opacity:.6
            }}/>}
          </div>
        </div>
      </div>
    }
    <div style={{fontSize:13,color:"var(--dimmer)",marginTop:10,lineHeight:1.55}}>
      ※ 막대 클릭 → 수정 · <b style={{color:"var(--muted)"}}>막대 가운데 드래그</b> = 통째로 이동 · <b style={{color:"var(--muted)"}}>좌우 끝 드래그</b> = 시작·종료 시각 조정 (15분 단위) · 좌우 두꺼운 테두리 = 근무 외 시간으로 연장 · 빨강 세로선 = 현재 시각 · 완료·취소된 계획은 드래그 불가
    </div>
  </div>;
}

// ─── 시간표 뷰 (학교 시간표 스타일) ───
// 행=시간(1시간 단위), 열=라인. 각 셀에 품목·수량·시작~종료 시각을 큰 글씨로 표시
function TimetableView({plans,lines,settings,dayStr,onPlanClick,onOpenSettings}){
  const workStart=parseInt(settings?.work_start_hour||"8");
  const workEnd=parseInt(settings?.work_end_hour||"17");
  const hours=useMemo(()=>{const a=[];for(let h=workStart;h<workEnd;h++)a.push(h);return a},[workStart,workEnd]);

  // 라인 목록 (계획 중 라인 미지정 있으면 가상 "미지정" 라인 추가)
  const displayLines=useMemo(()=>{
    const ls=[...lines];
    const hasUnassigned=plans.some(p=>!p.line_id);
    if(hasUnassigned||ls.length===0)ls.push({id:null,code:"-",name:"미지정",virtual:true});
    return ls;
  },[lines,plans]);

  // 셀 맵: `${lineKey}:${hour}` → {primary, isAnchor, extraCount}
  // primary = 이 시간을 점유하는 계획 중 가장 먼저 시작한 것
  // isAnchor = primary가 이 셀에서 시작 (또는 근무 시작 이전부터 진행 중)
  const dayStartMs=useMemo(()=>new Date(dayStr+"T00:00:00+09:00").getTime(),[dayStr]);
  const cellInfo=useMemo(()=>{
    const map=new Map();
    const visibleSet=new Set();
    const workStartMs=dayStartMs+workStart*3600000;
    for(const line of displayLines){
      const lineKey=line.id===null?"null":line.id;
      const linePlans=plans.filter(p=>(p.line_id||null)===(line.id||null))
        .map(p=>({plan:p,ps:new Date(p.start_at).getTime(),pe:new Date(p.end_at).getTime()}))
        .sort((a,b)=>a.ps-b.ps);
      for(const h of hours){
        const hStart=dayStartMs+h*3600000;
        const hEnd=hStart+3600000;
        const occupants=linePlans.filter(lp=>lp.pe>hStart&&lp.ps<hEnd);
        if(occupants.length===0)continue;
        const primary=occupants[0];
        const startsInCell=primary.ps>=hStart&&primary.ps<hEnd;
        const isAnchor=startsInCell||(h===workStart&&primary.ps<workStartMs);
        map.set(`${lineKey}:${h}`,{
          primary:primary.plan,
          isAnchor,
          extraCount:occupants.length-1
        });
        occupants.forEach(o=>visibleSet.add(o.plan.id));
      }
    }
    return {map,visibleCount:visibleSet.size};
  },[plans,displayLines,hours,workStart,dayStartMs]);

  // 현재 시각 행 강조
  const nowDayStr=isoToKstDateStr(new Date().toISOString());
  const nowHour=Math.floor(isoToKstHourFloat(new Date().toISOString()));
  const isToday=dayStr===nowDayStr;

  return <div>
    <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
      <span style={{fontSize:14,color:"var(--muted)"}}>
        근무 {String(workStart).padStart(2,"0")}:00 – {String(workEnd).padStart(2,"0")}:00 · 표시 {cellInfo.visibleCount}/{plans.length}건
      </span>
      <div style={{flex:1}}></div>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={onOpenSettings}>⚙ 근무시간</button>
    </div>

    <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8,background:"var(--card-bg)"}}>
      <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed",minWidth:88+displayLines.length*170}}>
        <colgroup>
          <col style={{width:88}}/>
          {displayLines.map((_,i)=><col key={i}/>)}
        </colgroup>
        <thead>
          <tr>
            <th style={{padding:"12px 8px",fontSize:13,fontWeight:600,color:"var(--muted)",borderBottom:"1px solid var(--div2)",textAlign:"center",background:"var(--card-bg)"}}>시간</th>
            {displayLines.map((line,i)=>{
              const lc=lineColorFor(line.id,lines);
              return <th key={i} style={{padding:"12px",fontSize:16,fontWeight:600,color:"var(--text)",borderBottom:"1px solid var(--div2)",borderLeft:"1px solid var(--div2)",borderTop:`4px solid ${lc.base}`,textAlign:"left",background:"var(--card-bg)",wordBreak:"break-word"}}>
                {line.name||line.code||"-"}
                {(line.memo||(!line.virtual&&line.code))&&<div style={{fontSize:11,color:"var(--muted)",fontWeight:400,marginTop:2}}>{line.memo||line.code}</div>}
              </th>;
            })}
          </tr>
        </thead>
        <tbody>
          {hours.map(h=>{
            const isNowRow=isToday&&nowHour===h;
            return <tr key={h}>
              <td style={{padding:"12px 8px",fontSize:17,fontWeight:600,color:isNowRow?"#ef4444":"var(--muted)",background:"var(--card-bg)",borderTop:"1px solid var(--div2)",textAlign:"center",verticalAlign:"top",fontVariantNumeric:"tabular-nums"}}>
                {String(h).padStart(2,"0")}:00
              </td>
              {displayLines.map((line,li)=>{
                const lineKey=line.id===null?"null":line.id;
                const cell=cellInfo.map.get(`${lineKey}:${h}`);
                if(!cell){
                  return <td key={li} style={{padding:0,borderTop:"1px solid var(--div2)",borderLeft:"1px solid var(--div2)",height:88}}></td>;
                }
                const p=cell.primary;
                const lc=lineColorFor(p.line_id,lines);
                const pill=STATUS_PILL[p.status]||{bg:"rgba(148,163,184,0.18)",fg:"#94a3b8"};
                const cellOpacity=p.status==="canceled"?0.45:p.status==="done"?0.75:1;
                const tipPlan=`계획: ${fmtKstDateTime(p.start_at)} ~ ${fmtKstDateTime(p.end_at)}`;
                const tipActual=p.actual_start_at
                  ?`\n실제: ${fmtKstDateTime(p.actual_start_at)||"-"} ~ ${fmtKstDateTime(p.actual_end_at)||"진행중"}`
                  :"";
                return <td key={li} onClick={()=>onPlanClick?.(p)}
                  title={`${p.item_name} · ${STATUS_LABEL[p.status]} · ${fmtNum(p.qty)}${p.item_unit||""}\n${tipPlan}${tipActual}`}
                  style={{
                    padding:0,
                    borderTop:cell.isAnchor?`2px solid ${lc.base}`:`1px dashed ${lc.base}`,
                    borderLeft:"1px solid var(--div2)",
                    background:lc.bg,
                    cursor:"pointer",
                    height:88,
                    verticalAlign:"top",
                    opacity:cellOpacity
                  }}>
                  {cell.isAnchor&&<div style={{padding:"10px 12px"}}>

                    </div>
                  </div>}
                </td>;

    </div>
  </div>;

// 주간 요약 사이드 패널 — 리스트 뷰에서만 표시. 한 주 안에서 요일별로 계획 나열
const DOW_LABEL=["월","화","수","목","금","토","일"];

// 이미지 저장용 가로 캘린더 (오프스크린 렌더 → html2canvas 캡처)
// 주말은 계획 없으면 숨김 / 같은 날 같은 품목은 머지 / 시간·라인 표시 없음
// 같은 날 같은 품목 머지 — 수량은 합산하지 않고 첫 계획의 수량만 노출
function mergeDayItems(plans){
  const byItem={};
  plans.forEach(p=>{
    const k=p.item_id;
    if(!byItem[k]){
      byItem[k]={item_id:p.item_id,item_name:p.item_name,item_unit:p.item_unit,qty:Number(p.qty)||0,count:0};
    }
    byItem[k].count++;
  });
  return Object.values(byItem).sort((a,b)=>b.qty-a.qty);
}

// 이미지 저장용 생산계획 리포트 (오프스크린 렌더 → html2canvas 캡처)
// 라인별 그룹 + 인쇄 친화 라이트 테마. viewMode 무관하게 항상 동일 레이아웃
function ExportPlansView({plans,lines,dayStr,allDates,matsByPlan,width=820}){
  const C={bg:"#ffffff",text:"#0f172a",muted:"#64748b",border:"#e2e8f0",cardBg:"#f8fafc",lineHdr:"#ecfeff",lineHdrBd:"#a5f3fc",rowAlt:"#fafbfc",matBg:"#fff7ed",matBd:"#fed7aa",matName:"#9a3412",matStock:"#166534",matShort:"#b91c1c"};
  const S={
    planned:{bg:"#f1f5f9",fg:"#475569"},
    in_progress:{bg:"#cffafe",fg:"#0891b2"},
    done:{bg:"#dcfce7",fg:"#16a34a"},
    canceled:{bg:"#fee2e2",fg:"#b91c1c"}
  };
  const groups=[];
  const map=new Map();
  plans.forEach(p=>{
    const k=p.line_id||"__none__";
    if(!map.has(k))map.set(k,{line_id:p.line_id||null,line_name:p.line_name||"",plans:[]});
    map.get(k).plans.push(p);
  });
  for(const g of map.values()){
    const ln=g.line_id?lines.find(l=>l.id===g.line_id):null;
    groups.push({...g,line_memo:(ln?.memo||"").trim(),line_code:ln?.code||""});
  }
  groups.sort((a,b)=>{
    if(!a.line_id&&b.line_id)return 1;
    if(a.line_id&&!b.line_id)return -1;
    return (a.line_code||"").localeCompare(b.line_code||"");
  });
  const totalCount=plans.length;
  const dowOfDayStr=(()=>{
    if(allDates||!dayStr)return"";
    const[y,m,d]=dayStr.split("-").map(Number);
    if(!y||!m||!d)return"";
    return DOW_LABEL[(new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7];
  })();
  const dateLabel=allDates?"전체 기간":`${dayStr.replace(/-/g,".")}${dowOfDayStr?` (${dowOfDayStr})`:""}`;
  const subLabel=allDates?"ALL PERIODS":"DAILY PLAN";
  const fmtDtDow=(iso)=>{
    if(!iso)return"";
    const d=new Date(iso);
    if(isNaN(d.getTime()))return"";
    const kst=new Date(d.getTime()+KST_OFFSET_MS);
    const h=String(kst.getUTCHours()).padStart(2,"0");
    const mi=String(kst.getUTCMinutes()).padStart(2,"0");
    if(!allDates)return `${h}:${mi}`;
    const mo=String(kst.getUTCMonth()+1).padStart(2,"0");
    const da=String(kst.getUTCDate()).padStart(2,"0");
    const dow=DOW_LABEL[(kst.getUTCDay()+6)%7];
    return `${mo}/${da}(${dow}) ${h}:${mi}`;
  };
  return <div style={{background:C.bg,color:C.text,fontFamily:"Pretendard, -apple-system, system-ui, sans-serif",padding:"24px 28px 18px",width,boxSizing:"border-box"}}>
    <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:16,borderBottom:`2px solid ${C.text}`,paddingBottom:10}}>
      <div>
        <div style={{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:".15em"}}>PRODUCTION PLAN · {subLabel}</div>
        <div style={{fontSize:22,fontWeight:800,marginTop:4,letterSpacing:"-.01em"}}>{dateLabel}</div>
      </div>
      <div style={{textAlign:"right"}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600}}>총 계획</div>
        <div style={{fontSize:24,fontWeight:800,color:C.text}}>{totalCount}건</div>
      </div>
    </div>
    {groups.length===0?
      <div style={{padding:"60px 20px",textAlign:"center",color:C.muted,fontSize:14,border:`1px dashed ${C.border}`,borderRadius:8}}>표시할 생산계획이 없습니다</div>:
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {groups.map(g=>{
          const lc=lineColorFor(g.line_id,lines);
          return (
          <div key={g.line_id||"none"} style={{border:`1px solid ${C.border}`,borderLeft:`5px solid ${lc.base}`,borderRadius:8,overflow:"hidden"}}>
            <div style={{background:lc.bgLight,borderBottom:`1px solid ${lc.bdLight}`,padding:"9px 14px",display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:14,fontWeight:800,color:lc.fgLight}}>🏭 {g.line_id?g.line_name:"라인 미지정"}</span>
              {g.line_memo&&<span style={{fontSize:12,color:C.muted,fontWeight:500}}>{g.line_memo}</span>}
              <span style={{marginLeft:"auto",fontSize:11,color:C.muted,fontWeight:700}}>{g.plans.length}건</span>
            </div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,tableLayout:"fixed"}}>
              <colgroup>
                <col style={{width:"36%"}}/>
                <col style={{width:"16%"}}/>
                <col style={{width:"33%"}}/>
                <col style={{width:"15%"}}/>
              </colgroup>
              <tbody>
                {g.plans.map((p,idx)=>{
                  const st=S[p.status]||S.planned;
                  const mats=(matsByPlan&&matsByPlan[p.id])||[];
                  const rowBg=idx%2===1?C.rowAlt:"transparent";
                  return <tr key={p.id} style={{borderTop:idx===0?"none":`1px solid ${C.border}`,background:rowBg}}>
                    <td style={{padding:"9px 14px",verticalAlign:"middle"}}>
                      <div style={{fontWeight:700,fontSize:13,color:C.text,lineHeight:1.3}}>{p.item_name}</div>
                      {mats.length>0&&<div style={{marginTop:3,fontSize:11,color:C.matName,lineHeight:1.45}}>
                        {mats.map((m,mi)=><div key={mi}>
                          <span style={{fontWeight:700}}>🥩 {m.name}</span>
                          <span> - <b>{fmtKg(m.needKg)}</b></span>
                        </div>)}
                      </div>}
                      {p.memo&&p.memo.trim()&&<div style={{marginTop:4,padding:"4px 8px",background:"#f1f5f9",border:"1px solid #cbd5e1",borderLeft:"3px solid #64748b",borderRadius:4,fontSize:12,color:"#334155",fontWeight:600,lineHeight:1.35,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>📝 {p.memo}</div>}
                    </td>
                    <td style={{padding:"9px 6px",verticalAlign:"middle",textAlign:"right"}}>
                      <div>
                        <span style={{fontWeight:700,fontSize:13}}>{fmtNum(p.qty)}</span>
                        <span style={{color:C.muted,fontWeight:500,fontSize:11,marginLeft:3}}>{p.item_unit||""}</span>
                      </div>
                      {(()=>{const kg=parseSpecKg(p.item_spec);if(kg==null)return null;return <div style={{fontSize:12,color:C.text,marginTop:2,fontWeight:700,whiteSpace:"nowrap"}}>{fmtKg(kg*(p.qty||0))}</div>;})()}
                    </td>
                    <td style={{padding:"9px 10px",verticalAlign:"middle",color:C.muted,fontSize:11,lineHeight:1.5}}>
                      <div>{fmtDtDow(p.start_at)}</div>
                      <div>~ {fmtDtDow(p.end_at)}</div>
                    </td>
                    <td style={{padding:"9px 14px 9px 6px",verticalAlign:"middle",textAlign:"right"}}>
                      <span style={{background:st.bg,color:st.fg,padding:"3px 10px",borderRadius:10,fontSize:11,fontWeight:700,display:"inline-block"}}>{STATUS_LABEL[p.status]}</span>
                    </td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
          );
        })}
      </div>
    }
    <div style={{marginTop:14,display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:10,color:C.muted}}>
      <span style={{fontWeight:700,letterSpacing:".08em"}}>STOCKPULSE · APS</span>
      <span>Generated {new Date().toLocaleString("ko-KR")}</span>
    </div>
  </div>;
}

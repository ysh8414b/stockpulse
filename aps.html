function PlansTab({adminHash}){
  const[plans,setPlans]=useState([]);
  const[items,setItems]=useState([]);
  const[lines,setLines]=useState([]);
  const[settings,setSettings]=useState({work_start_hour:"8",work_end_hour:"17"});
  const[loading,setLoading]=useState(true);
  const[filter,setFilter]=useState("all");
  const[editing,setEditing]=useState(null);
  const[showForm,setShowForm]=useState(false);
  const[showSettings,setShowSettings]=useState(false);
  // 재고시트 데이터 (PNG export 시 원육 표시용) — PC/모바일 동기화
  const[invData,setInvData]=useState(()=>loadStoredInventory());
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      const remote=await loadRemoteInventory(adminHash);
      if(cancelled||!remote)return;
      const local=loadStoredInventory();
      if(!local||!local.savedAt||(remote.savedAt||"")>(local.savedAt||"")){
        applyRemoteInventoryToLocal(remote);
        setInvData(loadStoredInventory());
      }
    })();
    const reload=()=>setInvData(loadStoredInventory());
    window.addEventListener("aps-inv-data-change",reload);
    window.addEventListener("storage",reload);
    return()=>{
      cancelled=true;
      window.removeEventListener("aps-inv-data-change",reload);
      window.removeEventListener("storage",reload);
    };
  },[adminHash]);
  // PNG export 직전에 계산되는 원자재 요약 (planId → [{name, needKg, matches:[{rawName,kg}]}])
  const[exportMats,setExportMats]=useState({});
  // 리스트 뷰용 BOM 캐시 (items 로드 시 1회 미리 fetch, 이후 useMemo로 원자재 소요/재고 계산)
  const[bomByParent,setBomByParent]=useState({});
  const[viewMode,setViewMode]=useState(()=>{
    try{const v=localStorage.getItem("aps-plan-view-mode");return (v==="list"||v==="gantt"||v==="timetable")?v:"gantt"}catch(e){return "gantt"}
  });
  useEffect(()=>{try{localStorage.setItem("aps-plan-view-mode",viewMode)}catch(e){}},[viewMode]);
  const[dayStr,setDayStr]=useState(()=>todayStr());
  const[allDates,setAllDates]=useState(false);
  const[weekPanelOpen,setWeekPanelOpen]=useState(false);
  const[invPanelOpen,setInvPanelOpen]=useState(()=>{
    try{return localStorage.getItem("aps-inv-panel-open")==="1"}catch(e){return false}
  });
  useEffect(()=>{try{localStorage.setItem("aps-inv-panel-open",invPanelOpen?"1":"0")}catch(e){}},[invPanelOpen]);

  const shiftDay=(n)=>{
    const[y,m,d]=dayStr.split("-").map(Number);
    const dt=new Date(Date.UTC(y,m-1,d));
    dt.setUTCDate(dt.getUTCDate()+n);
    setDayStr(dt.toISOString().slice(0,10));
    setAllDates(false);
  };

  const load=useCallback(async()=>{
    try{
      const[plD,itD,lnD,stD]=await Promise.all([
        rpc("aps_list_plans",{p_admin_hash:adminHash,p_status:null}),
        rpc("aps_list_items",{p_admin_hash:adminHash}),
        rpc("aps_list_lines",{p_admin_hash:adminHash}),
        rpc("aps_get_settings",{p_admin_hash:adminHash})
      ]);
      setPlans(plD||[]);setItems(itD||[]);setLines(lnD||[]);
      if(stD&&typeof stD==="object")setSettings(s=>({...s,...stD}));
    }catch(e){console.error(e)}
    setLoading(false);
  },[adminHash]);
  useEffect(()=>{load()},[load]);

  // 선택된 날짜와 겹치는 계획만 (KST 00:00 ~ 24:00)
  const overlapsDay=useMemo(()=>{
    const dayStartMs=new Date(dayStr+"T00:00:00+09:00").getTime();
    const dayEndMs=dayStartMs+24*3600*1000;
    return (p)=>{
      if(!p.start_at||!p.end_at)return false;
      const s=new Date(p.start_at).getTime();
      const e=new Date(p.end_at).getTime();
      return s<dayEndMs && e>dayStartMs;
    };
  },[dayStr]);

  // 리스트: 상태 + (날짜 토글 OFF면 날짜 필터)
  // 간트: 상태만 — 자체적으로 dayStr 기준 윈도우 적용
  const statusFiltered=useMemo(()=>filter==="all"?plans:plans.filter(p=>p.status===filter),[plans,filter]);
  const listFiltered=useMemo(()=>allDates?statusFiltered:statusFiltered.filter(overlapsDay),[statusFiltered,allDates,overlapsDay]);

  // items 변경 시 제품/반제품의 BOM을 미리 fetch (재귀) → bomByParent 캐시
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      const parents=items.filter(i=>i.type==="product"||i.type==="semi").map(i=>i.id);
      if(parents.length===0){if(!cancelled)setBomByParent({});return;}
      const cache={};
      const walk=async(pid)=>{
        if(cache[pid]!=null)return;
        try{
          const rows=await rpc("aps_list_bom",{p_admin_hash:adminHash,p_parent_id:pid});
          cache[pid]=rows||[];
          for(const r of rows||[]){
            if(r.child_type==="semi"||r.child_type==="product")await walk(r.child_id);
          }
        }catch(e){cache[pid]=[];}
      };
      for(const pid of parents){if(cancelled)return;await walk(pid);}
      if(!cancelled)setBomByParent(cache);
    })();
    return()=>{cancelled=true;};
  },[items,adminHash]);

  // 리스트 뷰용 원자재 소요/재고 (listFiltered + bomByParent + invData 기반, RPC 없음)
  const listMats=useMemo(()=>{
    if(!listFiltered||listFiltered.length===0)return{};
    const itemById={};for(const it of items)itemById[it.id]=it;
    const mats=items.filter(i=>i.type==="material");
    const stockByMat=matchRawsToMaterials(invData?.raws||[],mats);
    const out={};
    for(const p of listFiltered){
      const need=calcMaterialRequirements(p.item_id,Number(p.qty)||0,bomByParent,itemById);
      const rows=[];
      for(const mid of Object.keys(need)){
        const mat=need[mid].item;
        const kws=parseMatchKeywords(mat.match_keywords);
        const stock=stockByMat[mid];
        rows.push({
          id:mid,
          name:mat.name,
          needKg:need[mid].kg,
          stockKg:stock?.totalKg||0,
          hasKeywords:kws.length>0,
          ok:(stock?.totalKg||0)>=need[mid].kg
        });
      }
      rows.sort((a,b)=>b.needKg-a.needKg);
      if(rows.length>0)out[p.id]=rows;
    }
    return out;
  },[listFiltered,items,invData,bomByParent]);

  const counts=useMemo(()=>{
    const base=allDates?plans:plans.filter(overlapsDay);
    return{
      all:base.length,
      planned:base.filter(p=>p.status==="planned").length,
      in_progress:base.filter(p=>p.status==="in_progress").length,
      done:base.filter(p=>p.status==="done").length,
      canceled:base.filter(p=>p.status==="canceled").length
    };
  },[plans,allDates,overlapsDay]);

  // 주간 요약: start_at 의 KST 날짜로 묶고 → 주(월요일) 단위로 그룹핑
  const weekSummary=useMemo(()=>{
    const thisMon=kstMonday(todayStr());
    const nextMon=addDays(thisMon,7);
    const todayKst=todayStr();
    // 1단계: 날짜별로 plan 모으기
    const byDate={};
    plans.forEach(p=>{
      if(!p.start_at)return;
      const dStr=isoToKstDateStr(p.start_at);
      if(!byDate[dStr])byDate[dStr]=[];
      byDate[dStr].push(p);
    });
    // 2단계: 어떤 주를 표시할지 결정 — 계획이 있는 주 + 이번 주/다음 주
    const weekSet=new Set([thisMon,nextMon]);
    Object.keys(byDate).forEach(dStr=>weekSet.add(kstMonday(dStr)));
    // 3단계: 각 주에 대해 7일치 요일 채우기
    return Array.from(weekSet).sort((a,b)=>b.localeCompare(a)).map(monStr=>{
      const days=[];
      let planCount=0;
      for(let i=0;i<7;i++){
        const dStr=addDays(monStr,i);
        const dayPlans=(byDate[dStr]||[]).slice().sort((a,b)=>{
          const sa=a.start_at?new Date(a.start_at).getTime():0;
          const sb=b.start_at?new Date(b.start_at).getTime():0;
          return sa-sb;
        });
        planCount+=dayPlans.length;
        days.push({
          dateStr:dStr,
          dow:i, // 0=월,1=화,...,6=일
          isToday:dStr===todayKst,
          plans:dayPlans
        });
      }
      return{
        mondayStr:monStr,
        sundayStr:addDays(monStr,6),
        planCount,
        days,
        isCurrentWeek:monStr===thisMon,
        isFuture:monStr>thisMon
      };
    });
  },[plans]);

  const jumpToDay=(dStr)=>{
    setDayStr(dStr);
    setAllDates(false);
  };

  // 이미지 저장: 오프스크린 ExportWeekView 렌더 → html2canvas 캡처 → PNG 다운로드
  const[exportingWeek,setExportingWeek]=useState(null);
  const exportRef=useRef(null);
  const exportWeek=async(week)=>{
    if(typeof window.html2canvas!=="function"){
      alert("이미지 저장 라이브러리(html2canvas)가 로드되지 않았습니다. 새로고침 후 다시 시도해주세요.");
      return;
    }
    setExportingWeek(week);
    // 렌더 대기 (다음 paint 사이클)
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const target=exportRef.current;
    if(!target){setExportingWeek(null);return}
    try{
      const canvas=await window.html2canvas(target,{
        backgroundColor:"#ffffff",
        scale:2,
        logging:false,
        useCORS:true
      });
      const link=document.createElement("a");
      link.download=`생산계획_${week.mondayStr}_${week.sundayStr}.png`;
      link.href=canvas.toDataURL("image/png");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }catch(e){
      console.error(e);
      alert("이미지 저장 실패: "+(e.message||e));
    }
    setExportingWeek(null);
  };

  const changeStatus=async(p,newStatus)=>{
    try{
      // aps_set_plan_status는 서버에서 actual_start_at/actual_end_at에 now() 자동 기록
      await rpc("aps_set_plan_status",{
        p_admin_hash:adminHash,p_id:p.id,p_status:newStatus
      });
      load();
    }catch(e){alert("상태 변경 실패: "+e.message)}
  };

  const del=async(p)=>{
    if(!confirm(`생산계획 #${p.id} (${p.item_name}) 을(를) 삭제하시겠습니까?`))return;
    try{
      await rpc("aps_delete_plan",{p_admin_hash:adminHash,p_id:p.id});
      load();
    }catch(e){alert("삭제 실패: "+e.message)}
  };

  const movePlan=async(p,direction)=>{
    try{
      await rpc("aps_move_plan_order",{p_admin_hash:adminHash,p_id:p.id,p_direction:direction});
      load();
    }catch(e){alert("순서 변경 실패: "+e.message)}
  };

  // 생산계획 PNG 저장 (전용 오프스크린 ExportPlansView 렌더 → html2canvas 캡처)
  const exportPlansRef=useRef(null);
  const[capturing,setCapturing]=useState(false);
  // 인원+생산계획 통합 이미지 저장용 (오프스크린)
  const combinedExportRef=useRef(null);
  const[combinedCapturing,setCombinedCapturing]=useState(false);
  const[combinedStaff,setCombinedStaff]=useState(null);
  const[combinedOffIds,setCombinedOffIds]=useState(new Set());
  const[combinedMats,setCombinedMats]=useState({});
  const exportCurrentView=async()=>{
    if(typeof window.html2canvas!=="function"){
      alert("이미지 저장 라이브러리(html2canvas)가 로드되지 않았습니다. 새로고침 후 다시 시도해주세요.");
      return;
    }
    setCapturing(true);
    // 1) 원자재 요약 미리 계산 → state에 세팅 (오프스크린 ExportPlansView가 참조)
    try{
      const mats=await buildExportMaterialsFor(adminHash,listFiltered,items,invData);
      setExportMats(mats);
    }catch(e){
      console.warn("[export mat] build failed",e);
      setExportMats({});
    }
    // 2) 오프스크린 ExportPlansView 마운트/재렌더 대기
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const target=exportPlansRef.current;
    if(!target){setCapturing(false);alert("캡처할 영역이 없습니다");return}
    try{
      const canvas=await window.html2canvas(target,{
        backgroundColor:"#ffffff",
        scale:2,
        logging:false,
        useCORS:true
      });
      const dateLabel=allDates?"전체":dayStr;
      const link=document.createElement("a");
      link.download=`생산계획_${dateLabel}.png`;
      link.href=canvas.toDataURL("image/png");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }catch(e){
      console.error(e);
      alert("이미지 저장 실패: "+(e.message||e));
    }
    setCapturing(false);
    // 캡처 종료 후 다음 export를 위해 초기화 (오프스크린 div가 unmount될 때도 stale 상태 방지)
    setExportMats({});
  };

  // 인원 + 생산계획 통합 이미지 저장 (선택된 dayStr 기준)
  const exportCombinedFromPlans=async()=>{
    if(typeof window.html2canvas!=="function"){
      alert("이미지 저장 라이브러리(html2canvas)가 로드되지 않았습니다.");return;
    }
    if(allDates){alert("통합 이미지는 단일 날짜에서만 저장됩니다. 🗓 전체 날짜를 OFF로 변경해주세요.");return}
    setCombinedCapturing(true);
    try{
      const[staffD,attD]=await Promise.all([
        rpc("aps_list_staff",{p_admin_hash:adminHash,p_only_active:false}),
        rpc("aps_get_attendance",{p_admin_hash:adminHash,p_date:dayStr})
      ]);
      setCombinedStaff(staffD||[]);
      setCombinedOffIds(new Set((attD||[]).map(r=>r.staff_id)));
    }catch(e){
      console.error(e);
      alert("인원 데이터를 불러오지 못했습니다: "+(e.message||e));
      setCombinedCapturing(false);
      return;
    }
    // 원자재 요약 미리 계산 (PlansTab의 items/invData state 재사용)
    try{
      const mats=await buildExportMaterialsFor(adminHash,listFiltered,items,invData);
      setCombinedMats(mats);
    }catch(e){
      console.warn("[export combined mat] build failed",e);
      setCombinedMats({});
    }
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const target=combinedExportRef.current;
    if(!target){setCombinedCapturing(false);setCombinedStaff(null);setCombinedMats({});alert("캡처할 영역이 없습니다");return}
    try{
      const canvas=await window.html2canvas(target,{backgroundColor:"#ffffff",scale:2,logging:false,useCORS:true});
      const link=document.createElement("a");
      link.download=`가용인원_생산계획_${dayStr}.png`;
      link.href=canvas.toDataURL("image/png");
      document.body.appendChild(link);link.click();document.body.removeChild(link);
    }catch(e){console.error(e);alert("이미지 저장 실패: "+(e.message||e))}
    setCombinedCapturing(false);
    setCombinedStaff(null);
    setCombinedMats({});
  };

  // 간트 드래그로 시간 변경 (move/resize-l/resize-r 공통)
  const updatePlanTime=async(p,newStartMs,newEndMs)=>{
    // 낙관적 업데이트 — 서버 응답 전에 화면 즉시 반영
    setPlans(prev=>prev.map(x=>x.id===p.id?{...x,start_at:new Date(newStartMs).toISOString(),end_at:new Date(newEndMs).toISOString()}:x));
    try{
      await rpc("aps_upsert_plan",{
        p_admin_hash:adminHash,
        p_id:p.id,
        p_item_id:p.item_id,
        p_line_id:p.line_id,
        p_qty:p.qty,
        p_start_at:new Date(newStartMs).toISOString(),
        p_end_at:new Date(newEndMs).toISOString(),
        p_status:p.status,
        p_memo:p.memo||""
      });
      load();
    }catch(e){
      alert("시간 변경 실패: "+errMsg(e,{invalid_times:"종료 시각이 시작 시각 이전입니다"}));
      load();
    }
  };

  const nowMs=Date.now();

  return <div>
    <div className="aps-toolbar">
      <div className="aps-filter">
        <button className={filter==="all"?"on":""} onClick={()=>setFilter("all")}>전체 {counts.all}</button>
        <button className={filter==="planned"?"on":""} onClick={()=>setFilter("planned")}>계획 {counts.planned}</button>
        <button className={filter==="in_progress"?"on":""} onClick={()=>setFilter("in_progress")}>진행중 {counts.in_progress}</button>
        <button className={filter==="done"?"on":""} onClick={()=>setFilter("done")}>완료 {counts.done}</button>
        <button className={filter==="canceled"?"on":""} onClick={()=>setFilter("canceled")}>취소 {counts.canceled}</button>
      </div>
      <div style={{flex:1}}></div>
      <button
        className={"aps-btn aps-btn-sm "+(invPanelOpen?"aps-btn-primary":"aps-btn-secondary")}
        onClick={()=>setInvPanelOpen(v=>!v)}
        title="재고 시트 탭에서 업로드한 재고를 왼쪽에 표시/숨김">
        📦 재고 {invPanelOpen?"ON":"OFF"}
      </button>
      {viewMode==="list"&&<button
        className={"aps-btn aps-btn-sm "+(weekPanelOpen?"aps-btn-primary":"aps-btn-secondary")}
        onClick={()=>setWeekPanelOpen(v=>!v)}
        title="왼쪽에 주별 생산 요약 패널을 표시/숨김">
        📅 주간 요약 {weekPanelOpen?"ON":"OFF"}
      </button>}
      <div className="aps-view-toggle">
        <button className={viewMode==="list"?"on":""} onClick={()=>setViewMode("list")}>📋 리스트</button>
        <button className={viewMode==="gantt"?"on":""} onClick={()=>setViewMode("gantt")}>📊 간트</button>
        <button className={viewMode==="timetable"?"on":""} onClick={()=>setViewMode("timetable")}>🕐 시간표</button>
      </div>
      <button
        className="aps-btn aps-btn-secondary"
        onClick={exportCurrentView}
        disabled={capturing||loading||plans.length===0}
        title="현재 보고 있는 날짜의 생산계획을 라인별로 정리하여 PNG로 저장">
        📷 {capturing?"저장 중...":"이미지 저장"}
      </button>
      <button
        className="aps-btn aps-btn-secondary"
        onClick={exportCombinedFromPlans}
        disabled={combinedCapturing||loading||allDates}
        title={allDates?"전체 날짜 모드에서는 사용 불가 (단일 날짜에서만)":`선택된 날짜(${dayStr})의 가용 인원 + 생산계획을 하나의 이미지로 저장`}>
        📷 {combinedCapturing?"저장 중...":"인원+계획"}
      </button>
      <button className="aps-btn aps-btn-primary" onClick={()=>{setEditing(null);setShowForm(true)}} disabled={items.filter(i=>i.type!=="material").length===0}>+ 생산계획 추가</button>
    </div>

    <div className="aps-toolbar" style={{marginTop:-4}}>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>shiftDay(-1)} disabled={allDates}>← 이전 날</button>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>{setDayStr(todayStr());setAllDates(false)}}>오늘</button>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>shiftDay(1)} disabled={allDates}>다음 날 →</button>
      <input className="aps-input" type="date" value={dayStr} onChange={e=>{setDayStr(e.target.value);setAllDates(false)}} style={{width:150,padding:"6px 10px",opacity:allDates?0.5:1}} disabled={allDates}/>
      <button
        className={"aps-btn aps-btn-sm "+(allDates?"aps-btn-primary":"aps-btn-secondary")}
        onClick={()=>setAllDates(v=>!v)}
        title="리스트에서 모든 날짜의 계획을 표시 (간트는 항상 선택된 날짜)"
      >🗓 전체 날짜 {allDates?"ON":"OFF"}</button>
      <span style={{fontSize:11,color:"var(--dimmer)",marginLeft:4}}>
        {allDates
          ? "리스트: 전체 / 간트: 선택일"
          : `리스트·간트 모두 ${dayStr}`}
      </span>
    </div>

    {loading?<Loader/>:
      <div className={invPanelOpen?"aps-plans-layout":""}>
        {invPanelOpen&&<InventoryQuickPanel
          onClose={()=>setInvPanelOpen(false)}
          onJumpToSheet={()=>{window.location.hash="#sheet"}}
          adminHash={adminHash}
          items={items}
          plans={plans}
        />}
        <div className={invPanelOpen?"aps-plans-main":""}>
        {viewMode==="gantt"?
      <GanttView plans={statusFiltered} lines={lines} settings={settings} dayStr={dayStr}
        onPlanClick={p=>{setEditing(p);setShowForm(true)}}
        onPlanTimeChange={updatePlanTime}
        onOpenSettings={()=>setShowSettings(true)}/>:
      viewMode==="timetable"?
      <TimetableView plans={statusFiltered.filter(overlapsDay)} lines={lines} settings={settings} dayStr={dayStr}
        onPlanClick={p=>{setEditing(p);setShowForm(true)}}
        onOpenSettings={()=>setShowSettings(true)}/>:
      <div className="aps-list-layout">
        {weekPanelOpen&&<WeekSummaryPanel weeks={weekSummary} selectedDay={dayStr} onDayClick={jumpToDay} onPlanClick={p=>{setEditing(p);setShowForm(true)}} onExportWeek={exportWeek} exportingMonStr={exportingWeek?.mondayStr}/>}
        <div className="aps-list-main">
        {listFiltered.length===0?
        <Empty emoji="📅" text={plans.length===0?"생산계획이 없습니다. 우측 상단에서 추가하세요.":(allDates?"해당 상태의 계획이 없습니다":`${dayStr}에 해당 상태의 계획이 없습니다`)}/>:
        <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8}}>
        <table className="aps-table">
          <thead><tr>
            <th className="center" style={{width:70}}>순서</th>
            <th>품목</th>
            <th className="right" style={{width:90}}>수량</th>
            <th className="center hide-mobile" style={{width:130}}>시작</th>
            <th className="center" style={{width:130}}>종료</th>
            <th className="center" style={{width:70}}>상태</th>
            <th className="center" style={{width:180}}>작업</th>
          </tr></thead>
          <tbody>
            {(()=>{
              const groups=new Map();
              listFiltered.forEach(p=>{
                const key=p.line_id||"__none__";
                if(!groups.has(key))groups.set(key,{line_id:p.line_id||null,line_name:p.line_name||"",line_code:p.line_code||"",plans:[]});
                groups.get(key).plans.push(p);
              });
              const arr=Array.from(groups.values());
              arr.sort((a,b)=>{
                if(!a.line_id&&b.line_id)return 1;
                if(a.line_id&&!b.line_id)return -1;
                return (a.line_code||"").localeCompare(b.line_code||"");
              });
              return arr.flatMap(g=>{
                const lc=lineColorFor(g.line_id,lines);
                return [
                <tr key={"hdr-"+(g.line_id||"none")}>
                  <td colSpan={7} style={{padding:"10px 14px",fontWeight:800,fontSize:13,background:lc.bg,borderTop:`4px solid ${lc.base}`,boxShadow:`inset 6px 0 0 ${lc.base}`,color:lc.base}}>
                    <span style={{display:"inline-block",width:14,height:14,background:lc.base,borderRadius:3,verticalAlign:"middle",marginRight:8}}></span>
                    🏭 {g.line_id?<>{g.line_name}{(()=>{const ln=lines.find(l=>l.id===g.line_id);const m=ln?.memo?.trim();return m?<span style={{color:"var(--muted)",fontWeight:500,fontSize:12,marginLeft:6}}>{m}</span>:null})()}</>:<span style={{color:"var(--muted)"}}>라인 미지정</span>}
                    <span style={{marginLeft:10,color:"var(--muted)",fontWeight:500,fontSize:11}}>{g.plans.length}건</span>
                  </td>
                </tr>,
                ...g.plans.map((p,idx)=>{
                  const endMs=p.end_at?new Date(p.end_at).getTime():0;
                  const overdue=p.status!=="done"&&p.status!=="canceled"&&endMs>0&&endMs<nowMs;
                  const isFirst=idx===0;
                  const isLast=idx===g.plans.length-1;
                  return <tr key={p.id}>
                    <td className="center" style={{fontSize:"11px",boxShadow:`inset 6px 0 0 ${lc.base}`}}>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                        <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>movePlan(p,"up")} disabled={isFirst} style={{padding:"2px 8px",lineHeight:1,opacity:isFirst?0.3:1}} title="위로">▲</button>
                        <div style={{color:"var(--muted)"}}>#{p.id}</div>
                        <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>movePlan(p,"down")} disabled={isLast} style={{padding:"2px 8px",lineHeight:1,opacity:isLast?0.3:1}} title="아래로">▼</button>
                      </div>
                    </td>
                    <td>
                      <div style={{fontWeight:600}}>{p.item_name}</div>
                      <div style={{fontSize:"11px",color:"var(--muted)"}}>{p.item_code}</div>
                      {(listMats[p.id]||[]).length>0&&<div style={{marginTop:3,fontSize:"11px",lineHeight:1.45}}>
                        {(listMats[p.id]||[]).map((m,mi)=>{
                          const shortage=m.needKg-m.stockKg;
                          return <div key={mi} style={{color:"#c2410c"}}>
                            <span style={{fontWeight:700}}>🥩 {m.name}</span>
                            <span> - <b>{fmtKg(m.needKg)}</b></span>
                            {m.hasKeywords&&!m.ok&&<span style={{color:"#ef4444",fontWeight:700,marginLeft:4}}>⚠ 부족 ({fmtKg(shortage)})</span>}
                          </div>;
                        })}
                      </div>}
                      {p.memo&&<div style={{fontSize:"11px",color:"var(--dimmer)",marginTop:2}}>{p.memo}</div>}
                    </td>
                    <td className="right" style={{fontWeight:600}}>
                      <div>{fmtNum(p.qty)} <span style={{fontSize:"11px",color:"var(--muted)",fontWeight:400}}>{p.item_unit}</span></div>
                      {(()=>{const kg=parseSpecKg(p.item_spec);if(kg==null)return null;return <div style={{fontSize:"12px",color:"var(--text)",fontWeight:600,marginTop:2,whiteSpace:"nowrap"}}>{fmtKg(kg*(p.qty||0))}</div>;})()}
                    </td>
                    <td className="center hide-mobile" style={{fontSize:"12px",color:"var(--muted)"}}>
                      <div>계획: {fmtKstDateTime(p.start_at)}</div>
                      {p.actual_start_at&&<div style={{color:"#22c55e",fontSize:11,marginTop:2}}>실제: {fmtKstDateTime(p.actual_start_at)}</div>}
                    </td>
                    <td className="center" style={{fontSize:"12px",color:overdue?"#ef4444":"var(--muted)",fontWeight:overdue?700:400}}>
                      <div>계획: {fmtKstDateTime(p.end_at)}</div>
                      {p.actual_end_at&&<div style={{color:"#22c55e",fontSize:11,marginTop:2,fontWeight:400}}>실제: {fmtKstDateTime(p.actual_end_at)}</div>}
                      {overdue&&<div style={{fontSize:"10px"}}>지연</div>}
                    </td>
                    <td className="center"><Pill map={STATUS_PILL} k={p.status} label={STATUS_LABEL[p.status]}/></td>
                    <td className="center">
                      <div style={{display:"flex",gap:4,justifyContent:"center",flexWrap:"wrap"}}>
                        {p.status==="planned"&&<button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>changeStatus(p,"in_progress")}>▶ 시작</button>}
                        {p.status==="in_progress"&&<button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>changeStatus(p,"done")}>✓ 완료</button>}
                        <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>{setEditing(p);setShowForm(true)}}>수정</button>
                        <button className="aps-btn aps-btn-danger aps-btn-sm" onClick={()=>del(p)}>삭제</button>
                      </div>
                    </td>
                  </tr>;
                })
              ];
              });
            })()}
          </tbody>
        </table>
      </div>
        }
        </div>
      </div>
        }
        </div>
      </div>
    }

    {showForm&&<PlanForm adminHash={adminHash} items={items} lines={lines} settings={settings} initial={editing} defaultDate={allDates?todayStr():dayStr} onCancel={()=>setShowForm(false)} onSaved={()=>{setShowForm(false);load()}}/>}
    {showSettings&&<SettingsModal adminHash={adminHash} settings={settings} onCancel={()=>setShowSettings(false)} onSaved={(s)=>{setSettings(prev=>({...prev,...s}));setShowSettings(false)}}/>}
    {exportingWeek&&<div style={{position:"fixed",left:-99999,top:0,zIndex:-1,pointerEvents:"none"}} aria-hidden="true">
      <div ref={exportRef}><ExportWeekView week={exportingWeek}/></div>
    </div>}
    {capturing&&<div style={{position:"fixed",left:-99999,top:0,zIndex:-1,pointerEvents:"none"}} aria-hidden="true">
      <div ref={exportPlansRef}><ExportPlansView plans={listFiltered} lines={lines} dayStr={dayStr} allDates={allDates} matsByPlan={exportMats}/></div>
    </div>}
    {combinedCapturing&&combinedStaff!==null&&<div style={{position:"fixed",left:-99999,top:0,zIndex:-1,pointerEvents:"none"}} aria-hidden="true">
      <div ref={combinedExportRef}>
        {(()=>{
          // 인원 데이터 → deptGroups + totalAvail 계산
          const order=[];
          const map=new Map();
          (combinedStaff||[]).forEach(s=>{
            if(!s.active)return;
            const k=s.department||"";
            if(!map.has(k)){map.set(k,[]);order.push(k)}
            map.get(k).push(s);
          });
          const deptGroups=order.map(d=>({dept:d,staff:map.get(d)||[]}));
          const totalAvail=deptGroups.reduce((sum,g)=>sum+g.staff.filter(s=>!combinedOffIds.has(s.id)).length,0);
          return <ExportCombinedView
            title={loadStaffTitle()}
            dateStr={dayStr}
            deptGroups={deptGroups}
            offIds={combinedOffIds}
            totalAvail={totalAvail}
            plans={listFiltered}
            lines={lines}
            matsByPlan={combinedMats}/>;
        })()}
      </div>
    </div>}
  </div>;
}

// 통계 탭 (품목별 누적 생산 시간 + 1년 retention)
// ═══════════════════════════════════════════
const RANGE_LABEL={"7":"7일","30":"30일","90":"90일","365":"1년","all":"전체"};
const RANGES=["7","30","90","365","all"];

function fmtHours(h){
  const n=Number(h)||0;
  if(n===0)return "0";
  if(n<1)return Math.round(n*60)+"분";
  const hh=Math.floor(n);
  const mm=Math.round((n-hh)*60);
  return mm===0?`${hh}시간`:`${hh}시간 ${mm}분`;
}

function StatsDrilldownTable({plans,editingId,editForm,setEditForm,saving,startEdit,cancelEdit,saveEdit,showItemColumn=false}){
  const inputStyle={width:"100%",padding:"4px 6px",fontSize:11,background:"var(--bg)",border:"1px solid var(--div2)",borderRadius:4,color:"var(--text)"};
  return <div style={{padding:"10px 14px"}}>
    <div style={{fontSize:11,color:"var(--muted)",marginBottom:8}}>완료 계획 {plans.length}건 · ✏ 수정 버튼으로 실제 시각·실제 수량 보정</div>
    <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",fontSize:12,borderCollapse:"collapse",minWidth:showItemColumn?920:760}}>
        <thead>
          <tr style={{color:"var(--muted)",fontSize:10,textTransform:"uppercase",letterSpacing:"0.5px"}}>
            <th style={{padding:"6px 8px",textAlign:"left",width:60}}>#</th>
            {showItemColumn&&<th style={{padding:"6px 8px",textAlign:"left",minWidth:160}}>품목</th>}
            <th style={{padding:"6px 8px",textAlign:"left",width:90}}>라인</th>
            <th style={{padding:"6px 8px",textAlign:"left",minWidth:170}}>실제 시작</th>
            <th style={{padding:"6px 8px",textAlign:"left",minWidth:170}}>실제 종료</th>
            <th style={{padding:"6px 8px",textAlign:"right",width:90}}>실제 시간</th>
            <th style={{padding:"6px 8px",textAlign:"right",width:110}}>계획 수량</th>
            <th style={{padding:"6px 8px",textAlign:"right",width:140}}>실제 수량</th>
            <th style={{padding:"6px 8px",textAlign:"right",width:150}}></th>
          </tr>
        </thead>
        <tbody>
          {plans.map(p=>{
            const isEdit=editingId===p.id;
            const startMs=p.actual_start_at?new Date(p.actual_start_at).getTime():0;
            const endMs=p.actual_end_at?new Date(p.actual_end_at).getTime():0;
            const hoursReal=(endMs-startMs)/3600000;
            const editStartMs=editForm.start?new Date(kstInputToIso(editForm.start)).getTime():0;
            const editEndMs=editForm.end?new Date(kstInputToIso(editForm.end)).getTime():0;
            const editHours=(editEndMs-editStartMs)/3600000;
            const qtyChanged=p.actual_qty!=null&&Number(p.actual_qty)!==Number(p.qty);
            return <tr key={p.id} style={{borderTop:"1px solid var(--div2)"}}>
              <td style={{padding:"6px 8px",fontSize:11,color:"var(--muted)",fontFamily:"monospace"}}>#{p.id}</td>
              {showItemColumn&&<td style={{padding:"6px 8px"}}>
                <div style={{fontWeight:600,fontSize:12}}>{p.item_name||"-"}</div>
                {p.item_code&&<div style={{fontSize:10,color:"var(--muted)",fontFamily:"monospace"}}>{p.item_code}</div>}
              </td>}
              <td style={{padding:"6px 8px",fontSize:11}}>{p.line_code||"-"}</td>
              {isEdit?<>
                <td style={{padding:"6px 8px"}}>
                  <input type="datetime-local" value={editForm.start} onChange={e=>setEditForm(f=>({...f,start:e.target.value}))} style={inputStyle}/>
                </td>
                <td style={{padding:"6px 8px"}}>
                  <input type="datetime-local" value={editForm.end} onChange={e=>setEditForm(f=>({...f,end:e.target.value}))} style={inputStyle}/>
                </td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:11,color:editHours>0?"var(--text)":"#ef4444"}}>{editHours>0?fmtHours(editHours):"--"}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:11,color:"var(--muted)"}}>{fmtNum(p.qty)} {p.item_unit}</td>
                <td style={{padding:"6px 8px",textAlign:"right"}}>
                  <input type="number" step="any" min="0" value={editForm.qty} placeholder={`비우면 ${p.qty}`} onChange={e=>setEditForm(f=>({...f,qty:e.target.value}))} style={{...inputStyle,width:100,textAlign:"right"}}/>
                </td>
                <td style={{padding:"6px 8px",textAlign:"right",whiteSpace:"nowrap"}}>
                  <button disabled={saving} onClick={()=>saveEdit(p)} style={{marginRight:4,padding:"4px 10px",fontSize:11,background:"#06b6d4",color:"#fff",border:"none",borderRadius:4,cursor:saving?"wait":"pointer",fontWeight:600}}>{saving?"...":"저장"}</button>
                  <button disabled={saving} onClick={cancelEdit} style={{padding:"4px 10px",fontSize:11,background:"transparent",color:"var(--muted)",border:"1px solid var(--div2)",borderRadius:4,cursor:"pointer"}}>취소</button>
                </td>
              </>:<>
                <td style={{padding:"6px 8px",fontSize:11}}>{fmtKstDateTime(p.actual_start_at)}</td>
                <td style={{padding:"6px 8px",fontSize:11}}>{fmtKstDateTime(p.actual_end_at)}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:11}}>{fmtHours(hoursReal)}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:11,color:qtyChanged?"var(--muted)":"var(--text)",textDecoration:qtyChanged?"line-through":"none"}}>{fmtNum(p.qty)} {p.item_unit}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontSize:11,fontWeight:600,color:qtyChanged?"#06b6d4":"var(--text)"}}>
                  {p.actual_qty!=null?<>{fmtNum(p.actual_qty)} {p.item_unit}</>:<span style={{color:"var(--dimmer)",fontWeight:400}}>계획값({fmtNum(p.qty)})</span>}
                </td>
                <td style={{padding:"6px 8px",textAlign:"right"}}>
                  <button onClick={()=>startEdit(p)} style={{padding:"4px 10px",fontSize:11,background:"transparent",color:"var(--text)",border:"1px solid var(--div2)",borderRadius:4,cursor:"pointer"}}>✏ 수정</button>
                </td>
              </>}
            </tr>;
          })}
        </tbody>
      </table>
    </div>
  </div>;
}

// 통계 탭 — 날짜별 뷰
// aps_get_done_plans_all로 기간 내 모든 완료 plan을 받아
// KST 실제 종료 날짜(YYYY-MM-DD) 기준으로 그룹핑하여 표시.
// StatsDrilldownTable을 showItemColumn=true로 재사용.
// ═══════════════════════════════════════════
function DateStatsView({adminHash}){
  const[plans,setPlans]=useState([]);
  const[loading,setLoading]=useState(true);
  const[range,setRange]=useState("30");
  const[expanded,setExpanded]=useState(null);          // 펼친 dateStr
  const[editingId,setEditingId]=useState(null);
  const[editForm,setEditForm]=useState({start:"",end:"",qty:""});
  const[saving,setSaving]=useState(false);

  const load=useCallback(async(rangeKey)=>{
    setLoading(true);
    try{
      const days=rangeKey==="all"?null:parseInt(rangeKey);
      const data=await rpc("aps_get_done_plans_all",{p_admin_hash:adminHash,p_days_back:days});
      setPlans(data||[]);
    }catch(e){console.error(e);alert("완료 계획 로딩 실패: "+e.message);}
    setLoading(false);
  },[adminHash]);
  useEffect(()=>{load(range)},[load,range]);

  // range 바뀌면 펼침·편집 상태 초기화
  useEffect(()=>{setExpanded(null);setEditingId(null);},[range]);

  const startEdit=(plan)=>{
    setEditingId(plan.id);
    setEditForm({
      start:isoToKstInput(plan.actual_start_at),
      end:isoToKstInput(plan.actual_end_at),
      qty:plan.actual_qty!=null?String(plan.actual_qty):"",
    });
  };
  const cancelEdit=()=>{setEditingId(null);setEditForm({start:"",end:"",qty:""});};
  const saveEdit=async(plan)=>{
    if(!editForm.start||!editForm.end){alert("시작/종료 시각을 모두 입력하세요");return;}
    const startIso=kstInputToIso(editForm.start);
    const endIso=kstInputToIso(editForm.end);
    if(new Date(endIso).getTime()<=new Date(startIso).getTime()){alert("종료 시각은 시작 시각보다 뒤여야 합니다");return;}
    const qtyStr=String(editForm.qty||"").trim();
    let qty=null;
    if(qtyStr!==""){
      qty=Number(qtyStr);
      if(isNaN(qty)||qty<0){alert("실제 수량은 0 이상의 숫자여야 합니다 (비우면 계획 수량 그대로 사용)");return;}
    }
    setSaving(true);
    try{
      await rpc("aps_update_plan_actuals",{
        p_admin_hash:adminHash,
        p_id:plan.id,
        p_actual_start_at:startIso,
        p_actual_end_at:endIso,
        p_actual_qty:qty,
      });
      await load(range);
      setEditingId(null);
    }catch(e){alert("저장 실패: "+e.message);}
    setSaving(false);
  };

  // 날짜별 그룹핑 (KST 실제 종료 날짜 기준)
  const groups=useMemo(()=>{
    const map=new Map();
    plans.forEach(p=>{
      const d=isoToKstDateStr(p.actual_end_at);
      if(!d)return;
      if(!map.has(d))map.set(d,[]);
      map.get(d).push(p);
    });
    const arr=Array.from(map.entries()).map(([date,list])=>{
      const count=list.length;
      const totalHours=list.reduce((a,p)=>{
        const s=p.actual_start_at?new Date(p.actual_start_at).getTime():0;
        const e=p.actual_end_at?new Date(p.actual_end_at).getTime():0;
        return a+Math.max(0,(e-s)/3600000);
      },0);
      // 품목마다 단위(unit)가 다르므로 unit별로 총량 집계
      const byUnit={};
      list.forEach(p=>{
        const u=p.item_unit||"EA";
        const qty=Number(p.actual_qty!=null?p.actual_qty:p.qty)||0;
        byUnit[u]=(byUnit[u]||0)+qty;
      });
      return {date,count,totalHours,byUnit,list};
    });
    arr.sort((a,b)=>b.date.localeCompare(a.date));
    return arr;
  },[plans]);

  const totalCount=plans.length;
  const totalHours=useMemo(()=>plans.reduce((a,p)=>{
    const s=p.actual_start_at?new Date(p.actual_start_at).getTime():0;
    const e=p.actual_end_at?new Date(p.actual_end_at).getTime():0;
    return a+Math.max(0,(e-s)/3600000);
  },0),[plans]);
  const totalDates=groups.length;

  const toggleExpand=(dateStr)=>{
    if(expanded===dateStr){setExpanded(null);setEditingId(null);}
    else{setExpanded(dateStr);setEditingId(null);}
  };

  return <div>
    <div className="aps-toolbar">
      <div className="aps-filter">
        {RANGES.map(r=><button key={r} className={range===r?"on":""} onClick={()=>setRange(r)}>{RANGE_LABEL[r]}</button>)}
      </div>
    </div>

    {/* 요약 카드 */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10,marginBottom:14}}>
      <div style={{padding:"14px 16px",background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>완료 계획 ({RANGE_LABEL[range]})</div>
        <div style={{fontSize:22,fontWeight:700}}>{totalCount}<span style={{fontSize:12,color:"var(--muted)",fontWeight:400,marginLeft:4}}>건</span></div>
      </div>
      <div style={{padding:"14px 16px",background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>총 생산 시간</div>
        <div style={{fontSize:22,fontWeight:700}}>{fmtHours(totalHours)}</div>
      </div>
      <div style={{padding:"14px 16px",background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>실적 있는 날짜</div>
        <div style={{fontSize:22,fontWeight:700}}>{totalDates}<span style={{fontSize:12,color:"var(--muted)",fontWeight:400,marginLeft:4}}>일</span></div>
      </div>
    </div>

    {loading?<Loader/>:groups.length===0?
      <Empty emoji="📈" text={`${RANGE_LABEL[range]} 동안 완료된 생산 실적이 없습니다`}/>:
      <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8}}>
        <table className="aps-table">
          <thead><tr>
            <th>날짜</th>
            <th className="right" style={{width:80}}>완료</th>
            <th className="hide-mobile">품목별 수량</th>
            <th className="right" style={{width:110}}>총 시간</th>
          </tr></thead>
          <tbody>
            {groups.map(g=>{
              const isOpen=expanded===g.date;
              const[y,m,d]=g.date.split("-").map(Number);
              const dow=DOW_LABEL[(new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7];
              const dowColor=dow==="일"?"#ef4444":dow==="토"?"#3b82f6":"var(--muted)";
              const unitEntries=Object.entries(g.byUnit);
              return <React.Fragment key={g.date}>
                <tr onClick={()=>toggleExpand(g.date)} style={{cursor:"pointer",background:isOpen?"var(--card-bg)":""}} title="클릭하여 완료 계획 목록 펼치기">
                  <td>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{display:"inline-block",fontSize:9,color:"var(--muted)",transition:"transform 0.15s",transform:isOpen?"rotate(90deg)":"none"}}>▶</span>
                      <div style={{fontWeight:600}}>{g.date} <span style={{color:dowColor,fontWeight:700,marginLeft:4}}>({dow})</span></div>
                    </div>
                  </td>
                  <td className="right" style={{fontWeight:600}}>{g.count}건</td>
                  <td className="hide-mobile" style={{fontSize:12,color:"var(--muted)"}}>
                    {unitEntries.length===0?<span style={{color:"var(--dimmer)"}}>-</span>:
                      unitEntries.map(([u,q])=><span key={u} style={{marginRight:12}}>{fmtNum(q)} <span style={{fontSize:10,color:"var(--dimmer)"}}>{u}</span></span>)}
                  </td>
                  <td className="right" style={{fontWeight:600,color:"#22c55e"}}>{fmtHours(g.totalHours)}</td>
                </tr>
                {isOpen&&<tr>
                  <td colSpan={4} style={{padding:0,background:"var(--card-bg)",borderTop:"1px solid var(--div2)",borderBottom:"1px solid var(--div2)"}}>
                    <StatsDrilldownTable plans={g.list} editingId={editingId} editForm={editForm} setEditForm={setEditForm} saving={saving} startEdit={startEdit} cancelEdit={cancelEdit} saveEdit={saveEdit} showItemColumn={true}/>
                  </td>
                </tr>}
              </React.Fragment>;
            })}
          </tbody>
        </table>
      </div>
    }
    <div style={{fontSize:11,color:"var(--dimmer)",marginTop:8,lineHeight:1.5}}>
      ※ 실제 종료 시각(KST) 기준 날짜별 그룹핑 · 날짜 행 클릭 시 그날 완료된 계획 목록 펼침 · 잘못 기록된 시각·실제 수량은 ✏ 버튼으로 직접 수정 가능
    </div>
  </div>;
}

function StatsTab({adminHash}){
  const[viewMode,setViewMode]=useState(()=>{
    const v=localStorage.getItem("aps-stats-view-mode");
    return v==="date"?"date":"item";
  });
  useEffect(()=>{localStorage.setItem("aps-stats-view-mode",viewMode)},[viewMode]);

  const[stats,setStats]=useState([]);
  const[loading,setLoading]=useState(true);
  const[range,setRange]=useState("30");
  const[sortBy,setSortBy]=useState("count");  // count/total/avg/rate
  const[cleanupMsg,setCleanupMsg]=useState("");
  const[expanded,setExpanded]=useState(null);          // 펼친 item_id (단일)
  const[itemPlans,setItemPlans]=useState({});          // {item_id: [plans]} 캐시
  const[itemPlansLoading,setItemPlansLoading]=useState(false);
  const[editingId,setEditingId]=useState(null);        // 인라인 편집 중인 plan id
  const[editForm,setEditForm]=useState({start:"",end:"",qty:""});
  const[saving,setSaving]=useState(false);

  const load=useCallback(async(rangeKey)=>{
    if(viewMode!=="item")return;
    setLoading(true);
    try{
      const days=rangeKey==="all"?null:parseInt(rangeKey);
      const data=await rpc("aps_get_item_stats",{p_admin_hash:adminHash,p_days_back:days});
      setStats(data||[]);
    }catch(e){console.error(e)}
    setLoading(false);
  },[adminHash,viewMode]);
  useEffect(()=>{load(range)},[load,range]);

  // range 바뀌면 드릴다운 캐시 무효화 (기간 필터가 plan 목록에도 반영됨)
  useEffect(()=>{
    setItemPlans({});
    setExpanded(null);
    setEditingId(null);
  },[range]);

  const loadItemPlans=useCallback(async(itemId)=>{
    setItemPlansLoading(true);
    try{
      const days=range==="all"?null:parseInt(range);
      const data=await rpc("aps_get_done_plans_for_item",{p_admin_hash:adminHash,p_item_id:itemId,p_days_back:days});
      setItemPlans(prev=>({...prev,[itemId]:data||[]}));
    }catch(e){console.error(e);alert("계획 목록 로딩 실패: "+e.message);setExpanded(null);}
    setItemPlansLoading(false);
  },[adminHash,range]);

  const toggleExpand=useCallback((item)=>{
    if(expanded===item.item_id){
      setExpanded(null);
      setEditingId(null);
      return;
    }
    setExpanded(item.item_id);
    setEditingId(null);
    if(!itemPlans[item.item_id])loadItemPlans(item.item_id);
  },[expanded,itemPlans,loadItemPlans]);

  const startEdit=(plan)=>{
    setEditingId(plan.id);
    setEditForm({
      start:isoToKstInput(plan.actual_start_at),
      end:isoToKstInput(plan.actual_end_at),
      qty:plan.actual_qty!=null?String(plan.actual_qty):"",
    });
  };
  const cancelEdit=()=>{setEditingId(null);setEditForm({start:"",end:"",qty:""});};

  const saveEdit=async(plan)=>{
    if(!editForm.start||!editForm.end){alert("시작/종료 시각을 모두 입력하세요");return;}
    const startIso=kstInputToIso(editForm.start);
    const endIso=kstInputToIso(editForm.end);
    if(new Date(endIso).getTime()<=new Date(startIso).getTime()){alert("종료 시각은 시작 시각보다 뒤여야 합니다");return;}
    const qtyStr=String(editForm.qty||"").trim();
    let qty=null;
    if(qtyStr!==""){
      qty=Number(qtyStr);
      if(isNaN(qty)||qty<0){alert("실제 수량은 0 이상의 숫자여야 합니다 (비우면 계획 수량 그대로 사용)");return;}
    }
    setSaving(true);
    try{
      await rpc("aps_update_plan_actuals",{
        p_admin_hash:adminHash,
        p_id:plan.id,
        p_actual_start_at:startIso,
        p_actual_end_at:endIso,
        p_actual_qty:qty,
      });
      // 드릴다운 plan 목록 + 상위 통계 둘 다 재로드
      await loadItemPlans(plan.item_id);
      load(range);
      setEditingId(null);
    }catch(e){alert("저장 실패: "+e.message);}
    setSaving(false);
  };

  // 1일 1회 자동 cleanup
  useEffect(()=>{
    const key="aps-cleanup-last";
    const last=localStorage.getItem(key);
    const today=todayStr();
    if(last===today)return;
    (async()=>{
      try{
        const removed=await rpc("aps_cleanup_old_plans",{p_admin_hash:adminHash,p_days:365});
        localStorage.setItem(key,today);
        if(removed>0)setCleanupMsg(`365일 초과 ${removed}건 자동 정리됨`);
      }catch(e){console.warn("cleanup failed",e)}
    })();
  },[adminHash]);

  const sorted=useMemo(()=>{
    const arr=[...stats];
    arr.sort((a,b)=>{
      if(sortBy==="count")return b.plan_count-a.plan_count;
      if(sortBy==="total")return Number(b.total_actual_hours)-Number(a.total_actual_hours);
      if(sortBy==="avg")  return Number(b.avg_actual_hours)-Number(a.avg_actual_hours);
      if(sortBy==="rate") return Number(b.qty_per_hour)-Number(a.qty_per_hour);
      return 0;
    });
    return arr;
  },[stats,sortBy]);

  const withData=sorted.filter(s=>s.plan_count>0);
  const withoutData=sorted.filter(s=>s.plan_count===0);
  const totalCompletedCount=withData.reduce((a,s)=>a+s.plan_count,0);
  const totalHours=withData.reduce((a,s)=>a+Number(s.total_actual_hours),0);

  const runCleanup=async()=>{
    if(!confirm("365일 초과된 완료/취소 계획을 삭제합니다. 계속하시겠습니까?"))return;
    try{
      const removed=await rpc("aps_cleanup_old_plans",{p_admin_hash:adminHash,p_days:365});
      setCleanupMsg(`${removed}건 삭제됨`);
      load(range);
    }catch(e){alert("정리 실패: "+e.message)}
  };

  const viewToggle=<div className="aps-view-toggle" style={{marginBottom:14}}>
    <button className={viewMode==="item"?"on":""} onClick={()=>setViewMode("item")}>📦 품목별</button>
    <button className={viewMode==="date"?"on":""} onClick={()=>setViewMode("date")}>📅 날짜별</button>
  </div>;

  if(viewMode==="date")return <div>
    {viewToggle}
    <DateStatsView adminHash={adminHash}/>
  </div>;

  return <div>
    {viewToggle}
    <div className="aps-toolbar">
      <div className="aps-filter">
        {RANGES.map(r=><button key={r} className={range===r?"on":""} onClick={()=>setRange(r)}>{RANGE_LABEL[r]}</button>)}
      </div>
      <div style={{flex:1}}></div>
      <div className="aps-view-toggle">
        <button className={sortBy==="count"?"on":""} onClick={()=>setSortBy("count")}>건수순</button>
        <button className={sortBy==="total"?"on":""} onClick={()=>setSortBy("total")}>총시간순</button>
        <button className={sortBy==="avg"?"on":""} onClick={()=>setSortBy("avg")}>평균순</button>
        <button className={sortBy==="rate"?"on":""} onClick={()=>setSortBy("rate")}>생산률순</button>
      </div>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={runCleanup}>🗑 365일 정리</button>
    </div>

    {cleanupMsg&&<div style={{padding:"10px 14px",marginBottom:14,background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:8,fontSize:12,color:"#f59e0b"}}>{cleanupMsg}</div>}

    {/* 요약 카드 */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10,marginBottom:14}}>
      <div style={{padding:"14px 16px",background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>완료 계획 ({RANGE_LABEL[range]})</div>
        <div style={{fontSize:22,fontWeight:700}}>{totalCompletedCount}<span style={{fontSize:12,color:"var(--muted)",fontWeight:400,marginLeft:4}}>건</span></div>
      </div>
      <div style={{padding:"14px 16px",background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>총 생산 시간</div>
        <div style={{fontSize:22,fontWeight:700}}>{fmtHours(totalHours)}</div>
      </div>
      <div style={{padding:"14px 16px",background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>실적 보유 품목</div>
        <div style={{fontSize:22,fontWeight:700}}>{withData.length}<span style={{fontSize:12,color:"var(--muted)",fontWeight:400,marginLeft:4}}>/ {stats.length}</span></div>
      </div>
    </div>

    {loading?<Loader/>:withData.length===0?
      <Empty emoji="📈" text={stats.length===0?"등록된 품목이 없습니다":`${RANGE_LABEL[range]} 동안 완료된 생산 실적이 없습니다`}/>:
      <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8}}>
        <table className="aps-table">
          <thead><tr>
            <th>품목</th>
            <th className="center" style={{width:70}}>구분</th>
            <th className="right" style={{width:80}}>완료</th>
            <th className="right hide-mobile" style={{width:100}}>총 수량</th>
            <th className="right" style={{width:110}}>총 시간</th>
            <th className="right hide-mobile" style={{width:110}}>평균 시간</th>
            <th className="right hide-mobile" style={{width:130}}>계획↔실제</th>
            <th className="right" style={{width:120}}>시간당 생산</th>
            <th className="center hide-mobile" style={{width:110}}>최근 완료</th>
          </tr></thead>
          <tbody>
            {withData.map(s=>{
              const variance=Number(s.avg_actual_hours)-Number(s.avg_planned_hours);
              const variancePct=Number(s.avg_planned_hours)>0?(variance/Number(s.avg_planned_hours)*100):0;
              const vColor=variance>0.05?"#ef4444":variance<-0.05?"#22c55e":"var(--muted)";
              const isOpen=expanded===s.item_id;
              const drillPlans=itemPlans[s.item_id]||[];
              return <React.Fragment key={s.item_id}>
                <tr onClick={()=>toggleExpand(s)} style={{cursor:"pointer",background:isOpen?"var(--card-bg)":""}} title="클릭하여 완료 계획 목록 펼치기">
                  <td>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{display:"inline-block",fontSize:9,color:"var(--muted)",transition:"transform 0.15s",transform:isOpen?"rotate(90deg)":"none"}}>▶</span>
                      <div>
                        <div style={{fontWeight:600}}>{s.item_name}</div>
                        <div style={{fontSize:11,color:"var(--muted)",fontFamily:"monospace"}}>{s.item_code}</div>
                      </div>
                    </div>
                  </td>
                  <td className="center"><Pill map={TYPE_PILL} k={s.item_type} label={TYPE_LABEL[s.item_type]}/></td>
                  <td className="right" style={{fontWeight:600}}>{s.plan_count}건</td>
                  <td className="right hide-mobile">{fmtNum(s.total_qty)} <span style={{fontSize:11,color:"var(--muted)"}}>{s.item_unit}</span></td>
                  <td className="right" style={{fontWeight:600,color:"#22c55e"}}>{fmtHours(s.total_actual_hours)}</td>
                  <td className="right hide-mobile">{fmtHours(s.avg_actual_hours)}</td>
                  <td className="right hide-mobile" style={{fontSize:12,color:vColor}}>
                    <div>{fmtHours(s.avg_planned_hours)} → {fmtHours(s.avg_actual_hours)}</div>
                    {Math.abs(variancePct)>=1&&<div style={{fontSize:10,marginTop:2}}>{variance>=0?"+":""}{variancePct.toFixed(0)}%</div>}
                  </td>
                  <td className="right" style={{fontWeight:600,color:"#06b6d4"}}>{fmtNum(s.qty_per_hour)} <span style={{fontSize:11,color:"var(--muted)",fontWeight:400}}>{s.item_unit}/h</span></td>
                  <td className="center hide-mobile" style={{fontSize:11,color:"var(--muted)"}}>{s.last_completed_at?fmtKstDateTime(s.last_completed_at):"-"}</td>
                </tr>
                {isOpen&&<tr>
                  <td colSpan={9} style={{padding:0,background:"var(--card-bg)",borderTop:"1px solid var(--div2)",borderBottom:"1px solid var(--div2)"}}>
                    {itemPlansLoading&&drillPlans.length===0?
                      <div style={{padding:14,fontSize:11,color:"var(--muted)"}}>완료 계획 로딩 중...</div>:
                      drillPlans.length===0?
                      <div style={{padding:14,fontSize:11,color:"var(--muted)"}}>이 기간에 완료된 계획이 없습니다</div>:
                      <StatsDrilldownTable plans={drillPlans} editingId={editingId} editForm={editForm} setEditForm={setEditForm} saving={saving} startEdit={startEdit} cancelEdit={cancelEdit} saveEdit={saveEdit}/>
                    }
                  </td>
                </tr>}
              </React.Fragment>;
            })}
            {withoutData.length>0&&<tr><td colSpan={9} style={{padding:"14px 12px",fontSize:11,color:"var(--dimmer)",background:"var(--card-bg)"}}>아직 실적 없음: {withoutData.map(s=>s.item_name).join(", ")}</td></tr>}
          </tbody>
        </table>
      </div>
    }
    <div style={{fontSize:11,color:"var(--dimmer)",marginTop:8,lineHeight:1.5}}>
      ※ 실제 시각은 "▶ 시작" / "✓ 완료" 버튼 클릭 순간에 자동 기록됩니다 (KST) · 잘못 기록된 시각·실제 수량은 품목 행을 클릭해 펼친 뒤 ✏ 버튼으로 직접 수정 가능 · 실제 수량을 비워두면 계획 수량 그대로 통계 반영 · 365일 초과 완료/취소 계획은 매일 1회 자동 정리됨 · 계획↔실제 차이는 평균 시간 기준 {">5%"} 초과 시 색상 표시
    </div>
  </div>;
}

// 재고 시트 (제품/원육 엑셀 업로드 → 이미지 다운로드)
// ═══════════════════════════════════════════
function todayKoreanLabel(){
  const d=new Date();
  const dow=["일","월","화","수","목","금","토"][d.getDay()];
  const mm=String(d.getMonth()+1).padStart(2,"0");
  const dd=String(d.getDate()).padStart(2,"0");
  return `${mm}/${dd} (${dow})`;
}
function findHeaderRow(rows){
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r=rows[i]||[];
    for(let j=0;j<Math.min(r.length,5);j++){
      const v=String(r[j]||"").replace(/\s/g,"");
      if(v==="상품코드"||v==="제품코드"||v==="원육코드"||v==="품목코드")return i;
    }
  }
  return 2; // 사진 예시 파일 기본값
}
function findColumns(headerRow){
  // 같은 이름의 Box·Kg가 2번씩 등장 → 두 번째(잔량)를 사용
  let boxCol=-1,kgCol=-1,boxCount=0,kgCount=0;
  for(let i=0;i<headerRow.length;i++){
    const raw=String(headerRow[i]||"").trim();
    const norm=raw.replace(/\s/g,"");
    if(/^Box$/i.test(norm)){
      boxCount++;
      if(boxCount===2)boxCol=i;
    }
    if(/^입고\(Kg\)$/i.test(norm)){kgCount++}
    if(/잔량.*Kg/i.test(norm)){kgCol=i}
    else if(/^Kg$/i.test(norm)){
      kgCount++;
      if(kgCount===2&&kgCol===-1)kgCol=i;
    }
  }
  if(boxCol===-1)boxCol=12;
  if(kgCol===-1)kgCol=13;
  return {boxCol,kgCol};
}
function parseInventoryWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  if(!ws)throw new Error("시트를 찾을 수 없습니다");
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const headerIdx=findHeaderRow(rows);
  const{boxCol,kgCol}=findColumns(rows[headerIdx]||[]);
  const grouped={};
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i]||[];
    const code=r[0];
    if(code==null||code==="")continue;
    const key=String(code).trim();
    if(!key)continue;
    if(!grouped[key]){
      grouped[key]={code:key,name:String(r[1]||"").trim(),origin:String(r[2]||"").trim(),box:0,kg:0};
    }
    const bx=Number(r[boxCol]);
    const kg=Number(r[kgCol]);
    if(!isNaN(bx))grouped[key].box+=bx;
    if(!isNaN(kg))grouped[key].kg+=kg;
  }
  return Object.values(grouped).sort((a,b)=>a.code.localeCompare(b.code));
}

  {code:"F0000082",name:"쿠팡_돼지목전지(만능) 2kg*5",color:"w"}
];
const COLOR_LABEL={y:"노랑",o:"주황",b:"파랑",g:"초록",p:"핑크",w:"흰색"};
const COLOR_PREVIEW={y:"#fff2b3",o:"#fcd5b4",b:"#dbe5f1",g:"#d8e4bc",p:"#f2dcdb",w:"#ffffff"};
const TEMPLATE_KEY="aps-inv-template";
const INVENTORY_DATA_KEY="aps-inv-data";  // 업로드한 재고 데이터 자동 저장 (생산계획 탭에서 공유)

// ───── 제품 마스터 목록(template) 로컬 저장 ─────
// 2026-08-11: 목록도 Supabase payload 에 함께 동기화 (기존엔 localStorage 전용이라
//             다른 기기·스토리지 초기화 시 기본 37개 목록으로 되돌아갔음)
function loadStoredTemplate(){
  try{
    const t=localStorage.getItem(TEMPLATE_KEY);
    if(t){const p=JSON.parse(t);if(Array.isArray(p))return p}
  }catch(e){}
  return null;  // null = 이 기기에 저장된 목록 없음 (빈 배열과 구분)
}
function saveStoredTemplate(tpl){
  if(!Array.isArray(tpl))return;
  try{
    localStorage.setItem(TEMPLATE_KEY,JSON.stringify(tpl));
    window.dispatchEvent(new CustomEvent("aps-inv-data-change"));
  }catch(e){}
}

function loadStoredInventory(){
  try{
    const raw=localStorage.getItem(INVENTORY_DATA_KEY);
    if(!raw)return null;
    const obj=JSON.parse(raw);
    if(!obj||typeof obj!=="object")return null;
    return {
      products:Array.isArray(obj.products)?obj.products:[],
      raws:Array.isArray(obj.raws)?obj.raws:[],
      prodName:obj.prodName||"",
      rawName:obj.rawName||"",
      dateLabel:obj.dateLabel||"",
      title:obj.title||"",
      savedAt:obj.savedAt||""
    };
  }catch(e){return null}
}
function saveStoredInventory(patch){
  try{
    const prev=loadStoredInventory()||{products:[],raws:[],prodName:"",rawName:"",dateLabel:"",title:"",savedAt:""};
    const next={...prev,...patch,savedAt:patch&&patch.savedAt?patch.savedAt:new Date().toISOString()};
    localStorage.setItem(INVENTORY_DATA_KEY,JSON.stringify(next));
    // 같은 탭 내 다른 컴포넌트에 알림 (storage 이벤트는 다른 탭에서만 발생)
    try{window.dispatchEvent(new CustomEvent("aps-inv-data-change"));}catch(e){}
  }catch(e){}
}

// ───── Supabase 원격 동기화 (2026-06-21) ─────
// PC에서 업로드한 재고 시트를 모바일에서도 보기 위해 Supabase 싱글톤 테이블에 저장
function _normalizeRemoteInv(r){
  if(!r||typeof r!=="object")return null;
  return {
    products:Array.isArray(r.products)?r.products:[],
    raws:Array.isArray(r.raws)?r.raws:[],
    prodName:r.prodName||"",
    rawName:r.rawName||"",
    dateLabel:r.dateLabel||"",
    title:r.title||"",
    template:Array.isArray(r.template)?r.template:null,  // 구버전 payload 에는 없음 → null
    savedAt:r.updated_at||r.savedAt||""
  };
}
// savedAt 문자열을 ms timestamp로 정규화 (timezone format 차이 흡수)
//  - 클라이언트 toISOString()  : "2026-06-29T05:30:00.000Z"
//  - Postgres timestamptz      : "2026-06-29T14:30:05.123456+00:00"
//  두 형식은 문자열 비교 시 부정확 → 항상 Date 기반 비교
function _toTs(s){if(!s)return 0;const t=new Date(s).getTime();return isNaN(t)?0:t}
function _invRemoteIsNewer(local,remote){
  const l=_toTs(local?.savedAt);
  const r=_toTs(remote?.savedAt);
  return r>l;
}
async function loadRemoteInventory(adminHash){
  if(!adminHash){console.warn("[aps-inv-sync] load skipped: no adminHash");return null}
  try{
    const r=await rpc("aps_get_inventory_sheet",{p_admin_hash:adminHash});
    return _normalizeRemoteInv(r);
  }catch(e){console.warn("[aps-inv-sync] load failed:",e?.message||e);return null}
}
async function saveRemoteInventory(adminHash,patch){
  if(!adminHash){console.warn("[aps-inv-sync] save skipped: no adminHash");return null}
  try{
    const cur=loadStoredInventory()||{products:[],raws:[],prodName:"",rawName:"",dateLabel:"",title:""};
    const merged={...cur,...(patch||{})};
    const payload={
      products:merged.products||[],
      raws:merged.raws||[],
      prodName:merged.prodName||"",
      rawName:merged.rawName||"",
      dateLabel:merged.dateLabel||"",
      title:merged.title||""
    };
    // 제품 마스터 목록도 함께 저장. payload 는 통째로 교체되므로 빠뜨리면 서버 목록이 지워진다
    //  → 이 기기에 목록이 없으면 서버의 기존 목록을 그대로 실어서 보존
    let tpl=Array.isArray(patch&&patch.template)?patch.template:loadStoredTemplate();
    if(!Array.isArray(tpl)){
      const cur2=await loadRemoteInventory(adminHash);
      if(cur2&&Array.isArray(cur2.template))tpl=cur2.template;
    }
    if(Array.isArray(tpl))payload.template=tpl;
    const updatedAt=await rpc("aps_save_inventory_sheet",{p_admin_hash:adminHash,p_payload:payload});
    // 서버 timestamp 를 로컬 캐시에도 반영 → 다음 비교 시 일관성 유지
    if(typeof updatedAt==="string"&&updatedAt)saveStoredInventory({savedAt:updatedAt});
    return updatedAt||null;
  }catch(e){console.warn("[aps-inv-sync] save failed:",e?.message||e);return null}
}
async function clearRemoteInventory(adminHash){
  if(!adminHash){console.warn("[aps-inv-sync] clear skipped: no adminHash");return}
  try{await rpc("aps_clear_inventory_sheet",{p_admin_hash:adminHash})}
  catch(e){console.warn("[aps-inv-sync] clear failed:",e?.message||e)}
}
// 원격 payload 의 제품 마스터 목록을 이 기기에 반영할지 판단
//  - 이 기기에 저장된 목록이 없으면(첫 접속·스토리지 초기화) 무조건 채택
//  - 있으면 원격이 더 최신일 때만 채택
// 반환: 채택한 목록 배열 | null(유지)
function adoptRemoteTemplate(remote,localTs,remoteTs){
  if(!remote||!Array.isArray(remote.template))return null;
  const local=loadStoredTemplate();
  if(local&&!(remoteTs>localTs))return null;
  saveStoredTemplate(remote.template);
  return remote.template;
}
// 원격에서 가져온 데이터로 로컬 캐시 교체 + 이벤트 발행
function applyRemoteInventoryToLocal(remote){
  if(!remote)return;
  try{
    localStorage.setItem(INVENTORY_DATA_KEY,JSON.stringify(remote));
    window.dispatchEvent(new CustomEvent("aps-inv-data-change"));
  }catch(e){}
}

function templateToText(tpl){
  return tpl.map(t=>`${t.code} | ${t.name||""} | ${t.color||"w"}`).join("\n");
}
function parseTemplateText(text){
  const out=[];
  for(const line of (text||"").split("\n")){
    const trimmed=line.trim();
    if(!trimmed||trimmed.startsWith("#"))continue;
    const parts=trimmed.split("|").map(s=>s.trim());
    const code=parts[0];
    if(!code)continue;
    const name=parts[1]||"";
    let color=(parts[2]||"w").toLowerCase();
    if(!COLOR_LABEL[color])color="w";
    out.push({code,name,color});
  }
  return out;
}

function InventorySheetTab({adminHash}){
  const stored=loadStoredInventory();
  const[products,setProducts]=useState(stored?.products||[]);
  const[raws,setRaws]=useState(stored?.raws||[]);
  const[prodName,setProdName]=useState(stored?.prodName||"");
  const[rawName,setRawName]=useState(stored?.rawName||"");
  const[title,setTitle]=useState(stored?.title||"4층 제품 & 원육 재고");
  const[dateLabel,setDateLabel]=useState(todayKoreanLabel());
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState("");
  const[syncStatus,setSyncStatus]=useState(""); // "syncing" | "synced" | "error" | ""
  // 원자재 BOM 기반 필요 안전재고 (aps_get_material_requirements)
  const[items,setItems]=useState([]);
  const[matReqs,setMatReqs]=useState({}); // {material_id: {code,name,required_kg,source_count,sources}}
  useEffect(()=>{
    if(!adminHash)return;
    let cancelled=false;
    (async()=>{
      try{
        const[itemsRes,reqsRes]=await Promise.all([
          rpc("aps_list_items",{p_admin_hash:adminHash}),
          rpc("aps_get_material_requirements",{p_admin_hash:adminHash}).catch(_=>[])
        ]);
        if(cancelled)return;
        setItems(itemsRes||[]);
        const map={};
        for(const r of (reqsRes||[]))map[r.material_id]=r;
        setMatReqs(map);
      }catch(e){console.error("[inv-sheet] items/reqs load:",e)}
    })();
    return()=>{cancelled=true};
  },[adminHash]);

  // 마운트 시 원격에서 최신 재고 시트 fetch → 로컬보다 새로우면 교체
  useEffect(()=>{
    if(!adminHash)return;
    let cancelled=false;
    (async()=>{
      setSyncStatus("syncing");
      const remote=await loadRemoteInventory(adminHash);
      if(cancelled)return;
      const localTs=_toTs(stored?.savedAt);
      const remoteTs=_toTs(remote?.savedAt);
      const action=!remote
        ?(stored&&(stored.products?.length||stored.raws?.length)?"push-local":"empty")
        :(remoteTs>localTs?"apply-remote":(localTs>remoteTs?"push-local":"same"));
      console.info("[aps-inv-sync] InventorySheetTab mount:",{localSaved:stored?.savedAt||"",remoteSaved:remote?.savedAt||"",action});
      // 제품 마스터 목록은 재고 데이터와 별개로 판단 (이 기기에 목록이 없으면 원격 채택)
      const adoptedTpl=adoptRemoteTemplate(remote,localTs,remoteTs);
      if(adoptedTpl)setTemplate(adoptedTpl);
      if(remote){
        // 원격이 더 새롭거나 로컬이 없으면 원격으로 교체
        if(remoteTs>localTs){
          setProducts(remote.products);
          setRaws(remote.raws);
          setProdName(remote.prodName);
          setRawName(remote.rawName);
          if(remote.title)setTitle(remote.title);
          applyRemoteInventoryToLocal(remote);
        }else if(localTs>remoteTs){
          // 로컬이 더 새로우면 원격에 push (오프라인 업로드 후 첫 접속 시 등)
          await saveRemoteInventory(adminHash,stored);
        }
        setSyncStatus("synced");
      }else{
        // 원격이 비어있는데 로컬에 데이터(또는 편집한 제품 목록)가 있으면 push
        if((stored&&(stored.products?.length||stored.raws?.length))||loadStoredTemplate()){
          const ok=await saveRemoteInventory(adminHash,stored);
          setSyncStatus(ok?"synced":"error");
        }else{
          setSyncStatus("synced");
        }
      }
    })();
    return()=>{cancelled=true};
  },[adminHash]);
  // 저장된 목록이 없으면 기본 목록을 "표시만" 한다 (localStorage 에는 쓰지 않음)
  //  → 저장한 적 없는 기기를 구분해야 원격 목록을 채택할 수 있음
  const[template,setTemplate]=useState(()=>loadStoredTemplate()||DEFAULT_PRODUCT_TEMPLATE);
  const[editing,setEditing]=useState(false);
  const[editText,setEditText]=useState("");
  const sheetRef=useRef(null);

  async function handleFile(e,kind){
    const f=e.target.files&&e.target.files[0];
    e.target.value=""; // 같은 파일 재업로드 허용
    if(!f)return;
    setErr("");setBusy(true);
    try{
      if(typeof XLSX==="undefined")throw new Error("XLSX 라이브러리 로드 실패 — 새로고침 후 다시 시도하세요");
      const buf=await f.arrayBuffer();
      const items=parseInventoryWorkbook(buf);
      let patch;
      if(kind==="product"){setProducts(items);setProdName(f.name);patch={products:items,prodName:f.name,title,dateLabel}}
      else{setRaws(items);setRawName(f.name);patch={raws:items,rawName:f.name,title,dateLabel}}
      saveStoredInventory(patch);
      // 원격 동기화 (비동기 fire-and-forget 아닌 대기 — 실패 시 사용자에게 알려줌)
      if(adminHash){
        setSyncStatus("syncing");
        const ok=await saveRemoteInventory(adminHash,patch);
        setSyncStatus(ok?"synced":"error");
      }
    }catch(ex){
      setErr((kind==="product"?"제품":"원육")+" 파일 처리 오류: "+(ex.message||ex));
    }finally{setBusy(false)}
  }

  async function downloadImage(){
    if(!sheetRef.current)return;
    setBusy(true);setErr("");
    try{
      if(document.fonts&&document.fonts.ready)await document.fonts.ready;
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      const canvas=await html2canvas(sheetRef.current,{scale:2,backgroundColor:"#ffffff",useCORS:true,letterRendering:true});
      const safeDate=dateLabel.replace(/[\/\\?%*:|"<>()]/g,"_").replace(/\s+/g,"_");
      const a=document.createElement("a");
      a.download=`재고시트_${safeDate}.png`;
      a.href=canvas.toDataURL("image/png");
      document.body.appendChild(a);a.click();document.body.removeChild(a);
    }catch(ex){
      setErr("이미지 생성 오류: "+(ex.message||ex));
    }finally{setBusy(false)}
  }

  async function clearAll(){
    setProducts([]);setRaws([]);setProdName("");setRawName("");setErr("");
    try{
      localStorage.removeItem(INVENTORY_DATA_KEY);
      window.dispatchEvent(new CustomEvent("aps-inv-data-change"));
    }catch(e){}
    if(adminHash){
      setSyncStatus("syncing");
      await clearRemoteInventory(adminHash);
      // 업로드 데이터만 지우는 동작 → 편집한 제품 목록은 서버에 다시 올려 보존
      const tpl=loadStoredTemplate();
      if(tpl)await saveRemoteInventory(adminHash,{template:tpl});
      setSyncStatus("synced");
    }
  }

  // 제목/날짜 변경 시 저장 (업로드한 데이터가 있을 때만) — 원격은 디바운스
  useEffect(()=>{
    if(products.length===0&&raws.length===0)return;
    saveStoredInventory({title,dateLabel});
    if(!adminHash)return;
    const t=setTimeout(()=>{
      saveRemoteInventory(adminHash,{title,dateLabel});
    },600);
    return()=>clearTimeout(t);
  },[title,dateLabel,adminHash,products.length,raws.length]);

  function openEdit(){setEditText(templateToText(template));setEditing(true)}
  function saveTemplate(){
    const parsed=parseTemplateText(editText);
    if(parsed.length===0){
      if(!confirm("목록이 비어 있습니다. 비운 채로 저장하시겠습니까? (제품 표가 빈 칸으로 표시됩니다)"))return;
    }
    setTemplate(parsed);
    saveStoredTemplate(parsed);
    setEditing(false);
    // 다른 기기에서도 같은 목록을 쓰도록 원격에도 반영
    if(adminHash){
      setSyncStatus("syncing");
      saveRemoteInventory(adminHash,{template:parsed}).then(ok=>setSyncStatus(ok?"synced":"error"));
    }
  }
  function resetTemplate(){
    if(!confirm("기본 마스터 목록(사진 기준 37개)으로 되돌릴까요?"))return;
    setEditText(templateToText(DEFAULT_PRODUCT_TEMPLATE));
  }

  const productMap=useMemo(()=>{
    const m={};for(const p of products)m[p.code]=p;return m;
  },[products]);
  const rows=template.map(t=>{
    const p=productMap[t.code];
    return {code:t.code,name:t.name||(p?p.name:""),color:t.color||"w",box:p?Math.round(p.box):0,hasData:!!p};
  });
  const extras=products.filter(p=>!template.some(t=>t.code===p.code));

  const useTemplate=template.length>0;
  const hasAny=products.length>0||raws.length>0||useTemplate;
  const totalProdBox=products.reduce((s,p)=>s+(p.box||0),0);
  const totalRawBox=raws.reduce((s,r)=>s+(r.box||0),0);
  const totalRawKg=raws.reduce((s,r)=>s+(r.kg||0),0);

  // 원자재 재고 현황: BOM 필요치 vs 재고시트 매칭 kg
  // status: empty(재고 0), critical(<50%), low(<100%), ok(>=100%)
  const materialStatus=useMemo(()=>{
    const mats=items.filter(i=>i.type==="material");
    if(!mats.length)return[];
    const stockByMat=matchRawsToMaterials(raws,mats);
    const list=[];
    for(const m of mats){
      const req=matReqs[m.id];
      const requiredKg=Number(req?.required_kg)||0;
      if(requiredKg<=0)continue; // BOM에 부모 없는 원자재는 제외
      const stock=stockByMat[m.id];
      const stockKg=Number(stock?.totalKg)||0;
      const ratio=requiredKg>0?stockKg/requiredKg:1;
      let status="ok";
      if(stockKg<=0)status="empty";
      else if(ratio<0.5)status="critical";
      else if(ratio<1.0)status="low";
      list.push({
        id:m.id,code:m.code,name:m.name,
        requiredKg,stockKg,ratio,status,
        matches:stock?.matches||[],
        hasKeywords:parseMatchKeywords(m.match_keywords).length>0,
        sources:req?.sources||[]
      });
    }
    list.sort((a,b)=>a.ratio-b.ratio); // 부족한 순
    return list;
  },[items,matReqs,raws]);
  const shortageList=materialStatus.filter(m=>m.status==="empty"||m.status==="critical");
  const hasMatStatus=materialStatus.length>0;

  return <div>
    <div className="inv-upload-grid">
      <label className={"inv-upload-card"+(products.length?" has":"")} style={{cursor:"pointer",display:"block"}}>
        <h4>📦 제품 파일</h4>
        <div className="hint">알파벳 prefix 코드(E·F·H 등) 제품 재고 엑셀</div>
        <input type="file" accept=".xlsx,.xls" onChange={e=>handleFile(e,"product")} style={{display:"none"}}/>
        <div style={{fontSize:12,color:"var(--muted)"}}>📁 클릭해서 파일 선택</div>
        {prodName&&<div className="filename">{prodName}</div>}
        {products.length>0&&<div className="count">✓ {products.length}개 품목 · 총 {Math.round(totalProdBox).toLocaleString()} box</div>}
      </label>
      <label className={"inv-upload-card"+(raws.length?" has":"")} style={{cursor:"pointer",display:"block"}}>
        <h4>🥩 원육 파일</h4>
        <div className="hint">숫자 prefix 코드(1xxxx·3xxxx 등) 원육 재고 엑셀</div>
        <input type="file" accept=".xlsx,.xls" onChange={e=>handleFile(e,"material")} style={{display:"none"}}/>
        <div style={{fontSize:12,color:"var(--muted)"}}>📁 클릭해서 파일 선택</div>
        {rawName&&<div className="filename">{rawName}</div>}
        {raws.length>0&&<div className="count">✓ {raws.length}개 품목 · {totalRawKg.toFixed(1)} kg · {Math.round(totalRawBox).toLocaleString()} box</div>}
      </label>
    </div>

    <div className="aps-toolbar" style={{marginBottom:14}}>
      <div style={{display:"flex",flexDirection:"column",gap:2}}>
        <span style={{fontSize:11,color:"var(--muted)",fontWeight:500}}>제목</span>
        <input className="aps-input" style={{width:240}} value={title} onChange={e=>setTitle(e.target.value)} placeholder="4층 제품 & 원육 재고"/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:2}}>
        <span style={{fontSize:11,color:"var(--muted)",fontWeight:500}}>날짜 라벨</span>
        <input className="aps-input" style={{width:140}} value={dateLabel} onChange={e=>setDateLabel(e.target.value)} placeholder="06/19 (금)"/>
      </div>
      <div style={{flex:1}}></div>
      {adminHash&&<span style={{
        fontSize:11,padding:"4px 8px",borderRadius:6,fontWeight:600,
        background:syncStatus==="synced"?"rgba(34,197,94,0.12)":syncStatus==="syncing"?"rgba(148,163,184,0.16)":syncStatus==="error"?"rgba(239,68,68,0.12)":"transparent",
        color:syncStatus==="synced"?"#16a34a":syncStatus==="syncing"?"var(--muted)":syncStatus==="error"?"#dc2626":"var(--muted)"
      }}>
        {syncStatus==="synced"?"☁ 동기화됨":syncStatus==="syncing"?"☁ 동기화 중…":syncStatus==="error"?"⚠ 동기화 실패":""}

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APS 생산계획 — STOCKPULSE</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="shared.js"></script>
  <style>
    .aps-shell{max-width:1100px;margin:0 auto;padding:20px 32px 60px;box-sizing:border-box}
    .aps-header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;max-width:1100px;margin:0 auto;box-sizing:border-box}
    .aps-tabs{display:flex;gap:4px;border-bottom:1px solid var(--div2);margin-bottom:20px;overflow-x:auto}
    .aps-tab{padding:10px 18px;border:none;background:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap;transition:color .15s,border-color .15s}
    .aps-tab:hover{color:var(--text)}
    .aps-tab.active{color:var(--text);border-bottom-color:#06b6d4}
    .aps-table{width:100%;border-collapse:collapse;font-size:13px}
    .aps-table th{text-align:left;padding:9px 10px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--div2);background:var(--card-bg)}
    .aps-table td{padding:10px;border-bottom:1px solid var(--div);vertical-align:middle}
    .aps-table tr:hover td{background:var(--hover)}
    .aps-table th.right,.aps-table td.right{text-align:right}
    .aps-table th.center,.aps-table td.center{text-align:center}
    .aps-input{width:100%;padding:8px 12px;border-radius:7px;border:1px solid var(--inp-bd);background:var(--inp-bg);color:var(--text);font-size:13px;outline:none;font-family:inherit;box-sizing:border-box;transition:border-color .15s}
    .aps-input:focus{border-color:rgba(6,182,212,0.4)}
    .aps-select{padding:8px 12px;border-radius:7px;border:1px solid var(--inp-bd);background:var(--inp-bg);color:var(--text);font-size:13px;outline:none;font-family:inherit;cursor:pointer;box-sizing:border-box}
    .aps-btn{padding:8px 16px;border-radius:7px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
    .aps-btn-primary{background:linear-gradient(135deg,#06b6d4,#8b5cf6);color:#fff}
    .aps-btn-primary:hover{opacity:.9;transform:translateY(-1px)}
    .aps-btn-secondary{background:var(--card-bg);border:1px solid var(--card-bd);color:var(--text)}
    .aps-btn-secondary:hover{background:var(--card-hbg);border-color:var(--card-hbd)}
    .aps-btn-danger{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#ef4444}
    .aps-btn-danger:hover{background:rgba(239,68,68,0.2)}
    .aps-btn-sm{padding:5px 10px;font-size:12px}
    .aps-pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.02em}
    .aps-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .aps-filter{display:flex;gap:4px;flex-wrap:wrap}
    .aps-filter button{padding:6px 12px;border-radius:6px;border:1px solid var(--card-bd);background:var(--card-bg);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
    .aps-filter button.on{background:rgba(6,182,212,0.12);border-color:rgba(6,182,212,0.4);color:#06b6d4}
    .aps-form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px}
    .aps-form-label{font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
    .aps-modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;box-sizing:border-box}
    .aps-modal{background:var(--bg);border:1px solid var(--card-bd);border-radius:12px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-sizing:border-box}
    .aps-modal-lg{max-width:760px}
    .aps-modal-bg.aps-side{justify-content:flex-end;align-items:stretch;padding:0}
    .aps-modal.aps-modal-side{max-width:480px;max-height:100vh;height:100vh;border-radius:0;border-right:none;border-top:none;border-bottom:none;animation:aps-slide-in .22s ease-out}
    @keyframes aps-slide-in{from{transform:translateX(100%)}to{transform:translateX(0)}}
    @media (max-width:600px){.aps-modal.aps-modal-side{max-width:100%}}
    .aps-empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13px}
    .aps-empty-emoji{font-size:32px;margin-bottom:8px;opacity:.7}
    .aps-err{color:#ef4444;font-size:12px;margin-top:6px}
    .aps-section-title{font-size:14px;font-weight:700;color:var(--text);margin:18px 0 10px}
    .aps-gantt-bar{cursor:pointer;transition:opacity .15s,transform .15s,box-shadow .15s;overflow:hidden;display:flex;align-items:center;border-radius:4px}
    .aps-gantt-bar:hover{opacity:.85;transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,0.25);z-index:3}
    .aps-view-toggle{display:flex;gap:0;border:1px solid var(--card-bd);border-radius:7px;overflow:hidden}
    .aps-view-toggle button{padding:6px 12px;border:none;background:var(--card-bg);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
    .aps-view-toggle button.on{background:rgba(6,182,212,0.14);color:#06b6d4}
    .aps-view-toggle button:not(:last-child){border-right:1px solid var(--card-bd)}
    .aps-list-layout{display:flex;gap:14px;align-items:flex-start}
    .aps-list-main{flex:1;min-width:0}
    .aps-week-panel{width:270px;flex-shrink:0;background:var(--card-bg);border:1px solid var(--card-bd);border-radius:8px;padding:12px;max-height:78vh;overflow-y:auto;position:sticky;top:14px}
    .aps-week-panel-title{font-size:13px;font-weight:700;color:var(--text);padding:2px 4px 10px;border-bottom:1px solid var(--div2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
    .aps-week-card{padding:8px 6px 9px;border-radius:7px;margin-bottom:10px;border:1px solid var(--div);background:var(--bg)}
    .aps-week-card-header{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text);padding:2px 4px 6px;border-bottom:1px solid var(--div);margin-bottom:6px}
    .aps-week-badge{font-size:10px;font-weight:600;color:#06b6d4;background:rgba(6,182,212,0.14);padding:1px 6px;border-radius:8px;letter-spacing:.02em}
    .aps-week-badge.future{color:#8b5cf6;background:rgba(139,92,246,0.14)}
    .aps-week-count{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
    .aps-week-export-btn{background:none;border:1px solid var(--card-bd);border-radius:5px;padding:2px 6px;font-size:12px;cursor:pointer;color:var(--muted);transition:background .12s,border-color .12s,color .12s;font-family:inherit;line-height:1}
    .aps-week-export-btn:hover:not(:disabled){background:rgba(6,182,212,0.12);border-color:rgba(6,182,212,0.4);color:#06b6d4}
    .aps-week-export-btn:disabled{opacity:.6;cursor:wait}
    .aps-week-empty{font-size:11px;color:var(--dimmer);padding:6px 2px 2px;font-style:italic}
    .aps-week-days{display:flex;flex-direction:column;gap:6px}
    .aps-week-day{padding:5px 6px 6px;border-radius:6px;border:1px solid transparent;transition:background .12s,border-color .12s}
    .aps-week-day.today{background:rgba(245,158,11,0.05);border-color:rgba(245,158,11,0.25)}
    .aps-week-day.selected{background:rgba(6,182,212,0.06);border-color:rgba(6,182,212,0.32)}
    .aps-week-day-header{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;cursor:pointer;padding:2px 2px;border-radius:4px}
    .aps-week-day-header:hover{background:var(--hover)}
    .aps-week-dow{font-size:11px;font-weight:700;letter-spacing:.04em;width:14px;text-align:center}
    .aps-week-dow-date{font-size:11px;color:var(--text);font-weight:600}
    .aps-week-today-badge{font-size:9px;font-weight:700;color:#f59e0b;background:rgba(245,158,11,0.15);padding:1px 5px;border-radius:8px}
    .aps-week-day-count{margin-left:auto;font-size:10px;color:var(--muted);font-weight:500}
    .aps-week-day-empty{font-size:11px;color:var(--dimmer);padding:1px 4px 1px 22px;font-family:monospace}
    .aps-week-day-plans{display:flex;flex-direction:column;gap:3px;margin-top:4px;padding-left:4px}
    .aps-week-day-plan{display:grid;grid-template-columns:38px 1fr auto;gap:4px;align-items:center;padding:4px 6px;background:var(--card-bg);border:1px solid var(--div);border-radius:5px;font-size:11px;cursor:pointer;transition:background .12s,border-color .12s}
    .aps-week-day-plan:hover{background:var(--hover);border-color:var(--card-hbd)}
    .aps-week-day-plan-time{font-family:monospace;font-size:10px;color:var(--muted)}
    .aps-week-day-plan-name{font-weight:600;color:var(--text);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .aps-week-day-plan-qty{font-size:10px;color:var(--muted);text-align:right;white-space:nowrap}
    .aps-week-day-plan-status{grid-column:1/-1;display:inline-block;width:fit-content;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:600;letter-spacing:.02em}
    @media(max-width:780px){
      .aps-list-layout{flex-direction:column}
      .aps-week-panel{width:100%;max-height:none;position:static;order:-1}
    }
    /* === 생산계획 좌측 재고 패널 === */
    .aps-plans-layout{display:flex;gap:14px;align-items:flex-start}
    .aps-plans-main{flex:1;min-width:0}
    .aps-inv-panel{width:240px;flex-shrink:0;background:var(--card-bg);border:1px solid var(--card-bd);border-radius:8px;padding:10px 10px 12px;max-height:82vh;overflow-y:auto;position:sticky;top:14px;box-sizing:border-box}
    .aps-inv-panel-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text);padding:2px 2px 8px;border-bottom:1px solid var(--div2);margin-bottom:6px}
    .aps-inv-panel-date{margin-left:auto;font-size:10px;font-weight:600;color:#06b6d4;background:rgba(6,182,212,0.14);padding:2px 6px;border-radius:8px}
    .aps-inv-panel-x{background:none;border:none;font-size:13px;color:var(--muted);cursor:pointer;padding:0 2px;line-height:1;font-family:inherit}
    .aps-inv-panel-x:hover{color:var(--text)}
    .aps-inv-panel-meta{font-size:10px;color:var(--dimmer);padding:0 2px 8px}
    .aps-inv-panel-search{padding:5px 8px;font-size:11px;margin-bottom:8px}
    .aps-inv-panel-section-title{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);padding:8px 2px 4px;border-top:1px solid var(--div);margin-top:6px;letter-spacing:.02em;text-transform:uppercase}
    .aps-inv-panel-section-title:first-of-type{border-top:none;margin-top:0;padding-top:2px}
    .aps-inv-panel-empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:11px}
    .aps-inv-panel-row-empty{font-size:11px;color:var(--dimmer);padding:6px 4px;font-style:italic;text-align:center}
    .aps-inv-panel-tbl{width:100%;border-collapse:collapse;font-size:11px}
    .aps-inv-panel-tbl tr{transition:background .12s}
    .aps-inv-panel-tbl tr:hover{background:var(--hover)!important}
    .aps-inv-panel-tbl td{padding:3px 4px;border-bottom:1px solid var(--div);line-height:1.3;vertical-align:middle}
    .aps-inv-panel-tbl td.dot{width:10px;padding-right:0}
    .aps-inv-panel-tbl td.dot span{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:middle}
    .aps-inv-panel-tbl td.nm{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
    .aps-inv-panel-tbl td.qty{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--text);width:34px;white-space:nowrap}
    .aps-inv-panel-tbl td.qty.zero{color:#ef4444}
    .aps-inv-panel-tbl td.qty.low{color:#f59e0b}
    .aps-inv-panel-tbl td.safety{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;color:var(--muted);width:34px;white-space:nowrap;font-size:10px}
    .aps-inv-panel-tbl td.safety.none{color:var(--dimmer)}
    .aps-inv-panel-tbl tr.head td{padding:2px 4px;font-size:9px;color:var(--dimmer);font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--div2)}
    .aps-inv-panel-subhead{font-size:10px;color:var(--muted);font-weight:600;padding:8px 2px 4px!important;background:none!important;text-transform:uppercase;letter-spacing:.04em}
    @media(max-width:980px){
      .aps-plans-layout{flex-direction:column}
      .aps-inv-panel{width:100%;max-height:280px;position:static;order:-1}
      .aps-inv-panel-tbl td.nm{max-width:none}
    }
    /* === 재고 시트 (사진 형식 출력용) === */
    .inv-sheet{background:#fff;color:#111;padding:20px 24px;border-radius:8px;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;width:fit-content;max-width:100%;margin:0 auto;box-sizing:border-box}
    .inv-sheet-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:flex-end;margin-bottom:14px;column-gap:16px}
    .inv-sheet-title{font-size:22px;font-weight:700;color:#111;text-align:center;grid-column:2}
    .inv-sheet-date{font-size:15px;color:#333;font-weight:500;text-align:right;grid-column:3;justify-self:end;white-space:nowrap}
    .inv-sheet-spacer{display:block;grid-column:1}
    .inv-sheet-body{display:grid;grid-template-columns:max-content max-content;column-gap:14px;row-gap:0;align-items:flex-start;justify-content:center}
    .inv-sheet-col{min-width:0}
    /* 제품 2분할(JSX)을 왼쪽 한 열로 stack, 원육은 오른쪽 한 열 full-height */
    .inv-sheet-body > .inv-sheet-col:nth-child(1),
    .inv-sheet-body > .inv-sheet-col:nth-child(2){grid-column:1}
    .inv-sheet-body > .inv-sheet-col:nth-child(3){grid-column:2;grid-row:1 / span 2}
    /* 2번째 제품 테이블 헤더 숨김 → 1번 테이블과 자연스럽게 연결 */
    .inv-sheet-body > .inv-sheet-col:nth-child(2) .inv-tbl thead{display:none}
    .inv-tbl{border-collapse:collapse;font-size:11.5px;color:#111;width:100%;table-layout:auto}
    .inv-tbl thead th{background:#cfd8dc;color:#111;padding:5px 7px;text-align:left;font-weight:700;border:1px solid #b0bec5;font-size:11.5px;white-space:nowrap}
    .inv-tbl tbody td{padding:3px 7px;border-bottom:1px solid #eceff1;background:#fff;line-height:1.25}
    .inv-tbl.stripe tbody tr:nth-child(even) td{background:#fafafa}
    .inv-tbl .right{text-align:right}
    .inv-tbl .code{font-family:"Consolas","Menlo","Courier New",monospace;font-size:11px;color:#455a64;letter-spacing:.01em}
    .inv-tbl .zero{color:#dc2626;font-weight:700}
    .inv-tbl .qty{font-variant-numeric:tabular-nums;font-weight:600;padding-left:14px}
    .inv-tbl .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
    /* 제품 그룹 배경색 (사진과 동일) */
    .inv-row-y td{background:#fff2b3 !important}
    .inv-row-o td{background:#fcd5b4 !important}
    .inv-row-b td{background:#dbe5f1 !important}
    .inv-row-g td{background:#d8e4bc !important}
    .inv-row-p td{background:#f2dcdb !important}
    .inv-row-w td{background:#ffffff !important}
    /* 편집 모달 */
    .inv-edit-textarea{width:100%;min-height:420px;padding:10px;border:1px solid var(--inp-bd);border-radius:7px;background:var(--inp-bg);color:var(--text);font-family:"Consolas","Menlo","Courier New",monospace;font-size:12px;line-height:1.5;resize:vertical;box-sizing:border-box}
    .inv-edit-legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
    .inv-edit-legend span{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:#333}
    .inv-upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
    .inv-upload-card{border:1px dashed var(--card-bd);border-radius:8px;padding:14px;background:var(--card-bg);position:relative}
    .inv-upload-card.has{border-style:solid;border-color:rgba(6,182,212,0.5);background:rgba(6,182,212,0.05)}
    .inv-upload-card h4{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--text)}
    .inv-upload-card .hint{font-size:11px;color:var(--muted);margin-bottom:8px}
    .inv-upload-card .count{font-size:11px;color:#06b6d4;font-weight:600;margin-top:6px}
    .inv-upload-card .filename{font-size:11px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(max-width:700px){
      .inv-upload-grid{grid-template-columns:1fr}
      /* 재고 시트 모바일: 비율만 40/60으로 고정 (제품 stack / 원육 span은 디폴트에서 이미 처리) */
      .inv-sheet-body{grid-template-columns:minmax(0,40fr) minmax(0,60fr);column-gap:6px}
      .inv-sheet{padding:14px 10px}
      .inv-sheet-header{margin-bottom:10px;gap:6px}
      .inv-sheet-title{font-size:16px}
      .inv-sheet-date,.inv-sheet-spacer{min-width:60px;font-size:11px}
      /* 표가 그리드 셀 전체 폭을 채우도록 → 제품명 ↔ 재고수량 사이 빈 공간 제거 */
      .inv-tbl{font-size:10px;width:100%;table-layout:auto}
      .inv-tbl thead th{padding:3px 4px;font-size:10px}
      .inv-tbl tbody td{padding:2px 4px}
      .inv-tbl .name{max-width:none;white-space:normal;word-break:break-all;line-height:1.2;width:auto}
      .inv-tbl .qty{padding-left:4px;white-space:nowrap;width:1%}
      .inv-tbl .code{font-size:9.5px}
      /* 제품명이 남는 폭 전부 차지 (qty width:1%로 최소화) → 이름과 수량 사이 빈 공간 제거 */
      .inv-tbl tbody td.name{width:auto}
    }
    /* ─ 인원 관리 (Staff) ─ */
    .aps-staff-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding:10px 14px;background:var(--card-bg);border:1px solid var(--card-bd);border-radius:8px}
    .aps-staff-head .title{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.01em}
    .aps-staff-head .date{font-size:13px;font-weight:700;color:#06b6d4;background:rgba(6,182,212,0.14);padding:4px 10px;border-radius:6px}
    .aps-staff-head input[type="date"]{padding:5px 8px;font-size:12px;border-radius:6px;border:1px solid var(--inp-bd);background:var(--inp-bg);color:var(--text);font-family:inherit}
    .aps-staff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
    .aps-staff-card{background:var(--card-bg);border:2px solid var(--text);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;min-height:140px}
    .aps-staff-card-hdr{background:var(--text);color:var(--bg);font-size:13px;font-weight:700;text-align:center;padding:7px 8px;letter-spacing:.02em}
    .aps-staff-card-body{padding:8px 6px;flex:1;display:flex;flex-direction:column;gap:2px}
    .aps-staff-card-ftr{border-top:2px solid var(--text);text-align:center;font-size:12px;font-weight:700;padding:5px 8px;color:var(--text);background:var(--card-bg)}
    .aps-staff-row{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;cursor:pointer;transition:background .12s;user-select:none}
    .aps-staff-row:hover{background:var(--hover,rgba(148,163,184,0.08))}
    .aps-staff-row input{cursor:pointer;width:14px;height:14px;flex-shrink:0;accent-color:#22c55e}

<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback,useMemo,useRef}=React;

// ═══ Helpers ═══
async function hashPassword(pw){
  const enc=new TextEncoder().encode(pw);
  const buf=await crypto.subtle.digest("SHA-256",enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function rpc(name,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+name,{
    method:"POST",
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(body||{})
  });
  if(!r.ok){
    let msg="";
    try{const t=await r.text();msg=t}catch(e){msg=String(r.status)}
    throw new Error(msg||String(r.status));
  }
  const txt=await r.text();
  if(!txt)return null;
  try{return JSON.parse(txt)}catch(e){return txt}
}
function errMsg(e,map){
  const s=String(e?.message||e||"");
  for(const k in map){if(s.includes(k))return map[k]}
  return "오류: "+s.slice(0,80);
}
function fmtDate(s){
  if(!s)return "";
  try{const d=new Date(s);return d.toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\.\s?/g,"-").replace(/-$/,"")}catch(e){return s}
}
function fmtDateTime(s){
  if(!s)return "";
  try{const d=new Date(s);return d.toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return s}
}
function fmtNum(n){
  if(n==null||isNaN(n))return "0";
  const num=Number(n);
  return num.toLocaleString("ko-KR",{maximumFractionDigits:3});
}
function todayStr(){
  const d=new Date();
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),da=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${da}`;
}
// ═══ 주차 헬퍼 (월요일 기준 KST 주) ═══
function kstMonday(dateStr){
  // "YYYY-MM-DD" → 그 날짜를 포함하는 주의 월요일 "YYYY-MM-DD"
  const[y,m,d]=dateStr.split("-").map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  const dow=dt.getUTCDay(); // 0=일,1=월,...,6=토
  const diff=dow===0?-6:1-dow;
  dt.setUTCDate(dt.getUTCDate()+diff);
  return dt.toISOString().slice(0,10);
}
function addDays(dateStr,n){
  const[y,m,d]=dateStr.split("-").map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  dt.setUTCDate(dt.getUTCDate()+n);
  return dt.toISOString().slice(0,10);
}
function fmtMD(dateStr){
  if(!dateStr)return"";
  const p=dateStr.split("-");
  return `${parseInt(p[1])}/${parseInt(p[2])}`;
}

// ═══ KST 시간 변환 (서버 TIMESTAMPTZ ↔ 브라우저 datetime-local) ═══
// 모든 시간은 KST(UTC+9) 기준으로 입력/표시. ISO 문자열로 서버 저장.
const KST_OFFSET_MS=9*3600*1000;
function isoToKstInput(iso){
  // "2026-06-12T00:00:00+00:00" → "2026-06-12T09:00" (KST datetime-local 입력값)
  if(!iso)return"";
  const d=new Date(iso);
  if(isNaN(d.getTime()))return"";
  const kst=new Date(d.getTime()+KST_OFFSET_MS);
  return kst.toISOString().slice(0,16);
}
function kstInputToIso(input){
  // "2026-06-12T09:00" (KST로 해석) → "2026-06-12T09:00:00+09:00"
  if(!input)return null;
  if(input.length===16)return input+":00+09:00";
  return input+"+09:00";
}
function isoToKstDateStr(iso){
  if(!iso)return"";
  const d=new Date(iso);
  return new Date(d.getTime()+KST_OFFSET_MS).toISOString().slice(0,10);
}
function isoToKstHourFloat(iso){
  if(!iso)return 0;
  const d=new Date(iso);
  const kst=new Date(d.getTime()+KST_OFFSET_MS);
  return kst.getUTCHours()+kst.getUTCMinutes()/60+kst.getUTCSeconds()/3600;
}
function fmtKstDateTime(iso){
  if(!iso)return"";
  const d=new Date(iso);
  if(isNaN(d.getTime()))return"";
  const kst=new Date(d.getTime()+KST_OFFSET_MS);
  const m=String(kst.getUTCMonth()+1).padStart(2,"0");
  const da=String(kst.getUTCDate()).padStart(2,"0");
  const h=String(kst.getUTCHours()).padStart(2,"0");
  const mi=String(kst.getUTCMinutes()).padStart(2,"0");
  return `${m}/${da} ${h}:${mi}`;
}
function fmtKstTime(iso){
  if(!iso)return"";
  const d=new Date(iso);
  const kst=new Date(d.getTime()+KST_OFFSET_MS);
  return `${String(kst.getUTCHours()).padStart(2,"0")}:${String(kst.getUTCMinutes()).padStart(2,"0")}`;
}
// 박스당 중량 spec을 kg(number)로 파싱. "500"(단위 생략=kg), "500g", "1kg", "2.5kg", "1,500g" 모두 허용. 실패 시 null
function parseSpecKg(spec){
  if(spec==null||spec==="")return null;
  const s=String(spec).trim().toLowerCase().replace(/\s+/g,"");
  if(!s)return null;
  const m=s.match(/^([\d.,]+)(kg|g)?$/);
  if(!m)return null;
  const num=parseFloat(m[1].replace(/,/g,""));
  if(isNaN(num))return null;
  return m[2]==="g"?num/1000:num;
}
// kg(number) → 사람이 읽기 좋은 문자열. 1kg 이상은 kg, 미만은 g. 불필요한 0 제거
function fmtKg(kg){
  if(kg==null||isNaN(kg))return"";
  if(kg>=1){
    const s=kg%1===0?String(kg):kg.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
    return s+"kg";
  }
  return Math.round(kg*1000)+"g";
}

// ═══ 원육 재고 매칭 ═══
// 원자재 매칭 키워드 파싱: 문자열/배열 모두 허용, 빈 값 제거
function parseMatchKeywords(raw){
  if(!raw)return[];
  let arr=raw;
  if(typeof raw==="string"){
    try{arr=JSON.parse(raw)}catch(_){arr=[]}
  }
  if(!Array.isArray(arr))return[];
  return arr.map(k=>String(k||"").trim()).filter(Boolean);
}
// 재고시트 원육 이름(lower)에 키워드가 매칭되는지 판정
// 키워드 내부 공백은 AND: "삼겹양지 SWIFT" → 이름에 "삼겹양지"와 "SWIFT" 둘 다 포함되어야 매칭
function nameMatchesKeyword(rawNameLower,keyword){
  const parts=String(keyword||"").trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!parts.length)return false;
  return parts.every(p=>rawNameLower.includes(p));
}
// 재고시트 raws + 원자재 items(type='material')로부터 원자재별 총 kg 집계
// 반환: {materialId: {item, totalKg, matches:[{rawName,kg,keyword}]}}
// 각 원육은 첫 번째로 매칭된 원자재에만 귀속 (중복 계산 방지)
function matchRawsToMaterials(raws,materialItems){
  const result={};
  const mats=(materialItems||[]).filter(m=>m&&m.type==="material");
  for(const m of mats){
    result[m.id]={item:m,totalKg:0,matches:[]};
  }
  for(const raw of (raws||[])){
    const rawName=String(raw?.name||"").trim();
    if(!rawName)continue;
    const kg=Number(raw?.kg)||0;
    if(kg<=0)continue;
    const lower=rawName.toLowerCase();
    for(const m of mats){
      const kws=parseMatchKeywords(m.match_keywords);
      let hitKw=null;
      for(const kw of kws){
        if(nameMatchesKeyword(lower,kw)){hitKw=kw;break}
      }
      if(hitKw){
        result[m.id].totalKg+=kg;
        result[m.id].matches.push({rawName,kg,keyword:hitKw});
        break; // 하나의 원육은 하나의 원자재에만
      }
    }
  }
  return result;
}
// BOM 재귀 조회 → 특정 제품의 원자재별 필요 kg 계산
// bomByParent: {parentId: [{child_id, qty, loss_rate}, ...]}
// itemById: {id: item}
// BOM qty는 "제품 1단위(박스)당 원자재 kg" 해석 → totalNeed = qty × (1 + loss_rate/100) × plannedQty
// 반환: {materialId: {item, kg}}
function calcMaterialRequirements(itemId,plannedQty,bomByParent,itemById){
  const need={};
  const walk=(parentId,factor)=>{
    const rows=bomByParent[parentId]||[];
    for(const r of rows){
      const child=itemById[r.child_id];
      if(!child)continue;
      const eff=Number(r.qty)*(1+Number(r.loss_rate||0)/100)*factor;
      if(child.type==="material"){
        if(!need[child.id])need[child.id]={item:child,kg:0};
        need[child.id].kg+=eff;
      }else{
        // 반제품은 재귀 (다단 BOM 지원)
        walk(child.id,eff);
      }
    }
  };
  walk(itemId,Number(plannedQty)||0);
  return need;
}

// ═══ 로그인 화면 ═══
function LoginScreen({onLogin}){
  const[pw,setPw]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);
  const[cooldown,setCooldown]=useState(false);

  const submit=async()=>{
    if(!pw.trim()||pw.trim().length<2){setErr("비밀번호를 입력하세요");return}
    if(cooldown)return;
    setLoading(true);setErr("");
    try{
      const h=await hashPassword(pw.trim());
      const data=await rpc("admin_login",{p_hash:h});
      if(!data){
        setErr("관리자 비밀번호가 아닙니다");
        setCooldown(true);
        setTimeout(()=>setCooldown(false),3000);
      }else{
        onLogin(h,data);
      }
    }catch(e){setErr("로그인 실패: "+e.message)}
    setLoading(false);
  };

  return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"60vh"}}>
    <div style={{background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:12,padding:"32px 28px",width:380,maxWidth:"100%"}}>
      <div style={{textAlign:"center",marginBottom:"20px"}}>
        <div style={{fontSize:"36px",marginBottom:"8px"}}>🏭</div>
        <div style={{fontSize:"20px",fontWeight:700}}>APS 관리자 로그인</div>
        <div style={{fontSize:"12px",color:"var(--muted)",marginTop:"4px"}}>생산계획 시스템 — 관리자 비밀번호로 로그인</div>
      </div>
      <input className="aps-input" type="password" placeholder="관리자 비밀번호" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} autoFocus/>
      {err&&<div className="aps-err">{err}</div>}
      <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading||cooldown} style={{width:"100%",marginTop:"14px"}}>{loading?"확인 중...":cooldown?"잠시 후 다시":"로그인"}</button>
      <div style={{marginTop:"14px",textAlign:"center",fontSize:"12px",color:"var(--dimmer)"}}>관리자 페이지(admin.html)와 동일한 비밀번호 사용</div>
    </div>
  </div>;
}

// 품목 / BOM 탭
// ═══════════════════════════════════════════
function ItemForm({adminHash,initial,onSaved,onCancel}){
  const isEdit=!!initial;
  const[code,setCode]=useState(initial?.code||"");
  const[name,setName]=useState(initial?.name||"");
  const[type,setType]=useState(initial?.type||"product");
  const[unit,setUnit]=useState(initial?.unit||"EA");
  const[spec,setSpec]=useState(initial?.spec||"");
  const[safety,setSafety]=useState(initial?.safety_stock??0);
  const[lt,setLt]=useState(initial?.lead_time_days??0);
  const[memo,setMemo]=useState(initial?.memo||"");
  const[keywords,setKeywords]=useState(()=>{
    const raw=initial?.match_keywords;
    if(Array.isArray(raw))return raw.filter(k=>typeof k==="string"&&k.trim()).map(k=>k.trim());
    return [];
  });
  const[kwInput,setKwInput]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const addKeyword=()=>{
    const raw=kwInput.trim();
    if(!raw)return;
    // 콤마 구분 다중 입력 지원
    const parts=raw.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
    setKeywords(prev=>{
      const set=new Set(prev.map(k=>k.toLowerCase()));
      const merged=[...prev];
      for(const p of parts){if(!set.has(p.toLowerCase())){merged.push(p);set.add(p.toLowerCase())}}
      return merged;
    });
    setKwInput("");
  };
  const removeKeyword=(idx)=>setKeywords(prev=>prev.filter((_,i)=>i!==idx));

  const submit=async()=>{
    if(!code.trim()){setErr("코드를 입력하세요");return}
    if(!name.trim()){setErr("품목명을 입력하세요");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_upsert_item",{
        p_admin_hash:adminHash,
        p_id:isEdit?initial.id:null,
        p_code:code.trim(),
        p_name:name.trim(),
        p_type:type,
        p_unit:unit.trim()||"EA",
        p_spec:spec.trim(),
        p_safety_stock:Number(safety)||0,
        p_lead_time_days:parseInt(lt)||0,
        p_memo:memo.trim(),
        p_match_keywords:type==="material"?keywords:[]
      });
      onSaved();
    }catch(e){
      setErr(errMsg(e,{duplicate_code:"이미 존재하는 코드입니다",unauthorized:"인증 실패"}));
    }
    setLoading(false);
  };

  return <div className="aps-modal-bg" onClick={onCancel}>
    <div className="aps-modal" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"16px"}}>{isEdit?"품목 수정":"품목 추가"}</div>
      <div className="aps-form-grid">
        <div>
          <div className="aps-form-label">코드 *</div>
          <input className="aps-input" value={code} onChange={e=>setCode(e.target.value)} maxLength={30} placeholder="예: P001"/>
        </div>
        <div>
          <div className="aps-form-label">구분 *</div>
          <select className="aps-select" style={{width:"100%"}} value={type} onChange={e=>setType(e.target.value)}>
            <option value="product">제품</option>
            <option value="semi">반제품</option>
            <option value="material">원자재</option>
          </select>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">품목명 *</div>
          <input className="aps-input" value={name} onChange={e=>setName(e.target.value)} maxLength={80}/>
        </div>
        <div>
          <div className="aps-form-label">단위</div>
          <input className="aps-input" value={unit} onChange={e=>setUnit(e.target.value)} maxLength={10} placeholder="EA, KG, M..."/>
        </div>
        <div>
          <div className="aps-form-label">안전재고</div>
          <input className="aps-input" type="number" value={safety} onChange={e=>setSafety(e.target.value)} step="0.001" min="0"/>
        </div>
        <div>
          <div className="aps-form-label">리드타임(일)</div>
          <input className="aps-input" type="number" value={lt} onChange={e=>setLt(e.target.value)} step="1" min="0"/>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">규격/사양</div>
          <input className="aps-input" value={spec} onChange={e=>setSpec(e.target.value)} maxLength={200}/>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">메모</div>
          <textarea className="aps-input" value={memo} onChange={e=>setMemo(e.target.value)} maxLength={500} rows={2} style={{resize:"vertical"}}/>
        </div>
        {type==="material"&&<div style={{gridColumn:"1 / -1",padding:"12px",background:"rgba(6,182,212,0.06)",border:"1px solid rgba(6,182,212,0.25)",borderRadius:"8px"}}>
          <div className="aps-form-label" style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"6px"}}>
            <span>🔗 재고시트 매칭 키워드</span>
            <span style={{fontSize:11,fontWeight:400,color:"var(--muted)"}}>(원자재 전용)</span>
          </div>
          <div style={{fontSize:12,color:"var(--muted)",lineHeight:1.55,marginBottom:"8px"}}>
            재고시트 원육 이름에 아래 키워드가 <b>포함</b>되면 이 원자재의 재고로 자동 합산됩니다.<br/>
            공백 구분은 <b>AND</b> — 예: <code style={{background:"rgba(148,163,184,0.15)",padding:"1px 4px",borderRadius:3}}>삼겹양지 SWIFT</code> 는 이름에 "삼겹양지" <b>와</b> "SWIFT" 둘 다 포함되어야 매칭. 대소문자 무관.
          </div>
          <div style={{display:"flex",gap:"6px",marginBottom:"8px"}}>
            <input className="aps-input" style={{flex:1}} value={kwInput}
              onChange={e=>setKwInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"||e.key===","){e.preventDefault();addKeyword()}}}
              placeholder="예: 삼겹양지 SWIFT (엔터 또는 , 로 추가)"
              maxLength={100}/>
            <button className="aps-btn aps-btn-secondary" type="button" onClick={addKeyword} disabled={!kwInput.trim()}>+ 추가</button>
          </div>
          {keywords.length>0?<div style={{display:"flex",flexWrap:"wrap",gap:"6px"}}>
            {keywords.map((kw,i)=><span key={i} style={{display:"inline-flex",alignItems:"center",gap:"6px",padding:"4px 8px 4px 10px",background:"rgba(6,182,212,0.18)",color:"#06b6d4",borderRadius:"14px",fontSize:12,fontWeight:600}}>
              {kw}
              <button type="button" onClick={()=>removeKeyword(i)} style={{background:"none",border:"none",color:"#06b6d4",cursor:"pointer",fontSize:14,lineHeight:1,padding:0,opacity:0.7}} title="삭제">×</button>
            </span>)}
          </div>:<div style={{fontSize:12,color:"var(--muted)",fontStyle:"italic"}}>키워드가 없으면 재고시트 매칭이 되지 않습니다.</div>}
        </div>}
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"저장 중...":(isEdit?"수정":"추가")}</button>
      </div>
    </div>
  </div>;
}

function BomEditor({adminHash,parent,allItems,onClose}){
  const[rows,setRows]=useState([]);
  const[loading,setLoading]=useState(true);
  const[childId,setChildId]=useState("");
  const[qty,setQty]=useState("");
  const[loss,setLoss]=useState("0");
  const[err,setErr]=useState("");
  const[adding,setAdding]=useState(false);

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const data=await rpc("aps_list_bom",{p_admin_hash:adminHash,p_parent_id:parent.id});
      setRows(data||[]);
    }catch(e){console.error(e)}
    setLoading(false);
  },[adminHash,parent.id]);

  useEffect(()=>{load()},[load]);

  const candidates=useMemo(()=>allItems.filter(i=>i.id!==parent.id&&!rows.find(r=>r.child_id===i.id)),[allItems,parent.id,rows]);

  const add=async()=>{
    if(!childId){setErr("자재를 선택하세요");return}
    const q=Number(qty);
    if(!q||q<=0){setErr("소요량은 0보다 커야 합니다");return}
    setAdding(true);setErr("");
    try{
      await rpc("aps_upsert_bom",{
        p_admin_hash:adminHash,p_id:null,
        p_parent_id:parent.id,p_child_id:Number(childId),
        p_qty:q,p_loss_rate:Number(loss)||0
      });
      setChildId("");setQty("");setLoss("0");
      load();
    }catch(e){
      setErr(errMsg(e,{duplicate_child:"이미 등록된 자재입니다",self_reference:"자기 자신은 등록할 수 없습니다",unauthorized:"인증 실패"}));
    }
    setAdding(false);
  };

  const updateRow=async(r,field,v)=>{
    try{
      await rpc("aps_upsert_bom",{
        p_admin_hash:adminHash,p_id:r.id,
        p_parent_id:parent.id,p_child_id:r.child_id,
        p_qty:field==="qty"?Number(v)||0:Number(r.qty),
        p_loss_rate:field==="loss_rate"?Number(v)||0:Number(r.loss_rate)
      });
      load();
    }catch(e){alert("수정 실패: "+e.message)}
  };

  const del=async(id)=>{
    if(!confirm("이 자재를 BOM에서 제거하시겠습니까?"))return;
    try{
      await rpc("aps_delete_bom",{p_admin_hash:adminHash,p_id:id});
      load();
    }catch(e){alert("삭제 실패: "+e.message)}
  };

  return <div className="aps-modal-bg" onClick={onClose}>
    <div className="aps-modal aps-modal-lg" onClick={e=>e.stopPropagation()}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"4px"}}>
        <div style={{fontWeight:700,fontSize:"16px"}}>📋 BOM 편집</div>
        <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={onClose}>닫기</button>
      </div>
      <div style={{fontSize:"13px",color:"var(--muted)",marginBottom:"14px"}}>
        <strong style={{color:"var(--text)"}}>{parent.name}</strong> ({parent.code}, {TYPE_LABEL[parent.type]}) 자재명세서
      </div>

      <div style={{background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8,padding:"12px",marginBottom:"14px"}}>
        <div style={{fontSize:"13px",fontWeight:600,marginBottom:"8px"}}>자재 추가</div>
        <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}}>
          <select className="aps-select" value={childId} onChange={e=>setChildId(e.target.value)} style={{flex:"2 1 180px",minWidth:140}}>
            <option value="">- 자재 선택 -</option>
            {candidates.map(i=><option key={i.id} value={i.id}>[{TYPE_LABEL[i.type]}] {i.code} - {i.name}</option>)}
          </select>
          <input className="aps-input" type="number" step="0.001" min="0" placeholder="소요량" value={qty} onChange={e=>setQty(e.target.value)} style={{flex:"1 1 90px",minWidth:80}}/>
          <input className="aps-input" type="number" step="0.1" min="0" max="99" placeholder="로스율%" value={loss} onChange={e=>setLoss(e.target.value)} style={{flex:"1 1 80px",minWidth:80}}/>
          <button className="aps-btn aps-btn-primary aps-btn-sm" onClick={add} disabled={adding}>{adding?"...":"추가"}</button>
        </div>
        {err&&<div className="aps-err">{err}</div>}
      </div>

      {loading?<Loader/>:rows.length===0?
        <Empty emoji="📦" text="등록된 자재가 없습니다"/>:
        <div style={{overflow:"auto"}}><table className="aps-table">
          <thead><tr>
            <th>자재</th>
            <th className="center" style={{width:80}}>구분</th>
            <th className="right" style={{width:110}}>소요량</th>
            <th className="right" style={{width:90}}>로스율%</th>
            <th className="center" style={{width:60}}>삭제</th>
          </tr></thead>
          <tbody>
            {rows.map(r=><tr key={r.id}>
              <td>
                <div style={{fontWeight:600}}>{r.child_name}</div>
                <div style={{fontSize:"11px",color:"var(--muted)"}}>{r.child_code}</div>
              </td>
              <td className="center"><Pill map={TYPE_PILL} k={r.child_type} label={TYPE_LABEL[r.child_type]}/></td>
              <td className="right">
                <input className="aps-input" type="number" step="0.001" min="0.001" defaultValue={r.qty} onBlur={e=>{const v=Number(e.target.value);if(v&&v!==Number(r.qty))updateRow(r,"qty",v)}} style={{textAlign:"right",padding:"5px 8px"}}/>
                <span style={{fontSize:"11px",color:"var(--muted)",marginLeft:4}}>{r.child_unit}</span>
              </td>
              <td className="right">
                <input className="aps-input" type="number" step="0.1" min="0" max="99" defaultValue={r.loss_rate} onBlur={e=>{const v=Number(e.target.value);if(v!==Number(r.loss_rate))updateRow(r,"loss_rate",v)}} style={{textAlign:"right",padding:"5px 8px"}}/>
              </td>
              <td className="center"><button className="aps-btn aps-btn-danger aps-btn-sm" onClick={()=>del(r.id)}>삭제</button></td>
            </tr>)}
          </tbody>
        </table></div>
      }
      <div style={{fontSize:"11px",color:"var(--dimmer)",marginTop:"10px"}}>※ 소요량/로스율은 칸 밖을 클릭하면 자동 저장됩니다</div>
    </div>
  </div>;
}

function ItemsTab({adminHash}){
  const[items,setItems]=useState([]);

  const[filter,setFilter]=useState("all");
  const[query,setQuery]=useState("");
  const[editing,setEditing]=useState(null);
  const[showForm,setShowForm]=useState(false);
  const[bomTarget,setBomTarget]=useState(null);

  const load=useCallback(async()=>{
    try{
      const data=await rpc("aps_list_items",{p_admin_hash:adminHash});
      setItems(data||[]);
    }catch(e){console.error(e)}
    setLoading(false);
  },[adminHash]);
  useEffect(()=>{load()},[load]);

  const filtered=useMemo(()=>{
    let arr=items;
    if(filter!=="all")arr=arr.filter(i=>i.type===filter);
    const q=query.trim().toLowerCase();
    if(q)arr=arr.filter(i=>i.code.toLowerCase().includes(q)||i.name.toLowerCase().includes(q));
    return arr;
  },[items,filter,query]);

  const del=async(it)=>{
    if(!confirm(`품목 "${it.name}" 을(를) 삭제하시겠습니까?`))return;
    try{
      await rpc("aps_delete_item",{p_admin_hash:adminHash,p_id:it.id});
      load();
    }catch(e){
      const m=errMsg(e,{has_txns:"입출고 이력이 있어 삭제할 수 없습니다",has_plans:"생산계획에 사용 중이라 삭제할 수 없습니다",used_in_bom:"다른 품목의 BOM에 사용 중입니다",unauthorized:"인증 실패"});

  const counts=useMemo(()=>({

        <button className={filter==="product"?"on":""} onClick={()=>setFilter("product")}>제품 {counts.product}</button>
        <button className={filter==="semi"?"on":""} onClick={()=>setFilter("semi")}>반제품 {counts.semi}</button>
        <button className={filter==="material"?"on":""} onClick={()=>setFilter("material")}>원자재 {counts.material}</button>
      </div>
      <input className="aps-input" placeholder="코드/품목명 검색" value={query} onChange={e=>setQuery(e.target.value)} style={{flex:"1 1 180px",maxWidth:240}}/>
      <button className="aps-btn aps-btn-primary" onClick={()=>{setEditing(null);setShowForm(true)}}>+ 품목 추가</button>
    </div>

    {loading?<Loader/>:filtered.length===0?
      <Empty emoji="📦" text={items.length===0?"등록된 품목이 없습니다. 우측 상단에서 추가하세요.":"검색 결과가 없습니다"}/>:
      <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8}}>
        <table className="aps-table">
          <thead><tr>
            <th style={{width:100}}>코드</th>
            <th>품목명</th>
            <th className="center" style={{width:70}}>구분</th>
            <th className="center hide-mobile" style={{width:60}}>단위</th>
            <th className="right hide-mobile" style={{width:90}}>안전재고</th>
            <th className="right hide-mobile" style={{width:70}}>리드(일)</th>
            <th className="center" style={{width:170}}>작업</th>
          </tr></thead>
          <tbody>
            {filtered.map(i=><tr key={i.id}>
              <td style={{fontFamily:"monospace",color:"var(--text-sub)"}}>{i.code}</td>
              <td>
                <div style={{fontWeight:600}}>{i.name}</div>
                {i.spec&&<div style={{fontSize:"11px",color:"var(--muted)"}}>{i.spec}</div>}
              </td>
              <td className="center"><Pill map={TYPE_PILL} k={i.type} label={TYPE_LABEL[i.type]}/></td>
              <td className="center hide-mobile">{i.unit}</td>
              <td className="right hide-mobile">{fmtNum(i.safety_stock)}</td>
              <td className="right hide-mobile">{i.lead_time_days}</td>
              <td className="center">
                <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                  {(i.type==="product"||i.type==="semi")&&
                    <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>setBomTarget(i)}>BOM</button>}
                  <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>{setEditing(i);setShowForm(true)}}>수정</button>
                  <button className="aps-btn aps-btn-danger aps-btn-sm" onClick={()=>del(i)}>삭제</button>
                </div>
              </td>
            </tr>)}
          </tbody>
        </table>
      </div>
    }

    {showForm&&<ItemForm adminHash={adminHash} initial={editing} onCancel={()=>setShowForm(false)} onSaved={()=>{setShowForm(false);load()}}/>}
    {bomTarget&&<BomEditor adminHash={adminHash} parent={bomTarget} allItems={items} onClose={()=>{setBomTarget(null);load()}}/>}
  </div>;
}

function LineForm({adminHash,initial,onSaved,onCancel}){
  const isEdit=!!initial;
  const[code,setCode]=useState(initial?.code||"");
  const[name,setName]=useState(initial?.name||"");
  const[memo,setMemo]=useState(initial?.memo||"");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!code.trim()){setErr("라인 코드를 입력하세요");return}
    if(!name.trim()){setErr("라인 이름을 입력하세요");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_upsert_line",{
        p_admin_hash:adminHash,
        p_id:isEdit?initial.id:null,
        p_code:code.trim(),
        p_name:name.trim(),
        p_memo:memo.trim()
      });
      onSaved();
    }catch(e){
      setErr(errMsg(e,{duplicate_code:"이미 존재하는 라인 코드입니다",unauthorized:"인증 실패"}));
    }
    setLoading(false);
  };

  return <div className="aps-modal-bg" onClick={onCancel}>
    <div className="aps-modal" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"14px"}}>{isEdit?"🏭 라인 수정":"🏭 라인 추가"}</div>
      <div className="aps-form-grid">
        <div>
          <div className="aps-form-label">코드 *</div>
          <input className="aps-input" value={code} onChange={e=>setCode(e.target.value)} maxLength={20} placeholder="예: L1, A-1"/>
        </div>
        <div>
          <div className="aps-form-label">라인 이름 *</div>
          <input className="aps-input" value={name} onChange={e=>setName(e.target.value)} maxLength={50} placeholder="예: 1호기, 조립 라인 A"/>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">메모</div>
          <textarea className="aps-input" value={memo} onChange={e=>setMemo(e.target.value)} maxLength={300} rows={2} style={{resize:"vertical"}}/>
        </div>
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"저장 중...":(isEdit?"수정":"추가")}</button>
      </div>
    </div>
  </div>;
}

// 설정 모달 (근무시간)
// ═══════════════════════════════════════════
function SettingsModal({adminHash,settings,onSaved,onCancel}){
  const[startH,setStartH]=useState(settings.work_start_hour||"8");
  const[endH,setEndH]=useState(settings.work_end_hour||"17");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    const s=parseInt(startH),e=parseInt(endH);
    if(isNaN(s)||s<0||s>23){setErr("시작 시각은 0~23 사이여야 합니다");return}
    if(isNaN(e)||e<1||e>24){setErr("종료 시각은 1~24 사이여야 합니다");return}
    if(e<=s){setErr("종료 시각은 시작 시각보다 커야 합니다");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_set_setting",{p_admin_hash:adminHash,p_key:"work_start_hour",p_value:String(s)});
      await rpc("aps_set_setting",{p_admin_hash:adminHash,p_key:"work_end_hour",p_value:String(e)});
      onSaved({work_start_hour:String(s),work_end_hour:String(e)});
    }catch(ex){
      setErr("저장 실패: "+ex.message);
    }
    setLoading(false);
  };

  return <div className="aps-modal-bg" onClick={onCancel}>
    <div className="aps-modal" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"14px"}}>⚙️ 근무시간 설정</div>
      <div style={{fontSize:12,color:"var(--muted)",marginBottom:14}}>간트차트 시간축 범위 (KST 24시간 기준). 24시간 운영이면 0–24로 설정.</div>
      <div className="aps-form-grid">
        <div>
          <div className="aps-form-label">시작 시각 (시)</div>
          <input className="aps-input" type="number" min="0" max="23" step="1" value={startH} onChange={e=>setStartH(e.target.value)}/>
        </div>
        <div>
          <div className="aps-form-label">종료 시각 (시)</div>
          <input className="aps-input" type="number" min="1" max="24" step="1" value={endH} onChange={e=>setEndH(e.target.value)}/>
        </div>
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"저장 중...":"저장"}</button>
      </div>
    </div>
  </div>;
}

function StockForm({adminHash,items,onSaved,onCancel,initialItem}){
  const[itemId,setItemId]=useState(initialItem?.item_id||initialItem?.id||"");
  const[type,setType]=useState("in");
  const[qty,setQty]=useState("");
  const[memo,setMemo]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!itemId){setErr("품목을 선택하세요");return}
    const q=Number(qty);
    if(!q){setErr("수량을 입력하세요");return}
    if(type!=="adjust"&&q<=0){setErr("입고/출고 수량은 0보다 커야 합니다");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_record_stock",{
        p_admin_hash:adminHash,
        p_item_id:Number(itemId),
        p_txn_type:type,
        p_qty:q,
        p_related_plan_id:null,
        p_memo:memo.trim()
      });
      onSaved();
    }catch(e){
      setErr(errMsg(e,{invalid_qty:"수량이 올바르지 않습니다",unauthorized:"인증 실패"}));
    }
    setLoading(false);
  };

  return <div className="aps-modal-bg" onClick={onCancel}>
    <div className="aps-modal" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"14px"}}>📦 입출고 기록</div>
      <div className="aps-form-grid">
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">품목 *</div>
          <select className="aps-select" style={{width:"100%"}} value={itemId} onChange={e=>setItemId(e.target.value)}>
            <option value="">- 품목 선택 -</option>
            {items.map(i=><option key={i.id} value={i.id}>[{TYPE_LABEL[i.type]}] {i.code} - {i.name}</option>)}
          </select>
        </div>
        <div>
          <div className="aps-form-label">유형 *</div>
          <select className="aps-select" style={{width:"100%"}} value={type} onChange={e=>setType(e.target.value)}>
            <option value="in">입고 (+)</option>
            <option value="out">출고 (-)</option>
            <option value="adjust">조정 (±)</option>
          </select>
        </div>
        <div>
          <div className="aps-form-label">수량 * {type==="adjust"&&<span style={{color:"#f59e0b"}}>(부호 포함)</span>}</div>
          <input className="aps-input" type="number" step="0.001" value={qty} onChange={e=>setQty(e.target.value)} placeholder={type==="adjust"?"+10 또는 -5":"양수"}/>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">메모</div>
          <input className="aps-input" value={memo} onChange={e=>setMemo(e.target.value)} maxLength={200} placeholder="입고처/출고처/사유 등"/>
        </div>
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"기록 중...":"기록"}</button>
      </div>
    </div>
  </div>;
}

function InventoryTab({adminHash}){
  const[inv,setInv]=useState([]);
  const[items,setItems]=useState([]);
  const[txns,setTxns]=useState([]);
  const[loading,setLoading]=useState(true);
  const[filter,setFilter]=useState("all"); // all/out/low/ok
  const[query,setQuery]=useState("");
  const[showForm,setShowForm]=useState(false);
  const[sheetInv,setSheetInv]=useState(()=>loadStoredInventory()); // 재고시트(localStorage)

  const load=useCallback(async()=>{
    try{
      const[invD,itD,txnD]=await Promise.all([
        rpc("aps_list_inventory",{p_admin_hash:adminHash}),
        rpc("aps_list_items",{p_admin_hash:adminHash}),
        rpc("aps_list_stock_txns",{p_admin_hash:adminHash,p_item_id:null,p_limit:50})
      ]);
      setInv(invD||[]);setItems(itD||[]);setTxns(txnD||[]);
    }catch(e){console.error(e)}
    setLoading(false);
  },[adminHash]);
  useEffect(()=>{load()},[load]);

  // 재고시트 원격 fetch (다른 기기 업로드 동기화) + localStorage 변경 구독
  useEffect(()=>{
    if(!adminHash)return;
    let cancelled=false;
    (async()=>{
      const remote=await loadRemoteInventory(adminHash);
      if(cancelled)return;
      const local=loadStoredInventory();
      const action=!remote?"no-remote":_invRemoteIsNewer(local,remote)?"apply-remote":"keep-local";
      console.info("[aps-inv-sync] InventoryTab mount:",{localSaved:local?.savedAt||"",remoteSaved:remote?.savedAt||"",action});
      if(!remote)return;
      if(_invRemoteIsNewer(local,remote)){
        applyRemoteInventoryToLocal(remote);
        setSheetInv(loadStoredInventory());
      }
    })();
    return()=>{cancelled=true};
  },[adminHash]);
  useEffect(()=>{
    const reload=()=>setSheetInv(loadStoredInventory());
    const onStorage=(e)=>{if(!e.key||e.key===INVENTORY_DATA_KEY)reload()};
    window.addEventListener("storage",onStorage);
    window.addEventListener("aps-inv-data-change",reload);
    return()=>{
      window.removeEventListener("storage",onStorage);
      window.removeEventListener("aps-inv-data-change",reload);
    };
  },[]);

  // 재고시트 코드 → box 매핑
  const sheetMap=useMemo(()=>{
    const m={};
    (sheetInv?.products||[]).forEach(p=>{if(p.code)m[p.code]=p});
    (sheetInv?.raws||[]).forEach(p=>{if(p.code)m[p.code]=p});
    return m;
  },[sheetInv]);

  // inv를 재고시트 박스 수로 덮어쓰기 (매칭되는 코드만) + stock_status 재계산
  const linked=useMemo(()=>{
    return inv.map(i=>{
      const sp=sheetMap[i.code];
      if(!sp)return {...i, _source:"txn"};
      const sheetStock=Number(sp.box||0);
      const safety=Number(i.safety_stock||0);
      let status="ok";
      if(sheetStock<=0)status="out";
      else if(safety>0 && sheetStock<safety)status="low";
      const diff=sheetStock-safety;
      return {...i,
        current_stock:sheetStock,
        stock_diff:diff,
        stock_status:status,
        _source:"sheet"
      };
    });
  },[inv,sheetMap]);

  const filtered=useMemo(()=>{
    let arr=linked;
    if(filter!=="all")arr=arr.filter(i=>i.stock_status===filter);
    const q=query.trim().toLowerCase();
    if(q)arr=arr.filter(i=>i.code.toLowerCase().includes(q)||i.name.toLowerCase().includes(q));
    return arr;
  },[linked,filter,query]);

  const counts=useMemo(()=>({
    all:linked.length,
    out:linked.filter(i=>i.stock_status==="out").length,
    low:linked.filter(i=>i.stock_status==="low").length,
    ok:linked.filter(i=>i.stock_status==="ok").length
  }),[linked]);

  const sheetLinkedCount=useMemo(()=>linked.filter(i=>i._source==="sheet").length,[linked]);

  const delTxn=async(id)=>{
    if(!confirm("이 입출고 기록을 삭제하시겠습니까?\n재고는 자동으로 재계산됩니다."))return;
    try{
      await rpc("aps_delete_stock_txn",{p_admin_hash:adminHash,p_id:id});
      load();
    }catch(e){alert("삭제 실패: "+e.message)}
  };

  return <div>
    <div className="aps-toolbar">
      <div className="aps-filter">
        <button className={filter==="all"?"on":""} onClick={()=>setFilter("all")}>전체 {counts.all}</button>
        <button className={filter==="out"?"on":""} onClick={()=>setFilter("out")}>품절 {counts.out}</button>
        <button className={filter==="low"?"on":""} onClick={()=>setFilter("low")}>부족 {counts.low}</button>
        <button className={filter==="ok"?"on":""} onClick={()=>setFilter("ok")}>정상 {counts.ok}</button>
      </div>
      <input className="aps-input" placeholder="코드/품목명 검색" value={query} onChange={e=>setQuery(e.target.value)} style={{flex:"1 1 180px",maxWidth:240}}/>
      <button className="aps-btn aps-btn-primary" onClick={()=>setShowForm(true)} disabled={items.length===0}>+ 입출고 기록</button>
    </div>

    {sheetLinkedCount>0 && <div style={{padding:"8px 12px",background:"rgba(6,182,212,0.08)",border:"1px solid rgba(6,182,212,0.25)",borderRadius:6,fontSize:12,color:"var(--muted)",marginBottom:10}}>
      📋 재고시트와 <b style={{color:"#06b6d4"}}>{sheetLinkedCount}개</b> 품목 연동 중 — 시트의 박스 수가 우선 표시됩니다. 매칭되지 않는 품목은 입출고 누적값을 사용합니다.
    </div>}

    {loading?<Loader/>:filtered.length===0?
      <Empty emoji="📊" text={inv.length===0?"품목을 먼저 등록하세요":"검색 결과가 없습니다"}/>:
      <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8}}>
        <table className="aps-table">
          <thead><tr>
            <th style={{width:100}}>코드</th>
            <th>품목명</th>
            <th className="center" style={{width:70}}>구분</th>
            <th className="right" style={{width:110}}>현재재고</th>
            <th className="right hide-mobile" style={{width:100}}>안전재고</th>
            <th className="right hide-mobile" style={{width:100}}>차이</th>
            <th className="center" style={{width:70}}>상태</th>
          </tr></thead>
          <tbody>
            {filtered.map(i=><tr key={i.item_id}>
              <td style={{fontFamily:"monospace",color:"var(--text-sub)"}}>{i.code}</td>
              <td style={{fontWeight:600}}>
                {i.name}
                {i._source==="sheet" && <span title="재고시트 연동" style={{marginLeft:6,fontSize:10,color:"#06b6d4",fontWeight:700}}>📋</span>}
              </td>
              <td className="center"><Pill map={TYPE_PILL} k={i.type} label={TYPE_LABEL[i.type]}/></td>
              <td className="right" style={{fontWeight:600,color:i.stock_status==="out"?"#ef4444":i.stock_status==="low"?"#f59e0b":"var(--text)"}}>
                {fmtNum(i.current_stock)} <span style={{fontSize:"11px",color:"var(--muted)",fontWeight:400}}>{i._source==="sheet"?"박스":i.unit}</span>
              </td>
              <td className="right hide-mobile" style={{color:"var(--muted)"}}>{fmtNum(i.safety_stock)}</td>
              <td className="right hide-mobile" style={{color:Number(i.stock_diff)<0?"#ef4444":"var(--muted)"}}>{Number(i.stock_diff)>=0?"+":""}{fmtNum(i.stock_diff)}</td>
              <td className="center"><Pill map={STOCK_PILL} k={i.stock_status}/></td>
            </tr>)}
          </tbody>
        </table>
      </div>
    }

    <div className="aps-section-title">📜 최근 입출고 이력 ({txns.length})</div>
    {txns.length===0?
      <Empty emoji="📜" text="입출고 기록이 없습니다"/>:
      <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8}}>
        <table className="aps-table">
          <thead><tr>
            <th style={{width:120}}>일시</th>
            <th>품목</th>
            <th className="center" style={{width:60}}>유형</th>
            <th className="right" style={{width:100}}>수량</th>
            <th className="hide-mobile">메모</th>
            <th className="center" style={{width:60}}>삭제</th>
          </tr></thead>
          <tbody>
            {txns.map(t=><tr key={t.id}>
              <td style={{fontSize:"11px",color:"var(--muted)"}}>{fmtDateTime(t.created_at)}</td>
              <td>
                <div style={{fontWeight:600}}>{t.item_name}</div>
                <div style={{fontSize:"11px",color:"var(--muted)"}}>{t.item_code}</div>
              </td>
              <td className="center"><Pill map={TXN_PILL} k={t.txn_type} label={TXN_LABEL[t.txn_type]}/></td>
              <td className="right" style={{fontWeight:600,color:Number(t.qty)>0?"#22c55e":Number(t.qty)<0?"#ef4444":"var(--text)"}}>
                {Number(t.qty)>0?"+":""}{fmtNum(t.qty)} <span style={{fontSize:"11px",color:"var(--muted)",fontWeight:400}}>{t.unit}</span>
              </td>
              <td className="hide-mobile" style={{color:"var(--muted)",fontSize:"12px"}}>{t.memo||"-"}</td>
              <td className="center"><button className="aps-btn aps-btn-danger aps-btn-sm" onClick={()=>delTxn(t.id)}>삭제</button></td>
            </tr>)}
          </tbody>
        </table>
      </div>
    }

    {showForm&&<StockForm adminHash={adminHash} items={items} onCancel={()=>setShowForm(false)} onSaved={()=>{setShowForm(false);load()}}/>}
  </div>;
}

// 제품 검색 뷰 — 제품명/코드로 필터해 평균 로스율 집계
// aps_get_product_chain_stats 로 chain-level 데이터 fetch 후
// 클라이언트에서 팩당 kg 파싱(extractPackWeightFromName)을 반영해 실제 완성 kg 계산
// ═══════════════════════════════════════════
function ProductLossSearchView({adminHash}){
  const[chains,setChains]=useState([]);
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState("");
  const[range,setRange]=useState(365);
  const[q,setQ]=useState("");
  const[sortKey,setSortKey]=useState("rate"); // rate | uses | rawkg | recent

  const load=useCallback(async()=>{
    if(!adminHash)return;
    setBusy(true);setErr("");
    try{
      const data=await rpc("aps_get_product_chain_stats",{p_admin_hash:adminHash,p_days_back:range});
      setChains(Array.isArray(data)?data:[]);
    }catch(e){setErr("로딩 실패: "+(e.message||e));setChains([]);}
    finally{setBusy(false);}
  },[adminHash,range]);
  useEffect(()=>{load()},[load]);

  // chain-level → 제품별 집계 (팩당 kg 파싱 반영)
  const grouped=useMemo(()=>{
    const map=new Map(); // product_code → {code, name, unit, origin, chains:[], totalRawKg, totalOutputKg, dates:Set}
    for(const c of chains){
      const code=c.product_code||"";
      if(!code)continue;
      const packKg=extractPackWeightFromName(c.product_name);
      const excelProdKg=Number(c.product_kg)||0;
      const actualOutputKg=packKg!=null?excelProdKg*packKg:excelProdKg;
      const rawKg=Number(c.chain_raw_kg)||0;
      let g=map.get(code);
      if(!g){
        g={
          code, name:c.product_name||"", unit:c.product_unit||"Kg", origin:c.product_origin||"",
          totalRawKg:0, totalOutputKg:0, totalRawAmount:0, totalProductAmount:0,
          totalBoxes:0, uses:0, dates:new Set(), lastDate:c.date,
          hasPackSpec:packKg!=null,
        };
        map.set(code,g);
      }
      // 대표 이름/원산지는 가장 최근 데이터로 유지 (chain은 date desc로 옴)
      if(!g.name && c.product_name) g.name=c.product_name;
      g.totalRawKg += rawKg;
      g.totalOutputKg += actualOutputKg;
      g.totalRawAmount += Number(c.chain_raw_amount)||0;
      g.totalProductAmount += Number(c.product_amount)||0;
      g.totalBoxes += Number(c.product_boxes)||0;
      g.uses += 1;
      g.dates.add(c.date);
      if(c.date > g.lastDate) g.lastDate=c.date;
      if(packKg!=null) g.hasPackSpec=true;
    }
    const list=[];
    for(const g of map.values()){
      const lossKg=g.totalRawKg-g.totalOutputKg;
      const lossRate=g.totalRawKg>0 ? Math.round(lossKg/g.totalRawKg*100*100)/100 : 0;
      list.push({
        ...g,
        useDays:g.dates.size,
        lossKg:Math.round(lossKg*100)/100,
        lossRate,
      });
    }
    return list;
  },[chains]);

  const filtered=useMemo(()=>{
    const query=q.trim().toLowerCase();
    let list=grouped;
    if(query){
      list=grouped.filter(g=>
        (g.name||"").toLowerCase().includes(query) ||
        (g.code||"").toLowerCase().includes(query)
      );
    }
    // 정렬
    const sorted=[...list];
    if(sortKey==="rate") sorted.sort((a,b)=>b.lossRate-a.lossRate);
    else if(sortKey==="uses") sorted.sort((a,b)=>b.uses-a.uses);
    else if(sortKey==="rawkg") sorted.sort((a,b)=>b.totalRawKg-a.totalRawKg);
    else if(sortKey==="recent") sorted.sort((a,b)=>(b.lastDate||"").localeCompare(a.lastDate||""));
    return sorted;
  },[grouped,q,sortKey]);

  const overall=useMemo(()=>{
    const totalRaw=filtered.reduce((s,g)=>s+g.totalRawKg,0);
    const totalOut=filtered.reduce((s,g)=>s+g.totalOutputKg,0);
    const lossKg=totalRaw-totalOut;
    const rate=totalRaw>0 ? Math.round(lossKg/totalRaw*100*100)/100 : 0;
    return {totalRaw,totalOut,lossKg:Math.max(lossKg,0),rate,products:filtered.length};
  },[filtered]);

  return <div>
    <div className="aps-toolbar" style={{gap:8,flexWrap:"wrap"}}>
      <input className="aps-input" placeholder="🔍 제품명·코드 검색 (예: 돌돌우삼겹, 500g*8)"
        value={q} onChange={e=>setQ(e.target.value)}
        style={{minWidth:260,flex:1,maxWidth:420}}/>
      <select className="aps-input aps-input-sm" value={range} onChange={e=>setRange(Number(e.target.value))}>
        <option value={30}>최근 30일</option>
        <option value={90}>최근 90일</option>
        <option value={180}>최근 180일</option>
        <option value={365}>최근 365일</option>
      </select>
      <select className="aps-input aps-input-sm" value={sortKey} onChange={e=>setSortKey(e.target.value)}>
        <option value="rate">평균 로스율 ↓</option>
        <option value="uses">사용 횟수 ↓</option>
        <option value="rawkg">총 원육 kg ↓</option>
        <option value="recent">최근 사용일 ↓</option>
      </select>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={load} disabled={busy}>새로고침</button>
    </div>

    {err&&<div style={{padding:"10px 14px",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:6,color:"#ef4444",fontSize:13,marginBottom:10}}>{err}</div>}

    {/* 요약 카드 */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:14}}>
      <div style={{padding:12,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>{q?"검색 결과":"전체 제품"}</div>
        <div style={{fontSize:20,fontWeight:800,marginTop:4}}>{overall.products}개</div>
      </div>
      <div style={{padding:12,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>총 원육 투입</div>
        <div style={{fontSize:20,fontWeight:800,marginTop:4}}>{fmtLossKg(overall.totalRaw)}<span style={{fontSize:12,marginLeft:3}}>kg</span></div>
      </div>
      <div style={{padding:12,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>총 실제 완성</div>
        <div style={{fontSize:20,fontWeight:800,marginTop:4}}>{fmtLossKg(overall.totalOut)}<span style={{fontSize:12,marginLeft:3}}>kg</span></div>
      </div>
      <div style={{padding:12,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>평균 로스율</div>
        <div style={{fontSize:22,fontWeight:800,marginTop:4,color:lossRateColor(overall.rate)}}>{fmtLossPct(overall.rate)}</div>
      </div>
    </div>

    {busy?<Loader/>:
      filtered.length===0?<Empty emoji="🔍" text={q?`"${q}" 검색 결과 없음`:"저장된 생산일보 없음"}/>:
      <div style={{border:"1px solid var(--card-bd)",borderRadius:8,overflow:"auto",background:"var(--card-bg)"}}>
        <table className="aps-table" style={{fontSize:13,minWidth:820}}>
          <thead><tr>
            <th style={{width:38}}>#</th>
            <th>제품명</th>
            <th className="right" style={{width:70}}>사용 횟수</th>
            <th className="right hide-mobile" style={{width:70}}>사용 일수</th>
            <th className="right" style={{width:110}}>총 원육 kg</th>
            <th className="right" style={{width:110}}>실제 완성 kg</th>
            <th className="right" style={{width:105}}>총 로스 kg</th>
            <th className="right" style={{width:95}}>평균 로스율</th>
            <th className="right hide-mobile" style={{width:100}}>최근 사용일</th>
          </tr></thead>
          <tbody>
            {filtered.map((g,i)=>{
              return <tr key={g.code}>
                <td style={{color:"var(--muted)",fontSize:11}}>{i+1}</td>
                <td>
                  <div style={{fontWeight:600}}>{g.name||"(제품명 없음)"}</div>
                  <div style={{fontSize:10,color:"var(--muted)",fontFamily:"monospace",marginTop:2}}>
                    {g.code}{g.origin?` · ${g.origin}`:""}{g.hasPackSpec?" · 팩 스펙":""}
                  </div>
                </td>
                <td className="right" style={{fontWeight:700}}>{g.uses}</td>
                <td className="right hide-mobile" style={{color:"var(--muted)"}}>{g.useDays}</td>
                <td className="right">{fmtLossKg(g.totalRawKg)}</td>
                <td className="right">{fmtLossKg(g.totalOutputKg)}</td>
                <td className="right" style={{fontWeight:600,color:g.lossKg>0.01?lossRateColor(g.lossRate):"var(--muted)"}}>
                  {g.lossKg>0.01?fmtLossKg(g.lossKg):"0"}
                </td>
                <td className="right" style={{fontWeight:800,color:lossRateColor(g.lossRate),fontSize:14}}>
                  {fmtLossPct(g.lossRate)}
                </td>
                <td className="right hide-mobile" style={{color:"var(--muted)",fontSize:11}}>{g.lastDate||"-"}</td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    }

    <div style={{fontSize:11,color:"var(--muted)",marginTop:12,padding:"8px 12px",background:"rgba(59,130,246,0.05)",borderLeft:"3px solid #3b82f6",borderRadius:4}}>
      💡 <b>평균 로스율</b> = (Σ 원육 kg − Σ 실제 완성 kg) / Σ 원육 kg × 100. 제품명에 <code>500g*8</code>/<code>1kg*6</code> 등 스펙이 있으면 팩당 kg를 곱해 실제 완성 kg 계산. 스펙 없는 제품은 excel 원본 kg 그대로 사용. 이 제품이 여러 chain에 등장하면 모두 합산됩니다.
    </div>
  </div>;
}

function ProductionLossTab({adminHash}){
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState("");
  const[ok,setOk]=useState("");
  const[meta,setMeta]=useState(null);
  const[dates,setDates]=useState([]);
  const[selectedDate,setSelectedDate]=useState(null);
  const[sheetRows,setSheetRows]=useState([]);
  const[loadingDay,setLoadingDay]=useState(false);
  const[viewMode,setViewMode]=useState(()=>{
    const v=localStorage.getItem("aps-loss-view-mode");
    return v==="product"||v==="daily"?v:"daily";
  });
  useEffect(()=>{localStorage.setItem("aps-loss-view-mode",viewMode)},[viewMode]);

  const loadMeta=useCallback(async()=>{
    if(!adminHash)return;
    try{
      const[m,d]=await Promise.all([
        rpc("aps_get_production_meta",{p_admin_hash:adminHash}),
        rpc("aps_get_production_dates",{p_admin_hash:adminHash}),
      ]);
      setMeta(m||null);
      const arr=Array.isArray(d)?d:[];
      setDates(arr);
      if(!selectedDate && arr.length>0)setSelectedDate(arr[0].date);
    }catch(e){setErr("로딩 실패: "+(e.message||e))}
  },[adminHash,selectedDate]);
  useEffect(()=>{loadMeta()},[adminHash]);

  const loadDate=useCallback(async(date)=>{
    if(!date||!adminHash)return;
    setLoadingDay(true);setErr("");
    try{
      const data=await rpc("aps_get_production_by_date",{p_admin_hash:adminHash,p_date:date});
      setSheetRows(Array.isArray(data)?data:[]);
    }catch(e){setErr("일자 데이터 로딩 실패: "+(e.message||e))}
    finally{setLoadingDay(false)}
  },[adminHash]);
  useEffect(()=>{loadDate(selectedDate)},[selectedDate,adminHash]);

  async function handleFile(e){
    const f=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!f)return;
    setErr("");setOk("");setBusy(true);
    try{
      if(typeof XLSX==="undefined")throw new Error("XLSX 라이브러리 로드 실패 — 새로고침 후 재시도");
      const buf=await f.arrayBuffer();
      const sheets=parseProductionWorkbook(buf);
      if(sheets.length===0)throw new Error("유효한 생산일보 시트가 없습니다 (시트명 YYYYMMDD 또는 R2 날짜 확인)");
      const allRows=sheets.flatMap(s=>s.rows);
      const BATCH=500;
      for(let i=0;i<allRows.length;i+=BATCH){
        const chunk=allRows.slice(i,i+BATCH);
        await rpc("aps_upsert_production_batch",{p_admin_hash:adminHash,p_rows:chunk});
      }
      const firstDate=sheets[0].date, lastDate=sheets[sheets.length-1].date;
      setOk(`✓ ${sheets.length}개 시트 · ${allRows.length}행 업로드 (${firstDate} ~ ${lastDate})`);
      await loadMeta();
      setSelectedDate(sheets[0].date);
    }catch(ex){setErr("업로드 실패: "+(ex.message||ex))}
    finally{setBusy(false)}
  }

  async function handleCleanup(){
    if(!confirm("365일 초과 생산일보 데이터를 삭제합니다. 계속하시겠어요?"))return;
    setBusy(true);setErr("");setOk("");
    try{
      const res=await rpc("aps_cleanup_production",{p_admin_hash:adminHash,p_days:365});
      setOk(`✓ ${res?.deleted||0}건 정리`);
      await loadMeta();
    }catch(e){setErr("정리 실패: "+(e.message||e))}
    finally{setBusy(false)}
  }
  async function handleClearAll(){
    if(!confirm("⚠ 모든 생산일보 데이터를 삭제합니다. 정말로 초기화할까요?"))return;
    if(!confirm("⚠⚠ 되돌릴 수 없습니다. 한 번 더 확인합니다."))return;
    setBusy(true);setErr("");setOk("");
    try{
      const res=await rpc("aps_clear_production",{p_admin_hash:adminHash});
      setOk(`✓ 전체 ${res?.deleted||0}건 삭제`);
      setSheetRows([]);setSelectedDate(null);
      await loadMeta();
    }catch(e){setErr("삭제 실패: "+(e.message||e))}
    finally{setBusy(false)}
  }
  async function handleDeleteDate(date){
    if(!date)return;
    if(!confirm(`${date} 생산일보 데이터를 삭제합니다. 계속하시겠어요?`))return;
    setBusy(true);setErr("");setOk("");
    try{
      const res=await rpc("aps_delete_production_date",{p_admin_hash:adminHash,p_date:date});
      setOk(`✓ ${date} ${res?.deleted||0}건 삭제`);
      if(selectedDate===date){
        setSheetRows([]);
        setSelectedDate(null);
      }
      await loadMeta();
    }catch(e){setErr("삭제 실패: "+(e.message||e))}
    finally{setBusy(false)}
  }

  const loss=useMemo(()=>{
    if(!sheetRows||sheetRows.length===0)return null;
    return computeSheetLoss(sheetRows);
  },[sheetRows]);

  const overallAvgRate=useMemo(()=>{
    if(!dates||dates.length===0)return null;
    const totalRaw=dates.reduce((s,d)=>s+Number(d.total_raw_kg||0),0);
    const totalLoss=dates.reduce((s,d)=>s+Number(d.total_loss_kg||0),0);
    if(totalRaw<=0)return null;
    return Math.round(totalLoss/totalRaw*100*100)/100;
  },[dates]);

  return <div>
    <div className="aps-toolbar">
      <div style={{fontSize:13,color:"var(--muted)"}}>
        {meta ? (meta.total_dates>0 ? `${meta.total_dates}일치 · ${meta.min_date} ~ ${meta.max_date}` : "저장된 생산일보 없음") : "..."}
      </div>
      <div style={{flex:1}}></div>
      <div className="aps-view-toggle" role="tablist" style={{marginRight:6}}>
        <button role="tab" aria-selected={viewMode==="daily"}
          className={"aps-view-toggle-btn"+(viewMode==="daily"?" active":"")}
          onClick={()=>setViewMode("daily")} disabled={busy}>📅 일자별</button>
        <button role="tab" aria-selected={viewMode==="product"}
          className={"aps-view-toggle-btn"+(viewMode==="product"?" active":"")}
          onClick={()=>setViewMode("product")} disabled={busy}>🔍 제품 검색</button>
      </div>
      <label className="aps-btn aps-btn-primary" style={{cursor:busy?"wait":"pointer",opacity:busy?0.6:1}}>
        {busy?"업로드 중...":"📁 생산일보 업로드"}
        <input type="file" accept=".xlsx,.xls" onChange={handleFile} disabled={busy} style={{display:"none"}}/>
      </label>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={loadMeta} disabled={busy}>새로고침</button>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={handleCleanup} disabled={busy} title="365일 초과 자동 정리">🗑 365일</button>
      <button className="aps-btn aps-btn-danger aps-btn-sm" onClick={handleClearAll} disabled={busy}>⚠ 초기화</button>
    </div>

    {err&&<div style={{padding:"10px 14px",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:6,color:"#ef4444",fontSize:13,marginBottom:10}}>{err}</div>}
    {ok&&<div style={{padding:"10px 14px",background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:6,color:"#22c55e",fontSize:13,marginBottom:10}}>{ok}</div>}

    {viewMode==="product" ? <ProductLossSearchView adminHash={adminHash}/> : <>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10,marginBottom:14}}>
      <div style={{padding:14,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>저장된 일자</div>
        <div style={{fontSize:22,fontWeight:800,marginTop:4}}>{meta?.total_dates||0}</div>
      </div>
      <div style={{padding:14,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>총 로우</div>
        <div style={{fontSize:22,fontWeight:800,marginTop:4}}>{fmtLossKg(meta?.total_rows,0)}</div>
      </div>
      <div style={{padding:14,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>보유 기간</div>
        <div style={{fontSize:14,fontWeight:700,marginTop:6}}>
          {meta?.min_date?`${meta.min_date} ~ ${meta.max_date}`:"-"}
        </div>
      </div>
      <div style={{padding:14,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>전체 평균 로스율</div>
        <div style={{fontSize:22,fontWeight:800,marginTop:4,color:lossRateColor(overallAvgRate)}}>
          {overallAvgRate!=null?fmtLossPct(overallAvgRate):"-"}
        </div>
      </div>
    </div>

    <div style={{fontSize:11,color:"var(--muted)",padding:"8px 12px",background:"rgba(59,130,246,0.06)",borderLeft:"3px solid #3b82f6",borderRadius:4,marginBottom:12}}>
      <b>계산 방식:</b> 엑셀 좌측(A-H) = 생산 제품, 우측(I-P) = 투입 원육. 제품명에 <code>500g*8</code>/<code>1kg*6</code> 등 스펙 있으면 <b>excel의 생산량 × 팩당 kg</b> = 실제 완성 kg (예: 288 × 500g = 144kg). 로스 = Σ원육 kg − 실제 완성 kg. 우측 "원본 로스"는 엑셀에 적힌 로스율(참고용).
    </div>

    <div style={{display:"grid",gridTemplateColumns:"260px 1fr",gap:12}} className="aps-loss-grid">
      {/* 좌: 날짜 리스트 */}
      <div style={{border:"1px solid var(--card-bd)",borderRadius:8,background:"var(--card-bg)",maxHeight:"70vh",overflowY:"auto"}}>
        {dates.length===0?
          <div style={{padding:20,textAlign:"center",fontSize:12,color:"var(--muted)"}}>업로드된 데이터 없음</div>
          :
          dates.map(d=>{
            const active=d.date===selectedDate;
            return <div key={d.date} onClick={()=>setSelectedDate(d.date)}
              style={{padding:"10px 12px",borderBottom:"1px solid var(--div2)",cursor:"pointer",background:active?"rgba(6,182,212,0.1)":"transparent",borderLeft:active?"3px solid #06b6d4":"3px solid transparent",position:"relative"}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:6}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13}}>{d.date}</div>
                  <div style={{fontSize:10,color:"var(--muted)",marginTop:2}}>
                    {d.product_rows}건 · 원육 {fmtLossKg(d.total_raw_kg)}kg
                  </div>
                  <div style={{fontSize:12,fontWeight:700,marginTop:3,color:lossRateColor(d.loss_rate)}}>
                    로스 {fmtLossPct(d.loss_rate)}
                  </div>
                </div>
                <button
                  onClick={e=>{e.stopPropagation();handleDeleteDate(d.date)}}
                  disabled={busy}
                  title={`${d.date} 삭제`}
                  style={{background:"transparent",border:"1px solid rgba(239,68,68,0.35)",color:"#ef4444",borderRadius:4,padding:"2px 6px",fontSize:11,cursor:busy?"wait":"pointer",lineHeight:1,flexShrink:0}}>
                  🗑
                </button>
              </div>
            </div>;
          })
        }
      </div>

      {/* 우: 상세 */}
      <div style={{minWidth:0}}>
        {loadingDay?<Loader/>:
          !selectedDate?<Empty emoji="📅" text="좌측에서 날짜를 선택하세요"/>:
          !loss||loss.products.length===0?<Empty emoji="📄" text="해당 날짜 데이터 없음"/>:
          <>
            {/* Day summary */}
            <div style={{display:"flex",flexWrap:"wrap",gap:10,marginBottom:12,padding:12,border:"1px solid var(--card-bd)",borderRadius:8,background:"var(--card-bg)"}}>
              <div style={{minWidth:140}}>
                <div style={{fontSize:11,color:"var(--muted)"}}>📅 {selectedDate}</div>
                <div style={{fontSize:16,fontWeight:800,marginTop:2}}>{loss.products.length}개 상품</div>
              </div>
              <div style={{flex:1,display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:10}}>
                <div><div style={{fontSize:10,color:"var(--muted)"}}>원육 총 투입</div><div style={{fontSize:14,fontWeight:700}}>{fmtLossKg(loss.summary.total_input_kg)}kg</div></div>
                <div><div style={{fontSize:10,color:"var(--muted)"}}>상품 총 산출</div><div style={{fontSize:14,fontWeight:700}}>{fmtLossKg(loss.summary.total_output_kg)}kg</div></div>
                <div><div style={{fontSize:10,color:"var(--muted)"}}>총 로스</div><div style={{fontSize:14,fontWeight:700,color:lossRateColor(loss.summary.loss_rate)}}>{fmtLossKg(loss.summary.total_loss_kg)}kg</div></div>
                <div><div style={{fontSize:10,color:"var(--muted)"}}>평균 로스율</div><div style={{fontSize:18,fontWeight:800,color:lossRateColor(loss.summary.loss_rate)}}>{fmtLossPct(loss.summary.loss_rate)}</div></div>
              </div>
            </div>

            <ProductionLossDetail loss={loss} rows={sheetRows} date={selectedDate}/>
          </>
        }
      </div>
    </div>
    </>}
  </div>;
}

// ═══════════════════════════════════════════
// App (탭 네비게이션 + 로그인 게이트)
// ═══════════════════════════════════════════
const VALID_TABS=["items","lines","plans","staff","inventory","stats","sheet","sales","meetings","loss"];
function getTabFromHash(){
  const h=(window.location.hash||"").replace(/^#/,"");
  return VALID_TABS.includes(h)?h:"items";
}

function App(){
  const[theme,setTheme]=useState(getStoredTheme());
  const[adminHash,setAdminHash]=useState(sessionStorage.getItem("sp-admin-hash")||"");
  const[adminInfo,setAdminInfo]=useState(null);
  const[checking,setChecking]=useState(!!sessionStorage.getItem("sp-admin-hash"));
  const[tab,setTab]=useState(getTabFromHash());

  useEffect(()=>{applyTheme(theme)},[theme]);
  const toggleTheme=()=>{const t=theme==="dark"?"light":"dark";setTheme(t);setStoredTheme(t);applyTheme(t)};

  // URL 해시 ↔ tab 동기화
  useEffect(()=>{
    const newHash="#"+tab;
    if(window.location.hash!==newHash)history.replaceState(null,"",newHash);
  },[tab]);
  useEffect(()=>{
    const fn=()=>setTab(getTabFromHash());
    window.addEventListener("hashchange",fn);
    return()=>window.removeEventListener("hashchange",fn);
  },[]);

  // 세션 복원
  useEffect(()=>{
    if(!adminHash){setChecking(false);return}
    (async()=>{
      try{
        const data=await rpc("admin_login",{p_hash:adminHash});
        if(data){setAdminInfo(data)}
        else{sessionStorage.removeItem("sp-admin-hash");setAdminHash("")}
      }catch(e){sessionStorage.removeItem("sp-admin-hash");setAdminHash("")}
      setChecking(false);
    })();
  },[]);

  const handleLogin=(hash,info)=>{
    sessionStorage.setItem("sp-admin-hash",hash);
    setAdminHash(hash);setAdminInfo(info);
  };
  const handleLogout=()=>{
    sessionStorage.removeItem("sp-admin-hash");
    setAdminHash("");setAdminInfo(null);
  };

  const loggedIn=!!adminHash&&!!adminInfo;

  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <header className="aps-header">
      <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
        <a href="index.html" style={{fontSize:"14px",fontWeight:700,color:"var(--text)",textDecoration:"none"}}>← STOCKPULSE</a>
        <span style={{fontSize:"13px",color:"var(--muted)"}}>|</span>
        <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
          <span style={{fontSize:"18px"}}>🏭</span>
          <span style={{fontWeight:700,fontSize:"15px"}}>APS 생산계획</span>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
        {loggedIn&&<span style={{fontSize:"12px",color:"var(--muted)"}}>👤 {adminInfo.nickname}</span>}
        {loggedIn&&<button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={handleLogout}>로그아웃</button>}
        <button onClick={toggleTheme} style={{background:"none",border:"none",fontSize:"20px",cursor:"pointer"}}>{theme==="dark"?"☀️":"🌙"}</button>
      </div>
    </header>

    <div className="aps-shell" style={{flex:1}}>
      {checking?<Loader/>:!loggedIn?<LoginScreen onLogin={handleLogin}/>:<>
        <div className="aps-tabs">
          <button className={"aps-tab"+(tab==="items"?" active":"")} onClick={()=>setTab("items")}>📦 품목 / BOM</button>
          <button className={"aps-tab"+(tab==="lines"?" active":"")} onClick={()=>setTab("lines")}>🏭 라인</button>
          <button className={"aps-tab"+(tab==="plans"?" active":"")} onClick={()=>setTab("plans")}>📅 생산계획</button>
          <button className={"aps-tab"+(tab==="staff"?" active":"")} onClick={()=>setTab("staff")}>👥 인원</button>
          <button className={"aps-tab"+(tab==="inventory"?" active":"")} onClick={()=>setTab("inventory")}>📊 재고</button>
          <button className={"aps-tab"+(tab==="stats"?" active":"")} onClick={()=>setTab("stats")}>📈 통계</button>
          <button className={"aps-tab"+(tab==="sheet"?" active":"")} onClick={()=>setTab("sheet")}>📋 재고 시트</button>
          <button className={"aps-tab"+(tab==="sales"?" active":"")} onClick={()=>setTab("sales")}>💰 매출</button>
          <button className={"aps-tab"+(tab==="meetings"?" active":"")} onClick={()=>setTab("meetings")}>📝 회의록</button>
          <button className={"aps-tab"+(tab==="loss"?" active":"")} onClick={()=>setTab("loss")}>🩸 로스</button>
        </div>
        {tab==="items"&&<ItemsTab adminHash={adminHash}/>}
        {tab==="lines"&&<LinesTab adminHash={adminHash}/>}
        {tab==="plans"&&<PlansTab adminHash={adminHash}/>}
        {tab==="staff"&&<StaffTab adminHash={adminHash}/>}
        {tab==="inventory"&&<InventoryTab adminHash={adminHash}/>}
        {tab==="stats"&&<StatsTab adminHash={adminHash}/>}
        {tab==="sheet"&&<InventorySheetTab adminHash={adminHash}/>}
        {tab==="sales"&&<SalesTab adminHash={adminHash}/>}
        {tab==="meetings"&&<MeetingsTab adminHash={adminHash}/>}
        {tab==="loss"&&<ProductionLossTab adminHash={adminHash}/>}
      </>}
    </div>

    <footer style={{borderTop:"1px solid var(--div2)",maxWidth:1100,margin:"0 auto",padding:"14px 32px",color:"var(--dimmer)",fontSize:"12px",width:"100%",boxSizing:"border-box",textAlign:"center"}}>
      STOCKPULSE APS © 2026 — 관리자 전용 생산계획 시스템
    </footer>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

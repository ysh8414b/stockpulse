<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback,useMemo,useRef}=React;

// ═══ Helpers ═══
async function hashPassword(pw){
  const enc=new TextEncoder().encode(pw);
  const buf=await crypto.subtle.digest("SHA-256",enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function rpc(name,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+name,{
    method:"POST",
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(body||{})
  });
  if(!r.ok){
    let msg="";
    try{const t=await r.text();msg=t}catch(e){msg=String(r.status)}
    throw new Error(msg||String(r.status));
  }
  const txt=await r.text();
  if(!txt)return null;
  try{return JSON.parse(txt)}catch(e){return txt}
}
function errMsg(e,map){
  const s=String(e?.message||e||"");
  for(const k in map){if(s.includes(k))return map[k]}
  return "오류: "+s.slice(0,80);
}
function fmtDate(s){
  if(!s)return "";
  try{const d=new Date(s);return d.toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\.\s?/g,"-").replace(/-$/,"")}catch(e){return s}
}
function fmtDateTime(s){
  if(!s)return "";
  try{const d=new Date(s);return d.toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return s}
}
function fmtNum(n){
  if(n==null||isNaN(n))return "0";
  const num=Number(n);
  return num.toLocaleString("ko-KR",{maximumFractionDigits:3});
}
function todayStr(){
  const d=new Date();
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),da=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${da}`;
}

// ═══ KST 시간 변환 (서버 TIMESTAMPTZ ↔ 브라우저 datetime-local) ═══
// 모든 시간은 KST(UTC+9) 기준으로 입력/표시. ISO 문자열로 서버 저장.
const KST_OFFSET_MS=9*3600*1000;
function isoToKstInput(iso){
  // "2026-06-12T00:00:00+00:00" → "2026-06-12T09:00" (KST datetime-local 입력값)
  if(!iso)return"";
  const d=new Date(iso);
  if(isNaN(d.getTime()))return"";
  const kst=new Date(d.getTime()+KST_OFFSET_MS);
  return kst.toISOString().slice(0,16);
}
function kstInputToIso(input){
  // "2026-06-12T09:00" (KST로 해석) → "2026-06-12T09:00:00+09:00"
  if(!input)return null;
  if(input.length===16)return input+":00+09:00";
  return input+"+09:00";
}
function isoToKstDateStr(iso){
  if(!iso)return"";
  const d=new Date(iso);
  return new Date(d.getTime()+KST_OFFSET_MS).toISOString().slice(0,10);
}
function isoToKstHourFloat(iso){
  if(!iso)return 0;
  const d=new Date(iso);
  const kst=new Date(d.getTime()+KST_OFFSET_MS);
  return kst.getUTCHours()+kst.getUTCMinutes()/60+kst.getUTCSeconds()/3600;
}
function fmtKstDateTime(iso){
  if(!iso)return"";
  const d=new Date(iso);
  if(isNaN(d.getTime()))return"";
  const kst=new Date(d.getTime()+KST_OFFSET_MS);
  const m=String(kst.getUTCMonth()+1).padStart(2,"0");
  const da=String(kst.getUTCDate()).padStart(2,"0");
  const h=String(kst.getUTCHours()).padStart(2,"0");
  const mi=String(kst.getUTCMinutes()).padStart(2,"0");
  return `${m}/${da} ${h}:${mi}`;
}
function fmtKstTime(iso){
  if(!iso)return"";
  const d=new Date(iso);
  const kst=new Date(d.getTime()+KST_OFFSET_MS);
  return `${String(kst.getUTCHours()).padStart(2,"0")}:${String(kst.getUTCMinutes()).padStart(2,"0")}`;
}

// ═══ 상수 ═══
const TYPE_LABEL={product:"제품",semi:"반제품",material:"원자재"};
const TYPE_PILL={
  product:{bg:"rgba(34,197,94,0.12)",fg:"#22c55e"},
  semi:{bg:"rgba(139,92,246,0.12)",fg:"#8b5cf6"},
  material:{bg:"rgba(6,182,212,0.12)",fg:"#06b6d4"}
};
const STATUS_LABEL={planned:"계획",in_progress:"진행중",done:"완료",canceled:"취소"};
const STATUS_PILL={
  planned:{bg:"rgba(148,163,184,0.18)",fg:"#94a3b8"},
  in_progress:{bg:"rgba(6,182,212,0.14)",fg:"#06b6d4"},
  done:{bg:"rgba(34,197,94,0.14)",fg:"#22c55e"},
  canceled:{bg:"rgba(239,68,68,0.14)",fg:"#ef4444"}
};
const TXN_LABEL={in:"입고",out:"출고",adjust:"조정"};
const TXN_PILL={
  in:{bg:"rgba(34,197,94,0.12)",fg:"#22c55e"},
  out:{bg:"rgba(239,68,68,0.12)",fg:"#ef4444"},
  adjust:{bg:"rgba(245,158,11,0.12)",fg:"#f59e0b"}
};
const STOCK_PILL={

  low:{bg:"rgba(245,158,11,0.14)",fg:"#f59e0b",label:"부족"},

function Pill({map,k,label}){
  const m=map[k]||{bg:"var(--card-bg)",fg:"var(--muted)"};
  return <span className="aps-pill" style={{background:m.bg,color:m.fg}}>{label||m.label||k}</span>;
}
function Loader(){
  return <div style={{textAlign:"center",padding:"60px 0"}}><div className="loader"></div></div>;
}
function Empty({emoji,text}){
  return <div className="aps-empty"><div className="aps-empty-emoji">{emoji||"📭"}</div>{text}</div>;
}

// ═══ 로그인 화면 ═══
function LoginScreen({onLogin}){
  const[pw,setPw]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);
  const[cooldown,setCooldown]=useState(false);

  const submit=async()=>{
    if(!pw.trim()||pw.trim().length<2){setErr("비밀번호를 입력하세요");return}
    if(cooldown)return;
    setLoading(true);setErr("");
    try{
      const h=await hashPassword(pw.trim());
      const data=await rpc("admin_login",{p_hash:h});
      if(!data){
        setErr("관리자 비밀번호가 아닙니다");
        setCooldown(true);
        setTimeout(()=>setCooldown(false),3000);
      }else{
        onLogin(h,data);
      }
    }catch(e){setErr("로그인 실패: "+e.message)}
    setLoading(false);
  };

  return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"60vh"}}>
    <div style={{background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:12,padding:"32px 28px",width:380,maxWidth:"100%"}}>
      <div style={{textAlign:"center",marginBottom:"20px"}}>
        <div style={{fontSize:"36px",marginBottom:"8px"}}>🏭</div>
        <div style={{fontSize:"20px",fontWeight:700}}>APS 관리자 로그인</div>
        <div style={{fontSize:"12px",color:"var(--muted)",marginTop:"4px"}}>생산계획 시스템 — 관리자 비밀번호로 로그인</div>
      </div>
      <input className="aps-input" type="password" placeholder="관리자 비밀번호" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} autoFocus/>
      {err&&<div className="aps-err">{err}</div>}
      <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading||cooldown} style={{width:"100%",marginTop:"14px"}}>{loading?"확인 중...":cooldown?"잠시 후 다시":"로그인"}</button>
      <div style={{marginTop:"14px",textAlign:"center",fontSize:"12px",color:"var(--dimmer)"}}>관리자 페이지(admin.html)와 동일한 비밀번호 사용</div>
    </div>
  </div>;
}

// ═══════════════════════════════════════════
// 품목 / BOM 탭
// ═══════════════════════════════════════════
function ItemForm({adminHash,initial,onSaved,onCancel}){
  const isEdit=!!initial;
  const[code,setCode]=useState(initial?.code||"");
  const[name,setName]=useState(initial?.name||"");
  const[type,setType]=useState(initial?.type||"product");
  const[unit,setUnit]=useState(initial?.unit||"EA");
  const[spec,setSpec]=useState(initial?.spec||"");
  const[safety,setSafety]=useState(initial?.safety_stock??0);
  const[lt,setLt]=useState(initial?.lead_time_days??0);
  const[memo,setMemo]=useState(initial?.memo||"");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!code.trim()){setErr("코드를 입력하세요");return}
    if(!name.trim()){setErr("품목명을 입력하세요");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_upsert_item",{
        p_admin_hash:adminHash,
        p_id:isEdit?initial.id:null,
        p_code:code.trim(),
        p_name:name.trim(),
        p_type:type,
        p_unit:unit.trim()||"EA",
        p_spec:spec.trim(),
        p_safety_stock:Number(safety)||0,
        p_lead_time_days:parseInt(lt)||0,
        p_memo:memo.trim()
      });
      onSaved();
    }catch(e){
      setErr(errMsg(e,{duplicate_code:"이미 존재하는 코드입니다",unauthorized:"인증 실패"}));
    }
    setLoading(false);
  };

  return <div className="aps-modal-bg" onClick={onCancel}>
    <div className="aps-modal" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"16px"}}>{isEdit?"품목 수정":"품목 추가"}</div>
      <div className="aps-form-grid">
        <div>
          <div className="aps-form-label">코드 *</div>
          <input className="aps-input" value={code} onChange={e=>setCode(e.target.value)} maxLength={30} placeholder="예: P001"/>
        </div>
        <div>
          <div className="aps-form-label">구분 *</div>
          <select className="aps-select" style={{width:"100%"}} value={type} onChange={e=>setType(e.target.value)}>
            <option value="product">제품</option>
            <option value="semi">반제품</option>
            <option value="material">원자재</option>
          </select>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">품목명 *</div>
          <input className="aps-input" value={name} onChange={e=>setName(e.target.value)} maxLength={80}/>
        </div>
        <div>
          <div className="aps-form-label">단위</div>
          <input className="aps-input" value={unit} onChange={e=>setUnit(e.target.value)} maxLength={10} placeholder="EA, KG, M..."/>
        </div>
        <div>
          <div className="aps-form-label">안전재고</div>
          <input className="aps-input" type="number" value={safety} onChange={e=>setSafety(e.target.value)} step="0.001" min="0"/>
        </div>
        <div>
          <div className="aps-form-label">리드타임(일)</div>
          <input className="aps-input" type="number" value={lt} onChange={e=>setLt(e.target.value)} step="1" min="0"/>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">규격/사양</div>
          <input className="aps-input" value={spec} onChange={e=>setSpec(e.target.value)} maxLength={200}/>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">메모</div>
          <textarea className="aps-input" value={memo} onChange={e=>setMemo(e.target.value)} maxLength={500} rows={2} style={{resize:"vertical"}}/>
        </div>
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"저장 중...":(isEdit?"수정":"추가")}</button>
      </div>
    </div>
  </div>;
}

function BomEditor({adminHash,parent,allItems,onClose}){
  const[rows,setRows]=useState([]);
  const[loading,setLoading]=useState(true);
  const[childId,setChildId]=useState("");
  const[qty,setQty]=useState("");
  const[loss,setLoss]=useState("0");
  const[err,setErr]=useState("");
  const[adding,setAdding]=useState(false);

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const data=await rpc("aps_list_bom",{p_admin_hash:adminHash,p_parent_id:parent.id});
      setRows(data||[]);
    }catch(e){console.error(e)}
    setLoading(false);
  },[adminHash,parent.id]);

  useEffect(()=>{load()},[load]);

  const candidates=useMemo(()=>allItems.filter(i=>i.id!==parent.id&&!rows.find(r=>r.child_id===i.id)),[allItems,parent.id,rows]);

  const add=async()=>{
    if(!childId){setErr("자재를 선택하세요");return}
    const q=Number(qty);
    if(!q||q<=0){setErr("소요량은 0보다 커야 합니다");return}
    setAdding(true);setErr("");
    try{
      await rpc("aps_upsert_bom",{
        p_admin_hash:adminHash,p_id:null,
        p_parent_id:parent.id,p_child_id:Number(childId),
        p_qty:q,p_loss_rate:Number(loss)||0
      });
      setChildId("");setQty("");setLoss("0");
      load();
    }catch(e){
      setErr(errMsg(e,{duplicate_child:"이미 등록된 자재입니다",self_reference:"자기 자신은 등록할 수 없습니다",unauthorized:"인증 실패"}));
    }
    setAdding(false);
  };

  const updateRow=async(r,field,v)=>{
    try{
      await rpc("aps_upsert_bom",{
        p_admin_hash:adminHash,p_id:r.id,
        p_parent_id:parent.id,p_child_id:r.child_id,
        p_qty:field==="qty"?Number(v)||0:Number(r.qty),
        p_loss_rate:field==="loss_rate"?Number(v)||0:Number(r.loss_rate)
      });
      load();
    }catch(e){alert("수정 실패: "+e.message)}
  };

  const del=async(id)=>{
    if(!confirm("이 자재를 BOM에서 제거하시겠습니까?"))return;
    try{
      await rpc("aps_delete_bom",{p_admin_hash:adminHash,p_id:id});
      load();
    }catch(e){alert("삭제 실패: "+e.message)}
  };

  return <div className="aps-modal-bg" onClick={onClose}>
    <div className="aps-modal aps-modal-lg" onClick={e=>e.stopPropagation()}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"4px"}}>
        <div style={{fontWeight:700,fontSize:"16px"}}>📋 BOM 편집</div>
        <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={onClose}>닫기</button>
      </div>
      <div style={{fontSize:"13px",color:"var(--muted)",marginBottom:"14px"}}>

function ItemsTab({adminHash}){

  const[query,setQuery]=useState("");
  const[editing,setEditing]=useState(null);
  const[showForm,setShowForm]=useState(false);

  const load=useCallback(async()=>{
    try{
      const data=await rpc("aps_list_items",{p_admin_hash:adminHash});
      setItems(data||[]);
    }catch(e){console.error(e)}
    setLoading(false);
  },[adminHash]);
  useEffect(()=>{load()},[load]);

  const filtered=useMemo(()=>{
    let arr=items;
    if(filter!=="all")arr=arr.filter(i=>i.type===filter);
    const q=query.trim().toLowerCase();
    if(q)arr=arr.filter(i=>i.code.toLowerCase().includes(q)||i.name.toLowerCase().includes(q));

            <th className="right hide-mobile" style={{width:90}}>안전재고</th>

            <th className="center" style={{width:170}}>작업</th>
          </tr></thead>

              <td style={{fontFamily:"monospace",color:"var(--text-sub)"}}>{i.code}</td>

function LineForm({adminHash,initial,onSaved,onCancel}){
  const isEdit=!!initial;
  const[code,setCode]=useState(initial?.code||"");
  const[name,setName]=useState(initial?.name||"");
  const[memo,setMemo]=useState(initial?.memo||"");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!code.trim()){setErr("라인 코드를 입력하세요");return}
    if(!name.trim()){setErr("라인 이름을 입력하세요");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_upsert_line",{
        p_admin_hash:adminHash,
        p_id:isEdit?initial.id:null,
        p_code:code.trim(),
        p_name:name.trim(),
        p_memo:memo.trim()
      });
      onSaved();
    }catch(e){
      setErr(errMsg(e,{duplicate_code:"이미 존재하는 라인 코드입니다",unauthorized:"인증 실패"}));
    }
    setLoading(false);
  };

  return <div className="aps-modal-bg" onClick={onCancel}>
    <div className="aps-modal" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"14px"}}>{isEdit?"🏭 라인 수정":"🏭 라인 추가"}</div>
      <div className="aps-form-grid">
        <div>
          <div className="aps-form-label">코드 *</div>
          <input className="aps-input" value={code} onChange={e=>setCode(e.target.value)} maxLength={20} placeholder="예: L1, A-1"/>
        </div>
        <div>
          <div className="aps-form-label">라인 이름 *</div>
          <input className="aps-input" value={name} onChange={e=>setName(e.target.value)} maxLength={50} placeholder="예: 1호기, 조립 라인 A"/>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">메모</div>
          <textarea className="aps-input" value={memo} onChange={e=>setMemo(e.target.value)} maxLength={300} rows={2} style={{resize:"vertical"}}/>
        </div>
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"저장 중...":(isEdit?"수정":"추가")}</button>
      </div>
    </div>
  </div>;
}

// 설정 모달 (근무시간)

function SettingsModal({adminHash,settings,onSaved,onCancel}){
  const[startH,setStartH]=useState(settings.work_start_hour||"8");
  const[endH,setEndH]=useState(settings.work_end_hour||"17");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    const s=parseInt(startH),e=parseInt(endH);
    if(isNaN(s)||s<0||s>23){setErr("시작 시각은 0~23 사이여야 합니다");return}
    if(isNaN(e)||e<1||e>24){setErr("종료 시각은 1~24 사이여야 합니다");return}
    if(e<=s){setErr("종료 시각은 시작 시각보다 커야 합니다");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_set_setting",{p_admin_hash:adminHash,p_key:"work_start_hour",p_value:String(s)});
      await rpc("aps_set_setting",{p_admin_hash:adminHash,p_key:"work_end_hour",p_value:String(e)});
      onSaved({work_start_hour:String(s),work_end_hour:String(e)});
    }catch(ex){
      setErr("저장 실패: "+ex.message);
    }
    setLoading(false);
  };

  return <div className="aps-modal-bg" onClick={onCancel}>
    <div className="aps-modal" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"14px"}}>⚙️ 근무시간 설정</div>
      <div style={{fontSize:12,color:"var(--muted)",marginBottom:14}}>간트차트 시간축 범위 (KST 24시간 기준). 24시간 운영이면 0–24로 설정.</div>
      <div className="aps-form-grid">
        <div>
          <div className="aps-form-label">시작 시각 (시)</div>
          <input className="aps-input" type="number" min="0" max="23" step="1" value={startH} onChange={e=>setStartH(e.target.value)}/>
        </div>
        <div>
          <div className="aps-form-label">종료 시각 (시)</div>
          <input className="aps-input" type="number" min="1" max="24" step="1" value={endH} onChange={e=>setEndH(e.target.value)}/>
        </div>
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"저장 중...":"저장"}</button>
      </div>
    </div>
  </div>;
}

function StockForm({adminHash,items,onSaved,onCancel,initialItem}){
  const[itemId,setItemId]=useState(initialItem?.item_id||initialItem?.id||"");
  const[type,setType]=useState("in");
  const[qty,setQty]=useState("");
  const[memo,setMemo]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!itemId){setErr("품목을 선택하세요");return}
    const q=Number(qty);
    if(!q){setErr("수량을 입력하세요");return}
    if(type!=="adjust"&&q<=0){setErr("입고/출고 수량은 0보다 커야 합니다");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_record_stock",{
        p_admin_hash:adminHash,
        p_item_id:Number(itemId),
        p_txn_type:type,
        p_qty:q,
        p_related_plan_id:null,
        p_memo:memo.trim()
      });
      onSaved();
    }catch(e){
      setErr(errMsg(e,{invalid_qty:"수량이 올바르지 않습니다",unauthorized:"인증 실패"}));
    }
    setLoading(false);
  };

  return <div className="aps-modal-bg" onClick={onCancel}>
    <div className="aps-modal" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"14px"}}>📦 입출고 기록</div>
      <div className="aps-form-grid">
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">품목 *</div>
          <select className="aps-select" style={{width:"100%"}} value={itemId} onChange={e=>setItemId(e.target.value)}>
            <option value="">- 품목 선택 -</option>
            {items.map(i=><option key={i.id} value={i.id}>[{TYPE_LABEL[i.type]}] {i.code} - {i.name}</option>)}
          </select>
        </div>
        <div>
          <div className="aps-form-label">유형 *</div>
          <select className="aps-select" style={{width:"100%"}} value={type} onChange={e=>setType(e.target.value)}>
            <option value="in">입고 (+)</option>
            <option value="out">출고 (-)</option>
            <option value="adjust">조정 (±)</option>
          </select>
        </div>
        <div>
          <div className="aps-form-label">수량 * {type==="adjust"&&<span style={{color:"#f59e0b"}}>(부호 포함)</span>}</div>
          <input className="aps-input" type="number" step="0.001" value={qty} onChange={e=>setQty(e.target.value)} placeholder={type==="adjust"?"+10 또는 -5":"양수"}/>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">메모</div>
          <input className="aps-input" value={memo} onChange={e=>setMemo(e.target.value)} maxLength={200} placeholder="입고처/출고처/사유 등"/>
        </div>
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"기록 중...":"기록"}</button>
      </div>
    </div>
  </div>;
}

function InventoryTab({adminHash}){
  const[inv,setInv]=useState([]);
  const[items,setItems]=useState([]);
  const[txns,setTxns]=useState([]);
  const[loading,setLoading]=useState(true);
  const[filter,setFilter]=useState("all"); // all/out/low/ok
  const[query,setQuery]=useState("");
  const[showForm,setShowForm]=useState(false);

  const load=useCallback(async()=>{
    try{
      const[invD,itD,txnD]=await Promise.all([
        rpc("aps_list_inventory",{p_admin_hash:adminHash}),
        rpc("aps_list_items",{p_admin_hash:adminHash}),
        rpc("aps_list_stock_txns",{p_admin_hash:adminHash,p_item_id:null,p_limit:50})
      ]);
      setInv(invD||[]);setItems(itD||[]);setTxns(txnD||[]);
    }catch(e){console.error(e)}
    setLoading(false);
  },[adminHash]);
  useEffect(()=>{load()},[load]);

  const filtered=useMemo(()=>{
    let arr=inv;
    if(filter!=="all")arr=arr.filter(i=>i.stock_status===filter);
    const q=query.trim().toLowerCase();
    if(q)arr=arr.filter(i=>i.code.toLowerCase().includes(q)||i.name.toLowerCase().includes(q));
    return arr;
  },[inv,filter,query]);

  const counts=useMemo(()=>({
    all:inv.length,
    out:inv.filter(i=>i.stock_status==="out").length,
    low:inv.filter(i=>i.stock_status==="low").length,
    ok:inv.filter(i=>i.stock_status==="ok").length
  }),[inv]);

  const delTxn=async(id)=>{
    if(!confirm("이 입출고 기록을 삭제하시겠습니까?\n재고는 자동으로 재계산됩니다."))return;
    try{
      await rpc("aps_delete_stock_txn",{p_admin_hash:adminHash,p_id:id});
      load();
    }catch(e){alert("삭제 실패: "+e.message)}
  };

  return <div>
    <div className="aps-toolbar">
      <div className="aps-filter">
        <button className={filter==="all"?"on":""} onClick={()=>setFilter("all")}>전체 {counts.all}</button>
        <button className={filter==="out"?"on":""} onClick={()=>setFilter("out")}>품절 {counts.out}</button>
        <button className={filter==="low"?"on":""} onClick={()=>setFilter("low")}>부족 {counts.low}</button>
        <button className={filter==="ok"?"on":""} onClick={()=>setFilter("ok")}>정상 {counts.ok}</button>
      </div>
      <input className="aps-input" placeholder="코드/품목명 검색" value={query} onChange={e=>setQuery(e.target.value)} style={{flex:"1 1 180px",maxWidth:240}}/>
      <button className="aps-btn aps-btn-primary" onClick={()=>setShowForm(true)} disabled={items.length===0}>+ 입출고 기록</button>
    </div>

    {loading?<Loader/>:filtered.length===0?
      <Empty emoji="📊" text={inv.length===0?"품목을 먼저 등록하세요":"검색 결과가 없습니다"}/>:
      <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8}}>
        <table className="aps-table">
          <thead><tr>
            <th style={{width:100}}>코드</th>
            <th>품목명</th>
            <th className="center" style={{width:70}}>구분</th>
            <th className="right" style={{width:110}}>현재재고</th>
            <th className="right hide-mobile" style={{width:100}}>안전재고</th>
            <th className="right hide-mobile" style={{width:100}}>차이</th>
            <th className="center" style={{width:70}}>상태</th>
          </tr></thead>
          <tbody>
            {filtered.map(i=><tr key={i.item_id}>
              <td style={{fontFamily:"monospace",color:"var(--text-sub)"}}>{i.code}</td>
              <td style={{fontWeight:600}}>{i.name}</td>
              <td className="center"><Pill map={TYPE_PILL} k={i.type} label={TYPE_LABEL[i.type]}/></td>
              <td className="right" style={{fontWeight:600,color:i.stock_status==="out"?"#ef4444":i.stock_status==="low"?"#f59e0b":"var(--text)"}}>
                {fmtNum(i.current_stock)} <span style={{fontSize:"11px",color:"var(--muted)",fontWeight:400}}>{i.unit}</span>
              </td>
              <td className="right hide-mobile" style={{color:"var(--muted)"}}>{fmtNum(i.safety_stock)}</td>
              <td className="right hide-mobile" style={{color:Number(i.stock_diff)<0?"#ef4444":"var(--muted)"}}>{Number(i.stock_diff)>=0?"+":""}{fmtNum(i.stock_diff)}</td>
              <td className="center"><Pill map={STOCK_PILL} k={i.stock_status}/></td>
            </tr>)}
          </tbody>
        </table>
      </div>
    }

    <div className="aps-section-title">📜 최근 입출고 이력 ({txns.length})</div>
    {txns.length===0?
      <Empty emoji="📜" text="입출고 기록이 없습니다"/>:
      <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8}}>
        <table className="aps-table">
          <thead><tr>
            <th style={{width:120}}>일시</th>
            <th>품목</th>
            <th className="center" style={{width:60}}>유형</th>
            <th className="right" style={{width:100}}>수량</th>
            <th className="hide-mobile">메모</th>
            <th className="center" style={{width:60}}>삭제</th>
          </tr></thead>
          <tbody>
            {txns.map(t=><tr key={t.id}>
              <td style={{fontSize:"11px",color:"var(--muted)"}}>{fmtDateTime(t.created_at)}</td>
              <td>
                <div style={{fontWeight:600}}>{t.item_name}</div>
                <div style={{fontSize:"11px",color:"var(--muted)"}}>{t.item_code}</div>
              </td>
              <td className="center"><Pill map={TXN_PILL} k={t.txn_type} label={TXN_LABEL[t.txn_type]}/></td>
              <td className="right" style={{fontWeight:600,color:Number(t.qty)>0?"#22c55e":Number(t.qty)<0?"#ef4444":"var(--text)"}}>
                {Number(t.qty)>0?"+":""}{fmtNum(t.qty)} <span style={{fontSize:"11px",color:"var(--muted)",fontWeight:400}}>{t.unit}</span>
              </td>
              <td className="hide-mobile" style={{color:"var(--muted)",fontSize:"12px"}}>{t.memo||"-"}</td>
              <td className="center"><button className="aps-btn aps-btn-danger aps-btn-sm" onClick={()=>delTxn(t.id)}>삭제</button></td>
            </tr>)}
          </tbody>
        </table>
      </div>
    }

    {showForm&&<StockForm adminHash={adminHash} items={items} onCancel={()=>setShowForm(false)} onSaved={()=>{setShowForm(false);load()}}/>}
  </div>;
}

// 생산계획 탭
// ═══════════════════════════════════════════
function PlanForm({adminHash,items,lines,settings,initial,onSaved,onCancel}){
  const isEdit=!!initial;
  const wsh=parseInt(settings?.work_start_hour||"8");
  const defaultStartInput=`${todayStr()}T${String(wsh).padStart(2,"0")}:00`;
  const defaultEndInput=`${todayStr()}T${String(Math.min(wsh+1,23)).padStart(2,"0")}:00`;
  const[itemId,setItemId]=useState(initial?.item_id||"");
  const[lineId,setLineId]=useState(initial?.line_id||"");
  const[qty,setQty]=useState(initial?.qty||"");
  const[startAt,setStartAt]=useState(initial?isoToKstInput(initial.start_at):defaultStartInput);
  const[endAt,setEndAt]=useState(initial?isoToKstInput(initial.end_at):defaultEndInput);
  const[status,setStatus]=useState(initial?.status||"planned");
  const[memo,setMemo]=useState(initial?.memo||"");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!itemId){setErr("품목을 선택하세요");return}
    const q=Number(qty);
    if(!q||q<=0){setErr("수량은 0보다 커야 합니다");return}
    if(!startAt||!endAt){setErr("시작/종료 시각을 입력하세요");return}
    if(endAt<=startAt){setErr("종료 시각은 시작 시각보다 뒤여야 합니다");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_upsert_plan",{
        p_admin_hash:adminHash,
        p_id:isEdit?initial.id:null,
        p_item_id:Number(itemId),
        p_line_id:lineId?Number(lineId):null,
        p_qty:q,
        p_start_at:kstInputToIso(startAt),
        p_end_at:kstInputToIso(endAt),
        p_status:status,
        p_memo:memo.trim()
      });
      onSaved();
    }catch(e){
      setErr(errMsg(e,{invalid_times:"종료 시각이 시작 시각 이전입니다",unauthorized:"인증 실패"}));
    }
    setLoading(false);
  };

  const producible=items.filter(i=>i.type==="product"||i.type==="semi");

  return <div className="aps-modal-bg" onClick={onCancel}>
    <div className="aps-modal" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"14px"}}>{isEdit?"📅 생산계획 수정":"📅 생산계획 추가"}</div>
      <div className="aps-form-grid">
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">품목 *</div>
          <select className="aps-select" style={{width:"100%"}} value={itemId} onChange={e=>setItemId(e.target.value)}>
            <option value="">- 제품/반제품 선택 -</option>
            {producible.map(i=><option key={i.id} value={i.id}>[{TYPE_LABEL[i.type]}] {i.code} - {i.name}</option>)}
          </select>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">라인 {lines.length===0&&<span style={{color:"#f59e0b"}}>(먼저 등록 필요)</span>}</div>
          <select className="aps-select" style={{width:"100%"}} value={lineId} onChange={e=>setLineId(e.target.value)} disabled={lines.length===0}>
            <option value="">- 라인 미지정 -</option>
            {lines.map(l=><option key={l.id} value={l.id}>{l.code} · {l.name}</option>)}
          </select>
        </div>
        <div>
          <div className="aps-form-label">수량 *</div>
          <input className="aps-input" type="number" step="0.001" min="0" value={qty} onChange={e=>setQty(e.target.value)}/>
        </div>
        <div>
          <div className="aps-form-label">상태</div>
          <select className="aps-select" style={{width:"100%"}} value={status} onChange={e=>setStatus(e.target.value)}>
            <option value="planned">계획</option>
            <option value="in_progress">진행중</option>
            <option value="done">완료</option>
            <option value="canceled">취소</option>
          </select>
        </div>
        <div>
          <div className="aps-form-label">시작 시각 * <span style={{color:"var(--muted)",fontWeight:400}}>(KST)</span></div>
          <input className="aps-input" type="datetime-local" value={startAt} onChange={e=>setStartAt(e.target.value)}/>
        </div>
        <div>
          <div className="aps-form-label">종료 시각 * <span style={{color:"var(--muted)",fontWeight:400}}>(KST)</span></div>
          <input className="aps-input" type="datetime-local" value={endAt} onChange={e=>setEndAt(e.target.value)}/>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">메모</div>
          <textarea className="aps-input" value={memo} onChange={e=>setMemo(e.target.value)} maxLength={500} rows={2} style={{resize:"vertical"}}/>
        </div>
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"저장 중...":(isEdit?"수정":"추가")}</button>
      </div>
    </div>
  </div>;
}

// ═══ 간트차트 뷰 (시간 단위, 라인 행) ═══
const GANTT_HOUR_W=64;        // 1시간 컬럼 폭
const GANTT_ROW_H=48;          // 라인 행 높이
const GANTT_LABEL_W=170;       // 좌측 라인 라벨 폭 (한글 6~9자 + 코드)
const GANTT_HEADER_H=44;
const GANTT_LANE_GAP=2;        // 레인 간 간격

function GanttView({plans,lines,settings,onPlanClick,onOpenSettings}){
  const workStart=parseInt(settings?.work_start_hour||"8");
  const workEnd=parseInt(settings?.work_end_hour||"17");
  const hourCount=Math.max(1,workEnd-workStart);
  const hours=useMemo(()=>{const a=[];for(let i=0;i<hourCount;i++)a.push(workStart+i);return a},[workStart,hourCount]);

  const[dayStr,setDayStr]=useState(()=>todayStr());

  // 선택 일자의 KST 00:00 / 24:00 UTC 시각 계산
  const dayBounds=useMemo(()=>{
    // dayStr는 KST 기준 YYYY-MM-DD. KST 00:00 = UTC (전날 15:00)
    const dayStartIso=dayStr+"T00:00:00+09:00";
    const dayStartMs=new Date(dayStartIso).getTime();
    const workStartMs=dayStartMs+workStart*3600*1000;
    const workEndMs=dayStartMs+workEnd*3600*1000;
    return{dayStartMs,workStartMs,workEndMs};
  },[dayStr,workStart,workEnd]);

  // 라인이 없으면 "라인 미지정" 가상 라인 하나 추가
  const displayLines=useMemo(()=>{
    const ls=[...lines];
    const hasUnassigned=plans.some(p=>!p.line_id);
    if(hasUnassigned||ls.length===0)ls.push({id:null,code:"-",name:"미지정",virtual:true});
    return ls;
  },[lines,plans]);

  // 라인별 표시 계획 + 레인 할당
  const layoutByLine=useMemo(()=>{
    const{workStartMs,workEndMs}=dayBounds;
    const result=new Map();
    for(const line of displayLines){
      // 이 라인 계획 중 윈도우와 겹치는 것만
      const linePlans=plans.filter(p=>(p.line_id||null)===(line.id||null)).map(p=>{
        const ps=new Date(p.start_at).getTime();
        const pe=new Date(p.end_at).getTime();
        if(pe<=workStartMs||ps>=workEndMs)return null;
        const vs=Math.max(ps,workStartMs);
        const ve=Math.min(pe,workEndMs);
        const leftHour=(vs-workStartMs)/3600000;          // 0 ~ hourCount
        const widthHour=(ve-vs)/3600000;
        return{
          plan:p,
          startMs:ps,endMs:pe,
          leftHour,widthHour,
          leftEdge:ps<workStartMs,rightEdge:pe>workEndMs,
          lane:0
        };
      }).filter(Boolean);

      // 시작순 정렬 후 레인 할당 (greedy)
      linePlans.sort((a,b)=>a.startMs-b.startMs);
      const laneEnds=[]; // 각 레인의 마지막 endMs
      for(const lp of linePlans){
        let placed=false;
        for(let i=0;i<laneEnds.length;i++){
          if(laneEnds[i]<=lp.startMs){
            lp.lane=i;laneEnds[i]=lp.endMs;placed=true;break;
          }
        }
        if(!placed){lp.lane=laneEnds.length;laneEnds.push(lp.endMs);}
      }
      result.set(line.id===null?"null":line.id,{laneCount:Math.max(1,laneEnds.length),plans:linePlans});
    }
    return result;
  },[plans,displayLines,dayBounds]);

  // 오늘인지 + 현재 시각 라인 위치
  const nowKst=isoToKstHourFloat(new Date().toISOString());
  const todayKstDate=isoToKstDateStr(new Date().toISOString());
  const isViewingToday=dayStr===todayKstDate;
  const nowLeftHour=nowKst-workStart;
  const showNowLine=isViewingToday&&nowLeftHour>=0&&nowLeftHour<=hourCount;

  const gridW=hourCount*GANTT_HOUR_W;
  const totalVisible=Array.from(layoutByLine.values()).reduce((a,v)=>a+v.plans.length,0);

  const shiftDay=(n)=>{
    const d=new Date(dayStr+"T00:00:00+09:00");
    d.setUTCDate(d.getUTCDate()+n);
    setDayStr(d.toISOString().slice(0,10));
  };

  return <div>
    <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>shiftDay(-1)}>← 이전 날</button>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>setDayStr(todayStr())}>오늘</button>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>shiftDay(1)}>다음 날 →</button>
      <input className="aps-input" type="date" value={dayStr} onChange={e=>setDayStr(e.target.value)} style={{width:150,padding:"6px 10px"}}/>
      <span style={{fontSize:12,color:"var(--muted)",marginLeft:8}}>
        근무 {String(workStart).padStart(2,"0")}:00 – {String(workEnd).padStart(2,"0")}:00 · 표시 {totalVisible}/{plans.length}건
      </span>
      <div style={{flex:1}}></div>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={onOpenSettings}>⚙ 근무시간</button>
    </div>

    {plans.length===0?
      <Empty emoji="📅" text="표시할 생산계획이 없습니다"/>:
      <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8,background:"var(--bg)"}}>
        <div style={{display:"flex",minWidth:GANTT_LABEL_W+gridW}}>

          {/* ─── 좌측 라인 라벨 컬럼 ─── */}
          <div style={{width:GANTT_LABEL_W,flexShrink:0,position:"sticky",left:0,zIndex:2,background:"var(--bg)",borderRight:"1px solid var(--div2)"}}>
            <div style={{height:GANTT_HEADER_H,padding:"10px 12px",fontSize:12,fontWeight:600,color:"var(--muted)",borderBottom:"1px solid var(--div2)",background:"var(--card-bg)",boxSizing:"border-box"}}>라인</div>
            {displayLines.map(line=>{
              const key=line.id===null?"null":line.id;
              const info=layoutByLine.get(key)||{laneCount:1,plans:[]};
              const rowH=GANTT_ROW_H*info.laneCount;
              return <div key={key} style={{height:rowH,padding:"6px 10px",borderBottom:"1px solid var(--div)",boxSizing:"border-box",overflow:"hidden",display:"flex",flexDirection:"column",justifyContent:"center"}}>
                <div style={{fontWeight:600,fontSize:13,color:line.virtual?"var(--muted)":"var(--text)",lineHeight:1.25,wordBreak:"keep-all",overflowWrap:"break-word"}}>{line.name}</div>
                <div style={{fontSize:10,color:"var(--muted)",fontFamily:"monospace",marginTop:1}}>{line.code}{info.plans.length>0&&<span style={{marginLeft:6,color:"var(--dimmer)"}}>· {info.plans.length}건</span>}</div>
              </div>;
            })}
          </div>

          {/* ─── 우측 시간 그리드 ─── */}
          <div style={{position:"relative"}}>
            {/* 헤더 (시간) — 라벨이 컬럼 경계선에 위치 (N+1개, 시작 + 매시 + 종료) */}
            <div style={{display:"flex",height:GANTT_HEADER_H,borderBottom:"1px solid var(--div2)",background:"var(--card-bg)",position:"relative"}}>
              {/* 배경 셀 (시간 경계선용) */}
              {hours.map((h,i)=><div key={i} style={{
                width:GANTT_HOUR_W,flexShrink:0,
                borderRight:i===hourCount-1?"none":"1px solid var(--div)",
                boxSizing:"border-box"
              }}/>)}
              {/* 경계선 시간 라벨 (workStart ~ workEnd, hourCount+1개) */}
              {Array.from({length:hourCount+1}).map((_,i)=>{
                const isFirst=i===0;
                const isLast=i===hourCount;
                return <div key={"t"+i} style={{
                  position:"absolute",
                  top:0,height:GANTT_HEADER_H,
                  left:i*GANTT_HOUR_W,
                  transform:isFirst?"none":isLast?"translateX(-100%)":"translateX(-50%)",
                  fontSize:11,color:"var(--muted)",fontWeight:500,
                  display:"flex",alignItems:"center",padding:"0 6px",
                  whiteSpace:"nowrap",pointerEvents:"none"
                }}>
                  {String(workStart+i).padStart(2,"0")}:00
                </div>;
              })}
            </div>

            {/* 각 라인 행 */}
            {displayLines.map(line=>{
              const key=line.id===null?"null":line.id;
              const info=layoutByLine.get(key)||{laneCount:1,plans:[]};
              const rowH=GANTT_ROW_H*info.laneCount;
              const laneH=(GANTT_ROW_H-8)/Math.max(1,info.laneCount);
              return <div key={key} style={{height:rowH,position:"relative",borderBottom:"1px solid var(--div)",display:"flex"}}>
                {/* 배경 셀 (시간 그리드) */}
                {hours.map((h,i)=><div key={i} style={{
                  width:GANTT_HOUR_W,flexShrink:0,
                  borderRight:i===hourCount-1?"none":"1px solid var(--div)",
                  boxSizing:"border-box"
                }}/>)}
                {/* 막대 (레인별 스택) */}
                {info.plans.map(lp=>{
                  const sp=STATUS_PILL[lp.plan.status]||{};
                  const tipPlan=`계획: ${fmtKstDateTime(lp.plan.start_at)} ~ ${fmtKstDateTime(lp.plan.end_at)}`;
                  const tipActual=lp.plan.actual_start_at||lp.plan.actual_end_at
                    ?`\n실제: ${fmtKstDateTime(lp.plan.actual_start_at)||"-"} ~ ${fmtKstDateTime(lp.plan.actual_end_at)||"진행중"}`
                    :"";
                  return <div key={lp.plan.id} className="aps-gantt-bar" onClick={()=>onPlanClick(lp.plan)}
                    title={`${lp.plan.item_name} · ${STATUS_LABEL[lp.plan.status]} · ${fmtNum(lp.plan.qty)}${lp.plan.item_unit}\n${tipPlan}${tipActual}`}
                    style={{
                      position:"absolute",
                      left:lp.leftHour*GANTT_HOUR_W+2,
                      width:Math.max(lp.widthHour*GANTT_HOUR_W-4,12),
                      top:4+lp.lane*(laneH+GANTT_LANE_GAP),
                      height:laneH,
                      background:sp.bg||"var(--card-bg)",
                      border:`1px solid ${sp.fg||"var(--card-bd)"}`,
                      borderLeftWidth:lp.leftEdge?4:1,
                      borderRightWidth:lp.rightEdge?4:1,
                      padding:"0 6px",
                      fontSize:10,fontWeight:600,
                      color:sp.fg||"var(--text)",
                      whiteSpace:"nowrap"
                    }}>
                    {lp.plan.item_name} · {fmtNum(lp.plan.qty)}{lp.plan.item_unit}
                  </div>;
                })}
              </div>;
            })}

            {/* 현재 시각 세로 선 */}
            {showNowLine&&<div style={{
              position:"absolute",
              left:nowLeftHour*GANTT_HOUR_W-1,
              top:0,
              width:2,
              height:GANTT_HEADER_H+displayLines.reduce((a,line)=>{
                const k=line.id===null?"null":line.id;
                return a+GANTT_ROW_H*((layoutByLine.get(k)?.laneCount)||1);
              },0),
              background:"#ef4444",
              pointerEvents:"none",
              zIndex:1,
              opacity:.6
            }}/>}
          </div>
        </div>
      </div>
    }
    <div style={{fontSize:11,color:"var(--dimmer)",marginTop:8,lineHeight:1.5}}>
      ※ 막대 클릭 → 수정 · 좌우 두꺼운 테두리 = 근무 외 시간으로 연장 · 빨강 세로선 = 현재 시각 · 같은 라인 시간 겹침은 레인 자동 분할
    </div>
  </div>;
}

function PlansTab({adminHash}){
  const[plans,setPlans]=useState([]);
  const[items,setItems]=useState([]);
  const[lines,setLines]=useState([]);
  const[settings,setSettings]=useState({work_start_hour:"8",work_end_hour:"17"});
  const[loading,setLoading]=useState(true);
  const[filter,setFilter]=useState("all");
  const[editing,setEditing]=useState(null);
  const[showForm,setShowForm]=useState(false);
  const[showSettings,setShowSettings]=useState(false);
  const[viewMode,setViewMode]=useState("gantt");

  const load=useCallback(async()=>{
    try{
      const[plD,itD,lnD,stD]=await Promise.all([
        rpc("aps_list_plans",{p_admin_hash:adminHash,p_status:null}),
        rpc("aps_list_items",{p_admin_hash:adminHash}),
        rpc("aps_list_lines",{p_admin_hash:adminHash}),
        rpc("aps_get_settings",{p_admin_hash:adminHash})
      ]);
      setPlans(plD||[]);setItems(itD||[]);setLines(lnD||[]);
      if(stD&&typeof stD==="object")setSettings(s=>({...s,...stD}));
    }catch(e){console.error(e)}
    setLoading(false);
  },[adminHash]);
  useEffect(()=>{load()},[load]);

  const filtered=useMemo(()=>filter==="all"?plans:plans.filter(p=>p.status===filter),[plans,filter]);

  const counts=useMemo(()=>({
    all:plans.length,
    planned:plans.filter(p=>p.status==="planned").length,
    in_progress:plans.filter(p=>p.status==="in_progress").length,
    done:plans.filter(p=>p.status==="done").length,
    canceled:plans.filter(p=>p.status==="canceled").length
  }),[plans]);

  const changeStatus=async(p,newStatus)=>{
    try{
      // aps_set_plan_status는 서버에서 actual_start_at/actual_end_at에 now() 자동 기록
      await rpc("aps_set_plan_status",{
        p_admin_hash:adminHash,p_id:p.id,p_status:newStatus
      });
      load();
    }catch(e){alert("상태 변경 실패: "+e.message)}
  };

  const del=async(p)=>{
    if(!confirm(`생산계획 #${p.id} (${p.item_name}) 을(를) 삭제하시겠습니까?`))return;
    try{
      await rpc("aps_delete_plan",{p_admin_hash:adminHash,p_id:p.id});
      load();
    }catch(e){alert("삭제 실패: "+e.message)}
  };

  const nowMs=Date.now();

  return <div>
    <div className="aps-toolbar">
      <div className="aps-filter">
        <button className={filter==="all"?"on":""} onClick={()=>setFilter("all")}>전체 {counts.all}</button>
        <button className={filter==="planned"?"on":""} onClick={()=>setFilter("planned")}>계획 {counts.planned}</button>
        <button className={filter==="in_progress"?"on":""} onClick={()=>setFilter("in_progress")}>진행중 {counts.in_progress}</button>
        <button className={filter==="done"?"on":""} onClick={()=>setFilter("done")}>완료 {counts.done}</button>
        <button className={filter==="canceled"?"on":""} onClick={()=>setFilter("canceled")}>취소 {counts.canceled}</button>
      </div>
      <div style={{flex:1}}></div>
      <div className="aps-view-toggle">
        <button className={viewMode==="list"?"on":""} onClick={()=>setViewMode("list")}>📋 리스트</button>
        <button className={viewMode==="gantt"?"on":""} onClick={()=>setViewMode("gantt")}>📊 간트</button>
      </div>
      <button className="aps-btn aps-btn-primary" onClick={()=>{setEditing(null);setShowForm(true)}} disabled={items.filter(i=>i.type!=="material").length===0}>+ 생산계획 추가</button>
    </div>

    {loading?<Loader/>:viewMode==="gantt"?
      <GanttView plans={filtered} lines={lines} settings={settings}
        onPlanClick={p=>{setEditing(p);setShowForm(true)}}
        onOpenSettings={()=>setShowSettings(true)}/>:
      filtered.length===0?
      <Empty emoji="📅" text={plans.length===0?"생산계획이 없습니다. 우측 상단에서 추가하세요.":"해당 상태의 계획이 없습니다"}/>:
      <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8}}>
        <table className="aps-table">
          <thead><tr>
            <th className="center" style={{width:50}}>#</th>
            <th>품목</th>
            <th className="hide-mobile" style={{width:110}}>라인</th>
            <th className="right" style={{width:90}}>수량</th>
            <th className="center hide-mobile" style={{width:130}}>시작</th>
            <th className="center" style={{width:130}}>종료</th>
            <th className="center" style={{width:70}}>상태</th>
            <th className="center" style={{width:180}}>작업</th>
          </tr></thead>
          <tbody>
            {filtered.map(p=>{
              const endMs=p.end_at?new Date(p.end_at).getTime():0;
              const overdue=p.status!=="done"&&p.status!=="canceled"&&endMs>0&&endMs<nowMs;
              return <tr key={p.id}>
                <td className="center" style={{color:"var(--muted)",fontSize:"12px"}}>{p.id}</td>
                <td>
                  <div style={{fontWeight:600}}>{p.item_name}</div>
                  <div style={{fontSize:"11px",color:"var(--muted)"}}>{p.item_code}</div>
                  {p.memo&&<div style={{fontSize:"11px",color:"var(--dimmer)",marginTop:2}}>{p.memo}</div>}
                </td>
                <td className="hide-mobile" style={{fontSize:12}}>
                  {p.line_name?<><div style={{fontWeight:500}}>{p.line_name}</div><div style={{fontSize:10,color:"var(--muted)",fontFamily:"monospace"}}>{p.line_code}</div></>:<span style={{color:"var(--muted)"}}>미지정</span>}
                </td>
                <td className="right" style={{fontWeight:600}}>{fmtNum(p.qty)} <span style={{fontSize:"11px",color:"var(--muted)",fontWeight:400}}>{p.item_unit}</span></td>
                <td className="center hide-mobile" style={{fontSize:"12px",color:"var(--muted)"}}>
                  <div>계획: {fmtKstDateTime(p.start_at)}</div>
                  {p.actual_start_at&&<div style={{color:"#22c55e",fontSize:11,marginTop:2}}>실제: {fmtKstDateTime(p.actual_start_at)}</div>}
                </td>
                <td className="center" style={{fontSize:"12px",color:overdue?"#ef4444":"var(--muted)",fontWeight:overdue?700:400}}>
                  <div>계획: {fmtKstDateTime(p.end_at)}</div>
                  {p.actual_end_at&&<div style={{color:"#22c55e",fontSize:11,marginTop:2,fontWeight:400}}>실제: {fmtKstDateTime(p.actual_end_at)}</div>}
                  {overdue&&<div style={{fontSize:"10px"}}>지연</div>}
                </td>
                <td className="center"><Pill map={STATUS_PILL} k={p.status} label={STATUS_LABEL[p.status]}/></td>
                <td className="center">
                  <div style={{display:"flex",gap:4,justifyContent:"center",flexWrap:"wrap"}}>
                    {p.status==="planned"&&<button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>changeStatus(p,"in_progress")}>▶ 시작</button>}
                    {p.status==="in_progress"&&<button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>changeStatus(p,"done")}>✓ 완료</button>}
                    <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>{setEditing(p);setShowForm(true)}}>수정</button>
                    <button className="aps-btn aps-btn-danger aps-btn-sm" onClick={()=>del(p)}>삭제</button>
                  </div>
                </td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    }

    {showForm&&<PlanForm adminHash={adminHash} items={items} lines={lines} settings={settings} initial={editing} onCancel={()=>setShowForm(false)} onSaved={()=>{setShowForm(false);load()}}/>}
    {showSettings&&<SettingsModal adminHash={adminHash} settings={settings} onCancel={()=>setShowSettings(false)} onSaved={(s)=>{setSettings(prev=>({...prev,...s}));setShowSettings(false)}}/>}
  </div>;
}

// 통계 탭 (품목별 누적 생산 시간 + 1년 retention)
// ═══════════════════════════════════════════
const RANGE_LABEL={"7":"7일","30":"30일","90":"90일","365":"1년","all":"전체"};
const RANGES=["7","30","90","365","all"];

function fmtHours(h){
  const n=Number(h)||0;
  if(n===0)return "0";
  if(n<1)return Math.round(n*60)+"분";
  const hh=Math.floor(n);
  const mm=Math.round((n-hh)*60);
  return mm===0?`${hh}시간`:`${hh}시간 ${mm}분`;
}

function StatsTab({adminHash}){
  const[stats,setStats]=useState([]);
  const[loading,setLoading]=useState(true);
  const[range,setRange]=useState("30");
  const[sortBy,setSortBy]=useState("count");  // count/total/avg/rate
  const[cleanupMsg,setCleanupMsg]=useState("");

  const load=useCallback(async(rangeKey)=>{
    setLoading(true);
    try{
      const days=rangeKey==="all"?null:parseInt(rangeKey);
      const data=await rpc("aps_get_item_stats",{p_admin_hash:adminHash,p_days_back:days});
      setStats(data||[]);
    }catch(e){console.error(e)}
    setLoading(false);
  },[adminHash]);
  useEffect(()=>{load(range)},[load,range]);

  // 1일 1회 자동 cleanup
  useEffect(()=>{
    const key="aps-cleanup-last";
    const last=localStorage.getItem(key);
    const today=todayStr();
    if(last===today)return;
    (async()=>{
      try{
        const removed=await rpc("aps_cleanup_old_plans",{p_admin_hash:adminHash,p_days:365});
        localStorage.setItem(key,today);
        if(removed>0)setCleanupMsg(`365일 초과 ${removed}건 자동 정리됨`);
      }catch(e){console.warn("cleanup failed",e)}
    })();
  },[adminHash]);

  const sorted=useMemo(()=>{
    const arr=[...stats];
    arr.sort((a,b)=>{
      if(sortBy==="count")return b.plan_count-a.plan_count;
      if(sortBy==="total")return Number(b.total_actual_hours)-Number(a.total_actual_hours);
      if(sortBy==="avg")  return Number(b.avg_actual_hours)-Number(a.avg_actual_hours);
      if(sortBy==="rate") return Number(b.qty_per_hour)-Number(a.qty_per_hour);
      return 0;
    });
    return arr;
  },[stats,sortBy]);

  const withData=sorted.filter(s=>s.plan_count>0);
  const withoutData=sorted.filter(s=>s.plan_count===0);
  const totalCompletedCount=withData.reduce((a,s)=>a+s.plan_count,0);
  const totalHours=withData.reduce((a,s)=>a+Number(s.total_actual_hours),0);

  const runCleanup=async()=>{
    if(!confirm("365일 초과된 완료/취소 계획을 삭제합니다. 계속하시겠습니까?"))return;
    try{
      const removed=await rpc("aps_cleanup_old_plans",{p_admin_hash:adminHash,p_days:365});
      setCleanupMsg(`${removed}건 삭제됨`);
      load(range);
    }catch(e){alert("정리 실패: "+e.message)}
  };

  return <div>
    <div className="aps-toolbar">
      <div className="aps-filter">
        {RANGES.map(r=><button key={r} className={range===r?"on":""} onClick={()=>setRange(r)}>{RANGE_LABEL[r]}</button>)}
      </div>
      <div style={{flex:1}}></div>
      <div className="aps-view-toggle">
        <button className={sortBy==="count"?"on":""} onClick={()=>setSortBy("count")}>건수순</button>
        <button className={sortBy==="total"?"on":""} onClick={()=>setSortBy("total")}>총시간순</button>
        <button className={sortBy==="avg"?"on":""} onClick={()=>setSortBy("avg")}>평균순</button>
        <button className={sortBy==="rate"?"on":""} onClick={()=>setSortBy("rate")}>생산률순</button>
      </div>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={runCleanup}>🗑 365일 정리</button>
    </div>

    {cleanupMsg&&<div style={{padding:"10px 14px",marginBottom:14,background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:8,fontSize:12,color:"#f59e0b"}}>{cleanupMsg}</div>}

    {/* 요약 카드 */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10,marginBottom:14}}>
      <div style={{padding:"14px 16px",background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>완료 계획 ({RANGE_LABEL[range]})</div>
        <div style={{fontSize:22,fontWeight:700}}>{totalCompletedCount}<span style={{fontSize:12,color:"var(--muted)",fontWeight:400,marginLeft:4}}>건</span></div>
      </div>
      <div style={{padding:"14px 16px",background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>총 생산 시간</div>
        <div style={{fontSize:22,fontWeight:700}}>{fmtHours(totalHours)}</div>
      </div>
      <div style={{padding:"14px 16px",background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>실적 보유 품목</div>
        <div style={{fontSize:22,fontWeight:700}}>{withData.length}<span style={{fontSize:12,color:"var(--muted)",fontWeight:400,marginLeft:4}}>/ {stats.length}</span></div>
      </div>
    </div>

    {loading?<Loader/>:withData.length===0?
      <Empty emoji="📈" text={stats.length===0?"등록된 품목이 없습니다":`${RANGE_LABEL[range]} 동안 완료된 생산 실적이 없습니다`}/>:
      <div style={{overflow:"auto",border:"1px solid var(--div2)",borderRadius:8}}>
        <table className="aps-table">
          <thead><tr>
            <th>품목</th>
            <th className="center" style={{width:70}}>구분</th>
            <th className="right" style={{width:80}}>완료</th>
            <th className="right hide-mobile" style={{width:100}}>총 수량</th>
            <th className="right" style={{width:110}}>총 시간</th>
            <th className="right hide-mobile" style={{width:110}}>평균 시간</th>
            <th className="right hide-mobile" style={{width:130}}>계획↔실제</th>
            <th className="right" style={{width:120}}>시간당 생산</th>
            <th className="center hide-mobile" style={{width:110}}>최근 완료</th>
          </tr></thead>
          <tbody>
            {withData.map(s=>{
              const variance=Number(s.avg_actual_hours)-Number(s.avg_planned_hours);
              const variancePct=Number(s.avg_planned_hours)>0?(variance/Number(s.avg_planned_hours)*100):0;
              const vColor=variance>0.05?"#ef4444":variance<-0.05?"#22c55e":"var(--muted)";
              return <tr key={s.item_id}>
                <td>
                  <div style={{fontWeight:600}}>{s.item_name}</div>
                  <div style={{fontSize:11,color:"var(--muted)",fontFamily:"monospace"}}>{s.item_code}</div>
                </td>
                <td className="center"><Pill map={TYPE_PILL} k={s.item_type} label={TYPE_LABEL[s.item_type]}/></td>
                <td className="right" style={{fontWeight:600}}>{s.plan_count}건</td>
                <td className="right hide-mobile">{fmtNum(s.total_qty)} <span style={{fontSize:11,color:"var(--muted)"}}>{s.item_unit}</span></td>
                <td className="right" style={{fontWeight:600,color:"#22c55e"}}>{fmtHours(s.total_actual_hours)}</td>
                <td className="right hide-mobile">{fmtHours(s.avg_actual_hours)}</td>
                <td className="right hide-mobile" style={{fontSize:12,color:vColor}}>
                  <div>{fmtHours(s.avg_planned_hours)} → {fmtHours(s.avg_actual_hours)}</div>
                  {Math.abs(variancePct)>=1&&<div style={{fontSize:10,marginTop:2}}>{variance>=0?"+":""}{variancePct.toFixed(0)}%</div>}
                </td>
                <td className="right" style={{fontWeight:600,color:"#06b6d4"}}>{fmtNum(s.qty_per_hour)} <span style={{fontSize:11,color:"var(--muted)",fontWeight:400}}>{s.item_unit}/h</span></td>
                <td className="center hide-mobile" style={{fontSize:11,color:"var(--muted)"}}>{s.last_completed_at?fmtKstDateTime(s.last_completed_at):"-"}</td>
              </tr>;
            })}
            {withoutData.length>0&&<tr><td colSpan={9} style={{padding:"14px 12px",fontSize:11,color:"var(--dimmer)",background:"var(--card-bg)"}}>아직 실적 없음: {withoutData.map(s=>s.item_name).join(", ")}</td></tr>}
          </tbody>
        </table>
      </div>
    }
    <div style={{fontSize:11,color:"var(--dimmer)",marginTop:8,lineHeight:1.5}}>
      ※ 실제 시각은 "▶ 시작" / "✓ 완료" 버튼 클릭 순간에 자동 기록됩니다 (KST) · 365일 초과 완료/취소 계획은 매일 1회 자동 정리됩니다 · 계획↔실제 차이는 평균 시간 기준 {">5%"} 초과 시 색상 표시
    </div>
  </div>;
}

// App (탭 네비게이션 + 로그인 게이트)
// ═══════════════════════════════════════════
const VALID_TABS=["items","lines","plans","inventory","stats"];
function getTabFromHash(){
  const h=(window.location.hash||"").replace(/^#/,"");
  return VALID_TABS.includes(h)?h:"items";
}

function App(){
  const[theme,setTheme]=useState(getStoredTheme());
  const[adminHash,setAdminHash]=useState(sessionStorage.getItem("sp-admin-hash")||"");
  const[adminInfo,setAdminInfo]=useState(null);
  const[checking,setChecking]=useState(!!sessionStorage.getItem("sp-admin-hash"));
  const[tab,setTab]=useState(getTabFromHash());

  useEffect(()=>{applyTheme(theme)},[theme]);
  const toggleTheme=()=>{const t=theme==="dark"?"light":"dark";setTheme(t);setStoredTheme(t);applyTheme(t)};

  // URL 해시 ↔ tab 동기화
  useEffect(()=>{
    const newHash="#"+tab;
    if(window.location.hash!==newHash)history.replaceState(null,"",newHash);
  },[tab]);
  useEffect(()=>{
    const fn=()=>setTab(getTabFromHash());
    window.addEventListener("hashchange",fn);
    return()=>window.removeEventListener("hashchange",fn);
  },[]);

  // 세션 복원
  useEffect(()=>{
    if(!adminHash){setChecking(false);return}
    (async()=>{
      try{
        const data=await rpc("admin_login",{p_hash:adminHash});
        if(data){setAdminInfo(data)}
        else{sessionStorage.removeItem("sp-admin-hash");setAdminHash("")}
      }catch(e){sessionStorage.removeItem("sp-admin-hash");setAdminHash("")}
      setChecking(false);
    })();
  },[]);

  const handleLogin=(hash,info)=>{
    sessionStorage.setItem("sp-admin-hash",hash);
    setAdminHash(hash);setAdminInfo(info);
  };
  const handleLogout=()=>{
    sessionStorage.removeItem("sp-admin-hash");
    setAdminHash("");setAdminInfo(null);
  };

  const loggedIn=!!adminHash&&!!adminInfo;

  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <header className="aps-header">
      <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
        <a href="index.html" style={{fontSize:"14px",fontWeight:700,color:"var(--text)",textDecoration:"none"}}>← STOCKPULSE</a>
        <span style={{fontSize:"13px",color:"var(--muted)"}}>|</span>
        <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
          <span style={{fontSize:"18px"}}>🏭</span>
          <span style={{fontWeight:700,fontSize:"15px"}}>APS 생산계획</span>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
        {loggedIn&&<span style={{fontSize:"12px",color:"var(--muted)"}}>👤 {adminInfo.nickname}</span>}
        {loggedIn&&<button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={handleLogout}>로그아웃</button>}
        <button onClick={toggleTheme} style={{background:"none",border:"none",fontSize:"20px",cursor:"pointer"}}>{theme==="dark"?"☀️":"🌙"}</button>
      </div>
    </header>

    <div className="aps-shell" style={{flex:1}}>
      {checking?<Loader/>:!loggedIn?<LoginScreen onLogin={handleLogin}/>:<>
        <div className="aps-tabs">
          <button className={"aps-tab"+(tab==="items"?" active":"")} onClick={()=>setTab("items")}>📦 품목 / BOM</button>
          <button className={"aps-tab"+(tab==="lines"?" active":"")} onClick={()=>setTab("lines")}>🏭 라인</button>
          <button className={"aps-tab"+(tab==="plans"?" active":"")} onClick={()=>setTab("plans")}>📅 생산계획</button>
          <button className={"aps-tab"+(tab==="inventory"?" active":"")} onClick={()=>setTab("inventory")}>📊 재고</button>
          <button className={"aps-tab"+(tab==="stats"?" active":"")} onClick={()=>setTab("stats")}>📈 통계</button>
        </div>
        {tab==="items"&&<ItemsTab adminHash={adminHash}/>}
        {tab==="lines"&&<LinesTab adminHash={adminHash}/>}
        {tab==="plans"&&<PlansTab adminHash={adminHash}/>}
        {tab==="inventory"&&<InventoryTab adminHash={adminHash}/>}
        {tab==="stats"&&<StatsTab adminHash={adminHash}/>}
      </>}

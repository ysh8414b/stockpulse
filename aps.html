  {code:"F0000062",name:"쿠팡_돼지앞다리(제육용) 1kg*10",color:"w"},
  {code:"F0000082",name:"쿠팡_돼지목전지(만능) 2kg*5",color:"w"}
];
const COLOR_LABEL={y:"노랑",o:"주황",b:"파랑",g:"초록",p:"핑크",w:"흰색"};
const COLOR_PREVIEW={y:"#fff2b3",o:"#fcd5b4",b:"#dbe5f1",g:"#d8e4bc",p:"#f2dcdb",w:"#ffffff"};
const TEMPLATE_KEY="aps-inv-template";
const INVENTORY_DATA_KEY="aps-inv-data";  // 업로드한 재고 데이터 자동 저장 (생산계획 탭에서 공유)

function loadStoredInventory(){
  try{
    const raw=localStorage.getItem(INVENTORY_DATA_KEY);
    if(!raw)return null;
    const obj=JSON.parse(raw);
    if(!obj||typeof obj!=="object")return null;
    return {
      products:Array.isArray(obj.products)?obj.products:[],
      raws:Array.isArray(obj.raws)?obj.raws:[],
      prodName:obj.prodName||"",
      rawName:obj.rawName||"",
      dateLabel:obj.dateLabel||"",
      title:obj.title||"",
      savedAt:obj.savedAt||""
    };
  }catch(e){return null}
}
function saveStoredInventory(patch){
  try{
    const prev=loadStoredInventory()||{products:[],raws:[],prodName:"",rawName:"",dateLabel:"",title:"",savedAt:""};
    const next={...prev,...patch,savedAt:patch&&patch.savedAt?patch.savedAt:new Date().toISOString()};
    localStorage.setItem(INVENTORY_DATA_KEY,JSON.stringify(next));
    // 같은 탭 내 다른 컴포넌트에 알림 (storage 이벤트는 다른 탭에서만 발생)
    try{window.dispatchEvent(new CustomEvent("aps-inv-data-change"));}catch(e){}
  }catch(e){}
}

// ───── Supabase 원격 동기화 (2026-06-21) ─────
// PC에서 업로드한 재고 시트를 모바일에서도 보기 위해 Supabase 싱글톤 테이블에 저장
function _normalizeRemoteInv(r){
  if(!r||typeof r!=="object")return null;
  return {
    products:Array.isArray(r.products)?r.products:[],
    raws:Array.isArray(r.raws)?r.raws:[],
    prodName:r.prodName||"",
    rawName:r.rawName||"",
    dateLabel:r.dateLabel||"",
    title:r.title||"",
    savedAt:r.updated_at||r.savedAt||""
  };
}
// savedAt 문자열을 ms timestamp로 정규화 (timezone format 차이 흡수)
//  - 클라이언트 toISOString()  : "2026-06-29T05:30:00.000Z"
//  - Postgres timestamptz      : "2026-06-29T14:30:05.123456+00:00"
//  두 형식은 문자열 비교 시 부정확 → 항상 Date 기반 비교
function _toTs(s){if(!s)return 0;const t=new Date(s).getTime();return isNaN(t)?0:t}
function _invRemoteIsNewer(local,remote){
  const l=_toTs(local?.savedAt);
  const r=_toTs(remote?.savedAt);
  return r>l;
}
async function loadRemoteInventory(adminHash){
  if(!adminHash){console.warn("[aps-inv-sync] load skipped: no adminHash");return null}
  try{
    const r=await rpc("aps_get_inventory_sheet",{p_admin_hash:adminHash});
    return _normalizeRemoteInv(r);
  }catch(e){console.warn("[aps-inv-sync] load failed:",e?.message||e);return null}
}
async function saveRemoteInventory(adminHash,patch){
  if(!adminHash){console.warn("[aps-inv-sync] save skipped: no adminHash");return null}
  try{
    const cur=loadStoredInventory()||{products:[],raws:[],prodName:"",rawName:"",dateLabel:"",title:""};
    const merged={...cur,...(patch||{})};
    const payload={
      products:merged.products||[],
      raws:merged.raws||[],
      prodName:merged.prodName||"",
      rawName:merged.rawName||"",
      dateLabel:merged.dateLabel||"",
      title:merged.title||""
    };
    const updatedAt=await rpc("aps_save_inventory_sheet",{p_admin_hash:adminHash,p_payload:payload});
    // 서버 timestamp 를 로컬 캐시에도 반영 → 다음 비교 시 일관성 유지
    if(typeof updatedAt==="string"&&updatedAt)saveStoredInventory({savedAt:updatedAt});
    return updatedAt||null;
  }catch(e){console.warn("[aps-inv-sync] save failed:",e?.message||e);return null}
}
async function clearRemoteInventory(adminHash){
  if(!adminHash){console.warn("[aps-inv-sync] clear skipped: no adminHash");return}
  try{await rpc("aps_clear_inventory_sheet",{p_admin_hash:adminHash})}
  catch(e){console.warn("[aps-inv-sync] clear failed:",e?.message||e)}
}
// 원격에서 가져온 데이터로 로컬 캐시 교체 + 이벤트 발행
function applyRemoteInventoryToLocal(remote){
  if(!remote)return;
  try{
    localStorage.setItem(INVENTORY_DATA_KEY,JSON.stringify(remote));
    window.dispatchEvent(new CustomEvent("aps-inv-data-change"));
  }catch(e){}
}

function templateToText(tpl){
  return tpl.map(t=>`${t.code} | ${t.name||""} | ${t.color||"w"}`).join("\n");
}
function parseTemplateText(text){
  const out=[];
  for(const line of (text||"").split("\n")){
    const trimmed=line.trim();
    if(!trimmed||trimmed.startsWith("#"))continue;
    const parts=trimmed.split("|").map(s=>s.trim());
    const code=parts[0];
    if(!code)continue;
    const name=parts[1]||"";
    let color=(parts[2]||"w").toLowerCase();
    if(!COLOR_LABEL[color])color="w";
    out.push({code,name,color});
  }
  return out;
}

function InventorySheetTab({adminHash}){
  const stored=loadStoredInventory();
  const[products,setProducts]=useState(stored?.products||[]);
  const[raws,setRaws]=useState(stored?.raws||[]);
  const[prodName,setProdName]=useState(stored?.prodName||"");
  const[rawName,setRawName]=useState(stored?.rawName||"");
  const[title,setTitle]=useState(stored?.title||"4층 제품 & 원육 재고");
  const[dateLabel,setDateLabel]=useState(todayKoreanLabel());
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState("");
  const[syncStatus,setSyncStatus]=useState(""); // "syncing" | "synced" | "error" | ""

  // 마운트 시 원격에서 최신 재고 시트 fetch → 로컬보다 새로우면 교체
  useEffect(()=>{
    if(!adminHash)return;
    let cancelled=false;
    (async()=>{
      setSyncStatus("syncing");
      const remote=await loadRemoteInventory(adminHash);
      if(cancelled)return;
      const localTs=_toTs(stored?.savedAt);
      const remoteTs=_toTs(remote?.savedAt);
      const action=!remote
        ?(stored&&(stored.products?.length||stored.raws?.length)?"push-local":"empty")
        :(remoteTs>localTs?"apply-remote":(localTs>remoteTs?"push-local":"same"));
      console.info("[aps-inv-sync] InventorySheetTab mount:",{localSaved:stored?.savedAt||"",remoteSaved:remote?.savedAt||"",action});
      if(remote){
        // 원격이 더 새롭거나 로컬이 없으면 원격으로 교체
        if(remoteTs>localTs){
          setProducts(remote.products);
          setRaws(remote.raws);
          setProdName(remote.prodName);
          setRawName(remote.rawName);
          if(remote.title)setTitle(remote.title);
          applyRemoteInventoryToLocal(remote);
        }else if(localTs>remoteTs){
          // 로컬이 더 새로우면 원격에 push (오프라인 업로드 후 첫 접속 시 등)
          await saveRemoteInventory(adminHash,stored);
        }
        setSyncStatus("synced");
      }else{
        // 원격이 비어있는데 로컬에 데이터 있으면 push
        if(stored&&(stored.products?.length||stored.raws?.length)){
          const ok=await saveRemoteInventory(adminHash,stored);
          setSyncStatus(ok?"synced":"error");
        }else{
          setSyncStatus("synced");
        }
      }
    })();
    return()=>{cancelled=true};
  },[adminHash]);
  const[template,setTemplate]=useState(()=>{
    try{
      const stored=localStorage.getItem(TEMPLATE_KEY);
      if(stored){const parsed=JSON.parse(stored);if(Array.isArray(parsed)&&parsed.length)return parsed}
    }catch(e){}
    return DEFAULT_PRODUCT_TEMPLATE;
  });
  const[editing,setEditing]=useState(false);
  const[editText,setEditText]=useState("");
  const sheetRef=useRef(null);

  useEffect(()=>{
    try{localStorage.setItem(TEMPLATE_KEY,JSON.stringify(template))}catch(e){}
  },[template]);

  async function handleFile(e,kind){
    const f=e.target.files&&e.target.files[0];
    e.target.value=""; // 같은 파일 재업로드 허용
    if(!f)return;
    setErr("");setBusy(true);
    try{
      if(typeof XLSX==="undefined")throw new Error("XLSX 라이브러리 로드 실패 — 새로고침 후 다시 시도하세요");
      const buf=await f.arrayBuffer();
      const items=parseInventoryWorkbook(buf);
      let patch;
      if(kind==="product"){setProducts(items);setProdName(f.name);patch={products:items,prodName:f.name,title,dateLabel}}
      else{setRaws(items);setRawName(f.name);patch={raws:items,rawName:f.name,title,dateLabel}}
      saveStoredInventory(patch);
      // 원격 동기화 (비동기 fire-and-forget 아닌 대기 — 실패 시 사용자에게 알려줌)
      if(adminHash){
        setSyncStatus("syncing");
        const ok=await saveRemoteInventory(adminHash,patch);
        setSyncStatus(ok?"synced":"error");
      }
    }catch(ex){
      setErr((kind==="product"?"제품":"원육")+" 파일 처리 오류: "+(ex.message||ex));
    }finally{setBusy(false)}
  }

  async function downloadImage(){
    if(!sheetRef.current)return;
    setBusy(true);setErr("");
    try{
      const canvas=await html2canvas(sheetRef.current,{scale:2,backgroundColor:"#ffffff",useCORS:true});
      const safeDate=dateLabel.replace(/[\/\\?%*:|"<>()]/g,"_").replace(/\s+/g,"_");

      a.download=`재고시트_${safeDate}.png`;
      a.href=canvas.toDataURL("image/png");
      document.body.appendChild(a);a.click();document.body.removeChild(a);

    if(products.length===0&&raws.length===0)return;
    saveStoredInventory({title,dateLabel});
    if(!adminHash)return;
    const t=setTimeout(()=>{
      saveRemoteInventory(adminHash,{title,dateLabel});
    },600);
    return()=>clearTimeout(t);
  },[title,dateLabel,adminHash,products.length,raws.length]);

  function openEdit(){setEditText(templateToText(template));setEditing(true)}
  function saveTemplate(){
    const parsed=parseTemplateText(editText);
    if(parsed.length===0){
      if(!confirm("목록이 비어 있습니다. 비운 채로 저장하시겠습니까? (제품 표가 빈 칸으로 표시됩니다)"))return;

  function resetTemplate(){
    if(!confirm("기본 마스터 목록(사진 기준 37개)으로 되돌릴까요?"))return;
    setEditText(templateToText(DEFAULT_PRODUCT_TEMPLATE));
  }

  const productMap=useMemo(()=>{
    const m={};for(const p of products)m[p.code]=p;return m;
  },[products]);
  const rows=template.map(t=>{
    const p=productMap[t.code];
    return {code:t.code,name:t.name||(p?p.name:""),color:t.color||"w",box:p?Math.round(p.box):0,hasData:!!p};
  });
  const extras=products.filter(p=>!template.some(t=>t.code===p.code));

  const useTemplate=template.length>0;
  const hasAny=products.length>0||raws.length>0||useTemplate;
  const totalProdBox=products.reduce((s,p)=>s+(p.box||0),0);

  return <div>
    <div className="inv-upload-grid">
      <label className={"inv-upload-card"+(products.length?" has":"")} style={{cursor:"pointer",display:"block"}}>

        <div style={{fontSize:12,color:"var(--muted)"}}>📁 클릭해서 파일 선택</div>
        {prodName&&<div className="filename">{prodName}</div>}
        {products.length>0&&<div className="count">✓ {products.length}개 품목 · 총 {Math.round(totalProdBox).toLocaleString()} box</div>}
      </label>
      <label className={"inv-upload-card"+(raws.length?" has":"")} style={{cursor:"pointer",display:"block"}}>
        <h4>🥩 원육 파일</h4>
        <div className="hint">숫자 prefix 코드(1xxxx·3xxxx 등) 원육 재고 엑셀</div>
        <input type="file" accept=".xlsx,.xls" onChange={e=>handleFile(e,"material")} style={{display:"none"}}/>
        <div style={{fontSize:12,color:"var(--muted)"}}>📁 클릭해서 파일 선택</div>
        {rawName&&<div className="filename">{rawName}</div>}

    </div>

    <div className="aps-toolbar" style={{marginBottom:14}}>

        <textarea className="inv-edit-textarea" value={editText} onChange={e=>setEditText(e.target.value)} spellCheck={false}/>
        <div style={{display:"flex",justifyContent:"space-between",gap:8,marginTop:12}}>
          <button className="aps-btn aps-btn-secondary" onClick={resetTemplate}>🔄 사진 기준으로 복원</button>
          <div style={{display:"flex",gap:8}}>
            <button className="aps-btn aps-btn-secondary" onClick={()=>setEditing(false)}>취소</button>
            <button className="aps-btn aps-btn-primary" onClick={saveTemplate}>저장</button>
          </div>
        </div>
      </div>
    </div>}
  </div>;
}

// ═══════════════════════════════════════════
// 💰 매출 탭 — 매출일보(.xlsx) 업로드 + 주평균 안전재고
// ─ Excel 컬럼: A=매출일자, D=상품코드, E=상품명, H=수량(Box)
// ─ Supabase aps_sales_daily (1년 보유) 에 누적
// ─ 재고시트 제품코드와 매칭하여 주평균 안전재고/현재재고 비교
// ═══════════════════════════════════════════

// Excel 날짜 다양한 형태 → "YYYY-MM-DD" 정규화
function normalizeSalesDate(v){
  if(v==null||v==="")return null;
  // SheetJS cellDates:true → Date 객체
  if(v instanceof Date && !isNaN(v)){
    const y=v.getFullYear(), m=String(v.getMonth()+1).padStart(2,"0"), d=String(v.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }
  if(typeof v==="number"){
    // Excel serial date
    const d=new Date(Math.round((v-25569)*86400*1000));
    if(isNaN(d))return null;
    const y=d.getUTCFullYear(), mm=String(d.getUTCMonth()+1).padStart(2,"0"), dd=String(d.getUTCDate()).padStart(2,"0");
    return `${y}-${mm}-${dd}`;
  }
  const s=String(v).trim();
  // YYYY/MM/DD or YYYY-MM-DD or YYYY.MM.DD
  const m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m){
    const y=m[1], mm=m[2].padStart(2,"0"), dd=m[3].padStart(2,"0");
    return `${y}-${mm}-${dd}`;
  }
  return null;
}

// 매출일보 워크북 → {rows:[{date,code,name,qty}], headerRow, totalRows}
// A/D/E/H 컬럼만 추출, 합계행/머리글행 자동 스킵
function parseSalesWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  if(!ws)throw new Error("시트를 찾을 수 없습니다");
  const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const grouped={}; // key = `${date}|${code}` → {date,code,name,qty}
  let scanned=0, picked=0;
  for(let i=0;i<arr.length;i++){
    const r=arr[i]||[];
    const dateRaw=r[0];      // A
    const code=r[3];          // D
    const name=r[4];          // E
    const qtyRaw=r[7];        // H
    if(dateRaw==null||code==null||code==="")continue;
    const date=normalizeSalesDate(dateRaw);
    if(!date)continue;
    const codeStr=String(code).trim();
    if(!codeStr||/^[가-힣\s]+$/.test(codeStr))continue; // "합 계" 같은 한글-only 셀 제외
    const qty=Number(qtyRaw);
    if(isNaN(qty))continue;
    scanned++;
    const key=`${date}|${codeStr}`;
    if(!grouped[key]){
      grouped[key]={date,code:codeStr,name:String(name||"").trim(),qty:0};
      picked++;
    }
    grouped[key].qty+=qty;
  }
  return {rows:Object.values(grouped), scanned, picked};
}

const SALES_RANGE_OPTIONS=[
  {key:7,   label:"7일"},
  {key:14,  label:"14일"},
  {key:30,  label:"30일 (한달)"},
  {key:60,  label:"60일"},
  {key:90,  label:"90일"},
  {key:180, label:"180일"},
  {key:365, label:"1년"}
];

function fmtSalesNum(n,digits){
  if(n==null||isNaN(n))return "-";
  const d=digits==null?0:digits;
  return Number(n).toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
}

function SalesTab({adminHash}){
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState("");
  const[ok,setOk]=useState("");
  const[meta,setMeta]=useState(null);     // {total_rows, distinct_codes, min_date, max_date}
  const[stats,setStats]=useState([]);     // [{code,name,total_qty,avg_daily,avg_weekly,avg_monthly,...}]
  const[range,setRange]=useState(30);     // days
  const[query,setQuery]=useState("");
  const[matchedOnly,setMatchedOnly]=useState(false); // 재고시트 매칭만
  const[sortKey,setSortKey]=useState("avg");         // avg | code | shortage | stock
  const[inv,setInv]=useState(()=>loadStoredInventory());

  // 재고시트(localStorage) 변경 구독
  useEffect(()=>{
    const reload=()=>setInv(loadStoredInventory());
    const onStorage=(e)=>{if(!e.key||e.key===INVENTORY_DATA_KEY)reload()};
    window.addEventListener("storage",onStorage);
    window.addEventListener("aps-inv-data-change",reload);
    return()=>{
      window.removeEventListener("storage",onStorage);
      window.removeEventListener("aps-inv-data-change",reload);
    };
  },[]);

  // 재고시트 원격 fetch (다른 기기에서 업로드한 데이터)
  useEffect(()=>{
    if(!adminHash)return;
    let cancelled=false;
    (async()=>{
      const remote=await loadRemoteInventory(adminHash);
      if(cancelled||!remote)return;
      const local=loadStoredInventory();
      if(!local||!local.savedAt||(remote.savedAt && remote.savedAt>local.savedAt)){
        applyRemoteInventoryToLocal(remote);
        setInv(loadStoredInventory());
      }
    })();
    return()=>{cancelled=true};
  },[adminHash]);

  async function loadAll(){
    if(!adminHash)return;
    setBusy(true);setErr("");
    try{
      const [m, s] = await Promise.all([
        rpc("aps_get_sales_meta",{p_admin_hash:adminHash}),
        rpc("aps_get_sales_stats",{p_admin_hash:adminHash,p_days:range}),
      ]);
      setMeta(m||null);
      setStats(Array.isArray(s)?s:[]);
    }catch(e){setErr("로딩 실패: "+(e.message||e))}
    finally{setBusy(false)}
  }

  useEffect(()=>{loadAll()},[adminHash,range]);

  async function handleFile(e){
    const f=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!f)return;
    setErr("");setOk("");setBusy(true);
    try{
      if(typeof XLSX==="undefined")throw new Error("XLSX 라이브러리 로드 실패 — 새로고침 후 재시도");
      const buf=await f.arrayBuffer();
      const parsed=parseSalesWorkbook(buf);
      if(!parsed.rows.length)throw new Error("유효한 매출 데이터가 없습니다 (A=일자, D=코드, H=수량 컬럼 확인)");
      // 500행씩 배치 업로드
      const BATCH=500;
      let inserted=0, minD=null, maxD=null;
      for(let i=0;i<parsed.rows.length;i+=BATCH){
        const chunk=parsed.rows.slice(i,i+BATCH);
        const res=await rpc("aps_upsert_sales_batch",{p_admin_hash:adminHash,p_rows:chunk});
        inserted+=(res?.inserted||0);
        if(res?.min_date && (!minD||res.min_date<minD))minD=res.min_date;
        if(res?.max_date && (!maxD||res.max_date>maxD))maxD=res.max_date;
      }
      // 업로드 직후 매출 평균 → 안전재고 자동 동기화 (선택 기간 기준)
      let syncMsg="";
      try{
        const syncRes=await rpc("aps_sync_safety_from_sales",{p_admin_hash:adminHash,p_days:range});
        const u=syncRes?.updated||0, m=syncRes?.matched||0;
        if(m>0)syncMsg=` · 안전재고 ${u}/${m}건 자동 갱신`;
      }catch(syncErr){syncMsg=` · ⚠ 안전재고 동기화 실패(${syncErr.message||syncErr})`}
      setOk(`✓ ${parsed.rows.length}건 업로드 (${minD||"?"} ~ ${maxD||"?"})${syncMsg}`);
      await loadAll();
    }catch(ex){setErr("업로드 실패: "+(ex.message||ex))}
    finally{setBusy(false)}
  }

  async function handleSyncSafety(){
    if(!confirm(`매출 데이터가 있는 모든 품목의 안전재고를 주평균값(가장 최근 4 ISO 주 평균)으로 갱신합니다.\n\n사용자가 수동 설정한 안전재고 값은 덮어써집니다. 계속하시겠어요?`))return;
    setBusy(true);setErr("");setOk("");
    try{
      const res=await rpc("aps_sync_safety_from_sales",{p_admin_hash:adminHash,p_days:range});
      setOk(`✓ 안전재고 ${res?.updated||0}건 갱신 (매칭 ${res?.matched||0}건)`);
    }catch(e){setErr("동기화 실패: "+(e.message||e))}
    finally{setBusy(false)}
  }

  async function handleCleanup(){
    if(!confirm("365일 초과 데이터를 삭제합니다. 계속하시겠어요?"))return;
    setBusy(true);setErr("");setOk("");
    try{
      const res=await rpc("aps_cleanup_sales",{p_admin_hash:adminHash,p_days:365});
      setOk(`✓ ${res?.deleted||0}건 정리`);
      await loadAll();
    }catch(e){setErr("정리 실패: "+(e.message||e))}
    finally{setBusy(false)}
  }

  async function handleClearAll(){
    if(!confirm("⚠ 모든 매출 데이터를 삭제합니다. 정말로 초기화할까요?"))return;
    if(!confirm("⚠⚠ 이 작업은 되돌릴 수 없습니다. 한 번 더 확인합니다."))return;
    setBusy(true);setErr("");setOk("");
    try{
      const res=await rpc("aps_clear_sales",{p_admin_hash:adminHash});
      setOk(`✓ 전체 ${res?.deleted||0}건 삭제`);
      await loadAll();
    }catch(e){setErr("삭제 실패: "+(e.message||e))}
    finally{setBusy(false)}
  }

  // 재고시트 코드 → product 매핑 (current stock + 정식 한글명)
  const invMap=useMemo(()=>{
    const m={};
    (inv?.products||[]).forEach(p=>{m[p.code]=p});
    return m;
  },[inv]);

  // 표시용 데이터 가공
  const merged=useMemo(()=>{
    const q=query.trim().toLowerCase();
    const list=stats.map(s=>{
      const p=invMap[s.code];
      const displayName=(p && p.name) ? p.name : (s.name || "");
      const currentStock = p ? Number(p.box||0) : null;
      // 주평균 산출 — 최근 4 ISO 주(월~일) 단순 평균
      //  · 새 RPC: recent_week_count 반환 → server avg_weekly 그대로 신뢰
      //  · 옛 RPC: 폴백 — week_count 있으면 전체 평균, 없으면 first/last 범위 추정
      let avgWeekly;
      if (s.recent_week_count != null) {
        avgWeekly = Number(s.avg_weekly || 0);
      } else if (s.week_count != null && Number(s.week_count) > 0) {
        avgWeekly = Number(s.avg_weekly || 0);
      } else if (s.first_date && s.last_date && s.total_qty != null) {
        const spanDays = Math.max(1, Math.round((new Date(s.last_date) - new Date(s.first_date))/86400000) + 1);
        const weeks = Math.max(1, Math.ceil(spanDays / 7));
        avgWeekly = Number(s.total_qty) / weeks;
      } else {
        avgWeekly = Number(s.avg_weekly) || Number(s.avg_daily||0)*7;
      }
      const shortage = (currentStock!=null) ? (avgWeekly - currentStock) : null;
      const inInv = !!p;
      return {...s, avg_weekly: avgWeekly, displayName, currentStock, shortage, inInv};
    });
    let filtered=list;
    if(matchedOnly)filtered=filtered.filter(x=>x.inInv);
    if(q)filtered=filtered.filter(x=>
      (x.code||"").toLowerCase().includes(q)||
      (x.displayName||"").toLowerCase().includes(q)
    );
    filtered.sort((a,b)=>{
      if(sortKey==="code")return (a.code||"").localeCompare(b.code||"");
      if(sortKey==="stock")return (b.currentStock??-1)-(a.currentStock??-1);
      if(sortKey==="shortage"){
        const sa=a.shortage??-Infinity, sb=b.shortage??-Infinity;
        return sb-sa;
      }
      return (b.avg_weekly||0)-(a.avg_weekly||0);
    });
    return filtered;
  },[stats,invMap,matchedOnly,query,sortKey]);

  const summaryCounts=useMemo(()=>{
    let matched=0, shortageCount=0;
    merged.forEach(x=>{
      if(x.inInv)matched++;
      if(x.shortage!=null && x.shortage>0)shortageCount++;
    });
    return {matched, shortageCount, total:merged.length};
  },[merged]);

  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:10}}>
      <div>
        <div style={{fontSize:18,fontWeight:700}}>💰 매출일보 분석</div>
        <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>
          매출.xlsx 업로드 → 1년 누적 → <b>최근 4주 평균</b>을 안전재고로 자동 계산 (재고시트 연동)
        </div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <label className="aps-btn aps-btn-primary" style={{cursor:"pointer"}}>
          📂 매출 Excel 업로드
          <input type="file" accept=".xlsx,.xls" onChange={handleFile} style={{display:"none"}} disabled={busy}/>
        </label>
        <button className="aps-btn aps-btn-secondary" onClick={loadAll} disabled={busy}>새로고침</button>
      </div>
    </div>

    {/* 상태 메시지 */}
    {err&&<div style={{padding:"10px 14px",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:6,color:"#ef4444",fontSize:13,marginBottom:10}}>{err}</div>}
    {ok&&<div style={{padding:"10px 14px",background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:6,color:"#22c55e",fontSize:13,marginBottom:10}}>{ok}</div>}

    {/* DB 메타 카드 */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10,marginBottom:14}}>
      <div style={{padding:14,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>저장된 매출 행</div>
        <div style={{fontSize:22,fontWeight:800,marginTop:4}}>{fmtSalesNum(meta?.total_rows)}</div>
      </div>
      <div style={{padding:14,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>등록 상품 수</div>
        <div style={{fontSize:22,fontWeight:800,marginTop:4}}>{fmtSalesNum(meta?.distinct_codes)}</div>
      </div>
      <div style={{padding:14,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>보유 기간</div>
        <div style={{fontSize:14,fontWeight:700,marginTop:6}}>
          {meta?.min_date?`${meta.min_date} ~ ${meta.max_date}`:"-"}
        </div>
      </div>
      <div style={{padding:14,background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:8}}>
        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>재고시트 매칭</div>
        <div style={{fontSize:22,fontWeight:800,marginTop:4,color:"#06b6d4"}}>{summaryCounts.matched}<span style={{fontSize:12,color:"var(--muted)",marginLeft:6,fontWeight:600}}>/ {summaryCounts.total}</span></div>
      </div>
    </div>

    {/* 필터 / 정렬 툴바 */}
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:10}}>
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <span style={{fontSize:12,color:"var(--muted)",fontWeight:600,marginRight:4}}>기간</span>
        {SALES_RANGE_OPTIONS.map(o=>
          <button key={o.key}
            className={"aps-btn aps-btn-sm "+(range===o.key?"aps-btn-primary":"aps-btn-secondary")}
            onClick={()=>setRange(o.key)} disabled={busy}>{o.label}</button>
        )}
      </div>
      <div style={{flex:1,minWidth:160,maxWidth:280}}>
        <input className="aps-input" placeholder="🔎 코드 또는 상품명" value={query} onChange={e=>setQuery(e.target.value)}/>
      </div>
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <span style={{fontSize:12,color:"var(--muted)",fontWeight:600,marginRight:4}}>정렬</span>
        <select className="aps-input" value={sortKey} onChange={e=>setSortKey(e.target.value)} style={{width:140}}>
          <option value="avg">주평균 ↓</option>
          <option value="shortage">부족량 ↓</option>
          <option value="stock">현재재고 ↓</option>
          <option value="code">코드순</option>
        </select>
      </div>
      <label style={{display:"flex",gap:6,alignItems:"center",fontSize:13,cursor:"pointer",color:"var(--text)"}}>
        <input type="checkbox" checked={matchedOnly} onChange={e=>setMatchedOnly(e.target.checked)}/>
        재고시트 매칭만
      </label>
      <div style={{flex:1}}/>
      <button className="aps-btn aps-btn-sm" style={{background:"rgba(6,182,212,0.15)",color:"#06b6d4",border:"1px solid rgba(6,182,212,0.4)",fontWeight:700}} onClick={handleSyncSafety} disabled={busy} title="가장 최근 4 ISO 주(월~일)의 평균을 품목 마스터의 안전재고로 일괄 갱신 — 시즌·추세 변동 빠르게 반영">💰 안전재고 동기화</button>
      <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={handleCleanup} disabled={busy}>🗑 365일 정리</button>
      <button className="aps-btn aps-btn-sm" style={{background:"rgba(239,68,68,0.15)",color:"#ef4444",border:"1px solid rgba(239,68,68,0.3)"}} onClick={handleClearAll} disabled={busy}>⚠ 전체 초기화</button>
    </div>

    {/* 메인 테이블 */}
    {merged.length===0 ? <Empty emoji="💰" text={meta?.total_rows ? "조회 결과가 없습니다 (기간/필터 확인)" : "매출 데이터가 없습니다. 우측 상단에서 매출.xlsx 를 업로드하세요."}/> :
      <div style={{overflow:"auto"}}>
        <table className="aps-table">
          <thead><tr>
            <th style={{width:46}} className="center">#</th>
            <th style={{width:110}}>상품코드</th>
            <th>상품명</th>
            <th className="right hide-mobile" style={{width:90}}>{range}일 판매</th>
            <th className="right hide-mobile" style={{width:90}}>일평균</th>
            <th className="right" style={{width:130}}>주평균<br/><span style={{fontSize:10,fontWeight:500,color:"var(--muted)"}}>(최근 4주 · 안전재고 추천)</span></th>
            <th className="right" style={{width:100}}>현재재고<br/><span style={{fontSize:10,fontWeight:500,color:"var(--muted)"}}>(재고시트)</span></th>
            <th className="center" style={{width:90}}>상태</th>
          </tr></thead>
          <tbody>
            {merged.map((x,i)=>{
              const hasStock = x.currentStock != null;
              const avg = Number(x.avg_weekly||0);
              let statusEl;
              if(!hasStock){
                statusEl=<span style={{fontSize:11,color:"var(--muted)"}}>—</span>;
              }else if(avg<=0){
                statusEl=<span style={{fontSize:11,color:"var(--muted)"}}>판매없음</span>;
              }else if(x.currentStock<=0){
                statusEl=<span style={{fontSize:11,fontWeight:700,color:"#ef4444",background:"rgba(239,68,68,0.12)",padding:"3px 7px",borderRadius:4}}>품절</span>;
              }else if(x.currentStock<avg){
                statusEl=<span style={{fontSize:11,fontWeight:700,color:"#f59e0b",background:"rgba(245,158,11,0.12)",padding:"3px 7px",borderRadius:4}}>부족 {fmtSalesNum(Math.round(avg-x.currentStock))}</span>;
              }else{
                statusEl=<span style={{fontSize:11,fontWeight:700,color:"#22c55e",background:"rgba(34,197,94,0.12)",padding:"3px 7px",borderRadius:4}}>정상</span>;
              }
              return <tr key={x.code}>
                <td className="center" style={{color:"var(--muted)",fontSize:11}}>{i+1}</td>
                <td style={{fontFamily:"monospace",fontSize:12}}>{x.code}</td>
                <td>
                  <div style={{fontWeight:600}}>{x.displayName||<span style={{color:"var(--muted)"}}>(이름 없음)</span>}</div>
                  {x.inInv && <span style={{fontSize:10,color:"#06b6d4",fontWeight:600}}>📋 재고시트</span>}
                </td>
                <td className="right hide-mobile" style={{fontSize:12}}>{fmtSalesNum(Math.round(x.total_qty))}</td>
                <td className="right hide-mobile" style={{fontSize:12,color:"var(--muted)"}}>{fmtSalesNum(Math.round(x.avg_daily))}</td>
                <td className="right" style={{fontWeight:700,fontSize:13,color:"#06b6d4"}}>{fmtSalesNum(Math.round(avg))}</td>
                <td className="right" style={{fontSize:12}}>{hasStock?fmtSalesNum(Math.round(x.currentStock)):<span style={{color:"var(--muted)"}}>—</span>}</td>
                <td className="center">{statusEl}</td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    }

    <div style={{marginTop:14,padding:"10px 14px",background:"var(--card-bg)",borderRadius:6,fontSize:11,color:"var(--muted)",lineHeight:1.6}}>
      <div><strong>💡 사용법</strong></div>
      <div>1. 매출.xlsx 업로드 → A(매출일자) / D(상품코드) / E(상품명) / H(수량Box) 컬럼 자동 인식</div>
      <div>2. 같은 (날짜+상품)이 여러 행이면 자동 합산. 같은 날짜 재업로드 시 덮어쓰기 (idempotent)</div>
      <div>3. <b>주평균</b> = <b>가장 최근 4 ISO 주(월~일)의 단순 평균</b> = 한 주에 평균 몇 박스 나갔는지 (권장 안전재고)</div>
      <div style={{paddingLeft:14,color:"var(--muted)"}}>· 기간 필터(7/14/30...)는 합계·일수 표시용. 평균은 항상 <b>최근 4주 고정</b> — 시즌·추세 변동을 빠르게 반영</div>
      <div style={{paddingLeft:14,color:"var(--muted)"}}>· 예: 최근 4주 [100, 120, 110, 130] → 주평균 (100+120+110+130)/4 = 115</div>
      <div style={{paddingLeft:14,color:"var(--muted)"}}>· 데이터가 4주 미만이면 있는 만큼만 평균 (예: 2주만 있으면 2주 평균)</div>
      <div style={{paddingLeft:14,color:"var(--muted)"}}>· 한 주 안에 휴무·결근으로 일부 날짜만 있어도 그 주는 한 주로 카운트</div>
      <div>4. <b>현재재고</b>는 📋 재고 시트 탭에서 업로드한 박스 수와 자동 연동</div>
      <div>5. 매출 업로드 시 <b>📦 품목/BOM 탭의 안전재고</b>도 최근 4주 평균값으로 자동 갱신 (수동 트리거: 💰 안전재고 동기화 버튼)</div>
      <div>6. 1년 초과 데이터는 🗑 365일 정리 버튼으로 일괄 삭제</div>
    </div>
  </div>;
}

// ═══════════════════════════════════════════
// 인원 관리 탭 (Staff)
// ─ 직원 마스터 + 일일 가용 그리드 + PNG 저장
// ═══════════════════════════════════════════
const STAFF_TITLE_KEY="aps-staff-title";
function loadStaffTitle(){
  try{return localStorage.getItem(STAFF_TITLE_KEY)||"생산 가용 인원 및 생산 계획"}catch(e){return"생산 가용 인원 및 생산 계획"}
}
function saveStaffTitle(v){
  try{localStorage.setItem(STAFF_TITLE_KEY,v||"")}catch(e){}
}

function StaffForm({adminHash,initial,deptOptions,onSaved,onCancel}){
  const isEdit=!!initial;
  const[department,setDepartment]=useState(initial?.department||"");
  const[name,setName]=useState(initial?.name||"");
  const[role,setRole]=useState(initial?.role||"");
  const[memo,setMemo]=useState(initial?.memo||"");
  const[active,setActive]=useState(initial?initial.active!==false:true);
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!name.trim()){setErr("이름을 입력하세요");return}
    setLoading(true);setErr("");
    try{
      await rpc("aps_upsert_staff",{
        p_admin_hash:adminHash,
        p_id:isEdit?initial.id:null,
        p_department:department.trim(),
        p_name:name.trim(),
        p_role:role.trim(),
        p_memo:memo.trim(),
        p_active:active
      });
      onSaved();
    }catch(e){
      setErr(errMsg(e,{name_required:"이름은 필수입니다",unauthorized:"인증 실패"}));
    }
    setLoading(false);
  };

  return <div className="aps-modal-bg" onClick={onCancel}>
    <div className="aps-modal" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"14px"}}>{isEdit?"👥 직원 수정":"👥 직원 추가"}</div>
      <div className="aps-form-grid">
        <div>
          <div className="aps-form-label">부서</div>
          <input className="aps-input" list="staff-dept-list" value={department} onChange={e=>setDepartment(e.target.value)} maxLength={30} placeholder="예: 톱, 외포장, 생산실"/>
          <datalist id="staff-dept-list">
            {(deptOptions||[]).map(d=><option key={d} value={d}/>)}
          </datalist>
        </div>
        <div>
          <div className="aps-form-label">이름 *</div>
          <input className="aps-input" value={name} onChange={e=>setName(e.target.value)} maxLength={30} placeholder="홍길동" autoFocus/>
        </div>
        <div>
          <div className="aps-form-label">역할</div>
          <input className="aps-input" value={role} onChange={e=>setRole(e.target.value)} maxLength={30} placeholder="예: 조장, 라인장"/>
        </div>
        <div>
          <div className="aps-form-label">활성</div>
          <label style={{display:"flex",alignItems:"center",gap:8,padding:"9px 0"}}>
            <input type="checkbox" checked={active} onChange={e=>setActive(e.target.checked)} style={{width:16,height:16,cursor:"pointer"}}/>
            <span style={{fontSize:13,color:"var(--text)"}}>재직 중 (체크 해제 시 명단에서 숨김)</span>
          </label>
        </div>
        <div style={{gridColumn:"1 / -1"}}>
          <div className="aps-form-label">메모</div>
          <textarea className="aps-input" value={memo} onChange={e=>setMemo(e.target.value)} maxLength={300} rows={2} style={{resize:"vertical"}}/>
        </div>
      </div>
      {err&&<div className="aps-err">{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
        <button className="aps-btn aps-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="aps-btn aps-btn-primary" onClick={submit} disabled={loading}>{loading?"저장 중...":(isEdit?"수정":"추가")}</button>
      </div>
    </div>
  </div>;
}

// PNG 저장용 오프스크린 뷰 (사진과 동일 레이아웃, 라이트 톤 고정)
function ExportStaffView({title,dateStr,deptGroups,offIds,totalAvail}){
  const C={bg:"#ffffff",text:"#111827",hdr:"#111827",hdrFg:"#ffffff",border:"#111827",mutedBg:"#f8fafc",muted:"#6b7280"};
  const fmtDate=(s)=>{
    if(!s)return"";
    const[y,m,d]=s.split("-").map(Number);
    if(!y||!m||!d)return s;
    const dt=new Date(Date.UTC(y,m-1,d));
    const dow=DOW_LABEL[(dt.getUTCDay()+6)%7];
    return `${String(m).padStart(2,"0")}/${String(d).padStart(2,"0")} (${dow})`;
  };
  return <div style={{background:C.bg,color:C.text,fontFamily:"Pretendard, -apple-system, system-ui, sans-serif",padding:"20px 22px 16px",width:880,boxSizing:"border-box"}}>
    <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:14}}>
      <div style={{fontSize:22,fontWeight:800,letterSpacing:"-.01em"}}>{title||"생산 가용 인원 및 생산 계획"}</div>
      <div style={{fontSize:16,fontWeight:700,color:C.text}}>{fmtDate(dateStr)}</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(deptGroups.length||1,7)}, 1fr)`,gap:0,border:`1.5px solid ${C.border}`,borderRadius:0,overflow:"hidden"}}>
      {deptGroups.map((g,gi)=>{
        const availCnt=g.staff.filter(s=>!offIds.has(s.id)).length;
        return <div key={g.dept||gi} style={{borderRight:gi<deptGroups.length-1?`1.5px solid ${C.border}`:"none",display:"flex",flexDirection:"column",background:C.bg}}>
          <div style={{background:C.hdr,color:C.hdrFg,fontSize:13,fontWeight:800,textAlign:"center",padding:"7px 6px",letterSpacing:".02em",borderBottom:`1.5px solid ${C.border}`}}>{g.dept||"미지정"}</div>
          <div style={{flex:1,padding:"8px 8px",display:"flex",flexDirection:"column",gap:3,minHeight:140}}>
            {g.staff.length===0?
              <div style={{textAlign:"center",color:C.muted,fontSize:11,padding:"10px 0"}}>—</div>:
              g.staff.map(s=>{
                const off=offIds.has(s.id);
                return <div key={s.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:off?C.muted:C.text,textDecoration:off?"line-through":"none"}}>
                  <span style={{display:"inline-block",width:13,height:13,border:`1.5px solid ${off?C.muted:C.border}`,background:off?C.bg:C.hdr,boxSizing:"border-box",flexShrink:0,position:"relative"}}>
                    {!off&&<span style={{position:"absolute",left:1,top:-3,color:"#ffffff",fontSize:14,fontWeight:900,lineHeight:1}}>✓</span>}
                  </span>
                  <span style={{fontWeight:600}}>{s.name}</span>
                </div>;
              })
            }
          </div>
          <div style={{borderTop:`1.5px solid ${C.border}`,textAlign:"center",fontSize:12,fontWeight:700,padding:"5px 6px",color:C.text,background:C.mutedBg}}>{availCnt} 명</div>
        </div>;
      })}
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8,fontSize:11,color:C.muted}}>
      <span style={{fontWeight:700,letterSpacing:".06em"}}>STOCKPULSE · APS</span>
      <span style={{fontSize:14,fontWeight:800,color:C.text}}>총 인원: <span style={{color:"#06b6d4"}}>{totalAvail}</span> 명</span>
    </div>
  </div>;
}

function StaffTab({adminHash}){
  const[staff,setStaff]=useState([]);
  const[offIds,setOffIds]=useState(new Set()); // 휴무자 staff_id Set
  const[dateStr,setDateStr]=useState(todayStr());
  const[mode,setMode]=useState("daily");        // daily | master
  const[loading,setLoading]=useState(true);
  const[editing,setEditing]=useState(null);
  const[showForm,setShowForm]=useState(false);
  const[title,setTitle]=useState(loadStaffTitle());
  const[capturing,setCapturing]=useState(false);
  const exportRef=useRef(null);

  const loadStaff=useCallback(async()=>{
    try{
      const data=await rpc("aps_list_staff",{p_admin_hash:adminHash,p_only_active:false});
      setStaff(data||[]);
    }catch(e){console.error(e)}
  },[adminHash]);

  const loadAttendance=useCallback(async(d)=>{
    try{
      const data=await rpc("aps_get_attendance",{p_admin_hash:adminHash,p_date:d});
      setOffIds(new Set((data||[]).map(r=>r.staff_id)));
    }catch(e){console.error(e);setOffIds(new Set())}
  },[adminHash]);

  useEffect(()=>{
    (async()=>{setLoading(true);await Promise.all([loadStaff(),loadAttendance(dateStr)]);setLoading(false)})();
  },[loadStaff]);

  useEffect(()=>{loadAttendance(dateStr)},[dateStr,loadAttendance]);

  useEffect(()=>{saveStaffTitle(title)},[title]);

  const toggleAtt=async(s)=>{
    const wasOff=offIds.has(s.id);
    const next=new Set(offIds);
    if(wasOff)next.delete(s.id); else next.add(s.id);
    setOffIds(next); // 낙관적
    try{
      await rpc("aps_set_attendance",{
        p_admin_hash:adminHash,
        p_date:dateStr,
        p_staff_id:s.id,
        p_status:wasOff?"work":"off",
        p_memo:""
      });
    }catch(e){
      setOffIds(offIds); // 롤백
      alert("저장 실패: "+e.message);
    }
  };

  const delStaff=async(s)=>{
    if(!confirm(`직원 "${s.name}" 을(를) 삭제하시겠습니까?\n관련 휴무 기록도 함께 삭제됩니다.`))return;
    try{
      await rpc("aps_delete_staff",{p_admin_hash:adminHash,p_id:s.id});
      await loadStaff();
      await loadAttendance(dateStr);
    }catch(e){alert("삭제 실패: "+errMsg(e,{unauthorized:"인증 실패"}))}
  };

  const moveStaff=async(s,direction)=>{
    try{
      await rpc("aps_move_staff_order",{p_admin_hash:adminHash,p_id:s.id,p_direction:direction});
      await loadStaff();
    }catch(e){alert("순서 변경 실패: "+e.message)}
  };

  // 부서별 그룹핑 (활성 직원만 + 부서 첫 등장 순)
  const deptGroups=useMemo(()=>{
    const order=[];
    const map=new Map();
    staff.forEach(s=>{
      if(!s.active)return;
      const k=s.department||"";
      if(!map.has(k)){map.set(k,[]);order.push(k)}
      map.get(k).push(s);
    });
    return order.map(d=>({dept:d,staff:map.get(d)||[]}));
  },[staff]);

  // 마스터 모드용 — 비활성 포함 전체
  const allDeptGroups=useMemo(()=>{
    const order=[];
    const map=new Map();
    staff.forEach(s=>{
      const k=s.department||"";
      if(!map.has(k)){map.set(k,[]);order.push(k)}
      map.get(k).push(s);
    });
    return order.map(d=>({dept:d,staff:map.get(d)||[]}));
  },[staff]);

  const deptOptions=useMemo(()=>Array.from(new Set(staff.map(s=>s.department).filter(Boolean))),[staff]);

  const totalActive=deptGroups.reduce((sum,g)=>sum+g.staff.length,0);
  const totalAvail=deptGroups.reduce((sum,g)=>sum+g.staff.filter(s=>!offIds.has(s.id)).length,0);
  const totalOff=totalActive-totalAvail;

  const shiftDay=(n)=>{
    const[y,m,d]=dateStr.split("-").map(Number);
    const dt=new Date(Date.UTC(y,m-1,d));
    dt.setUTCDate(dt.getUTCDate()+n);
    setDateStr(dt.toISOString().slice(0,10));
  };

  const exportPng=async()=>{
    if(typeof window.html2canvas!=="function"){
      alert("이미지 저장 라이브러리(html2canvas)가 로드되지 않았습니다.");return;
    }
    setCapturing(true);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const target=exportRef.current;
    if(!target){setCapturing(false);alert("캡처할 영역이 없습니다");return}
    try{
      const canvas=await window.html2canvas(target,{backgroundColor:"#ffffff",scale:2,logging:false,useCORS:true});
      const link=document.createElement("a");
      link.download=`가용인원_${dateStr}.png`;
      link.href=canvas.toDataURL("image/png");
      document.body.appendChild(link);link.click();document.body.removeChild(link);
    }catch(e){console.error(e);alert("이미지 저장 실패: "+(e.message||e))}
    setCapturing(false);
  };

  if(loading)return <Loader/>;

  return <div>
    <div className="aps-toolbar">
      <div className="aps-view-toggle">
        <button className={mode==="daily"?"on":""} onClick={()=>setMode("daily")}>📋 일일 가용</button>
        <button className={mode==="master"?"on":""} onClick={()=>setMode("master")}>👥 직원 마스터</button>
      </div>
      <div style={{flex:1}}></div>
      {mode==="master"&&<button className="aps-btn aps-btn-primary" onClick={()=>{setEditing(null);setShowForm(true)}}>+ 직원 추가</button>}
    </div>

    {mode==="daily"?
      <>
        <div className="aps-staff-head">
          <input
            className="aps-input"
            value={title}
            onChange={e=>setTitle(e.target.value)}
            maxLength={50}
            placeholder="제목 (예: 4층 생산 가용 인원 및 생산 계획)"
            style={{flex:"1 1 220px",minWidth:200,maxWidth:420,fontSize:15,fontWeight:700}}/>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>shiftDay(-1)}>← 이전</button>
            <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>setDateStr(todayStr())}>오늘</button>
            <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>shiftDay(1)}>다음 →</button>
            <input type="date" value={dateStr} onChange={e=>setDateStr(e.target.value)}/>
          </div>
          <div className="date">{dateStr}</div>
          <button
            className="aps-btn aps-btn-primary aps-btn-sm"
            onClick={exportPng}
            disabled={capturing||totalActive===0}
            title="현재 가용 인원을 이미지로 저장">
            {capturing?"저장 중...":"📷 이미지 저장"}
          </button>
        </div>

        {deptGroups.length===0?
          <Empty emoji="👥" text='등록된 직원이 없습니다. "직원 마스터" 탭에서 추가하세요.'/>:
          <>
            <div className="aps-staff-grid">
              {deptGroups.map(g=>{
                const availCnt=g.staff.filter(s=>!offIds.has(s.id)).length;
                return <div key={g.dept||"none"} className="aps-staff-card">
                  <div className="aps-staff-card-hdr">{g.dept||"미지정"}</div>
                  <div className="aps-staff-card-body">
                    {g.staff.length===0?
                      <div className="aps-staff-empty">—</div>:
                      g.staff.map(s=>{
                        const off=offIds.has(s.id);
                        return <label key={s.id} className={"aps-staff-row"+(off?" off":"")}>
                          <input type="checkbox" checked={!off} onChange={()=>toggleAtt(s)} title={off?"출근으로 변경":"휴무로 변경"}/>
                          <span className="nm" title={s.role?s.name+" ("+s.role+")":s.name}>{s.name}</span>
                          {s.role&&<span className="role-mini">{s.role}</span>}
                        </label>;
                      })
                    }
                  </div>
                  <div className="aps-staff-card-ftr">{availCnt} 명</div>
                </div>;
              })}
            </div>
            <div className="aps-staff-summary">
              <span className="small">📋 체크: 출근 / 미체크: 휴무 — 클릭하여 토글</span>
              <div style={{flex:1}}></div>
              {totalOff>0&&<span className="small" style={{color:"#f59e0b"}}>휴무 {totalOff}명</span>}
              <span className="lbl">총 인원</span>
              <span className="num">{totalAvail}</span>
              <span className="small">/ {totalActive}명</span>
            </div>
          </>
        }

        {/* 오프스크린 PNG 캡처 영역 */}
        {capturing&&<div style={{position:"fixed",left:-99999,top:0,zIndex:-1,pointerEvents:"none"}}>
          <div ref={exportRef}>
            <ExportStaffView title={title} dateStr={dateStr} deptGroups={deptGroups} offIds={offIds} totalAvail={totalAvail}/>
          </div>
        </div>}
      </>
      :
      <>
        {allDeptGroups.length===0?
          <Empty emoji="👥" text="등록된 직원이 없습니다. 우측 상단에서 추가하세요."/>:
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {allDeptGroups.map(g=>(
              <div key={g.dept||"none"} style={{border:"1px solid var(--div2)",borderRadius:8,overflow:"hidden"}}>
                <div style={{padding:"8px 14px",background:"var(--card-bg)",borderBottom:"1px solid var(--div2)",fontSize:13,fontWeight:700,display:"flex",alignItems:"center",gap:8}}>
                  🏷 {g.dept||"미지정"}
                  <span style={{fontSize:11,color:"var(--muted)",fontWeight:500}}>{g.staff.length}명</span>
                </div>
                <table className="aps-table">
                  <thead><tr>
                    <th style={{width:70}}>순서</th>
                    <th>이름</th>
                    <th className="hide-mobile">역할</th>
                    <th className="hide-mobile">메모</th>
                    <th style={{width:60}}>활성</th>
                    <th className="center" style={{width:140}}>작업</th>
                  </tr></thead>
                  <tbody>
                    {g.staff.map((s,idx)=>{
                      const isFirst=idx===0;
                      const isLast=idx===g.staff.length-1;
                      return <tr key={s.id}>
                        <td>
                          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
                            <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>moveStaff(s,"up")} disabled={isFirst} style={{padding:"1px 6px",opacity:isFirst?0.3:1,minWidth:0}}>▲</button>
                            <span style={{fontSize:10,color:"var(--dimmer)"}}>#{s.id}</span>
                            <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>moveStaff(s,"down")} disabled={isLast} style={{padding:"1px 6px",opacity:isLast?0.3:1,minWidth:0}}>▼</button>
                          </div>
                        </td>
                        <td style={{fontWeight:600}}>{s.name}</td>
                        <td className="hide-mobile" style={{color:"var(--text-sub)",fontSize:12}}>{s.role||"-"}</td>
                        <td className="hide-mobile" style={{color:"var(--muted)",fontSize:12}}>{s.memo||"-"}</td>
                        <td>
                          {s.active?
                            <span className="aps-pill" style={{background:"rgba(34,197,94,0.14)",color:"#22c55e"}}>활성</span>:
                            <span className="aps-pill" style={{background:"rgba(148,163,184,0.18)",color:"#94a3b8"}}>비활성</span>}
                        </td>
                        <td className="center">
                          <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                            <button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={()=>{setEditing(s);setShowForm(true)}}>수정</button>
                            <button className="aps-btn aps-btn-danger aps-btn-sm" onClick={()=>delStaff(s)}>삭제</button>
                          </div>
                        </td>
                      </tr>;
                    })}
                  </tbody>
                </table>
              </div>
            ))}
          </div>
        }
      </>
    }

    {showForm&&<StaffForm
      adminHash={adminHash}
      initial={editing}
      deptOptions={deptOptions}
      onCancel={()=>setShowForm(false)}
      onSaved={async()=>{setShowForm(false);await loadStaff();await loadAttendance(dateStr)}}/>}
  </div>;
}

// ═══════════════════════════════════════════
// App (탭 네비게이션 + 로그인 게이트)
// ═══════════════════════════════════════════
const VALID_TABS=["items","lines","plans","staff","inventory","stats","sheet","sales"];
function getTabFromHash(){
  const h=(window.location.hash||"").replace(/^#/,"");
  return VALID_TABS.includes(h)?h:"items";
}

function App(){
  const[theme,setTheme]=useState(getStoredTheme());
  const[adminHash,setAdminHash]=useState(sessionStorage.getItem("sp-admin-hash")||"");
  const[adminInfo,setAdminInfo]=useState(null);
  const[checking,setChecking]=useState(!!sessionStorage.getItem("sp-admin-hash"));
  const[tab,setTab]=useState(getTabFromHash());

  useEffect(()=>{applyTheme(theme)},[theme]);
  const toggleTheme=()=>{const t=theme==="dark"?"light":"dark";setTheme(t);setStoredTheme(t);applyTheme(t)};

  // URL 해시 ↔ tab 동기화
  useEffect(()=>{
    const newHash="#"+tab;
    if(window.location.hash!==newHash)history.replaceState(null,"",newHash);
  },[tab]);
  useEffect(()=>{
    const fn=()=>setTab(getTabFromHash());
    window.addEventListener("hashchange",fn);
    return()=>window.removeEventListener("hashchange",fn);
  },[]);

  // 세션 복원
  useEffect(()=>{
    if(!adminHash){setChecking(false);return}
    (async()=>{
      try{
        const data=await rpc("admin_login",{p_hash:adminHash});
        if(data){setAdminInfo(data)}
        else{sessionStorage.removeItem("sp-admin-hash");setAdminHash("")}
      }catch(e){sessionStorage.removeItem("sp-admin-hash");setAdminHash("")}
      setChecking(false);
    })();
  },[]);

  const handleLogin=(hash,info)=>{
    sessionStorage.setItem("sp-admin-hash",hash);
    setAdminHash(hash);setAdminInfo(info);
  };
  const handleLogout=()=>{
    sessionStorage.removeItem("sp-admin-hash");
    setAdminHash("");setAdminInfo(null);
  };

  const loggedIn=!!adminHash&&!!adminInfo;

  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <header className="aps-header">
      <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
        <a href="index.html" style={{fontSize:"14px",fontWeight:700,color:"var(--text)",textDecoration:"none"}}>← STOCKPULSE</a>
        <span style={{fontSize:"13px",color:"var(--muted)"}}>|</span>
        <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
          <span style={{fontSize:"18px"}}>🏭</span>
          <span style={{fontWeight:700,fontSize:"15px"}}>APS 생산계획</span>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
        {loggedIn&&<span style={{fontSize:"12px",color:"var(--muted)"}}>👤 {adminInfo.nickname}</span>}
        {loggedIn&&<button className="aps-btn aps-btn-secondary aps-btn-sm" onClick={handleLogout}>로그아웃</button>}
        <button onClick={toggleTheme} style={{background:"none",border:"none",fontSize:"20px",cursor:"pointer"}}>{theme==="dark"?"☀️":"🌙"}</button>
      </div>
    </header>

    <div className="aps-shell" style={{flex:1}}>
      {checking?<Loader/>:!loggedIn?<LoginScreen onLogin={handleLogin}/>:<>
        <div className="aps-tabs">
          <button className={"aps-tab"+(tab==="items"?" active":"")} onClick={()=>setTab("items")}>📦 품목 / BOM</button>
          <button className={"aps-tab"+(tab==="lines"?" active":"")} onClick={()=>setTab("lines")}>🏭 라인</button>
          <button className={"aps-tab"+(tab==="plans"?" active":"")} onClick={()=>setTab("plans")}>📅 생산계획</button>
          <button className={"aps-tab"+(tab==="staff"?" active":"")} onClick={()=>setTab("staff")}>👥 인원</button>
          <button className={"aps-tab"+(tab==="inventory"?" active":"")} onClick={()=>setTab("inventory")}>📊 재고</button>
          <button className={"aps-tab"+(tab==="stats"?" active":"")} onClick={()=>setTab("stats")}>📈 통계</button>
          <button className={"aps-tab"+(tab==="sheet"?" active":"")} onClick={()=>setTab("sheet")}>📋 재고 시트</button>
          <button className={"aps-tab"+(tab==="sales"?" active":"")} onClick={()=>setTab("sales")}>💰 매출</button>
        </div>
        {tab==="items"&&<ItemsTab adminHash={adminHash}/>}
        {tab==="lines"&&<LinesTab adminHash={adminHash}/>}
        {tab==="plans"&&<PlansTab adminHash={adminHash}/>}
        {tab==="staff"&&<StaffTab adminHash={adminHash}/>}
        {tab==="inventory"&&<InventoryTab adminHash={adminHash}/>}
        {tab==="stats"&&<StatsTab adminHash={adminHash}/>}
        {tab==="sheet"&&<InventorySheetTab adminHash={adminHash}/>}
        {tab==="sales"&&<SalesTab adminHash={adminHash}/>}
      </>}
    </div>

    <footer style={{borderTop:"1px solid var(--div2)",maxWidth:1100,margin:"0 auto",padding:"14px 32px",color:"var(--dimmer)",fontSize:"12px",width:"100%",boxSizing:"border-box",textAlign:"center"}}>
      STOCKPULSE APS © 2026 — 관리자 전용 생산계획 시스템
    </footer>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
